name: validate
description: Validates a factory:review PR against all quality gates. Auto-merges on pass; labels factory:needs-fix on failure. Input — pr_number.

provider: claude
model: claude-haiku-4-5

nodes:
  - id: fetch-pr
    bash: |
      set -euo pipefail
      gh pr view $PR_NUMBER --json number,title,body,headRefName,files,additions,deletions > pr.json
      gh pr diff $PR_NUMBER > pr.diff
      cat pr.json
    timeout: 60000

  - id: check-pr-size
    bash: |
      TOTAL=$(cat pr.json | jq '.additions + .deletions')
      [ $TOTAL -gt 500 ] && echo "PR_TOO_LARGE: $TOTAL lines" && exit 1 || echo "SIZE_OK: $TOTAL"
    depends_on: [fetch-pr]
    timeout: 15000

  - id: check-protected-files
    bash: |
      FILES=$(cat pr.json | jq -r '.files[].path')
      for path in MISSION.md CLAUDE.md FACTORY_RULES.md ".archon/" ".github/workflows/factory-orchestrator" "api/src/auth/"; do
        echo "$FILES" | grep -q "$path" && echo "PROTECTED_VIOLATION: $path" && exit 1 || true
      done
      echo "PROTECTED_FILES_OK"
    depends_on: [fetch-pr]
    timeout: 15000

  - id: check-secrets
    bash: |
      grep -E "(ANTHROPIC_API_KEY|sk-ant-|STRIPE_SECRET|sk_live_|password\s*=\s*['\"])" pr.diff && echo "SECRET_DETECTED" && exit 1 || echo "NO_SECRETS"
    depends_on: [fetch-pr]
    timeout: 15000

  - id: run-tests
    bash: |
      set -euo pipefail
      BRANCH=$(cat pr.json | jq -r '.headRefName')
      git fetch origin "$BRANCH" && git checkout "$BRANCH"
      cd app && pnpm install --frozen-lockfile && pnpm lint && pnpm type-check && pnpm test:unit
      [ -d "../api" ] && cd ../api && pnpm install --frozen-lockfile && pnpm lint && pnpm type-check && pnpm test || true
    depends_on: [check-protected-files, check-secrets, check-pr-size]
    timeout: 600000

  - id: code-review
    command: validate-pr
    depends_on: [run-tests]
    model: claude-haiku-4-5
    maxBudgetUsd: 0.10
    context: fresh
    output_format:
      type: object
      properties:
        verdict:
          type: string
          enum: ["pass", "fail"]
        findings:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum: ["critical", "high", "medium", "low", "info"]
              description:
                type: string
        summary:
          type: string
      required: [verdict, findings, summary]

  - id: merge-or-fail
    bash: |
      VERDICT='$code-review.output.verdict'
      CRITICAL=$(echo '$code-review.output.findings' | jq '[.[] | select(.severity == "critical" or .severity == "high")] | length')
      ISSUE_NUM=$(cat pr.json | jq -r '.body' | grep -oP 'Closes #\K[0-9]+' | head -1)
      if [ "$VERDICT" = "pass" ] && [ "$CRITICAL" = "0" ]; then
        gh pr merge $PR_NUMBER --squash --auto
        [ -n "$ISSUE_NUM" ] && gh issue close $ISSUE_NUM || true
      else
        SUMMARY='$code-review.output.summary'
        gh pr comment $PR_NUMBER --body "Factory validation failed. **Summary:** $SUMMARY"
        gh pr edit $PR_NUMBER --remove-label "factory:review" --add-label "factory:needs-fix"
        [ -n "$ISSUE_NUM" ] && gh issue edit $ISSUE_NUM --remove-label "factory:in-progress" --add-label "factory:accepted" || true
      fi
    depends_on: [code-review]
    timeout: 60000
