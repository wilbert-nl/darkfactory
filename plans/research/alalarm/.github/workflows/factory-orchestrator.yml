name: Factory Orchestrator

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual trigger

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git identity
        run: |
          git config user.name "Alalarm Factory"
          git config user.email "factory@alalarm.app"

      - name: Install Archon CLI
        run: |
          curl -fsSL https://archon.sh/install.sh | sh
          echo "$HOME/.archon/bin" >> $GITHUB_PATH

      - name: Run Archon Orchestrator
        run: archon workflow run orchestrator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARCHON_DB_URL: ${{ secrets.ARCHON_DB_URL }}
