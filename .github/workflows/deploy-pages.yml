name: Sync apiapps to public repo

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push apiapps to wilbert-nl/apiapps
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone the public repo
          git clone https://x-access-token:${{ secrets.APIAPPS_DEPLOY_TOKEN }}@github.com/wilbert-nl/apiapps.git /tmp/apiapps-public

          # Sync contents (apiapps/* → root of public repo)
          rsync -av --delete --exclude='.git' apiapps/ /tmp/apiapps-public/

          # Commit and push if there are changes
          cd /tmp/apiapps-public
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "sync: update from darkfactory main"
            git push
          fi
