name: Sync apiapps to public repo

on:
  push:
    branches: [main]
    paths:
      - 'apiapps/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push apiapps to wilbert-nl/apiapps
        env:
          TOKEN: ${{ secrets.APIAPPS_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::APIAPPS_DEPLOY_TOKEN secret is not set or empty."
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone https://x-access-token:${TOKEN}@github.com/wilbert-nl/apiapps.git /tmp/apiapps-public

          rsync -av --delete --exclude='.git' apiapps/ /tmp/apiapps-public/

          cd /tmp/apiapps-public
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "sync: update from darkfactory main"
            git push
          fi
