services:
  postgres:
    image: postgres:15-alpine
    container_name: mt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mtadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtpassword}
      POSTGRES_DB: ${POSTGRES_DB:-multitenant}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtadmin} -d ${POSTGRES_DB:-multitenant}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mt_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: mt_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-9000}:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3000}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
