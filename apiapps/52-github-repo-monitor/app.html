<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Repo Monitor — Candidate Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Workbench · theme: Terminal · nav: N9 */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow-x: clip; }
body {
  height: 100%;
  overflow: hidden;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: oklch(78% 0.02 155); }

/* ── N9 Nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 52px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}

.nav-logo {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  flex-shrink: 0;
}
.nav-logo span { color: var(--color-accent); }

.nav-sep {
  width: 1px;
  height: 16px;
  background: var(--color-border);
  flex-shrink: 0;
}

.nav-label {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
}

.nav-rate {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-1) var(--space-3);
  white-space: nowrap;
}
.rate-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--color-success);
  flex-shrink: 0;
  animation: pulse 2.5s infinite;
}
.rate-dot.warn { background: var(--color-warn); }
.rate-dot.bad  { background: var(--color-danger); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.4; }
}

.nav-back {
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
  transition: color 0.15s var(--ease-out);
}
.nav-back:hover { color: var(--color-ink); }

/* ── App Shell ── */
.app-shell {
  display: grid;
  grid-template-columns: 300px 1fr;
  margin-top: 52px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--color-border);
  background: var(--color-paper-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-section {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}

.sidebar-section-title {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.08em;
  border-left: 2px solid var(--color-accent);
  padding-left: var(--space-2);
  color: var(--color-ink-muted);
  margin-bottom: var(--space-3);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--color-accent);
  color: var(--color-paper);
  font-size: 10px;
  font-weight: 700;
  border-radius: 10px;
  padding: 1px 6px;
  min-width: 18px;
  line-height: 1.4;
}

/* Search input */
.search-row {
  display: flex;
  gap: var(--space-2);
}

.input-username {
  flex: 1;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  transition: border-color 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out);
}
.input-username:focus {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px oklch(72% 0.20 142 / 0.12);
}
.input-username::placeholder { color: var(--color-ink-muted); }

.btn-search {
  padding: var(--space-2) var(--space-4);
  background: var(--color-accent);
  color: var(--color-paper);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: opacity 0.15s var(--ease-out), transform 0.12s var(--ease-out);
  white-space: nowrap;
  flex-shrink: 0;
}
.btn-search:hover { opacity: 0.88; }
.btn-search:active { transform: scale(0.97); }
.btn-search:disabled { opacity: 0.45; cursor: not-allowed; }

/* Example chips */
.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-3);
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 2px var(--space-2);
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  cursor: pointer;
  transition: background 0.12s var(--ease-out), border-color 0.12s var(--ease-out), color 0.12s var(--ease-out);
  font-family: var(--font-body);
}
.chip:hover {
  background: var(--color-accent-subtle);
  border-color: var(--color-accent-line);
  color: var(--color-accent);
}

/* Watchlist */
.watchlist-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-2) 0;
}

.watchlist-empty {
  padding: var(--space-8) var(--space-4);
  text-align: center;
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  line-height: 1.7;
}

.watch-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-4);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.12s var(--ease-out), border-color 0.12s var(--ease-out);
}
.watch-item:hover { background: oklch(14% 0.010 230); }
.watch-item.active {
  background: var(--color-accent-subtle);
  border-left-color: var(--color-accent);
}

.watch-item-info { flex: 1; min-width: 0; }
.watch-item-name {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.watch-item-meta {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  margin-top: 1px;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.btn-remove {
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  color: var(--color-ink-muted);
  cursor: pointer;
  border-radius: var(--radius-sm);
  font-size: var(--text-base);
  line-height: 1;
  flex-shrink: 0;
  transition: color 0.12s var(--ease-out), background 0.12s var(--ease-out);
  opacity: 0;
}
.watch-item:hover .btn-remove { opacity: 1; }
.btn-remove:hover { color: var(--color-danger); background: oklch(55% 0.20 25 / 0.08); }

/* ── Main Panel ── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-paper);
  position: relative;
}

/* ── Empty State ── */
.main-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-16);
  text-align: center;
  gap: var(--space-4);
}
.main-empty-icon {
  font-size: 3rem;
  line-height: 1;
  opacity: 0.4;
}
.main-empty-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
}
.main-empty-sub {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  max-width: 320px;
  line-height: 1.65;
}

/* ── User Profile ── */
#profile-panel {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}
#profile-panel.visible { display: flex; }

.profile-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6) var(--space-8);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

/* Profile header card */
.profile-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  display: flex;
  gap: var(--space-5);
  align-items: flex-start;
}

.profile-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 2px solid var(--color-border);
  overflow: hidden;
  flex-shrink: 0;
  background: var(--color-paper-2);
}
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

.profile-body { flex: 1; min-width: 0; }

.profile-name {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.profile-login {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  margin-top: var(--space-1);
}

.profile-bio {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  margin-top: var(--space-2);
  line-height: 1.55;
}

.profile-meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin-top: var(--space-3);
}

.profile-meta-item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}

/* Stats row */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-3);
  margin-top: var(--space-4);
}

.stat-box {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  text-align: center;
}

.stat-val {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  line-height: 1.1;
}

.stat-label {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  margin-top: 2px;
  font-weight: 500;
}

.btn-gh {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-4);
  padding: var(--space-2) var(--space-4);
  background: var(--color-ink);
  color: var(--color-paper);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  border-radius: var(--radius-md);
  transition: opacity 0.15s var(--ease-out);
  text-decoration: none;
}
.btn-gh:hover { opacity: 0.82; }

/* Repos controls */
.repos-controls {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  flex-wrap: wrap;
}

.section-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.08em;
  border-left: 2px solid var(--color-accent);
  padding-left: var(--space-2);
  color: var(--color-ink-muted);
  flex-shrink: 0;
}

.select-sm {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  color: var(--color-ink);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-2);
  cursor: pointer;
  transition: border-color 0.12s var(--ease-out);
}
.select-sm:focus { outline: none; border-color: var(--color-accent); }

.filter-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-left: auto;
}

.filter-label {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  white-space: nowrap;
}

input[type="range"] {
  accent-color: var(--color-accent);
  cursor: pointer;
  width: 80px;
}

.filter-val {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-accent);
  min-width: 30px;
}

/* Repos grid */
.repos-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-4);
}

.repo-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  transition: border-color 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out);
  animation: fadeUp 0.2s var(--ease-out) both;
}
.repo-card:hover {
  border-color: var(--color-accent-line);
  box-shadow: 0 4px 16px oklch(72% 0.20 142 / 0.08);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.repo-name-link {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-accent);
  transition: color 0.12s var(--ease-out);
  line-height: 1.3;
}
.repo-name-link:hover { color: oklch(58% 0.16 142); text-decoration: underline; text-underline-offset: 2px; }

.repo-desc {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  flex: 1;
}

.repo-lang {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}

.lang-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--color-border);
}

.repo-stats {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}

.repo-stat {
  display: flex;
  align-items: center;
  gap: 3px;
}

.repo-topics {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
}

.topic-chip {
  display: inline-block;
  background: var(--color-accent-subtle);
  color: var(--color-accent);
  border-radius: var(--radius-sm);
  padding: 1px 6px;
  font-size: 10px;
  font-weight: 500;
}

.repo-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: var(--space-2);
  border-top: 1px solid var(--color-border);
}

.repo-updated {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}

.btn-bookmark {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px var(--space-2);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 600;
  color: var(--color-ink-muted);
  cursor: pointer;
  transition: background 0.12s var(--ease-out), border-color 0.12s var(--ease-out), color 0.12s var(--ease-out);
}
.btn-bookmark:hover {
  background: var(--color-accent-subtle);
  border-color: var(--color-accent-line);
  color: var(--color-accent);
}
.btn-bookmark.bookmarked {
  background: var(--color-accent-subtle);
  border-color: var(--color-accent-line);
  color: var(--color-accent);
}

.btn-detail {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px var(--space-2);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 600;
  color: var(--color-ink-muted);
  cursor: pointer;
  transition: background 0.12s var(--ease-out), border-color 0.12s var(--ease-out), color 0.12s var(--ease-out);
}
.btn-detail:hover {
  background: var(--color-paper-2);
  border-color: var(--color-ink-muted);
  color: var(--color-ink);
}

/* ── Repo Detail Panel ── */
.detail-panel {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: min(480px, 100%);
  background: var(--color-paper);
  border-left: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 100;
  transform: translateX(100%);
  transition: transform 0.25s var(--ease-out);
  box-shadow: -8px 0 32px oklch(88% 0.008 230 / 0.08);
}
.detail-panel.open { transform: translateX(0); }

.detail-head {
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-shrink: 0;
  background: var(--color-paper-2);
}

.detail-title {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.btn-close {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-ink-muted);
  cursor: pointer;
  font-size: var(--text-lg);
  line-height: 1;
  transition: background 0.12s var(--ease-out), color 0.12s var(--ease-out);
  flex-shrink: 0;
}
.btn-close:hover { background: var(--color-paper-2); color: var(--color-ink); }

.detail-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

/* Detail sub-sections */
.detail-section-title {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.08em;
  border-left: 2px solid var(--color-accent);
  padding-left: var(--space-2);
  color: var(--color-ink-muted);
  margin-bottom: var(--space-3);
}

.detail-stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-3);
}

.detail-stat-box {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3);
}

.detail-stat-val {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
}

.detail-stat-label {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  margin-top: 2px;
}

/* Languages bar */
.lang-bar {
  display: flex;
  height: 8px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  gap: 1px;
}

.lang-segment {
  height: 100%;
  transition: flex 0.4s var(--ease-out);
}

.lang-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin-top: var(--space-2);
}

.lang-legend-item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}

.lang-legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Commits timeline */
.commit-list {
  display: flex;
  flex-direction: column;
}

.commit-item {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3) 0;
  border-bottom: 1px solid var(--color-border);
}
.commit-item:last-child { border-bottom: none; }

.commit-sha {
  font-family: monospace;
  font-size: var(--text-xs);
  color: var(--color-accent);
  background: var(--color-accent-subtle);
  border-radius: var(--radius-sm);
  padding: 1px 5px;
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: 2px;
  white-space: nowrap;
}

.commit-body { flex: 1; min-width: 0; }

.commit-msg {
  font-size: var(--text-xs);
  color: var(--color-ink);
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.commit-meta {
  font-size: 10px;
  color: var(--color-ink-muted);
  margin-top: 2px;
  display: flex;
  gap: var(--space-2);
}

/* Releases */
.release-item {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-3);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  margin-bottom: var(--space-2);
}

.release-tag {
  font-family: monospace;
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-success);
  background: oklch(55% 0.14 155 / 0.10);
  border-radius: var(--radius-sm);
  padding: 2px 6px;
  flex-shrink: 0;
  white-space: nowrap;
}

.release-body { flex: 1; min-width: 0; }

.release-name {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-ink);
  margin-bottom: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.release-date {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}

/* Detail action bar */
.detail-bar {
  padding: var(--space-4) var(--space-5);
  border-top: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-shrink: 0;
  background: var(--color-paper-2);
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  padding: var(--space-2) var(--space-4);
  background: var(--color-ink);
  color: var(--color-paper);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: opacity 0.15s var(--ease-out);
  text-decoration: none;
}
.btn-primary:hover { opacity: 0.82; }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-2) var(--space-4);
  background: transparent;
  color: var(--color-ink-muted);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background 0.12s var(--ease-out), border-color 0.12s var(--ease-out), color 0.12s var(--ease-out);
}
.btn-secondary:hover {
  background: var(--color-accent-subtle);
  border-color: var(--color-accent-line);
  color: var(--color-accent);
}
.btn-secondary.bookmarked {
  background: var(--color-accent-subtle);
  border-color: var(--color-accent-line);
  color: var(--color-accent);
}

/* ── Loading overlay ── */
.loading-overlay {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-4);
  padding: var(--space-12) var(--space-4);
  color: var(--color-ink-muted);
  font-size: var(--text-sm);
}

.spinner {
  width: 24px;
  height: 24px;
  border: 2px solid var(--color-border);
  border-top-color: var(--color-accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Error message ── */
.error-msg {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  background: oklch(55% 0.20 25 / 0.06);
  border: 1px solid oklch(55% 0.20 25 / 0.2);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  font-size: var(--text-sm);
  color: var(--color-danger);
  line-height: 1.55;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 600;
  background: var(--color-ink);
  color: var(--color-paper);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px oklch(88% 0.008 230 / 0.20);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s var(--ease-out), transform 0.2s var(--ease-out);
  pointer-events: none;
  max-width: 340px;
  line-height: 1.4;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--color-success); }
.toast.error   { background: var(--color-danger); }

/* ── Skeleton ── */
.skeleton {
  background: linear-gradient(90deg,
    var(--color-paper-2) 25%,
    var(--color-paper-3) 50%,
    var(--color-paper-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius-sm);
}
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ── Mobile ── */
@media (max-width: 768px) {
  html, body { overflow: auto; height: auto; }

  .app-shell {
    grid-template-columns: 1fr;
    height: auto;
    overflow: visible;
  }

  .sidebar {
    border-right: none;
    border-bottom: 1px solid var(--color-border);
    max-height: 50vh;
    overflow: hidden;
  }

  .main {
    overflow: visible;
    min-height: 60vh;
  }

  #profile-panel.visible {
    display: flex;
    overflow: visible;
  }

  .profile-scroll { overflow: visible; padding: var(--space-4); }

  .repos-grid { grid-template-columns: 1fr; }

  .detail-panel {
    width: 100%;
    top: 52px;
    z-index: 300;
  }

  .profile-card { flex-direction: column; }
  .stats-row { grid-template-columns: repeat(3, 1fr); }
  .nav-label { display: none; }
}

@media (max-width: 414px) {
  .stats-row { grid-template-columns: 1fr 1fr; }
  .profile-scroll { padding: var(--space-3); }
}

@media (prefers-reduced-motion: reduce) {
  .repo-card { animation: none; }
  .detail-panel { transition: none; }
}
</style>

<script>
'use strict';
// ── Hallmark · macrostructure: Workbench · theme: Garden · nav: N9 ──

// ── Constants ──────────────────────────────────────────────────────────────
const GH = 'https://api.github.com';
const LS_WATCHED = 'ghm-watched'; // [{ owner, repo, stars, updated }]

// Language color map (GitHub's colors, subset)
const LANG_COLORS = {
  JavaScript: '#f7df1e', TypeScript: '#3178c6', Python: '#3572A5',
  Rust: '#dea584', Go: '#00add8', Java: '#b07219', C: '#555555',
  'C++': '#f34b7d', Ruby: '#701516', PHP: '#4f5d95', Swift: '#ffac45',
  Kotlin: '#a97bff', Dart: '#00b4ab', CSS: '#563d7c', HTML: '#e34c26',
  Shell: '#89e051', Vue: '#41b883', Lua: '#000080', Scala: '#c22d40',
  Haskell: '#5e5086', 'C#': '#178600', Elixir: '#6e4a7e', R: '#198ce7',
};

function langColor(lang) {
  return LANG_COLORS[lang] || '#adb5bd';
}

// ── State ──────────────────────────────────────────────────────────────────
let rateRemaining = 60;
let rateLimit = 60;
let currentUser = null;   // { user, repos }
let currentDetail = null; // repo full object
let sortBy = 'updated';
let minStars = 0;
let watched = loadWatched();

// ── Utilities ──────────────────────────────────────────────────────────────
function timeAgo(date) {
  const diff = Date.now() - new Date(date).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 30) return `${days}d ago`;
  const months = Math.floor(days / 30);
  if (months < 12) return `${months}mo ago`;
  return `${Math.floor(months / 12)}y ago`;
}

function fmtNum(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1) + 'k';
  return String(n ?? 0);
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3400);
}

// ── Rate Limit Badge ───────────────────────────────────────────────────────
function updateRateBadge() {
  const dot = document.getElementById('rate-dot');
  const txt = document.getElementById('rate-text');
  txt.textContent = `${rateRemaining}/${rateLimit} API`;
  const pct = rateRemaining / rateLimit;
  dot.className = 'rate-dot' + (pct < 0.1 ? ' bad' : pct < 0.3 ? ' warn' : '');
}

// ── GitHub API fetch ───────────────────────────────────────────────────────
async function ghFetch(path) {
  const res = await fetch(GH + path);
  const rem = res.headers.get('X-RateLimit-Remaining');
  const lim = res.headers.get('X-RateLimit-Limit');
  if (rem !== null) {
    rateRemaining = parseInt(rem, 10);
    rateLimit = parseInt(lim, 10) || 60;
    updateRateBadge();
  }
  if (!res.ok) {
    if (res.status === 404) throw new Error('NOT_FOUND');
    if (res.status === 403 || res.status === 429) throw new Error('RATE_LIMIT');
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return res.json();
}

// ── Watchlist ──────────────────────────────────────────────────────────────
function loadWatched() {
  try { return JSON.parse(localStorage.getItem(LS_WATCHED) || '[]'); }
  catch { return []; }
}

function saveWatched() {
  localStorage.setItem(LS_WATCHED, JSON.stringify(watched));
}

function isWatched(owner, repo) {
  return watched.some(w => w.owner === owner && w.repo === repo);
}

function toggleWatch(owner, repo, stars, updated) {
  if (isWatched(owner, repo)) {
    watched = watched.filter(w => !(w.owner === owner && w.repo === repo));
    toast(`Removed ${owner}/${repo} from watchlist`);
  } else {
    watched.unshift({ owner, repo, stars: stars ?? 0, updated: updated ?? new Date().toISOString() });
    toast(`Bookmarked ${owner}/${repo}`, 'success');
  }
  saveWatched();
  renderWatchlist();
  // Refresh bookmark buttons in repo grid
  if (currentUser) renderRepoGrid(currentUser.repos);
  // Refresh detail panel bookmark button
  if (currentDetail) updateDetailBookmarkBtn(owner, repo);
}

function renderWatchlist() {
  const container = document.getElementById('watchlist');
  const empty = document.getElementById('watchlist-empty');
  const countEl = document.getElementById('watch-count');

  countEl.textContent = watched.length;

  if (watched.length === 0) {
    container.innerHTML = '';
    container.appendChild(empty);
    empty.style.display = '';
    return;
  }

  empty.style.display = 'none';
  container.innerHTML = watched.map(w => `
    <div class="watch-item ${currentDetail && currentDetail.owner === w.owner && currentDetail.repo === w.repo ? 'active' : ''}"
         role="listitem"
         data-owner="${esc(w.owner)}" data-repo="${esc(w.repo)}"
         tabindex="0"
         aria-label="View ${w.owner}/${w.repo}">
      <div class="watch-item-info">
        <div class="watch-item-name">${esc(w.owner)}/${esc(w.repo)}</div>
        <div class="watch-item-meta">
          <span>⭐ ${fmtNum(w.stars)}</span>
          <span>· ${timeAgo(w.updated)}</span>
        </div>
      </div>
      <button class="btn-remove" data-owner="${esc(w.owner)}" data-repo="${esc(w.repo)}" aria-label="Remove ${w.owner}/${w.repo}">×</button>
    </div>
  `).join('');

  // Event delegation
  container.querySelectorAll('.watch-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.classList.contains('btn-remove')) return;
      const { owner, repo } = el.dataset;
      loadRepoDetail(owner, repo);
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (!e.target.classList.contains('btn-remove')) {
          const { owner, repo } = el.dataset;
          loadRepoDetail(owner, repo);
        }
      }
    });
  });

  container.querySelectorAll('.btn-remove').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const { owner, repo } = btn.dataset;
      watched = watched.filter(w => !(w.owner === owner && w.repo === repo));
      saveWatched();
      renderWatchlist();
      if (currentUser) renderRepoGrid(currentUser.repos);
      toast(`Removed ${owner}/${repo}`);
    });
  });
}

// ── Search user ────────────────────────────────────────────────────────────
async function searchUser(username) {
  username = username.trim().toLowerCase();
  if (!username) return;

  const errEl = document.getElementById('search-error');
  const btn = document.getElementById('btn-search');
  errEl.style.display = 'none';

  btn.disabled = true;
  btn.textContent = '…';

  document.getElementById('main-empty').style.display = 'none';
  document.getElementById('profile-panel').classList.add('visible');
  document.getElementById('profile-card-container').innerHTML = skeletonProfile();
  document.getElementById('repos-section').style.display = 'none';
  document.getElementById('profile-error').style.display = 'none';
  closeDetail();

  try {
    const [user, repos] = await Promise.all([
      ghFetch(`/users/${username}`),
      ghFetch(`/users/${username}/repos?sort=updated&per_page=30`),
    ]);

    currentUser = { user, repos };
    renderProfile(user);
    renderRepoGrid(repos);
    document.getElementById('repos-section').style.display = 'block';

  } catch (e) {
    currentUser = null;
    document.getElementById('profile-card-container').innerHTML = '';
    const errPanel = document.getElementById('profile-error');
    if (e.message === 'NOT_FOUND') {
      errPanel.innerHTML = errorHtml(`User "@${esc(username)}" was not found on GitHub. Check the spelling and try again.`);
      errEl.textContent = `User "${username}" not found.`;
      errEl.style.display = 'block';
    } else if (e.message === 'RATE_LIMIT') {
      errPanel.innerHTML = errorHtml("You've hit GitHub's rate limit (60 req/hr unauthenticated). Wait a minute or add a personal access token in your browser's fetch headers.");
    } else {
      errPanel.innerHTML = errorHtml(`Unexpected error: ${esc(e.message)}`);
    }
    errPanel.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Search';
  }
}

function errorHtml(msg) {
  return `<div class="error-msg"><span style="flex-shrink:0;font-size:1.1rem;">⚠️</span><span>${msg}</span></div>`;
}

function skeletonProfile() {
  return `
    <div class="profile-card">
      <div class="profile-avatar" style="background:var(--color-border);"></div>
      <div class="profile-body" style="display:flex;flex-direction:column;gap:var(--space-2);flex:1">
        <div class="skeleton" style="height:28px;width:55%;"></div>
        <div class="skeleton" style="height:14px;width:30%;"></div>
        <div class="skeleton" style="height:14px;width:80%;margin-top:4px;"></div>
      </div>
    </div>`;
}

// ── Render profile card ────────────────────────────────────────────────────
function renderProfile(user) {
  const html = `
    <div class="profile-card">
      <div class="profile-avatar">
        <img src="${esc(user.avatar_url)}" alt="${esc(user.login)}" loading="lazy" width="80" height="80">
      </div>
      <div class="profile-body">
        <div class="profile-name">${esc(user.name || user.login)}</div>
        <div class="profile-login">@${esc(user.login)}</div>
        ${user.bio ? `<div class="profile-bio">${esc(user.bio)}</div>` : ''}
        <div class="profile-meta">
          ${user.location ? `<div class="profile-meta-item">📍 ${esc(user.location)}</div>` : ''}
          ${user.company ? `<div class="profile-meta-item">🏢 ${esc(user.company.replace(/^@/, ''))}</div>` : ''}
          ${user.blog ? `<div class="profile-meta-item">🔗 <a href="${esc(user.blog.startsWith('http') ? user.blog : 'https://' + user.blog)}" target="_blank" rel="noopener noreferrer" style="color:var(--color-accent);">${esc(user.blog)}</a></div>` : ''}
        </div>
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-val">${fmtNum(user.public_repos)}</div>
            <div class="stat-label">Public Repos</div>
          </div>
          <div class="stat-box">
            <div class="stat-val">${fmtNum(user.followers)}</div>
            <div class="stat-label">Followers</div>
          </div>
          <div class="stat-box">
            <div class="stat-val">${fmtNum(user.following)}</div>
            <div class="stat-label">Following</div>
          </div>
        </div>
        <a href="https://github.com/${esc(user.login)}" target="_blank" rel="noopener noreferrer" class="btn-gh">
          View on GitHub ↗
        </a>
      </div>
    </div>`;
  document.getElementById('profile-card-container').innerHTML = html;
}

// ── Sort & filter repos ────────────────────────────────────────────────────
function sortedRepos(repos) {
  const filtered = repos.filter(r => r.stargazers_count >= minStars);
  return [...filtered].sort((a, b) => {
    if (sortBy === 'stars') return b.stargazers_count - a.stargazers_count;
    if (sortBy === 'forks') return b.forks_count - a.forks_count;
    if (sortBy === 'name') return a.name.localeCompare(b.name);
    // updated (default)
    return new Date(b.updated_at) - new Date(a.updated_at);
  });
}

// ── Render repo grid ───────────────────────────────────────────────────────
function renderRepoGrid(repos) {
  const grid = document.getElementById('repos-grid');
  const sorted = sortedRepos(repos);

  if (!sorted.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;padding:var(--space-8);text-align:center;color:var(--color-ink-muted);font-size:var(--text-sm);">No repositories match the current filter.</div>`;
    return;
  }

  grid.innerHTML = sorted.map((r, i) => repoCardHtml(r, i)).join('');

  // Wire up bookmark + detail buttons
  grid.querySelectorAll('.btn-bookmark').forEach(btn => {
    btn.addEventListener('click', () => {
      const { owner, repo, stars, updated } = btn.dataset;
      toggleWatch(owner, repo, Number(stars), updated);
    });
  });
  grid.querySelectorAll('.btn-detail').forEach(btn => {
    btn.addEventListener('click', () => {
      const { owner, repo } = btn.dataset;
      loadRepoDetail(owner, repo);
    });
  });
}

function repoCardHtml(r, idx) {
  const owner = r.owner?.login ?? currentUser?.user.login ?? '';
  const bookmarked = isWatched(owner, r.name);
  const topics = (r.topics || []).slice(0, 3);

  return `
    <div class="repo-card" style="animation-delay:${idx * 0.04}s">
      <a class="repo-name-link"
         href="${esc(r.html_url)}" target="_blank" rel="noopener noreferrer"
         aria-label="${esc(r.name)} repository on GitHub">${esc(r.name)}</a>
      <p class="repo-desc">${r.description ? esc(r.description) : '<em style="opacity:0.5">No description</em>'}</p>
      ${r.language ? `
        <div class="repo-lang">
          <span class="lang-dot" style="background:${langColor(r.language)}"></span>
          ${esc(r.language)}
        </div>` : ''}
      <div class="repo-stats">
        <span class="repo-stat" title="Stars">⭐ ${fmtNum(r.stargazers_count)}</span>
        <span class="repo-stat" title="Forks">🍴 ${fmtNum(r.forks_count)}</span>
        <span class="repo-stat" title="Open issues">⚠️ ${fmtNum(r.open_issues_count)}</span>
      </div>
      ${topics.length ? `<div class="repo-topics">${topics.map(t => `<span class="topic-chip">${esc(t)}</span>`).join('')}</div>` : ''}
      <div class="repo-footer">
        <span class="repo-updated">Updated ${timeAgo(r.updated_at)}</span>
        <div style="display:flex;gap:var(--space-1);">
          <button class="btn-detail" data-owner="${esc(owner)}" data-repo="${esc(r.name)}" aria-label="View ${r.name} details">Details</button>
          <button class="btn-bookmark ${bookmarked ? 'bookmarked' : ''}"
                  data-owner="${esc(owner)}"
                  data-repo="${esc(r.name)}"
                  data-stars="${r.stargazers_count}"
                  data-updated="${esc(r.updated_at)}"
                  aria-label="${bookmarked ? 'Remove bookmark' : 'Bookmark'} ${r.name}">
            ${bookmarked ? '★ Saved' : '☆ Bookmark'}
          </button>
        </div>
      </div>
    </div>`;
}

// ── Repo Detail Panel ──────────────────────────────────────────────────────
async function loadRepoDetail(owner, repo) {
  const panel = document.getElementById('detail-panel');
  const scroll = document.getElementById('detail-scroll');
  const titleEl = document.getElementById('detail-title');
  const bar = document.getElementById('detail-bar');

  titleEl.textContent = `${owner}/${repo}`;
  scroll.innerHTML = `<div class="loading-overlay"><div class="spinner"></div>Loading…</div>`;
  bar.innerHTML = '';
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');

  // Highlight in watchlist
  currentDetail = { owner, repo };
  renderWatchlist();

  try {
    const [repoData, commits, languages, releases] = await Promise.allSettled([
      ghFetch(`/repos/${owner}/${repo}`),
      ghFetch(`/repos/${owner}/${repo}/commits?per_page=10`),
      ghFetch(`/repos/${owner}/${repo}/languages`),
      ghFetch(`/repos/${owner}/${repo}/releases?per_page=5`),
    ]);

    const rd   = repoData.status === 'fulfilled'  ? repoData.value  : null;
    const cms  = commits.status === 'fulfilled'   ? commits.value   : [];
    const langs= languages.status === 'fulfilled' ? languages.value : {};
    const rels = releases.status === 'fulfilled'  ? releases.value  : [];

    if (!rd) {
      scroll.innerHTML = errorHtml('Could not load repository data.');
      return;
    }

    // Update currentDetail with star/updated for potential bookmark
    currentDetail = { owner, repo, stars: rd.stargazers_count, updated: rd.updated_at };

    scroll.innerHTML = buildDetailHtml(rd, cms, langs, rels);
    bar.innerHTML = buildDetailBar(owner, repo, rd);

    // Wire bar buttons
    bar.querySelector('.btn-secondary')?.addEventListener('click', () => {
      toggleWatch(owner, repo, rd.stargazers_count, rd.updated_at);
      updateDetailBookmarkBtn(owner, repo);
    });

  } catch (e) {
    if (e.message === 'RATE_LIMIT') {
      scroll.innerHTML = errorHtml("You've hit GitHub's rate limit — try again in a moment, or add a personal token.");
    } else {
      scroll.innerHTML = errorHtml(`Error loading repository: ${esc(e.message)}`);
    }
    bar.innerHTML = '';
  }
}

function buildDetailHtml(rd, cms, langs, rels) {
  const owner = rd.owner?.login ?? '';
  const totalLangBytes = Object.values(langs).reduce((s, v) => s + v, 0);
  const license = rd.license?.name ?? null;

  let html = '';

  // Description + license
  html += `<div>`;
  if (rd.description) {
    html += `<p style="font-size:var(--text-sm);color:var(--color-ink);line-height:1.6;">${esc(rd.description)}</p>`;
  }
  if (license) {
    html += `<p style="font-size:var(--text-xs);color:var(--color-ink-muted);margin-top:var(--space-2);">License: ${esc(license)}</p>`;
  }
  html += `</div>`;

  // Stats
  html += `
    <div>
      <div class="detail-section-title">Stats</div>
      <div class="detail-stats-grid">
        <div class="detail-stat-box">
          <div class="detail-stat-val">⭐ ${fmtNum(rd.stargazers_count)}</div>
          <div class="detail-stat-label">Stars</div>
        </div>
        <div class="detail-stat-box">
          <div class="detail-stat-val">🍴 ${fmtNum(rd.forks_count)}</div>
          <div class="detail-stat-label">Forks</div>
        </div>
        <div class="detail-stat-box">
          <div class="detail-stat-val">⚠️ ${fmtNum(rd.open_issues_count)}</div>
          <div class="detail-stat-label">Open Issues</div>
        </div>
        <div class="detail-stat-box">
          <div class="detail-stat-val">👁 ${fmtNum(rd.watchers_count)}</div>
          <div class="detail-stat-label">Watchers</div>
        </div>
      </div>
    </div>`;

  // Languages bar
  if (totalLangBytes > 0) {
    const langEntries = Object.entries(langs).sort((a, b) => b[1] - a[1]);
    html += `
      <div>
        <div class="detail-section-title">Languages</div>
        <div class="lang-bar">
          ${langEntries.map(([lang, bytes]) => {
            const pct = (bytes / totalLangBytes * 100).toFixed(1);
            return `<div class="lang-segment" style="flex:${pct};background:${langColor(lang)};" title="${esc(lang)} ${pct}%"></div>`;
          }).join('')}
        </div>
        <div class="lang-legend">
          ${langEntries.slice(0, 6).map(([lang, bytes]) => {
            const pct = (bytes / totalLangBytes * 100).toFixed(1);
            return `
              <div class="lang-legend-item">
                <div class="lang-legend-dot" style="background:${langColor(lang)};"></div>
                ${esc(lang)} <span style="opacity:0.6">${pct}%</span>
              </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  // Commits
  if (cms.length > 0) {
    html += `
      <div>
        <div class="detail-section-title">Recent Commits</div>
        <div class="commit-list">
          ${cms.map(c => `
            <div class="commit-item">
              <a href="${esc(c.html_url)}" target="_blank" rel="noopener noreferrer" class="commit-sha" aria-label="View commit">${esc(c.sha.slice(0, 7))}</a>
              <div class="commit-body">
                <div class="commit-msg">${esc(c.commit.message.split('\n')[0].slice(0, 90))}</div>
                <div class="commit-meta">
                  <span>${esc(c.commit.author.name)}</span>
                  <span>·</span>
                  <span>${timeAgo(c.commit.author.date)}</span>
                </div>
              </div>
            </div>`).join('')}
        </div>
      </div>`;
  }

  // Releases
  const latestRels = rels.slice(0, 3);
  if (latestRels.length > 0) {
    html += `
      <div>
        <div class="detail-section-title">Latest Releases</div>
        ${latestRels.map(r => `
          <div class="release-item">
            <span class="release-tag">${esc(r.tag_name)}</span>
            <div class="release-body">
              <div class="release-name">${esc(r.name || r.tag_name)}</div>
              <div class="release-date">${r.published_at ? timeAgo(r.published_at) : 'Unknown date'} · <a href="${esc(r.html_url)}" target="_blank" rel="noopener noreferrer" style="color:var(--color-accent)">View on GitHub ↗</a></div>
            </div>
          </div>`).join('')}
      </div>`;
  }

  // Topics
  const topics = rd.topics || [];
  if (topics.length > 0) {
    html += `
      <div>
        <div class="detail-section-title">Topics</div>
        <div class="repo-topics" style="gap:var(--space-2);">
          ${topics.map(t => `<span class="topic-chip" style="font-size:var(--text-xs);padding:3px 8px;">${esc(t)}</span>`).join('')}
        </div>
      </div>`;
  }

  return html;
}

function buildDetailBar(owner, repo, rd) {
  const bookmarked = isWatched(owner, repo);
  return `
    <a href="${esc(rd.html_url)}" target="_blank" rel="noopener noreferrer" class="btn-primary">
      Open on GitHub ↗
    </a>
    <button class="btn-secondary ${bookmarked ? 'bookmarked' : ''}" id="detail-bookmark-btn" aria-label="${bookmarked ? 'Remove bookmark' : 'Bookmark this repo'}">
      ${bookmarked ? '★ Bookmarked' : '☆ Bookmark'}
    </button>`;
}

function updateDetailBookmarkBtn(owner, repo) {
  const btn = document.getElementById('detail-bookmark-btn');
  if (!btn) return;
  const bookmarked = isWatched(owner, repo);
  btn.className = 'btn-secondary' + (bookmarked ? ' bookmarked' : '');
  btn.textContent = bookmarked ? '★ Bookmarked' : '☆ Bookmark';
  btn.setAttribute('aria-label', bookmarked ? 'Remove bookmark' : 'Bookmark this repo');
}

function closeDetail() {
  const panel = document.getElementById('detail-panel');
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
  currentDetail = null;
  renderWatchlist();
}

// ── Events ─────────────────────────────────────────────────────────────────

// Search button
document.getElementById('btn-search').addEventListener('click', () => {
  searchUser(document.getElementById('username-input').value);
});

// Enter key on input
document.getElementById('username-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') searchUser(document.getElementById('username-input').value);
});

// Example chips
document.querySelectorAll('.chip[data-user]').forEach(chip => {
  chip.addEventListener('click', () => {
    document.getElementById('username-input').value = chip.dataset.user;
    searchUser(chip.dataset.user);
  });
});

// Sort selector
document.getElementById('sort-select').addEventListener('change', (e) => {
  sortBy = e.target.value;
  if (currentUser) renderRepoGrid(currentUser.repos);
});

// Star filter slider
document.getElementById('star-filter').addEventListener('input', (e) => {
  minStars = Number(e.target.value);
  document.getElementById('star-val').textContent = minStars;
  if (currentUser) renderRepoGrid(currentUser.repos);
});

// Close detail panel button
document.getElementById('btn-close-detail').addEventListener('click', closeDetail);

// Close on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDetail();
});

// ── Init ───────────────────────────────────────────────────────────────────
renderWatchlist();
updateRateBadge();
</script>
</body>
</html>
