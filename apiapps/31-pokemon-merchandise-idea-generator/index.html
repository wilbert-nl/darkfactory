<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokéMerch — Merchandise Idea Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Stat-Led · nav: N1b */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: clip; }
body {
  overflow-x: clip;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ── Type color tokens ── */
:root {
  --color-type-fire-bg:     oklch(22% 0.08 35);
  --color-type-fire-fg:     oklch(70% 0.18 35);
  --color-type-water-bg:    oklch(22% 0.07 240);
  --color-type-water-fg:    oklch(68% 0.14 240);
  --color-type-grass-bg:    oklch(22% 0.08 150);
  --color-type-grass-fg:    oklch(68% 0.16 150);
  --color-type-electric-bg: oklch(22% 0.08 90);
  --color-type-electric-fg: oklch(78% 0.16 90);
  --color-type-psychic-bg:  oklch(22% 0.08 5);
  --color-type-psychic-fg:  oklch(70% 0.18 5);
  --color-type-ice-bg:      oklch(22% 0.06 210);
  --color-type-ice-fg:      oklch(68% 0.10 210);
  --color-type-dragon-bg:   oklch(22% 0.08 280);
  --color-type-dragon-fg:   oklch(65% 0.18 280);
  --color-type-dark-bg:     oklch(20% 0.02 155);
  --color-type-dark-fg:     oklch(58% 0.04 155);
  --color-type-fairy-bg:    oklch(22% 0.07 0);
  --color-type-fairy-fg:    oklch(70% 0.15 350);
  --color-type-fighting-bg: oklch(22% 0.08 25);
  --color-type-fighting-fg: oklch(68% 0.18 25);
  --color-type-poison-bg:   oklch(22% 0.07 300);
  --color-type-poison-fg:   oklch(65% 0.16 300);
  --color-type-ground-bg:   oklch(22% 0.07 65);
  --color-type-ground-fg:   oklch(70% 0.14 65);
  --color-type-flying-bg:   oklch(22% 0.06 245);
  --color-type-flying-fg:   oklch(68% 0.12 245);
  --color-type-bug-bg:      oklch(22% 0.08 130);
  --color-type-bug-fg:      oklch(65% 0.16 130);
  --color-type-rock-bg:     oklch(22% 0.05 80);
  --color-type-rock-fg:     oklch(65% 0.08 80);
  --color-type-ghost-bg:    oklch(22% 0.07 290);
  --color-type-ghost-fg:    oklch(65% 0.14 290);
  --color-type-steel-bg:    oklch(22% 0.04 230);
  --color-type-steel-fg:    oklch(65% 0.06 230);
  --color-type-normal-bg:   oklch(20% 0.02 95);
  --color-type-normal-fg:   oklch(62% 0.02 95);
  --color-shadow-hover:     oklch(66% 0.18 235 / 0.20);
  --color-shadow-focus:     oklch(66% 0.18 235 / 0.20);
  --color-success-subtle:   oklch(55% 0.14 155 / 0.08);
  --color-overlay-bg:       oklch(9% 0.025 258 / 0.85);
}

/* ── N1b Fixed Nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 56px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}
.nav-left {
  display: flex;
  align-items: center;
}
.nav-wordmark {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  white-space: nowrap;
}
.nav-wordmark span { color: var(--color-accent); }
.nav-center {
  display: flex;
  align-items: center;
  gap: var(--space-6);
}
.nav-link {
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-ink-muted);
  white-space: nowrap;
  transition: color 0.15s var(--ease-out);
}
.nav-link:hover { color: var(--color-ink); }
.nav-link:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; border-radius: 2px; }
.nav-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
}
.nav-all-apps {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-1) var(--space-3);
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-ink-muted);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  white-space: nowrap;
  transition: color 0.15s var(--ease-out), border-color 0.15s var(--ease-out), background 0.15s var(--ease-out);
}
.nav-all-apps:hover { color: var(--color-ink); border-color: var(--color-ink-muted); background: var(--color-paper-2); }
.nav-all-apps:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ── Page wrapper ── */
.page-wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: calc(56px + var(--space-16)) var(--space-6) var(--space-16);
  position: relative;
}

/* ── Loading overlay ── */
.loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--color-overlay-bg);
  backdrop-filter: blur(2px);
  align-items: center;
  justify-content: center;
  z-index: 400;
  flex-direction: column;
  gap: var(--space-4);
}
.loading-overlay.visible { display: flex; }
.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--color-border);
  border-top-color: var(--color-accent);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
}

/* ── Stat hero (filled by JS via #artwork-wrap) ── */
.stat-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: var(--space-3);
  padding-bottom: var(--space-8);
  min-height: 220px;
  justify-content: center;
}

/* Hero placeholder (shown before selection) */
.hero-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
}
.hero-placeholder-num {
  font-family: var(--font-display);
  font-size: clamp(3.5rem, 9vw, 7rem);
  font-weight: 700;
  color: var(--color-border);
  line-height: 1;
  letter-spacing: -0.03em;
}
.hero-placeholder-label {
  font-size: var(--text-base);
  color: var(--color-ink-muted);
}

/* Pokemon artwork (injected by JS) */
.pokemon-artwork {
  width: 110px;
  height: 110px;
  object-fit: contain;
  filter: drop-shadow(0 6px 18px var(--color-shadow-hover));
  transition: transform 0.3s var(--ease-out);
}
.pokemon-artwork:hover { transform: scale(1.05); }

/* Pokemon ID label */
.pokemon-id-label {
  font-family: var(--font-mono, var(--font-body));
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-ink-muted);
  letter-spacing: 0.04em;
}

/* HUGE stat — the Pokemon name IS the hero */
.pokemon-display-name {
  font-family: var(--font-display);
  font-size: clamp(3.5rem, 9vw, 7rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--color-ink);
  text-transform: capitalize;
}

/* Type badges row */
.type-badges {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
  justify-content: center;
}
.type-badge {
  padding: var(--space-1) var(--space-3);
  border-radius: 999px;
  font-size: var(--text-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.type-fire     { background: var(--color-type-fire-bg);     color: var(--color-type-fire-fg); }
.type-water    { background: var(--color-type-water-bg);    color: var(--color-type-water-fg); }
.type-grass    { background: var(--color-type-grass-bg);    color: var(--color-type-grass-fg); }
.type-electric { background: var(--color-type-electric-bg); color: var(--color-type-electric-fg); }
.type-psychic  { background: var(--color-type-psychic-bg);  color: var(--color-type-psychic-fg); }
.type-ice      { background: var(--color-type-ice-bg);      color: var(--color-type-ice-fg); }
.type-dragon   { background: var(--color-type-dragon-bg);   color: var(--color-type-dragon-fg); }
.type-dark     { background: var(--color-type-dark-bg);     color: var(--color-type-dark-fg); }
.type-fairy    { background: var(--color-type-fairy-bg);    color: var(--color-type-fairy-fg); }
.type-fighting { background: var(--color-type-fighting-bg); color: var(--color-type-fighting-fg); }
.type-poison   { background: var(--color-type-poison-bg);   color: var(--color-type-poison-fg); }
.type-ground   { background: var(--color-type-ground-bg);   color: var(--color-type-ground-fg); }
.type-flying   { background: var(--color-type-flying-bg);   color: var(--color-type-flying-fg); }
.type-bug      { background: var(--color-type-bug-bg);      color: var(--color-type-bug-fg); }
.type-rock     { background: var(--color-type-rock-bg);     color: var(--color-type-rock-fg); }
.type-ghost    { background: var(--color-type-ghost-bg);    color: var(--color-type-ghost-fg); }
.type-steel    { background: var(--color-type-steel-bg);    color: var(--color-type-steel-fg); }
.type-normal   { background: var(--color-type-normal-bg);   color: var(--color-type-normal-fg); }

/* Sub-metrics — base stats as number row ── */
.stats-section {
  display: flex;
  gap: var(--space-8);
  justify-content: center;
  flex-wrap: wrap;
  margin-top: var(--space-2);
}
.stats-title { display: none; }
.stat-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.stat-bar-track { display: none; }
.stat-val {
  font-size: var(--text-xl);
  font-weight: 700;
  color: var(--color-ink);
  font-variant-numeric: tabular-nums;
  width: auto;
  text-align: center;
}
.stat-val.high { color: var(--color-success); }
.stat-val.low  { color: var(--color-warn); }
.stat-name {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-ink-muted);
  width: auto;
  flex-shrink: 0;
  text-align: center;
}

/* ── Controls row ── */
.controls-row {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  max-width: 520px;
  margin: 0 auto var(--space-6);
}

/* Search + autocomplete */
.search-wrap { position: relative; flex: 1; }
.input-search {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  transition: border-color 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out);
}
.input-search:focus {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px var(--color-shadow-focus);
}
.input-search:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}
.input-search::placeholder { color: var(--color-ink-muted); }
.suggestions-list {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px var(--color-shadow-card);
  z-index: 300;
  max-height: 200px;
  overflow-y: auto;
}
.suggestions-list.open { display: block; }
.sug-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-2) var(--space-3);
  font-size: var(--text-sm);
  cursor: pointer;
  border-bottom: 1px solid var(--color-border);
  transition: background 0.1s var(--ease-out);
  text-transform: capitalize;
}
.sug-item:last-child { border-bottom: none; }
.sug-item:hover,
.sug-item.focused { background: var(--color-accent-subtle); color: var(--color-accent); }
.sug-id { font-size: var(--text-xs); color: var(--color-ink-muted); font-variant-numeric: tabular-nums; }
.sug-item:hover .sug-id,
.sug-item.focused .sug-id { color: var(--color-accent); }

/* Randomize button */
.btn-randomize {
  flex-shrink: 0;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-paper);
  background: var(--color-accent);
  border: none;
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-4);
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.15s var(--ease-out), transform 0.15s var(--ease-out);
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
}
.btn-randomize:hover { opacity: 0.85; transform: translateY(-1px); }
.btn-randomize:active { transform: translateY(0); }
.btn-randomize:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ── Divider ── */
.divider {
  border: none;
  border-top: 1px solid var(--color-border);
  margin: 0 0 var(--space-6);
}

/* ── Empty state ── */
.main-empty {
  text-align: center;
  padding: var(--space-12) var(--space-4);
  color: var(--color-ink-muted);
  font-size: var(--text-base);
  line-height: 1.65;
}

/* ── Results section ── */
.main-results { display: none; }
.main-results.visible { display: block; }

.results-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  flex-wrap: wrap;
  margin-bottom: var(--space-4);
}
.results-title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  letter-spacing: -0.02em;
  color: var(--color-ink);
}
.results-title span { color: var(--color-accent); text-transform: capitalize; }
.results-actions {
  display: flex;
  gap: var(--space-3);
  align-items: center;
  flex-wrap: wrap;
}

.btn-action {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: opacity 0.15s var(--ease-out), transform 0.15s var(--ease-out);
  border: none;
  white-space: nowrap;
}
.btn-action:hover { opacity: 0.87; transform: translateY(-1px); }
.btn-action:active { transform: translateY(0); opacity: 1; }
.btn-action:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.btn-action.primary {
  background: var(--color-accent);
  color: var(--color-paper);
}
.btn-action.secondary {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  color: var(--color-ink);
}
.btn-action.secondary:hover { border-color: var(--color-accent-line); color: var(--color-accent); }

/* ── Ideas grid ── */
.ideas-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--space-4);
}

/* ── Idea cards ── */
.idea-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  transition: transform 0.2s var(--ease-out), border-color 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out);
  animation: card-in 0.3s var(--ease-out) both;
}
.idea-card:hover {
  transform: translateY(-2px);
  border-color: var(--color-accent-line);
  box-shadow: 0 8px 24px var(--color-shadow-hover);
}
.idea-card:nth-child(1) { animation-delay: 0.04s; }
.idea-card:nth-child(2) { animation-delay: 0.08s; }
.idea-card:nth-child(3) { animation-delay: 0.12s; }
.idea-card:nth-child(4) { animation-delay: 0.16s; }
.idea-card:nth-child(5) { animation-delay: 0.20s; }
.idea-card:nth-child(6) { animation-delay: 0.24s; }
@keyframes card-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.idea-card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-2);
}
.idea-type-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm);
  font-size: var(--text-xs);
  font-weight: 700;
  background: var(--color-accent-subtle);
  color: var(--color-accent);
  border: 1px solid var(--color-accent-line);
}
.idea-product-label {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--color-ink);
  line-height: 1.2;
}
.idea-tagline {
  font-size: var(--text-sm);
  color: var(--color-accent);
  font-weight: 600;
  line-height: 1.4;
}
.idea-body {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  line-height: 1.65;
  flex: 1;
}
.idea-body strong { color: var(--color-ink); font-weight: 600; }

/* Sticker list */
.sticker-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}
.sticker-list li {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  padding: var(--space-1) 0;
  border-bottom: 1px solid var(--color-border);
  display: flex;
  gap: var(--space-2);
}
.sticker-list li:last-child { border-bottom: none; }
.sticker-list li span:first-child { color: var(--color-ink); font-weight: 600; flex-shrink: 0; }

/* Listing title block */
.listing-title-block {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  font-size: var(--text-xs);
  color: var(--color-ink);
  line-height: 1.6;
}
.listing-block-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--color-ink-muted);
  margin-bottom: var(--space-1);
  border-left: 2px solid var(--color-accent);
  padding-left: var(--space-2);
}

.idea-card-foot {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-top: var(--space-2);
  border-top: 1px solid var(--color-border);
}
.btn-copy {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-1) var(--space-3);
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  border-radius: var(--radius-sm);
  cursor: pointer;
  border: 1px solid var(--color-border);
  background: var(--color-paper);
  color: var(--color-ink-muted);
  transition: border-color 0.15s var(--ease-out), color 0.15s var(--ease-out), background 0.15s var(--ease-out);
  white-space: nowrap;
}
.btn-copy:hover { border-color: var(--color-accent-line); color: var(--color-accent); background: var(--color-accent-subtle); }
.btn-copy:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.btn-copy:active { opacity: 0.8; }
.btn-copy.copied { border-color: var(--color-success); color: var(--color-success); background: var(--color-success-subtle); }

/* ── Saved section ── */
.saved-section {
  margin-top: var(--space-12);
  padding-top: var(--space-8);
  border-top: 1px solid var(--color-border);
}
.saved-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-4);
}
.saved-section-title {
  font-family: var(--font-display);
  font-size: var(--text-base);
  font-weight: 500;
  color: var(--color-ink);
  letter-spacing: -0.01em;
}
.saved-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.saved-item {
  display: flex;
  align-items: center;
  justify-content: space-between;

<script>
'use strict';

/* ──────────────────────────────────────────────────────────
   TEMPLATE SYSTEM — seeded, deterministic by Pokémon ID
   ────────────────────────────────────────────────────────── */

const typeCopy = {
  fire:     { adj: ['blazing','fierce','untamed','scorching'], vibe: 'heat and intensity', mug: 'hot takes', emoji: '🔥' },
  water:    { adj: ['fluid','deep','calm','tidal'],            vibe: 'flow and adaptability', mug: 'go with the flow', emoji: '💧' },
  grass:    { adj: ['grounded','wild','fresh','verdant'],      vibe: 'nature and growth', mug: 'rooted wisdom', emoji: '🌿' },
  electric: { adj: ['charged','electric','dynamic','vivid'],   vibe: 'energy and speed', mug: 'high-voltage mornings', emoji: '⚡' },
  psychic:  { adj: ['enigmatic','focused','sharp','cosmic'],   vibe: 'mind and clarity', mug: 'infinite perspective', emoji: '🔮' },
  ice:      { adj: ['crystalline','arctic','frosty','crisp'],  vibe: 'cool and precision', mug: 'icy clarity', emoji: '❄️' },
  dragon:   { adj: ['majestic','legendary','regal','mythic'],  vibe: 'power and legacy', mug: 'dragon wisdom', emoji: '🐉' },
  dark:     { adj: ['shadowy','void','nightfall','edgy'],      vibe: 'mystery and grit', mug: 'dark truths', emoji: '🌑' },
  fairy:    { adj: ['enchanted','dreamy','whimsical','sparkly'], vibe: 'magic and wonder', mug: 'enchanted mornings', emoji: '✨' },
  fighting: { adj: ['fierce','warrior','iron','champion'],     vibe: 'strength and discipline', mug: 'warrior mindset', emoji: '🥊' },
  poison:   { adj: ['toxic','venomous','gothic','shadowy'],    vibe: 'edge and mystique', mug: 'sharp perspective', emoji: '☠️' },
  ground:   { adj: ['rugged','earthy','ancient','terrain'],    vibe: 'stability and roots', mug: 'grounded energy', emoji: '🌍' },
  flying:   { adj: ['soaring','sky-high','free','breezy'],     vibe: 'freedom and adventure', mug: 'sky-high ambitions', emoji: '🦅' },
  bug:      { adj: ['wild','crawling','hive','woven'],         vibe: 'quirky and tenacious', mug: 'bug-eyed focus', emoji: '🐛' },
  rock:     { adj: ['ancient','stone','titan','enduring'],     vibe: 'toughness and time', mug: 'rock-solid resolve', emoji: '🪨' },
  ghost:    { adj: ['haunted','spectral','phantom','cursed'],  vibe: 'mystery and the beyond', mug: 'otherworldly wisdom', emoji: '👻' },
  steel:    { adj: ['forged','iron','chrome','armored'],       vibe: 'precision and resilience', mug: 'steel yourself', emoji: '⚙️' },
  normal:   { adj: ['classic','timeless','everyday','iconic'], vibe: 'versatility and charm', mug: 'classic perspective', emoji: '⭕' },
};

const tshirtTemplates = [
  (name, type, move, adj) => `${cap(name)}: Born to ${cap(move)}. Too rare to stop.`,
  (name, type, move, adj) => `Part ${cap(type)}. All ${cap(name)}. Completely untameable.`,
  (name, type, move, adj) => `${cap(adj[0])} by nature. ${cap(name)} by name.`,
  (name, type, move, adj) => `${cap(name)} doesn't miss. That's just science.`,
  (name, type, move, adj) => `${cap(move)} first. Questions later. — ${cap(name)}`,
];

const mugTemplates = [
  (name, type, meta) => `Your ${type} morning starts here. ${cap(name)} energy, all day.`,
  (name, type, meta) => `${cap(name)} said: ${meta.mug}. Today and every day.`,
  (name, type, meta) => `${cap(meta.mug)}. ${cap(name)} approved.`,
  (name, type, meta) => `Fueled by ${meta.vibe}. Brewed by ${cap(name)}.`,
  (name, type, meta) => `Coffee is fine. But ${cap(name)} energy hits different.`,
];

const toteTemplates = [
  (name, type, meta) => `The ${cap(name)} way: ${meta.vibe}. Carry that with you.`,
  (name, type, meta) => `${cap(name)} tote: premium ${meta.vibe} culture.`,
  (name, type, meta) => `${cap(adj(type)[2])} lifestyle. ${cap(name)} approved.`,
  (name, type, meta) => `${cap(name)}: living proof that ${meta.vibe} goes everywhere.`,
];

const etsyTitleTemplates = [
  (name, type, adj) => `${cap(name)} Fan Art Print | ${cap(adj[0])} ${cap(type)} Pokemon Gift | Wall Decor`,
  (name, type, adj) => `${cap(name)} Merchandise | ${cap(type)} Type Pokemon | Fan Gift for Trainers`,
  (name, type, adj) => `${cap(adj[1])} ${cap(name)} Print-On-Demand | Pokemon Fan Art | Unisex Gift`,
  (name, type, adj) => `${cap(name)} Gift Idea | ${cap(type)} Pokemon Art | POD Listing Ready to Sell`,
];

const etsyDescTemplates = [
  (name, type, meta, isLegendary) =>
    `This ${cap(name)} merchandise listing is designed for ${isLegendary ? 'collectors who appreciate legendary status' : 'fans of the ' + type + ' type'}. The design captures ${cap(name)}'s essence of ${meta.vibe}. Perfect for Etsy POD sellers targeting Pokémon fans on Redbubble, Merch by Amazon, or Printful.`,
  (name, type, meta, isLegendary) =>
    `${cap(name)} is a fan-favourite known for ${meta.vibe}. This listing description is crafted for print-on-demand sellers: compelling, keyword-rich, and ready to drive conversions. Pair it with your own ${type}-type art for a complete Etsy listing.`,
  (name, type, meta, isLegendary) =>
    `Turn your love of ${cap(name)} into revenue. This ${cap(type)}-inspired product description highlights ${meta.vibe} — a niche angle that stands out in crowded POD marketplaces. Use as-is or adapt to your store's voice.`,
];

/* ── Seeded pseudo-random (deterministic by Pokémon ID) ── */
function seededRng(seed) {
  let s = seed;
  return function() {
    s = (s * 1664525 + 1013904223) & 0xFFFFFFFF;
    return (s >>> 0) / 0xFFFFFFFF;
  };
}

function seedPick(arr, rng) {
  return arr[Math.floor(rng() * arr.length)];
}

function adj(type) {
  return (typeCopy[type] || typeCopy.normal).adj;
}

/* ── Merchandise idea generator ── */
function generateIdeas(pokemon, species) {
  const { name, id, types, stats, moves } = pokemon;
  const primaryType = types[0].type.name;
  const secondaryType = types[1]?.type.name || null;
  const meta = typeCopy[primaryType] || typeCopy.normal;
  const adjList = meta.adj;

  const hp      = stats.find(s => s.stat.name === 'hp')?.base_stat || 50;
  const attack  = stats.find(s => s.stat.name === 'attack')?.base_stat || 50;
  const defense = stats.find(s => s.stat.name === 'defense')?.base_stat || 50;
  const speed   = stats.find(s => s.stat.name === 'speed')?.base_stat || 50;

  // Pick a signature move (pick from first 20 moves, prefer longer names)
  const movePool = moves.slice(0, 20).map(m => m.move.name.replace(/-/g, ' '));
  const signatureMove = movePool.sort((a, b) => b.length - a.length)[0] || 'tackle';

  // Flavor text (English only)
  const flavorEntries = species?.flavor_text_entries?.filter(e => e.language.name === 'en') || [];
  const flavorText = flavorEntries[0]?.flavor_text?.replace(/\f/g, ' ').replace(/\n/g, ' ') || '';

  const isLegendary = species?.is_legendary || false;

  const rng = seededRng(id * 31 + 7);

  // 1. T-Shirt
  const tshirtTagline = seedPick(tshirtTemplates, rng)(name, primaryType, signatureMove, adjList);

  // 2. Mug
  const mugLine = seedPick(mugTemplates, rng)(name, primaryType, meta);

  // 3. Sticker pack — 5 sticker concepts
  const stickerExpressions = [
    { mood: 'Happy', desc: `${cap(name)} beaming after a victory — big grin, paws up, ${adjList[0]} aura glowing.` },
    { mood: 'Angry', desc: `${cap(name)} battle-ready stance, eyes narrowed, ${signatureMove} charging up.` },
    { mood: 'Sleepy', desc: `${cap(name)} mid-yawn, droopy eyes, tiny Zzz bubbles floating up.` },
    { mood: 'Shocked', desc: `${cap(name)} wide-eyed, mouth open — just witnessed something unbelievable.` },
    { mood: 'Determined', desc: `${cap(name)} in a heroic pose, ${adjList[1] || adjList[0]} energy radiating outward.` },
  ];

  // 4. Tote
  const toteAngle = seedPick(toteTemplates, rng)(name, primaryType, meta);

  // 5. Etsy title (trim to ~70 chars)
  let etsyTitle = seedPick(etsyTitleTemplates, rng)(name, primaryType, adjList);
  if (etsyTitle.length > 80) etsyTitle = etsyTitle.slice(0, 77) + '…';

  // 6. POD description
  const podDesc = seedPick(etsyDescTemplates, rng)(name, primaryType, meta, isLegendary);

  const typeStr = secondaryType ? `${cap(primaryType)} / ${cap(secondaryType)}` : cap(primaryType);

  return {
    name, id, primaryType, secondaryType, meta, adjList,
    hp, attack, defense, speed,
    flavorText, isLegendary, typeStr,
    ideas: [
      {
        id: 'tshirt',
        label: 'T-Shirt',
        icon: '👕',
        typeTag: 'Apparel',
        tagline: tshirtTagline,
        body: `A graphic tee built around ${cap(name)}'s ${meta.vibe} character. ${flavorText ? `Inspired by: "${flavorText.slice(0, 100).trim()}…"` : `Type energy: ${typeStr}.`} Print the tagline across the chest on a dark-wash tee for maximum impact.`,
        copyText: `T-SHIRT TAGLINE\n"${tshirtTagline}"\n\nPokémon: ${cap(name)} · Type: ${typeStr}\nPlatform: Redbubble, Merch by Amazon`,
      },
      {
        id: 'mug',
        label: 'Coffee Mug',
        icon: '☕',
        typeTag: 'Drinkware',
        tagline: `${meta.emoji} ${mugLine}`,
        body: `An 11oz ceramic mug for fans who start every day with ${meta.vibe}. Wrap-around ${primaryType}-type colour palette. The quote taps into ${cap(name)}'s lore angle: ${meta.mug}.`,
        copyText: `MUG QUOTE\n"${mugLine}"\n\nPokémon: ${cap(name)} · Type: ${typeStr}\nPlatform: Etsy, Zazzle`,
      },
      {
        id: 'stickers',
        label: 'Sticker Pack',
        icon: '🏷️',
        typeTag: 'Stationery',
        tagline: `5-piece ${cap(name)} expression set`,
        body: null, // rendered as list
        stickerList: stickerExpressions,
        copyText: `STICKER PACK — 5-piece ${cap(name)} set\n` +
          stickerExpressions.map((s, i) => `${i+1}. ${s.mood}: ${s.desc}`).join('\n') +
          `\n\nPlatform: Etsy, Redbubble`,
      },
      {
        id: 'tote',
        label: 'Tote Bag',
        icon: '👜',
        typeTag: 'Accessories',
        tagline: toteAngle,
        body: `Heavy canvas tote with a minimalist ${cap(name)} line-art print. The lifestyle angle positions this beyond merch — it's a statement piece for fans who live the ${meta.vibe} philosophy.`,
        copyText: `TOTE BAG ANGLE\n"${toteAngle}"\n\nPokémon: ${cap(name)} · Type: ${typeStr}\nPlatform: Printful, Printify`,
      },
      {
        id: 'etsy-title',
        label: 'Etsy Listing Title',
        icon: '🏪',
        typeTag: 'POD Listing',
        tagline: 'SEO-ready title',
        body: null, // rendered as listing block
        listingBlock: etsyTitle,
        copyText: `ETSY LISTING TITLE\n${etsyTitle}\n\nPokémon: ${cap(name)} · Type: ${typeStr}`,
      },
      {
        id: 'pod-desc',
        label: 'POD Description',
        icon: '📝',
        typeTag: 'POD Listing',
        tagline: 'Ready-to-paste product copy',
        body: podDesc,
        copyText: `POD LISTING DESCRIPTION\n${podDesc}\n\nPokémon: ${cap(name)} · Type: ${typeStr}`,
      },
    ],
  };
}

/* ──────────────────────────────────────────────────────────
   UTILS
   ────────────────────────────────────────────────────────── */
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let toastTimer;
function toast(msg, type = '') {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3000);
}

function copyToClipboard(text, btn) {
  const doFlash = () => {
    const orig = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = '✓ Copied';
    btn.disabled = true;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = orig;
      btn.disabled = false;
    }, 2000);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(doFlash).catch(() => fallbackCopy(text, doFlash));
  } else {
    fallbackCopy(text, doFlash);
  }
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); cb(); } catch(e) { toast('Copy failed', 'error'); }
  document.body.removeChild(ta);
}

/* ──────────────────────────────────────────────────────────
   STATE
   ────────────────────────────────────────────────────────── */
const POKEAPI = 'https://pokeapi.co/api/v2';
let allPokemon = []; // [{name, url}] for first 151
let currentData = null; // { pokemon, species, ideas }
let suggestIdx = -1;

/* ──────────────────────────────────────────────────────────
   INIT — load 151 Pokémon names
   ────────────────────────────────────────────────────────── */
async function init() {
  try {
    const res = await fetch(`${POKEAPI}/pokemon?limit=151`);
    if (!res.ok) throw new Error('Failed to load list');
    const data = await res.json();
    allPokemon = data.results; // [{name, url}]
  } catch(e) {
    console.warn('Could not preload Pokémon list — autocomplete unavailable');
  }
  renderSaved();
}

/* ──────────────────────────────────────────────────────────
   AUTOCOMPLETE
   ────────────────────────────────────────────────────────── */
const searchInput = $('pokemon-search');
const suggestionsList = $('suggestions-list');

function getSuggestions(q) {
  if (!q || q.length < 1) return [];
  const lq = q.toLowerCase();
  const starts = allPokemon.filter(p => p.name.startsWith(lq));
  const contains = allPokemon.filter(p => !p.name.startsWith(lq) && p.name.includes(lq));
  return [...starts, ...contains].slice(0, 8);
}

function renderSuggestions(items) {
  suggestionsList.innerHTML = '';
  suggestIdx = -1;
  if (!items.length) {
    suggestionsList.classList.remove('open');
    searchInput.setAttribute('aria-expanded', 'false');
    return;
  }
  items.forEach((p, i) => {
    const id = allPokemon.findIndex(x => x.name === p.name) + 1;
    const li = document.createElement('li');
    li.className = 'sug-item';
    li.setAttribute('role', 'option');
    li.setAttribute('id', `sug-${i}`);
    li.innerHTML = `<span>${cap(p.name)}</span><span class="sug-id">#${String(id).padStart(3,'0')}</span>`;
    li.addEventListener('mousedown', e => { e.preventDefault(); selectPokemon(p.name); });
    suggestionsList.appendChild(li);
  });
  suggestionsList.classList.add('open');
  searchInput.setAttribute('aria-expanded', 'true');
}

searchInput.addEventListener('input', () => {
  renderSuggestions(getSuggestions(searchInput.value.trim()));
});

searchInput.addEventListener('keydown', e => {
  const items = suggestionsList.querySelectorAll('.sug-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    suggestIdx = Math.min(suggestIdx + 1, items.length - 1);
    updateSuggestFocus(items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    suggestIdx = Math.max(suggestIdx - 1, -1);
    updateSuggestFocus(items);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (suggestIdx >= 0 && items[suggestIdx]) {
      const name = items[suggestIdx].querySelector('span').textContent.toLowerCase();
      selectPokemon(name);
    } else if (searchInput.value.trim()) {
      selectPokemon(searchInput.value.trim().toLowerCase());
    }
  } else if (e.key === 'Escape') {
    closeSuggestions();
  }
});

function updateSuggestFocus(items) {
  items.forEach((el, i) => el.classList.toggle('focused', i === suggestIdx));
}

function closeSuggestions() {
  suggestionsList.classList.remove('open');
  searchInput.setAttribute('aria-expanded', 'false');
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) closeSuggestions();
});

function selectPokemon(name) {
  searchInput.value = cap(name);
  closeSuggestions();
  fetchAndRender(name.toLowerCase());
}

/* ──────────────────────────────────────────────────────────
   RANDOMIZE
   ────────────────────────────────────────────────────────── */
$('btn-randomize').addEventListener('click', () => {
  if (!allPokemon.length) { toast('Pokémon list not loaded yet. Try again in a moment.', 'error'); return; }
  const pick = allPokemon[Math.floor(Math.random() * allPokemon.length)];
  searchInput.value = cap(pick.name);
  fetchAndRender(pick.name);
});

/* ──────────────────────────────────────────────────────────
   FETCH + RENDER
   ────────────────────────────────────────────────────────── */
async function fetchAndRender(nameOrId) {
  showLoading(true);
  $('main-empty').style.display = 'none';
  $('main-results').classList.remove('visible');

  try {
    const pokemonRes = await fetch(`${POKEAPI}/pokemon/${nameOrId}`);

    if (!pokemonRes.ok) {
      if (pokemonRes.status === 404) throw new Error(`"${cap(String(nameOrId))}" not found. Check the spelling.`);
      throw new Error(`API error ${pokemonRes.status}. Please try again.`);
    }

    const pokemon = await pokemonRes.json();

    // Fetch species in parallel (optional — provides flavor text + legendary flag)
    let species = null;
    try {
      const speciesRes = await fetch(`${POKEAPI}/pokemon-species/${pokemon.id}`);
      if (speciesRes.ok) species = await speciesRes.json();
    } catch(e) { /* species is optional */ }

    const ideas = generateIdeas(pokemon, species);
    currentData = { pokemon, species, ideas };

    renderSidebar(ideas);
    renderCards(ideas);

    $('main-results').classList.add('visible');
  } catch(e) {
    toast(e.message, 'error');
    $('main-empty').style.display = '';
  } finally {
    showLoading(false);
  }
}

/* ──────────────────────────────────────────────────────────
   RENDER SIDEBAR — artwork + stats
   ────────────────────────────────────────────────────────── */
function renderSidebar(data) {
  const { name, id, primaryType, typeStr, hp, attack, defense, speed } = data;
  const artworkUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;

  const artworkWrap = $('artwork-wrap');
  artworkWrap.innerHTML = `
    <img
      class="pokemon-artwork"
      src="${esc(artworkUrl)}"
      alt="${esc(cap(name))} official artwork"
      width="200" height="200"
      loading="eager"
      onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png'"
    >
    <p class="pokemon-id-label">#${String(id).padStart(3,'0')}</p>
    <p class="pokemon-display-name">${esc(cap(name))}</p>
    <div class="type-badges" role="list" aria-label="Pokémon types">
      ${data.primaryType ? `<span class="type-badge type-${esc(data.primaryType)}" role="listitem">${esc(cap(data.primaryType))}</span>` : ''}
      ${data.secondaryType ? `<span class="type-badge type-${esc(data.secondaryType)}" role="listitem">${esc(cap(data.secondaryType))}</span>` : ''}
    </div>
    <div class="stats-section">
      <p class="stats-title">Base Stats</p>
      ${renderStatBar('HP', hp)}
      ${renderStatBar('Atk', attack)}
      ${renderStatBar('Def', defense)}
      ${renderStatBar('Spd', speed)}
    </div>
  `;
}

function renderStatBar(label, value) {
  const pct = Math.min(100, Math.round((value / 255) * 100));
  const cls = value >= 100 ? 'high' : value < 50 ? 'low' : '';
  return `
    <div class="stat-row">
      <span class="stat-name">${esc(label)}</span>
      <div class="stat-bar-track" aria-hidden="true">
        <div class="stat-bar-fill ${cls}" style="width:${pct}%"></div>
      </div>
      <span class="stat-val ${cls}">${value}</span>
    </div>
  `;
}

/* ──────────────────────────────────────────────────────────
   RENDER IDEA CARDS
   ────────────────────────────────────────────────────────── */
function renderCards(data) {
  const grid = $('ideas-grid');
  grid.innerHTML = '';
  $('results-pokemon-name').textContent = cap(data.name);

  data.ideas.forEach(idea => {
    const card = document.createElement('article');
    card.className = 'idea-card';
    card.setAttribute('role', 'listitem');
    card.setAttribute('aria-label', `${idea.label} merchandise idea`);

    let bodyHtml = '';
    if (idea.stickerList) {
      bodyHtml = `
        <ul class="sticker-list" aria-label="Sticker concepts">
          ${idea.stickerList.map(s => `
            <li>
              <span>${esc(s.mood)}</span>
              <span>${esc(s.desc)}</span>
            </li>
          `).join('')}
        </ul>
      `;
    } else if (idea.listingBlock) {
      bodyHtml = `
        <div>
          <p class="listing-block-label">Listing Title</p>
          <div class="listing-title-block">${esc(idea.listingBlock)}</div>
        </div>
      `;
    } else if (idea.body) {
      bodyHtml = `<p class="idea-body">${esc(idea.body)}</p>`;
    }

    card.innerHTML = `
      <div class="idea-card-head">
        <span class="idea-type-badge">${esc(idea.icon)} ${esc(idea.typeTag)}</span>
      </div>
      <p class="idea-product-label">${esc(idea.label)}</p>
      <p class="idea-tagline">"${esc(idea.tagline)}"</p>
      ${bodyHtml}
      <div class="idea-card-foot">
        <button class="btn-copy" aria-label="Copy ${esc(idea.label)} text to clipboard" data-copy="${esc(idea.copyText)}">Copy</button>
      </div>
    `;

    card.querySelector('.btn-copy').addEventListener('click', function() {
      copyToClipboard(idea.copyText, this);
    });

    grid.appendChild(card);
  });

  // Wire action bar buttons
  $('btn-copy-all').onclick = () => {
    const allText = data.ideas.map(i => i.copyText).join('\n\n' + '─'.repeat(48) + '\n\n');
    copyToClipboard(allText, $('btn-copy-all'));
    toast('All ideas copied to clipboard', 'success');
  };

  $('btn-save-batch').onclick = () => {
    saveBatch(data);
    toast(`${cap(data.name)} batch saved`, 'success');
  };
}

/* ──────────────────────────────────────────────────────────
   SAVED BATCHES (localStorage, max 10)
   ────────────────────────────────────────────────────────── */
const STORAGE_KEY = 'pokemerch_saved_v1';

function loadSaved() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}

function saveBatch(data) {
  let saved = loadSaved();
  // Remove duplicate if same Pokémon
  saved = saved.filter(b => b.name !== data.name);
  // Prepend
  saved.unshift({
    name: data.name,
    id: data.id,
    primaryType: data.primaryType,
    ideas: data.ideas.map(i => ({ label: i.label, copyText: i.copyText, tagline: i.tagline })),
    savedAt: Date.now(),
  });
  // Cap at 10
  if (saved.length > 10) saved = saved.slice(0, 10);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  renderSaved();
}

function renderSaved() {
  const saved = loadSaved();
  const list = $('saved-list');
  if (!saved.length) {
    list.innerHTML = '<span class="no-saved">No saved batches yet.</span>';
    return;
  }
  list.innerHTML = '';
  saved.forEach(batch => {
    const item = document.createElement('div');
    item.className = 'saved-item';
    item.setAttribute('role', 'button');
    item.setAttribute('tabindex', '0');
    item.setAttribute('aria-label', `Load saved batch for ${cap(batch.name)}`);
    item.innerHTML = `
      <span class="saved-item-name">${esc(cap(batch.name))}</span>
      <span class="saved-item-del" title="Remove" aria-label="Remove saved batch for ${esc(cap(batch.name))}">×</span>
    `;
    item.querySelector('.saved-item-del').addEventListener('click', e => {
      e.stopPropagation();
      deleteSaved(batch.name);
    });
    item.addEventListener('click', () => {
      searchInput.value = cap(batch.name);
      fetchAndRender(batch.name);
    });
    item.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fetchAndRender(batch.name); }
    });
    list.appendChild(item);
  });
}

function deleteSaved(name) {
  let saved = loadSaved().filter(b => b.name !== name);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  renderSaved();
}

/* ──────────────────────────────────────────────────────────
   LOADING
   ────────────────────────────────────────────────────────── */
function showLoading(v) {
  $('loading-overlay').classList.toggle('visible', v);
}

/* ──────────────────────────────────────────────────────────
   BOOT
   ────────────────────────────────────────────────────────── */
init();
</script>
