<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Apps — 100 Single-File Tools</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --text: #e2e8f0;
      --muted: #8892b0;
      --green: #43d9ad;
      --yellow: #f7c948;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    /* ── Hero ── */
    header {
      background: linear-gradient(135deg, #12152a 0%, #1a1d27 60%, #1e1530 100%);
      border-bottom: 1px solid var(--border);
      padding: 64px 24px 48px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(108,99,255,.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(108,99,255,.15);
      border: 1px solid rgba(108,99,255,.35);
      color: #a89fff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    h1 span { color: var(--accent); }
    .subtitle {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 560px;
      margin: 0 auto 32px;
      line-height: 1.6;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
    }
    .stat { text-align: center; }
    .stat-num {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
      display: block;
    }
    .stat-label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

    /* ── Controls ── */
    .controls {
      max-width: 1200px;
      margin: 36px auto 0;
      padding: 0 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
    }
    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    #search {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 15px;
      padding: 10px 14px 10px 40px;
      outline: none;
      transition: border-color .2s;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--muted); }

    .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 16px;
      transition: all .2s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Grid ── */
    .grid-wrap {
      max-width: 1200px;
      margin: 28px auto 80px;
      padding: 0 24px;
    }
    .result-count {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 20px;
    }
    .result-count strong { color: var(--text); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color .2s, transform .15s, box-shadow .2s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(108,99,255,.06) 0%, transparent 60%);
      opacity: 0;
      transition: opacity .2s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(108,99,255,.15); }
    .card:hover::before { opacity: 1; }
    .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .card-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .06em;
      background: rgba(108,99,255,.12);
      border: 1px solid rgba(108,99,255,.25);
      border-radius: 6px;
      padding: 2px 8px;
      flex-shrink: 0;
    }
    .card-tag {
      font-size: 11px;
      color: var(--muted);
      background: var(--surface2);
      border-radius: 6px;
      padding: 2px 8px;
      white-space: nowrap;
    }
    .card-name {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
    }
    .card-slug {
      font-size: 12px;
      color: var(--muted);
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }

    .hidden { display: none !important; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 32px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>

const CAT_LABELS = {
  data: 'Data & Finance',
  weather: 'Weather',
  food: 'Food & Health',
  media: 'Media & Fun',
  tools: 'Tools',
  travel: 'Travel & Geo',
};

const BASE = '../';

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');

function renderCards(apps) {
  grid.innerHTML = '';
  countEl.textContent = apps.length;
  apps.forEach(app => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `${BASE}${app.slug}/`;
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('role', 'listitem');
    a.setAttribute('aria-label', app.name);
    a.innerHTML = `
      <div class="card-top">
        <span class="card-num">#${app.num}</span>
        <span class="card-tag">${CAT_LABELS[app.cat]}</span>
      </div>
      <div class="card-name">${app.name}</div>
      <div class="card-slug">${app.slug}</div>
    `;
    grid.appendChild(a);
  });
}

let activeCat = 'all';

function filter() {
  const q = searchEl.value.toLowerCase().trim();
  const results = APPS.filter(app => {
    const matchCat = activeCat === 'all' || app.cat === activeCat;
    const matchQ = !q || app.name.toLowerCase().includes(q) || app.slug.includes(q) || app.cat.includes(q);
    return matchCat && matchQ;
  });
  renderCards(results);
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    filter();
  });
});

searchEl.addEventListener('input', filter);

renderCards(APPS);
</script>
