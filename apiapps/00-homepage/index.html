<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Apps — 100 Single-File Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Hallmark · macrostructure: Bento Grid · nav: N5 */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg:       #0f1117;
      --color-paper:    #1a1d27;
      --color-paper-2:  #22263a;
      --color-border:   #2e3350;
      --color-accent:   #6c63ff;
      --color-accent-2: #ff6584;
      --color-text:     #e2e8f0;
      --color-muted:    #8892b0;
      --color-green:    #43d9ad;
      --color-focus:    #6c63ff;
      --color-accent-a06: rgba(108,99,255,.06);
      --color-accent-a12: rgba(108,99,255,.12);
      --color-accent-a15: rgba(108,99,255,.15);
      --color-accent-a22: rgba(108,99,255,.22);
      --color-accent-a28: rgba(108,99,255,.28);
      --color-accent-a50: rgba(108,99,255,.50);
      --color-accent-text: #a89fff;
      --color-white-a04: rgba(255,255,255,.04);
      --radius-sm:      6px;
      --radius-md:      10px;
      --radius-lg:      14px;
      --space-1:        4px;
      --space-2:        8px;
      --space-3:        12px;
      --space-4:        16px;
      --space-5:        20px;
      --space-6:        24px;
      --space-8:        32px;
    }

    html {
      overflow-x: clip;
    }
    body {
      overflow-x: clip;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding-top: 72px;
    }

    /* ── N5 Nav: floating pill, top-right ── */
    .nav-pill {
      position: fixed;
      top: var(--space-4);
      right: var(--space-4);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: var(--space-4);
      height: 40px;
      padding: 0 var(--space-4);
      background: var(--color-paper);
      border: 1px solid var(--color-border);
      border-radius: 999px;
      box-shadow: 0 2px 16px rgba(0,0,0,.35), 0 1px 4px rgba(0,0,0,.2);
    }
    .nav-wordmark {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--color-text);
      white-space: nowrap;
    }
    .nav-wordmark span {
      color: var(--color-accent);
    }
    .nav-divider {
      width: 1px;
      height: 18px;
      background: var(--color-border);
      flex-shrink: 0;
    }
    .nav-back {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-muted);
      text-decoration: none;
      white-space: nowrap;
      transition: color .15s;
    }
    .nav-back:hover { color: var(--color-text); }
    .nav-back:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .nav-back:active { color: var(--color-accent); }

    /* ── Bento layout ── */
    .bento {
      max-width: 1280px;
      margin: 0 auto;
      padding: var(--space-6) var(--space-6) var(--space-6);
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: auto;
      gap: var(--space-3);
    }

    /* ── Header area (cols 1-12) ── */
    .bento-header {
      grid-column: 1 / -1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-4);
      padding: var(--space-5) 0 var(--space-2);
    }
    .header-left {}
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      background: var(--color-accent-a12);
      border: 1px solid var(--color-accent-a28);
      color: var(--color-accent-text);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: var(--space-3);
    }
    .header-badge-dot {
      width: 6px;
      height: 6px;
      background: var(--color-green);
      border-radius: 50%;
      flex-shrink: 0;
    }
    .header-title {
      font-size: clamp(1.75rem, 4vw, 2.75rem);
      font-weight: 800;
      font-style: normal;
      letter-spacing: -.025em;
      line-height: 1.1;
      margin-bottom: var(--space-3);
    }
    .header-title .accent { color: var(--color-accent); }
    .header-desc {
      font-size: .95rem;
      color: var(--color-muted);
      max-width: 480px;
      line-height: 1.6;
    }
    .header-stats {
      display: flex;
      gap: var(--space-6);
      flex-shrink: 0;
      align-items: flex-start;
      padding-top: var(--space-2);
    }
    .stat { text-align: right; }
    .stat-num {
      display: block;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--color-accent);
      line-height: 1;
      margin-bottom: 3px;
    }
    .stat-label {
      font-size: .7rem;
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: .07em;
    }

    /* ── Input card (cols 1-4, rows 2-3) ── */
    .bento-input {
      grid-column: 1 / 5;
      grid-row: 2 / 4;
      background: var(--color-paper-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .input-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--color-muted);
    }

    .search-wrap {
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-muted);
      pointer-events: none;
    }
    #search {
      width: 100%;
      background: var(--color-paper);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 12px 10px 38px;
      outline: none;
      transition: border-color .15s;
    }
    #search:focus { border-color: var(--color-accent); }
    #search:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
    #search::placeholder { color: var(--color-muted); }

    .filter-section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: var(--space-2);
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .filter-btn {
      background: var(--color-paper);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 8px var(--space-4);
      text-align: left;
      transition: border-color .15s, color .15s, background .15s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--color-accent); color: var(--color-accent); background: var(--color-accent-a06); }
    .filter-btn.active { background: var(--color-accent-a15); border-color: var(--color-accent-a50); color: var(--color-accent-text); font-weight: 600; }
    .filter-btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
    .filter-btn:active { background: var(--color-accent-a22); }

    /* ── Output card (cols 5-13, rows 2-3) ── */
    .bento-output {
      grid-column: 5 / 13;
      grid-row: 2 / 4;
      background: var(--color-paper);
      border: 1px solid var(--color-border);
      border-left: 3px solid var(--color-accent);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      min-height: 520px;
    }
    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .result-count {
      font-size: 13px;
      color: var(--color-muted);
    }
    .result-count strong { color: var(--color-text); font-weight: 600; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: var(--space-3);
      overflow-y: auto;
      flex: 1;
      padding-right: 2px;
    }
    .grid::-webkit-scrollbar { width: 4px; }
    .grid::-webkit-scrollbar-track { background: transparent; }
    .grid::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

    .card {
      background: var(--color-paper-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      transition: border-color .15s, transform .12s, box-shadow .15s;
      position: relative;
      align-self: start;
    }
    .card:hover {
      border-color: var(--color-accent);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px var(--color-accent-a12);
    }
    .card:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }
    .card:active { transform: translateY(0); }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-2);
    }
    .card-num {
      font-size: 10px;
      font-weight: 700;
      color: var(--color-accent);
      letter-spacing: .06em;
      background: var(--color-accent-a12);
      border: 1px solid var(--color-accent-a22);
      border-radius: var(--radius-sm);
      padding: 2px 7px;
      flex-shrink: 0;
    }
    .card-tag {
      font-size: 10px;
      color: var(--color-muted);
      background: var(--color-white-a04);
      border-radius: var(--radius-sm);
      padding: 2px 7px;
      white-space: nowrap;
    }
    .card-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--color-text);
    }
    .card-slug {
      font-size: 11px;
      color: var(--color-muted);
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }

    .hidden { display: none !important; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
      color: var(--color-muted);
      text-align: center;
      padding: var(--space-8);
    }
    .empty-state p { font-size: .9rem; }
    .empty-state .filter-btn { align-self: center; }

    .error-toast {
      position: fixed;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-paper-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-5);
      font-size: 13px;
      color: var(--color-text);
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
      z-index: 200;
      white-space: nowrap;
      transition: opacity .2s;
    }

    /* ── Footer row (cols 1-12) ── */
    .bento-footer {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-3);
      padding: var(--space-3) 0 var(--space-2);
      border-top: 1px solid var(--color-border);
      font-size: 12px;
      color: var(--color-muted);
    }
    .bento-footer a {
      color: var(--color-accent);
      text-decoration: none;
    }
    .bento-footer a:hover { text-decoration: underline; }
    .bento-footer a:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; border-radius: 2px; }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      html, body { overflow-x: clip; }
      body { padding-top: 64px; }
      .nav-pill { right: var(--space-3); top: var(--space-3); }

      .bento {
        padding: var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      .bento-header {
        flex-direction: column;
        gap: var(--space-3);
        padding-top: var(--space-2);
      }
      .header-stats {
        flex-direction: row;
        gap: var(--space-6);
        align-items: flex-start;
      }
      .stat { text-align: left; }
      .bento-output {
        min-height: 400px;
        border-left-width: 3px;
      }
      .filter-group {
        flex-direction: row;
        flex-wrap: wrap;
      }
      .filter-btn {
        flex-shrink: 0;
      }
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        max-height: 480px;
      }
    }
  </style>
</head>

</main>

const CAT_LABELS = {
  data: 'Data & Finance',
  weather: 'Weather',
  food: 'Food & Health',
  media: 'Media & Fun',
  tools: 'Tools',
  travel: 'Travel & Geo',
};

const BASE = '../';

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
const emptyState = document.getElementById('empty-state');
const clearSearchBtn = document.getElementById('clear-search');

let toastTimer = null;

function showToast(msg) {
  let toast = document.getElementById('error-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'error-toast';
    toast.className = 'error-toast';
    toast.setAttribute('role', 'alert');
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.opacity = '0'; }, 3500);
}

function renderCards(apps) {
  grid.innerHTML = '';
  countEl.textContent = apps.length;

  if (apps.length === 0) {
    grid.classList.add('hidden');
    emptyState.classList.remove('hidden');
    return;
  }

  grid.classList.remove('hidden');
  emptyState.classList.add('hidden');

  apps.forEach(app => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `${BASE}${app.slug}/`;
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('role', 'listitem');
    a.setAttribute('aria-label', app.name);
    a.setAttribute('data-testid', 'app-card');
    a.setAttribute('data-slug', app.slug);
    a.setAttribute('data-cat', app.cat);
    a.innerHTML = `
      <div class="card-top">
        <span class="card-num">#${app.num}</span>
        <span class="card-tag">${CAT_LABELS[app.cat]}</span>
      </div>
      <div class="card-name">${app.name}</div>
      <div class="card-slug">${app.slug}</div>
    `;

    a.addEventListener('click', async (e) => {
      try {
        const res = await fetch(a.href, { method: 'HEAD', cache: 'no-store' });
        if (!res.ok) {
          e.preventDefault();
          showToast(`App "${app.name}" is not available (${res.status}).`);
        }
      } catch {
        /* Network error or CORS: allow navigation to proceed naturally */
      }
    });

    grid.appendChild(a);
  });
}

let activeCat = 'all';

function filter() {
  const q = searchEl.value.toLowerCase().trim();
  const results = APPS.filter(app => {
    const matchCat = activeCat === 'all' || app.cat === activeCat;
    const matchQ = !q || app.name.toLowerCase().includes(q) || app.slug.includes(q) || app.cat.includes(q);
    return matchCat && matchQ;
  });
  renderCards(results);
}

document.querySelectorAll('[data-cat]').forEach(btn => {
  if (!btn.classList.contains('filter-btn')) return;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-cat]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    filter();
  });
});

clearSearchBtn.addEventListener('click', () => {
  searchEl.value = '';
  filter();
  searchEl.focus();
});

searchEl.addEventListener('input', filter);

renderCards(APPS);
</script>
