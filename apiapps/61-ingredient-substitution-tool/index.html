<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingredient Substitution Tool</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=Nunito:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0800;
      --surface: #1a1200;
      --surface2: #251a00;
      --border: rgba(249,115,22,0.2);
      --accent: #f97316;
      --accent2: #84cc16;
      --text: #fef9ee;
      --muted: #a16207;
      --green: #4ade80;
      --red: #f87171;
      --radius: 16px;
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'Nunito', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Layout ── */
    .app-header {
      background: linear-gradient(135deg, var(--surface) 0%, #161829 100%);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(249,115,22,.35);
    }

    .header-text h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .header-text p {
      font-size: .8rem;
      color: var(--muted);
      margin-top: 1px;
    }

    .header-badge {
      margin-left: auto;
      background: rgba(249,115,22,.15);
      border: 1px solid rgba(249,115,22,.35);
      color: var(--accent);
      font-size: .7rem;
      font-weight: 600;
      padding: .25rem .65rem;
      border-radius: 99px;
      letter-spacing: .03em;
    }

    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    /* ── Sidebar ── */
    .sidebar {
      position: sticky;
      top: 90px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }

    .panel-title {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    /* ── Dietary Filters ── */
    .filter-chips {
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }

    .filter-chip {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .5rem .75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: .85rem;
      transition: all .2s ease;
      text-align: left;
      width: 100%;
    }

    .filter-chip:hover {
      border-color: var(--accent);
      background: rgba(249,115,22,.08);
    }

    .filter-chip.active {
      border-color: var(--accent);
      background: rgba(249,115,22,.18);
      color: #ffd4b0;
    }

    .filter-chip .chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Unit Converter ── */
    .converter-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: .5rem;
      align-items: center;
    }

    .converter-grid select,
    .converter-grid input {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: .45rem .6rem;
      font-size: .85rem;
      width: 100%;
    }

    .converter-grid select:focus,
    .converter-grid input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(249,115,22,.2);
    }

    .converter-arrow {
      color: var(--accent);
      font-size: 1rem;
      text-align: center;
    }

    .converter-result {
      margin-top: .75rem;
      padding: .6rem .75rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: .9rem;
      color: var(--green);
      font-weight: 600;
      min-height: 2.2rem;
      display: flex;
      align-items: center;
    }

    .converter-amount {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: .45rem .6rem;
      font-size: .85rem;
      width: 100%;
      margin-bottom: .5rem;
    }

    .converter-amount:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* ── Content area ── */
    .content { display: flex; flex-direction: column; gap: 1.25rem; }

    /* ── Tabs ── */
    .tab-row {
      display: flex;
      gap: .5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .4rem;
    }

    .tab-btn {
      flex: 1;
      padding: .55rem 1rem;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: .85rem;
      font-weight: 600;
      transition: all .2s ease;
    }

    .tab-btn:hover { color: var(--text); background: rgba(255,255,255,.04); }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 12px rgba(249,115,22,.35);
    }

    /* ── Search box ── */
    .search-wrap {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      font-size: 1rem;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: .85rem 1rem .85rem 2.75rem;
      font-size: 1rem;
      transition: border-color .2s, box-shadow .2s;
    }

    .search-input::placeholder { color: var(--muted); }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(249,115,22,.18);
    }

    /* ── Suggestions dropdown ── */
    .suggestions-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      z-index: 50;
      max-height: 220px;
      overflow-y: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
    }

    .suggestion-item {
      padding: .6rem 1rem;
      cursor: pointer;
      font-size: .9rem;
      transition: background .15s;
      display: flex;
      align-items: center;
      gap: .6rem;
    }

    .suggestion-item:hover, .suggestion-item.focused {
      background: rgba(249,115,22,.15);
      color: #c4bfff;
    }

    .suggestion-item .s-icon { color: var(--muted); font-size: .85rem; }

    /* ── Reverse lookup ── */
    .reverse-inputs {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      padding: .75rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-height: 3.5rem;
      align-items: center;
    }

    .tag-chip {
      display: flex;
      align-items: center;
      gap: .4rem;
      background: rgba(249,115,22,.2);
      border: 1px solid rgba(249,115,22,.4);
      color: #ffd4b0;
      padding: .3rem .65rem;
      border-radius: 6px;
      font-size: .82rem;
      font-weight: 600;
    }

    .tag-chip button {
      background: none;
      border: none;
      color: var(--accent2);
      cursor: pointer;
      font-size: .9rem;
      line-height: 1;
      padding: 0;
    }

    .reverse-type-input {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: .9rem;
      outline: none;
      flex: 1;
      min-width: 120px;
    }

    .reverse-type-input::placeholder { color: var(--muted); }

    /* ── Results ── */
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .results-count {
      font-size: .82rem;
      color: var(--muted);
    }

    .results-count strong { color: var(--accent); }

    /* ── Ingredient card ── */
    .ingredient-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color .2s, transform .2s;
      animation: fadeSlideIn .3s ease both;
    }

    .ingredient-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: .75rem;
      cursor: pointer;
      user-select: none;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    .card-header:hover { background: #262a3e; }

    .card-emoji {
      font-size: 1.6rem;
      flex-shrink: 0;
    }

    .card-meta { flex: 1; }

    .card-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .card-category {
      font-size: .75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .card-tags {
      display: flex;
      gap: .35rem;
      flex-wrap: wrap;
      margin-top: .35rem;
    }

    .diet-tag {
      font-size: .65rem;
      font-weight: 700;
      padding: .15rem .45rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .diet-vegan    { background: rgba(67,217,173,.18); color: var(--green); border: 1px solid rgba(67,217,173,.3); }
    .diet-gf       { background: rgba(247,201,72,.15); color: var(--yellow); border: 1px solid rgba(247,201,72,.3); }
    .diet-df       { background: rgba(249,115,22,.18); color: #ffd4b0; border: 1px solid rgba(249,115,22,.3); }
    .diet-ef       { background: rgba(132,204,22,.15); color: #c8f07a; border: 1px solid rgba(132,204,22,.3); }

    .card-chevron {
      color: var(--muted);
      font-size: .85rem;
      transition: transform .25s;
    }

    .card-chevron.open { transform: rotate(180deg); }

    .card-body {
      padding: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height .35s ease, padding .25s ease;
    }

    .card-body.open {
      max-height: 2000px;
      padding: 1.25rem;
    }

    .subs-label {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: .75rem;
    }

    .sub-list { display: flex; flex-direction: column; gap: .75rem; }

    .sub-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .9rem 1rem;
      transition: border-color .2s;
    }

    .sub-item:hover { border-color: rgba(249,115,22,.4); }

    .sub-item-top {
      display: flex;
      align-items: center;
      gap: .75rem;
      flex-wrap: wrap;
    }

    .sub-name {
      font-weight: 700;
      font-size: .95rem;
      color: var(--text);
      flex: 1;
    }

    .sub-ratio {
      background: rgba(249,115,22,.2);
      border: 1px solid rgba(249,115,22,.35);
      color: #ffd4b0;
      font-size: .78rem;
      font-weight: 700;
      padding: .2rem .6rem;
      border-radius: 6px;
      white-space: nowrap;
    }

    .flavor-badge {
      font-size: .7rem;
      font-weight: 700;
      padding: .18rem .5rem;
      border-radius: 5px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .flavor-neutral    { background: rgba(67,217,173,.15); color: var(--green); border: 1px solid rgba(67,217,173,.3); }
    .flavor-mild       { background: rgba(247,201,72,.15); color: var(--yellow); border: 1px solid rgba(247,201,72,.3); }
    .flavor-significant { background: rgba(132,204,22,.15); color: #c8f07a; border: 1px solid rgba(132,204,22,.3); }

    .sub-notes {
      margin-top: .5rem;
      font-size: .82rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .sub-bestfor {
      margin-top: .4rem;
      font-size: .78rem;
      color: var(--muted);
    }

    .sub-bestfor strong { color: var(--accent); font-weight: 600; }

    .sub-diets {
      display: flex;
      gap: .35rem;
      flex-wrap: wrap;
      margin-top: .5rem;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--muted);
    }

    .empty-icon { font-size: 3rem; margin-bottom: .75rem; opacity: .6; }
    .empty-state h3 { color: var(--text); font-size: 1.1rem; margin-bottom: .5rem; }
    .empty-state p  { font-size: .9rem; }

    /* ── Reverse results ── */
    .reverse-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      transition: border-color .2s;
      animation: fadeSlideIn .3s ease both;
    }

    .reverse-card:hover { border-color: var(--accent); }

    .reverse-match-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: .6rem;
    }

    .reverse-match-name { font-weight: 700; font-size: 1rem; }

    .match-score {
      margin-left: auto;
      font-size: .75rem;
      font-weight: 700;
      color: var(--green);
    }

    .reverse-match-subs {
      font-size: .82rem;
      color: var(--muted);
    }

    .reverse-match-subs span {
      color: #c4bfff;
      font-weight: 600;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ── Animations ── */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    .loading-dots span {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      margin: 0 2px;
      animation: pulse .9s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: .15s; }
    .loading-dots span:nth-child(3) { animation-delay: .3s; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: static;
      }
    }

    /* ── Tooltip ── */
    [data-tip] {
      position: relative;
      cursor: help;
    }
    [data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: var(--text);
      font-size: .72rem;
      padding: .3rem .6rem;
      border-radius: 5px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s;
      border: 1px solid var(--border);
      z-index: 200;
    }
    [data-tip]:hover::after { opacity: 1; }

    /* === Food v2 Design System === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      line-height: 1.6;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 800px 600px at 20% 10%, rgba(249,115,22,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 600px 400px at 80% 80%, rgba(132,204,22,0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    body > * { position: relative; z-index: 1; }

    h1, h2, .title, .app-title, .card-title, .name, label { font-family: var(--font-display); }

    h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 700; color: var(--accent); letter-spacing: -0.02em; }
    h2 { font-size: clamp(1.2rem, 2.5vw, 1.6rem); font-weight: 400; font-style: italic; }
    h3 { font-size: 1rem; font-weight: 700; font-family: var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

    .container, main, .wrapper, .app { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }

    .card, .result, .item, .recipe, .info-box, .box, .panel, .section, .alcohol-card,
    [class*="card"], [class*="result"], [class*="item"] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 4px 24px rgba(249,115,22,0.08);
      animation: warmFade 0.5s cubic-bezier(.34,1.56,.64,1) both;
    }

    input, select, textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 0.75rem 1rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(249,115,22,0.15);
    }

    button, .btn, input[type="submit"], input[type="button"] {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 0.75rem 2rem;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button:hover, .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(249,115,22,0.4);
    }
    button:active { transform: scale(0.96); }

    .tag, .badge, .pill, .category, .allergen, .label, li.tag {
      display: inline-block;
      background: rgba(249,115,22,0.15);
      border: 1px solid rgba(249,115,22,0.3);
      color: var(--accent);
      border-radius: 999px;
      padding: 0.2rem 0.75rem;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .positive, .safe, .good, .match, .compatible { color: var(--green); }
    .negative, .danger, .alert, .incompatible { color: var(--red); }

    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { padding: 0.6rem 1rem; background: var(--surface2); color: var(--muted); text-align: left; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.75rem; }
    td { padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); }
    tr:hover td { background: rgba(249,115,22,0.04); }

    .nutrition-label, .label-box {
      border: 3px solid var(--text);
      border-radius: 4px;
      padding: 1rem;
      font-family: var(--font-body);
      background: var(--surface);
    }

    @keyframes warmFade {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: none; }
    }

    @keyframes warmGlow {
      0%, 100% { box-shadow: 0 0 8px rgba(249,115,22,0.3); }
      50% { box-shadow: 0 0 20px rgba(249,115,22,0.6); }
    }

    button[type="submit"], .primary { animation: warmGlow 2.5s ease infinite; }
  </style>
</head>
<body>

<header class="app-header" role="banner">
  <div class="logo-icon" aria-hidden="true">🔄</div>
  <div class="header-text">
    <h1>Ingredient Substitution Tool</h1>
    <p>120+ ingredients · dietary filters · unit converter · offline</p>
  </div>
  <span class="header-badge">OFFLINE</span>
</header>

<main class="main-container" role="main">

  <!-- ── Sidebar ── -->
  <aside class="sidebar" aria-label="Filters and converter">

    <!-- Dietary filters -->
    <div class="panel">
      <p class="panel-title">Dietary Filters</p>
      <div class="filter-chips" role="group" aria-label="Dietary restriction filters">
        <button class="filter-chip" data-filter="vegan" aria-pressed="false">
          <span class="chip-dot" style="background:var(--green)"></span>
          Vegan
        </button>
        <button class="filter-chip" data-filter="gf" aria-pressed="false">
          <span class="chip-dot" style="background:var(--yellow)"></span>
          Gluten-Free
        </button>

// All conversions to a base unit (ml for volume, g for weight)
const UNIT_ML = {
  tsp: 4.92892,
  tbsp: 14.7868,
  floz: 29.5735,
  cup: 236.588,
  pt: 473.176,
  qt: 946.353,
  gal: 3785.41,
  ml: 1,
  l: 1000,
};
const UNIT_G = {
  oz: 28.3495,
  lb: 453.592,
  g: 1,
  kg: 1000,
};

function convert(amount, fromUnit, toUnit) {
  if (fromUnit === toUnit) return amount;
  if (UNIT_ML[fromUnit] !== undefined && UNIT_ML[toUnit] !== undefined) {
    return (amount * UNIT_ML[fromUnit]) / UNIT_ML[toUnit];
  }
  if (UNIT_G[fromUnit] !== undefined && UNIT_G[toUnit] !== undefined) {
    return (amount * UNIT_G[fromUnit]) / UNIT_G[toUnit];
  }
  return null; // Incompatible units
}

function fmtNum(n) {
  if (n === null) return 'Incompatible units';
  if (n >= 1000) return n.toFixed(0);
  if (n >= 100) return n.toFixed(1);
  if (n >= 10) return n.toFixed(2);
  return n.toFixed(4).replace(/\.?0+$/, '');
}

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════

const state = {
  activeFilters: new Set(),
  searchQuery: '',
  reverseTags: [],
  activeTab: 'search',
  openCards: new Set(),
  suggestFocusIdx: -1,
  reverseSuggestFocusIdx: -1,
};

// ═══════════════════════════════════════════════════════════
// DOM REFS
// ═══════════════════════════════════════════════════════════

const $ = id => document.getElementById(id);
const mainSearch     = $('main-search');
const suggestions    = $('suggestions');
const searchResults  = $('search-results');
const searchCount    = $('search-count');
const panelSearch    = $('panel-search');
const panelReverse   = $('panel-reverse');
const reverseInput   = $('reverse-input');
const reverseSuggs   = $('reverse-suggestions');
const reverseTags    = $('reverse-tags');
const reverseResults = $('reverse-results');
const reverseCount   = $('reverse-count');
const convAmount     = $('conv-amount');
const convFrom       = $('conv-from');
const convTo         = $('conv-to');
const convResult     = $('conv-result');
const statIngredients = $('stat-ingredients');
const statSubs        = $('stat-subs');
const statCats        = $('stat-cats');

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════

function dietTagsForIngredient(item) {
  const tagSets = item.substitutes.map(s => new Set(s.dietTags));
  if (!tagSets.length) return item.dietTags;
  return [...item.dietTags];
}

function matchesDietFilter(item) {
  if (state.activeFilters.size === 0) return true;
  // Ingredient has subs matching ALL active filters
  return item.substitutes.some(s =>
    [...state.activeFilters].every(f => s.dietTags.includes(f))
  );
}

function highlightMatch(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), `<mark style="background:rgba(108,99,255,.35);color:#fff;border-radius:3px;padding:0 2px;">$1</mark>`);
}

function flavorClass(impact) {
  if (impact === 'neutral') return 'flavor-neutral';
  if (impact === 'mild') return 'flavor-mild';
  return 'flavor-significant';
}

function flavorLabel(impact) {
  if (impact === 'neutral') return 'Neutral Swap';
  if (impact === 'mild') return 'Mild Change';
  return 'Big Change';
}

function dietTagHtml(tag) {
  const map = {
    vegan: ['diet-vegan', 'Vegan'],
    gf:    ['diet-gf', 'GF'],
    df:    ['diet-df', 'Dairy-Free'],
    ef:    ['diet-ef', 'Egg-Free'],
  };
  if (!map[tag]) return '';
  return `<span class="diet-tag ${map[tag][0]}">${map[tag][1]}</span>`;
}

// ═══════════════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════════════

function renderSubItem(sub, query) {
  const visibleDiets = [...state.activeFilters].length
    ? sub.dietTags.filter(t => state.activeFilters.has(t))
    : sub.dietTags;

  return `
    <div class="sub-item">
      <div class="sub-item-top">
        <span class="sub-name">${highlightMatch(sub.name, query)}</span>
        <span class="sub-ratio" data-tip="How much to use">${sub.ratio}</span>
        <span class="flavor-badge ${flavorClass(sub.flavorImpact)}" data-tip="Flavor impact on your dish">${flavorLabel(sub.flavorImpact)}</span>
      </div>
      <p class="sub-notes">${sub.notes}</p>
      <p class="sub-bestfor"><strong>Best for:</strong> ${sub.bestFor}</p>
      <div class="sub-diets">${sub.dietTags.map(dietTagHtml).join('')}</div>
    </div>
  `;
}

function renderCard(item, query) {
  const isOpen = state.openCards.has(item.id);

  // Filter subs by dietary filters
  let subs = item.substitutes;
  if (state.activeFilters.size > 0) {
    subs = subs.filter(s =>
      [...state.activeFilters].every(f => s.dietTags.includes(f))
    );
  }

  const subsHtml = subs.length
    ? `<div class="sub-list">${subs.map(s => renderSubItem(s, query)).join('')}</div>`
    : `<p style="color:var(--muted);font-size:.85rem;">No substitutes match current filters.</p>`;

  return `
    <article class="ingredient-card" data-id="${item.id}">
      <div class="card-header" data-toggle="${item.id}" role="button" tabindex="0" aria-expanded="${isOpen}" aria-controls="body-${item.id}">
        <span class="card-emoji" aria-hidden="true">${item.emoji}</span>
        <div class="card-meta">
          <div class="card-name">${highlightMatch(item.name, query)}</div>
          <div class="card-category">${item.category} · ${subs.length} substitute${subs.length !== 1 ? 's' : ''}</div>
          <div class="card-tags">${item.dietTags.map(dietTagHtml).join('')}</div>
        </div>
        <span class="card-chevron ${isOpen ? 'open' : ''}" aria-hidden="true">▼</span>
      </div>
      <div class="card-body ${isOpen ? 'open' : ''}" id="body-${item.id}">
        <p class="subs-label">Available Substitutes</p>
        ${subsHtml}
      </div>
    </article>
  `;
}

function renderSearchResults() {
  const q = state.searchQuery.toLowerCase().trim();
  let results = DB;

  if (q) {
    results = DB.filter(item =>
      item.name.toLowerCase().includes(q) ||
      item.category.toLowerCase().includes(q) ||
      item.substitutes.some(s => s.name.toLowerCase().includes(q))
    );
  }

  results = results.filter(matchesDietFilter);

  if (results.length === 0) {
    searchResults.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <h3>No results found</h3>
        <p>Try a different search term or remove some dietary filters.</p>
      </div>
    `;
    searchCount.innerHTML = '';
    return;
  }

  const filterNote = state.activeFilters.size
    ? ` matching <strong>${[...state.activeFilters].join(', ')}</strong> filter(s)`
    : '';
  searchCount.innerHTML = `<strong>${results.length}</strong> ingredient${results.length !== 1 ? 's' : ''}${filterNote}`;

  searchResults.innerHTML = results.map(item => renderCard(item, q)).join('');
}

function renderReverseResults() {
  if (state.reverseTags.length === 0) {
    reverseResults.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔄</div>
        <h3>Add ingredients you have</h3>
        <p>Type ingredients above and press Enter. We'll find what can be substituted.</p>
      </div>
    `;
    reverseCount.innerHTML = '';
    return;
  }

  const tags = state.reverseTags.map(t => t.toLowerCase());

  // Find all DB items where any of the user's ingredients is a substitute for something
  const matches = [];
  for (const item of DB) {
    const matchingSubs = item.substitutes.filter(s =>
      tags.some(t => s.name.toLowerCase().includes(t))
    );
    if (matchingSubs.length > 0) {
      if (state.activeFilters.size === 0 || matchingSubs.some(s =>
        [...state.activeFilters].every(f => s.dietTags.includes(f))
      )) {
        matches.push({ item, matchingSubs, score: matchingSubs.length });
      }
    }
  }

  matches.sort((a, b) => b.score - a.score);

  if (matches.length === 0) {
    reverseResults.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">😕</div>
        <h3>No matches found</h3>
        <p>Your ingredients aren't in our substitutes database for these filters. Try different items.</p>
      </div>
    `;
    reverseCount.innerHTML = '';
    return;
  }

  reverseCount.innerHTML = `<strong>${matches.length}</strong> ingredient${matches.length !== 1 ? 's' : ''} can use your substitutes`;

  reverseResults.innerHTML = matches.map(({ item, matchingSubs }) => `
    <div class="reverse-card">
      <div class="reverse-match-header">
        <span style="font-size:1.4rem" aria-hidden="true">${item.emoji}</span>
        <div>
          <div class="reverse-match-name">${item.name}</div>
          <div style="font-size:.75rem;color:var(--muted);">${item.category}</div>
        </div>
        <span class="match-score">${matchingSubs.length} match${matchingSubs.length !== 1 ? 'es' : ''}</span>
      </div>
      <p class="reverse-match-subs">
        You can substitute using:
        ${matchingSubs.map(s => `<span>${s.name}</span> (${s.ratio})`).join(' · ')}
      </p>
      <div style="margin-top:.5rem;display:flex;gap:.4rem;flex-wrap:wrap;">
        ${matchingSubs.flatMap(s => s.dietTags).filter((v,i,a)=>a.indexOf(v)===i).map(dietTagHtml).join('')}
      </div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════════════════
// SUGGESTIONS
// ═══════════════════════════════════════════════════════════

function getSuggestions(query, limit = 8) {
  if (!query.trim()) return [];
  const q = query.toLowerCase();
  return DB
    .filter(item =>
      item.name.toLowerCase().includes(q) ||
      item.substitutes.some(s => s.name.toLowerCase().includes(q))
    )
    .slice(0, limit);
}

function showSuggestions(items, container, onSelect) {
  if (items.length === 0) {
    container.style.display = 'none';
    return;
  }
  container.innerHTML = items.map((item, i) => `
    <div class="suggestion-item" data-idx="${i}" data-name="${item.name}" role="option">
      <span class="s-icon" aria-hidden="true">${item.emoji}</span>
      ${item.name}
      <span style="margin-left:auto;font-size:.72rem;color:var(--muted);">${item.category}</span>
    </div>
  `).join('');
  container.style.display = 'block';

  container.querySelectorAll('.suggestion-item').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      onSelect(el.dataset.name);
    });
  });
}

function hideSuggestions(container) {
  container.style.display = 'none';
}

// ═══════════════════════════════════════════════════════════
// EVENTS — Search tab
// ═══════════════════════════════════════════════════════════

mainSearch.addEventListener('input', () => {
  state.searchQuery = mainSearch.value;
  state.suggestFocusIdx = -1;
  const suggs = getSuggestions(mainSearch.value);
  showSuggestions(suggs, suggestions, name => {
    mainSearch.value = name;
    state.searchQuery = name;
    hideSuggestions(suggestions);
    mainSearch.setAttribute('aria-expanded', 'false');
    renderSearchResults();
  });
  mainSearch.setAttribute('aria-expanded', suggs.length > 0 ? 'true' : 'false');
  renderSearchResults();
});

mainSearch.addEventListener('keydown', e => {
  const items = suggestions.querySelectorAll('.suggestion-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    state.suggestFocusIdx = Math.min(state.suggestFocusIdx + 1, items.length - 1);
    updateSuggestFocus(items, state.suggestFocusIdx);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    state.suggestFocusIdx = Math.max(state.suggestFocusIdx - 1, -1);
    updateSuggestFocus(items, state.suggestFocusIdx);
  } else if (e.key === 'Enter' && state.suggestFocusIdx >= 0) {
    e.preventDefault();
    const focused = items[state.suggestFocusIdx];
    if (focused) {
      mainSearch.value = focused.dataset.name;
      state.searchQuery = focused.dataset.name;
      hideSuggestions(suggestions);
      state.suggestFocusIdx = -1;
      renderSearchResults();
    }
  } else if (e.key === 'Escape') {
    hideSuggestions(suggestions);
    state.suggestFocusIdx = -1;
  }
});

mainSearch.addEventListener('blur', () => {
  setTimeout(() => hideSuggestions(suggestions), 150);
});

function updateSuggestFocus(items, idx) {
  items.forEach((el, i) => el.classList.toggle('focused', i === idx));
  if (idx >= 0 && items[idx]) {
    mainSearch.value = items[idx].dataset.name;
  }
}

// ═══════════════════════════════════════════════════════════
// EVENTS — Reverse tab
// ═══════════════════════════════════════════════════════════

reverseInput.addEventListener('input', () => {
  const q = reverseInput.value;
  state.reverseSuggestFocusIdx = -1;
  const suggs = getSuggestions(q, 6);
  showSuggestions(suggs, reverseSuggs, name => {
    addReverseTag(name);
    reverseInput.value = '';
    hideSuggestions(reverseSuggs);
  });
});

reverseInput.addEventListener('keydown', e => {
  const items = reverseSuggs.querySelectorAll('.suggestion-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    state.reverseSuggestFocusIdx = Math.min(state.reverseSuggestFocusIdx + 1, items.length - 1);
    updateReverseFocus(items, state.reverseSuggestFocusIdx);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    state.reverseSuggestFocusIdx = Math.max(state.reverseSuggestFocusIdx - 1, -1);
    updateReverseFocus(items, state.reverseSuggestFocusIdx);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (state.reverseSuggestFocusIdx >= 0 && items[state.reverseSuggestFocusIdx]) {
      addReverseTag(items[state.reverseSuggestFocusIdx].dataset.name);
    } else if (reverseInput.value.trim()) {
      addReverseTag(reverseInput.value.trim());
    }
    reverseInput.value = '';
    hideSuggestions(reverseSuggs);
    state.reverseSuggestFocusIdx = -1;
  } else if (e.key === 'Backspace' && reverseInput.value === '' && state.reverseTags.length > 0) {
    state.reverseTags.pop();
    renderTagChips();
    renderReverseResults();
  } else if (e.key === 'Escape') {
    hideSuggestions(reverseSuggs);
  }
});

reverseInput.addEventListener('blur', () => {
  setTimeout(() => hideSuggestions(reverseSuggs), 150);
});

function updateReverseFocus(items, idx) {
  items.forEach((el, i) => el.classList.toggle('focused', i === idx));
  if (idx >= 0 && items[idx]) {
    reverseInput.value = items[idx].dataset.name;
  }
}

function addReverseTag(name) {
  if (!name || state.reverseTags.includes(name)) return;
  state.reverseTags.push(name);
  renderTagChips();
  renderReverseResults();
}

function removeReverseTag(name) {
  state.reverseTags = state.reverseTags.filter(t => t !== name);
  renderTagChips();
  renderReverseResults();
}

function renderTagChips() {
  // Remove existing chips
  reverseTags.querySelectorAll('.tag-chip').forEach(el => el.remove());
  // Add new ones before the input
  state.reverseTags.forEach(tag => {
    const chip = document.createElement('div');
    chip.className = 'tag-chip';
    chip.innerHTML = `${tag}<button aria-label="Remove ${tag}">×</button>`;
    chip.querySelector('button').addEventListener('click', () => removeReverseTag(tag));
    reverseTags.insertBefore(chip, reverseInput);
  });
}

// ═══════════════════════════════════════════════════════════
// EVENTS — Card toggle
// ═══════════════════════════════════════════════════════════

function setupCardToggle(container) {
  container.addEventListener('click', e => {
    const toggle = e.target.closest('[data-toggle]');
    if (!toggle) return;
    const id = toggle.dataset.toggle;
    if (state.openCards.has(id)) {
      state.openCards.delete(id);
    } else {
      state.openCards.add(id);
    }
    // Update just this card's state without re-rendering everything
    const card = container.querySelector(`[data-id="${id}"]`);
    if (card) {
      const body = card.querySelector('.card-body');
      const chevron = card.querySelector('.card-chevron');
      const isNowOpen = state.openCards.has(id);
      body.classList.toggle('open', isNowOpen);
      chevron.classList.toggle('open', isNowOpen);
      toggle.setAttribute('aria-expanded', String(isNowOpen));
    }
  });

  container.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      const toggle = e.target.closest('[data-toggle]');
      if (toggle) {
        e.preventDefault();
        toggle.click();
      }
    }
  });
}

setupCardToggle(searchResults);

// ═══════════════════════════════════════════════════════════
// EVENTS — Tabs
// ═══════════════════════════════════════════════════════════

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    state.activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab);
      b.setAttribute('aria-selected', String(b.dataset.tab === tab));
    });
    panelSearch.style.display = tab === 'search' ? 'block' : 'none';
    panelReverse.style.display = tab === 'reverse' ? 'block' : 'none';
  });
});

// ═══════════════════════════════════════════════════════════
// EVENTS — Dietary filters
// ═══════════════════════════════════════════════════════════

document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const filter = chip.dataset.filter;
    if (state.activeFilters.has(filter)) {
      state.activeFilters.delete(filter);
      chip.classList.remove('active');
      chip.setAttribute('aria-pressed', 'false');
    } else {
      state.activeFilters.add(filter);
      chip.classList.add('active');
      chip.setAttribute('aria-pressed', 'true');
    }
    renderSearchResults();
    if (state.reverseTags.length > 0) renderReverseResults();
  });
});

// ═══════════════════════════════════════════════════════════
// EVENTS — Unit converter
// ═══════════════════════════════════════════════════════════

function updateConverter() {
  const amount = parseFloat(convAmount.value);
  const from = convFrom.value;
  const to = convTo.value;
  if (isNaN(amount)) {
    convResult.textContent = '—';
    return;
  }
  const result = convert(amount, from, to);
  if (result === null) {
    convResult.textContent = 'Incompatible unit types';
    convResult.style.color = 'var(--accent2)';
  } else {
    convResult.textContent = `${fmtNum(result)} ${to}`;
    convResult.style.color = 'var(--green)';
  }
}

convAmount.addEventListener('input', updateConverter);
convFrom.addEventListener('change', updateConverter);
convTo.addEventListener('change', updateConverter);

// ═══════════════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════════════

function updateStats() {
  statIngredients.textContent = DB.length;
  const totalSubs = DB.reduce((sum, item) => sum + item.substitutes.length, 0);
  statSubs.textContent = totalSubs;
  const cats = new Set(DB.map(i => i.category));
  statCats.textContent = cats.size;
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════

updateStats();
updateConverter();
renderSearchResults();
renderReverseResults();
</script>
</body>
</html>
