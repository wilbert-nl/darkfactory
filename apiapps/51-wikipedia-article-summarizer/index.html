<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WikiBrief — Wikipedia Research Summarizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Stat-Led · nav: N1b */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: clip; }
body { overflow-x: clip; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-size: var(--text-base); line-height: 1.5; -webkit-font-smoothing: antialiased; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

/* ── Local color tokens (no raw values outside :root) ── */
:root {
  --color-warn-bg:      color-mix(in oklch, var(--color-warn)    12%, transparent);
  --color-warn-border:  color-mix(in oklch, var(--color-warn)    35%, transparent);
  --color-danger-bg:    color-mix(in oklch, var(--color-danger)   8%, transparent);
  --color-danger-border:color-mix(in oklch, var(--color-danger)  28%, transparent);
  --color-success-bg:   color-mix(in oklch, var(--color-success)  8%, transparent);
  --color-ink-shadow:   color-mix(in oklch, var(--color-ink)     20%, transparent);
  --color-accent-shadow:color-mix(in oklch, var(--color-accent)  15%, transparent);
}

:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

/* ── N1b Nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 56px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 var(--space-6);
}

.nav-left  { display: flex; align-items: center; }
.nav-right { display: flex; align-items: center; justify-content: flex-end; }

.nav-wordmark {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  white-space: nowrap;
  transition: opacity 0.15s var(--ease-out);
}
.nav-wordmark:hover { opacity: 0.75; }
.nav-wordmark span { color: var(--color-accent); }

.nav-center {
  display: flex;
  align-items: center;
  gap: var(--space-6);
}

.nav-link {
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-ink-muted);
  white-space: nowrap;
  cursor: pointer;
  padding: var(--space-1) 0;
  border-bottom: 2px solid transparent;
  transition: color 0.15s var(--ease-out), border-color 0.15s var(--ease-out);
}
.nav-link:hover { color: var(--color-ink); }
.nav-link:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.nav-link[aria-current="page"] {
  color: var(--color-ink);
  border-bottom-color: var(--color-accent);
}

.btn-all-apps {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-1) var(--space-3);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-ink-muted);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  white-space: nowrap;
  cursor: pointer;
  transition: color 0.15s var(--ease-out), border-color 0.15s var(--ease-out), background 0.15s var(--ease-out);
}
.btn-all-apps:hover  { color: var(--color-ink); border-color: var(--color-ink-muted); background: var(--color-paper-2); }
.btn-all-apps:active { background: var(--color-paper-3); }

/* ── Page layout ── */
.page-wrap {
  max-width: 860px;
  margin: 0 auto;
  padding: calc(56px + var(--space-16)) var(--space-6) var(--space-16);
}

/* ── Stat hero ── */
.stat-hero {
  text-align: center;
  padding: var(--space-8) 0 var(--space-6);
}

.hero-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.1em;
  color: var(--color-ink-muted);
  margin-bottom: var(--space-3);
}

.hero-article-title {
  font-family: var(--font-display);
  font-size: clamp(3.5rem, 9vw, 7rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.0;
  color: var(--color-ink);
  word-break: break-word;
  min-height: 1.05em;
  transition: color 0.2s var(--ease-out);
}
.hero-article-title.is-placeholder { color: var(--color-border); }

.hero-article-desc {
  margin-top: var(--space-3);
  font-size: var(--text-base);
  color: var(--color-ink-muted);
  max-width: 560px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.5;
  min-height: 1.5em;
}

.hero-wiki-link {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  margin-top: var(--space-3);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-accent);
  border: 1px solid var(--color-accent-line);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-3);
  transition: background 0.12s var(--ease-out);
}
.hero-wiki-link:hover  { background: var(--color-accent-subtle); }
.hero-wiki-link:active { opacity: 0.8; }

/* ── Sub-metrics row ── */
.metrics-row {
  display: flex;
  justify-content: center;
  gap: var(--space-10);
  padding: var(--space-6) 0;
  flex-wrap: wrap;
}

.metric-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-1);
  min-width: 60px;
}

.metric-val {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 600;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  line-height: 1;
}

.metric-label {
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-ink-muted);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.section-divider {
  border: none;
  border-top: 1px solid var(--color-border);
  margin: 0 0 var(--space-8);
}

/* ── Controls row ── */
.controls-row {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  margin-bottom: var(--space-8);
}

.search-wrap {
  flex: 1;
  position: relative;
}

.search-input {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  padding-right: 2.5rem;
  transition: border-color 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out);
}
.search-input:hover { border-color: var(--color-ink-muted); }
.search-input:focus {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px var(--color-accent-shadow);
}
.search-input::placeholder { color: var(--color-ink-muted); }

.search-clear {
  position: absolute;
  right: var(--space-3);
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--color-ink-muted);
  cursor: pointer;
  font-size: var(--text-base);
  line-height: 1;
  padding: var(--space-1);
  display: none;
  border-radius: var(--radius-sm);
  transition: color 0.12s var(--ease-out), background 0.12s var(--ease-out);
}
.search-clear:hover  { color: var(--color-ink); background: var(--color-paper-2); }
.search-clear:active { background: var(--color-paper-3); }
.search-clear.visible { display: block; }

.btn-search {
  flex-shrink: 0;
  padding: var(--space-3) var(--space-6);
  background: var(--color-accent);
  color: var(--color-paper);
  font-family: var(--font-body);
  font-size: var(--text-base);
  font-weight: 600;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.15s var(--ease-out), transform 0.12s var(--ease-out);
}
.btn-search:hover          { opacity: 0.88; transform: translateY(-1px); }
.btn-search:active         { transform: translateY(0); }
.btn-search:focus-visible  { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.btn-search:disabled       { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ── Autocomplete dropdown ── */
.ac-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  z-index: 300;
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 32px var(--color-ink-shadow);
  overflow: hidden;
  display: none;
}
.ac-dropdown.open { display: block; animation: ac-in 0.12s var(--ease-out); }

@keyframes ac-in {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.ac-item {
  padding: var(--space-2) var(--space-3);
  font-size: var(--text-sm);
  color: var(--color-ink);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  border-bottom: 1px solid var(--color-border);
  transition: background 0.1s var(--ease-out);
}
.ac-item:last-child { border-bottom: none; }
.ac-item:hover,
.ac-item.focused { background: var(--color-accent-subtle); color: var(--color-accent); }

.ac-item-icon { font-size: 0.8rem; color: var(--color-ink-muted); flex-shrink: 0; }

/* ── Empty state ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 200px;
  text-align: center;
  gap: var(--space-3);
  padding: var(--space-8);
}

.empty-illustration { font-size: 3rem; line-height: 1; opacity: 0.3; }

.empty-title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  color: var(--color-ink-muted);
  letter-spacing: -0.01em;
}

.empty-sub {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  max-width: 400px;
  line-height: 1.6;
}

/* ── Loading skeleton ── */
.skeleton-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  animation: pulse-fade 1.4s ease-in-out infinite;
}

@keyframes pulse-fade {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.5; }
}

.skeleton-block {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.skeleton-header {
  height: 100px;
  background: linear-gradient(90deg, var(--color-paper-2) 0%, var(--color-paper-3) 50%, var(--color-paper-2) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.6s ease-in-out infinite;
}

.skeleton-body {
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.skeleton-line { height: 13px; border-radius: 4px; background: var(--color-border); }
.skeleton-line.w-80 { width: 80%; }
.skeleton-line.w-60 { width: 60%; }
.skeleton-line.w-40 { width: 40%; }

@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ── Research brief ── */
.brief {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  animation: brief-in 0.25s var(--ease-out);
}

@keyframes brief-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Actions row */
.actions-row {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.btn-action {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  border-radius: var(--radius-md);
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.12s var(--ease-out), opacity 0.12s var(--ease-out), background 0.12s var(--ease-out), border-color 0.12s var(--ease-out), color 0.12s var(--ease-out);
}
.btn-action:hover         { transform: translateY(-1px); }
.btn-action:active        { transform: translateY(0); }
.btn-action:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

.btn-action-primary { background: var(--color-accent); color: var(--color-paper); border: none; }
.btn-action-primary:hover { opacity: 0.88; }

.btn-action-ghost { background: var(--color-paper); color: var(--color-ink); border: 1px solid var(--color-border); }
.btn-action-ghost:hover { border-color: var(--color-accent-line); background: var(--color-accent-subtle); color: var(--color-accent); }

.btn-action-ghost.copied {
  border-color: var(--color-success);
  color: var(--color-success);
  background: var(--color-success-bg);
}

/* Article header card */
.article-header-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  display: flex;
  gap: var(--space-5);
  align-items: flex-start;
}

.article-thumb-wrap { flex-shrink: 0; }

.article-thumb {
  width: 100px;
  height: 75px;
  object-fit: cover;
  border-radius: var(--radius-md);
  display: block;
}

.article-thumb-placeholder {
  width: 100px;
  height: 75px;
  border-radius: var(--radius-md);
  background: var(--color-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
}

.article-header-body { flex: 1; min-width: 0; }

.article-title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 500;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  line-height: 1.2;
  margin-bottom: var(--space-1);
}

.article-description {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  margin-bottom: var(--space-3);
  line-height: 1.5;
}

.article-header-meta {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.wiki-link {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-accent);
  border: 1px solid var(--color-accent-line);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-3);
  transition: background 0.12s var(--ease-out);
}
.wiki-link:hover  { background: var(--color-accent-subtle); }
.wiki-link:active { opacity: 0.8; }

.meta-badge {
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-ink-muted);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-3);
}

/* Disambiguation */
.disambiguation-notice {
  background: var(--color-warn-bg);
  border: 1px solid var(--color-warn-border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
}

.disambiguation-notice h3 {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 500;
  color: var(--color-warn);
  margin-bottom: var(--space-2);
}

.disambiguation-notice p {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  margin-bottom: var(--space-4);
}

.disambiguation-list { display: flex; flex-direction: column; gap: var(--space-2); list-style: none; }

.disambiguation-list li a {
  display: block;
  padding: var(--space-2) var(--space-3);
  font-size: var(--text-sm);
  color: var(--color-accent);
  border: 1px solid var(--color-accent-line);
  border-radius: var(--radius-sm);
  background: var(--color-paper);
  cursor: pointer;
  transition: background 0.12s var(--ease-out);
}
.disambiguation-list li a:hover         { background: var(--color-accent-subtle); }
.disambiguation-list li a:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* Error card */
.error-card {
  background: var(--color-danger-bg);
  border: 1px solid var(--color-danger-border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  display: flex;
  align-items: flex-start;
  gap: var(--space-4);
}

.error-icon { font-size: 1.5rem; flex-shrink: 0; }

.error-body h3 {
  font-size: var(--text-base);
  font-weight: 600;
  color: var(--color-danger);
  margin-bottom: var(--space-1);
}

.error-body p { font-size: var(--text-sm); color: var(--color-ink-muted); line-height: 1.55; }

/* Brief sections grid */
.brief-sections {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
}

.brief-card {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.brief-card.full-width { grid-column: 1 / -1; }

.brief-card-head {
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  background: var(--color-paper-2);
}

.brief-card-title {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.07em;
  border-left: 2px solid var(--color-accent);
  padding-left: var(--space-2);
  color: var(--color-ink-muted);
}

.brief-card-body { padding: var(--space-4); }

/* Summary */
.summary-text { font-size: var(--text-sm); color: var(--color-ink); line-height: 1.7; }

.summary-truncated { display: block; }
.summary-full { display: none; }
.summary-full.expanded { display: block; }
.summary-truncated.hidden { display: none; }

.btn-read-more {
  display: inline-block;
  margin-top: var(--space-2);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-accent);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  transition: opacity 0.12s var(--ease-out);
}
.btn-read-more:hover         { opacity: 0.7; }
.btn-read-more:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* Key facts */
.key-facts-list { display: flex; flex-direction: column; gap: var(--space-2); list-style: none; }

.key-fact-item {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  background: var(--color-paper-2);
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  color: var(--color-ink);
  line-height: 1.5;
  border-left: 2px solid var(--color-accent-line);
}

.key-fact-item::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--color-accent);
  flex-shrink: 0;
  margin-top: 6px;
}

.no-data { font-size: var(--text-sm); color: var(--color-ink-muted); }

/* Chips */
.chips-wrap { display: flex; flex-wrap: wrap; gap: var(--space-2); }

.chip {
  display: inline-block;
  padding: var(--space-1) var(--space-3);
  font-size: var(--text-xs);
  font-weight: 500;
  border-radius: 20px;
  border: 1px solid var(--color-border);
  background: var(--color-paper-2);
  color: var(--color-ink);
  cursor: pointer;
  transition: border-color 0.12s var(--ease-out), color 0.12s var(--ease-out), background 0.12s var(--ease-out);
}
.chip:hover         { border-color: var(--color-accent-line); color: var(--color-accent); background: var(--color-accent-subtle); }
.chip:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.chip:active        { opacity: 0.8; }

.chip-category { border-color: var(--color-accent-line); background: var(--color-accent-subtle); color: var(--color-accent); }
.chip-category:hover { background: var(--color-accent-subtle); border-color: var(--color-accent); }

/* ── History section ── */
.history-section { max-width: 640px; margin: 0 auto; }

.history-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-5);
}

.history-section-title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 500;
  color: var(--color-ink);
  letter-spacing: -0.02em;
}

.btn-clear-history {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  background: none;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-1) var(--space-3);
  cursor: pointer;
  transition: color 0.12s var(--ease-out), border-color 0.12s var(--ease-out);
}
.btn-clear-history:hover         { color: var(--color-danger); border-color: var(--color-danger-border); }
.btn-clear-history:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.btn-clear-history:active        { opacity: 0.8; }

.history-list { display: flex; flex-direction: column; gap: var(--space-2); }

.history-item {
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  cursor: pointer;
  border: 1px solid var(--color-border);
  border-left: 3px solid transparent;
  transition: background 0.12s var(--ease-out), border-color 0.12s var(--ease-out);
}
.history-item:hover         { background: var(--color-paper-2); border-left-color: var(--color-accent-line); }
.history-item:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.history-item:active        { background: var(--color-paper-3); }
.history-item.active        { background: var(--color-paper-2); border-left-color: var(--color-accent); }

.history-item-title {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.history-item-desc {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

.history-empty {
  padding: var(--space-8);
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  text-align: center;
  line-height: 1.6;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 600;
  background: var(--color-ink);
  color: var(--color-paper);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px var(--color-ink-shadow);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s var(--ease-out), transform 0.2s var(--ease-out);
  pointer-events: none;
}
.toast.show    { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--color-success); }
.toast.error   { background: var(--color-danger); }

/* ── Mobile ── */
@media (max-width: 640px) {
  .nav-center { gap: var(--space-4); }

  .hero-article-title { font-size: clamp(2.5rem, 11vw, 5rem); }

  .metrics-row { gap: var(--space-5); }

  .controls-row { flex-direction: column; }
  .btn-search   { width: 100%; }

  .article-header-card { flex-direction: column; }
  .article-thumb,
  .article-thumb-placeholder { width: 100%; height: 140px; }

  .brief-sections { grid-template-columns: 1fr; }
  .brief-card.full-width { grid-column: 1; }
}

@media (max-width: 400px) {
  .nav-wordmark { font-size: var(--text-base); }
  .page-wrap    { padding-left: var(--space-4); padding-right: var(--space-4); }
}

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  .brief         { animation: none; }
  .skeleton-wrap { animation: none; }
  .skeleton-header { animation: none; }
  .btn-search:hover,
  .btn-action:hover { transform: none; }
  .toast { transition: opacity 0.15s var(--ease-out); transform: translateY(0); }
}
</style>
</head>
<body>

<!-- N1b Nav -->
<nav class="nav" aria-label="Application navigation">
  <div class="nav-left">
    <a href="index.html" class="nav-wordmark">Wiki<span>Brief</span></a>
  </div>
  <div class="nav-center">

</nav>

<div class="page-wrap">

  <!-- Overview section (default visible) -->
  <div id="overviewSection">

    <!-- Stat hero -->
    <section class="stat-hero" aria-label="Current article">

      <div class="hero-article-title is-placeholder" id="heroArticleTitle" aria-live="polite">—</div>
      <p class="hero-article-desc" id="heroArticleDesc"></p>
      <a href="#" class="hero-wiki-link" id="heroWikiLink" target="_blank" rel="noopener noreferrer" style="display:none" aria-label="Open full article on Wikipedia">Wikipedia ↗</a>
    </section>

    <!-- Sub-metrics row -->
    <div class="metrics-row" role="region" aria-label="Article metrics">
      <div class="metric-item">
        <span class="metric-val" id="metricFacts">—</span>
        <span class="metric-label">Key Facts</span>
      </div>
      <div class="metric-item">
        <span class="metric-val" id="metricCats">—</span>
        <span class="metric-label">Categories</span>
      </div>
      <div class="metric-item">
        <span class="metric-val" id="metricRelated">—</span>
        <span class="metric-label">Related Topics</span>
      </div>
      <div class="metric-item">
        <span class="metric-val" id="metricWords">—</span>
        <span class="metric-label">Words</span>
      </div>
    </div>

    <hr class="section-divider">

    <!-- Controls -->
    <div class="controls-row">
      <div class="search-wrap">
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="e.g. Marie Curie, Quantum computing, Ancient Rome…"
          aria-label="Search Wikipedia articles"
          autocomplete="off"
        >
        <button class="search-clear" id="searchClear" aria-label="Clear search">×</button>
        <div class="ac-dropdown" id="acDropdown" role="listbox" aria-label="Article suggestions"></div>
      </div>
      <button class="btn-search" id="btnSearch">Summarize</button>
    </div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState" role="status">
      <div class="empty-illustration" aria-hidden="true">📖</div>
      <p class="empty-title">Search to begin</p>
      <p class="empty-sub">Enter any Wikipedia topic to generate a structured research brief with key facts, categories, and related articles.</p>
    </div>

    <!-- Content area (brief / loading / error) -->
    <div id="contentArea" style="display:none"></div>

  </div>

  <!-- History section (hidden by default) -->
  <div id="historySection" hidden>
    <div class="history-section">
      <div class="history-section-head">
        <h2 class="history-section-title">Recent Lookups</h2>
        <button class="btn-clear-history" id="btnClearHistory" aria-label="Clear all history">Clear all</button>
      </div>
      <div class="history-list" id="historyList" role="list" aria-label="Lookup history"></div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

<script>
'use strict';

// ── Constants ─────────────────────────────────────────────────
const STORAGE_KEY = 'wikibrief_history';
const MAX_HISTORY = 10;
const AC_LIMIT    = 8;
const AC_DEBOUNCE = 400;

const API = {
  summary:  t => `https://en.wikipedia.org/api/rest_v1/page/summary/${enc(t)}`,
  search:   q => `https://en.wikipedia.org/w/api.php?action=opensearch&search=${enc(q)}&limit=${AC_LIMIT}&namespace=0&format=json&origin=*`,
  extract:  t => `https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=true&explaintext=true&titles=${enc(t)}&format=json&origin=*`,
  cats:     t => `https://en.wikipedia.org/w/api.php?action=query&prop=categories&titles=${enc(t)}&format=json&origin=*&cllimit=20`,
  links:    t => `https://en.wikipedia.org/w/api.php?action=query&prop=links&titles=${enc(t)}&format=json&origin=*&pllimit=25&plnamespace=0`,
};

// ── Helpers ───────────────────────────────────────────────────
function enc(s) { return encodeURIComponent(String(s ?? '')); }
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ── Storage ───────────────────────────────────────────────────
const storage = {
  getHistory: () => {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch { return []; }
  },
  saveHistory: (list) => localStorage.setItem(STORAGE_KEY, JSON.stringify(list)),
};

// ── State ─────────────────────────────────────────────────────
let history = storage.getHistory();
let currentTitle = null;
let currentArticle = null;
let acTimer = null;
let acFocused = -1;
let acItems = [];

// ── DOM refs ──────────────────────────────────────────────────
const searchInput  = document.getElementById('searchInput');
const searchClear  = document.getElementById('searchClear');
const btnSearch    = document.getElementById('btnSearch');
const acDropdown   = document.getElementById('acDropdown');
const historyList  = document.getElementById('historyList');
const btnClearHist = document.getElementById('btnClearHistory');
const emptyState   = document.getElementById('emptyState');
const contentArea  = document.getElementById('contentArea');

// ── Toast ─────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3000);
}

// ── Autocomplete ──────────────────────────────────────────────
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  searchClear.classList.toggle('visible', q.length > 0);
  clearTimeout(acTimer);
  if (q.length < 2) { acHide(); return; }
  acTimer = setTimeout(() => fetchSuggestions(q), AC_DEBOUNCE);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); acMoveFocus(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); acMoveFocus(-1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (acFocused >= 0 && acItems[acFocused]) {
      acSelect(acItems[acFocused]);
    } else {
      triggerSearch();
    }
  } else if (e.key === 'Escape') { acHide(); }
});

document.addEventListener('pointerdown', (e) => {
  if (!e.target.closest('.search-wrap')) acHide();
}, { passive: true });

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('visible');
  searchInput.focus();
  acHide();
});

async function fetchSuggestions(q) {
  try {
    const res = await fetch(API.search(q));
    const data = await res.json();
    acItems = data[1] || [];
    acRender();
  } catch {
    acHide();
  }
}

function acRender() {
  if (!acItems.length) { acHide(); return; }
  acDropdown.innerHTML = acItems.map((item, i) => `
    <div class="ac-item" role="option" data-idx="${i}" aria-selected="false">
      <span class="ac-item-icon" aria-hidden="true">📄</span>${esc(item)}
    </div>
  `).join('');
  acFocused = -1;
  acDropdown.classList.add('open');

  acDropdown.querySelectorAll('.ac-item').forEach((el, i) => {
    el.addEventListener('click', () => acSelect(acItems[i]));
    el.addEventListener('mouseenter', () => { acFocused = i; acUpdateFocus(); });
  });
}

function acMoveFocus(dir) {
  acFocused = Math.max(-1, Math.min(acItems.length - 1, acFocused + dir));
  acUpdateFocus();
}

function acUpdateFocus() {
  acDropdown.querySelectorAll('.ac-item').forEach((el, i) => {
    el.classList.toggle('focused', i === acFocused);
    el.setAttribute('aria-selected', i === acFocused ? 'true' : 'false');
  });
}

function acHide() {
  acDropdown.classList.remove('open');
  acFocused = -1;
  acItems = [];
}

function acSelect(title) {
  searchInput.value = title;
  searchClear.classList.add('visible');
  acHide();
  fetchArticle(title);
}

// ── Search trigger ────────────────────────────────────────────
btnSearch.addEventListener('click', triggerSearch);

function triggerSearch() {
  const q = searchInput.value.trim();
  if (!q) { toast('Enter an article title to search.'); return; }
  acHide();
  fetchArticle(q);
}

// ── URL extraction ────────────────────────────────────────────
function extractTitle(input) {
  try {
    const u = new URL(input);
    if (u.hostname.includes('wikipedia.org')) {
      const m = u.pathname.match(/\/wiki\/(.+)/);
      if (m) return decodeURIComponent(m[1].replace(/_/g, ' '));
    }
  } catch {}
  return input.trim();
}

// ── Fetch & assemble article ──────────────────────────────────
async function fetchArticle(query) {
  const title = extractTitle(query);
  currentTitle = title;
  setLoading(true);

  try {
    // Parallel fetch: summary + categories + links
    const [summaryRes, catsRes, linksRes] = await Promise.all([
      fetch(API.summary(title)),
      fetch(API.cats(title)),
      fetch(API.links(title)),
    ]);

    if (!summaryRes.ok) {
      if (summaryRes.status === 404) {
        showError(`No Wikipedia article found for "${esc(title)}". Check the spelling and try again.`);
      } else {
        showError(`Wikipedia returned an error (${summaryRes.status}). Please try again.`);
      }
      return;
    }

    const summary = await summaryRes.json();

    // Detect disambiguation pages
    if (
      summary.type === 'disambiguation' ||
      (summary.description && summary.description.toLowerCase().includes('disambiguation'))
    ) {
      const linksData = linksRes.ok ? await linksRes.json() : null;
      showDisambiguation(summary, linksData);
      return;
    }

    const catsData  = catsRes.ok  ? await catsRes.json()  : null;
    const linksData = linksRes.ok ? await linksRes.json() : null;

    // Extract categories
    const categories = parseCats(catsData, summary.title);

    // Extract related links
    const relatedTopics = parseLinks(linksData, summary.title);

    // Extract key facts from the intro extract
    const extract = summary.extract || '';
    const keyFacts = extractKeyFacts(extract);

    currentArticle = {
      title:         summary.title || title,
      displayTitle:  summary.displaytitle || summary.title || title,
      description:   summary.description || '',
      extract,
      thumbnail:     summary.thumbnail ? summary.thumbnail.source : null,
      pageUrl:       summary.content_urls?.desktop?.page ||
                     `https://en.wikipedia.org/wiki/${enc((summary.title || title).replace(/ /g, '_'))}`,
      categories,
      relatedTopics,
      keyFacts,
      fetchedAt:     new Date().toISOString(),
    };

    renderBrief(currentArticle);
    addToHistory(currentArticle);

  } catch (err) {
    showError('Something went wrong fetching the article. Check your connection and try again.');
  } finally {
    setLoading(false);
  }
}

// ── Parsers ───────────────────────────────────────────────────
function parseCats(data, articleTitle) {
  if (!data) return [];
  try {
    const pages = data.query?.pages || {};
    const page  = Object.values(pages)[0];
    if (!page || !page.categories) return [];
    return page.categories
      .map(c => c.title.replace(/^Category:/, '').trim())
      .filter(c => !c.includes(':') && c.toLowerCase() !== (articleTitle || '').toLowerCase())
      .slice(0, 8);
  } catch { return []; }
}

function parseLinks(data, articleTitle) {
  if (!data) return [];
  try {
    const pages = data.query?.pages || {};
    const page  = Object.values(pages)[0];
    if (!page || !page.links) return [];
    return page.links
      .map(l => l.title.trim())
      .filter(t =>
        t && t !== articleTitle &&
        !t.startsWith('Wikipedia:') && !t.startsWith('Help:') &&
        !t.startsWith('File:') && !t.startsWith('Template:') &&
        !t.startsWith('Category:') && !t.startsWith('Portal:')
      )
      .slice(0, 12);
  } catch { return []; }
}

function extractKeyFacts(text) {
  if (!text) return [];
  const sentences = text.match(/[^.!?]+[.!?]+/g) || [];
  const FACT_REGEX = /\b\d{4}\b|\b\d[\d,\.]+\s*(million|billion|thousand|km|m|kg|mph|km\/h|acres|sq)\b|percent|\bfounded\b|\bborn\b|\bdied\b|\bestablished\b|\bincorporated\b|\bpopulation\b|\blargest\b|\bfirst\b/i;
  return sentences
    .filter(s => FACT_REGEX.test(s))
    .map(s => s.trim())
    .filter(s => s.length > 20 && s.length < 300)
    .slice(0, 6);
}

// ── Loading state ─────────────────────────────────────────────
function setLoading(on) {
  btnSearch.disabled = on;
  if (on) {
    emptyState.style.display = 'none';
    contentArea.style.display = 'block';
    contentArea.innerHTML = `
      <div class="skeleton-wrap" role="status" aria-label="Loading article…">
        <div class="skeleton-block">
          <div class="skeleton-header"></div>
          <div class="skeleton-body">
            <div class="skeleton-line w-80"></div>
            <div class="skeleton-line w-60"></div>
            <div class="skeleton-line w-40"></div>
          </div>
        </div>
        <div class="skeleton-block">
          <div class="skeleton-body">
            <div class="skeleton-line w-80"></div>
            <div class="skeleton-line w-60"></div>
            <div class="skeleton-line"></div>
          </div>
        </div>
        <div class="skeleton-block">
          <div class="skeleton-body">
            <div class="skeleton-line w-60"></div>
            <div class="skeleton-line w-40"></div>
          </div>
        </div>
      </div>
    `;
  }
}

// ── Disambiguation ────────────────────────────────────────────
function showDisambiguation(summary, linksData) {
  emptyState.style.display = 'none';
  contentArea.style.display = 'block';

  const disambigLinks = parseLinks(linksData, summary.title).slice(0, 10);
  const listHtml = disambigLinks.length
    ? `<ul class="disambiguation-list" role="list">${
        disambigLinks.map(t => `
          <li>
            <a role="button" tabindex="0"
              onclick="acSelect('${esc(t)}')"
              onkeydown="if(event.key==='Enter')acSelect('${esc(t)}')"
              aria-label="Open article: ${esc(t)}">${esc(t)}</a>
          </li>`).join('')
      }</ul>`
    : `<p class="no-data">No specific options found. Try a more specific search.</p>`;

  contentArea.innerHTML = `
    <div class="disambiguation-notice" role="alert">
      <h3>Disambiguation — multiple articles found</h3>
      <p>"${esc(summary.title)}" may refer to several different topics. Select the one you're looking for:</p>
      ${listHtml}
    </div>
  `;
}

// ── Error state ───────────────────────────────────────────────
function showError(msg) {
  emptyState.style.display = 'none';
  contentArea.style.display = 'block';
  contentArea.innerHTML = `
    <div class="error-card" role="alert">
      <span class="error-icon" aria-hidden="true">⚠️</span>
      <div class="error-body">
        <h3>Article not found</h3>
        <p>${msg}</p>
      </div>
    </div>
  `;
}

// ── Render brief ──────────────────────────────────────────────
function renderBrief(article) {
  emptyState.style.display = 'none';
  contentArea.style.display = 'block';

  // Thumbnail
  const thumbHtml = article.thumbnail
    ? `<img src="${esc(article.thumbnail)}" alt="${esc(article.title)}" class="article-thumb" loading="lazy">`
    : `<div class="article-thumb-placeholder" aria-hidden="true">📄</div>`;

  // Summary: truncate to ~400 chars, "Read more" expand
  const shortSummary = article.extract.length > 420
    ? article.extract.slice(0, 420).replace(/\s\S+$/, '') + '…'
    : article.extract;
  const hasTrunc = article.extract.length > 420;

  const summaryHtml = hasTrunc
    ? `<div class="summary-text">
        <span class="summary-truncated" id="summaryTruncated">${esc(shortSummary)}</span>
        <span class="summary-full" id="summaryFull">${esc(article.extract)}</span>
        <button class="btn-read-more" id="btnReadMore">Read more</button>
       </div>`
    : `<p class="summary-text">${esc(article.extract || 'No extract available for this article.')}</p>`;

  // Key facts
  const keyFactsHtml = article.keyFacts.length
    ? `<ul class="key-facts-list" role="list">${
        article.keyFacts.map(f => `<li class="key-fact-item">${esc(f)}</li>`).join('')
      }</ul>`
    : `<p class="no-data">No specific numeric facts extracted — see full article for details.</p>`;

  // Categories
  const catsHtml = article.categories.length
    ? `<div class="chips-wrap">${
        article.categories.map(c => `<span class="chip chip-category">${esc(c)}</span>`).join('')
      }</div>`
    : `<p class="no-data">No categories available.</p>`;

  // Related topics (clickable)
  const relatedHtml = article.relatedTopics.length
    ? `<div class="chips-wrap">${
        article.relatedTopics.map(t => `
          <span class="chip" role="button" tabindex="0"
            onclick="acSelect('${esc(t)}')"
            onkeydown="if(event.key==='Enter')acSelect('${esc(t)}')"
            aria-label="Load article: ${esc(t)}">${esc(t)}</span>
        `).join('')
      }</div>`
    : `<p class="no-data">No related topics found.</p>`;

  contentArea.innerHTML = `
    <div class="brief" role="article" aria-label="Research brief for ${esc(article.title)}">

      <!-- Article header -->
      <div class="article-header-card">
        <div class="article-thumb-wrap">${thumbHtml}</div>
        <div class="article-header-body">
          <h1 class="article-title">${esc(article.title)}</h1>
          ${article.description ? `<p class="article-description">${esc(article.description)}</p>` : ''}
          <div class="article-header-meta">
            <a href="${esc(article.pageUrl)}" target="_blank" rel="noopener noreferrer"
              class="wiki-link" aria-label="Open full article on Wikipedia">
              Wikipedia ↗
            </a>
            ${article.categories.length ? `<span class="meta-badge">${article.categories.length} categories</span>` : ''}
            ${article.relatedTopics.length ? `<span class="meta-badge">${article.relatedTopics.length} related topics</span>` : ''}
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions-row" role="toolbar" aria-label="Brief actions">
        <button class="btn-action btn-action-ghost" id="btnCopyText" aria-label="Copy brief as plain text">
          Copy as Text
        </button>
        <button class="btn-action btn-action-ghost" id="btnCopyMd" aria-label="Copy brief as Markdown">
          Copy as Markdown
        </button>
      </div>

      <!-- Sections grid -->
      <div class="brief-sections">

        <!-- Summary -->
        <div class="brief-card full-width">
          <div class="brief-card-head">
            <span class="brief-card-title">Summary</span>
          </div>
          <div class="brief-card-body">
            ${summaryHtml}
          </div>
        </div>

        <!-- Key facts -->
        <div class="brief-card">
          <div class="brief-card-head">
            <span class="brief-card-title">Key Facts</span>
          </div>
          <div class="brief-card-body">
            ${keyFactsHtml}
          </div>
        </div>

        <!-- Categories -->
        <div class="brief-card">
          <div class="brief-card-head">
            <span class="brief-card-title">Categories</span>
          </div>
          <div class="brief-card-body">
            ${catsHtml}
          </div>
        </div>

        <!-- Related topics -->
        <div class="brief-card full-width">
          <div class="brief-card-head">
            <span class="brief-card-title">Related Topics</span>
          </div>
          <div class="brief-card-body">
            ${relatedHtml}
          </div>
        </div>

      </div>

    </div>
  `;

  // Wire read-more
  if (hasTrunc) {
    const btnMore   = document.getElementById('btnReadMore');
    const truncEl   = document.getElementById('summaryTruncated');
    const fullEl    = document.getElementById('summaryFull');
    let expanded = false;
    btnMore.addEventListener('click', () => {
      expanded = !expanded;
      truncEl.classList.toggle('hidden', expanded);
      fullEl.classList.toggle('expanded', expanded);
      btnMore.textContent = expanded ? 'Show less' : 'Read more';
    });
  }

  // Wire copy buttons
  document.getElementById('btnCopyText').addEventListener('click', () => copyBrief('text'));
  document.getElementById('btnCopyMd').addEventListener('click',   () => copyBrief('markdown'));
}

// ── Copy brief ────────────────────────────────────────────────
function generatePlainText(article) {
  const facts = article.keyFacts.length
    ? article.keyFacts.map(f => `  • ${f}`).join('\n')
    : '  No specific facts extracted.';
  const cats = article.categories.join(', ') || 'N/A';
  const related = article.relatedTopics.join(', ') || 'N/A';
  return [
    `RESEARCH BRIEF: ${article.title}`,
    `${'─'.repeat(60)}`,
    article.description ? `Description: ${article.description}` : '',
    `Source: ${article.pageUrl}`,
    ``,
    `SUMMARY`,
    article.extract || 'No extract available.',
    ``,
    `KEY FACTS`,
    facts,
    ``,
    `CATEGORIES`,
    cats,
    ``,
    `RELATED TOPICS`,
    related,
    ``,
    `Generated by WikiBrief on ${new Date().toLocaleDateString()}`,
  ].filter(l => l !== undefined).join('\n');
}

function generateMarkdown(article) {
  const facts = article.keyFacts.length
    ? article.keyFacts.map(f => `- ${f}`).join('\n')
    : '- No specific facts extracted.';
  const cats = article.categories.length
    ? article.categories.map(c => `\`${c}\``).join(', ')
    : 'N/A';
  const related = article.relatedTopics.length
    ? article.relatedTopics.map(t => `[[${t}]]`).join(', ')
    : 'N/A';
  return [
    `# ${article.title}`,
    ``,
    article.description ? `> **${article.description}**` : '',
    ``,
    `**Source:** [Wikipedia](${article.pageUrl})`,
    ``,
    `## Summary`,
    ``,
    article.extract || 'No extract available.',
    ``,
    `## Key Facts`,
    ``,
    facts,
    ``,
    `## Categories`,
    ``,
    cats,
    ``,
    `## Related Topics`,
    ``,
    related,
    ``,
    `---`,
    `*Generated by WikiBrief on ${new Date().toLocaleDateString()}*`,
  ].filter(l => l !== undefined).join('\n');
}

function copyBrief(format) {
  if (!currentArticle) return;
  const text = format === 'markdown'
    ? generateMarkdown(currentArticle)
    : generatePlainText(currentArticle);

  const btnId = format === 'markdown' ? 'btnCopyMd' : 'btnCopyText';
  const btn = document.getElementById(btnId);

  navigator.clipboard.writeText(text).then(() => {
    toast(`Copied as ${format === 'markdown' ? 'Markdown' : 'plain text'}!`, 'success');
    if (btn) {
      btn.classList.add('copied');
      const orig = btn.textContent;
      btn.textContent = '✓ Copied!';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.textContent = orig;
      }, 2000);
    }
  }).catch(() => {
    toast('Copy failed — please try again.', 'error');
  });
}

// ── History ───────────────────────────────────────────────────
function addToHistory(article) {
  history = history.filter(h => h.title !== article.title);
  history.unshift({
    title:       article.title,
    description: article.description,
    fetchedAt:   article.fetchedAt,
  });
  if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
  storage.saveHistory(history);
  renderHistory();
}

function renderHistory() {
  if (!history.length) {
    historyList.innerHTML = '<div class="history-empty">No recent lookups yet.<br>Search for an article to start.</div>';
    return;
  }

  historyList.innerHTML = history.map(item => `
    <div class="history-item${item.title === currentTitle ? ' active' : ''}"
      role="listitem"
      tabindex="0"
      aria-label="Reload: ${esc(item.title)}"
      onclick="historyLoad('${esc(item.title)}')"
      onkeydown="if(event.key==='Enter')historyLoad('${esc(item.title)}')">
      <div class="history-item-title">${esc(item.title)}</div>
      ${item.description ? `<div class="history-item-desc">${esc(item.description)}</div>` : ''}
    </div>
  `).join('');
}

function historyLoad(title) {
  searchInput.value = title;
  searchClear.classList.add('visible');
  acHide();
  fetchArticle(title);
}

btnClearHist.addEventListener('click', () => {
  if (!history.length) return;
  history = [];
  storage.saveHistory(history);
  renderHistory();
  toast('History cleared');
});

// ── Init ──────────────────────────────────────────────────────
renderHistory();
</script>

<!-- Nav switching + hero stat enhancement -->
<script>
(function () {
  var navOverview     = document.getElementById('navOverview');
  var navHistory      = document.getElementById('navHistory');
  var overviewSection = document.getElementById('overviewSection');
  var historySection  = document.getElementById('historySection');

  function activateOverview() {
    overviewSection.hidden = false;
    historySection.hidden  = true;
    navOverview.setAttribute('aria-current', 'page');
    navHistory.removeAttribute('aria-current');
  }

  function activateHistory() {
    overviewSection.hidden = true;
    historySection.hidden  = false;
    navHistory.setAttribute('aria-current', 'page');
    navOverview.removeAttribute('aria-current');
  }

  navOverview.addEventListener('click', function (e) { e.preventDefault(); activateOverview(); });
  navHistory.addEventListener('click',  function (e) { e.preventDefault(); activateHistory(); });

  // Patch renderBrief to update hero stat + metrics
  var _origRenderBrief = window.renderBrief;
  window.renderBrief = function (article) {
    _origRenderBrief(article);

    var heroTitle = document.getElementById('heroArticleTitle');
    var heroDesc  = document.getElementById('heroArticleDesc');
    var heroLink  = document.getElementById('heroWikiLink');

    if (heroTitle) {
      heroTitle.textContent = article.title;
      heroTitle.classList.remove('is-placeholder');
    }
    if (heroDesc)  heroDesc.textContent = article.description || '';
    if (heroLink)  { heroLink.href = article.pageUrl; heroLink.style.display = ''; }

    var wordCount = article.extract ? article.extract.trim().split(/\s+/).length : 0;
    document.getElementById('metricFacts').textContent   = article.keyFacts.length   || '0';
    document.getElementById('metricCats').textContent    = article.categories.length  || '0';
    document.getElementById('metricRelated').textContent = article.relatedTopics.length || '0';
    document.getElementById('metricWords').textContent   = wordCount > 0 ? wordCount.toLocaleString() : '—';
  };

  // Patch historyLoad to switch back to overview before loading
  var _origHistoryLoad = window.historyLoad;
  window.historyLoad = function (title) {
    activateOverview();
    _origHistoryLoad(title);
  };
}());
</script>
