<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDP Comparison Tool — Market Entry Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Workbench · theme: Cobalt · nav: N9 */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow-x: clip; }
body {
  height: 100%;
  overflow: hidden;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ── N9 Nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 52px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  flex-shrink: 0;
}
.nav-logo span { color: var(--color-accent); }
.nav-sep { width: 1px; height: 16px; background: var(--color-border); flex-shrink: 0; }
.nav-page-label {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
  white-space: nowrap;
}
.nav-back {
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
  transition: color 0.15s ease;
}
.nav-back:hover { color: var(--color-ink); }

/* ── App Shell ── */
.app-shell {
  display: grid;
  grid-template-columns: 300px 1fr;
  margin-top: 52px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--color-border);
  background: var(--color-paper-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

.sidebar-section-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
  margin-bottom: var(--space-2);
}

/* Country search */
.search-input {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.search-input:focus {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px oklch(52% 0.20 256 / 0.10);
}
.search-input::placeholder { color: var(--color-ink-muted); }

/* Country dropdown list */
.country-list {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  max-height: 160px;
  overflow-y: auto;
  margin-top: var(--space-1);
  display: none;
}
.country-list.open { display: block; }
.country-list::-webkit-scrollbar { width: 4px; }
.country-list::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

.country-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-2) var(--space-3);
  font-size: var(--text-sm);
  cursor: pointer;
  transition: background 0.1s ease;
  border-bottom: 1px solid var(--color-border);
}
.country-option:last-child { border-bottom: none; }
.country-option:hover { background: var(--color-accent-subtle); }
.country-option .iso-badge {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-ink-muted);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 1px 5px;
}

/* Selected chips */
.chips-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  min-height: 32px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: 999px;
  padding: 3px 8px 3px 6px;
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-ink);
}
.chip-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.chip-remove {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  color: var(--color-ink-muted);
  font-size: 14px;
  line-height: 1;
  display: flex;
  align-items: center;
  transition: color 0.12s ease;
}
.chip-remove:hover { color: var(--color-danger); }

/* Metric radio */
.metric-options {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.metric-radio {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  cursor: pointer;
  font-size: var(--text-sm);
  color: var(--color-ink);
}
.metric-radio input[type="radio"] {
  accent-color: var(--color-accent);
  width: 15px;
  height: 15px;
  cursor: pointer;
}

/* Year range */
.year-range-row {
  display: flex;
  gap: var(--space-3);
  align-items: end;
}
.year-range-field { flex: 1; }
.year-label {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  margin-bottom: 4px;
  display: block;
}
.year-input {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  transition: border-color 0.15s ease;
}
.year-input:focus { outline: none; border-color: var(--color-accent); }

/* Preset chips */
.preset-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}
.btn-preset {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-ink-muted);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: 999px;
  padding: var(--space-1) var(--space-3);
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
}
.btn-preset:hover {
  border-color: var(--color-accent-line);
  color: var(--color-accent);
  background: var(--color-accent-subtle);
}

/* Compare button */
.btn-compare {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-paper);
  background: var(--color-accent);
  border: none;
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
}
.btn-compare:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px oklch(52% 0.20 256 / 0.28);
}
.btn-compare:active { transform: translateY(0); box-shadow: none; }
.btn-compare:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-ghost {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-ink-muted);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-3);
  cursor: pointer;
  transition: color 0.12s ease, border-color 0.12s ease;
}
.btn-ghost:hover { color: var(--color-ink); border-color: var(--color-ink-muted); }

/* ── Main panel ── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-paper);
}
.main-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6) var(--space-8);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}
.main-scroll::-webkit-scrollbar { width: 5px; }
.main-scroll::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }

/* Empty / loading state */
.panel-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-16);
  text-align: center;
  gap: var(--space-4);
}
.panel-empty-icon {
  font-size: 2.5rem;
  margin-bottom: var(--space-2);
}
.panel-empty-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
}
.panel-empty-sub {
  font-size: var(--text-base);
  color: var(--color-ink-muted);
  max-width: 340px;
  line-height: 1.65;
}

/* ── Summary Cards ── */
.stat-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-4);
}
.stat-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--color-accent);
}
.stat-card.c1::before { background: var(--color-accent); }
.stat-card.c2::before { background: var(--color-danger); }
.stat-card.c3::before { background: var(--color-warn); }
.stat-card.c4::before { background: oklch(52% 0.14 270); }

.stat-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
}
.stat-value {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 500;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  line-height: 1.1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-sub {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  line-height: 1.4;
}

/* ── Chart section ── */
.chart-section {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
}
.chart-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: var(--space-4);
  gap: var(--space-4);
  flex-wrap: wrap;
}
.chart-title {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.01em;
}
.chart-sub {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  margin-top: 2px;
}
.chart-actions {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
}

/* SVG chart wrapper */
.svg-wrap {
  width: 100%;
  overflow-x: auto;
  position: relative;
}
.svg-wrap svg {
  width: 100%;
  height: auto;
  overflow: visible;
  font-family: var(--font-body);
}

/* Chart legend */
.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  margin-top: var(--space-4);
  padding-top: var(--space-4);
  border-top: 1px solid var(--color-border);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
}
.legend-swatch {
  width: 24px;
  height: 3px;
  border-radius: 2px;
  flex-shrink: 0;
}

/* Chart tooltip */
#chart-tooltip {
  position: fixed;
  background: var(--color-ink);
  color: var(--color-paper);
  font-family: var(--font-body);
  font-size: var(--text-xs);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s ease;
  z-index: 400;
  max-width: 220px;
  box-shadow: 0 4px 16px oklch(24% 0.020 258 / 0.20);
  line-height: 1.6;
}

/* ── Data table ── */
.table-section {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--color-border);
  gap: var(--space-4);
  flex-wrap: wrap;
}
.table-wrap {
  overflow-x: auto;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-sm);
}
.data-table thead th {
  background: var(--color-paper);
  color: var(--color-ink-muted);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: var(--space-3) var(--space-4);
  text-align: right;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--color-border);
  transition: color 0.15s ease;
}
.data-table thead th:first-child { text-align: left; }
.data-table thead th:hover { color: var(--color-ink); }
.data-table thead th.sorted { color: var(--color-accent); }
.data-table thead th.sorted::after { content: ' ↓'; }
.data-table thead th.sorted.asc::after { content: ' ↑'; }

.data-table tbody tr {
  border-bottom: 1px solid var(--color-border);
  transition: background 0.1s ease;
}
.data-table tbody tr:last-child { border-bottom: none; }
.data-table tbody tr:hover { background: var(--color-accent-subtle); }

.data-table tbody td {
  padding: var(--space-3) var(--space-4);
  color: var(--color-ink);
  white-space: nowrap;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.data-table tbody td:first-child {
  text-align: left;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.td-swatch {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 600;
  background: var(--color-ink);
  color: var(--color-paper);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px oklch(24% 0.020 258 / 0.20);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
  max-width: 360px;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.error { background: var(--color-danger); }
.toast.success { background: var(--color-success); }

/* Spinner */
.spinner-wrap {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-8);
  justify-content: center;
  color: var(--color-ink-muted);
  font-size: var(--text-sm);
}
.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid var(--color-border);
  border-top-color: var(--color-accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Mobile ── */
@media (max-width: 768px) {
  html, body { overflow: auto; height: auto; }
  .app-shell {
    grid-template-columns: 1fr;
    height: auto;
    overflow: visible;
  }
  .sidebar {
    border-right: none;
    border-bottom: 1px solid var(--color-border);
    max-height: none;
    overflow: visible;
  }
  .sidebar-scroll { overflow: visible; }
  .main { overflow: visible; }
  .main-scroll { overflow: visible; padding: var(--space-4); }
  .stat-cards { grid-template-columns: 1fr 1fr; }
  .nav-page-label { display: none; }
}
@media (max-width: 480px) {
  .stat-cards { grid-template-columns: 1fr; }
}

/* ── Line animation ── */
@keyframes draw-line {
  from { stroke-dashoffset: var(--dash-len, 2000); }
  to   { stroke-dashoffset: 0; }
}
.animated-line {
  animation: draw-line 1.2s ease forwards;
}

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  .animated-line { animation: none; }
  .spinner { animation: none; border-top-color: var(--color-accent); }
  .btn-compare:hover { transform: none; box-shadow: none; }
}
</style>
</head>
<body>

<!-- N9 Nav -->
<nav class="nav" aria-label="Application navigation">
  <span class="nav-logo">GDP<span>.</span></span>
  <span class="nav-sep" aria-hidden="true"></span>
  <span class="nav-page-label">Comparison Tool</span>
  <a href="index.html" class="nav-back" aria-label="Back to home page">← Home</a>
</nav>

<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar" aria-label="Comparison controls">
    <div class="sidebar-scroll">

      <!-- Country search -->
      <div>
        <div class="sidebar-section-label">Search Countries</div>
        <input
          type="search"
          class="search-input"
          id="country-search"
          placeholder="Type to search countries…"
          autocomplete="off"
          aria-label="Search countries"
          aria-autocomplete="list"
          aria-controls="country-list"
        >
        <div class="country-list" id="country-list" role="listbox" aria-label="Country results"></div>
      </div>

      <!-- Selected countries -->
      <div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-2);">
          <div class="sidebar-section-label">Selected Countries <span id="sel-count" style="font-weight:400;text-transform:none;letter-spacing:0;">(0/5)</span></div>
          <button class="btn-ghost" id="btn-clear-all">Clear all</button>
        </div>
        <div class="chips-row" id="chips-row" aria-label="Selected countries" aria-live="polite">
          <span style="font-size:var(--text-xs);color:var(--color-ink-muted);">No countries selected</span>
        </div>
      </div>

      <!-- Presets -->
      <div>
        <div class="sidebar-section-label">Quick Presets</div>
        <div class="preset-row">
          <button class="btn-preset" data-preset="g7">G7</button>
          <button class="btn-preset" data-preset="brics">BRICS</button>
          <button class="btn-preset" data-preset="sea">Southeast Asia</button>
        </div>
      </div>

      <!-- Metric -->
      <div>
        <div class="sidebar-section-label">Metric</div>
        <div class="metric-options" role="radiogroup" aria-label="Select metric">
          <label class="metric-radio">
            <input type="radio" name="metric" value="gdp" checked> GDP Total (USD)
          </label>
          <label class="metric-radio">
            <input type="radio" name="metric" value="gdp_pc"> GDP per Capita (USD)
          </label>
          <label class="metric-radio">
            <input type="radio" name="metric" value="gdp_gr"> GDP Growth Rate (%)
          </label>
        </div>
      </div>

      <!-- Year range -->
      <div>
        <div class="sidebar-section-label">Year Range</div>
        <div class="year-range-row">
          <div class="year-range-field">
            <label class="year-label" for="year-start">From</label>
            <input type="number" class="year-input" id="year-start" min="1960" max="2024" value="1990" aria-label="Start year">
          </div>
          <div class="year-range-field">
            <label class="year-label" for="year-end">To</label>
            <input type="number" class="year-input" id="year-end" min="1960" max="2024" value="2024" aria-label="End year">
          </div>
        </div>
      </div>

      <!-- Compare button -->
      <button class="btn-compare" id="btn-compare" disabled aria-label="Compare selected countries">
        Compare
      </button>

      <!-- Export -->
      <div style="display:flex;gap:var(--space-2);">
        <button class="btn-ghost" id="btn-csv" style="flex:1;" disabled>Copy CSV</button>
        <button class="btn-ghost" id="btn-json" style="flex:1;" disabled>Download JSON</button>
      </div>

    </div>
  </aside>

  <!-- Main panel -->
  <main class="main" aria-label="GDP comparison results">

    <!-- Empty state -->
    <div class="panel-empty" id="panel-empty">
      <div class="panel-empty-icon">🌐</div>
      <p class="panel-empty-title">Ready to compare</p>
      <p class="panel-empty-sub">Select up to 5 countries in the sidebar, choose a metric and year range, then click Compare.</p>
    </div>

    <!-- Results -->
    <div class="main-scroll" id="main-results" style="display:none;">

      <!-- Stat cards -->
      <div class="stat-cards" id="stat-cards" aria-label="Summary statistics">
        <!-- populated by JS -->
      </div>

      <!-- Line chart -->
      <div class="chart-section">
        <div class="chart-header">
          <div>
            <div class="chart-title" id="chart-title">GDP Comparison</div>
            <div class="chart-sub" id="chart-sub"></div>
          </div>
        </div>
        <div class="svg-wrap" id="svg-wrap">
          <!-- populated by JS -->
        </div>
        <div class="chart-legend" id="chart-legend" aria-label="Chart legend">
          <!-- populated by JS -->
        </div>
      </div>

      <!-- Data table -->
      <div class="table-section">
        <div class="table-header">
          <div class="chart-title" style="font-size:var(--text-base);">Data Table</div>
        </div>
        <div class="table-wrap">
          <table class="data-table" id="data-table" aria-label="GDP data table">
            <thead id="table-head"><tr></tr></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>

    </div>

    <!-- Loading -->
    <div id="panel-loading" style="display:none;">
      <div class="spinner-wrap">
        <div class="spinner"></div>
        <span id="loading-text">Fetching data from World Bank…</span>
      </div>
    </div>

  </main>
</div>

<!-- Chart tooltip -->
<div id="chart-tooltip" role="tooltip" aria-hidden="true"></div>

<!-- Toast -->
<div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

<script>
'use strict';

/* ── Constants ── */
const COLORS = [
  'oklch(52% 0.20 256)',   /* sage green — accent */
  'oklch(55% 0.20 25)',    /* coral */
  'oklch(55% 0.14 270)',   /* blue-violet */
  'oklch(62% 0.15 72)',    /* amber */
  'oklch(55% 0.18 310)',   /* mauve */
];

const COLORS_HEX = ['#3d8b6e', '#c0392b', '#6c5fc7', '#c98a1c', '#9b59b6'];

const METRIC_LABELS = {
  gdp:    'GDP Total',
  gdp_pc: 'GDP per Capita',
  gdp_gr: 'GDP Growth Rate',
};
const METRIC_INDICATORS = {
  gdp:    'NY.GDP.MKTP.CD',
  gdp_pc: 'NY.GDP.PCAP.CD',
  gdp_gr: 'NY.GDP.MKTP.KD.ZG',
};

const PRESETS = {
  g7:   ['US', 'CA', 'GB', 'DE', 'FR', 'IT', 'JP'],
  brics:['BR', 'RU', 'IN', 'CN', 'ZA'],
  sea:  ['ID', 'TH', 'MY', 'VN', 'PH'],
};

/* ── State ── */
const state = {
  countries: [],          /* full list from WB */
  selected: [],           /* [{iso2, name, color}] */
  metric: 'gdp',
  yearStart: 1990,
  yearEnd: 2024,
  datasets: [],           /* [{country, data:[{year,value}]}] */
  cache: new Map(),       /* key: `${iso2}-${metric}` */
  sortCol: null,
  sortAsc: true,
};

/* ── Utils ── */
const fmtGDP = (v, metric) => {
  if (v == null || isNaN(v)) return '—';
  if (metric === 'gdp_gr') return v.toFixed(2) + '%';
  if (metric === 'gdp_pc') {
    if (v >= 1e6) return '$' + (v / 1e6).toFixed(2) + 'M';
    if (v >= 1e3) return '$' + (v / 1e3).toFixed(1) + 'K';
    return '$' + Math.round(v).toLocaleString();
  }
  if (v >= 1e12) return '$' + (v / 1e12).toFixed(2) + 'T';
  if (v >= 1e9)  return '$' + (v / 1e9).toFixed(1)  + 'B';
  if (v >= 1e6)  return '$' + (v / 1e6).toFixed(1)  + 'M';
  return '$' + Math.round(v).toLocaleString();
};

const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3500);
}

function setLoading(on, text = 'Fetching data from World Bank…') {
  document.getElementById('panel-loading').style.display = on ? 'block' : 'none';
  document.getElementById('panel-empty').style.display = 'none';
  document.getElementById('main-results').style.display = on ? 'none' : '';
  if (on) document.getElementById('loading-text').textContent = text;
}

function showEmpty() {
  document.getElementById('panel-empty').style.display = '';
  document.getElementById('main-results').style.display = 'none';
  document.getElementById('panel-loading').style.display = 'none';
}

function showResults() {
  document.getElementById('panel-empty').style.display = 'none';
  document.getElementById('panel-loading').style.display = 'none';
  document.getElementById('main-results').style.display = '';
}

/* ── World Bank API ── */
async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function fetchCountryList() {
  const url = `https://api.worldbank.org/v2/country?format=json&per_page=300&region=NA;ECS;LCN;EAS;SAS;MEA;SSF`;
  // Use broader query and filter aggregates client-side
  const url2 = `https://api.worldbank.org/v2/country?format=json&per_page=400`;
  try {
    const data = await fetchJSON(url2);
    if (!data || !data[1]) return [];
    const SKIP_ISO2 = new Set(['1A','1W','4E','7E','8S','A4','A5','A9','B8','C4','C5','C6','C7','C8','C9','D4','D7','D8','D9','EU','F1','JG','OE','S1','S2','S3','S4','XC','XD','XE','XF','XG','XH','XI','XJ','XK','XL','XM','XN','XO','XP','XQ','XR','XS','XT','XU','XY','ZB','ZF','ZG','ZH','ZI','ZJ','ZQ','ZT']);
    return data[1]
      .filter(c => c.capitalCity && c.iso2Code && !SKIP_ISO2.has(c.iso2Code))
      .map(c => ({ iso2: c.iso2Code, name: c.name }))
      .sort((a, b) => a.name.localeCompare(b.name));
  } catch (e) {
    console.error('Country fetch failed:', e);
    return [];
  }
}

async function fetchIndicator(isoCodes, indicator, yearStart, yearEnd) {
  const joined = isoCodes.join(';');
  const years = yearEnd - yearStart + 1;
  const url = `https://api.worldbank.org/v2/country/${joined}/indicator/${indicator}?format=json&per_page=${years * isoCodes.length + 10}&date=${yearStart}:${yearEnd}&mrv=${years}`;
  const data = await fetchJSON(url);
  if (!data || !data[1]) return [];
  return data[1];
}

/* ── Country list UI ── */
function renderCountryList(query) {
  const list = document.getElementById('country-list');
  const q = query.trim().toLowerCase();

  if (!q) { list.classList.remove('open'); return; }

  const matches = state.countries
    .filter(c => c.name.toLowerCase().includes(q) || c.iso2.toLowerCase().includes(q))
    .slice(0, 50);

  if (!matches.length) {
    list.innerHTML = '<div style="padding:var(--space-2) var(--space-3);font-size:var(--text-sm);color:var(--color-ink-muted);">No results</div>';
    list.classList.add('open');
    return;
  }

  const alreadySelected = new Set(state.selected.map(s => s.iso2));
  list.innerHTML = matches.map(c => {
    const disabled = alreadySelected.has(c.iso2);
    return `<div class="country-option${disabled ? ' selected' : ''}"
      role="option"
      aria-selected="${disabled}"
      data-iso2="${c.iso2}"
      data-name="${c.name.replace(/"/g, '&quot;')}"
      style="${disabled ? 'opacity:.45;cursor:default;' : ''}"
    >
      <span>${c.name}</span>
      <span class="iso-badge">${c.iso2}</span>
    </div>`;
  }).join('');
  list.classList.add('open');
}

function addCountry(iso2, name) {
  if (state.selected.find(s => s.iso2 === iso2)) return;
  if (state.selected.length >= 5) {
    toast('Maximum 5 countries allowed', 'error');
    return;
  }
  const color = COLORS[state.selected.length];
  const colorHex = COLORS_HEX[state.selected.length];
  state.selected.push({ iso2, name, color, colorHex });
  renderChips();
  document.getElementById('country-search').value = '';
  document.getElementById('country-list').classList.remove('open');
  updateCompareBtn();
}

function removeCountry(iso2) {
  state.selected = state.selected.filter(s => s.iso2 !== iso2);
  // Reassign colors
  state.selected.forEach((s, i) => { s.color = COLORS[i]; s.colorHex = COLORS_HEX[i]; });
  renderChips();
  updateCompareBtn();
}

function renderChips() {
  const row = document.getElementById('chips-row');
  const count = state.selected.length;
  document.getElementById('sel-count').textContent = `(${count}/5)`;

  if (!count) {
    row.innerHTML = '<span style="font-size:var(--text-xs);color:var(--color-ink-muted);">No countries selected</span>';
    return;
  }

  row.innerHTML = state.selected.map(s =>
    `<div class="chip">
      <span class="chip-dot" style="background:${s.colorHex}"></span>
      <span>${s.name}</span>
      <button class="chip-remove" data-iso2="${s.iso2}" aria-label="Remove ${s.name}">×</button>
    </div>`
  ).join('');

  row.querySelectorAll('.chip-remove').forEach(btn => {
    btn.addEventListener('click', () => removeCountry(btn.dataset.iso2));
  });
}

function updateCompareBtn() {
  const btn = document.getElementById('btn-compare');
  btn.disabled = state.selected.length === 0;
}

/* ── Presets ── */
function applyPreset(key) {
  const isoCodes = PRESETS[key] || [];
  state.selected = [];
  const candidates = isoCodes.slice(0, 5);
  candidates.forEach((iso2, i) => {
    const country = state.countries.find(c => c.iso2 === iso2);
    if (country) {
      state.selected.push({ iso2: country.iso2, name: country.name, color: COLORS[i], colorHex: COLORS_HEX[i] });
    }
  });
  renderChips();
  updateCompareBtn();
}

/* ── Fetch & Compare ── */
async function compare() {
  if (!state.selected.length) return;

  state.yearStart = parseInt(document.getElementById('year-start').value) || 1990;
  state.yearEnd   = parseInt(document.getElementById('year-end').value)   || 2024;
  state.metric    = document.querySelector('input[name="metric"]:checked').value;

  if (state.yearStart > state.yearEnd) {
    toast('Start year must be before end year', 'error');
    return;
  }

  setLoading(true, 'Fetching data from World Bank…');
  document.getElementById('btn-compare').disabled = true;

  try {
    const indicator = METRIC_INDICATORS[state.metric];
    const isoCodes  = state.selected.map(s => s.iso2);

    // Check cache per country
    const toFetch = isoCodes.filter(iso => !state.cache.has(`${iso}-${state.metric}-${state.yearStart}-${state.yearEnd}`));

    if (toFetch.length) {
      document.getElementById('loading-text').textContent = 'Fetching ' + toFetch.length + ' country dataset(s)…';
      const raw = await fetchIndicator(toFetch, indicator, state.yearStart, state.yearEnd);

      // Group by country
      const grouped = {};
      raw.forEach(d => {
        const iso = d.countryiso3code ? d.countryiso3code : (d.country?.id || '');
        const iso2 = d.country?.id || '';
        if (!grouped[iso2]) grouped[iso2] = [];
        if (d.value != null) {
          grouped[iso2].push({ year: parseInt(d.date), value: d.value });
        }
      });

      // Also map by country name via selected list
      // WB returns iso2 in country.id
      toFetch.forEach(iso2 => {
        const cacheKey = `${iso2}-${state.metric}-${state.yearStart}-${state.yearEnd}`;
        const pts = (grouped[iso2] || []).sort((a, b) => a.year - b.year);
        state.cache.set(cacheKey, pts);
      });
    }

    // Assemble datasets
    state.datasets = state.selected.map(s => {
      const key = `${s.iso2}-${state.metric}-${state.yearStart}-${state.yearEnd}`;
      const data = state.cache.get(key) || [];
      return { ...s, data };
    });

    renderResults();
    showResults();
    document.getElementById('btn-csv').disabled = false;
    document.getElementById('btn-json').disabled = false;
  } catch (err) {
    toast('Failed to fetch data: ' + err.message, 'error');
    showEmpty();
  } finally {
    document.getElementById('btn-compare').disabled = state.selected.length === 0;
  }
}

/* ── Render Results ── */
function renderResults() {
  renderStatCards();
  renderChart();
  renderTable();
}

/* ── Stat Cards ── */
function renderStatCards() {
  const ds = state.datasets;
  if (!ds.length) return;

  // Latest year with data per dataset
  const latestPoints = ds.map(d => {
    const pts = d.data.filter(p => p.value != null);
    return pts.length ? pts[pts.length - 1] : null;
  });

  // Highest
  let highest = null;
  latestPoints.forEach((p, i) => {
    if (!p) return;
    if (!highest || p.value > latestPoints[highest.i]?.value) highest = { ...ds[i], val: p.value, year: p.year, i };
  });

  // Lowest
  let lowest = null;
  latestPoints.forEach((p, i) => {
    if (!p) return;
    if (!lowest || p.value < latestPoints[lowest.i]?.value) lowest = { ...ds[i], val: p.value, year: p.year, i };
  });

  // Fastest growing (5yr CAGR)
  let fastest = null;
  ds.forEach((d, i) => {
    if (d.data.length < 2) return;
    const sorted = d.data.filter(p => p.value > 0).sort((a, b) => a.year - b.year);
    const recent = sorted.slice(-6);
    if (recent.length < 2) return;
    const first = recent[0];
    const last  = recent[recent.length - 1];
    const years = last.year - first.year;
    if (years <= 0) return;
    const cagr = (Math.pow(last.value / first.value, 1 / years) - 1) * 100;
    if (!fastest || cagr > fastest.cagr) fastest = { ...d, cagr, i };
  });

  // Largest change (absolute, latest vs 5 years ago)
  let largest = null;
  latestPoints.forEach((p, i) => {
    if (!p) return;
    const d = ds[i];
    const lookback = d.data.filter(pt => pt.year <= p.year - 5 && pt.value != null);
    if (!lookback.length) return;
    const old = lookback[lookback.length - 1];
    const change = p.value - old.value;
    if (!largest || Math.abs(change) > Math.abs(largest.change)) {
      largest = { ...d, change, i };
    }
  });

  const isGrowth = state.metric === 'gdp_gr';

  document.getElementById('stat-cards').innerHTML = `
    <div class="stat-card c1">
      <div class="stat-label">Highest ${METRIC_LABELS[state.metric]}</div>
      <div class="stat-value">${highest ? highest.name : '—'}</div>
      <div class="stat-sub">${highest ? fmtGDP(highest.val, state.metric) + ' (' + highest.year + ')' : 'No data'}</div>
    </div>
    <div class="stat-card c2">
      <div class="stat-label">Lowest ${METRIC_LABELS[state.metric]}</div>
      <div class="stat-value">${lowest ? lowest.name : '—'}</div>
      <div class="stat-sub">${lowest ? fmtGDP(lowest.val, state.metric) + ' (' + lowest.year + ')' : 'No data'}</div>
    </div>
    <div class="stat-card c3">
      <div class="stat-label">Fastest Growing (5yr CAGR)</div>
      <div class="stat-value">${fastest ? fastest.name : '—'}</div>
      <div class="stat-sub">${fastest ? fastest.cagr.toFixed(1) + '% / yr avg' : 'Insufficient data'}</div>
    </div>
    <div class="stat-card c4">
      <div class="stat-label">Largest Economy Change</div>
      <div class="stat-value">${largest ? largest.name : '—'}</div>
      <div class="stat-sub">${largest ? (largest.change > 0 ? '+' : '') + fmtGDP(largest.change, state.metric) + ' (5yr)' : 'No data'}</div>
    </div>
  `;
}

/* ── SVG Line Chart ── */
function renderChart() {
  const W = 640, H = 300;
  const PAD = { t: 20, r: 20, b: 48, l: 80 };
  const innerW = W - PAD.l - PAD.r;
  const innerH = H - PAD.t - PAD.b;

  const ds = state.datasets.filter(d => d.data.length > 0);
  if (!ds.length) {
    document.getElementById('svg-wrap').innerHTML =
      '<p style="padding:var(--space-8);text-align:center;color:var(--color-ink-muted);font-size:var(--text-sm);">No data available for selected range.</p>';
    document.getElementById('chart-legend').innerHTML = '';
    return;
  }

  // Collect all years + values
  const allYears = [...new Set(ds.flatMap(d => d.data.map(p => p.year)))].sort((a, b) => a - b);
  const allValues = ds.flatMap(d => d.data.map(p => p.value)).filter(v => v != null);

  if (!allYears.length || !allValues.length) {
    document.getElementById('svg-wrap').innerHTML =
      '<p style="padding:var(--space-8);text-align:center;color:var(--color-ink-muted);font-size:var(--text-sm);">No data returned for the selected range.</p>';
    return;
  }

  const minY = 0;
  const maxY = Math.max(...allValues) * 1.05;
  const minX = allYears[0];
  const maxX = allYears[allYears.length - 1];
  const xRange = Math.max(maxX - minX, 1);
  const yRange = maxY - minY || 1;

  const xOf = year  => PAD.l + ((year - minX) / xRange) * innerW;
  const yOf = value => PAD.t + innerH - ((value - minY) / yRange) * innerH;

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="main-chart" aria-label="GDP line chart" role="img">`;

  // Gridlines (horizontal)
  const gridCount = 5;
  for (let i = 0; i <= gridCount; i++) {
    const v = minY + (yRange / gridCount) * i;
    const y = yOf(v);
    const label = fmtGDP(v, state.metric);
    svg += `<line x1="${PAD.l}" y1="${y.toFixed(1)}" x2="${W - PAD.r}" y2="${y.toFixed(1)}"
      stroke="oklch(84% 0.010 252)" stroke-width="1" stroke-dasharray="4 3"/>`;
    svg += `<text x="${PAD.l - 6}" y="${(y + 4).toFixed(1)}" text-anchor="end"
      font-size="10" fill="oklch(44% 0.016 256)" font-family="Plus Jakarta Sans, system-ui">${label}</text>`;
  }

  // X-axis labels (years, pick up to 10 evenly)
  const step = Math.ceil(allYears.length / 10);
  allYears.forEach((yr, i) => {
    if (i % step !== 0 && i !== allYears.length - 1) return;
    const x = xOf(yr);
    svg += `<text x="${x.toFixed(1)}" y="${(PAD.t + innerH + 18).toFixed(1)}" text-anchor="middle"
      font-size="10" fill="oklch(44% 0.016 256)" font-family="Plus Jakarta Sans, system-ui">${yr}</text>`;
  });

  // Axes
  svg += `<line x1="${PAD.l}" y1="${PAD.t}" x2="${PAD.l}" y2="${PAD.t + innerH}"
    stroke="oklch(84% 0.010 252)" stroke-width="1"/>`;
  svg += `<line x1="${PAD.l}" y1="${PAD.t + innerH}" x2="${W - PAD.r}" y2="${PAD.t + innerH}"
    stroke="oklch(84% 0.010 252)" stroke-width="1"/>`;

  // Lines per dataset — handle nulls with path M/L segments
  const totalPathLen = 2000;
  ds.forEach((d, di) => {
    const colCss = d.color;
    const colHex = d.colorHex;

    // Build path with M (move) for gaps and L (line) for data
    let pathParts = [];
    let lastWasNull = true;
    const sortedData = [...d.data].sort((a, b) => a.year - b.year);
    sortedData.forEach(pt => {
      if (pt.value == null) {
        lastWasNull = true;
      } else {
        const x = xOf(pt.year).toFixed(2);
        const y = yOf(pt.value).toFixed(2);
        pathParts.push(lastWasNull ? `M ${x} ${y}` : `L ${x} ${y}`);
        lastWasNull = false;
      }
    });

    if (!pathParts.length) return;

    const pathD = pathParts.join(' ');
    const dashLen = totalPathLen + di * 400;

    svg += `<path d="${pathD}" fill="none" stroke="${colHex}" stroke-width="2.5"
      stroke-linejoin="round" stroke-linecap="round"
      class="animated-line"
      style="--dash-len:${dashLen};stroke-dasharray:${dashLen};stroke-dashoffset:${dashLen};animation-delay:${di * 0.12}s;"
    />`;

    // Hover dots (every 5th data point to keep DOM lean; always include last)
    const dotStep = Math.max(1, Math.floor(sortedData.length / 12));
    sortedData.forEach((pt, pi) => {
      if (pt.value == null) return;
      if (pi % dotStep !== 0 && pi !== sortedData.length - 1) return;
      const cx = xOf(pt.year).toFixed(2);
      const cy = yOf(pt.value).toFixed(2);
      const tipContent = `${d.name}\n${pt.year}: ${fmtGDP(pt.value, state.metric)}`;
      svg += `<circle cx="${cx}" cy="${cy}" r="3.5"
        fill="${colHex}" stroke="oklch(98.5% 0.004 250)" stroke-width="2"
        data-tip="${tipContent.replace(/"/g, '&quot;')}"
        class="chart-dot" style="cursor:pointer;"/>`;
    });
  });

  svg += '</svg>';

  document.getElementById('svg-wrap').innerHTML = svg;

  // Legend
  document.getElementById('chart-legend').innerHTML = ds.map(d =>
    `<div class="legend-item">
      <div class="legend-swatch" style="background:${d.colorHex}"></div>
      <span>${d.name}</span>
    </div>`
  ).join('');

  // Chart title
  document.getElementById('chart-title').textContent = METRIC_LABELS[state.metric] + ' Comparison';
  document.getElementById('chart-sub').textContent =
    `${state.yearStart}–${state.yearEnd} · World Bank data · hover dots for values`;

  // Dot hover tooltips
  document.getElementById('svg-wrap').querySelectorAll('.chart-dot').forEach(dot => {
    dot.addEventListener('mouseenter', (e) => {
      const tip = document.getElementById('chart-tooltip');
      tip.innerHTML = dot.dataset.tip.replace(/\n/g, '<br>');
      tip.style.opacity = '1';
      tip.setAttribute('aria-hidden', 'false');
      moveTip(e);
    });
    dot.addEventListener('mouseleave', hideTip);
    dot.addEventListener('mousemove', moveTip);
  });
}

/* ── Tooltip ── */
function moveTip(e) {
  const tip = document.getElementById('chart-tooltip');
  const vw = window.innerWidth;
  let tx = e.clientX + 14;
  let ty = e.clientY - 36;
  if (tx + 220 > vw) tx = e.clientX - 230;
  tip.style.left = tx + 'px';
  tip.style.top  = ty + 'px';
}
function hideTip() {
  const tip = document.getElementById('chart-tooltip');
  tip.style.opacity = '0';
  tip.setAttribute('aria-hidden', 'true');
}

/* ── Data Table ── */
function renderTable() {
  const ds = state.datasets;
  if (!ds.length) return;

  // Collect all years across datasets, pick latest 10
  const allYears = [...new Set(ds.flatMap(d => d.data.map(p => p.year)))].sort((a, b) => a - b);
  const displayYears = allYears.slice(-10);

  // Header
  const thead = document.getElementById('table-head');
  thead.innerHTML = `<tr>
    <th class="sorted" data-col="country" data-asc="true" scope="col">Country</th>
    ${displayYears.map(yr => `<th data-col="${yr}" scope="col">${yr}</th>`).join('')}
  </tr>`;

  // Sort state
  state.sortCol = 'country';
  state.sortAsc = true;

  function buildRows(sortCol, sortAsc) {
    let rows = ds.map(d => {
      const vals = {};
      d.data.forEach(p => { vals[p.year] = p.value; });
      return { ...d, vals };
    });

    rows.sort((a, b) => {
      if (sortCol === 'country') {
        return sortAsc ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
      }
      const va = a.vals[sortCol] ?? -Infinity;
      const vb = b.vals[sortCol] ?? -Infinity;
      return sortAsc ? va - vb : vb - va;
    });

    document.getElementById('table-body').innerHTML = rows.map(r =>
      `<tr>
        <td>
          <span class="td-swatch" style="background:${r.colorHex}"></span>
          ${r.name}
        </td>
        ${displayYears.map(yr =>
          `<td>${r.vals[yr] != null ? fmtGDP(r.vals[yr], state.metric) : '—'}</td>`
        ).join('')}
      </tr>`
    ).join('');
  }

  buildRows('country', true);

  // Sort on header click
  thead.querySelectorAll('th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      const wasAsc = th.dataset.asc === 'true';
      const newAsc = col === state.sortCol ? !wasAsc : true;
      state.sortCol = col;
      state.sortAsc = newAsc;

      thead.querySelectorAll('th').forEach(h => {
        h.classList.remove('sorted', 'asc');
        delete h.dataset.asc;
      });
      th.classList.add('sorted');
      if (newAsc) th.classList.add('asc');
      th.dataset.asc = newAsc;
      buildRows(col, newAsc);
    });
  });
}

/* ── Export ── */
function exportCSV() {
  const ds = state.datasets;
  if (!ds.length) return;

  const allYears = [...new Set(ds.flatMap(d => d.data.map(p => p.year)))].sort((a, b) => a - b);
  const header = ['Country', 'ISO2', ...allYears].join(',');
  const rows = ds.map(d => {
    const vals = {};
    d.data.forEach(p => { vals[p.year] = p.value; });
    return [d.name, d.iso2, ...allYears.map(yr => vals[yr] ?? '')].join(',');
  });

  const csv = [header, ...rows].join('\n');
  navigator.clipboard.writeText(csv)
    .then(() => toast('CSV copied to clipboard', 'success'))
    .catch(() => toast('Copy failed — try a different browser', 'error'));
}

function exportJSON() {
  const ds = state.datasets;
  if (!ds.length) return;

  const payload = {
    metric: state.metric,
    metricLabel: METRIC_LABELS[state.metric],
    yearRange: [state.yearStart, state.yearEnd],
    exportedAt: new Date().toISOString(),
    countries: ds.map(d => ({
      iso2: d.iso2,
      name: d.name,
      data: d.data,
    })),
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gdp-comparison-${state.metric}-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('JSON downloaded', 'success');
}

/* ── Init: Default selection (US, China, Germany, Japan) ── */
async function init() {
  // Load country list first
  const countries = await fetchCountryList();
  state.countries = countries;

  // Pre-select defaults after countries are loaded
  const defaults = [
    { iso2: 'US', fallback: 'United States' },
    { iso2: 'CN', fallback: 'China' },
    { iso2: 'DE', fallback: 'Germany' },
    { iso2: 'JP', fallback: 'Japan' },
  ];

  defaults.forEach(({ iso2, fallback }) => {
    const found = state.countries.find(c => c.iso2 === iso2) || { iso2, name: fallback };
    if (state.selected.length < 5) {
      const i = state.selected.length;
      state.selected.push({ iso2: found.iso2, name: found.name, color: COLORS[i], colorHex: COLORS_HEX[i] });
    }
  });

  renderChips();
  updateCompareBtn();

  if (!countries.length) {
    toast('Failed to load country list — search may not work', 'error');
  }
}

/* ── Event Wiring ── */
const searchEl = document.getElementById('country-search');
searchEl.addEventListener('input', (e) => renderCountryList(e.target.value));
searchEl.addEventListener('focus', (e) => { if (e.target.value) renderCountryList(e.target.value); });

document.getElementById('country-list').addEventListener('click', (e) => {
  const opt = e.target.closest('.country-option');
  if (!opt || opt.style.cursor === 'default') return;
  addCountry(opt.dataset.iso2, opt.dataset.name);
});

document.addEventListener('pointerdown', (e) => {
  if (!document.getElementById('country-list').contains(e.target) &&
      e.target !== searchEl) {
    document.getElementById('country-list').classList.remove('open');
  }
}, { passive: true });

document.querySelectorAll('.btn-preset').forEach(btn => {
  btn.addEventListener('click', () => applyPreset(btn.dataset.preset));
});

document.getElementById('btn-clear-all').addEventListener('click', () => {
  state.selected = [];
  renderChips();
  updateCompareBtn();
});

document.getElementById('btn-compare').addEventListener('click', compare);
document.getElementById('btn-csv').addEventListener('click', exportCSV);
document.getElementById('btn-json').addEventListener('click', exportJSON);

// Year input validation
['year-start', 'year-end'].forEach(id => {
  document.getElementById(id).addEventListener('change', (e) => {
    let v = parseInt(e.target.value) || 1990;
    v = clamp(v, 1960, 2024);
    e.target.value = v;
  });
});

// Keyboard: Enter on search selects first match
searchEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const first = document.querySelector('#country-list .country-option:not([style*="cursor:default"])');
    if (first) {
      addCountry(first.dataset.iso2, first.dataset.name);
      e.preventDefault();
    }
  }
  if (e.key === 'Escape') {
    document.getElementById('country-list').classList.remove('open');
  }
});

// Arrow-key navigation in country list
searchEl.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowDown') return;
  const first = document.querySelector('#country-list .country-option');
  if (first) { first.focus(); e.preventDefault(); }
});

document.getElementById('country-list').addEventListener('keydown', (e) => {
  const opts = [...document.querySelectorAll('#country-list .country-option')];
  const idx = opts.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' && idx < opts.length - 1) { opts[idx + 1].focus(); e.preventDefault(); }
  if (e.key === 'ArrowUp') {
    if (idx > 0) { opts[idx - 1].focus(); }
    else { searchEl.focus(); }
    e.preventDefault();
  }
  if (e.key === 'Enter' && idx >= 0) {
    const opt = opts[idx];
    if (opt.style.cursor !== 'default') addCountry(opt.dataset.iso2, opt.dataset.name);
    e.preventDefault();
  }
  if (e.key === 'Escape') {
    document.getElementById('country-list').classList.remove('open');
    searchEl.focus();
  }
});

// Make country options focusable via tabindex
document.getElementById('country-list').addEventListener('click', () => {
  document.querySelectorAll('#country-list .country-option').forEach(o => o.setAttribute('tabindex', '0'));
});

init();
</script>
