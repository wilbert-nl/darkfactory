<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldenhour — Sunrise &amp; Sunset Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Workbench · theme: Garden · nav: N9 */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow-x: clip; }
body {
  height: 100%;
  overflow: hidden;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ── N9 Fixed nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 52px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}

.nav-logo {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  flex-shrink: 0;
}
.nav-logo span { color: var(--color-warn); }

.nav-sep {
  width: 1px; height: 16px;
  background: var(--color-border);
  flex-shrink: 0;
}

.nav-label {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
}

.nav-clock {
  margin-left: auto;
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--color-success);
  box-shadow: 0 0 0 0 oklch(55% 0.14 155 / 0.4);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { box-shadow: 0 0 0 0 oklch(55% 0.14 155 / 0.4); }
  50%       { box-shadow: 0 0 0 5px oklch(55% 0.14 155 / 0); }
}

.nav-back {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  transition: color 0.15s var(--ease-out);
  flex-shrink: 0;
}
.nav-back:hover { color: var(--color-ink); }

/* ── App shell ── */
.app-shell {
  display: grid;
  grid-template-columns: 300px 1fr;
  margin-top: 52px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--color-border);
  background: var(--color-paper-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-section {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}

.sidebar-section-title {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  border-left: 2px solid var(--color-accent);
  padding-left: var(--space-2);
  color: var(--color-ink-muted);
  margin-bottom: var(--space-3);
}

/* Location input */
.location-wrap {
  position: relative;
  margin-bottom: var(--space-3);
}

.input-location {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  transition: border-color 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out);
  padding-right: 2.5rem;
}
.input-location:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px oklch(52% 0.14 155 / 0.10); }
.input-location::placeholder { color: var(--color-ink-muted); }

.btn-geolocate {
  position: absolute;
  right: 0.5rem;
  top: 50%;
  transform: translateY(-50%);
  width: 26px; height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--color-ink-muted);
  border-radius: var(--radius-sm);
  font-size: 1rem;
  transition: color 0.15s var(--ease-out), background 0.15s var(--ease-out);
}
.btn-geolocate:hover { color: var(--color-warn); background: oklch(62% 0.15 72 / 0.08); }

/* Autocomplete */
.autocomplete-drop {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px oklch(18% 0.04 155 / 0.12);
  z-index: 300;
  overflow: hidden;
  display: none;
}
.autocomplete-drop.open { display: block; }

.ac-item {
  padding: var(--space-2) var(--space-3);
  font-size: var(--text-sm);
  cursor: pointer;
  transition: background 0.1s var(--ease-out);
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.ac-item:hover, .ac-item:focus { background: var(--color-accent-subtle); outline: none; }
.ac-item-name { font-weight: 500; color: var(--color-ink); }
.ac-item-detail { font-size: var(--text-xs); color: var(--color-ink-muted); }
.ac-loading {
  padding: var(--space-2) var(--space-3);
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
}

/* Date picker */
.date-row {
  display: flex;
  gap: var(--space-2);
  align-items: stretch;
  margin-bottom: var(--space-3);
}

.input-date {
  flex: 1;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  transition: border-color 0.15s var(--ease-out);
  cursor: pointer;
}
.input-date:focus { outline: none; border-color: var(--color-accent); }

.btn-lookup {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  background: var(--color-accent);
  color: var(--color-paper);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: opacity 0.15s var(--ease-out), transform 0.15s var(--ease-out);
  white-space: nowrap;
  width: 100%;
}
.btn-lookup:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
.btn-lookup:disabled { opacity: 0.45; cursor: not-allowed; }

/* Sessions list */
.sessions-wrap {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-2) 0;
}

.sessions-empty {
  padding: var(--space-8) var(--space-4);
  text-align: center;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  line-height: 1.7;
}

.session-item {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.12s var(--ease-out), border-color 0.12s var(--ease-out);
  position: relative;
}
.session-item:hover { background: var(--color-paper-3); }
.session-item.active { background: var(--color-paper-3); border-left-color: var(--color-warn); }

.session-item-body { flex: 1; min-width: 0; }
.session-item-name {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.session-item-meta {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  margin-top: 1px;
}
.session-item-times {
  font-size: var(--text-xs);
  color: var(--color-warn);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  flex-shrink: 0;
}

.btn-del-session {
  position: absolute;
  top: 0.5rem; right: 0.5rem;
  width: 20px; height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  color: var(--color-ink-muted);
  cursor: pointer;
  border-radius: var(--radius-sm);
  font-size: 0.75rem;
  transition: color 0.15s var(--ease-out), background 0.15s var(--ease-out);
  opacity: 0;
}
.session-item:hover .btn-del-session { opacity: 1; }
.btn-del-session:hover { color: var(--color-danger); background: oklch(55% 0.20 25 / 0.08); }

/* Sidebar footer: save + export */
.sidebar-foot {
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--color-border);
  flex-shrink: 0;
  display: flex;
  gap: var(--space-2);
}

.btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: transparent;
  color: var(--color-ink-muted);
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.15s var(--ease-out);
  flex: 1;
}
.btn-ghost:hover:not(:disabled) { color: var(--color-ink); border-color: var(--color-ink-muted); }
.btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-ghost-amber {
  color: var(--color-warn);
  border-color: oklch(62% 0.15 72 / 0.35);
}
.btn-ghost-amber:hover:not(:disabled) {
  color: oklch(55% 0.18 72);
  border-color: var(--color-warn);
  background: oklch(62% 0.15 72 / 0.06);
}

/* ── Main panel ── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-paper);
}

/* Empty / loading state */
.main-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-16);
  text-align: center;
  gap: var(--space-4);
}

.main-empty-icon {
  font-size: 3rem;
  line-height: 1;
  opacity: 0.35;
}

.main-empty-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
}

.main-empty-sub {
  font-size: var(--text-base);
  color: var(--color-ink-muted);
  max-width: 320px;
  line-height: 1.65;
}

/* Main scroll */
.main-scroll {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

/* ── Timeline hero ── */
.timeline-section {
  padding: var(--space-6) var(--space-8) 0;
  flex-shrink: 0;
}

.timeline-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: var(--space-4);
}

.timeline-location {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
}

.timeline-date {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
}

/* The visual timeline bar */
.timeline-bar-wrap {
  position: relative;
  margin-bottom: var(--space-2);
}

.timeline-bar {
  height: 56px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  position: relative;
}

/* Base gradient — 24h from left=00:00 to right=24:00 */
.timeline-bar-bg {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to right,
    oklch(12% 0.06 255) 0%,       /* midnight — deep night */
    oklch(14% 0.10 270) 15%,      /* pre-dawn — dark navy */
    oklch(28% 0.14 260) 22%,      /* nautical twilight */
    oklch(44% 0.12 240) 27%,      /* civil twilight */
    oklch(72% 0.18 72) 32%,       /* golden hour AM — amber */
    oklch(82% 0.14 88) 37%,       /* mid morning — warm yellow */
    oklch(88% 0.10 95) 50%,       /* solar noon — bright */
    oklch(82% 0.14 88) 63%,       /* afternoon */
    oklch(72% 0.18 72) 68%,       /* golden hour PM — amber */
    oklch(44% 0.12 240) 73%,      /* civil twilight */
    oklch(28% 0.14 260) 78%,      /* nautical twilight */
    oklch(14% 0.10 270) 85%,      /* astronomical twilight */
    oklch(12% 0.06 255) 100%      /* midnight */
  );
}

/* Dynamic colored bar segments (set via JS inline style on overlay divs) */
.timeline-bar-segments {
  position: absolute;
  inset: 0;
  display: flex;
}

/* Marker labels below bar */
.timeline-labels {
  position: relative;
  height: 28px;
  margin-bottom: var(--space-4);
}

.timeline-label {
  position: absolute;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
}

.timeline-label-tick {
  width: 1px;
  height: 5px;
  background: var(--color-border);
  margin: 0 auto 2px;
}

.timeline-label-time {
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  color: var(--color-ink-muted);
  white-space: nowrap;
}

.timeline-label-name {
  font-size: 9px;
  color: var(--color-ink-muted);
  white-space: nowrap;
  opacity: 0.75;
}

/* Now marker */
.now-marker {
  position: absolute;
  top: 0;
  width: 2px;
  height: 100%;
  background: var(--color-danger);
  border-radius: 1px;
  transform: translateX(-50%);
  pointer-events: none;
}

.now-marker::before {
  content: 'Now';
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  color: var(--color-danger);
  font-weight: 600;
  white-space: nowrap;
}

/* ── Sun data cards ── */
.cards-section {
  padding: 0 var(--space-8) var(--space-6);
  flex-shrink: 0;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: var(--space-3);
}

.sun-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-3) var(--space-4);
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: border-color 0.15s var(--ease-out), transform 0.15s var(--ease-out);
}
.sun-card:hover { border-color: var(--color-accent-line); transform: translateY(-1px); }

.sun-card-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--color-ink-muted);
}

.sun-card-time {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.sun-card-sub {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  line-height: 1.4;
}

.sun-card.golden { border-left: 3px solid var(--color-warn); }
.sun-card.blue-h  { border-left: 3px solid oklch(52% 0.18 255); }
.sun-card.rise    { border-left: 3px solid var(--color-warn); }
.sun-card.set     { border-left: 3px solid oklch(58% 0.18 32); }
.sun-card.noon    { border-left: 3px solid oklch(72% 0.12 95); }
.sun-card.length  { border-left: 3px solid var(--color-success); }

/* ── 7-day calendar ── */
.calendar-section {
  padding: 0 var(--space-8) var(--space-8);
  flex: 1;
}

.section-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  border-left: 2px solid var(--color-accent);
  padding-left: var(--space-2);
  color: var(--color-ink-muted);
  margin-bottom: var(--space-3);
}

.week-rows {
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.week-row {
  display: grid;
  grid-template-columns: 120px 1fr 100px 100px 120px;
  gap: var(--space-4);
  align-items: center;
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  transition: background 0.1s var(--ease-out);
  cursor: pointer;
}
.week-row:last-child { border-bottom: none; }
.week-row:hover { background: var(--color-paper-3); }
.week-row.today { background: oklch(62% 0.15 72 / 0.05); }
.week-row.selected { background: oklch(62% 0.15 72 / 0.08); }

.week-row-day {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.week-row-dayname {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--color-ink-muted);
}

.week-row-date {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.01em;
  line-height: 1.2;
}

.today-badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.03em;
  color: var(--color-paper);
  background: var(--color-warn);
  border-radius: 3px;
  padding: 1px 5px;
  margin-top: 2px;
}

/* Day length bar */
.week-day-bar-wrap {
  position: relative;
  height: 6px;
  background: var(--color-border);
  border-radius: 3px;
  overflow: hidden;
}

.week-day-bar-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--color-warn), oklch(72% 0.18 72));
  transition: width 0.4s var(--ease-out);
}

.week-time {
  font-size: var(--text-sm);
  font-variant-numeric: tabular-nums;
  color: var(--color-ink);
  text-align: right;
}

.week-time-label {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  text-align: right;
}

.week-length {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

/* ── Loading skeleton ── */
.skeleton {
  background: linear-gradient(90deg, var(--color-border) 25%, var(--color-paper-2) 50%, var(--color-border) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease infinite;
  border-radius: var(--radius-sm);
}
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ── Spinner ── */
.spinner {
  width: 14px; height: 14px;
  border: 2px solid var(--color-border);
  border-top-color: var(--color-accent);
  border-radius: 50%;
  animation: spin 0.65s linear infinite;
  display: inline-block;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 600;
  background: var(--color-ink);
  color: var(--color-paper);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px oklch(18% 0.04 155 / 0.2);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s var(--ease-out), transform 0.2s var(--ease-out);
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--color-success); }
.toast.error   { background: var(--color-danger); }
.toast.warn    { background: var(--color-warn); color: oklch(18% 0.04 95); }

/* ── Mobile ── */
@media (max-width: 768px) {
  html, body { overflow: auto; height: auto; }

  .app-shell {
    grid-template-columns: 1fr;
    height: auto;
    overflow: visible;
    margin-top: 52px;
  }

  .sidebar {
    border-right: none;
    border-bottom: 1px solid var(--color-border);
    height: auto;
    overflow: visible;
  }
  .sessions-wrap { max-height: 30vh; }

  .main { overflow: visible; }
  .main-scroll { overflow: visible; }

  .timeline-section { padding: var(--space-4); }
  .cards-section { padding: 0 var(--space-4) var(--space-4); }
  .calendar-section { padding: 0 var(--space-4) var(--space-4); }

  .cards-grid { grid-template-columns: repeat(2, 1fr); }

  .week-row { grid-template-columns: 90px 1fr 80px 80px; }
  .week-length { display: none; }
}

@media (max-width: 480px) {
  .cards-grid { grid-template-columns: 1fr 1fr; }
  .week-row { grid-template-columns: 80px 1fr 70px; }
  .week-time-label { display: none; }
}

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  .skeleton { animation: none; }
  .spinner  { animation: none; }
  .live-dot { animation: none; }
  .sun-card:hover { transform: none; }
  .btn-lookup:hover { transform: none; }
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
</style>
</head>

<!-- Toast -->
<div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

<script>
'use strict';
/* ─────────────────────────────────────────
   Goldenhour · app.html
   Hallmark · macrostructure: Workbench · theme: Garden · nav: N9
   ───────────────────────────────────────── */

// ── State ────────────────────────────────────────────────────────────────────
const S = {
  location: null,  // { name, lat, lng }
  date: null,      // YYYY-MM-DD
  sunData: null,   // primary day results
  weekData: [],    // [{ date, data }] × 7
  sessions: loadSessions(),
  loading: false,
};

// ── Utils ─────────────────────────────────────────────────────────────────────
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function pad(n) { return String(n).padStart(2, '0'); }

function dateFromStr(s) {
  // Parse YYYY-MM-DD at noon local to avoid DST shifts
  return new Date(`${s}T12:00:00`);
}

function formatTime(isoStr) {
  if (!isoStr || isoStr === 'always_up' || isoStr === 'always_down') return '—';
  return new Date(isoStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addMins(isoStr, m) {
  if (!isoStr || isoStr === 'always_up' || isoStr === 'always_down') return null;
  const d = new Date(isoStr);
  d.setMinutes(d.getMinutes() + m);
  return d.toISOString();
}

function fmtDuration(seconds) {
  if (!seconds || isNaN(seconds)) return '—';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  return `${h}h ${m}m`;
}

// Map an ISO timestamp to a 0–1 fraction of the 24h day in LOCAL time
function timeToFrac(isoStr) {
  if (!isoStr) return null;
  const d = new Date(isoStr);
  const local = new Date(d.toLocaleString('en-US'));
  const h = local.getHours() + local.getMinutes() / 60 + local.getSeconds() / 3600;
  return h / 24;
}

// ── Sessions storage ──────────────────────────────────────────────────────────
function loadSessions() {
  try { return JSON.parse(localStorage.getItem('gh-sessions') || '[]'); } catch { return []; }
}

function persistSessions() {
  localStorage.setItem('gh-sessions', JSON.stringify(S.sessions));
}

// ── Clock ─────────────────────────────────────────────────────────────────────
function updateClock() {
  document.getElementById('live-clock').textContent =
    new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
updateClock();
setInterval(updateClock, 1000);

// ── Date init ─────────────────────────────────────────────────────────────────
const inputDate = document.getElementById('input-date');
inputDate.value = todayStr();
S.date = todayStr();

inputDate.addEventListener('change', () => {
  S.date = inputDate.value;
  if (S.location) fetchAndRender();
});

// ── Geocoding (Nominatim) ─────────────────────────────────────────────────────
let debounceTimer = null;
const inputLoc = document.getElementById('input-location');
const acDrop = document.getElementById('ac-drop');

inputLoc.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = inputLoc.value.trim();
  if (q.length < 2) { acHide(); return; }
  debounceTimer = setTimeout(() => geocode(q), 600);
});

inputLoc.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') acHide();
  if (e.key === 'Enter') { acHide(); if (S.location) fetchAndRender(); }
  if (e.key === 'ArrowDown') {
    const first = acDrop.querySelector('[role="option"]');
    if (first) { first.focus(); e.preventDefault(); }
  }
});

acDrop.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { acHide(); inputLoc.focus(); }
  if (e.key === 'ArrowDown') {
    const next = document.activeElement.nextElementSibling;
    if (next) { next.focus(); e.preventDefault(); }
  }
  if (e.key === 'ArrowUp') {
    const prev = document.activeElement.previousElementSibling;
    if (prev) prev.focus(); else inputLoc.focus();
    e.preventDefault();
  }
});

document.addEventListener('pointerdown', (e) => {
  if (!e.target.closest('.location-wrap')) acHide();
}, { passive: true });

async function geocode(q) {
  acDrop.innerHTML = '<div class="ac-loading">Searching…</div>';
  acShow();
  try {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5`,
      { headers: { 'User-Agent': 'Goldenhour/1.0' } }
    );
    const data = await res.json();
    renderAC(data);
  } catch {
    acDrop.innerHTML = '<div class="ac-loading">Search failed. Check connection.</div>';
  }
}

function renderAC(results) {
  if (!results.length) {
    acDrop.innerHTML = '<div class="ac-loading">No locations found.</div>';
    return;
  }
  acDrop.innerHTML = results.map((r, i) => {
    const parts = r.display_name.split(',');
    const name = parts[0].trim();
    const detail = parts.slice(1, 3).map(s => s.trim()).filter(Boolean).join(', ');
    return `<div class="ac-item" tabindex="0" role="option" data-lat="${r.lat}" data-lng="${r.lon}" data-name="${esc(r.display_name)}" data-short="${esc(name)}">
      <span class="ac-item-name">${esc(name)}</span>
      ${detail ? `<span class="ac-item-detail">${esc(detail)}</span>` : ''}
    </div>`;
  }).join('');

  acDrop.querySelectorAll('.ac-item').forEach(el => {
    el.addEventListener('click',   () => selectLocation(el));
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') selectLocation(el); });
  });
}

function selectLocation(el) {
  S.location = {
    name: el.dataset.short || el.dataset.name,
    fullName: el.dataset.name,
    lat: parseFloat(el.dataset.lat),
    lng: parseFloat(el.dataset.lng),
  };
  inputLoc.value = S.location.name;
  acHide();
  enableSidebar();
}

function acShow() { acDrop.classList.add('open'); inputLoc.setAttribute('aria-expanded', 'true'); }
function acHide() { acDrop.classList.remove('open'); inputLoc.setAttribute('aria-expanded', 'false'); }

// ── Geolocation ───────────────────────────────────────────────────────────────
document.getElementById('btn-geolocate').addEventListener('click', () => {
  if (!navigator.geolocation) { toast('Geolocation not supported', 'error'); return; }
  const btn = document.getElementById('btn-geolocate');
  btn.textContent = '⏳';
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const { latitude: lat, longitude: lng } = pos.coords;
    // Reverse geocode via Nominatim
    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,
        { headers: { 'User-Agent': 'Goldenhour/1.0' } }
      );
      const data = await res.json();
      const parts = (data.display_name || '').split(',');
      S.location = {
        name: parts[0].trim() || `${lat.toFixed(4)}, ${lng.toFixed(4)}`,
        lat, lng,
      };
    } catch {
      S.location = { name: `${lat.toFixed(4)}, ${lng.toFixed(4)}`, lat, lng };
    }
    inputLoc.value = S.location.name;
    btn.textContent = '📍';
    btn.disabled = false;
    enableSidebar();
    fetchAndRender();
  }, () => {
    toast('Location access denied', 'error');
    btn.textContent = '📍';
    btn.disabled = false;
  });
});

function enableSidebar() {
  // No-op — lookup button always available, just needs location
}

// ── Lookup button ─────────────────────────────────────────────────────────────
document.getElementById('btn-lookup').addEventListener('click', () => {
  if (!S.location) { toast('Please select a location first', 'warn'); inputLoc.focus(); return; }
  if (!S.date)     { toast('Please pick a date', 'warn'); inputDate.focus(); return; }
  fetchAndRender();
});

// ── Fetch sun data ────────────────────────────────────────────────────────────
async function fetchSunData(lat, lng, date) {
  const url = `https://api.sunrise-sunset.org/json?lat=${lat}&lng=${lng}&date=${date}&formatted=0`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.status !== 'OK') throw new Error(json.status);
  return json.results;
}

async function fetchAndRender() {
  if (S.loading) return;
  S.loading = true;
  setLoadingUI(true);

  try {
    const dates = Array.from({ length: 7 }, (_, i) => {
      const d = dateFromStr(S.date);
      d.setDate(d.getDate() + i);
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    });

    const results = await Promise.all(
      dates.map(dt => fetchSunData(S.location.lat, S.location.lng, dt))
    );

    S.sunData = results[0];
    S.weekData = results.map((data, i) => ({ date: dates[i], data }));

    render();
    enableActions();
    showMain();
    toast(`Sun times loaded for ${S.location.name}`, 'success');
  } catch (e) {
    toast('Failed to load sun data. Check your connection.', 'error');
    console.error(e);
  } finally {
    S.loading = false;
    setLoadingUI(false);
  }
}

function setLoadingUI(on) {
  const lbl = document.getElementById('lookup-label');
  const btn = document.getElementById('btn-lookup');
  lbl.innerHTML = on ? '<span class="spinner"></span> Loading…' : 'Look up sun times';
  btn.disabled = on;
}

function showMain() {
  document.getElementById('main-empty').style.display = 'none';
  document.getElementById('main-content').style.display = 'flex';
}

function enableActions() {
  document.getElementById('btn-save-session').disabled = false;
  document.getElementById('btn-export-ics').disabled = false;
}

// ── Render all ────────────────────────────────────────────────────────────────
function render() {
  renderTimeline(S.sunData, S.date);
  renderCards(S.sunData);
  renderWeek();
}

// ── Computed times ────────────────────────────────────────────────────────────
function goldenHours(data) {
  return {
    am_start: data.civil_twilight_begin,
    am_end:   addMins(data.sunrise, 60),
    pm_start: addMins(data.sunset, -60),
    pm_end:   data.civil_twilight_end,
  };
}

function blueHours(data) {
  return {
    am_start: addMins(data.nautical_twilight_begin, -10),
    am_end:   data.civil_twilight_begin,
    pm_start: data.civil_twilight_end,
    pm_end:   addMins(data.civil_twilight_end, 30),
  };
}

// ── Timeline render ───────────────────────────────────────────────────────────
function renderTimeline(data, date) {
  const bar   = document.getElementById('timeline-bar');
  const labels = document.getElementById('timeline-labels');

  document.getElementById('tl-location').textContent = S.location.name;
  document.getElementById('tl-date').textContent = dateFromStr(date).toLocaleDateString(
    [], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }
  );

  // Remove old overlays (keep .timeline-bar-bg)
  bar.querySelectorAll('.tl-segment, .now-marker').forEach(el => el.remove());

  if (!data.sunrise || data.sunrise === 'always_up' || data.sunrise === 'always_down') {
    labels.innerHTML = '';
    return;
  }

  const gh = goldenHours(data);
  const bh = blueHours(data);

  // Build colored segments
  const segments = [
    { start: data.astronomical_twilight_begin, end: data.nautical_twilight_begin,
      color: 'oklch(22% 0.12 270 / 0.55)', label: '' },
    { start: data.nautical_twilight_begin, end: data.civil_twilight_begin,
      color: 'oklch(34% 0.15 260 / 0.55)', label: '' },
    { start: bh.am_start, end: bh.am_end,
      color: 'oklch(44% 0.18 255 / 0.5)', label: '' },
    { start: gh.am_start, end: gh.am_end,
      color: 'oklch(72% 0.18 72 / 0.45)', label: '' },
    { start: data.sunrise, end: data.sunset,
      color: 'oklch(88% 0.10 88 / 0.22)', label: '' },
    { start: gh.pm_start, end: gh.pm_end,
      color: 'oklch(72% 0.18 72 / 0.45)', label: '' },
    { start: bh.pm_start, end: bh.pm_end,
      color: 'oklch(44% 0.18 255 / 0.5)', label: '' },
    { start: data.civil_twilight_end, end: data.nautical_twilight_end,
      color: 'oklch(34% 0.15 260 / 0.55)', label: '' },
    { start: data.nautical_twilight_end, end: data.astronomical_twilight_end,
      color: 'oklch(22% 0.12 270 / 0.55)', label: '' },
  ];

  segments.forEach(seg => {
    if (!seg.start || !seg.end) return;
    const startFrac = timeToFrac(seg.start);
    const endFrac   = timeToFrac(seg.end);
    if (startFrac == null || endFrac == null || endFrac <= startFrac) return;
    const div = document.createElement('div');
    div.className = 'tl-segment';
    div.style.cssText = `
      position:absolute;
      top:0; bottom:0;
      left:${(startFrac*100).toFixed(3)}%;
      width:${((endFrac-startFrac)*100).toFixed(3)}%;
      background:${seg.color};
      pointer-events:none;
    `;
    bar.appendChild(div);
  });

  // Now marker
  const nowFrac = (new Date().getHours() + new Date().getMinutes()/60) / 24;
  const nowEl = document.createElement('div');
  nowEl.className = 'now-marker';
  nowEl.style.left = `${(nowFrac*100).toFixed(2)}%`;
  nowEl.setAttribute('aria-label', 'Current time');
  bar.appendChild(nowEl);

  // Labels at key times
  const keyTimes = [
    { iso: data.civil_twilight_begin, label: 'Dawn',    time: formatTime(data.civil_twilight_begin) },
    { iso: data.sunrise,              label: 'Sunrise', time: formatTime(data.sunrise) },
    { iso: data.solar_noon,           label: 'Noon',    time: formatTime(data.solar_noon) },
    { iso: data.sunset,               label: 'Sunset',  time: formatTime(data.sunset) },
    { iso: data.civil_twilight_end,   label: 'Dusk',    time: formatTime(data.civil_twilight_end) },
  ];

  labels.innerHTML = keyTimes.map(k => {
    if (!k.iso || k.iso === 'always_up' || k.iso === 'always_down') return '';
    const frac = timeToFrac(k.iso);
    if (frac == null) return '';
    return `<div class="timeline-label" style="left:${(frac*100).toFixed(2)}%">
      <div class="timeline-label-tick"></div>
      <div class="timeline-label-time">${k.time}</div>
      <div class="timeline-label-name">${k.label}</div>
    </div>`;
  }).join('');
}

// ── Cards render ──────────────────────────────────────────────────────────────
function renderCards(data) {
  const gh = goldenHours(data);
  const bh = blueHours(data);
  const grid = document.getElementById('cards-grid');

  const cards = [
    {
      cls: 'rise',
      label: 'Sunrise',
      time: formatTime(data.sunrise),
      sub: 'Sun clears horizon',
    },
    {
      cls: 'golden',
      label: 'Golden Hour AM',
      time: `${formatTime(gh.am_start)} – ${formatTime(gh.am_end)}`,
      sub: 'Warm directional light',
    },
    {
      cls: 'noon',
      label: 'Solar Noon',
      time: formatTime(data.solar_noon),
      sub: 'Sun at highest point',
    },
    {
      cls: 'golden',
      label: 'Golden Hour PM',
      time: `${formatTime(gh.pm_start)} – ${formatTime(gh.pm_end)}`,
      sub: 'Magic light window',
    },
    {
      cls: 'set',
      label: 'Sunset',
      time: formatTime(data.sunset),
      sub: 'Sun below horizon',
    },
    {
      cls: 'length',
      label: 'Day Length',
      time: fmtDuration(data.day_length),
      sub: 'Total daylight today',
    },
  ];

  grid.innerHTML = cards.map(c =>
    `<div class="sun-card ${c.cls}" tabindex="0" role="article" aria-label="${c.label}: ${c.time}">
      <span class="sun-card-label">${c.label}</span>
      <span class="sun-card-time">${c.time}</span>
      <span class="sun-card-sub">${c.sub}</span>
    </div>`
  ).join('');
}

// ── Week render ───────────────────────────────────────────────────────────────
function renderWeek() {
  const tbody = document.getElementById('week-rows');
  const today = todayStr();

  // Max day length for proportional bar (estimate 16h = 57600s)
  const maxLen = 57600;

  tbody.innerHTML = S.weekData.map(({ date, data }) => {
    const d = dateFromStr(date);
    const dayName = d.toLocaleDateString([], { weekday: 'short' });
    const dayNum  = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    const isToday    = date === today;
    const isSelected = date === S.date;
    const barPct = Math.min(100, Math.max(5, ((data.day_length || 0) / maxLen) * 100));

    return `<div class="week-row${isToday ? ' today' : ''}${isSelected ? ' selected' : ''}"
              role="row"
              tabindex="0"
              data-date="${date}"
              aria-label="${dayName} ${dayNum}: Sunrise ${formatTime(data.sunrise)}, Sunset ${formatTime(data.sunset)}"
            >
      <div class="week-row-day">
        <span class="week-row-dayname">${dayName}</span>
        <span class="week-row-date">${dayNum}</span>
        ${isToday ? '<span class="today-badge">Today</span>' : ''}
      </div>
      <div class="week-day-bar-wrap">
        <div class="week-day-bar-fill" style="width:${barPct.toFixed(1)}%"></div>
      </div>
      <div>
        <div class="week-time">🌅 ${formatTime(data.sunrise)}</div>
        <div class="week-time-label">Sunrise</div>
      </div>
      <div>
        <div class="week-time">🌇 ${formatTime(data.sunset)}</div>
        <div class="week-time-label">Sunset</div>
      </div>
      <div class="week-length">${fmtDuration(data.day_length)}</div>
    </div>`;
  }).join('');

  // Click to switch day
  tbody.querySelectorAll('.week-row').forEach(row => {
    const handler = () => {
      const date = row.dataset.date;
      const entry = S.weekData.find(w => w.date === date);
      if (!entry) return;
      S.date = date;
      inputDate.value = date;
      S.sunData = entry.data;
      render();
      // Highlight
      tbody.querySelectorAll('.week-row').forEach(r => r.classList.remove('selected'));
      row.classList.add('selected');
    };
    row.addEventListener('click', handler);
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') handler(); });
  });
}

// ── Sessions ──────────────────────────────────────────────────────────────────
function renderSessions() {
  const wrap = document.getElementById('sessions-wrap');
  if (!S.sessions.length) {
    wrap.innerHTML = `<div class="sessions-empty" role="listitem">No saved sessions yet.<br>Load a location and hit Save.</div>`;
    return;
  }

  wrap.innerHTML = S.sessions.map((s, i) =>
    `<div class="session-item${s.id === S._activeSession ? ' active' : ''}"
          role="listitem"
          tabindex="0"
          data-i="${i}"
          aria-label="Session: ${esc(s.name)}, ${s.date}"
     >
      <button class="btn-del-session" data-del="${i}" aria-label="Delete session ${esc(s.name)}" title="Delete">×</button>
      <div class="session-item-body">
        <div class="session-item-name">${esc(s.name)}</div>
        <div class="session-item-meta">${s.date} · ${esc(s.location)}</div>
      </div>
      <div class="session-item-times">
        🌅 ${s.sunrise}<br>🌇 ${s.sunset}
      </div>
    </div>`
  ).join('');

  wrap.querySelectorAll('.session-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.btn-del-session')) return;
      const s = S.sessions[parseInt(el.dataset.i)];
      loadSession(s);
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        const s = S.sessions[parseInt(el.dataset.i)];
        loadSession(s);
      }
    });
  });

  wrap.querySelectorAll('.btn-del-session').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.del);
      S.sessions.splice(i, 1);
      persistSessions();
      renderSessions();
      toast('Session deleted');
    });
  });
}

function loadSession(s) {
  S._activeSession = s.id;
  S.location = { name: s.location, lat: s.lat, lng: s.lng };
  S.date = s.date;
  inputLoc.value = s.location;
  inputDate.value = s.date;
  fetchAndRender();
}

document.getElementById('btn-save-session').addEventListener('click', () => {
  if (!S.location || !S.sunData) { toast('Load a location first', 'warn'); return; }
  const name = prompt('Session name:', `Shoot — ${S.location.name}`) || `Shoot — ${S.location.name}`;
  if (!name.trim()) return;

  const gh = goldenHours(S.sunData);

  const session = {
    id: Date.now(),
    name: name.trim(),
    location: S.location.name,
    lat: S.location.lat,
    lng: S.location.lng,
    date: S.date,
    sunrise: formatTime(S.sunData.sunrise),
    sunset:  formatTime(S.sunData.sunset),
    data: S.sunData,
  };

  S.sessions.unshift(session);
  if (S.sessions.length > 20) S.sessions = S.sessions.slice(0, 20);
  persistSessions();
  renderSessions();
  S._activeSession = session.id;
  toast(`Session "${name.trim()}" saved!`, 'success');
});

// ── ICS Export ────────────────────────────────────────────────────────────────
document.getElementById('btn-export-ics').addEventListener('click', () => {
  if (!S.sunData || !S.location) { toast('Load a location first', 'warn'); return; }
  downloadICS(S.location.name, S.date, S.sunData);
});

function icsDate(isoStr) {
  const d = new Date(isoStr);
  const p = n => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}${p(d.getUTCMonth()+1)}${p(d.getUTCDate())}T${p(d.getUTCHours())}${p(d.getUTCMinutes())}00Z`;
}

function makeEvent(uid, summary, dtstart, dtend, description) {
  return [
    'BEGIN:VEVENT',
    `UID:${uid}@goldenhour`,
    `SUMMARY:${summary}`,
    `DTSTART:${dtstart}`,
    `DTEND:${dtend}`,
    `DESCRIPTION:${description.replace(/\n/g,'\\n')}`,
    'STATUS:CONFIRMED',
    'END:VEVENT',
  ].join('\r\n');
}

function downloadICS(locationName, date, data) {
  const gh = goldenHours(data);
  const events = [];
  const stamp = Date.now();

  // Golden hour PM (30 min before sunset to 15 min after)
  if (data.sunset && data.sunset !== 'always_up') {
    const ghStart = addMins(data.sunset, -30);
    const ghEnd   = addMins(data.sunset,  15);
    if (ghStart && ghEnd) {
      events.push(makeEvent(
        `gh-pm-${stamp}`,
        `🌅 Golden Hour — ${locationName}`,
        icsDate(ghStart),
        icsDate(ghEnd),
        `Evening golden hour at ${locationName}.\\nSunset: ${formatTime(data.sunset)}`
      ));
    }
  }

  // Golden hour AM
  if (gh.am_start && gh.am_end) {
    events.push(makeEvent(
      `gh-am-${stamp}`,
      `🌄 Morning Golden Hour — ${locationName}`,
      icsDate(gh.am_start),
      icsDate(gh.am_end),
      `Morning golden hour at ${locationName}.\\nSunrise: ${formatTime(data.sunrise)}`
    ));
  }

  // Sunrise
  if (data.sunrise && data.sunrise !== 'always_down') {
    events.push(makeEvent(
      `sr-${stamp}`,
      `🌅 Sunrise — ${locationName}`,
      icsDate(data.sunrise),
      icsDate(addMins(data.sunrise, 15)),
      `Sunrise at ${locationName}`
    ));
  }

  // Sunset
  if (data.sunset && data.sunset !== 'always_up') {
    events.push(makeEvent(
      `ss-${stamp}`,
      `🌇 Sunset — ${locationName}`,
      icsDate(data.sunset),
      icsDate(addMins(data.sunset, 15)),
      `Sunset at ${locationName}`
    ));
  }

  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Goldenhour//Sunrise Scheduler//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    ...events,
    'END:VCALENDAR',
  ].join('\r\n');

  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `goldenhour-${locationName.replace(/\W+/g,'-')}-${date}.ics`;
  a.click();
  URL.revokeObjectURL(url);
  toast('ICS file downloaded!', 'success');
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3400);
}

// ── Escape helper ─────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderSessions();
</script>
