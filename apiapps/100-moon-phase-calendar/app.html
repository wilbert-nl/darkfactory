<style>
/* Hallmark · macrostructure: Workbench · theme: Midnight · nav: N9 */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow-x: clip; }
body {
  height: 100%;
  overflow: hidden;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ── N9 Fixed Nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 52px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  flex-shrink: 0;
}
.nav-logo span { color: var(--color-accent); }
.nav-sep { width: 1px; height: 16px; background: var(--color-border); flex-shrink: 0; }
.nav-page-label {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
  white-space: nowrap;
}
.nav-back {
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
  transition: color 0.15s ease;
}
.nav-back:hover { color: var(--color-ink); }

/* ── App shell ── */
.app-shell {
  display: grid;
  grid-template-columns: 300px 1fr;
  margin-top: 52px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--color-border);
  background: var(--color-paper-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

/* ── Moon SVG illustration ── */
.moon-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-2) var(--space-2);
}

.moon-svg-wrap {
  position: relative;
  width: 120px;
  height: 120px;
}

.moon-svg-wrap svg {
  width: 120px;
  height: 120px;
}

.moon-date-label {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  font-weight: 500;
  text-align: center;
  letter-spacing: 0.01em;
}

/* ── Phase name ── */
.phase-name-display {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  text-align: center;
  line-height: 1.1;
}

/* ── Stats row ── */
.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-2);
}

.stat-chip {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stat-chip-label {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.stat-chip-value {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 500;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  line-height: 1;
}

/* ── Biodynamic badge ── */
.bio-badge {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  font-weight: 600;
  border: 1px solid;
  width: 100%;
  justify-content: center;
}
.bio-badge.fruit  { background: oklch(93% 0.04 55); border-color: oklch(75% 0.12 55); color: oklch(38% 0.14 55); }
.bio-badge.root   { background: oklch(91% 0.03 60); border-color: oklch(68% 0.09 60); color: oklch(32% 0.10 60); }
.bio-badge.flower { background: oklch(94% 0.03 350); border-color: oklch(75% 0.09 350); color: oklch(40% 0.14 350); }
.bio-badge.leaf   { background: oklch(93% 0.04 145); border-color: oklch(72% 0.12 145); color: oklch(35% 0.12 145); }

.zodiac-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  justify-content: center;
}
.zodiac-row strong { color: var(--color-ink); }

/* ── Section divider ── */
.section-divider {
  border: none;
  border-top: 1px solid var(--color-border);
}

/* ── Crop activity guide ── */
.crop-guide-section { display: flex; flex-direction: column; gap: var(--space-2); }

.crop-guide-heading {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
}

.crop-group {
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-paper);
  overflow: hidden;
}

.crop-group-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-3) var(--space-3);
  background: transparent;
  border: none;
  cursor: pointer;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-ink);
  text-align: left;
  transition: background 0.12s ease;
}
.crop-group-toggle:hover { background: oklch(95% 0.01 95); }

.crop-group-label { display: flex; align-items: center; gap: var(--space-2); }

.crop-group-chevron {
  font-size: 10px;
  color: var(--color-ink-muted);
  transition: transform 0.2s ease;
  line-height: 1;
}
.crop-group.open .crop-group-chevron { transform: rotate(180deg); }

.crop-chips {
  display: none;
  flex-wrap: wrap;
  gap: var(--space-2);
  padding: 0 var(--space-3) var(--space-3);
  border-top: 1px solid var(--color-border);
  padding-top: var(--space-2);
}
.crop-group.open .crop-chips { display: flex; }

.crop-chip {
  display: inline-flex;
  align-items: center;
  padding: 2px var(--space-2);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: 99px;
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  font-weight: 500;
}

/* ── Main panel ── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-paper);
}

/* ── Calendar header ── */
.cal-header {
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  gap: var(--space-4);
  flex-shrink: 0;
}

.cal-month-label {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  flex: 1;
}

.btn-nav {
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--color-ink-muted);
  font-size: var(--text-base);
  line-height: 1;
  transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}
.btn-nav:hover { background: var(--color-paper-2); color: var(--color-ink); border-color: oklch(75% 0.02 95); }

/* ── Calendar grid ── */
.cal-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-4) var(--space-6) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.cal-weekday {
  text-align: center;
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-ink-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: var(--space-1) 0;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.cal-cell {
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-2) var(--space-3);
  background: var(--color-paper);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-height: 80px;
  transition: border-color 0.12s ease, background 0.12s ease;
  user-select: none;
}
.cal-cell:hover { background: var(--color-paper-2); border-color: oklch(78% 0.025 95); }
.cal-cell.today {
  border-color: var(--color-accent);
  background: var(--color-accent-subtle);
}
.cal-cell.selected {
  border-color: var(--color-accent);
  background: var(--color-accent-subtle);
  box-shadow: 0 0 0 2px oklch(52% 0.14 155 / 0.18);
}
.cal-cell.other-month {
  opacity: 0.38;
  pointer-events: none;
}

.cell-day-num {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-ink-muted);
  align-self: flex-start;
  line-height: 1;
}
.cal-cell.today .cell-day-num { color: var(--color-accent); font-weight: 700; }
.cal-cell.selected:not(.today) .cell-day-num { color: var(--color-accent); }

/* ── Tiny moon icon (CSS-drawn) ── */
.moon-icon-sm {
  width: 24px;
  height: 24px;
  position: relative;
  flex-shrink: 0;
}

/* ── Bio day type dot badge ── */
.bio-dot-sm {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-top: auto;
}
.bio-dot-sm.fruit  { background: oklch(65% 0.16 55); }
.bio-dot-sm.root   { background: oklch(56% 0.12 60); }
.bio-dot-sm.flower { background: oklch(60% 0.14 350); }
.bio-dot-sm.leaf   { background: oklch(55% 0.14 145); }

/* ── Legend ── */
.cal-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  padding-top: var(--space-2);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.legend-dot.fruit  { background: oklch(65% 0.16 55); }
.legend-dot.root   { background: oklch(56% 0.12 60); }
.legend-dot.flower { background: oklch(60% 0.14 350); }
.legend-dot.leaf   { background: oklch(55% 0.14 145); }

/* ── Scrollbar styling ── */
.sidebar-scroll::-webkit-scrollbar,
.cal-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-thumb,
.cal-scroll::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

/* ── Mobile responsive ── */
@media (max-width: 768px) {
  html, body { overflow: auto; height: auto; }
  .app-shell {
    grid-template-columns: 1fr;
    height: auto;
    overflow: visible;
  }
  .sidebar {
    border-right: none;
    border-bottom: 1px solid var(--color-border);
    overflow: visible;
  }
  .sidebar-scroll { overflow: visible; }
  .main { overflow: visible; }
  .cal-scroll { overflow: visible; }
  .cal-cell { min-height: 60px; }
}

@media (max-width: 480px) {
  .cal-weekday { font-size: 9px; letter-spacing: 0; }
  .cell-day-num { font-size: 10px; }
  .cal-legend { gap: var(--space-3); }
}

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  .crop-group-chevron { transition: none; }
}
</style>

<script>
// ── Moon Phase Engine ─────────────────────────────────────────────────────────

function getMoonPhase(date) {
  const JD = date / 86400000 + 2440587.5;
  const daysSinceNew = JD - 2451549.5;
  const newMoons = daysSinceNew / 29.53058867;
  const phase = newMoons - Math.floor(newMoons);
  return phase; // 0=new, 0.25=first quarter, 0.5=full, 0.75=last quarter
}

function getIllumination(phase) {
  return Math.round((1 - Math.cos(phase * 2 * Math.PI)) / 2 * 100);
}

function getPhaseName(phase) {
  if (phase < 0.025 || phase >= 0.975) return 'New Moon';
  if (phase < 0.25)  return 'Waxing Crescent';
  if (phase < 0.275) return 'First Quarter';
  if (phase < 0.5)   return 'Waxing Gibbous';
  if (phase < 0.525) return 'Full Moon';
  if (phase < 0.75)  return 'Waning Gibbous';
  if (phase < 0.775) return 'Last Quarter';
  return 'Waning Crescent';
}

function getMoonAgeInDays(date) {
  const phase = getMoonPhase(date.getTime());
  return +(phase * 29.53058867).toFixed(1);
}

function getMoonZodiac(date) {
  const JD = date.getTime() / 86400000 + 2440587.5;
  let L = 218.316 + 13.176396 * (JD - 2451545.0);
  L = ((L % 360) + 360) % 360;
  const signs = ['Aries','Taurus','Gemini','Cancer','Leo','Virgo',
                 'Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
  return signs[Math.floor(L / 30)];
}

const elementMap = {
  Aries:'Fruit', Leo:'Fruit', Sagittarius:'Fruit',
  Taurus:'Root', Virgo:'Root', Capricorn:'Root',
  Gemini:'Flower', Libra:'Flower', Aquarius:'Flower',
  Cancer:'Leaf', Scorpio:'Leaf', Pisces:'Leaf'
};

function getBiodynamicType(date) {
  return elementMap[getMoonZodiac(date)] || 'Fruit';
}

// ── Crop Guide ────────────────────────────────────────────────────────────────

const cropGuide = {
  Fruit: {
    sow:     ['Tomato','Pepper','Cucumber','Zucchini','Pumpkin','Aubergine','Sweet corn','Peas','Beans','Melon'],
    harvest: ['All fruiting crops'],
    prune:   ['Fruit trees','Tomato','Cucumber'],
  },
  Root: {
    sow:     ['Carrot','Beet','Radish','Parsnip','Potato','Turnip','Celeriac','Kohlrabi','Onion','Garlic'],
    harvest: ['Root vegetables','Potatoes'],
    prune:   ['Root division'],
  },
  Flower: {
    sow:     ['Broccoli','Cauliflower','Artichoke','Rose','Lavender','Chamomile','Calendula','Fennel','Dill'],
    harvest: ['Cut flowers','Herbs for drying'],
    prune:   ['Ornamental shrubs','Flowering trees'],
  },
  Leaf: {
    sow:     ['Lettuce','Spinach','Kale','Chard','Cabbage','Leek','Celery','Parsley','Basil','Mint'],
    harvest: ['Leafy greens','Fresh herbs'],
    prune:   ['Leafy plants','Lawn'],
  },
};

const bioDayIcons = { Fruit: '🍅', Root: '🥕', Flower: '🌸', Leaf: '🌿' };
const bioDayClass = { Fruit: 'fruit', Root: 'root', Flower: 'flower', Leaf: 'leaf' };

// ── SVG Moon Illustration ─────────────────────────────────────────────────────
// Draws a moon disc that visually shows illuminated portion using SVG clip paths.
// phase: 0..1 (0=new, 0.5=full)
function buildMoonSvg(phase) {
  const size = 120;
  const cx = size / 2;
  const cy = size / 2;
  const r  = 50;

  // Determine waxing (0..0.5) vs waning (0.5..1)
  const isWaxing = phase <= 0.5;

  // illumination fraction 0..1
  // At phase=0 → new (dark), phase=0.5 → full (100% lit)
  // At phase=0.25 → half lit from right (waxing)
  // At phase=0.75 → half lit from left (waning)

  // The terminator (boundary between light/dark) is an ellipse.
  // rx varies from r (full crescent silhouette) to 0 (fully lit/dark)
  // For waxing: illuminated right half. terminator moves from left to right.
  // For waning: illuminated left half. terminator moves from right to left.

  let illumFrac;
  if (phase <= 0.5) {
    illumFrac = phase * 2; // 0 at new, 1 at full
  } else {
    illumFrac = (1 - phase) * 2; // 1 at full, 0 at new
  }

  // terminatorRx: at 0% lit → rx=r (terminator is a full half-circle closing the disc)
  //               at 50% lit → rx=0 (terminator is a straight line through center)
  //               at 100% lit → rx=r on the other side
  // We encode the terminator ellipse rx as: r * |2*illumFrac - 1|
  // and flip direction depending on waxing/waning
  const terminatorRx = r * Math.abs(2 * illumFrac - 1);
  const terminatorFlip = illumFrac < 0.5; // true when less than half lit

  // Build SVG clip path for illuminated region:
  // Always a full left or right half-disc, plus/minus the terminator ellipse
  const id = 'mc' + Math.random().toString(36).slice(2);

  // Shadow side: the dark half of the moon
  // Light side: lit half

  // Strategy: Draw full grey disc first.
  // Then overlay the lit region using a clip path.
  // Lit region:
  //   Waxing (phase 0→0.5): light is on RIGHT side.
  //     - When illumFrac < 0.5 (crescent): right half-disc MINUS an ellipse on the right
  //     - When illumFrac >= 0.5 (gibbous): right half-disc PLUS an ellipse on the left
  //   Waning (phase 0.5→1): light is on LEFT side (mirror of above)

  // We'll use two overlapping paths combined with a clipPath.
  // Simpler approach: use a single SVG path for the lit region.

  // The lit area boundary:
  //   Always starts at top (cx, cy-r), goes around the correct half, ends at bottom (cx, cy+r).
  //   The inner edge is either a concave or convex ellipse arc.

  // For waxing crescent (0 < phase < 0.25):
  //   Outer: right half-circle (right side)
  //   Inner: convex ellipse (bulges LEFT) with rx=terminatorRx
  //   → SVG: M cx cy-r, A r r 0 0 1 cx cy+r  (right half), A terminatorRx r 0 0 0 cx cy-r (terminator, sweep=0=ccw)

  // For waxing gibbous (0.25 < phase < 0.5):
  //   Outer: right half-circle
  //   Inner: concave ellipse (bulges RIGHT) - terminator is behind
  //   → SVG: M cx cy-r, A r r 0 0 1 cx cy+r (right half), A terminatorRx r 0 0 1 cx cy-r (sweep=1=cw)

  // For waning gibbous (0.5 < phase < 0.75): mirror on left
  // For waning crescent (0.75 < phase < 1):  mirror on left

  let litPath;
  const T = terminatorRx;

  if (phase < 0.025 || phase >= 0.975) {
    // New moon — no lit area
    litPath = '';
  } else if (phase >= 0.475 && phase < 0.525) {
    // Full moon — entire disc lit
    litPath = `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx} ${cy + r} A ${r} ${r} 0 1 1 ${cx} ${cy - r} Z`;
  } else if (isWaxing) {
    // Waxing: lit on RIGHT
    if (illumFrac < 0.5) {
      // Crescent: right half minus concave left terminator
      litPath = `M ${cx} ${cy - r} A ${r} ${r} 0 0 1 ${cx} ${cy + r} A ${T} ${r} 0 0 0 ${cx} ${cy - r} Z`;
    } else {
      // Gibbous: right half plus convex right terminator
      litPath = `M ${cx} ${cy - r} A ${r} ${r} 0 0 1 ${cx} ${cy + r} A ${T} ${r} 0 0 1 ${cx} ${cy - r} Z`;
    }
  } else {
    // Waning: lit on LEFT
    if (illumFrac < 0.5) {
      // Crescent: left half minus concave right terminator
      litPath = `M ${cx} ${cy - r} A ${r} ${r} 0 0 0 ${cx} ${cy + r} A ${T} ${r} 0 0 1 ${cx} ${cy - r} Z`;
    } else {
      // Gibbous: left half plus convex left terminator
      litPath = `M ${cx} ${cy - r} A ${r} ${r} 0 0 0 ${cx} ${cy + r} A ${T} ${r} 0 0 0 ${cx} ${cy - r} Z`;
    }
  }

  const svgStr = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Moon phase visualization">
    <defs>
      <filter id="glow-${id}" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <!-- Dark disc (shadow side) -->
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="oklch(28% 0.03 240)" stroke="oklch(40% 0.04 240)" stroke-width="1"/>
    <!-- Lit portion -->
    ${litPath ? `<path d="${litPath}" fill="oklch(92% 0.04 80)" filter="url(#glow-${id})"/>` : ''}
  </svg>`;

  return svgStr;
}

// Tiny moon icon for calendar cells (CSS border-radius trick)
function buildTinyMoonSvg(phase) {
  const size = 20;
  const cx = size / 2;
  const cy = size / 2;
  const r  = 8;

  const isWaxing = phase <= 0.5;
  let illumFrac = phase <= 0.5 ? phase * 2 : (1 - phase) * 2;
  const T = r * Math.abs(2 * illumFrac - 1);

  let litPath;
  if (phase < 0.025 || phase >= 0.975) {
    litPath = '';
  } else if (phase >= 0.475 && phase < 0.525) {
    litPath = `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx} ${cy + r} A ${r} ${r} 0 1 1 ${cx} ${cy - r} Z`;
  } else if (isWaxing) {
    if (illumFrac < 0.5) {
      litPath = `M ${cx} ${cy - r} A ${r} ${r} 0 0 1 ${cx} ${cy + r} A ${T} ${r} 0 0 0 ${cx} ${cy - r} Z`;
    } else {
      litPath = `M ${cx} ${cy - r} A ${r} ${r} 0 0 1 ${cx} ${cy + r} A ${T} ${r} 0 0 1 ${cx} ${cy - r} Z`;
    }
  } else {
    if (illumFrac < 0.5) {
      litPath = `M ${cx} ${cy - r} A ${r} ${r} 0 0 0 ${cx} ${cy + r} A ${T} ${r} 0 0 1 ${cx} ${cy - r} Z`;
    } else {
      litPath = `M ${cx} ${cy - r} A ${r} ${r} 0 0 0 ${cx} ${cy + r} A ${T} ${r} 0 0 0 ${cx} ${cy - r} Z`;
    }
  }

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="oklch(28% 0.03 240)" stroke="oklch(45% 0.04 240)" stroke-width="0.5"/>
    ${litPath ? `<path d="${litPath}" fill="oklch(90% 0.04 80)"/>` : ''}
  </svg>`;
}

// ── Sidebar rendering ─────────────────────────────────────────────────────────

function renderSidebar(date) {
  const phase     = getMoonPhase(date.getTime());
  const illum     = getIllumination(phase);
  const phaseName = getPhaseName(phase);
  const age       = getMoonAgeInDays(date);
  const zodiac    = getMoonZodiac(date);
  const bioType   = getBiodynamicType(date);
  const guide     = cropGuide[bioType];

  // Date label
  const isToday = date.toDateString() === TODAY.toDateString();
  const dateStr = date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('sidebarDateLabel').textContent = isToday ? 'Today — ' + dateStr : dateStr;

  // Moon SVG
  document.getElementById('moonSvgWrap').innerHTML = buildMoonSvg(phase);

  // Phase name
  document.getElementById('sidebarPhaseName').textContent = phaseName;

  // Stats
  document.getElementById('sidebarIllum').textContent = illum + '%';
  document.getElementById('sidebarAge').textContent = age + 'd';

  // Bio badge
  const badgeEl = document.getElementById('sidebarBioBadge');
  badgeEl.textContent = '';
  badgeEl.className = 'bio-badge ' + bioDayClass[bioType];
  badgeEl.innerHTML = `<span aria-hidden="true">${bioDayIcons[bioType]}</span> ${bioType} Day`;

  // Zodiac
  document.getElementById('sidebarZodiac').textContent = zodiac;

  // Crop chips
  function fillChips(elId, crops) {
    const el = document.getElementById(elId);
    el.innerHTML = crops.map(c =>
      `<span class="crop-chip" role="listitem">${c}</span>`
    ).join('');
  }
  fillChips('sowChips',     guide.sow);
  fillChips('harvestChips', guide.harvest);
  fillChips('pruneChips',   guide.prune);
}

// ── Calendar rendering ────────────────────────────────────────────────────────

const MONTH_NAMES = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];

const TODAY = new Date();
let calYear  = TODAY.getFullYear();
let calMonth = TODAY.getMonth();
let selectedDate = new Date(TODAY);

function renderCalendar() {
  document.getElementById('calMonthLabel').textContent =
    MONTH_NAMES[calMonth] + ' ' + calYear;

  const firstDay    = new Date(calYear, calMonth, 1);
  const lastDay     = new Date(calYear, calMonth + 1, 0);
  const startDow    = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const prevLast    = new Date(calYear, calMonth, 0).getDate();

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  // Leading days from previous month
  for (let i = startDow - 1; i >= 0; i--) {
    const d = new Date(calYear, calMonth - 1, prevLast - i);
    grid.appendChild(buildCell(d, true));
  }

  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(calYear, calMonth, d);
    grid.appendChild(buildCell(dt, false));
  }

  // Trailing days
  const total    = startDow + daysInMonth;
  const trailing = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i = 1; i <= trailing; i++) {
    const dt = new Date(calYear, calMonth + 1, i);
    grid.appendChild(buildCell(dt, true));
  }
}

function buildCell(dt, otherMonth) {
  const phase   = getMoonPhase(dt.getTime());
  const bioType = getBiodynamicType(dt);
  const bClass  = bioDayClass[bioType];

  const isToday    = dt.toDateString() === TODAY.toDateString();
  const isSelected = dt.toDateString() === selectedDate.toDateString();

  const cell = document.createElement('div');
  cell.className = [
    'cal-cell',
    otherMonth   ? 'other-month' : '',
    isToday      ? 'today' : '',
    isSelected   ? 'selected' : '',
  ].filter(Boolean).join(' ');

  cell.setAttribute('role', 'gridcell');
  cell.setAttribute('tabindex', otherMonth ? '-1' : '0');
  cell.setAttribute('aria-label', `${dt.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}, ${getPhaseName(phase)}, ${bioType} day`);
  if (isToday) cell.setAttribute('aria-current', 'date');

  cell.innerHTML = `
    <span class="cell-day-num">${dt.getDate()}</span>
    <span class="moon-icon-sm" aria-hidden="true">${buildTinyMoonSvg(phase)}</span>
    <span class="bio-dot-sm ${bClass}" aria-hidden="true"></span>
  `;

  if (!otherMonth) {
    cell.addEventListener('click', () => {
      selectedDate = new Date(dt);
      renderCalendar();        // re-render to update selected highlight
      renderSidebar(selectedDate);
    });
    cell.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectedDate = new Date(dt);
        renderCalendar();
        renderSidebar(selectedDate);
      }
    });
  }

  return cell;
}

// ── Collapsible crop groups ────────────────────────────────────────────────────

document.querySelectorAll('.crop-group-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const group = btn.closest('.crop-group');
    const isOpen = group.classList.toggle('open');
    btn.setAttribute('aria-expanded', isOpen);
  });
});

// ── Month navigation ──────────────────────────────────────────────────────────

document.getElementById('btnPrevMonth').addEventListener('click', () => {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
});

document.getElementById('btnNextMonth').addEventListener('click', () => {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
});

// ── Init ──────────────────────────────────────────────────────────────────────
renderSidebar(TODAY);
renderCalendar();
</script>
