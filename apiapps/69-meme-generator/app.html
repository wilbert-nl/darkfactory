<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemeForge — Meme Generator for Marketing Teams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Workbench · theme: Carnival · nav: N9 */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { height: 100%; overflow-x: clip; }

body {
  height: 100%;
  overflow: hidden;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

/* ── N9 Edge-aligned nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 52px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}

.nav-logo {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  flex-shrink: 0;
}
.nav-logo span { color: var(--color-accent); }

.nav-sep {
  width: 1px;
  height: 16px;
  background: var(--color-border);
  flex-shrink: 0;
}

.nav-page-label {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
  white-space: nowrap;
}

.nav-back {
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
  transition: color 0.15s var(--ease-out);
}
.nav-back:hover { color: var(--color-ink); }

/* ── App shell ── */
.app-shell {
  display: grid;
  grid-template-columns: 280px 1fr;
  margin-top: 52px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--color-border);
  background: var(--color-paper-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-section {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}

.sidebar-section:last-child { border-bottom: none; }

.section-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--color-ink-muted);
  display: block;
  margin-bottom: var(--space-3);
}

/* Search */
.search-wrap {
  position: relative;
}

.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-ink-muted);
  pointer-events: none;
  flex-shrink: 0;
}

.input-search {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3) var(--space-2) 32px;
  transition: border-color 0.15s var(--ease-out);
}
.input-search:focus { outline: none; border-color: var(--color-accent); }
.input-search::placeholder { color: var(--color-ink-muted); }

/* Category chips */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.chip {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-ink-muted);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: 999px;
  padding: var(--space-1) var(--space-3);
  cursor: pointer;
  transition: all 0.12s var(--ease-out);
  white-space: nowrap;
}
.chip:hover { border-color: var(--color-accent-line); color: var(--color-accent); background: var(--color-accent-subtle); }
.chip.active {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-paper);
}

/* Template grid in sidebar */
.template-grid-wrap {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-3);
  scrollbar-width: thin;
  scrollbar-color: var(--color-border) transparent;
}

.template-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-2);
}

.template-card {
  border: 2px solid transparent;
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: pointer;
  aspect-ratio: 1;
  position: relative;
  background: var(--color-paper);
  transition: border-color 0.12s var(--ease-out), transform 0.12s var(--ease-out);
}
.template-card:hover {
  border-color: var(--color-accent-line);
  transform: scale(1.03);
}
.template-card.selected {
  border-color: var(--color-accent);
  box-shadow: 0 0 0 1px var(--color-accent);
}
.template-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.template-card-name {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(to top, oklch(18% 0.04 155 / 0.85), transparent);
  color: oklch(92% 0.045 50);
  font-size: 0.55rem;
  font-weight: 500;
  padding: var(--space-4) var(--space-1) var(--space-1);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.template-card.skeleton {
  background: var(--color-border);
  animation: shimmer 1.4s var(--ease-out)-in-out infinite;
}
@keyframes shimmer {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.load-more {
  grid-column: 1 / -1;
  margin-top: var(--space-2);
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-accent);
  background: transparent;
  border: 1px dashed var(--color-accent-line);
  border-radius: var(--radius-md);
  padding: var(--space-2);
  cursor: pointer;
  width: 100%;
  transition: background 0.12s var(--ease-out);
}
.load-more:hover { background: var(--color-accent-subtle); }

/* Text style controls */
.field-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--color-ink-muted);
  display: block;
  margin-bottom: var(--space-2);
}

.input-sm {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  transition: border-color 0.15s var(--ease-out);
}
.input-sm:focus { outline: none; border-color: var(--color-accent); }

select.input-sm { cursor: pointer; }

.range-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.range-row input[type="range"] {
  flex: 1;
  accent-color: var(--color-accent);
  cursor: pointer;
}
.range-val {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-accent);
  font-variant-numeric: tabular-nums;
  min-width: 32px;
  text-align: right;
}

/* Color swatch buttons */
.color-swatches {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
}
.swatch {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--color-border);
  cursor: pointer;
  transition: transform 0.12s var(--ease-out), border-color 0.12s var(--ease-out);
  flex-shrink: 0;
}
.swatch:hover { transform: scale(1.1); }
.swatch.active { border-color: var(--color-accent); box-shadow: 0 0 0 1px var(--color-accent); }
.swatch.white { background: var(--color-white); }
.swatch.black { background: #111111; }
.swatch.yellow { background: #FFE033; }
.swatch.red { background: #E53E3E; }

.outline-swatches {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
}
.outline-swatch {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-ink-muted);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-2);
  cursor: pointer;
  transition: all 0.12s var(--ease-out);
  white-space: nowrap;
}
.outline-swatch:hover { border-color: var(--color-accent-line); color: var(--color-accent); }
.outline-swatch.active {
  background: var(--color-accent-subtle);
  border-color: var(--color-accent-line);
  color: var(--color-accent);
}

.position-btns {
  display: flex;
  gap: var(--space-2);
}
.pos-btn {
  flex: 1;
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-ink-muted);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-2) var(--space-1);
  cursor: pointer;
  text-align: center;
  transition: all 0.12s var(--ease-out);
}
.pos-btn:hover { border-color: var(--color-accent-line); color: var(--color-accent); }
.pos-btn.active {
  background: var(--color-accent-subtle);
  border-color: var(--color-accent-line);
  color: var(--color-accent);
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.toggle-label {
  font-size: var(--text-sm);
  color: var(--color-ink);
  font-weight: 500;
}

.toggle {
  position: relative;
  width: 36px;
  height: 20px;
  flex-shrink: 0;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute;
  inset: 0;
  background: var(--color-border);
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.15s var(--ease-out);
}
.toggle input:checked + .toggle-track { background: var(--color-accent); }
.toggle-track::after {
  content: '';
  position: absolute;
  width: 14px;
  height: 14px;
  left: 3px;
  top: 3px;
  background: white;
  border-radius: 50%;
  transition: transform 0.15s var(--ease-out);
}
.toggle input:checked + .toggle-track::after { transform: translateX(16px); }

/* Brand overlay */
.input-brand {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  transition: border-color 0.15s var(--ease-out);
}
.input-brand:focus { outline: none; border-color: var(--color-accent); }
.input-brand::placeholder { color: var(--color-ink-muted); }

/* Saved gallery strip */
.saved-strip {
  display: flex;
  gap: var(--space-2);
  overflow-x: auto;
  padding-bottom: var(--space-1);
  scrollbar-width: thin;
  scrollbar-color: var(--color-border) transparent;
}
.saved-thumb {
  width: 64px;
  height: 48px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--color-border);
  overflow: hidden;
  cursor: pointer;
  flex-shrink: 0;
  transition: border-color 0.12s var(--ease-out);
  position: relative;
}
.saved-thumb:hover { border-color: var(--color-accent); }
.saved-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.saved-empty {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  line-height: 1.5;
}

/* Sidebar scrollable body */
.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: var(--color-border) transparent;
}

/* ── Main panel ── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-paper);
}

/* Canvas area */
.canvas-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: oklch(95% 0.008 95);
  padding: var(--space-6);
  overflow: auto;
  position: relative;
  gap: var(--space-4);
}

.canvas-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-4);
  text-align: center;
  color: var(--color-ink-muted);
}
.canvas-empty-icon {
  font-size: 56px;
  opacity: 0.3;
}
.canvas-empty-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
}
.canvas-empty-sub {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  max-width: 280px;
  line-height: 1.65;
}

#meme-canvas {
  display: none;
  max-width: 100%;
  max-height: calc(100vh - 340px);
  border-radius: var(--radius-lg);
  box-shadow: 0 8px 40px oklch(18% 0.04 155 / 0.16);
  cursor: crosshair;
}

/* Text boxes */
.text-boxes {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  width: 100%;
  max-width: 500px;
}

.text-box-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.text-box-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--color-ink-muted);
  width: 56px;
  flex-shrink: 0;
}

.text-box-input {
  flex: 1;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  transition: border-color 0.15s var(--ease-out);
  min-width: 0;
}
.text-box-input:focus { outline: none; border-color: var(--color-accent); }
.text-box-input::placeholder { color: var(--color-ink-muted); }
.text-box-input:disabled {
  background: var(--color-paper-2);
  color: var(--color-ink-muted);
  cursor: not-allowed;
}

.text-box-toggle {
  width: 20px;
  height: 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-border);
  background: var(--color-paper);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--color-ink-muted);
  flex-shrink: 0;
  transition: all 0.12s var(--ease-out);
}
.text-box-toggle.active {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-paper);
}
.text-box-toggle:hover { border-color: var(--color-accent); }

/* Export panel */
.export-panel {
  padding: var(--space-4) var(--space-6);
  border-top: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-shrink: 0;
  background: var(--color-paper);
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-5);
  background: var(--color-accent);
  color: var(--color-paper);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out);
  white-space: nowrap;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px oklch(40% 0.21 25 / 0.28); }
.btn-primary:active { transform: translateY(0); box-shadow: none; }
.btn-primary:disabled { opacity: 0.45; pointer-events: none; }

.btn-outline {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  background: transparent;
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: border-color 0.12s var(--ease-out), color 0.12s var(--ease-out);
  white-space: nowrap;
}
.btn-outline:hover { border-color: var(--color-accent-line); color: var(--color-accent); }
.btn-outline:disabled { opacity: 0.45; pointer-events: none; }

.export-status {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  margin-left: auto;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 600;
  background: var(--color-ink);
  color: var(--color-paper);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px oklch(18% 0.080 20 / 0.20);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s var(--ease-out), transform 0.2s var(--ease-out);
  pointer-events: none;
  max-width: 320px;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--color-success); }
.toast.error { background: var(--color-danger); }

/* ── Mobile ── */
@media (max-width: 768px) {
  html, body { overflow: auto; height: auto; }

  .app-shell {
    grid-template-columns: 1fr;
    height: auto;
    overflow: visible;
  }

  .sidebar {
    border-right: none;
    border-bottom: 1px solid var(--color-border);
    max-height: 50vh;
    overflow: hidden;
  }

  .sidebar-scroll { overflow: auto; }

  .main { overflow: visible; }
  .canvas-area { min-height: 60vh; overflow: visible; }

  #meme-canvas { max-height: 50vh; }

  .text-boxes { padding: 0 var(--space-4); }

  .export-panel { padding: var(--space-4); flex-wrap: wrap; gap: var(--space-2); }

  .template-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  .btn-primary:hover { transform: none; box-shadow: none; }
  .toast { transition: opacity 0.15s var(--ease-out); transform: translateY(0); }
  .template-card:hover { transform: none; }
  .swatch:hover { transform: none; }
}
</style>
</head>
<body>

<!-- N9 Edge-aligned nav -->
<nav class="nav" aria-label="Application navigation">
  <span class="nav-logo">Meme<span>Forge</span></span>
  <span class="nav-sep" aria-hidden="true"></span>
  <span class="nav-page-label">Meme Generator</span>
  <a href="index.html" class="nav-back" aria-label="Back to home page">← Home</a>
</nav>

<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar" aria-label="Controls and template browser">

    <!-- Search -->
    <div class="sidebar-section">
      <span class="section-label">Search Templates</span>
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input
          type="text"
          id="template-search"
          class="input-search"
          placeholder="Search memes…"
          aria-label="Search meme templates"
          autocomplete="off"
        >
      </div>
    </div>

    <!-- Categories -->
    <div class="sidebar-section">
      <span class="section-label">Category</span>
      <div class="chips" role="group" aria-label="Template categories">
        <button class="chip active" data-cat="all" aria-pressed="true">All</button>
        <button class="chip" data-cat="reaction" aria-pressed="false">Reaction</button>
        <button class="chip" data-cat="animal" aria-pressed="false">Animal</button>
        <button class="chip" data-cat="pop" aria-pressed="false">Pop Culture</button>
        <button class="chip" data-cat="classic" aria-pressed="false">Classic</button>
        <button class="chip" data-cat="trending" aria-pressed="false">Trending</button>
        <button class="chip" data-cat="abstract" aria-pressed="false">Abstract</button>
      </div>
    </div>

    <!-- Template gallery (scrollable) -->
    <div class="template-grid-wrap" role="listbox" aria-label="Meme templates">
      <div class="template-grid" id="template-grid">
        <!-- Skeletons -->
        <div class="template-card skeleton" aria-hidden="true"></div>
        <div class="template-card skeleton" aria-hidden="true"></div>
        <div class="template-card skeleton" aria-hidden="true"></div>
        <div class="template-card skeleton" aria-hidden="true"></div>
        <div class="template-card skeleton" aria-hidden="true"></div>
        <div class="template-card skeleton" aria-hidden="true"></div>
      </div>
    </div>

    <!-- Style controls (scrollable body below gallery) -->
    <div class="sidebar-scroll">

      <!-- Font settings -->
      <div class="sidebar-section">
        <span class="section-label">Font</span>

              <button class="swatch black" data-color="#111111" aria-label="Black" aria-pressed="false" title="Black"></button>

          </div>

            <label class="field-label">Outline</label>

          </div>
          <div>
            <label class="field-label">Outline Thickness</label>
            <div class="range-row">
              <input type="range" id="outline-width" min="0" max="8" value="3" aria-label="Outline thickness" aria-valuemin="0" aria-valuemax="8">
              <span class="range-val" id="outline-width-val">3px</span>
            </div>
          </div>
          <div>
            <label class="field-label">Text Position</label>
            <div class="position-btns" role="group" aria-label="Text position mode">
              <button class="pos-btn active" data-pos="topbottom" aria-pressed="true">Top/Bottom</button>
              <button class="pos-btn" data-pos="custom" aria-pressed="false">Custom %</button>
            </div>
          </div>
          <div id="custom-pos-controls" style="display:none;flex-direction:column;gap:var(--space-2)">
            <div>
              <label class="field-label">Top Y%</label>
              <div class="range-row">
                <input type="range" id="top-y" min="0" max="50" value="8" aria-label="Top text Y position">
                <span class="range-val" id="top-y-val">8%</span>

            </div>
            <div>
              <label class="field-label">Bottom Y%</label>
              <div class="range-row">
                <input type="range" id="bottom-y" min="50" max="100" value="92" aria-label="Bottom text Y position">
                <span class="range-val" id="bottom-y-val">92%</span>
              </div>
            </div>
          </div>
          <div class="toggle-row">
            <span class="toggle-label">All Caps</span>
            <label class="toggle" aria-label="All caps">
              <input type="checkbox" id="all-caps" checked>

      <!-- Brand overlay -->
      <div class="sidebar-section">
        <span class="section-label">Brand Overlay</span>
        <input
          type="text"
          id="brand-text"
          class="input-brand"
          placeholder="e.g. @YourBrand"
          aria-label="Brand overlay text"
          maxlength="40"
        >
        <p style="font-size:var(--text-xs);color:var(--color-ink-muted);margin-top:var(--space-2);line-height:1.5">
          Appears bottom-right on every meme. Saved automatically.
        </p>

      <!-- Saved memes gallery -->

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3)">

      <!-- Text boxes (shown after template selected) -->

          <input type="text" class="text-box-input" id="text-caption" placeholder="Caption text…" aria-label="Caption text" autocomplete="off" disabled>
          <button class="text-box-toggle" data-box="caption" aria-label="Toggle caption text" aria-pressed="false" title="Enable/disable">+</button>

          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
        Download PNG
      </button>

        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
        </svg>
        Copy
      </button>
      <button class="btn-outline" id="btn-save" disabled aria-label="Add to saved memes">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
        </svg>
        Save
      </button>

  </main>

<!-- Toast -->
<div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

<script>
'use strict';

/* ─── Constants ────────────────────────────────────────────── */
const IMGFLIP_API = 'https://api.imgflip.com/get_memes';
const LS_SAVED    = 'memeforge_saved';
const LS_BRAND    = 'memeforge_brand';
const PAGE_SIZE   = 30;
const MAX_SAVED   = 8;

/* ─── Category keyword map (manual classification) ─────────── */
const CAT_KEYWORDS = {
  reaction: ['one does not simply','drake','distracted','woman yelling','always has been','change my mind','is this','see nobody','surprised pikachu','blinking guy','hide the pain','gru','increasingly verbose','pointing','guy','man','woman','person'],
  animal:   ['dog','cat','bear','wolf','bird','lion','monkey','frog','sloth','doge','grumpy cat','lil boo','puppy','kitten','animal'],
  pop:      ['batman','spiderman','iron man','star wars','picard','gandalf','yoda','lord of the rings','game of thrones','avengers','disney','movie','show','rick','morty','ron burgundy','boromir','ned','stark','michael scott','kevin','dwight'],
  classic:  ['bad luck brian','success kid','forever alone','first world problems','overly attached','condescending wonka','socially awkward penguin','courage','philosoraptor','ancient aliens','conspiracy keanu','the most interesting man'],
  trending: ['bernie','disaster girl','woman math','two buttons','this is fine','left exit','they','me explaining','panik','ight imma head out','nobody absoluetly nobody','gif','trending'],
  abstract: ['expanding brain','galaxy brain','matrix','stonks','it is what it is','trade offer','my disappointment','spongebob','mocking','imagination','roll safe','smiling crying','the floor is'],
};

/* ─── State ─────────────────────────────────────────────────── */
const state = {
  templates: [],
  filtered: [],
  selectedTemplate: null,
  image: null,
  displayCount: PAGE_SIZE,
  activeCategory: 'all',
  textColor: '#ffffff',
  outlineColor: 'black',
  outlineWidth: 3,
  positionMode: 'topbottom',
  allCaps: true,
  enabledBoxes: { top: true, bottom: true, middle: false, caption: false },
};

/* ─── DOM refs ───────────────────────────────────────────────── */
const canvas      = document.getElementById('meme-canvas');
const ctx         = canvas.getContext('2d');
const emptyState  = document.getElementById('canvas-empty');
const textBoxes   = document.getElementById('text-boxes');
const tGrid       = document.getElementById('template-grid');
const searchInput = document.getElementById('template-search');

const textInputs = {
  top:     document.getElementById('text-top'),
  bottom:  document.getElementById('text-bottom'),
  middle:  document.getElementById('text-middle'),
  caption: document.getElementById('text-caption'),
};

const fontFamilySel    = document.getElementById('font-family');
const fontSizeRange    = document.getElementById('font-size');
const fontSizeVal      = document.getElementById('font-size-val');
const outlineWidthRange= document.getElementById('outline-width');
const outlineWidthVal  = document.getElementById('outline-width-val');
const topYRange        = document.getElementById('top-y');
const topYVal          = document.getElementById('top-y-val');
const bottomYRange     = document.getElementById('bottom-y');
const bottomYVal       = document.getElementById('bottom-y-val');
const allCapsToggle    = document.getElementById('all-caps');
const brandInput       = document.getElementById('brand-text');
const savedStrip       = document.getElementById('saved-strip');
const exportStatus     = document.getElementById('export-status');

const btnDownload = document.getElementById('btn-download');
const btnCopy     = document.getElementById('btn-copy');
const btnSave     = document.getElementById('btn-save');

/* ─── Utilities ──────────────────────────────────────────────── */
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3200);
}

function setExportStatus(msg) {
  exportStatus.textContent = msg;
}

function classifyTemplate(name) {
  const lower = name.toLowerCase();
  for (const [cat, keywords] of Object.entries(CAT_KEYWORDS)) {
    if (keywords.some(k => lower.includes(k))) return cat;
  }
  return 'abstract'; // default bucket
}

/* ─── localStorage helpers ───────────────────────────────────── */
function getSaved() {
  try { return JSON.parse(localStorage.getItem(LS_SAVED) || '[]'); } catch { return []; }
}
function setSaved(arr) {
  localStorage.setItem(LS_SAVED, JSON.stringify(arr));
}

/* ─── API: fetch templates ───────────────────────────────────── */
async function fetchTemplates() {
  try {
    const res = await fetch(IMGFLIP_API);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!data.success) throw new Error('Imgflip API failure');
    state.templates = data.data.memes.map(t => ({ ...t, category: classifyTemplate(t.name) }));
    applyFilter();
  } catch (err) {
    tGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:var(--space-6);font-size:var(--text-sm);color:var(--color-ink-muted)">
      Could not load templates.<br>Check your connection.
    </div>`;
    toast('Failed to load templates', 'error');
  }
}

/* ─── Filter & render templates ──────────────────────────────── */
function applyFilter() {
  const q = searchInput.value.trim().toLowerCase();
  const cat = state.activeCategory;

  state.filtered = state.templates.filter(t => {
    const matchQ = !q || t.name.toLowerCase().includes(q);
    const matchC = cat === 'all' || t.category === cat;
    return matchQ && matchC;
  });
  state.displayCount = PAGE_SIZE;
  renderTemplates();
}

function renderTemplates() {
  const visible = state.filtered.slice(0, state.displayCount);
  tGrid.innerHTML = '';

  visible.forEach(tpl => {
    const card = document.createElement('div');
    card.className = 'template-card' + (state.selectedTemplate?.id === tpl.id ? ' selected' : '');
    card.setAttribute('role', 'option');
    card.setAttribute('aria-selected', state.selectedTemplate?.id === tpl.id ? 'true' : 'false');
    card.setAttribute('aria-label', tpl.name);
    card.tabIndex = 0;
    card.dataset.id = tpl.id;

    const img = document.createElement('img');
    img.src = tpl.url;
    img.alt = tpl.name;
    img.loading = 'lazy';
    img.onerror = () => { card.style.display = 'none'; };

    const label = document.createElement('div');
    label.className = 'template-card-name';
    label.textContent = tpl.name;

    card.append(img, label);

    const select = () => loadTemplate(tpl);
    card.addEventListener('click', select);
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(); } });

    tGrid.appendChild(card);
  });

  if (state.filtered.length > state.displayCount) {
    const btn = document.createElement('button');
    btn.className = 'load-more';
    btn.textContent = `Load more (${state.filtered.length - state.displayCount} remaining)`;
    btn.addEventListener('click', () => {
      state.displayCount += PAGE_SIZE;
      renderTemplates();
    });
    tGrid.appendChild(btn);
  }

  if (!visible.length && state.templates.length) {
    tGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:var(--space-6);font-size:var(--text-sm);color:var(--color-ink-muted)">No templates match your search.</div>`;
  }
}

/* ─── Load template ──────────────────────────────────────────── */
function loadTemplate(tpl) {
  state.selectedTemplate = tpl;
  renderTemplates();
  setExportStatus(`Loading "${tpl.name}"…`);

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    state.image = img;
    canvas.width = tpl.width || img.naturalWidth;
    canvas.height = tpl.height || img.naturalHeight;
    showCanvas();
    setExportStatus(`${canvas.width}×${canvas.height}`);
    drawMeme();
  };
  img.onerror = () => {
    // Retry without CORS
    const img2 = new Image();
    img2.onload = () => {
      state.image = img2;
      canvas.width = img2.naturalWidth;
      canvas.height = img2.naturalHeight;
      showCanvas();
      setExportStatus(`${canvas.width}×${canvas.height} (no CORS)`);
      drawMeme();
    };
    img2.onerror = () => { toast('Could not load image — try another.', 'error'); setExportStatus('Load error'); };
    img2.src = tpl.url;
  };
  img.src = tpl.url;
}

function showCanvas() {
  emptyState.style.display  = 'none';
  canvas.style.display = 'block';
  textBoxes.style.display  = 'flex';
  btnDownload.disabled = false;
  btnCopy.disabled     = false;
  btnSave.disabled     = false;
}

/* ─── Draw meme ──────────────────────────────────────────────── */
function drawMeme() {
  if (!state.image) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(state.image, 0, 0, canvas.width, canvas.height);

  const fontSize   = parseInt(fontSizeRange.value, 10);
  const fontFamily = fontFamilySel.value;
  const bold       = 'bold ';
  const fillColor  = state.textColor;
  const maxWidth   = canvas.width - 20;
  const lineH      = fontSize * 1.2;

  ctx.font      = `${bold}${fontSize}px ${fontFamily}`;
  ctx.textAlign = 'center';

  function wrapText(text) {
    const words = text.split(' ');
    const lines  = [];
    let cur = '';
    for (const w of words) {
      const test = cur ? `${cur} ${w}` : w;
      if (ctx.measureText(test).width > maxWidth && cur) {
        lines.push(cur);
        cur = w;
      } else {
        cur = test;
      }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function drawTextBlock(rawText, centerY) {
    const text = state.allCaps ? rawText.toUpperCase() : rawText;
    if (!text.trim()) return;
    const lines    = wrapText(text);
    const totalH   = lines.length * lineH;
    let y = centerY - totalH / 2 + lineH / 2;

    for (const line of lines) {
      // Outline
      if (state.outlineColor !== 'none') {
        ctx.save();
        ctx.strokeStyle  = state.outlineColor === 'white' ? '#ffffff' : '#000000';
        ctx.lineWidth    = state.outlineWidth;
        ctx.lineJoin     = 'round';
        ctx.strokeText(line, canvas.width / 2, y);
        ctx.restore();
      }
      // Fill
      ctx.fillStyle = fillColor;
      ctx.fillText(line, canvas.width / 2, y);
      y += lineH;
    }
  }

  const useCustom = state.positionMode === 'custom';
  const topY    = useCustom ? (parseInt(topYRange.value, 10) / 100) * canvas.height    : fontSize * 1.5;
  const bottomY = useCustom ? (parseInt(bottomYRange.value, 10) / 100) * canvas.height : canvas.height - fontSize * 1.5;
  const midY    = canvas.height / 2;
  const capY    = canvas.height - fontSize * 0.8;

  if (state.enabledBoxes.top)     drawTextBlock(textInputs.top.value,     topY);
  if (state.enabledBoxes.bottom)  drawTextBlock(textInputs.bottom.value,  bottomY);
  if (state.enabledBoxes.middle)  drawTextBlock(textInputs.middle.value,  midY);
  if (state.enabledBoxes.caption) drawTextBlock(textInputs.caption.value, capY);

  // Brand overlay
  const brand = brandInput.value.trim();
  if (brand) {
    const brandSize = Math.max(10, Math.round(canvas.width * 0.022));
    ctx.save();
    ctx.font      = `500 ${brandSize}px ${fontFamily}`;
    ctx.textAlign = 'right';
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.lineJoin  = 'round';
    const bx = canvas.width - 8;
    const by = canvas.height - 8;
    ctx.strokeText(brand, bx, by);
    ctx.fillText(brand, bx, by);
    ctx.restore();
  }
}

/* ─── Text inputs → redraw ───────────────────────────────────── */
Object.values(textInputs).forEach(inp => inp.addEventListener('input', drawMeme));

/* ─── Style controls → redraw ────────────────────────────────── */
fontFamilySel.addEventListener('change', drawMeme);

fontSizeRange.addEventListener('input', () => {
  fontSizeVal.textContent = `${fontSizeRange.value}px`;
  fontSizeRange.setAttribute('aria-valuenow', fontSizeRange.value);
  drawMeme();
});

outlineWidthRange.addEventListener('input', () => {
  state.outlineWidth = parseInt(outlineWidthRange.value, 10);
  outlineWidthVal.textContent = `${outlineWidthRange.value}px`;
  drawMeme();
});

topYRange.addEventListener('input', () => {
  topYVal.textContent = `${topYRange.value}%`;
  drawMeme();
});
bottomYRange.addEventListener('input', () => {
  bottomYVal.textContent = `${bottomYRange.value}%`;
  drawMeme();
});

allCapsToggle.addEventListener('change', () => {
  state.allCaps = allCapsToggle.checked;
  drawMeme();
});

/* ─── Text color swatches ─────────────────────────────────────── */
document.querySelectorAll('.swatch').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-pressed', 'false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed', 'true');
    state.textColor = btn.dataset.color;
    drawMeme();
  });
});

/* ─── Outline swatches ────────────────────────────────────────── */
document.querySelectorAll('.outline-swatch').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.outline-swatch').forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-pressed', 'false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed', 'true');
    state.outlineColor = btn.dataset.outline;
    drawMeme();
  });
});

/* ─── Position mode ───────────────────────────────────────────── */
document.querySelectorAll('.pos-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pos-btn').forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-pressed', 'false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed', 'true');
    state.positionMode = btn.dataset.pos;
    document.getElementById('custom-pos-controls').style.display =
      state.positionMode === 'custom' ? 'flex' : 'none';
    drawMeme();
  });
});

/* ─── Text box toggles ────────────────────────────────────────── */
document.querySelectorAll('.text-box-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const box = btn.dataset.box;
    const isEnabled = !state.enabledBoxes[box];
    state.enabledBoxes[box] = isEnabled;
    btn.classList.toggle('active', isEnabled);
    btn.setAttribute('aria-pressed', String(isEnabled));
    btn.textContent = isEnabled ? '✓' : '+';
    textInputs[box].disabled = !isEnabled;
    if (!isEnabled) textInputs[box].value = '';
    drawMeme();
  });
});

/* ─── Category chips ─────────────────────────────────────────── */
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => {
      c.classList.remove('active');
      c.setAttribute('aria-pressed', 'false');
    });
    chip.classList.add('active');
    chip.setAttribute('aria-pressed', 'true');
    state.activeCategory = chip.dataset.cat;
    applyFilter();
  });
});

/* ─── Search ─────────────────────────────────────────────────── */
searchInput.addEventListener('input', applyFilter);

/* ─── Brand overlay → localStorage ──────────────────────────── */
brandInput.value = localStorage.getItem(LS_BRAND) || '';
brandInput.addEventListener('input', () => {
  localStorage.setItem(LS_BRAND, brandInput.value.trim());
  drawMeme();
});

/* ─── Export: Download ───────────────────────────────────────── */
btnDownload.addEventListener('click', () => {
  try {
    const link = document.createElement('a');
    link.download = `meme-${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    toast('Meme downloaded!', 'success');
  } catch (err) {
    toast('Download failed — image may be cross-origin. Try another template.', 'error');
  }
});

/* ─── Export: Copy to clipboard ─────────────────────────────── */
btnCopy.addEventListener('click', () => {
  if (!state.image) return;
  try {
    canvas.toBlob(async blob => {
      if (!blob) { toast('Could not create blob', 'error'); return; }
      try {
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]);
        toast('Copied to clipboard!', 'success');
      } catch (err) {
        toast('Clipboard access denied — try downloading instead.', 'error');
      }
    }, 'image/png');
  } catch (err) {
    toast('Copy failed', 'error');
  }
});

/* ─── Export: Save to gallery ────────────────────────────────── */
btnSave.addEventListener('click', () => {
  if (!state.image) return;
  try {
    const dataUrl = canvas.toDataURL('image/png');
    const saved = getSaved();
    saved.unshift({
      dataUrl,
      label: state.selectedTemplate?.name || 'Custom',
      ts: Date.now(),
    });
    setSaved(saved.slice(0, MAX_SAVED));
    renderSavedStrip();
    toast('Saved to gallery!', 'success');
  } catch (err) {
    toast('Save failed — image may be cross-origin.', 'error');
  }
});

/* ─── Saved strip ─────────────────────────────────────────────── */
function renderSavedStrip() {
  const saved = getSaved();
  if (!saved.length) {
    savedStrip.innerHTML = '<span class="saved-empty">No saved memes yet</span>';
    return;
  }
  savedStrip.innerHTML = '';
  saved.forEach(item => {
    const div = document.createElement('div');
    div.className = 'saved-thumb';
    div.setAttribute('role', 'listitem');
    div.setAttribute('tabindex', '0');
    div.setAttribute('aria-label', `Saved: ${item.label}`);
    div.title = item.label;

    const img = document.createElement('img');
    img.src = item.dataUrl;
    img.alt = item.label;

    div.appendChild(img);
    div.addEventListener('click', () => {
      const loadImg = new Image();
      loadImg.onload = () => {
        state.image = loadImg;
        state.selectedTemplate = null;
        canvas.width  = loadImg.naturalWidth;
        canvas.height = loadImg.naturalHeight;
        showCanvas();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(loadImg, 0, 0);
        setExportStatus(`Saved: ${item.label}`);
      };
      loadImg.src = item.dataUrl;
    });
    div.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); div.click(); }
    });
    savedStrip.appendChild(div);
  });
}

document.getElementById('clear-saved').addEventListener('click', () => {
  localStorage.removeItem(LS_SAVED);
  renderSavedStrip();
  toast('Saved memes cleared');
});

/* ─── Init ───────────────────────────────────────────────────── */
renderSavedStrip();
fetchTemplates();
</script>
</body>
</html>
