<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artist Tour Date Notifier — Dark Factory</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap');

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1e1e1e;
      --border: rgba(255,255,255,0.08);
      --accent: #1db954;
      --accent2: #ff6b6b;
      --text: #ffffff;
      --muted: #9ca3af;
      --radius: 12px;
      --font-display: 'Bebas Neue', Impact, sans-serif;
      --font-body: 'Figtree', system-ui, sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
      text-decoration: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    nav {
      display: flex;
      gap: 0.5rem;
    }

    .nav-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      padding: 0.45rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: var(--surface2);
      color: var(--text);
    }

    .nav-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* ── LAYOUT ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── SEARCH ── */
    .search-hero {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeInDown 0.5s ease;
    }

    .search-hero h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .search-hero p {
      color: var(--muted);
      font-size: 1rem;
    }

    .search-bar {
      display: flex;
      gap: 0.75rem;
      max-width: 560px;
      margin: 1.5rem auto 0;
    }

    .search-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 0.75rem 1rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input::placeholder { color: var(--muted); }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(168,85,247, 0.15);
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .btn:hover { background: #7b73ff; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(168,85,247, 0.35); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-outline {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); box-shadow: none; }

    .btn-green { background: var(--green); color: #0f1117; }
    .btn-green:hover { background: #56e8bc; box-shadow: 0 4px 16px rgba(67, 217, 173, 0.3); }

    .btn-danger { background: var(--accent2); }
    .btn-danger:hover { background: #ff7a9a; box-shadow: 0 4px 16px rgba(244,63,94, 0.35); }

    .btn-sm { padding: 0.4rem 0.85rem; font-size: 0.8rem; }

    /* ── ARTIST PROFILE CARD ── */
    .artist-result {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      animation: fadeIn 0.3s ease;
    }

    .artist-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .artist-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .artist-info { flex: 1; }

    .artist-name {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .artist-meta {
      color: var(--muted);
      font-size: 0.875rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .artist-meta span {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-green { background: rgba(67, 217, 173, 0.15); color: var(--green); }
    .badge-accent { background: rgba(168,85,247, 0.15); color: var(--accent); }
    .badge-yellow { background: rgba(247, 201, 72, 0.15); color: var(--yellow); }

    /* ── EVENT CARDS ── */
    .events-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .events-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    .event-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      transition: all 0.2s;
      animation: fadeIn 0.3s ease;
    }

    .event-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .event-date {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .date-block {
      background: var(--accent);
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      text-align: center;
      flex-shrink: 0;
      min-width: 52px;
    }

    .date-block .month {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.85;
    }

    .date-block .day {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1;
    }

    .event-details { flex: 1; }

    .event-venue {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.2rem;
    }

    .event-location {
      color: var(--muted);
      font-size: 0.825rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .event-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.9rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--border);
    }

    .event-distance {
      font-size: 0.8rem;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* ── WATCHLIST ── */
    .watchlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .watchlist-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: all 0.2s;
      animation: fadeIn 0.3s ease;
    }

    .watchlist-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .watchlist-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .watchlist-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .watchlist-info { flex: 1; overflow: hidden; }

    .watchlist-name {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .watchlist-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .watchlist-actions {
      display: flex;
      gap: 0.5rem;
    }

    /* ── CALENDAR ── */
    .calendar-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    .calendar-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .calendar-nav {
      display: flex;
      gap: 0.5rem;
    }

    .calendar-nav-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calendar-nav-btn:hover { background: var(--accent); border-color: var(--accent); }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .cal-day-name {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.75rem 0.25rem;
      border-bottom: 1px solid var(--border);
    }

    .cal-cell {
      min-height: 80px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 0.4rem;
      position: relative;
      transition: background 0.15s;
    }

    .cal-cell:nth-child(7n) { border-right: none; }

    .cal-cell:hover { background: var(--surface2); }

    .cal-cell.other-month { opacity: 0.35; }

    .cal-cell.today .cal-num {
      background: var(--accent);
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cal-num {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .cal-event-dot {
      font-size: 0.68rem;
      background: rgba(168,85,247, 0.2);
      color: var(--accent);
      border-radius: 4px;
      padding: 0.1rem 0.3rem;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: default;
    }

    .cal-event-dot:hover {
      background: rgba(168,85,247, 0.4);
    }

    /* ── EMPTY STATES ── */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
      animation: fadeIn 0.3s ease;
    }

    .empty-state .empty-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.6;
    }

    .empty-state h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      font-size: 0.9rem;
      max-width: 320px;
      margin: 0 auto 1.5rem;
    }

    /* ── TOAST ── */
    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1.25rem;
      font-size: 0.875rem;
      max-width: 320px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      animation: slideInRight 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .toast.success { border-left: 3px solid var(--green); }
    .toast.error { border-left: 3px solid var(--accent2); }
    .toast.info { border-left: 3px solid var(--accent); }

    .toast.fade-out { animation: fadeOut 0.3s ease forwards; }

    /* ── SPINNER ── */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
    }

    .loading-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 3rem;
      color: var(--muted);
    }

    /* ── FILTER BAR ── */
    .filter-bar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 0.875rem;
      color: var(--muted);
      font-weight: 500;
    }

    .filter-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
    .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── DISTANCE FILTER ── */
    .distance-section {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .distance-section .dist-info {
      flex: 1;
      font-size: 0.875rem;
    }

    .distance-section .dist-info strong {
      color: var(--green);
    }

    /* ── STATS ROW ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-align: center;
      transition: all 0.2s;
    }

    .stat-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    /* ── SECTION HEADER ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(24px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(24px); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .artist-result { flex-direction: column; align-items: flex-start; }
      .search-hero h1 { font-size: 1.5rem; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      nav { gap: 0.25rem; }
      .nav-btn { padding: 0.4rem 0.65rem; font-size: 0.8rem; }
    }

    /* ── TOOLTIP ── */
    [data-tooltip] {
      position: relative;
    }

    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.75rem;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10;
    }

    [data-tooltip]:hover::after { opacity: 1; }

    /* ── QUICK SUGGESTIONS ── */
    .suggestions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1rem;
    }

    .suggestion-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(168,85,247, 0.08);
    }

    /* ── EXPORT BTN ── */
    .export-section {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    /* === Music/Podcast v2 Design System === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      line-height: 1.6;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 20% 80%, rgba(29,185,84,0.1) 0%, transparent 60%),
        radial-gradient(ellipse 500px 300px at 80% 20%, rgba(255,107,107,0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    body > * { position: relative; z-index: 1; }

    h1 { font-family: var(--font-display); font-size: clamp(2.5rem, 6vw, 4rem); letter-spacing: 0.02em; color: var(--text); line-height: 1; }
    h2 { font-family: var(--font-display); font-size: clamp(1.5rem, 3vw, 2rem); letter-spacing: 0.04em; color: var(--accent); }
    h3 { font-family: var(--font-body); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }

    .container, main, .wrapper, .app { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }

    .card, .result, .item, .track, .artist, .album, .podcast, .episode, .station, .radio,
    [class*="card"], [class*="item"], [class*="result"], [class*="track"], [class*="artist"] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      transition: transform 0.2s, background 0.2s;
      animation: mediaFade 0.4s ease both;
    }
    .card:hover, .item:hover, [class*="card"]:hover, [class*="track"]:hover { transform: translateY(-2px); background: var(--surface2); }

    input, select, textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem 1rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      width: 100%;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

    button, .btn, input[type="submit"], input[type="button"] {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 999px;
      padding: 0.75rem 2rem;
      font-family: var(--font-body);
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
    }
    button:hover { transform: scale(1.03); filter: brightness(1.1); }
    button:active { transform: scale(0.97); }

    .bpm, .tempo, .key, .duration, .time, .frequency {
      font-family: var(--font-mono);
      font-size: 2.2rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .tag, .badge, .genre, .category, .label {
      display: inline-block;
      background: rgba(29,185,84,0.12);
      border: 1px solid rgba(29,185,84,0.25);
      color: var(--accent);
      border-radius: 4px;
      padding: 0.15rem 0.6rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Waveform bars visualization */
    .waveform, .bars, .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 32px;
    }
    .waveform div, .bar {
      width: 4px;
      background: var(--accent);
      border-radius: 2px;
      animation: wave 1s ease infinite;
    }
    .waveform div:nth-child(2n) { animation-delay: 0.2s; }
    .waveform div:nth-child(3n) { animation-delay: 0.4s; }

    table { width: 100%; border-collapse: collapse; }
    th { padding: 0.5rem 1rem; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; border-bottom: 1px solid var(--border); }
    td { padding: 0.6rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.04); }

    @keyframes mediaFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }
  </style>
</head>
<body>

<header>
  <a class="logo" href="#" aria-label="Artist Tour Date Notifier home">
    <div class="logo-icon" aria-hidden="true">🎵</div>
    <span>Tour Tracker</span>
  </a>
  <nav aria-label="Main navigation">
    <button class="nav-btn active" data-tab="search" aria-selected="true">Search</button>
    <button class="nav-btn" data-tab="watchlist" aria-selected="false">Watchlist <span id="watchlist-count-badge"></span></button>
    <button class="nav-btn" data-tab="calendar" aria-selected="false">Calendar</button>
  </nav>
</header>

<main>
  <!-- ── SEARCH TAB ── -->
  <section class="tab-panel active" id="tab-search" role="tabpanel" aria-label="Search artists">
    <div class="search-hero">
      <h1>Find Tour Dates</h1>
      <p>Search any artist to see upcoming shows, then add them to your watchlist.</p>
      <div class="search-bar" role="search">
        <label for="artist-input" class="sr-only" style="position:absolute;left:-9999px">Artist name</label>
        <input
          id="artist-input"
          class="search-input"
          type="search"
          placeholder="Search artist name…"
          autocomplete="off"
          aria-label="Artist name"
        />
        <button class="btn" id="search-btn" aria-label="Search for artist">
          <span id="search-btn-text">Search</span>
        </button>
      </div>
      <div class="suggestions" aria-label="Quick suggestions">
        <span class="suggestion-chip" tabindex="0" role="button" aria-label="Search Taylor Swift">Taylor Swift</span>
        <span class="suggestion-chip" tabindex="0" role="button" aria-label="Search Coldplay">Coldplay</span>
        <span class="suggestion-chip" tabindex="0" role="button" aria-label="Search The Weeknd">The Weeknd</span>
        <span class="suggestion-chip" tabindex="0" role="button" aria-label="Search Billie Eilish">Billie Eilish</span>
        <span class="suggestion-chip" tabindex="0" role="button" aria-label="Search Bad Bunny">Bad Bunny</span>
      </div>
    </div>

    <div id="search-results"></div>
  </section>

  <!-- ── WATCHLIST TAB ── -->
  <section class="tab-panel" id="tab-watchlist" role="tabpanel" aria-label="Your artist watchlist">
    <div class="section-header">
      <h2 class="section-title">My Watchlist</h2>
      <div class="export-section">
        <button class="btn btn-outline btn-sm" id="refresh-all-btn" aria-label="Refresh all artists">↻ Refresh All</button>
        <button class="btn btn-green btn-sm" id="export-ics-btn" aria-label="Export shows as ICS calendar file">⬇ Export ICS</button>
      </div>
    </div>
    <div id="watchlist-stats" class="stats-row" aria-live="polite"></div>
    <div id="watchlist-content"></div>
  </section>

  <!-- ── CALENDAR TAB ── -->
  <section class="tab-panel" id="tab-calendar" role="tabpanel" aria-label="Calendar view of all shows">
    <div class="section-header">
      <h2 class="section-title">Show Calendar</h2>
      <div class="export-section">
        <button class="btn btn-green btn-sm" id="export-cal-ics-btn" aria-label="Export calendar as ICS">⬇ Export ICS</button>
      </div>
    </div>
    <div id="calendar-container"></div>
  </section>
</main>

<div id="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
  'use strict';

  /* ── CONSTANTS ── */
  const APP_ID = 'darkfactory';
  const BIT_BASE = 'https://rest.bandsintown.com';
  const LS_KEY = 'tour-tracker-watchlist';
  const LS_EVENTS_KEY = 'tour-tracker-events';

  /* ── STATE ── */
  let watchlist = loadWatchlist();
  let cachedEvents = loadCachedEvents();
  let userCoords = null;
  let activeTab = 'search';
  let calendarDate = new Date();

  /* ── PERSISTENCE ── */
  function loadWatchlist() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch { return []; }
  }

  function saveWatchlist() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(watchlist)); } catch { /* ignore */ }
  }

  function loadCachedEvents() {
    try { return JSON.parse(localStorage.getItem(LS_EVENTS_KEY)) || {}; } catch { return {}; }
  }

  function saveCachedEvents() {
    try { localStorage.setItem(LS_EVENTS_KEY, JSON.stringify(cachedEvents)); } catch { /* ignore */ }
  }

  /* ── TOAST ── */
  function showToast(msg, type = 'info', duration = 3500) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
    toast.innerHTML = `<span style="font-size:1rem">${icon}</span><span>${msg}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.classList.add('fade-out');
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  /* ── TABS ── */
  document.querySelectorAll('.nav-btn[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); switchTab(btn.dataset.tab); } });
  });

  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn[data-tab]').forEach(b => {
      const isActive = b.dataset.tab === tab;
      b.classList.toggle('active', isActive);
      b.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });
    document.getElementById(`tab-${tab}`).classList.add('active');
    if (tab === 'watchlist') renderWatchlist();
    if (tab === 'calendar') renderCalendar();
  }

  /* ── WATCHLIST BADGE ── */
  function updateBadge() {
    const badge = document.getElementById('watchlist-count-badge');
    badge.textContent = watchlist.length > 0 ? `(${watchlist.length})` : '';
  }

  /* ── GEOLOCATION ── */
  function requestGeolocation() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      pos => {
        userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        showToast('Location detected — showing distances to shows', 'success');
      },
      () => { /* silently ignore */ }
    );
  }

  function haversineKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  /* ── API ── */
  async function fetchArtist(name) {
    const encoded = encodeURIComponent(name.trim());
    const res = await fetch(`${BIT_BASE}/artists/${encoded}?app_id=${APP_ID}`);
    if (!res.ok) throw new Error(`Artist not found (${res.status})`);
    return res.json();
  }

  async function fetchEvents(artistName) {
    const encoded = encodeURIComponent(artistName.trim());
    const res = await fetch(`${BIT_BASE}/artists/${encoded}/events?app_id=${APP_ID}&date=upcoming`);
    if (!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  }

  /* ── FORMAT HELPERS ── */
  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return { month: d.toLocaleString('en', { month: 'short' }).toUpperCase(), day: d.getDate(), full: d.toLocaleDateString('en', { weekday: 'short', year: 'numeric', month: 'long', day: 'numeric' }), iso: dateStr };
  }

  function artistInitial(name) {
    return name ? name.charAt(0).toUpperCase() : '?';
  }

  /* ── ARTIST IN WATCHLIST? ── */
  function isFollowing(artistName) {
    return watchlist.some(a => a.name.toLowerCase() === artistName.toLowerCase());
  }

  /* ── SEARCH ── */
  const searchInput = document.getElementById('artist-input');
  const searchBtn = document.getElementById('search-btn');

  searchBtn.addEventListener('click', doSearch);
  searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  document.querySelectorAll('.suggestion-chip').forEach(chip => {
    chip.addEventListener('click', () => { searchInput.value = chip.textContent; doSearch(); });
    chip.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); searchInput.value = chip.textContent; doSearch(); } });
  });

  async function doSearch() {
    const query = searchInput.value.trim();
    if (!query) { showToast('Enter an artist name to search', 'error'); searchInput.focus(); return; }

    const results = document.getElementById('search-results');
    const btnText = document.getElementById('search-btn-text');
    searchBtn.disabled = true;
    btnText.innerHTML = `<span class="spinner"></span>`;
    results.innerHTML = `<div class="loading-overlay"><div class="spinner" style="width:32px;height:32px;border-width:3px"></div><span>Searching for "${query}"…</span></div>`;

    try {
      const [artist, events] = await Promise.all([fetchArtist(query), fetchEvents(query)]);
      renderSearchResults(artist, events, results);
    } catch (err) {
      results.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <h3>Artist Not Found</h3>
          <p>We couldn't find an artist named "${query}". Check the spelling or try a different name.</p>
        </div>`;
      showToast(`No results for "${query}"`, 'error');
    } finally {
      searchBtn.disabled = false;
      btnText.textContent = 'Search';
    }
  }

  function renderSearchResults(artist, events, container) {
    const following = isFollowing(artist.name);
    const thumbHtml = artist.thumb_url
      ? `<img src="${artist.thumb_url}" alt="${escHtml(artist.name)} photo" loading="lazy" />`
      : artistInitial(artist.name);

    const followBtn = following
      ? `<button class="btn btn-outline btn-sm" id="toggle-follow-btn" data-artist='${JSON.stringify({ name: artist.name, url: artist.url || '', thumb_url: artist.thumb_url || '' })}' aria-pressed="true">✓ Following</button>`
      : `<button class="btn btn-sm" id="toggle-follow-btn" data-artist='${JSON.stringify({ name: artist.name, url: artist.url || '', thumb_url: artist.thumb_url || '' })}' aria-pressed="false">+ Add to Watchlist</button>`;

    container.innerHTML = `
      <div class="artist-result" role="region" aria-label="${escHtml(artist.name)} profile">
        <div class="artist-avatar" aria-hidden="true">${thumbHtml}</div>
        <div class="artist-info">
          <div class="artist-name">${escHtml(artist.name)}</div>
          <div class="artist-meta">
            <span>🎤 ${events.length} upcoming show${events.length !== 1 ? 's' : ''}</span>
            ${artist.facebook_page_url ? `<span><a href="${escHtml(artist.facebook_page_url)}" target="_blank" rel="noopener noreferrer" style="color:var(--muted);text-decoration:none">Facebook</a></span>` : ''}
          </div>
        </div>
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
          ${followBtn}
        </div>
      </div>
      ${renderEventsList(artist.name, events)}
    `;

    document.getElementById('toggle-follow-btn').addEventListener('click', function () {
      const data = JSON.parse(this.dataset.artist);
      toggleFollow(data, this);
    });
  }

  function renderEventsList(artistName, events) {
    if (!events.length) {
      return `<div class="empty-state"><div class="empty-icon">📅</div><h3>No Upcoming Shows</h3><p>No tour dates announced yet for ${escHtml(artistName)}. Add them to your watchlist and we'll track new announcements.</p></div>`;
    }

    const eventsHtml = events.map(ev => renderEventCard(ev)).join('');

    return `
      <div class="events-header">
        <h2>Upcoming Shows <span class="badge badge-accent">${events.length}</span></h2>
      </div>
      <div class="events-grid" role="list" aria-label="Upcoming shows">${eventsHtml}</div>
    `;
  }

  function renderEventCard(ev) {
    const d = formatDate(ev.datetime);
    const venue = ev.venue || {};
    const venueName = venue.name || 'TBA';
    const city = [venue.city, venue.region, venue.country].filter(Boolean).join(', ');
    const ticketUrl = (ev.offers && ev.offers.length) ? ev.offers[0].url : (ev.url || '');

    let distanceHtml = '';
    if (userCoords && venue.latitude && venue.longitude) {
      const km = haversineKm(userCoords.lat, userCoords.lon, parseFloat(venue.latitude), parseFloat(venue.longitude));
      distanceHtml = `<span class="event-distance">📍 ${km < 1 ? '<1' : Math.round(km)} km away</span>`;
    }

    return `
      <article class="event-card" role="listitem">
        <div class="event-date">
          <div class="date-block" aria-label="${d.full}">
            <div class="month">${d.month}</div>
            <div class="day">${d.day}</div>
          </div>
          <div class="event-details">
            <div class="event-venue">${escHtml(venueName)}</div>
            <div class="event-location">📍 ${escHtml(city || 'Location TBA')}</div>
            ${d.full ? `<div style="font-size:0.78rem;color:var(--muted);margin-top:0.15rem">${d.full}</div>` : ''}
          </div>
        </div>
        <div class="event-footer">
          ${distanceHtml || '<span></span>'}
          ${ticketUrl ? `<a href="${escHtml(ticketUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-sm" aria-label="Get tickets for show at ${escHtml(venueName)}">Get Tickets</a>` : `<span class="badge badge-yellow">TBA</span>`}
        </div>
      </article>
    `;
  }

  /* ── FOLLOW / UNFOLLOW ── */
  function toggleFollow(artistData, btn) {
    const idx = watchlist.findIndex(a => a.name.toLowerCase() === artistData.name.toLowerCase());
    if (idx === -1) {
      watchlist.push({ ...artistData, addedAt: Date.now() });
      saveWatchlist();
      showToast(`Added ${artistData.name} to watchlist`, 'success');
      if (btn) {
        btn.textContent = '✓ Following';
        btn.classList.remove('btn');
        btn.classList.add('btn', 'btn-outline');
        btn.setAttribute('aria-pressed', 'true');
      }
    } else {
      watchlist.splice(idx, 1);
      saveWatchlist();
      showToast(`Removed ${artistData.name} from watchlist`, 'info');
      if (btn) {
        btn.textContent = '+ Add to Watchlist';
        btn.classList.remove('btn-outline');
        btn.setAttribute('aria-pressed', 'false');
      }
    }
    updateBadge();
  }

  /* ── WATCHLIST RENDER ── */
  async function renderWatchlist() {
    const content = document.getElementById('watchlist-content');
    const stats = document.getElementById('watchlist-stats');

    if (!watchlist.length) {
      stats.innerHTML = '';
      content.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🎶</div>
          <h3>Your Watchlist is Empty</h3>
          <p>Search for an artist and click "Add to Watchlist" to start tracking their tour dates.</p>
          <button class="btn" onclick="switchTab('search')">Search Artists</button>
        </div>`;
      return;
    }

    content.innerHTML = `<div class="loading-overlay"><div class="spinner" style="width:32px;height:32px;border-width:3px"></div><span>Loading events…</span></div>`;

    /* fetch events for all watched artists */
    const eventPromises = watchlist.map(async artist => {
      const events = await fetchEvents(artist.name).catch(() => []);
      cachedEvents[artist.name] = events;
      return events;
    });

    await Promise.all(eventPromises);
    saveCachedEvents();

    const totalShows = Object.values(cachedEvents).flat().length;
    const thisMonth = Object.values(cachedEvents).flat().filter(ev => {
      const d = new Date(ev.datetime);
      const now = new Date();
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }).length;

    stats.innerHTML = `
      <div class="stat-card"><div class="stat-value">${watchlist.length}</div><div class="stat-label">Artists Tracked</div></div>
      <div class="stat-card"><div class="stat-value">${totalShows}</div><div class="stat-label">Total Shows</div></div>
      <div class="stat-card"><div class="stat-value">${thisMonth}</div><div class="stat-label">Shows This Month</div></div>
    `;

    const cards = watchlist.map(artist => {
      const events = cachedEvents[artist.name] || [];
      const nextShow = events[0] ? formatDate(events[0].datetime) : null;
      const thumbHtml = artist.thumb_url
        ? `<img src="${artist.thumb_url}" alt="${escHtml(artist.name)}" loading="lazy" />`
        : artistInitial(artist.name);
      const safeArtist = escAttr(JSON.stringify({ name: artist.name, url: artist.url || '', thumb_url: artist.thumb_url || '' }));

      return `
        <div class="watchlist-card" role="article" aria-label="${escHtml(artist.name)} watchlist entry">
          <div class="watchlist-avatar" aria-hidden="true">${thumbHtml}</div>
          <div class="watchlist-info">
            <div class="watchlist-name">${escHtml(artist.name)}</div>
            <div class="watchlist-meta">
              ${events.length ? `${events.length} show${events.length !== 1 ? 's' : ''} · Next: ${nextShow ? nextShow.full : 'TBA'}` : 'No upcoming shows'}
            </div>
          </div>
          <div class="watchlist-actions">
            <button class="btn btn-sm btn-outline" data-action="view" data-name="${escAttr(artist.name)}" aria-label="View shows for ${escHtml(artist.name)}">View</button>
            <button class="btn btn-sm btn-danger" data-action="remove" data-artist="${safeArtist}" aria-label="Remove ${escHtml(artist.name)} from watchlist">✕</button>
          </div>
        </div>
      `;
    }).join('');

    content.innerHTML = `<div class="watchlist-grid" role="list">${cards}</div>`;

    content.querySelectorAll('[data-action="remove"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const data = JSON.parse(btn.dataset.artist);
        toggleFollow(data, null);
        renderWatchlist();
      });
    });

    content.querySelectorAll('[data-action="view"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const name = btn.dataset.name;
        searchInput.value = name;
        switchTab('search');
        doSearch();
      });
    });
  }

  /* ── CALENDAR RENDER ── */
  function renderCalendar() {
    const container = document.getElementById('calendar-container');
    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();

    const allEvents = Object.entries(cachedEvents).flatMap(([artistName, events]) =>
      events.map(ev => ({ ...ev, _artist: artistName }))
    );

    const monthName = calendarDate.toLocaleString('en', { month: 'long', year: 'numeric' });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrev = new Date(year, month, 0).getDate();
    const today = new Date();

    let cells = '';

    /* prev month filler */
    for (let i = firstDay - 1; i >= 0; i--) {
      cells += `<div class="cal-cell other-month"><div class="cal-num">${daysInPrev - i}</div></div>`;
    }

    /* current month */
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
      const cellDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dayEvents = allEvents.filter(ev => ev.datetime && ev.datetime.startsWith(cellDate));
      const eventDots = dayEvents.slice(0, 3).map(ev =>
        `<div class="cal-event-dot" title="${escHtml(ev._artist)} @ ${escHtml(ev.venue ? ev.venue.name : 'TBA')}" role="img" aria-label="${escHtml(ev._artist)} show">${escHtml(ev._artist.length > 10 ? `${ev._artist.slice(0, 10)}…` : ev._artist)}</div>`
      ).join('');
      const moreLabel = dayEvents.length > 3 ? `<div style="font-size:0.65rem;color:var(--muted)">+${dayEvents.length - 3} more</div>` : '';

      cells += `
        <div class="cal-cell${isToday ? ' today' : ''}" aria-label="${cellDate}${dayEvents.length ? `, ${dayEvents.length} show${dayEvents.length !== 1 ? 's' : ''}` : ''}">
          <div class="cal-num">${d}</div>
          ${eventDots}
          ${moreLabel}
        </div>`;
    }

    /* next month filler */
    const totalCells = firstDay + daysInMonth;
    const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
    for (let d = 1; d <= remaining; d++) {
      cells += `<div class="cal-cell other-month"><div class="cal-num">${d}</div></div>`;
    }

    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const headers = dayNames.map(n => `<div class="cal-day-name" aria-label="${n}">${n}</div>`).join('');

    if (!Object.keys(cachedEvents).length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📆</div>
          <h3>No Events Loaded Yet</h3>
          <p>Add artists to your watchlist and visit the Watchlist tab to load their events, then come back here to see them on the calendar.</p>
        </div>`;
      return;
    }

    container.innerHTML = `
      <div class="calendar-wrap" role="grid" aria-label="Tour dates calendar ${monthName}">
        <div class="calendar-header">
          <div class="calendar-title">${monthName}</div>
          <div class="calendar-nav">
            <button class="calendar-nav-btn" id="cal-prev" aria-label="Previous month">‹</button>
            <button class="calendar-nav-btn" id="cal-today" aria-label="Go to today" style="font-size:0.75rem;width:auto;padding:0 0.6rem">Today</button>
            <button class="calendar-nav-btn" id="cal-next" aria-label="Next month">›</button>
          </div>
        </div>
        <div class="calendar-grid" role="row">${headers}</div>
        <div class="calendar-grid">${cells}</div>
      </div>
    `;

    document.getElementById('cal-prev').addEventListener('click', () => {
      calendarDate.setMonth(calendarDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('cal-next').addEventListener('click', () => {
      calendarDate.setMonth(calendarDate.getMonth() + 1);
      renderCalendar();
    });

    document.getElementById('cal-today').addEventListener('click', () => {
      calendarDate = new Date();
      renderCalendar();
    });
  }

  /* ── EXPORT ICS ── */
  function generateICS(events) {
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Dark Factory//Tour Tracker//EN',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH'
    ];

    events.forEach(ev => {
      const dtStr = ev.datetime ? ev.datetime.replace(/[-:]/g, '').replace('T', 'T').split('+')[0].split('.')[0] : '';
      const venue = ev.venue || {};
      const location = [venue.name, venue.city, venue.country].filter(Boolean).join(', ');
      const uid = `${Date.now()}-${Math.random().toString(36).slice(2)}@darkfactory`;

      lines.push(
        'BEGIN:VEVENT',
        `UID:${uid}`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
        `DTSTART:${dtStr || '00000000'}`,
        `SUMMARY:${(ev._artist || '') + (venue.name ? ` @ ${venue.name}` : '')}`,
        `LOCATION:${location}`,
        `DESCRIPTION:${ev.url || ''}`,
        'END:VEVENT'
      );
    });

    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }

  function downloadICS(filename, content) {
    const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  function exportAllICS() {
    const allEvents = Object.entries(cachedEvents).flatMap(([artistName, events]) =>
      events.map(ev => ({ ...ev, _artist: artistName }))
    );
    if (!allEvents.length) { showToast('No events to export — add artists to your watchlist first', 'error'); return; }
    const ics = generateICS(allEvents);
    downloadICS('tour-dates.ics', ics);
    showToast(`Exported ${allEvents.length} event${allEvents.length !== 1 ? 's' : ''} as ICS`, 'success');
  }

  document.getElementById('export-ics-btn').addEventListener('click', exportAllICS);
  document.getElementById('export-cal-ics-btn').addEventListener('click', exportAllICS);

  document.getElementById('refresh-all-btn').addEventListener('click', () => {
    if (!watchlist.length) { showToast('No artists in watchlist', 'error'); return; }
    showToast('Refreshing all artists…', 'info');
    renderWatchlist();
  });

  /* ── ESCAPE HELPERS ── */
  function escHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function escAttr(str) {
    return String(str || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ── INIT ── */
  updateBadge();
  requestGeolocation();
</script>
</body>
