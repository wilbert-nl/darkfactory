<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remote Job Board — Niche Industry Feed</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface2: #1a1a1a;
      --border: rgba(255,255,255,0.08);
      --accent: #ffffff;
      --accent2: #3b82f6;
      --text: #ededed;
      --muted: #6b7280;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --radius: 6px;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --font-body: 'Inter', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 64px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    .logo-text span { color: var(--accent); }

    .header-search {
      flex: 1;
      max-width: 400px;
      position: relative;
    }

    .header-search input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px 8px 40px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .header-search input:focus { border-color: var(--accent); }
    .header-search input::placeholder { color: var(--muted); }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      font-size: 15px;
    }

    .header-tabs {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    .tab-btn {
      background: none;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 6px 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover { color: var(--text); background: var(--surface2); }

    .tab-btn.active {
      color: var(--accent);
      background: rgba(0,229,255, 0.12);
      border-color: rgba(0,229,255, 0.3);
    }

    .tab-badge {
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 20px;
      min-width: 18px;
      text-align: center;
    }

    /* ── Layout ── */
    .layout {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
      align-items: start;
    }

    /* ── Sidebar ── */
    .sidebar {
      position: sticky;
      top: 88px;
    }

    .sidebar-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      transition: all 0.18s;
      user-select: none;
    }

    .chip:hover { border-color: var(--accent); color: var(--accent); }

    .chip.active {
      background: rgba(0,229,255, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .remote-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      cursor: pointer;
      border-radius: 8px;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-switch {
      width: 36px;
      height: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      position: relative;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      background: var(--muted);
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: all 0.2s;
    }

    .toggle-switch.on { background: rgba(0,229,255, 0.2); border-color: var(--accent); }
    .toggle-switch.on::after { left: 18px; background: var(--accent); }

    .sidebar-stats {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .stat-label { color: var(--muted); }

    .stat-value {
      font-weight: 600;
      color: var(--text);
    }

    .stat-value.accent { color: var(--accent); }
    .stat-value.green { color: var(--green); }

    .clear-filters-btn {
      width: 100%;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .clear-filters-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* ── Main content ── */
    main { min-width: 0; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .result-count {
      font-size: 13px;
      color: var(--muted);
      flex: 1;
    }

    .result-count strong { color: var(--text); }

    .sort-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .sort-select:focus { border-color: var(--accent); }

    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .refresh-btn:hover { border-color: var(--green); color: var(--green); }
    .refresh-btn.spinning .spin-icon { animation: spin 1s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .export-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .export-btn:hover { border-color: var(--yellow); color: var(--yellow); }

    /* ── Job Card ── */
    .job-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .job-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .job-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent);
      transform: scaleY(0);
      transition: transform 0.2s;
    }

    .job-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(0,229,255, 0.15);
    }

    .job-card:hover::before { transform: scaleY(1); }

    .job-card.saved-card::before { background: var(--yellow); transform: scaleY(1); }
    .job-card.applied-card::before { background: var(--accent); transform: scaleY(1); }
    .job-card.interview-card::before { background: var(--green); transform: scaleY(1); }
    .job-card.offer-card::before { background: #ff9f43; transform: scaleY(1); }
    .job-card.rejected-card::before { background: var(--accent2); transform: scaleY(1); }

    .job-card-header {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .company-logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .company-logo img { width: 100%; height: 100%; object-fit: contain; }

    .job-meta { flex: 1; min-width: 0; }

    .job-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .job-company {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .job-company-name { color: var(--accent); font-weight: 500; }

    .separator { color: var(--border); }

    .job-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .action-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.18s;
      color: var(--muted);
    }

    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.bookmarked { border-color: var(--yellow); color: var(--yellow); background: rgba(247, 201, 72, 0.1); }

    .status-select-mini {
      height: 32px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }

    .status-select-mini:hover, .status-select-mini:focus { border-color: var(--accent); }
    .status-select-mini.has-status { color: var(--text); }

    .job-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: all 0.15s;
    }

    .tag.remote-tag {
      background: rgba(67, 217, 173, 0.1);
      border-color: rgba(67, 217, 173, 0.3);
      color: var(--green);
    }

    .tag.clickable { cursor: pointer; }
    .tag.clickable:hover { border-color: var(--accent); color: var(--accent); }

    .job-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .job-location {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .job-date {
      font-size: 12px;
      color: var(--muted);
      margin-left: auto;
    }

    .apply-link {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      padding: 4px 10px;
      border: 1px solid rgba(0,229,255, 0.3);
      border-radius: 6px;
      transition: all 0.18s;
    }

    .apply-link:hover { background: rgba(0,229,255, 0.15); border-color: var(--accent); }

    /* ── Loading ── */
    .loading-state {
      padding: 60px 24px;
      text-align: center;
      color: var(--muted);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    .loading-text { font-size: 14px; }

    /* ── Empty state ── */
    .empty-state {
      padding: 60px 24px;
      text-align: center;
      color: var(--muted);
    }

    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .empty-text { font-size: 14px; max-width: 320px; margin: 0 auto 20px; }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary:hover { background: #7b74ff; transform: translateY(-1px); }

    /* ── Toast ── */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9999;
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.5s forwards;
      max-width: 320px;
    }

    @keyframes slideIn {
      from { transform: translateX(120%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeOut {
      to { transform: translateX(120%); opacity: 0; }
    }

    .toast.success { border-color: rgba(67, 217, 173, 0.4); }
    .toast.info { border-color: rgba(0,229,255, 0.4); }
    .toast.warning { border-color: rgba(247, 201, 72, 0.4); }

    /* ── Tracker Tab ── */
    .tracker-view { display: none; }
    .tracker-view.active { display: block; }

    .tracker-columns {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .tracker-col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .tracker-col-header {
      padding: 12px 14px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tracker-col-header.saved-h { color: var(--yellow); }
    .tracker-col-header.applied-h { color: var(--accent); }
    .tracker-col-header.interview-h { color: var(--green); }
    .tracker-col-header.offer-h { color: #ff9f43; }
    .tracker-col-header.rejected-h { color: var(--accent2); }

    .col-count {
      font-size: 10px;
      background: var(--surface2);
      padding: 1px 6px;
      border-radius: 20px;
      color: var(--muted);
    }

    .tracker-cards { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 80px; }

    .tracker-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      position: relative;
    }

    .tracker-card-title {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tracker-card-company { color: var(--muted); font-size: 11px; }

    .tracker-card-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 18px;
      height: 18px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.15s;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tracker-card:hover .tracker-card-remove { opacity: 1; }
    .tracker-card-remove:hover { color: var(--accent2); }

    .tracker-empty-col {
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      padding: 16px 0;
    }

    /* ── Saved view ── */
    .saved-view { display: none; }
    .saved-view.active { display: block; }

    /* ── Profile manager ── */
    .profile-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .profile-chip {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      transition: all 0.18s;
    }

    .profile-chip:hover { border-color: var(--accent); color: var(--accent); }
    .profile-chip.active { background: rgba(0,229,255, 0.15); border-color: var(--accent); color: var(--accent); }

    .add-profile-btn {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px dashed var(--border);
      background: none;
      color: var(--muted);
      transition: all 0.18s;
    }

    .add-profile-btn:hover { border-color: var(--green); color: var(--green); }

    /* ── Animations ── */
    .job-card {
      animation: cardIn 0.3s ease both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Stagger via inline style --i */
    .job-card { animation-delay: calc(var(--i, 0) * 40ms); }

    /* ── Error state ── */
    .error-banner {
      background: rgba(124,58,237, 0.1);
      border: 1px solid rgba(124,58,237, 0.3);
      border-radius: var(--radius);
      padding: 16px 20px;
      color: var(--accent2);
      font-size: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .error-banner button {
      margin-left: auto;
      background: none;
      border: 1px solid rgba(124,58,237, 0.4);
      border-radius: 6px;
      padding: 4px 10px;
      color: var(--accent2);
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .error-banner button:hover { background: rgba(124,58,237, 0.15); }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .tracker-columns { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .header-inner { flex-wrap: wrap; height: auto; padding: 12px 0; gap: 8px; }
      .header-search { max-width: 100%; order: 3; }
      .layout { padding: 16px; }
      .tracker-columns { grid-template-columns: 1fr; }
    }

    /* Focus ring for accessibility */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Skip link */
    .skip-link {
      position: absolute;
      top: -99px;
      left: 8px;
      z-index: 9999;
      background: var(--accent);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
    }

    .skip-link:focus { top: 8px; }

/* === Dev Tools v2 Design System === */
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  line-height: 1.6;
  background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 24px 24px;
}

h1, h2, .title, .app-title { font-family: var(--font-body); font-weight: 700; letter-spacing: -0.03em; }
h1 { font-size: clamp(1.5rem, 3.5vw, 2rem); color: var(--text); }
h2 { font-size: 1.1rem; color: var(--muted); font-weight: 500; }

.container, main, .wrapper, .app { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }

.card, .result, .item, .output, .repo, .job, .post, .user, .avatar-container, .profile,
[class*="card"], [class*="result"], [class*="item"] {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  animation: toolsFade 0.25s ease both;
}
.card:hover, .item:hover { background: var(--surface2); }

.code, .value, pre, code, .mono, .username, .repo-name, .hash {
  font-family: var(--font-mono);
  font-size: 0.88rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.2rem 0.5rem;
  color: var(--text);
}

img.avatar, .avatar img, [class*="avatar"] img, .profile-img {
  border-radius: 50%;
  border: 2px solid var(--border);
}

input, select, textarea {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  padding: 0.65rem 1rem;
  font-family: var(--font-body);
  font-size: 0.9rem;
  width: 100%;
  transition: border-color 0.15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: rgba(255,255,255,0.3);
}

button, .btn, input[type="submit"], input[type="button"] {
  background: var(--text);
  color: var(--bg);
  border: none;
  border-radius: var(--radius);
  padding: 0.65rem 1.5rem;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.88rem;
  cursor: pointer;
  transition: transform 0.1s, opacity 0.1s;
}
button:hover { opacity: 0.9; }
button:active { transform: scale(0.97); }

.tag, .badge, .label, .tech, .language, .skill, .type {
  display: inline-block;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 4px;
  padding: 0.15rem 0.5rem;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-family: var(--font-mono);
}

.stat-row { display: flex; gap: 1.5rem; flex-wrap: wrap; }
.stat { font-family: var(--font-mono); }
.stat-value { font-size: 1.4rem; font-weight: 700; color: var(--text); }
.stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

.valid, .open, .active, .remote, .hiring { color: var(--green); }
.closed, .inactive { color: var(--red); }
.pending, .warning { color: var(--yellow); }

table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 0.82rem; }
th { padding: 0.5rem 0.75rem; color: var(--muted); text-align: left; font-weight: 600; font-family: var(--font-body); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 1px solid var(--border); }
td { padding: 0.5rem 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.03); }

@keyframes toolsFade {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header role="banner">
    <div class="header-inner">
      <a href="#" class="logo" aria-label="Remote Job Board Home">
        <div class="logo-icon" aria-hidden="true">🎯</div>
        <div class="logo-text">Remote<span>Niche</span></div>
      </a>

      <div class="header-search" role="search">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input
          type="search"
          id="search-input"
          placeholder="Search jobs, companies, skills…"
          aria-label="Search remote jobs"
          autocomplete="off"
        />
      </div>

      <nav class="header-tabs" role="tablist" aria-label="Views">
        <button class="tab-btn active" role="tab" aria-selected="true" data-view="jobs" id="tab-jobs">
          📋 Jobs
        </button>
        <button class="tab-btn" role="tab" aria-selected="false" data-view="saved" id="tab-saved">
          🔖 Saved <span class="tab-badge" id="saved-badge">0</span>
        </button>
        <button class="tab-btn" role="tab" aria-selected="false" data-view="tracker" id="tab-tracker">
          📊 Tracker
        </button>
      </nav>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar filters -->
    <aside aria-label="Job filters">
      <div class="sidebar-section">
        <div class="sidebar-title">Filter Profiles</div>
        <div class="profile-bar" id="profile-bar" role="group" aria-label="Saved filter profiles"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">Job Category</div>
        <div class="filter-chips" id="category-filters" role="group" aria-label="Filter by category"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">Job Type</div>
        <div class="filter-chips" id="jobtype-filters" role="group" aria-label="Filter by job type"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">Options</div>
        <div
          class="remote-toggle"
          id="remote-toggle"
          role="switch"
          aria-checked="false"
          tabindex="0"
          aria-label="Show only remote jobs"
        >
          <span class="toggle-label">🌍 Remote only</span>
          <div class="toggle-switch" id="remote-switch" aria-hidden="true"></div>
        </div>
        <button class="clear-filters-btn" id="clear-filters-btn" aria-label="Clear all filters">
          ✕ Clear filters
        </button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">Stats</div>
        <div class="sidebar-stats">
          <div class="stat-row">
            <span class="stat-label">Total jobs</span>
            <span class="stat-value accent" id="stat-total">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Showing</span>
            <span class="stat-value" id="stat-showing">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Saved</span>
            <span class="stat-value green" id="stat-saved">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Last updated</span>
            <span class="stat-value" id="stat-updated" style="font-size:11px">—</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main id="main-content">
      <!-- Jobs view -->
      <section id="jobs-view" role="tabpanel" aria-labelledby="tab-jobs">
        <div id="error-area"></div>

        <div class="toolbar">
          <div class="result-count" aria-live="polite" aria-atomic="true" id="result-label">Loading…</div>
          <label for="sort-select" class="sr-only">Sort by</label>
          <select class="sort-select" id="sort-select" aria-label="Sort jobs">
            <option value="date">Newest first</option>
            <option value="company">Company A–Z</option>
            <option value="title">Title A–Z</option>
          </select>
          <button class="refresh-btn" id="refresh-btn" aria-label="Refresh job listings">
            <span class="spin-icon">↻</span> Refresh
          </button>
          <button class="export-btn" id="export-btn" aria-label="Export tracker as CSV">
            ⬇ Export CSV
          </button>
        </div>

        <div id="job-list" class="job-list" role="list" aria-label="Remote job listings">
          <div class="loading-state" aria-live="polite">
            <div class="loading-spinner" role="img" aria-label="Loading jobs"></div>
            <div class="loading-text">Fetching remote jobs…</div>
          </div>
        </div>
      </section>

      <!-- Saved view -->
      <section id="saved-view" class="saved-view" role="tabpanel" aria-labelledby="tab-saved" hidden>
        <div class="toolbar">
          <div class="result-count" id="saved-count-label">0 saved jobs</div>
        </div>
        <div id="saved-list" class="job-list" role="list" aria-label="Saved jobs"></div>
      </section>

      <!-- Tracker view -->
      <section id="tracker-view" class="tracker-view" role="tabpanel" aria-labelledby="tab-tracker" hidden>
        <div class="toolbar">
          <div class="result-count">Application Tracker</div>
          <button class="export-btn" id="export-tracker-btn" aria-label="Export tracker as CSV">
            ⬇ Export CSV
          </button>
        </div>
        <div class="tracker-columns" id="tracker-columns" aria-label="Application pipeline"></div>
      </section>
    </main>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <script>
    'use strict';

    // ─── Constants ───────────────────────────────────────────────────────────────
    const API_URL = `https://www.arbeitnow.com/api/job-board-api`;
    const STORAGE_KEYS = {
      saved: `rjb_saved`,
      tracker: `rjb_tracker`,
      profiles: `rjb_profiles`,
      lastFetch: `rjb_last_fetch`,
      cachedJobs: `rjb_cached_jobs`,
    };

    const STATUS_LABELS = {
      saved: `Saved`,
      applied: `Applied`,
      interview: `Interview`,
      offer: `Offer`,
      rejected: `Rejected`,
    };

    const STATUS_COLORS = {
      saved: `#f7c948`,
      applied: `#6c63ff`,
      interview: `#43d9ad`,
      offer: `#ff9f43`,
      rejected: `#ff6584`,
    };

    const CATEGORY_EMOJIS = {
      'Software Development': `💻`,
      'DevOps / Sysadmin': `⚙️`,
      'Customer Support': `🎧`,
      'Sales': `📈`,
      'Product': `🧩`,
      'Design': `🎨`,
      'Marketing': `📣`,
      'Finance / Legal': `⚖️`,
      'Data Analyst': `📊`,
      'All Other Remote': `🌐`,
    };

    const DEFAULT_PROFILES = [
      { id: `all`, name: `All Niches`, tags: [] },
      { id: `tech`, name: `🖥 Legal Tech`, tags: [`legal`, `legaltech`, `law`] },
      { id: `biotech`, name: `🔬 Biotech`, tags: [`biotech`, `bio`, `healthcare`, `pharma`] },
      { id: `climate`, name: `🌱 Climate Tech`, tags: [`climate`, `sustainability`, `cleantech`, `green`, `energy`] },
      { id: `edtech`, name: `📚 EdTech`, tags: [`edtech`, `education`, `e-learning`, `learning`] },
    ];

    // ─── State ────────────────────────────────────────────────────────────────────
    let allJobs = [];
    let filteredJobs = [];
    let savedJobs = new Set();
    let tracker = {}; // jobSlug -> status
    let profiles = [...DEFAULT_PROFILES];
    let activeProfile = `all`;
    let activeCategories = new Set();
    let activeJobTypes = new Set();
    let remoteOnly = false;
    let searchQuery = ``;
    let sortBy = `date`;
    let isLoading = false;
    let currentView = `jobs`;

    // ─── DOM refs ─────────────────────────────────────────────────────────────────
    const jobListEl = document.getElementById(`job-list`);
    const savedListEl = document.getElementById(`saved-list`);
    const trackerColsEl = document.getElementById(`tracker-columns`);
    const resultLabel = document.getElementById(`result-label`);
    const savedCountLabel = document.getElementById(`saved-count-label`);
    const searchInput = document.getElementById(`search-input`);
    const sortSelect = document.getElementById(`sort-select`);
    const refreshBtn = document.getElementById(`refresh-btn`);
    const exportBtn = document.getElementById(`export-btn`);
    const exportTrackerBtn = document.getElementById(`export-tracker-btn`);
    const categoryFilters = document.getElementById(`category-filters`);
    const jobtypeFilters = document.getElementById(`jobtype-filters`);
    const remoteToggle = document.getElementById(`remote-toggle`);
    const remoteSwitch = document.getElementById(`remote-switch`);
    const clearFiltersBtn = document.getElementById(`clear-filters-btn`);
    const savedBadge = document.getElementById(`saved-badge`);
    const statTotal = document.getElementById(`stat-total`);
    const statShowing = document.getElementById(`stat-showing`);
    const statSaved = document.getElementById(`stat-saved`);
    const statUpdated = document.getElementById(`stat-updated`);
    const profileBar = document.getElementById(`profile-bar`);
    const errorArea = document.getElementById(`error-area`);
    const toastContainer = document.getElementById(`toast-container`);

    // ─── Storage helpers ──────────────────────────────────────────────────────────
    function load(key, def) {
      try {
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : def;
      } catch { return def; }
    }

    function save(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }

    function loadState() {
      savedJobs = new Set(load(STORAGE_KEYS.saved, []));
      tracker = load(STORAGE_KEYS.tracker, {});
      profiles = load(STORAGE_KEYS.profiles, DEFAULT_PROFILES);
      const cached = load(STORAGE_KEYS.cachedJobs, null);
      const lastFetch = load(STORAGE_KEYS.lastFetch, 0);
      return { cached, lastFetch };
    }

    function persistSaved() {
      save(STORAGE_KEYS.saved, [...savedJobs]);
    }

    function persistTracker() {
      save(STORAGE_KEYS.tracker, tracker);
    }

    function persistProfiles() {
      save(STORAGE_KEYS.profiles, profiles);
    }

    // ─── Toast ────────────────────────────────────────────────────────────────────
    function toast(msg, type = `info`, icon = ``) {
      const el = document.createElement(`div`);
      el.className = `toast ${type}`;
      el.setAttribute(`role`, `status`);
      el.innerHTML = `<span aria-hidden="true">${icon || (type === `success` ? `✅` : type === `warning` ? `⚠️` : `ℹ️`)}</span> ${msg}`;
      toastContainer.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // ─── Fetch jobs ───────────────────────────────────────────────────────────────
    async function fetchJobs(force = false) {
      if (isLoading) return;
      const { cached, lastFetch } = loadState();
      const age = Date.now() - lastFetch;
      const CACHE_TTL = 15 * 60 * 1000; // 15 min

      if (!force && cached && age < CACHE_TTL) {
        allJobs = cached;
        applyFilters();
        updateStats();
        return;
      }

      isLoading = true;
      setLoading(true);
      errorArea.innerHTML = ``;

      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allJobs = (data.data || []).map(normalizeJob);
        save(STORAGE_KEYS.cachedJobs, allJobs);
        save(STORAGE_KEYS.lastFetch, Date.now());
        buildCategoryFilters();
        buildJobTypeFilters();
        applyFilters();
        updateStats();
        toast(`Loaded ${allJobs.length} remote jobs`, `success`);
      } catch (err) {
        showError(`Failed to load jobs: ${err.message}`, () => fetchJobs(true));
        // Try cached
        if (cached) {
          allJobs = cached;
          applyFilters();
          updateStats();
        }
      } finally {
        isLoading = false;
        setLoading(false);
      }
    }

    function normalizeJob(raw) {
      return {
        slug: raw.slug || String(Math.random()),
        title: raw.title || `Untitled`,
        company: raw.company_name || `Unknown`,
        location: raw.location || `Remote`,
        tags: Array.isArray(raw.tags) ? raw.tags : [],
        jobType: raw.job_types ? raw.job_types.join(`, `) : ``,
        remote: raw.remote !== false,
        url: raw.url || raw.company_url || `#`,
        logoUrl: raw.company_logo || ``,
        postedAt: raw.created_at || ``,
        description: raw.description || ``,
      };
    }

    // ─── Filters ──────────────────────────────────────────────────────────────────
    function getAllCategories() {
      const cats = new Set();
      allJobs.forEach(j => j.tags.forEach(t => cats.add(t)));
      return [...cats].sort();
    }

    function getAllJobTypes() {
      const types = new Set();
      allJobs.forEach(j => {
        if (j.jobType) j.jobType.split(`, `).forEach(t => types.add(t.trim()));
      });
      return [...types].filter(Boolean).sort();
    }

    function buildCategoryFilters() {
      const cats = getAllCategories().slice(0, 20); // top 20
      categoryFilters.innerHTML = ``;
      cats.forEach(cat => {
        const chip = document.createElement(`button`);
        chip.className = `chip${activeCategories.has(cat) ? ` active` : ``}`;
        chip.textContent = cat;
        chip.setAttribute(`aria-pressed`, activeCategories.has(cat).toString());
        chip.addEventListener(`click`, () => {
          if (activeCategories.has(cat)) {
            activeCategories.delete(cat);
            chip.classList.remove(`active`);
            chip.setAttribute(`aria-pressed`, `false`);
          } else {
            activeCategories.add(cat);
            chip.classList.add(`active`);
            chip.setAttribute(`aria-pressed`, `true`);
          }
          applyFilters();
        });
        categoryFilters.appendChild(chip);
      });
    }

    function buildJobTypeFilters() {
      const types = getAllJobTypes();
      jobtypeFilters.innerHTML = ``;
      types.forEach(type => {
        const chip = document.createElement(`button`);
        chip.className = `chip${activeJobTypes.has(type) ? ` active` : ``}`;
        chip.textContent = type;
        chip.setAttribute(`aria-pressed`, activeJobTypes.has(type).toString());
        chip.addEventListener(`click`, () => {
          if (activeJobTypes.has(type)) {
            activeJobTypes.delete(type);
            chip.classList.remove(`active`);
            chip.setAttribute(`aria-pressed`, `false`);
          } else {
            activeJobTypes.add(type);
            chip.classList.add(`active`);
            chip.setAttribute(`aria-pressed`, `true`);
          }
          applyFilters();
        });
        jobtypeFilters.appendChild(chip);
      });
    }

    function applyFilters() {
      const q = searchQuery.toLowerCase();
      const profile = profiles.find(p => p.id === activeProfile);
      const profileTags = profile ? profile.tags : [];

      filteredJobs = allJobs.filter(job => {
        // Profile filter
        if (profileTags.length > 0) {
          const haystack = [...job.tags, job.title, job.company, job.description].join(` `).toLowerCase();
          if (!profileTags.some(pt => haystack.includes(pt.toLowerCase()))) return false;
        }

        // Category/tag filter
        if (activeCategories.size > 0) {
          if (!job.tags.some(t => activeCategories.has(t))) return false;
        }

        // Job type filter
        if (activeJobTypes.size > 0) {
          const jobTypeSet = new Set(job.jobType.split(`, `).map(t => t.trim()));
          if (![...activeJobTypes].some(t => jobTypeSet.has(t))) return false;
        }

        // Remote toggle
        if (remoteOnly && !job.remote) return false;

        // Search
        if (q) {
          const hay = `${job.title} ${job.company} ${job.location} ${job.tags.join(` `)}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }

        return true;
      });

      sortJobs();
      renderJobs();
      updateStats();
    }

    function sortJobs() {
      filteredJobs.sort((a, b) => {
        if (sortBy === `date`) return (b.postedAt || ``).localeCompare(a.postedAt || ``);
        if (sortBy === `company`) return a.company.localeCompare(b.company);
        if (sortBy === `title`) return a.title.localeCompare(b.title);
        return 0;
      });
    }

    // ─── Render ───────────────────────────────────────────────────────────────────
    function setLoading(on) {
      if (on) {
        jobListEl.innerHTML = `
          <div class="loading-state" aria-live="polite">
            <div class="loading-spinner" role="img" aria-label="Loading jobs"></div>
            <div class="loading-text">Fetching remote jobs…</div>
          </div>`;
        refreshBtn.classList.add(`spinning`);
      } else {
        refreshBtn.classList.remove(`spinning`);
      }
    }

    function showError(msg, retry) {
      errorArea.innerHTML = `
        <div class="error-banner" role="alert">
          <span aria-hidden="true">⚠️</span> ${msg}
          <button onclick="this.closest('.error-banner').remove()">Retry</button>
        </div>`;
      errorArea.querySelector(`button`).addEventListener(`click`, () => { errorArea.innerHTML = ``; retry(); });
    }

    function formatDate(str) {
      if (!str) return ``;
      try {
        const d = new Date(str);
        if (isNaN(d)) return str;
        const diff = Math.floor((Date.now() - d) / 86400000);
        if (diff === 0) return `Today`;
        if (diff === 1) return `Yesterday`;
        if (diff < 30) return `${diff}d ago`;
        return d.toLocaleDateString(`en-US`, { month: `short`, day: `numeric` });
      } catch { return str; }
    }

    function jobLogoHtml(job) {
      if (job.logoUrl) {
        return `<img src="${escHtml(job.logoUrl)}" alt="${escHtml(job.company)} logo" loading="lazy" onerror="this.style.display='none';this.parentNode.textContent='${escHtml(job.company.charAt(0).toUpperCase())}'">`;
      }
      return escHtml(job.company.charAt(0).toUpperCase());
    }

    function escHtml(s) {
      return String(s).replace(/&/g, `&amp;`).replace(/</g, `&lt;`).replace(/>/g, `&gt;`).replace(/"/g, `&quot;`).replace(/'/g, `&#39;`);
    }

    function statusClass(slug) {
      const s = tracker[slug];
      return s ? `${s}-card` : ``;
    }

    function renderJobCard(job, idx) {
      const isSaved = savedJobs.has(job.slug);
      const status = tracker[job.slug] || ``;
      const tagsHtml = job.tags.slice(0, 5).map(t =>
        `<span class="tag clickable" data-tag="${escHtml(t)}" role="button" tabindex="0" aria-label="Filter by ${escHtml(t)}">${escHtml(t)}</span>`
      ).join(``);
      const remoteTag = job.remote ? `<span class="tag remote-tag">🌍 Remote</span>` : ``;
      const dateStr = formatDate(job.postedAt);

      return `
        <article class="job-card ${statusClass(job.slug)}" style="--i:${idx}" role="listitem" data-slug="${escHtml(job.slug)}">
          <div class="job-card-header">
            <div class="company-logo" aria-hidden="true">${jobLogoHtml(job)}</div>
            <div class="job-meta">
              <div class="job-title" title="${escHtml(job.title)}">${escHtml(job.title)}</div>
              <div class="job-company">
                <span class="job-company-name">${escHtml(job.company)}</span>
                ${job.location ? `<span class="separator" aria-hidden="true">·</span><span>${escHtml(job.location)}</span>` : ``}
                ${job.jobType ? `<span class="separator" aria-hidden="true">·</span><span>${escHtml(job.jobType)}</span>` : ``}
              </div>
            </div>
            <div class="job-actions">
              <button class="action-btn bookmark-btn${isSaved ? ` bookmarked` : ``}"
                data-slug="${escHtml(job.slug)}"
                aria-label="${isSaved ? `Remove from saved` : `Save job`}"
                aria-pressed="${isSaved}"
                title="${isSaved ? `Remove from saved` : `Save job`}">
                ${isSaved ? `🔖` : `🔖`}
              </button>
              <select class="status-select-mini${status ? ` has-status` : ``}"
                data-slug="${escHtml(job.slug)}"
                aria-label="Application status for ${escHtml(job.title)}"
                title="Set application status">
                <option value="">Track…</option>
                ${Object.entries(STATUS_LABELS).map(([v, l]) =>
                  `<option value="${v}"${status === v ? ` selected` : ``}>${l}</option>`
                ).join(``)}
              </select>
            </div>
          </div>
          ${tagsHtml || remoteTag ? `<div class="job-tags">${remoteTag}${tagsHtml}</div>` : ``}
          <div class="job-footer">
            ${job.location ? `<span class="job-location"><span aria-hidden="true">📍</span> ${escHtml(job.location)}</span>` : ``}
            ${job.url !== `#` ? `<a href="${escHtml(job.url)}" target="_blank" rel="noopener noreferrer" class="apply-link" aria-label="Apply for ${escHtml(job.title)} at ${escHtml(job.company)}">Apply →</a>` : ``}
            ${dateStr ? `<span class="job-date">${escHtml(dateStr)}</span>` : ``}
          </div>
        </article>`;
    }

    function renderJobs() {
      if (isLoading) return;

      if (filteredJobs.length === 0) {
        jobListEl.innerHTML = `
          <div class="empty-state" role="status">
            <div class="empty-icon" aria-hidden="true">🔍</div>
            <div class="empty-title">No jobs found</div>
            <div class="empty-text">Try adjusting your filters or search query</div>
            <button class="btn-primary" id="empty-clear-btn">Clear filters</button>
          </div>`;
        document.getElementById(`empty-clear-btn`)?.addEventListener(`click`, clearFilters);
        resultLabel.textContent = `0 jobs found`;
        return;
      }

      jobListEl.innerHTML = filteredJobs.map((job, i) => renderJobCard(job, i)).join(``);
      resultLabel.textContent = `${filteredJobs.length} job${filteredJobs.length !== 1 ? `s` : ``} found`;
      attachJobCardEvents(jobListEl);
    }

    function renderSaved() {
      const saved = allJobs.filter(j => savedJobs.has(j.slug));
      savedListEl.innerHTML = saved.length
        ? saved.map((job, i) => renderJobCard(job, i)).join(``)
        : `<div class="empty-state" role="status">
            <div class="empty-icon" aria-hidden="true">🔖</div>
            <div class="empty-title">No saved jobs yet</div>
            <div class="empty-text">Bookmark jobs to save them here for later</div>
          </div>`;
      savedCountLabel.textContent = `${saved.length} saved job${saved.length !== 1 ? `s` : ``}`;
      attachJobCardEvents(savedListEl);
    }

    function renderTracker() {
      const statuses = Object.keys(STATUS_LABELS);
      trackerColsEl.innerHTML = ``;

      statuses.forEach(status => {
        const jobs = Object.entries(tracker)
          .filter(([, s]) => s === status)
          .map(([slug]) => allJobs.find(j => j.slug === slug))
          .filter(Boolean);

        const colDiv = document.createElement(`div`);
        colDiv.className = `tracker-col`;
        colDiv.innerHTML = `
          <div class="tracker-col-header ${status}-h" aria-label="${STATUS_LABELS[status]} column">
            <span>${STATUS_LABELS[status]}</span>
            <span class="col-count" aria-label="${jobs.length} jobs">${jobs.length}</span>
          </div>
          <div class="tracker-cards">
            ${jobs.length === 0
              ? `<div class="tracker-empty-col">No jobs here</div>`
              : jobs.map(job => `
                <div class="tracker-card" role="listitem">
                  <div class="tracker-card-title" title="${escHtml(job.title)}">${escHtml(job.title)}</div>
                  <div class="tracker-card-company">${escHtml(job.company)}</div>
                  <button class="tracker-card-remove" data-slug="${escHtml(job.slug)}" aria-label="Remove ${escHtml(job.title)} from tracker" title="Remove from tracker">✕</button>
                </div>`).join(``)}
          </div>`;
        trackerColsEl.appendChild(colDiv);
      });

      // Attach remove events
      trackerColsEl.querySelectorAll(`.tracker-card-remove`).forEach(btn => {
        btn.addEventListener(`click`, e => {
          const slug = e.currentTarget.dataset.slug;
          delete tracker[slug];
          persistTracker();
          renderTracker();
          // Update bookmark in job list
          const bm = jobListEl.querySelector(`.status-select-mini[data-slug="${slug}"]`);
          if (bm) { bm.value = ``; bm.classList.remove(`has-status`); }
          toast(`Removed from tracker`, `info`);
        });
      });
    }

    function attachJobCardEvents(container) {
      // Bookmark buttons
      container.querySelectorAll(`.bookmark-btn`).forEach(btn => {
        btn.addEventListener(`click`, e => {
          e.stopPropagation();
          const slug = btn.dataset.slug;
          if (savedJobs.has(slug)) {
            savedJobs.delete(slug);
            btn.classList.remove(`bookmarked`);
            btn.setAttribute(`aria-pressed`, `false`);
            btn.setAttribute(`aria-label`, `Save job`);
            toast(`Job removed from saved`, `info`, `🔖`);
          } else {
            savedJobs.add(slug);
            btn.classList.add(`bookmarked`);
            btn.setAttribute(`aria-pressed`, `true`);
            btn.setAttribute(`aria-label`, `Remove from saved`);
            toast(`Job saved!`, `success`, `🔖`);
          }
          persistSaved();
          updateBadges();
          if (currentView === `saved`) renderSaved();
        });
      });

      // Status selects
      container.querySelectorAll(`.status-select-mini`).forEach(sel => {
        sel.addEventListener(`change`, e => {
          const slug = sel.dataset.slug;
          const val = sel.value;
          if (val) {
            tracker[slug] = val;
            sel.classList.add(`has-status`);
            toast(`Status updated: ${STATUS_LABELS[val]}`, `success`);
          } else {
            delete tracker[slug];
            sel.classList.remove(`has-status`);
            toast(`Status removed`, `info`);
          }
          persistTracker();
          // Update card highlight
          const card = container.querySelector(`.job-card[data-slug="${slug}"]`);
          if (card) {
            card.className = `job-card ${val ? `${val}-card` : ``}`;
          }
          if (currentView === `tracker`) renderTracker();
        });
      });

      // Tag click to filter
      container.querySelectorAll(`.tag.clickable`).forEach(tag => {
        const handler = () => {
          const t = tag.dataset.tag;
          if (t) {
            activeCategories.add(t);
            searchInput.value = ``;
            searchQuery = ``;
            switchView(`jobs`);
            buildCategoryFilters();
            applyFilters();
            toast(`Filtered by: ${t}`, `info`, `🏷`);
          }
        };
        tag.addEventListener(`click`, handler);
        tag.addEventListener(`keydown`, e => { if (e.key === `Enter` || e.key === ` `) { e.preventDefault(); handler(); } });
      });
    }

    // ─── Stats & badges ───────────────────────────────────────────────────────────
    function updateStats() {
      statTotal.textContent = allJobs.length || `—`;
      statShowing.textContent = filteredJobs.length || `0`;
      statSaved.textContent = savedJobs.size;
      const lastFetch = load(STORAGE_KEYS.lastFetch, 0);
      if (lastFetch) {
        statUpdated.textContent = new Date(lastFetch).toLocaleTimeString([], { hour: `2-digit`, minute: `2-digit` });
      }
      updateBadges();
    }

    function updateBadges() {
      const n = savedJobs.size;
      savedBadge.textContent = n;
      savedBadge.style.display = n > 0 ? `` : `none`;
      statSaved.textContent = n;
    }

    // ─── Profiles ─────────────────────────────────────────────────────────────────
    function renderProfiles() {
      profileBar.innerHTML = ``;
      profiles.forEach(p => {
        const chip = document.createElement(`button`);
        chip.className = `profile-chip${p.id === activeProfile ? ` active` : ``}`;
        chip.textContent = p.name;
        chip.setAttribute(`aria-pressed`, (p.id === activeProfile).toString());
        chip.setAttribute(`aria-label`, `Filter profile: ${p.name}`);
        chip.addEventListener(`click`, () => {
          activeProfile = p.id;
          renderProfiles();
          applyFilters();
          toast(`Profile: ${p.name}`, `info`);
        });
        profileBar.appendChild(chip);
      });

      const addBtn = document.createElement(`button`);
      addBtn.className = `add-profile-btn`;
      addBtn.textContent = `+ New profile`;
      addBtn.setAttribute(`aria-label`, `Add new filter profile`);
      addBtn.addEventListener(`click`, addProfile);
      profileBar.appendChild(addBtn);
    }

    function addProfile() {
      const name = prompt(`Profile name (e.g. "FinTech", "AI/ML"):`);
      if (!name || !name.trim()) return;
      const tagsStr = prompt(`Comma-separated keywords to filter by (e.g. "fintech,finance,banking"):`);
      const tags = tagsStr ? tagsStr.split(`,`).map(t => t.trim()).filter(Boolean) : [];
      const id = `custom_${Date.now()}`;
      profiles.push({ id, name: name.trim(), tags });
      persistProfiles();
      activeProfile = id;
      renderProfiles();
      applyFilters();
      toast(`Profile "${name.trim()}" created!`, `success`);
    }

    // ─── View switching ───────────────────────────────────────────────────────────
    function switchView(view) {
      currentView = view;
      const views = { jobs: `jobs-view`, saved: `saved-view`, tracker: `tracker-view` };
      Object.entries(views).forEach(([k, id]) => {
        const el = document.getElementById(id);
        if (el) {
          el.hidden = k !== view;
          if (el.classList.contains(`saved-view`) || el.classList.contains(`tracker-view`)) {
            if (k === view) el.classList.add(`active`);
            else el.classList.remove(`active`);
          }
        }
      });

      document.querySelectorAll(`.tab-btn`).forEach(btn => {
        const active = btn.dataset.view === view;
        btn.classList.toggle(`active`, active);
        btn.setAttribute(`aria-selected`, active.toString());
      });

      if (view === `saved`) renderSaved();
      if (view === `tracker`) renderTracker();
    }

    // ─── Filters ──────────────────────────────────────────────────────────────────
    function clearFilters() {
      activeCategories.clear();
      activeJobTypes.clear();
      remoteOnly = false;
      searchQuery = ``;
      searchInput.value = ``;
      activeProfile = `all`;
      remoteSwitch.classList.remove(`on`);
      remoteToggle.setAttribute(`aria-checked`, `false`);
      buildCategoryFilters();
      buildJobTypeFilters();
      renderProfiles();
      applyFilters();
      toast(`Filters cleared`, `info`);
    }

    // ─── Export CSV ───────────────────────────────────────────────────────────────
    function exportTrackerCSV() {
      const rows = [
        [`Title`, `Company`, `Location`, `Status`, `URL`],
        ...Object.entries(tracker).map(([slug, status]) => {
          const job = allJobs.find(j => j.slug === slug);
          if (!job) return null;
          return [job.title, job.company, job.location, STATUS_LABELS[status] || status, job.url];
        }).filter(Boolean),
      ];

      if (rows.length <= 1) {
        toast(`No tracked jobs to export`, `warning`);
        return;
      }

      const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, `""`)}"`).join(`,`)).join(`\n`);
      const blob = new Blob([csv], { type: `text/csv` });
      const url = URL.createObjectURL(blob);
      const a = document.createElement(`a`);
      a.href = url;
      a.download = `remote-jobs-tracker.csv`;
      a.click();
      URL.revokeObjectURL(url);
      toast(`CSV exported!`, `success`);
    }

    // ─── Event listeners ──────────────────────────────────────────────────────────
    searchInput.addEventListener(`input`, () => {
      searchQuery = searchInput.value;
      applyFilters();
    });

    sortSelect.addEventListener(`change`, () => {
      sortBy = sortSelect.value;
      applyFilters();
    });

    refreshBtn.addEventListener(`click`, () => fetchJobs(true));
    exportBtn.addEventListener(`click`, exportTrackerCSV);
    exportTrackerBtn.addEventListener(`click`, exportTrackerCSV);
    clearFiltersBtn.addEventListener(`click`, clearFilters);

    document.querySelectorAll(`.tab-btn`).forEach(btn => {
      btn.addEventListener(`click`, () => switchView(btn.dataset.view));
      btn.addEventListener(`keydown`, e => {
        if (e.key === `Enter` || e.key === ` `) { e.preventDefault(); switchView(btn.dataset.view); }
      });
    });

    remoteToggle.addEventListener(`click`, () => {
      remoteOnly = !remoteOnly;
      remoteSwitch.classList.toggle(`on`, remoteOnly);
      remoteToggle.setAttribute(`aria-checked`, remoteOnly.toString());
      applyFilters();
    });

    remoteToggle.addEventListener(`keydown`, e => {
      if (e.key === `Enter` || e.key === ` `) { e.preventDefault(); remoteToggle.click(); }
    });

    // Keyboard nav for tabs
    document.querySelectorAll(`.tab-btn`).forEach((btn, i, arr) => {
      btn.addEventListener(`keydown`, e => {
        if (e.key === `ArrowRight`) { e.preventDefault(); arr[(i + 1) % arr.length].focus(); }
        if (e.key === `ArrowLeft`) { e.preventDefault(); arr[(i - 1 + arr.length) % arr.length].focus(); }
      });
    });

    // ─── Init ─────────────────────────────────────────────────────────────────────
    function init() {
      loadState();
      updateBadges();
      renderProfiles();
      fetchJobs();
    }

    init();
  </script>
</body>
</html>
