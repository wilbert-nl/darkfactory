<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CargoCarbon — Carbon Footprint Estimator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Workbench · theme: Garden · nav: N9 */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { height: 100%; overflow-x: clip; }

body {
  height: 100%;
  overflow: hidden;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

/* ── N9 Nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 52px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}

.nav-logo {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.nav-logo-icon {
  width: 28px;
  height: 28px;
  background: var(--color-accent);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
}
.nav-logo span { color: var(--color-accent); }

.nav-sep {
  width: 1px;
  height: 16px;
  background: var(--color-border);
  flex-shrink: 0;
}

.nav-page-label {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
  white-space: nowrap;
}

.nav-back {
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
  transition: color 0.15s ease;
}
.nav-back:hover { color: var(--color-ink); }

/* ── App shell ── */
.app-shell {
  display: grid;
  grid-template-columns: 280px 1fr;
  margin-top: 52px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--color-border);
  background: var(--color-paper-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-head {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}

.sidebar-title {
  font-family: var(--font-display);
  font-size: var(--text-base);
  font-weight: 500;
  color: var(--color-ink);
  letter-spacing: -0.01em;
  margin-bottom: var(--space-1);
}

.sidebar-subtitle {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}

.history-list {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-2) 0;
}

.history-empty {
  padding: var(--space-8) var(--space-4);
  text-align: center;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  line-height: 1.7;
}

.history-item {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.history-item:hover { background: oklch(90% 0.018 95); }
.history-item.active {
  background: oklch(90% 0.018 95);
  border-left-color: var(--color-accent);
}

.history-mode-icon {
  font-size: 18px;
  flex-shrink: 0;
  margin-top: 1px;
}

.history-info { flex: 1; min-width: 0; }

.history-route {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.history-meta {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  margin-top: 2px;
}

.history-co2 {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-success);
  flex-shrink: 0;
  text-align: right;
  white-space: nowrap;
}

/* Monthly report section in sidebar */
.sidebar-report {
  border-top: 1px solid var(--color-border);
  padding: var(--space-4);
  flex-shrink: 0;
}

.report-title {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
  margin-bottom: var(--space-3);
}

.report-total {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 500;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  margin-bottom: var(--space-1);
}

.report-sub {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  margin-bottom: var(--space-3);
}

.report-bar-row {
  margin-bottom: var(--space-2);
}

.report-bar-label {
  display: flex;
  justify-content: space-between;
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  margin-bottom: var(--space-1);
}

.report-bar-track {
  height: 6px;
  background: var(--color-border);
  border-radius: 3px;
  overflow: hidden;
}

.report-bar-fill {
  height: 100%;
  background: var(--color-accent);
  border-radius: 3px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ── Main panel ── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-paper);
}

.main-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6) var(--space-8);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

/* ── Mode tabs ── */
.mode-tabs {
  display: flex;
  gap: 2px;
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 3px;
  width: fit-content;
}

.mode-tab {
  padding: var(--space-2) var(--space-5);
  border-radius: calc(var(--radius-md) - 2px);
  border: none;
  background: transparent;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-ink-muted);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
  white-space: nowrap;
}
.mode-tab:hover { color: var(--color-ink); }
.mode-tab.active {
  background: var(--color-paper);
  color: var(--color-ink);
  font-weight: 600;
  box-shadow: 0 1px 4px oklch(18% 0.04 155 / 0.08);
}

/* ── Panel ── */
.calc-panel { display: none; flex-direction: column; gap: var(--space-6); }
.calc-panel.visible { display: flex; }

/* ── Section card ── */
.card {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
}

.card-header {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-4);
}

.card-icon {
  font-size: 18px;
}

.card-title {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
}

/* ── Form grid ── */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
}

.form-grid.three-col {
  grid-template-columns: 1fr 1fr 1fr;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.form-group.span-2 {
  grid-column: span 2;
}

.field-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
}

.input-sm, .select-sm {
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  width: 100%;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  appearance: none;
}
.input-sm:focus, .select-sm:focus {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px oklch(52% 0.14 155 / 0.10);
}
.input-sm::placeholder { color: var(--color-ink-muted); opacity: 0.6; }
.input-sm[type="number"] { font-variant-numeric: tabular-nums; }

.select-wrap {
  position: relative;
}
.select-wrap::after {
  content: '▾';
  position: absolute;
  right: var(--space-3);
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}

/* Toggle row */
.toggle-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.toggle-label {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
}

.toggle {
  position: relative;
  width: 36px;
  height: 20px;
  flex-shrink: 0;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute;
  inset: 0;
  background: var(--color-border);
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s ease;
}
.toggle input:checked + .toggle-track { background: var(--color-accent); }
.toggle-track::before {
  content: '';
  position: absolute;
  width: 14px;
  height: 14px;
  left: 3px;
  top: 3px;
  background: white;
  border-radius: 50%;
  transition: transform 0.2s ease;
}
.toggle input:checked + .toggle-track::before { transform: translateX(16px); }

/* Weight input with unit selector */
.weight-row {
  display: flex;
  gap: var(--space-2);
}
.weight-row .input-sm { flex: 1; }
.weight-row .select-sm { width: 80px; flex-shrink: 0; }

/* Geocode status */
.geo-status {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  margin-top: var(--space-1);
  min-height: 16px;
  transition: color 0.2s ease;
}
.geo-status.ok { color: var(--color-success); }
.geo-status.err { color: var(--color-danger); }
.geo-status.loading { color: var(--color-warn); }

/* ── Action bar ── */
.action-bar {
  display: flex;
  gap: var(--space-3);
  align-items: center;
  flex-wrap: wrap;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-6);
  background: var(--color-accent);
  color: oklch(97% 0.008 95);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px oklch(52% 0.14 155 / 0.28); }
.btn-primary:active { transform: translateY(0); box-shadow: none; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  background: transparent;
  color: var(--color-ink-muted);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
}
.btn-ghost:hover { color: var(--color-ink); border-color: var(--color-accent-line); background: var(--color-accent-subtle); }

/* ── Results ── */
.result-area {
  display: none;
  flex-direction: column;
  gap: var(--space-5);
  animation: fade-up 0.3s ease both;
}
.result-area.visible { display: flex; }

@keyframes fade-up {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.result-hero {
  background: oklch(93% 0.025 155);
  border: 1px solid var(--color-accent-line);
  border-radius: var(--radius-lg);
  padding: var(--space-8);
  text-align: center;
}

.result-value {
  font-family: var(--font-display);
  font-size: var(--text-4xl);
  font-weight: 500;
  color: var(--color-accent);
  letter-spacing: -0.03em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.result-unit {
  font-size: var(--text-base);
  font-weight: 400;
  color: var(--color-ink-muted);
}

.result-meta {
  margin-top: var(--space-3);
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
}

.result-route {
  margin-top: var(--space-2);
  font-size: var(--text-sm);
  color: var(--color-ink);
  font-weight: 500;
}

/* Breakdown bar */
.breakdown-bar {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-4);
  background: var(--color-paper-2);
  border-radius: var(--radius-md);
  flex-wrap: wrap;
  gap: var(--space-2);
}

.breakdown-part {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-sm);
}

.breakdown-val {
  font-weight: 600;
  color: var(--color-ink);
  font-variant-numeric: tabular-nums;
}

.breakdown-label {
  color: var(--color-ink-muted);
  font-size: var(--text-xs);
}

.breakdown-op {
  color: var(--color-ink-muted);
  font-size: var(--text-base);
}

/* Equivalencies */
.equiv-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-3);
}

.equiv-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
}

.equiv-icon { font-size: 22px; flex-shrink: 0; }

.equiv-body {}

.equiv-value {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 500;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.equiv-desc {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  margin-top: 2px;
  line-height: 1.4;
}

/* Save button area */
.result-actions {
  display: flex;
  gap: var(--space-3);
  flex-wrap: wrap;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 600;
  background: var(--color-ink);
  color: var(--color-paper);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px oklch(18% 0.04 155 / 0.2);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--color-success); }
.toast.error   { background: var(--color-danger); }

/* ── Loading spinner ── */
@keyframes spin {
  to { transform: rotate(360deg); }
}
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid oklch(97% 0.008 95 / 0.4);
  border-top-color: oklch(97% 0.008 95);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

/* ── Mobile ── */
@media (max-width: 768px) {
  html, body { overflow: auto; height: auto; }

  .app-shell {
    grid-template-columns: 1fr;
    height: auto;
    overflow: visible;
  }

  .sidebar {
    border-right: none;
    border-bottom: 1px solid var(--color-border);
    max-height: 280px;
  }

  .main { overflow: visible; }

  .main-scroll {
    overflow: visible;
    padding: var(--space-4);
  }

  .form-grid { grid-template-columns: 1fr; }
  .form-grid.three-col { grid-template-columns: 1fr; }
  .form-group.span-2 { grid-column: span 1; }
  .equiv-grid { grid-template-columns: 1fr; }

  .nav-page-label { display: none; }
  .nav-sep { display: none; }
}

@media (max-width: 414px) {
  .result-value { font-size: var(--text-3xl); }
  .nav { padding: 0 var(--space-4); }
}

@media (prefers-reduced-motion: reduce) {
  .result-area { animation: none; }
  .btn-primary:hover { transform: none; box-shadow: none; }
  .toast { transition: opacity 0.15s ease; transform: none; }
}
</style>
</head>
<body>

<!-- N9 Nav -->
<nav class="nav" aria-label="Application navigation">
  <div class="nav-logo">
    <div class="nav-logo-icon" aria-hidden="true">🌿</div>
    CargoCarbon<span>.</span>
  </div>
  <span class="nav-sep" aria-hidden="true"></span>
  <span class="nav-page-label">CO₂e Estimator</span>
  <a href="index.html" class="nav-back" aria-label="Back to home page">← Home</a>
</nav>

<div class="app-shell">

  <!-- Sidebar: History + Monthly Report -->
  <aside class="sidebar" aria-label="Estimate history">

    <div class="sidebar-head">
      <div class="sidebar-title">Saved Estimates</div>
      <div class="sidebar-subtitle">Click to reload any estimate</div>
    </div>

    <div class="history-list" id="history-list" role="list" aria-label="Saved carbon estimates">
      <!-- populated by JS -->
    </div>

    <!-- Monthly report (shown when ≥3 estimates) -->
    <div class="sidebar-report" id="sidebar-report" style="display:none;" aria-label="Monthly emissions summary">
      <div class="report-title">Monthly Summary</div>
      <div class="report-total" id="report-total">—</div>
      <div class="report-sub" id="report-sub">total CO₂e from all history</div>
      <div id="report-bars"><!-- mode bars injected --></div>
    </div>

  </aside>

  <!-- Main panel -->
  <main class="main" aria-label="Carbon footprint calculator">
    <div class="main-scroll">

      <!-- Mode tabs -->
      <div class="mode-tabs" role="tablist" aria-label="Calculation mode">
        <button class="mode-tab active" role="tab" id="tab-freight" aria-selected="true" aria-controls="panel-freight" onclick="switchMode('freight', this)">🚛 Freight Shipment</button>
        <button class="mode-tab" role="tab" id="tab-travel" aria-selected="false" aria-controls="panel-travel" onclick="switchMode('travel', this)">🧳 Personal Travel</button>
      </div>

      <!-- ══ FREIGHT PANEL ══ -->
      <div class="calc-panel visible" id="panel-freight" role="tabpanel" aria-labelledby="tab-freight">

        <!-- Route -->
        <div class="card">
          <div class="card-header">
            <span class="card-icon" aria-hidden="true">📍</span>
            <span class="card-title">Route</span>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label class="field-label" for="f-origin">Origin city</label>
              <input type="text" class="input-sm" id="f-origin" placeholder="e.g. Rotterdam" autocomplete="off" aria-describedby="f-origin-status">
              <div class="geo-status" id="f-origin-status" aria-live="polite"></div>
            </div>
            <div class="form-group">
              <label class="field-label" for="f-dest">Destination city</label>
              <input type="text" class="input-sm" id="f-dest" placeholder="e.g. Berlin" autocomplete="off" aria-describedby="f-dest-status">
              <div class="geo-status" id="f-dest-status" aria-live="polite"></div>
            </div>
          </div>
        </div>

        <!-- Shipment details -->
        <div class="card">
          <div class="card-header">
            <span class="card-icon" aria-hidden="true">📦</span>
            <span class="card-title">Shipment Details</span>
          </div>

          <div class="form-grid" style="margin-bottom: var(--space-4);">
            <div class="form-group">
              <label class="field-label" for="f-mode">Transport mode</label>
              <div class="select-wrap">
                <select class="select-sm" id="f-mode" onchange="onFreightModeChange()" aria-label="Transport mode">
                  <option value="truck">🚛 Truck (HGV)</option>
                  <option value="van">🚐 Van / LCV</option>
                  <option value="air">✈️ Air Freight</option>
                  <option value="sea">🚢 Sea Freight</option>
                  <option value="rail">🚆 Rail</option>
                </select>
              </div>
            </div>
            <div class="form-group" id="f-subtype-group">
              <label class="field-label" for="f-subtype" id="f-subtype-label">Truck size</label>
              <div class="select-wrap">
                <select class="select-sm" id="f-subtype" aria-labelledby="f-subtype-label">

<div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

<script>
'use strict';

// ── DEFRA 2023 Emission Factors ──────────────────────────────────────────────
// Freight: kg CO2e per tonne-km
const EF_FREIGHT = {
  truck: {
    small:   { label: 'Small HGV',        ef: 0.197 },
    medium:  { label: 'Medium HGV',       ef: 0.120 },
    large:   { label: 'Large articulated',ef: 0.081 },
    average: { label: 'Average HGV',      ef: 0.107 },
  },
  van: {
    small:   { label: 'Small van',        ef: 0.333 },
    medium:  { label: 'Medium van',       ef: 0.242 },
  },
  air: {
    short_haul: { label: 'Short haul (<3,700 km)', ef: 1.200 },
    long_haul:  { label: 'Long haul (>3,700 km)',  ef: 0.600 },
  },
  sea: {
    container: { label: 'Container ship', ef: 0.016 },
    bulk:      { label: 'Bulk carrier',   ef: 0.012 },
  },
  rail: {
    diesel:   { label: 'Diesel rail',    ef: 0.028 },
    electric: { label: 'Electric rail',  ef: 0.009 },
  },
};

// Personal travel: kg CO2e per passenger-km
const EF_TRAVEL = {
  car: {
    petrol:   { label: 'Petrol',         ef: 0.170 },
    diesel:   { label: 'Diesel',         ef: 0.163 },
    hybrid:   { label: 'Hybrid',         ef: 0.120 },
    electric: { label: 'Electric (EV)',  ef: 0.047 },
  },
  bus:   { average: { label: 'Average bus', ef: 0.089 } },
  train: { average: { label: 'Average train', ef: 0.041 } },
  flight: {
    domestic:   { label: 'Domestic (<500 km)',    ef: 0.246 },
    short_haul: { label: 'Short haul (<3,700 km)',ef: 0.153 },
    long_haul:  { label: 'Long haul (>3,700 km)', ef: 0.195 },
  },
};

// Mode icons
const MODE_ICONS = {
  truck: '🚛', van: '🚐', air: '✈️', sea: '🚢', rail: '🚆',
  car: '🚗', bus: '🚌', train: '🚆', flight: '✈️',
};

// ── Haversine distance formula ────────────────────────────────────────────────
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ── Nominatim geocoding ───────────────────────────────────────────────────────
const geoCache = {};
async function geocode(query) {
  const key = query.trim().toLowerCase();
  if (geoCache[key]) return geoCache[key];
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`;
  const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
  if (!res.ok) throw new Error('Geocoding failed');
  const data = await res.json();
  if (!data.length) throw new Error(`"${query}" not found`);
  const result = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), name: data[0].display_name.split(',')[0] };
  geoCache[key] = result;
  return result;
}

// ── Format helpers ────────────────────────────────────────────────────────────
function fmtCO2(kg) {
  if (kg >= 1000) return (kg / 1000).toFixed(2) + ' t CO₂e';
  if (kg >= 10) return kg.toFixed(1) + ' kg CO₂e';
  return kg.toFixed(2) + ' kg CO₂e';
}

function fmtNum(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return n.toFixed(n >= 10 ? 0 : 1);
}

function fmtDate(ts) {
  return new Date(ts).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}

const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3200);
}

// ── Storage ───────────────────────────────────────────────────────────────────
const STORE_KEY = 'cargocarbon_estimates_v1';

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }
  catch { return []; }
}

function saveHistory(list) {
  localStorage.setItem(STORE_KEY, JSON.stringify(list));
}

let history = loadHistory();

// ── Mode switching ────────────────────────────────────────────────────────────
function switchMode(mode, btn) {
  document.querySelectorAll('.mode-tab').forEach(t => {
    t.classList.remove('active');
    t.setAttribute('aria-selected', 'false');
  });
  document.querySelectorAll('.calc-panel').forEach(p => p.classList.remove('visible'));
  btn.classList.add('active');
  btn.setAttribute('aria-selected', 'true');
  document.getElementById('panel-' + mode).classList.add('visible');
}

// ── Freight sub-type options ──────────────────────────────────────────────────
const FREIGHT_SUBTYPES = {
  truck: { label: 'Truck size', options: EF_FREIGHT.truck },
  van:   { label: 'Van size',   options: EF_FREIGHT.van   },
  air:   { label: 'Haul type',  options: EF_FREIGHT.air   },
  sea:   { label: 'Vessel type',options: EF_FREIGHT.sea   },
  rail:  { label: 'Rail type',  options: EF_FREIGHT.rail  },
};

function onFreightModeChange() {
  const mode = document.getElementById('f-mode').value;
  const cfg  = FREIGHT_SUBTYPES[mode];
  document.getElementById('f-subtype-label').textContent = cfg.label;
  const sel = document.getElementById('f-subtype');
  sel.innerHTML = Object.entries(cfg.options).map(([k, v]) =>
    `<option value="${k}">${esc(v.label)}</option>`
  ).join('');
  document.getElementById('f-result').classList.remove('visible');
  document.getElementById('f-result').innerHTML = '';
}

// ── Travel sub-type options ───────────────────────────────────────────────────
const TRAVEL_SUBTYPES = {
  car:    { label: 'Fuel type',    options: EF_TRAVEL.car,    hasPassengers: true  },
  bus:    { label: 'Type',         options: EF_TRAVEL.bus,    hasPassengers: false },
  train:  { label: 'Type',         options: EF_TRAVEL.train,  hasPassengers: false },
  flight: { label: 'Haul type',    options: EF_TRAVEL.flight, hasPassengers: false },
};

function onTravelModeChange() {
  const mode = document.getElementById('t-mode').value;
  const cfg  = TRAVEL_SUBTYPES[mode];
  document.getElementById('t-subtype-label').textContent = cfg.label;
  const sel = document.getElementById('t-subtype');
  sel.innerHTML = Object.entries(cfg.options).map(([k, v]) =>
    `<option value="${k}">${esc(v.label)}</option>`
  ).join('');
  document.getElementById('t-passengers-group').style.display = cfg.hasPassengers ? '' : 'none';
  document.getElementById('t-result').classList.remove('visible');
  document.getElementById('t-result').innerHTML = '';
}

// ── Geocode status helper ─────────────────────────────────────────────────────
function setGeoStatus(id, state, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'geo-status ' + state;
  el.textContent = msg;
}

// ── Geocode both cities and return distance ───────────────────────────────────
async function resolveRoute(originInput, destInput, originStatusId, destStatusId) {
  setGeoStatus(originStatusId, 'loading', 'Locating…');
  setGeoStatus(destStatusId,   'loading', 'Locating…');

  const [originGeo, destGeo] = await Promise.all([
    geocode(originInput),
    geocode(destInput),
  ]);

  setGeoStatus(originStatusId, 'ok', '✓ ' + originGeo.name);
  setGeoStatus(destStatusId,   'ok', '✓ ' + destGeo.name);

  const gcDist = haversineKm(originGeo.lat, originGeo.lon, destGeo.lat, destGeo.lon);
  return { originGeo, destGeo, gcDist };
}

// ── Equivalencies panel ───────────────────────────────────────────────────────
function buildEquivHTML(co2Kg) {
  const trees  = co2Kg / 21;
  const carKm  = co2Kg / 0.170;
  const phones = co2Kg / 0.009;
  const lhrJfk = (co2Kg / 990) * 100;

  return `
    <div class="equiv-grid">
      <div class="equiv-card">
        <span class="equiv-icon" aria-hidden="true">🌳</span>
        <div class="equiv-body">
          <div class="equiv-value">${fmtNum(trees)} trees</div>
          <div class="equiv-desc">needed to absorb this CO₂ over one year</div>
        </div>
      </div>
      <div class="equiv-card">
        <span class="equiv-icon" aria-hidden="true">🚗</span>
        <div class="equiv-body">
          <div class="equiv-value">${fmtNum(carKm)} km</div>
          <div class="equiv-desc">driven by a petrol car</div>
        </div>
      </div>
      <div class="equiv-card">
        <span class="equiv-icon" aria-hidden="true">📱</span>
        <div class="equiv-body">
          <div class="equiv-value">${fmtNum(phones)}</div>
          <div class="equiv-desc">smartphone charges</div>
        </div>
      </div>
      <div class="equiv-card">
        <span class="equiv-icon" aria-hidden="true">✈️</span>
        <div class="equiv-body">
          <div class="equiv-value">${lhrJfk.toFixed(1)}%</div>
          <div class="equiv-desc">of a London–New York economy flight</div>
        </div>
      </div>
    </div>
  `;
}

// ── Freight calculation ───────────────────────────────────────────────────────
async function calcFreight() {
  const originVal = document.getElementById('f-origin').value.trim();
  const destVal   = document.getElementById('f-dest').value.trim();
  const weightRaw = parseFloat(document.getElementById('f-weight').value);
  const weightUnit = document.getElementById('f-weight-unit').value;
  const mode      = document.getElementById('f-mode').value;
  const subtype   = document.getElementById('f-subtype').value;

  if (!originVal)  { showToast('Please enter an origin city.', 'error'); return; }
  if (!destVal)    { showToast('Please enter a destination city.', 'error'); return; }
  if (!weightRaw || weightRaw <= 0) { showToast('Please enter a valid cargo weight.', 'error'); return; }

  // Weight in tonnes
  const weightT = weightUnit === 'kg' ? weightRaw / 1000 : weightRaw;

  const btn  = document.getElementById('f-calc-btn');
  const icon = document.getElementById('f-calc-icon');
  btn.disabled = true;
  icon.className = 'spinner';

  try {
    const { originGeo, destGeo, gcDist } = await resolveRoute(
      originVal, destVal, 'f-origin-status', 'f-dest-status'
    );

    // Road distance = great-circle × 1.35 for truck/van
    let distKm;
    if (mode === 'air') {
      distKm = gcDist; // air = straight line
    } else if (mode === 'sea') {
      distKm = gcDist * 1.25; // sea lanes slightly longer
    } else {
      distKm = gcDist * 1.35; // road factor
    }

    const ef    = EF_FREIGHT[mode][subtype].ef;
    const co2Kg = distKm * weightT * ef;
    const modeLabel = EF_FREIGHT[mode][subtype].label;
    const modeIcon  = MODE_ICONS[mode];

    // Auto-select long vs short haul for air if user hasn't specified
    // (already handled by user select, but let's note the distance)
    const weightDisplay = weightUnit === 'kg'
      ? `${weightRaw} kg (${weightT.toFixed(3)} t)`
      : `${weightRaw} t`;

    renderFreightResult({
      co2Kg, distKm, gcDist, weightT, weightDisplay,
      mode, subtype, modeLabel, modeIcon, ef,
      origin: originGeo.name, dest: destGeo.name,
      originInput: originVal, destInput: destVal,
      originGeo, destGeo,
    });

  } catch (err) {
    const isOrigin = err.message && err.message.includes('"' + originVal + '"');
    setGeoStatus('f-origin-status', isOrigin ? 'err' : '', isOrigin ? 'Not found — try a larger city' : '');
    setGeoStatus('f-dest-status',   !isOrigin ? 'err' : '', !isOrigin ? 'Not found — try a larger city' : '');
    showToast(err.message || 'Geocoding failed. Try a different city name.', 'error');
  } finally {
    btn.disabled = false;
    icon.className = '';
    icon.textContent = '⚡';
  }
}

function renderFreightResult(d) {
  const area = document.getElementById('f-result');

  // Large value display
  const co2Display = d.co2Kg >= 1000
    ? `<span class="result-value">${(d.co2Kg / 1000).toFixed(2)}<span class="result-unit"> t CO₂e</span></span>`
    : `<span class="result-value">${d.co2Kg.toFixed(1)}<span class="result-unit"> kg CO₂e</span></span>`;

  area.innerHTML = `
    <div class="result-hero">
      ${co2Display}
      <div class="result-route">${d.modeIcon} ${esc(d.origin)} → ${esc(d.dest)}</div>
      <div class="result-meta">${d.modeLabel} · ${Math.round(d.distKm).toLocaleString()} km road distance · ${esc(d.weightDisplay)}</div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-icon" aria-hidden="true">📐</span>
        <span class="card-title">Calculation Breakdown</span>
      </div>
      <div class="breakdown-bar">
        <div class="breakdown-part">
          <div>
            <div class="breakdown-val">${Math.round(d.distKm).toLocaleString()} km</div>
            <div class="breakdown-label">route distance</div>
          </div>
        </div>
        <div class="breakdown-op">×</div>
        <div class="breakdown-part">
          <div>
            <div class="breakdown-val">${d.weightT.toFixed(3)} t</div>
            <div class="breakdown-label">cargo weight</div>
          </div>
        </div>
        <div class="breakdown-op">×</div>
        <div class="breakdown-part">
          <div>
            <div class="breakdown-val">${d.ef} kg</div>
            <div class="breakdown-label">CO₂e / t-km (DEFRA 2023)</div>
          </div>
        </div>
        <div class="breakdown-op">=</div>
        <div class="breakdown-part">
          <div>
            <div class="breakdown-val" style="color: var(--color-accent);">${fmtCO2(d.co2Kg)}</div>
            <div class="breakdown-label">total CO₂e</div>
          </div>
        </div>
      </div>
      <div style="margin-top: var(--space-3); font-size: var(--text-xs); color: var(--color-ink-muted);">
        Great-circle distance: ${Math.round(d.gcDist).toLocaleString()} km · Road factor applied: ×${d.mode === 'air' ? '1.00' : d.mode === 'sea' ? '1.25' : '1.35'}
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-icon" aria-hidden="true">⚖️</span>
        <span class="card-title">Equivalencies</span>
      </div>
      ${buildEquivHTML(d.co2Kg)}
    </div>

    <div class="result-actions">
      <button class="btn-primary" onclick="saveEstimate(${JSON.stringify(JSON.stringify({
        type: 'freight', mode: d.mode, subtype: d.subtype,
        modeLabel: d.modeLabel, modeIcon: d.modeIcon,
        origin: d.originInput, dest: d.destInput,
        originName: d.origin, destName: d.dest,
        originGeo: d.originGeo, destGeo: d.destGeo,
        distKm: Math.round(d.distKm), gcDist: Math.round(d.gcDist),
        weightT: d.weightT, ef: d.ef,
        co2Kg: Math.round(d.co2Kg * 100) / 100, ts: Date.now()
      }))})">💾 Save Estimate</button>
      <button class="btn-ghost" onclick="resetFreight()">New Calculation</button>
    </div>
  `;

  area.classList.add('visible');
  area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function resetFreight() {
  document.getElementById('f-origin').value = '';
  document.getElementById('f-dest').value   = '';
  document.getElementById('f-weight').value = '';
  setGeoStatus('f-origin-status', '', '');
  setGeoStatus('f-dest-status',   '', '');
  const area = document.getElementById('f-result');
  area.classList.remove('visible');
  area.innerHTML = '';
}

// ── Travel calculation ────────────────────────────────────────────────────────
async function calcTravel() {
  const originVal  = document.getElementById('t-origin').value.trim();
  const destVal    = document.getElementById('t-dest').value.trim();
  const manualDist = parseFloat(document.getElementById('t-distance').value);
  const mode       = document.getElementById('t-mode').value;
  const subtype    = document.getElementById('t-subtype').value;
  const passengers = parseInt(document.getElementById('t-passengers').value) || 1;
  const isReturn   = document.getElementById('t-return').checked;

  // Need either cities or manual distance
  const hasManualDist = manualDist > 0;
  const hasCities = originVal && destVal;

  if (!hasCities && !hasManualDist) {
    showToast('Enter origin and destination cities, or a distance in km.', 'error');
    return;
  }

  const btn  = document.getElementById('t-calc-btn');
  const icon = document.getElementById('t-calc-icon');
  btn.disabled = true;
  icon.className = 'spinner';

  try {
    let distKm, originName, destName, originGeo, destGeo, gcDist;

    if (hasManualDist) {
      distKm = manualDist;
      originName = originVal || 'Origin';
      destName   = destVal   || 'Destination';
      gcDist = distKm;
    } else {
      const route = await resolveRoute(originVal, destVal, 't-origin-status', 't-dest-status');
      originGeo = route.originGeo;
      destGeo   = route.destGeo;
      gcDist    = route.gcDist;
      originName = originGeo.name;
      destName   = destGeo.name;

      // For travel, use gc distance directly for flights, 1.2× for ground
      distKm = (mode === 'flight') ? gcDist : gcDist * 1.20;
    }

    if (isReturn) distKm *= 2;

    const efEntry = EF_TRAVEL[mode][subtype];
    let ef = efEntry.ef;

    // For car, divide by passengers (shared emissions)
    const paxDivisor = (mode === 'car') ? Math.max(1, passengers) : 1;
    const co2Kg = (distKm * ef) / paxDivisor;

    const modeIcon  = MODE_ICONS[mode];
    const modeLabel = efEntry.label;

    renderTravelResult({
      co2Kg, distKm, gcDist: gcDist || distKm, ef,
      mode, subtype, modeLabel, modeIcon,
      origin: originName, dest: destName,
      originInput: originVal, destInput: destVal,
      originGeo, destGeo,
      passengers: paxDivisor, isReturn,
    });

  } catch (err) {
    if (originVal && err.message && err.message.includes('"' + originVal + '"')) {
      setGeoStatus('t-origin-status', 'err', 'Not found');
    } else if (destVal) {
      setGeoStatus('t-dest-status', 'err', 'Not found');
    }
    showToast(err.message || 'Geocoding failed. Try a different city name.', 'error');
  } finally {
    btn.disabled = false;
    icon.className = '';
    icon.textContent = '⚡';
  }
}

function renderTravelResult(d) {
  const area = document.getElementById('t-result');

  const co2Display = d.co2Kg >= 1000
    ? `<span class="result-value">${(d.co2Kg / 1000).toFixed(2)}<span class="result-unit"> t CO₂e</span></span>`
    : `<span class="result-value">${d.co2Kg.toFixed(1)}<span class="result-unit"> kg CO₂e</span></span>`;

  const tripNote = d.isReturn ? 'return trip' : 'one-way';
  const paxNote  = d.mode === 'car' && d.passengers > 1 ? ` · shared by ${d.passengers} passengers` : '';

  area.innerHTML = `
    <div class="result-hero">
      ${co2Display}
      <div class="result-route">${d.modeIcon} ${esc(d.origin)} → ${esc(d.dest)}</div>
      <div class="result-meta">${esc(d.modeLabel)} · ${Math.round(d.distKm).toLocaleString()} km · ${tripNote}${paxNote}</div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-icon" aria-hidden="true">📐</span>
        <span class="card-title">Calculation Breakdown</span>
      </div>
      <div class="breakdown-bar">
        <div class="breakdown-part">
          <div>
            <div class="breakdown-val">${Math.round(d.distKm).toLocaleString()} km</div>
            <div class="breakdown-label">${d.isReturn ? 'total (return)' : 'one-way distance'}</div>
          </div>
        </div>
        <div class="breakdown-op">×</div>
        <div class="breakdown-part">
          <div>
            <div class="breakdown-val">${d.ef} kg</div>
            <div class="breakdown-label">CO₂e / pax-km (DEFRA 2023)</div>
          </div>
        </div>
        ${d.mode === 'car' && d.passengers > 1 ? `
        <div class="breakdown-op">÷</div>
        <div class="breakdown-part">
          <div>
            <div class="breakdown-val">${d.passengers}</div>
            <div class="breakdown-label">passengers</div>
          </div>
        </div>` : ''}
        <div class="breakdown-op">=</div>
        <div class="breakdown-part">
          <div>
            <div class="breakdown-val" style="color: var(--color-accent);">${fmtCO2(d.co2Kg)}</div>
            <div class="breakdown-label">per person</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-icon" aria-hidden="true">⚖️</span>
        <span class="card-title">Equivalencies</span>
      </div>
      ${buildEquivHTML(d.co2Kg)}
    </div>

    <div class="result-actions">
      <button class="btn-primary" onclick="saveEstimate(${JSON.stringify(JSON.stringify({
        type: 'travel', mode: d.mode, subtype: d.subtype,
        modeLabel: d.modeLabel, modeIcon: d.modeIcon,
        origin: d.originInput, dest: d.destInput,
        originName: d.origin, destName: d.dest,
        originGeo: d.originGeo, destGeo: d.destGeo,
        distKm: Math.round(d.distKm), gcDist: Math.round(d.gcDist),
        passengers: d.passengers, isReturn: d.isReturn, ef: d.ef,
        co2Kg: Math.round(d.co2Kg * 100) / 100, ts: Date.now()
      }))})">💾 Save Estimate</button>
      <button class="btn-ghost" onclick="resetTravel()">New Calculation</button>
    </div>
  `;

  area.classList.add('visible');
  area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function resetTravel() {
  document.getElementById('t-origin').value   = '';
  document.getElementById('t-dest').value     = '';
  document.getElementById('t-distance').value = '';
  setGeoStatus('t-origin-status', '', '');
  setGeoStatus('t-dest-status',   '', '');
  const area = document.getElementById('t-result');
  area.classList.remove('visible');
  area.innerHTML = '';
}

// ── Save estimate to history ──────────────────────────────────────────────────
function saveEstimate(jsonStr) {
  const est = JSON.parse(jsonStr);
  history.unshift(est);
  if (history.length > 10) history = history.slice(0, 10);
  saveHistory(history);
  renderHistory();
  showToast('Estimate saved!', 'success');
}

// ── Render sidebar history ────────────────────────────────────────────────────
function renderHistory() {
  const list = document.getElementById('history-list');

  if (!history.length) {
    list.innerHTML = '<div class="history-empty">No estimates saved yet.<br>Calculate and save to build history.</div>';
    document.getElementById('sidebar-report').style.display = 'none';
    return;
  }

  list.innerHTML = history.map((est, i) => {
    const route = `${esc(est.originName || est.origin)} → ${esc(est.destName || est.dest)}`;
    const meta  = `${esc(est.modeLabel)} · ${fmtDate(est.ts)}`;
    const co2   = fmtCO2(est.co2Kg);
    return `
      <div class="history-item" role="listitem" tabindex="0"
        onclick="reloadEstimate(${i})" onkeydown="if(event.key==='Enter')reloadEstimate(${i})"
        aria-label="${route} — ${co2}">
        <span class="history-mode-icon" aria-hidden="true">${est.modeIcon}</span>
        <div class="history-info">
          <div class="history-route">${route}</div>
          <div class="history-meta">${meta}</div>
        </div>
        <div class="history-co2">${co2}</div>
      </div>
    `;
  }).join('');

  // Monthly report (show if ≥3 estimates)
  if (history.length >= 3) {
    renderSidebarReport();
  } else {
    document.getElementById('sidebar-report').style.display = 'none';
  }
}

// ── Sidebar monthly report ────────────────────────────────────────────────────
function renderSidebarReport() {
  const reportEl = document.getElementById('sidebar-report');
  reportEl.style.display = '';

  const totalKg = history.reduce((s, e) => s + e.co2Kg, 0);
  document.getElementById('report-total').textContent = fmtCO2(totalKg);
  document.getElementById('report-sub').textContent = `from ${history.length} saved estimates`;

  // Group by mode
  const byMode = {};
  history.forEach(e => {
    byMode[e.mode] = (byMode[e.mode] || 0) + e.co2Kg;
  });

  const sorted = Object.entries(byMode).sort((a, b) => b[1] - a[1]);
  const maxKg  = sorted[0]?.[1] || 1;

  document.getElementById('report-bars').innerHTML = sorted.map(([mode, kg]) => {
    const pct = ((kg / maxKg) * 100).toFixed(1);
    return `
      <div class="report-bar-row">
        <div class="report-bar-label">
          <span>${MODE_ICONS[mode] || '📦'} ${mode}</span>
          <span>${fmtCO2(kg)}</span>
        </div>
        <div class="report-bar-track">
          <div class="report-bar-fill" style="width: ${pct}%"></div>
        </div>
      </div>
    `;
  }).join('');
}

// ── Reload estimate from history ──────────────────────────────────────────────
function reloadEstimate(idx) {
  const est = history[idx];
  if (!est) return;

  if (est.type === 'freight') {
    switchMode('freight', document.getElementById('tab-freight'));
    document.getElementById('f-origin').value = est.origin;
    document.getElementById('f-dest').value   = est.dest;
    document.getElementById('f-mode').value   = est.mode;
    onFreightModeChange();
    document.getElementById('f-subtype').value = est.subtype;
    // Restore weight
    document.getElementById('f-weight').value = est.weightT;
    document.getElementById('f-weight-unit').value = 't';
    setGeoStatus('f-origin-status', 'ok', '✓ ' + (est.originName || est.origin));
    setGeoStatus('f-dest-status',   'ok', '✓ ' + (est.destName   || est.dest));

    // Render result directly from stored data
    renderFreightResult({
      co2Kg:      est.co2Kg,
      distKm:     est.distKm,
      gcDist:     est.gcDist,
      weightT:    est.weightT,
      weightDisplay: `${est.weightT} t`,
      mode:       est.mode,
      subtype:    est.subtype,
      modeLabel:  est.modeLabel,
      modeIcon:   est.modeIcon,
      ef:         est.ef,
      origin:     est.originName || est.origin,
      dest:       est.destName   || est.dest,
      originInput: est.origin,
      destInput:   est.dest,
      originGeo:  est.originGeo,
      destGeo:    est.destGeo,
    });

  } else {
    switchMode('travel', document.getElementById('tab-travel'));
    document.getElementById('t-origin').value = est.origin;
    document.getElementById('t-dest').value   = est.dest;
    document.getElementById('t-mode').value   = est.mode;
    onTravelModeChange();
    document.getElementById('t-subtype').value     = est.subtype;
    document.getElementById('t-passengers').value  = est.passengers || 1;
    document.getElementById('t-return').checked    = est.isReturn || false;
    setGeoStatus('t-origin-status', 'ok', '✓ ' + (est.originName || est.origin));
    setGeoStatus('t-dest-status',   'ok', '✓ ' + (est.destName   || est.dest));

    renderTravelResult({
      co2Kg:      est.co2Kg,
      distKm:     est.distKm,
      gcDist:     est.gcDist,
      ef:         est.ef,
      mode:       est.mode,
      subtype:    est.subtype,
      modeLabel:  est.modeLabel,
      modeIcon:   est.modeIcon,
      origin:     est.originName || est.origin,
      dest:       est.destName   || est.dest,
      originInput: est.origin,
      destInput:   est.dest,
      originGeo:  est.originGeo,
      destGeo:    est.destGeo,
      passengers:  est.passengers || 1,
      isReturn:    est.isReturn   || false,
    });
  }

  // Mark active in sidebar
  document.querySelectorAll('.history-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
}

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  // Populate freight subtypes
  onFreightModeChange();
  // Populate travel subtypes
  onTravelModeChange();
  // Render history
  renderHistory();
}

init();
</script>
</body>
</html>
