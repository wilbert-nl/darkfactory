<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random User Generator — App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Workbench · theme: Hum · nav: N9 */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow-x: clip; }
body {
  height: 100%;
  overflow: hidden;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ── N9 Nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 52px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.nav-logo-icon {
  width: 28px;
  height: 28px;
  background: var(--color-accent);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-paper);
  font-size: 15px;
  flex-shrink: 0;
}
.nav-logo span { color: var(--color-accent); }
.nav-sep {
  width: 1px;
  height: 16px;
  background: var(--color-border);
  flex-shrink: 0;
}
.nav-page-label {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
  white-space: nowrap;
}
.nav-back {
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
  transition: color 0.15s var(--ease-out);
}
.nav-back:hover { color: var(--color-ink); }

/* ── App shell (Workbench) ── */
.app-shell {
  display: grid;
  grid-template-columns: 280px 1fr;
  margin-top: 52px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--color-border);
  background: var(--color-paper-2);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
}

.sidebar-section {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-border);
}
.sidebar-section:last-child { border-bottom: none; }

.section-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--color-ink-muted);
  display: block;
  margin-bottom: var(--space-3);
}

/* Slider */
.slider-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.slider-val {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  color: var(--color-ink);
  min-width: 72px;
  white-space: nowrap;
}
input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  background: var(--color-border);
  outline: none;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--color-accent);
  cursor: pointer;
  border: 2px solid var(--color-paper);
  box-shadow: 0 1px 4px oklch(20% 0.012 250 / 0.20);
  transition: transform 0.15s var(--ease-out);
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--color-accent);
  border: 2px solid var(--color-paper);
  cursor: pointer;
}

/* Radio group */
.radio-group {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
}
.radio-pill {
  display: flex;
  align-items: center;
}
.radio-pill input[type="radio"] { display: none; }
.radio-pill label {
  display: inline-flex;
  align-items: center;
  padding: var(--space-1) var(--space-3);
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-ink-muted);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: 20px;
  cursor: pointer;
  transition: background 0.12s var(--ease-out), border-color 0.12s var(--ease-out), color 0.12s var(--ease-out);
  user-select: none;
}
.radio-pill input[type="radio"]:checked + label {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-paper);
}
.radio-pill label:hover { border-color: var(--color-accent-line); color: var(--color-ink); }

/* Nationality checkbox grid */
.nat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-2);
}
.nat-check {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  cursor: pointer;
  font-size: var(--text-sm);
  color: var(--color-ink);
  padding: var(--space-1) 0;
  user-select: none;
}
.nat-check input[type="checkbox"] {
  width: 14px;
  height: 14px;
  accent-color: var(--color-accent);
  flex-shrink: 0;
  cursor: pointer;
}
.nat-label { display: flex; align-items: center; gap: var(--space-1); }
.nat-code { font-size: var(--text-xs); color: var(--color-ink-muted); }

/* Seed input */
.input-text {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  transition: border-color 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out);
}
.input-text:focus {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px oklch(66% 0.18 235 / 0.10);
}
.input-text::placeholder { color: var(--color-ink-muted); }

/* Generate button */
.btn-generate {
  width: 100%;
  padding: var(--space-3) var(--space-4);
  background: var(--color-accent);
  color: var(--color-paper);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  transition: transform 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out);
}
.btn-generate:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px oklch(66% 0.18 235 / 0.28);
}
.btn-generate:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
.btn-generate:disabled { opacity: 0.55; cursor: not-allowed; }

/* Export section */
.export-format-row {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
  margin-bottom: var(--space-3);
}
.format-pill {
  display: flex;
  align-items: center;
}
.format-pill input[type="radio"] { display: none; }
.format-pill label {
  display: inline-flex;
  align-items: center;
  padding: var(--space-1) var(--space-3);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--color-ink-muted);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.12s var(--ease-out), border-color 0.12s var(--ease-out), color 0.12s var(--ease-out);
  user-select: none;
  font-family: var(--font-body);
}
.format-pill input[type="radio"]:checked + label {
  background: var(--color-accent-subtle);
  border-color: var(--color-accent-line);
  color: var(--color-accent);
}
.export-actions {
  display: flex;
  gap: var(--space-2);
}
.btn-export {
  flex: 1;
  padding: var(--space-2) var(--space-3);
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  transition: background 0.12s var(--ease-out), border-color 0.12s var(--ease-out), color 0.12s var(--ease-out);
}
.btn-copy-export {
  background: var(--color-paper);
  color: var(--color-ink);
  border: 1px solid var(--color-border);
}
.btn-copy-export:hover:not(:disabled) { border-color: var(--color-accent-line); color: var(--color-accent); }
.btn-download-export {
  background: var(--color-accent);
  color: var(--color-paper);
  border: 1px solid var(--color-accent);
}
.btn-download-export:hover:not(:disabled) { opacity: 0.85; }
.btn-export:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Main panel ── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-paper);
}

/* Main toolbar */
.main-toolbar {
  padding: var(--space-3) var(--space-6);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  gap: var(--space-4);
  flex-shrink: 0;
  background: var(--color-paper);
}
.count-badge {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-accent);
  background: var(--color-accent-subtle);
  border: 1px solid var(--color-accent-line);
  border-radius: 20px;
  padding: var(--space-1) var(--space-3);
  white-space: nowrap;
}
.select-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
}
.btn-ghost {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-ink-muted);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-3);
  cursor: pointer;
  transition: border-color 0.12s var(--ease-out), color 0.12s var(--ease-out);
}
.btn-ghost:hover { border-color: var(--color-accent-line); color: var(--color-accent); }

/* View toggle */
.view-toggle {
  margin-left: auto;
  display: flex;
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.view-btn {
  background: transparent;
  border: none;
  color: var(--color-ink-muted);
  padding: var(--space-1) var(--space-3);
  cursor: pointer;
  font-size: var(--text-xs);
  font-weight: 600;
  font-family: var(--font-body);
  display: flex;
  align-items: center;
  gap: var(--space-1);
  transition: background 0.12s var(--ease-out), color 0.12s var(--ease-out);
}
.view-btn.active {
  background: var(--color-accent);
  color: var(--color-paper);
}
.view-btn:hover:not(.active) { color: var(--color-ink); }

/* Main content area */
.main-content {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6);
}

/* ── Empty state ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space-16);
  gap: var(--space-4);
  min-height: 300px;
  color: var(--color-ink-muted);
}
.empty-icon { font-size: 48px; opacity: 0.4; }
.empty-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
}
.empty-sub {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  max-width: 320px;
  line-height: 1.65;
}

/* ── Card grid ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: var(--space-4);
}

.user-card {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  cursor: pointer;
  transition: border-color 0.18s var(--ease-out), transform 0.18s var(--ease-out), box-shadow 0.18s var(--ease-out);
  position: relative;
  overflow: hidden;
}
.user-card:hover {
  border-color: var(--color-accent-line);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px oklch(18% 0.04 155 / 0.1);
}

/* Checkbox overlay */
.card-check {
  position: absolute;
  top: var(--space-3);
  right: var(--space-3);
  width: 16px;
  height: 16px;
  accent-color: var(--color-accent);
  cursor: pointer;
  z-index: 2;
}

.card-top {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.avatar-wrap { position: relative; flex-shrink: 0; }
.avatar-img {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--color-border);
  display: block;
  transition: border-color 0.18s var(--ease-out);
}
.user-card:hover .avatar-img { border-color: var(--color-accent-line); }

.avatar-fallback {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 2px solid var(--color-border);
  background: var(--color-paper-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  color: var(--color-accent);
}
.avatar-flag {
  position: absolute;
  bottom: -2px;
  right: -2px;
  font-size: 13px;
  line-height: 1;
}
.card-name {
  font-weight: 600;
  font-size: var(--text-sm);
  color: var(--color-ink);
  margin-bottom: 2px;
  line-height: 1.3;
}
.card-age {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}

.card-fields {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.card-field {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  min-width: 0;
}
.card-field svg { width: 11px; height: 11px; flex-shrink: 0; color: var(--color-accent); }
.card-field-val {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.card-email-btn {
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-ink-muted);
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 600;
  padding: 2px var(--space-2);
  cursor: pointer;
  white-space: nowrap;
  transition: border-color 0.12s var(--ease-out), color 0.12s var(--ease-out);
  flex-shrink: 0;
}
.card-email-btn:hover { border-color: var(--color-accent-line); color: var(--color-accent); }

/* ── Table view ── */
.table-wrap {
  overflow-x: auto;
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
}
table { width: 100%; border-collapse: collapse; }
thead { background: var(--color-paper-2); position: sticky; top: 0; z-index: 10; }
th {
  padding: var(--space-2) var(--space-4);
  text-align: left;
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--color-ink-muted);
  border-bottom: 1px solid var(--color-border);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition: color 0.12s var(--ease-out);
}
th:hover { color: var(--color-ink); }
th.sorted { color: var(--color-accent); }
th svg { display: inline; vertical-align: middle; margin-left: 4px; }
td {
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  font-size: var(--text-sm);
  color: var(--color-ink);
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
tbody tr { transition: background 0.1s var(--ease-out); cursor: pointer; }
tbody tr:hover { background: oklch(95% 0.014 95); }
tbody tr:last-child td { border-bottom: none; }

.td-avatar {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.td-avatar img {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--color-border);
  flex-shrink: 0;
  object-fit: cover;
}
.td-check-cell { width: 36px; }
.td-check {
  width: 14px;
  height: 14px;
  accent-color: var(--color-accent);
  cursor: pointer;
}

/* ── Pagination ── */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  padding: var(--space-6) 0 var(--space-2);
}
.page-info {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
}
.btn-page {
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-4);
  cursor: pointer;
  transition: border-color 0.12s var(--ease-out), color 0.12s var(--ease-out);
}
.btn-page:hover:not(:disabled) { border-color: var(--color-accent-line); color: var(--color-accent); }
.btn-page:disabled { opacity: 0.35; cursor: not-allowed; }

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: oklch(18% 0.04 155 / 0.5);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-6);
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s var(--ease-out);
}
.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  transform: scale(0.96) translateY(8px);
  transition: transform 0.2s var(--ease-out);
}
.modal-overlay.open .modal { transform: scale(1) translateY(0); }

.modal-header {
  padding: var(--space-6) var(--space-6) var(--space-4);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-4);
  border-bottom: 1px solid var(--color-border);
}
.modal-avatar-row {
  display: flex;
  align-items: center;
  gap: var(--space-4);
}
.modal-avatar {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  border: 3px solid var(--color-accent-line);
  object-fit: cover;
}
.modal-avatar-fallback {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  border: 3px solid var(--color-accent-line);
  background: var(--color-paper-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-accent);
}
.modal-name {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  margin-bottom: 2px;
}
.modal-sub { font-size: var(--text-sm); color: var(--color-ink-muted); }
.modal-close {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-ink-muted);
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  font-size: var(--text-lg);
  transition: color 0.12s var(--ease-out), border-color 0.12s var(--ease-out);
  line-height: 1;
}
.modal-close:hover { color: var(--color-ink); border-color: var(--color-accent-line); }

.modal-body { padding: var(--space-4) var(--space-6) var(--space-6); }

.modal-section { margin-bottom: var(--space-4); }
.modal-section-title {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--color-ink-muted);
  margin-bottom: var(--space-3);
}
.modal-fields { display: flex; flex-direction: column; gap: var(--space-2); }
.modal-field {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  cursor: pointer;
  transition: border-color 0.12s var(--ease-out), background 0.12s var(--ease-out);
}
.modal-field:hover { border-color: var(--color-accent-line); background: var(--color-accent-subtle); }
.modal-field-left { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.modal-field-icon {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  background: var(--color-accent-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-accent);
  flex-shrink: 0;
}
.modal-field-icon svg { width: 13px; height: 13px; }
.modal-field-lbl { font-size: var(--text-xs); color: var(--color-ink-muted); margin-bottom: 1px; }
.modal-field-val { font-size: var(--text-sm); color: var(--color-ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal-copy-btn {
  background: transparent;
  border: none;
  color: var(--color-ink-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
  transition: color 0.12s var(--ease-out);
}
.modal-copy-btn:hover { color: var(--color-accent); }
.modal-copy-btn svg { width: 13px; height: 13px; display: block; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 600;
  background: var(--color-ink);
  color: var(--color-paper);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px oklch(20% 0.012 250 / 0.20);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s var(--ease-out), transform 0.2s var(--ease-out);
  pointer-events: none;
  max-width: 320px;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--color-success); }
.toast.error { background: var(--color-danger); }

/* ── Skeleton loading ── */
@keyframes shimmer {
  0% { background-position: -600px 0; }
  100% { background-position: 600px 0; }
}
.skeleton {
  background: linear-gradient(90deg, var(--color-paper-2) 25%, var(--color-border) 50%, var(--color-paper-2) 75%);
  background-size: 600px 100%;
  animation: shimmer 1.4s infinite;
  border-radius: var(--radius-sm);
}

/* Spinner */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid oklch(97% 0.008 95 / 0.35);
  border-top-color: var(--color-paper);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--color-ink-muted); }

/* ── Mobile responsive ── */
@media (max-width: 768px) {
  html, body { overflow: auto; height: auto; }
  .app-shell { grid-template-columns: 1fr; height: auto; overflow: visible; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--color-border); overflow: visible; }
  .main { overflow: visible; }
  .main-content { overflow: visible; padding: var(--space-4); }
  .card-grid { grid-template-columns: 1fr; }
  .nav-page-label { display: none; }
  .nat-grid { grid-template-columns: 1fr 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  .user-card:hover { transform: none; }
  .btn-generate:hover { transform: none; box-shadow: none; }
  .toast { transition: opacity 0.15s var(--ease-out); transform: none; }
}
</style>

<script>
'use strict';

// ── Constants ──────────────────────────────────────────────────
const PAGE_SIZE = 20;
const FLAG_MAP = {
  us:'🇺🇸', gb:'🇬🇧', fr:'🇫🇷', de:'🇩🇪', au:'🇦🇺',
  ca:'🇨🇦', br:'🇧🇷', nl:'🇳🇱', no:'🇳🇴', fi:'🇫🇮',
  dk:'🇩🇰', es:'🇪🇸', mx:'🇲🇽', nz:'🇳🇿', ch:'🇨🇭',
  in:'🇮🇳', ir:'🇮🇷', rs:'🇷🇸', tr:'🇹🇷', ua:'🇺🇦',
};

// ── State ──────────────────────────────────────────────────────
const state = {
  users: [],
  selected: new Set(),       // indices of selected users
  view: localStorage.getItem('ug_view') || 'cards',
  page: 0,
  sortKey: null,
  sortDir: 1,                // 1 = asc, -1 = desc
};

// ── Helpers ────────────────────────────────────────────────────
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fullName = (u) => `${u.name.first} ${u.name.last}`;
const initials = (u) => `${u.name.first[0]}${u.name.last[0]}`.toUpperCase();
const flag = (nat) => FLAG_MAP[nat.toLowerCase()] || '';
const fmtDate = (iso) => {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
};

// ── Toast ──────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3000);
}

// ── Clipboard ─────────────────────────────────────────────────
function copyText(text, label) {
  navigator.clipboard.writeText(text).then(() => {
    toast(`${label || 'Value'} copied!`, 'success');
  }).catch(() => {
    toast('Copy failed — try manually.', 'error');
  });
}

// ── Slider ────────────────────────────────────────────────────
const countSlider = document.getElementById('count-slider');
const countLabel = document.getElementById('count-label');
countSlider.addEventListener('input', () => {
  countLabel.textContent = `${countSlider.value} user${countSlider.value == 1 ? '' : 's'}`;
});

// ── Generate ──────────────────────────────────────────────────
document.getElementById('btn-generate').addEventListener('click', generateUsers);

async function generateUsers() {
  const count = parseInt(countSlider.value, 10);
  const gender = document.querySelector('input[name="gender"]:checked')?.value || '';
  const seed = document.getElementById('seed-input').value.trim();

  const checkedNats = [...document.querySelectorAll('.nat-grid input[type="checkbox"]:checked')]
    .map(cb => cb.dataset.nat);

  if (checkedNats.length === 0) {
    toast('Select at least one nationality.', 'error');
    return;
  }

  const btn = document.getElementById('btn-generate');
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Generating…`;

  let url = `https://randomuser.me/api/?results=${count}&nat=${checkedNats.join(',')}`;
  if (gender) url += `&gender=${gender}`;
  if (seed) url += `&seed=${encodeURIComponent(seed)}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`API error ${res.status}`);
    const data = await res.json();
    state.users = data.results;
    state.selected.clear();
    state.page = 0;
    state.sortKey = null;
    state.sortDir = 1;
    enableExport(true);
    renderAll();
    toast(`${data.results.length} user${data.results.length !== 1 ? 's' : ''} generated!`, 'success');
  } catch (err) {
    toast(`Failed: ${err.message}`, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Generate Users`;
  }
}

// ── Enable/disable export ──────────────────────────────────────
function enableExport(on) {
  document.getElementById('btn-copy').disabled = !on;
  document.getElementById('btn-download').disabled = !on;
}

// ── View toggle ───────────────────────────────────────────────
document.getElementById('view-cards').addEventListener('click', () => setView('cards'));
document.getElementById('view-table').addEventListener('click', () => setView('table'));

function setView(v) {
  state.view = v;
  localStorage.setItem('ug_view', v);
  document.getElementById('view-cards').classList.toggle('active', v === 'cards');
  document.getElementById('view-table').classList.toggle('active', v === 'table');
  document.getElementById('view-cards').setAttribute('aria-pressed', String(v === 'cards'));
  document.getElementById('view-table').setAttribute('aria-pressed', String(v === 'table'));
  document.getElementById('card-view').style.display = v === 'cards' ? 'block' : 'none';
  document.getElementById('table-view').style.display = v === 'table' ? 'block' : 'none';
  renderPagedView();
}

// ── Select all / deselect ─────────────────────────────────────
document.getElementById('btn-select-all').addEventListener('click', () => {
  state.users.forEach((_, i) => state.selected.add(i));
  syncCheckboxes();
});
document.getElementById('btn-deselect-all').addEventListener('click', () => {
  state.selected.clear();
  syncCheckboxes();
});

function syncCheckboxes() {
  document.querySelectorAll('[data-select-idx]').forEach(cb => {
    const idx = parseInt(cb.dataset.selectIdx, 10);
    cb.checked = state.selected.has(idx);
  });
}

// ── Render all ────────────────────────────────────────────────
function renderAll() {
  const hasUsers = state.users.length > 0;

  document.getElementById('empty-state').style.display = hasUsers ? 'none' : 'flex';
  document.getElementById('count-badge').style.display = hasUsers ? '' : 'none';
  document.getElementById('select-row').style.display = hasUsers ? '' : 'none';
  document.getElementById('view-toggle').style.display = hasUsers ? '' : 'none';
  document.getElementById('card-view').style.display = (hasUsers && state.view === 'cards') ? 'block' : 'none';
  document.getElementById('table-view').style.display = (hasUsers && state.view === 'table') ? 'block' : 'none';

  if (hasUsers) {
    const n = state.users.length;
    document.getElementById('count-badge').textContent = `${n} user${n !== 1 ? 's' : ''}`;
    renderPagedView();
  }
}

// ── Paged view ────────────────────────────────────────────────
function getSortedUsers() {
  if (!state.sortKey) return state.users;
  const key = state.sortKey;
  return [...state.users].sort((a, b) => {
    let va, vb;
    if (key === 'name')     { va = fullName(a).toLowerCase(); vb = fullName(b).toLowerCase(); }
    else if (key === 'email')    { va = a.email.toLowerCase(); vb = b.email.toLowerCase(); }
    else if (key === 'age')      { va = a.dob.age; vb = b.dob.age; }
    else if (key === 'location') { va = a.location.city.toLowerCase(); vb = b.location.city.toLowerCase(); }
    else if (key === 'country')  { va = a.location.country.toLowerCase(); vb = b.location.country.toLowerCase(); }
    else if (key === 'phone')    { va = a.phone; vb = b.phone; }
    else return 0;
    if (va < vb) return -state.sortDir;
    if (va > vb) return state.sortDir;
    return 0;
  });
}

function renderPagedView() {
  const sorted = getSortedUsers();
  const total = sorted.length;
  const totalPages = Math.ceil(total / PAGE_SIZE);
  if (state.page >= totalPages) state.page = Math.max(0, totalPages - 1);

  const start = state.page * PAGE_SIZE;
  const pageUsers = sorted.slice(start, start + PAGE_SIZE);

  if (state.view === 'cards') {
    renderCards(pageUsers, start);
    renderPagination('card-pagination', total, totalPages);
  } else {
    renderTable(sorted, pageUsers, start);
    renderPagination('table-pagination', total, totalPages);
  }
}

// ── Card grid ─────────────────────────────────────────────────
function renderCards(pageUsers, offset) {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';

  pageUsers.forEach((u, localIdx) => {
    const globalIdx = state.users.indexOf(u);
    const card = document.createElement('article');
    card.className = 'user-card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `View profile for ${fullName(u)}`);

    const natFlag = flag(u.nat);

    card.innerHTML = `
      <input type="checkbox" class="card-check" data-select-idx="${globalIdx}" aria-label="Select ${fullName(u)}" ${state.selected.has(globalIdx) ? 'checked' : ''}>
      <div class="card-top">
        <div class="avatar-wrap">
          <img class="avatar-img" src="${esc(u.picture.medium)}" alt="Avatar of ${esc(fullName(u))}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <div class="avatar-fallback" style="display:none">${esc(initials(u))}</div>
          <span class="avatar-flag" aria-hidden="true">${natFlag}</span>
        </div>
        <div>
          <div class="card-name">${esc(fullName(u))}</div>
          <div class="card-age">Age ${u.dob.age} &middot; ${esc(u.location.country)}</div>
        </div>
      </div>
      <div class="card-fields">
        <div class="card-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <span class="card-field-val" title="${esc(u.email)}">${esc(u.email)}</span>
          <button class="card-email-btn" data-copy="${esc(u.email)}" aria-label="Copy email address">Copy</button>
        </div>
        <div class="card-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span class="card-field-val">${esc(u.location.city)}, ${natFlag}</span>
        </div>
      </div>
    `;

    // Click to open modal (not on checkbox/copy btn)
    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('card-check') || e.target.classList.contains('card-email-btn') || e.target.dataset.copy) return;
      openModal(globalIdx);
    });
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(globalIdx); }
    });

    // Checkbox
    card.querySelector('.card-check').addEventListener('change', (e) => {
      if (e.target.checked) state.selected.add(globalIdx);
      else state.selected.delete(globalIdx);
    });

    // Copy email button
    card.querySelector('.card-email-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      copyText(e.currentTarget.dataset.copy, 'Email');
    });

    grid.appendChild(card);
  });
}

// ── Table view ────────────────────────────────────────────────
function renderTable(sorted, pageUsers, offset) {
  const thead = document.getElementById('table-head');
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  // Build header once, re-render to update sort indicators
  const cols = [
    { key: null,       label: '',         sortable: false, th_class: 'td-check-cell' },
    { key: 'avatar',   label: '',         sortable: false },
    { key: 'name',     label: 'Name',     sortable: true },
    { key: 'email',    label: 'Email',    sortable: true },
    { key: 'age',      label: 'Age',      sortable: true },
    { key: 'location', label: 'City',     sortable: true },
    { key: 'country',  label: 'Country',  sortable: true },
    { key: 'phone',    label: 'Phone',    sortable: false },
  ];

  thead.innerHTML = '';
  const headRow = document.createElement('tr');
  cols.forEach(col => {
    const th = document.createElement('th');
    th.scope = 'col';
    if (col.th_class) th.className = col.th_class;
    if (col.sortable) {
      th.classList.toggle('sorted', state.sortKey === col.key);
      th.setAttribute('aria-sort', state.sortKey === col.key ? (state.sortDir === 1 ? 'ascending' : 'descending') : 'none');
      const arrow = state.sortKey === col.key ? (state.sortDir === 1 ? ' ↑' : ' ↓') : '';
      th.textContent = col.label + arrow;
      th.addEventListener('click', () => {
        if (state.sortKey === col.key) state.sortDir *= -1;
        else { state.sortKey = col.key; state.sortDir = 1; }
        state.page = 0;
        renderPagedView();
      });
    } else {
      th.textContent = col.label;
    }
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);

  // Rows
  pageUsers.forEach((u) => {
    const globalIdx = state.users.indexOf(u);
    const natFlag = flag(u.nat);

    const tr = document.createElement('tr');
    tr.tabIndex = 0;
    tr.setAttribute('aria-label', `Open profile for ${fullName(u)}`);

    // Checkbox cell
    const tdCheck = document.createElement('td');
    tdCheck.className = 'td-check-cell';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'td-check';
    cb.setAttribute('data-select-idx', globalIdx);
    cb.checked = state.selected.has(globalIdx);
    cb.setAttribute('aria-label', `Select ${fullName(u)}`);
    cb.addEventListener('change', (e) => {
      e.stopPropagation();
      if (e.target.checked) state.selected.add(globalIdx);
      else state.selected.delete(globalIdx);
    });
    tdCheck.appendChild(cb);
    tr.appendChild(tdCheck);

    // Avatar
    const tdAv = document.createElement('td');
    tdAv.innerHTML = `<div class="td-avatar"><img src="${esc(u.picture.thumbnail)}" alt="" loading="lazy" onerror="this.style.display='none'">${natFlag}</div>`;
    tr.appendChild(tdAv);

    // Name
    const tdName = document.createElement('td');
    tdName.textContent = fullName(u);
    tr.appendChild(tdName);

    // Email (clickable to copy)
    const tdEmail = document.createElement('td');
    tdEmail.style.cursor = 'pointer';
    tdEmail.title = 'Click to copy email';
    tdEmail.textContent = u.email;
    tdEmail.addEventListener('click', (e) => { e.stopPropagation(); copyText(u.email, 'Email'); });
    tr.appendChild(tdEmail);

    // Age
    const tdAge = document.createElement('td');
    tdAge.textContent = u.dob.age;
    tr.appendChild(tdAge);

    // City
    const tdCity = document.createElement('td');
    tdCity.textContent = u.location.city;
    tr.appendChild(tdCity);

    // Country
    const tdCountry = document.createElement('td');
    tdCountry.textContent = u.location.country;
    tr.appendChild(tdCountry);

    // Phone
    const tdPhone = document.createElement('td');
    tdPhone.textContent = u.phone;
    tr.appendChild(tdPhone);

    tr.addEventListener('click', (e) => {
      if (e.target === cb || e.target === tdEmail) return;
      openModal(globalIdx);
    });
    tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') openModal(globalIdx); });

    tbody.appendChild(tr);
  });
}

// ── Pagination ────────────────────────────────────────────────
function renderPagination(id, total, totalPages) {
  const el = document.getElementById(id);
  if (totalPages <= 1) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  const start = state.page * PAGE_SIZE + 1;
  const end = Math.min((state.page + 1) * PAGE_SIZE, total);

  el.innerHTML = `
    <button class="btn-page" id="${id}-prev" ${state.page === 0 ? 'disabled' : ''} aria-label="Previous page">← Prev</button>
    <span class="page-info">${start}–${end} of ${total}</span>
    <button class="btn-page" id="${id}-next" ${state.page >= totalPages - 1 ? 'disabled' : ''} aria-label="Next page">Next →</button>
  `;

  document.getElementById(`${id}-prev`).addEventListener('click', () => { state.page--; renderPagedView(); });
  document.getElementById(`${id}-next`).addEventListener('click', () => { state.page++; renderPagedView(); });
}

// ── Modal ─────────────────────────────────────────────────────
function openModal(idx) {
  const u = state.users[idx];
  if (!u) return;

  const natFlag = flag(u.nat);
  const avatarRow = document.getElementById('modal-avatar-row');
  avatarRow.innerHTML = `
    <img class="modal-avatar" src="${esc(u.picture.large)}" alt="Avatar of ${esc(fullName(u))}" id="modal-title"
      onerror="this.style.display='none';document.getElementById('modal-avatar-fallback').style.display='flex'">
    <div class="modal-avatar-fallback" id="modal-avatar-fallback" style="display:none">${esc(initials(u))}</div>
    <div>
      <div class="modal-name">${esc(fullName(u))}</div>
      <div class="modal-sub">@${esc(u.login.username)} &middot; ${natFlag} ${esc(u.nat.toUpperCase())}</div>
    </div>
  `;

  const body = document.getElementById('modal-body');
  body.innerHTML = '';

  const ico = (path) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;

  const makeSection = (title, fields) => {
    const sec = document.createElement('div');
    sec.className = 'modal-section';
    const titleEl = document.createElement('div');
    titleEl.className = 'modal-section-title';
    titleEl.textContent = title;
    sec.appendChild(titleEl);
    const fieldsEl = document.createElement('div');
    fieldsEl.className = 'modal-fields';

    fields.forEach(({ icon, lbl, val, copyVal }) => {
      if (!val && val !== 0) return;
      const div = document.createElement('div');
      div.className = 'modal-field';
      div.tabIndex = 0;
      div.title = `Click to copy ${lbl}`;
      div.innerHTML = `
        <div class="modal-field-left">
          <div class="modal-field-icon">${icon}</div>
          <div>
            <div class="modal-field-lbl">${esc(lbl)}</div>
            <div class="modal-field-val">${esc(String(val))}</div>
          </div>
        </div>
        <button class="modal-copy-btn" aria-label="Copy ${esc(lbl)}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      `;
      const doCopy = () => copyText(String(copyVal ?? val), lbl);
      div.addEventListener('click', doCopy);
      div.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doCopy(); } });
      fieldsEl.appendChild(div);
    });
    sec.appendChild(fieldsEl);
    body.appendChild(sec);
  };

  makeSection('Personal', [
    { icon: ico('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'), lbl: 'Full Name', val: fullName(u) },
    { icon: ico('<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'), lbl: 'Date of Birth', val: `${fmtDate(u.dob.date)} (age ${u.dob.age})` },
    { icon: ico('<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>'), lbl: 'Nationality', val: `${natFlag} ${u.location.country}` },
  ]);

  makeSection('Contact', [
    { icon: ico('<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>'), lbl: 'Email', val: u.email },
    { icon: ico('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13 19.79 19.79 0 0 1 1.61 4.39 2 2 0 0 1 3.57 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.18 6.18l.91-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>'), lbl: 'Phone', val: u.phone },
    { icon: ico('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13 19.79 19.79 0 0 1 1.61 4.39 2 2 0 0 1 3.57 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.18 6.18l.91-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>'), lbl: 'Cell', val: u.cell },
  ]);

  makeSection('Address', [
    { icon: ico('<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'), lbl: 'Street', val: `${u.location.street.number} ${u.location.street.name}` },
    { icon: ico('<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'), lbl: 'City', val: u.location.city },
    { icon: ico('<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'), lbl: 'State / Country', val: `${u.location.state}, ${u.location.country}` },
    { icon: ico('<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'), lbl: 'Postcode', val: String(u.location.postcode) },
  ]);

  makeSection('Account', [
    { icon: ico('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'), lbl: 'Username', val: u.login.username, copyVal: u.login.username },
    { icon: ico('<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'), lbl: 'UUID', val: u.login.uuid, copyVal: u.login.uuid },
    { icon: ico('<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'), lbl: 'Registered', val: fmtDate(u.registered.date) },
  ]);

  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-close').focus();
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// ── Export ────────────────────────────────────────────────────
function getExportUsers() {
  if (state.selected.size > 0) {
    return [...state.selected].sort((a, b) => a - b).map(i => state.users[i]);
  }
  return state.users;
}

function buildJSON() {
  return JSON.stringify(getExportUsers().map(u => ({
    id: u.login.uuid,
    first_name: u.name.first,
    last_name: u.name.last,
    email: u.email,
    phone: u.phone,
    cell: u.cell,
    age: u.dob.age,
    dob: u.dob.date.split('T')[0],
    gender: u.gender,
    username: u.login.username,
    city: u.location.city,
    state: u.location.state,
    country: u.location.country,
    postcode: String(u.location.postcode),
    street: `${u.location.street.number} ${u.location.street.name}`,
    nationality: u.nat.toUpperCase(),
    avatar: u.picture.large,
    registered: u.registered.date.split('T')[0],
  })), null, 2);
}

function buildCSV() {
  const rows = getExportUsers();
  const headers = ['id','first_name','last_name','email','phone','cell','age','dob','gender','username','city','state','country','postcode','street','nationality','avatar'];
  const esc2 = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [headers.map(esc2).join(',')];
  rows.forEach(u => {
    lines.push([
      u.login.uuid, u.name.first, u.name.last, u.email, u.phone, u.cell,
      u.dob.age, u.dob.date.split('T')[0], u.gender, u.login.username,
      u.location.city, u.location.state, u.location.country, String(u.location.postcode),
      `${u.location.street.number} ${u.location.street.name}`, u.nat.toUpperCase(),
      u.picture.large,
    ].map(esc2).join(','));
  });
  return lines.join('\n');
}

function buildSQL() {
  const rows = getExportUsers();
  const esc2 = (v) => `'${String(v ?? '').replace(/'/g, "''")}'`;
  const lines = rows.map(u => `  (${[
    u.login.uuid, u.name.first, u.name.last, u.email, u.dob.age,
    u.location.city, u.location.country,
  ].map(esc2).join(', ')})`);
  return `INSERT INTO users (id, first_name, last_name, email, age, city, country)\nVALUES\n${lines.join(',\n')};`;
}

function getExportData() {
  const fmt = document.querySelector('input[name="fmt"]:checked')?.value || 'json';
  if (fmt === 'csv') return { content: buildCSV(), ext: 'csv', mime: 'text/csv' };
  if (fmt === 'sql') return { content: buildSQL(), ext: 'sql', mime: 'text/plain' };
  return { content: buildJSON(), ext: 'json', mime: 'application/json' };
}

document.getElementById('btn-copy').addEventListener('click', () => {
  if (!state.users.length) return;
  const { content } = getExportData();
  const users = getExportUsers();
  copyText(content, `${users.length} user${users.length !== 1 ? 's' : ''}`);
});

document.getElementById('btn-download').addEventListener('click', () => {
  if (!state.users.length) return;
  const { content, ext, mime } = getExportData();
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `users-${Date.now()}.${ext}`;
  a.click();
  URL.revokeObjectURL(url);
  const users = getExportUsers();
  toast(`Downloaded ${users.length} user${users.length !== 1 ? 's' : ''} as .${ext}`, 'success');
});
</script>
