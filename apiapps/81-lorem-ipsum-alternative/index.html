<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lorem Ipsum Alternative — Dark Factory</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080b0e;
      --surface: #0d1117;
      --surface2: #161b22;
      --border: rgba(255,255,255,0.08);
      --accent: #58a6ff;
      --accent2: #f78166;
      --text: #e6edf3;
      --muted: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --radius: 6px;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --font-body: 'Inter', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0,229,255,0.3);
    }

    .header-text h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--text), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-text p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Layout ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }

    /* ── Controls Panel ── */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
    }

    .card-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.875rem;
    }

    /* ── Theme Pills ── */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }

    .theme-btn {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      padding: 0.6rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
      text-align: left;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .theme-btn:hover {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, var(--surface2));
      transform: translateY(-1px);
    }

    .theme-btn.active {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 15%, var(--surface2));
      color: #fff;
    }

    .theme-btn.active .theme-emoji {
      filter: none;
    }

    .theme-emoji {
      font-size: 1rem;
    }

    /* ── Mode Selector ── */
    .mode-tabs {
      display: flex;
      gap: 0.375rem;
      background: var(--surface2);
      padding: 4px;
      border-radius: 8px;
    }

    .mode-tab {
      flex: 1;
      padding: 0.45rem 0.5rem;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.18s;
    }

    .mode-tab.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,229,255,0.4);
    }

    .mode-tab:hover:not(.active) {
      color: var(--text);
      background: var(--border);
    }

    /* ── Count Slider ── */
    .count-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.625rem;
    }

    .count-label { font-size: 0.85rem; color: var(--text); }

    .count-badge {
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      padding: 0.15rem 0.6rem;
      font-size: 0.8rem;
      font-weight: 700;
      min-width: 2.5rem;
      text-align: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      height: 4px;
    }

    /* ── Format Selector ── */
    .format-row {
      display: flex;
      gap: 0.375rem;
    }

    .format-btn {
      flex: 1;
      padding: 0.5rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: var(--surface2);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      text-align: center;
    }

    .format-btn.active {
      border-color: var(--green);
      color: var(--green);
      background: color-mix(in srgb, var(--green) 10%, var(--surface2));
    }

    .format-btn:hover:not(.active) {
      border-color: var(--muted);
      color: var(--text);
    }

    /* ── Generate Button ── */
    .btn-generate {
      width: 100%;
      padding: 0.875rem;
      border: none;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, var(--accent2)));
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(0,229,255,0.35);
      position: relative;
      overflow: hidden;
    }

    .btn-generate::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1));
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,229,255,0.5);
    }

    .btn-generate:hover::before { opacity: 1; }
    .btn-generate:active { transform: translateY(0); }

    .btn-generate.spinning .btn-icon {
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-icon { display: inline-block; }

    /* ── Output Panel ── */
    .output-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .stats-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.3rem 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .stat-chip span {
      color: var(--yellow);
      font-weight: 700;
    }

    .action-row {
      display: flex;
      gap: 0.5rem;
    }

    .btn-copy, .btn-clear {
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      border: 1.5px solid;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-copy {
      border-color: var(--green);
      background: color-mix(in srgb, var(--green) 10%, transparent);
      color: var(--green);
    }

    .btn-copy:hover {
      background: color-mix(in srgb, var(--green) 20%, transparent);
      transform: translateY(-1px);
    }

    .btn-copy.copied {
      background: var(--green);
      color: #0f1117;
    }

    .btn-clear {
      border-color: var(--border);
      background: transparent;
      color: var(--muted);
    }

    .btn-clear:hover {
      border-color: var(--accent2);
      color: var(--accent2);
    }

    /* ── Preview / Textarea ── */
    .preview-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color 0.2s;
      min-height: 400px;
    }

    .preview-container:focus-within {
      border-color: color-mix(in srgb, var(--accent) 60%, var(--border));
    }

    .preview-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    .preview-tab {
      padding: 0.6rem 1rem;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.18s;
    }

    .preview-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 5%, transparent);
    }

    .preview-tab:hover:not(.active) { color: var(--text); }

    #output-raw {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.875rem;
      line-height: 1.7;
      padding: 1.25rem;
      resize: none;
      outline: none;
    }

    #output-raw::placeholder { color: var(--muted); }

    #output-rendered {
      flex: 1;
      padding: 1.25rem 1.5rem;
      overflow-y: auto;
      line-height: 1.75;
      font-size: 0.9rem;
      color: var(--text);
    }

    #output-rendered p + p { margin-top: 1em; }

    .hidden { display: none !important; }

    /* ── Empty State ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 3rem;
      text-align: center;
      color: var(--muted);
      height: 100%;
    }

    .empty-icon {
      font-size: 3rem;
      opacity: 0.5;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .empty-state h3 {
      font-size: 1rem;
      color: var(--text);
      font-weight: 600;
    }

    .empty-state p {
      font-size: 0.85rem;
      max-width: 260px;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--green);
      color: #0f1117;
      padding: 0.7rem 1.25rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(67,217,173,0.4);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 100;
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* ── Footer ── */
    footer {
      padding: 1rem 2rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.1rem 0.4rem;
      font-size: 0.7rem;
      font-family: monospace;
      color: var(--text);
    }

    /* ── Animations ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-in {
      animation: fadeIn 0.3s ease forwards;
    }

    /* === Security/Infra Tools v2 Design System === */
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; line-height: 1.6; background-image: radial-gradient(rgba(88,166,255,0.03) 1px, transparent 1px); background-size: 24px 24px; }
    h1, h2, .title { font-family: var(--font-body); font-weight: 700; letter-spacing: -0.03em; }
    h1 { font-size: clamp(1.4rem, 3vw, 1.8rem); color: var(--text); }
    h2 { font-size: 1rem; color: var(--muted); font-weight: 500; }
    .container, main, .wrapper, .app { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
    .card, .result, .item, .output, .domain, .cert, .check, .breach, .password-result, .ssl-info,
    [class*="card"], [class*="result"], [class*="item"], [class*="check"] {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; animation: secFade 0.25s ease both;
    }
    .card.danger, .result.danger, .breach-found, .expired, .unsafe { border-left: 3px solid var(--red); }
    .card.safe, .result.safe, .no-breach, .valid, .secure { border-left: 3px solid var(--green); }
    .card.warning, .result.warning, .expiring-soon { border-left: 3px solid var(--yellow); }
    .code, .value, pre, code, .mono, .domain-name, .hash, .password, .ip { font-family: var(--font-mono); font-size: 0.85rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 0.2rem 0.5rem; color: var(--text); word-break: break-all; }
    pre, .terminal, .log { font-family: var(--font-mono); font-size: 0.82rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; overflow-x: auto; color: var(--green); line-height: 1.8; }
    input, select, textarea { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: 0.65rem 1rem; font-family: var(--font-mono); font-size: 0.88rem; width: 100%; transition: border-color 0.15s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    button, .btn, input[type="submit"], input[type="button"] { background: var(--accent); color: #000; border: none; border-radius: var(--radius); padding: 0.65rem 1.5rem; font-family: var(--font-body); font-weight: 600; font-size: 0.88rem; cursor: pointer; transition: transform 0.1s, opacity 0.1s; }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }
    .strength-bar, .meter { height: 4px; border-radius: 2px; background: var(--surface2); overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; }
    .tag, .badge, .status, .label, .tld, .registrar { display: inline-block; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); border-radius: 4px; padding: 0.15rem 0.5rem; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--font-mono); }
    .available, .valid, .secure, .up, .safe, .strong { color: var(--green); }
    .taken, .invalid, .expired, .down, .breached, .weak { color: var(--red); }
    .expiring, .warning, .medium { color: var(--yellow); }
    .info, .registered { color: var(--accent); }
    .uptime-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--green); animation: pulse 2s ease infinite; }
    .uptime-dot.down { background: var(--red); animation: none; }
    table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 0.82rem; }
    th { padding: 0.5rem 0.75rem; color: var(--muted); text-align: left; font-family: var(--font-body); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 1px solid var(--border); }
    td { padding: 0.5rem 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
    @keyframes secFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(63,185,80,0.4); } 50% { box-shadow: 0 0 0 4px rgba(63,185,80,0); } }
    @keyframes scanLine { from { transform: translateY(-100%); } to { transform: translateY(100vh); } }
  </style>
</head>
<body>

<header>
  <div class="logo-icon" aria-hidden="true">✍</div>
  <div class="header-text">
    <h1>Lorem Ipsum Alternative</h1>
    <p>Domain-specific placeholder text for dev mockups</p>
  </div>
</header>

<main>
  <!-- ── Controls ── -->
  <aside class="controls" aria-label="Generator controls">

    <div class="card">
      <div class="card-title">Theme</div>
      <div class="theme-grid" role="group" aria-label="Select theme">
        <button class="theme-btn active" data-theme="lorem" aria-pressed="true">
          <span class="theme-emoji">🏛</span> Classic Lorem
        </button>
        <button class="theme-btn" data-theme="tech" aria-pressed="false">
          <span class="theme-emoji">⚙️</span> Tech Ipsum
        </button>
        <button class="theme-btn" data-theme="corporate" aria-pressed="false">
          <span class="theme-emoji">💼</span> Corporate
        </button>
        <button class="theme-btn" data-theme="pirate" aria-pressed="false">
          <span class="theme-emoji">🏴‍☠️</span> Pirate
        </button>
        <button class="theme-btn" data-theme="hipster" aria-pressed="false">
          <span class="theme-emoji">☕</span> Hipster
        </button>
        <button class="theme-btn" data-theme="cat" aria-pressed="false">
          <span class="theme-emoji">🐱</span> Cat Ipsum
        </button>
        <button class="theme-btn" data-theme="zombie" aria-pressed="false">
          <span class="theme-emoji">🧟</span> Zombie
        </button>
        <button class="theme-btn" data-theme="space" aria-pressed="false">
          <span class="theme-emoji">🚀</span> Space Ipsum
        </button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Output Mode</div>
      <div class="mode-tabs" role="group" aria-label="Output mode">
        <button class="mode-tab active" data-mode="paragraphs">Paragraphs</button>
        <button class="mode-tab" data-mode="sentences">Sentences</button>
        <button class="mode-tab" data-mode="words">Words</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Count</div>
      <div class="count-row">
        <label class="count-label" for="count-slider" id="count-label">Paragraphs</label>
        <div class="count-badge" id="count-display" aria-live="polite">3</div>
      </div>
      <input
        type="range"
        id="count-slider"
        min="1"
        max="10"
        value="3"
        aria-labelledby="count-label"
        aria-valuemin="1"
        aria-valuemax="10"
        aria-valuenow="3"
      />
    </div>

    <div class="card">
      <div class="card-title">Format</div>
      <div class="format-row" role="group" aria-label="Output format">
        <button class="format-btn active" data-format="plain" aria-pressed="true">Plain</button>
        <button class="format-btn" data-format="html" aria-pressed="false">HTML</button>
        <button class="format-btn" data-format="markdown" aria-pressed="false">Markdown</button>
        <button class="format-btn" data-format="json" aria-pressed="false">JSON</button>
      </div>
    </div>

    <button class="btn-generate" id="btn-generate" aria-label="Generate placeholder text">
      <span class="btn-inner">
        <span class="btn-icon" aria-hidden="true">✨</span>
        Generate
      </span>
    </button>

  </aside>

  <!-- ── Output ── -->
  <section class="output-panel" aria-label="Output panel">

    <div class="output-header">
      <div class="stats-row" aria-live="polite" aria-label="Text statistics">
        <div class="stat-chip">Words: <span id="word-count">0</span></div>
        <div class="stat-chip">Chars: <span id="char-count">0</span></div>
      </div>
      <div class="action-row">
        <button class="btn-copy" id="btn-copy" aria-label="Copy to clipboard" disabled>
          <span aria-hidden="true">📋</span> Copy
        </button>
        <button class="btn-clear" id="btn-clear" aria-label="Clear output" disabled>
          <span aria-hidden="true">🗑</span> Clear
        </button>
      </div>
    </div>

    <div class="preview-container">
      <div class="preview-tabs" role="tablist" aria-label="Preview mode">
        <button class="preview-tab active" data-view="raw" role="tab" aria-selected="true">Raw</button>
        <button class="preview-tab" data-view="rendered" role="tab" aria-selected="false">Rendered</button>
      </div>

      <div id="view-raw" role="tabpanel">
        <textarea
          id="output-raw"
          readonly
          aria-label="Generated text output"
          placeholder="Click Generate to create placeholder text…"
          spellcheck="false"
        ></textarea>
      </div>

      <div id="view-rendered" class="hidden" role="tabpanel">
        <div id="output-rendered" aria-live="polite">
          <div class="empty-state">

  function rand(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function generateWords(corpus, n) {
    const pool = shuffle(corpus.words);
    const result = [];
    for (let i = 0; i < n; i++) {
      result.push(pool[i % pool.length]);
    }
    return result.join(' ');
  }

  function generateSentence(corpus) {
    return rand(corpus.sentences);
  }

  function generateSentences(corpus, n) {
    const result = [];
    const shuffled = shuffle(corpus.sentences);
    for (let i = 0; i < n; i++) {
      result.push(shuffled[i % shuffled.length]);
    }
    return result.join(' ');
  }

  function generateParagraph(corpus) {
    const count = 3 + Math.floor(Math.random() * 4);
    const shuffled = shuffle(corpus.sentences);
    const picked = [];
    for (let i = 0; i < count; i++) {
      picked.push(shuffled[i % shuffled.length]);
    }
    return picked.join(' ');
  }

  function buildBlocks(theme, mode, count) {
    const corpus = CORPORA[theme];
    const blocks = [];

    if (mode === 'words') {
      const total = count * 15;
      blocks.push(generateWords(corpus, total));
    } else if (mode === 'sentences') {
      for (let i = 0; i < count; i++) {
        blocks.push(generateSentence(corpus));
      }
    } else {
      for (let i = 0; i < count; i++) {
        blocks.push(generateParagraph(corpus));
      }
    }

    return blocks;
  }

  function formatOutput(blocks, format, mode) {
    if (format === 'html') {
      if (mode === 'words') {
        return `<p>${blocks[0]}</p>`;
      }
      return blocks.map(b => `<p>${b}</p>`).join('\n');
    }

    if (format === 'markdown') {
      if (mode === 'sentences') {
        return blocks.map((b, i) => `${i + 1}. ${b}`).join('\n');
      }
      return blocks.join('\n\n');
    }

    if (format === 'json') {
      const obj = mode === 'words'
        ? { type: 'words', content: blocks[0], wordCount: blocks[0].split(' ').length }
        : { type: mode, items: blocks, count: blocks.length };
      return JSON.stringify(obj, null, 2);
    }

    // plain
    return blocks.join('\n\n');
  }

  function updateStats(text) {
    const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
    const chars = text.length;
    elWordCount.textContent = words.toLocaleString();
    elCharCount.textContent = chars.toLocaleString();
  }

  function updateRendered(raw, format) {
    if (raw.trim() === '') {
      elOutputRendered.innerHTML = `<div class="empty-state"><div class="empty-icon" aria-hidden="true">✍️</div><h3>Nothing here yet</h3><p>Generate some text first.</p></div>`;
      return;
    }

    if (format === 'html') {
      elOutputRendered.innerHTML = raw;
      return;
    }

    if (format === 'json') {
      elOutputRendered.innerHTML = `<pre style="font-family:monospace;font-size:0.85rem;line-height:1.6;color:var(--green);white-space:pre-wrap;">${escapeHtml(raw)}</pre>`;
      return;
    }

    if (format === 'markdown') {
      // Very basic markdown rendering
      const lines = raw.split('\n');
      const rendered = lines.map(line => {
        if (/^\d+\./.test(line)) return `<li style="margin-left:1.5rem">${line.replace(/^\d+\.\s*/, '')}</li>`;
        if (line.trim() === '') return '';
        return `<p>${line}</p>`;
      }).join('\n');
      elOutputRendered.innerHTML = rendered;
      return;
    }

    // plain text
    const paragraphs = raw.split('\n\n').filter(p => p.trim());
    elOutputRendered.innerHTML = paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join('');
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function showToast(msg) {
    elToast.textContent = msg;
    elToast.classList.add('show');
    setTimeout(() => elToast.classList.remove('show'), 2000);
  }

  // ── Generate ─────────────────────────────────────────────────────────────────

  function generate() {
    elBtnGenerate.classList.add('spinning');

    setTimeout(() => {
      const blocks = buildBlocks(currentTheme, currentMode, currentCount);
      currentOutput = formatOutput(blocks, currentFormat, currentMode);

      elOutputRaw.value = currentOutput;
      elOutputRaw.classList.add('animate-in');
      setTimeout(() => elOutputRaw.classList.remove('animate-in'), 400);

      updateStats(currentOutput);
      updateRendered(currentOutput, currentFormat);

      elBtnCopy.disabled = false;
      elBtnClear.disabled = false;

      elBtnGenerate.classList.remove('spinning');
    }, 60);
  }

  document.querySelectorAll('.theme-btn').forEach(btn => {

      btn.setAttribute('aria-pressed', 'true');
      currentTheme = btn.dataset.theme;
    });
  });

  document.querySelectorAll('.mode-tab').forEach(tab => {

      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));

      currentMode = tab.dataset.mode;
      const labels = { paragraphs: 'Paragraphs', sentences: 'Sentences', words: 'Word sets' };
      elCountLabel.textContent = labels[currentMode];
    });

  document.querySelectorAll('.format-btn').forEach(btn => {

      btn.setAttribute('aria-pressed', 'true');
      currentFormat = btn.dataset.format;

  elCountSlider.addEventListener('input', () => {
    currentCount = parseInt(elCountSlider.value, 10);
    elCountDisplay.textContent = currentCount;
    elCountSlider.setAttribute('aria-valuenow', currentCount);
  });

  elBtnGenerate.addEventListener('click', generate);

  // Copy button
  elBtnCopy.addEventListener('click', async () => {
    if (!currentOutput) return;
    try {
      await navigator.clipboard.writeText(currentOutput);
      elBtnCopy.classList.add('copied');
      elBtnCopy.querySelector('span').textContent = '✅';
      showToast('Copied to clipboard!');
      setTimeout(() => {
        elBtnCopy.classList.remove('copied');
        elBtnCopy.querySelector('span').textContent = '📋';
      }, 2000);

      // Fallback
      elOutputRaw.select();
      document.execCommand('copy');
      showToast('Copied!');
    }
  });

  // Clear button
  elBtnClear.addEventListener('click', () => {
    currentOutput = '';
    elOutputRaw.value = '';
    updateStats('');
    updateRendered('', currentFormat);
    elBtnCopy.disabled = true;
    elBtnClear.disabled = true;
  });

  // Preview tabs
  document.querySelectorAll('.preview-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.preview-tab').forEach(t => {
        t.classList.remove('active');
        t.setAttribute('aria-selected', 'false');
      });
      tab.classList.add('active');
      tab.setAttribute('aria-selected', 'true');

      const view = tab.dataset.view;
      if (view === 'raw') {
        elViewRaw.classList.remove('hidden');
        elViewRendered.classList.add('hidden');
      } else {
        elViewRendered.classList.remove('hidden');
        elViewRaw.classList.add('hidden');
        updateRendered(currentOutput, currentFormat);
      }
    });
  });

  // Keyboard shortcut: Cmd/Ctrl + Enter
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      generate();
    }
  });

  // Auto-generate on load
  generate();

})();
</script>
</body>
</html>
