<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pairing — Food & Drink Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
/* Hallmark · macrostructure: Workbench · tone: luxury-austere · anchor hue: champagne ~85° */
/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V5 */

/* ── TOKENS ── */
:root {
  --color-paper:       oklch(97% 0.006 70);
  --color-paper-2:     oklch(93% 0.007 65);
  --color-paper-3:     oklch(88% 0.008 62);
  --color-ink:         oklch(14% 0.008 50);
  --color-ink-2:       oklch(38% 0.010 58);
  --color-ink-3:       oklch(58% 0.009 62);
  --color-accent:      oklch(52% 0.068 78);
  --color-rule:        oklch(86% 0.007 65);
  --color-rule-mid:    oklch(78% 0.008 62);
  --color-focus:       oklch(52% 0.068 78);

  --color-wine:        oklch(55% 0.14 10);
  --color-beer:        oklch(70% 0.10 70);
  --color-cocktail:    oklch(62% 0.12 165);
  --color-spirit:      oklch(73% 0.065 85);
  --color-na:          oklch(62% 0.09 220);

  --font-display: 'Cormorant', Georgia, serif;
  --font-body:    'DM Sans', system-ui, sans-serif;

  --text-display: clamp(2.2rem, 5vw, 3.8rem);
  --text-xl:      clamp(1.3rem, 2.5vw, 1.65rem);
  --text-lg:      1.1rem;
  --text-md:      1rem;
  --text-sm:      0.875rem;
  --text-xs:      0.72rem;

  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;

  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.45, 0, 0.55, 1);
  --dur-fast:    120ms;
  --dur-base:    200ms;
  --dur-slow:    380ms;

  --radius-sm: 2px;
  --radius-md: 4px;
}

[data-theme="dark"] {
  --color-paper:       oklch(7% 0.008 50);
  --color-paper-2:     oklch(12% 0.009 52);
  --color-paper-3:     oklch(17% 0.01 55);
  --color-ink:         oklch(90% 0.012 85);
  --color-ink-2:       oklch(56% 0.01 75);
  --color-ink-3:       oklch(32% 0.008 60);
  --color-accent:      oklch(73% 0.065 85);
  --color-rule:        oklch(20% 0.008 55);
  --color-rule-mid:    oklch(28% 0.009 55);
  --color-focus:       oklch(73% 0.065 85);
}

/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: clip; }
html { scroll-padding-top: 72px; }

body {
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-md);
  font-weight: 300;
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background var(--dur-slow) var(--ease-in-out),
              color var(--dur-slow) var(--ease-in-out);
}

/* ── HEADER ── */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-rule);
  padding: var(--space-4) var(--space-8);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-6);
}

.brand { display: flex; flex-direction: column; line-height: 1; }

.wordmark-eyebrow {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 400;
  color: var(--color-ink-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 3px;
}

.wordmark {
  font-family: var(--font-display);
  font-size: 1.45rem;
  font-weight: 400;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-ink);
  margin: 0;
  line-height: 1;
}

/* ── TAB NAV ── */
.tab-nav {
  display: flex;
  gap: var(--space-8);
}

.tab-btn {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-ink-3);
  background: none;
  border: none;
  border-bottom: 1px solid transparent;
  padding: var(--space-1) 0;
  cursor: pointer;
  transition: color var(--dur-base) var(--ease-out),
              border-color var(--dur-base) var(--ease-out);
}

.tab-btn:hover { color: var(--color-ink); }

.tab-btn.active {
  color: var(--color-accent);
  border-bottom-color: var(--color-accent);
}

.tab-btn:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 4px;
  border-radius: var(--radius-sm);
}

/* ── THEME TOGGLE ── */
.theme-toggle {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-ink-3);
  background: none;
  border: 1px solid var(--color-rule-mid);
  border-radius: var(--radius-sm);
  padding: 3px var(--space-3);
  cursor: pointer;
  transition: color var(--dur-base) var(--ease-out),
              border-color var(--dur-base) var(--ease-out);
  white-space: nowrap;
  flex-shrink: 0;
}

.theme-toggle:hover { color: var(--color-ink); border-color: var(--color-ink-3); }
.theme-toggle:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 3px; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── CONTAINER ── */
.container {
  max-width: 860px;
  margin: 0 auto;
  padding: var(--space-12) var(--space-8);
  min-height: calc(100vh - 57px);
}

/* ── STRIP LABEL ── */
.strip-label {
  font-size: var(--text-xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-ink-3);
  font-weight: 400;
  margin-bottom: var(--space-4);
}

/* ── CATEGORY STRIP ── */
.category-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0;
  margin-bottom: var(--space-10);
  border-top: 1px solid var(--color-rule);
  padding-top: var(--space-4);
}

.cat-btn {
  font-family: var(--font-body);
  font-size: 0.78rem;
  font-weight: 400;
  color: var(--color-ink-2);
  background: none;
  border: none;
  cursor: pointer;
  padding: var(--space-2) 0.4rem;
  letter-spacing: 0.02em;
  white-space: nowrap;
  position: relative;
  transition: color var(--dur-base) var(--ease-out);
  border-radius: var(--radius-sm);
}

.cat-btn::after {
  content: '';
  position: absolute;
  bottom: 2px;
  left: 0.4rem;
  right: 0.4rem;
  height: 1px;
  background: var(--color-accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform var(--dur-base) var(--ease-out);
}

.cat-btn:hover { color: var(--color-ink); }

.cat-btn.selected { color: var(--color-accent); }
.cat-btn.selected::after { transform: scaleX(1); }

.cat-btn:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

.cat-sep {
  color: var(--color-ink-3);
  font-size: var(--text-xs);
  user-select: none;
  padding: 0 2px;
}

/* ── SEARCH ROW ── */
.search-row {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  border-bottom: 1px solid var(--color-rule-mid);
  padding-bottom: var(--space-4);
  margin-bottom: var(--space-12);
}

.search-input {
  flex: 1;
  background: none;
  border: none;
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-md);
  font-weight: 300;
  outline: none;
  padding: var(--space-2) 0;
  caret-color: var(--color-accent);
  min-width: 0;
}

.search-input::placeholder { color: var(--color-ink-3); }

/* ── BUTTONS ── */
.btn-primary {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-paper);
  background: var(--color-accent);
  border: none;
  padding: var(--space-2) var(--space-6);
  cursor: pointer;
  border-radius: var(--radius-sm);
  white-space: nowrap;
  transition: opacity var(--dur-base) var(--ease-out),
              transform var(--dur-fast) var(--ease-out);
}

.btn-primary:hover { opacity: 0.82; }
.btn-primary:active { transform: translateY(1px); }
.btn-primary:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.btn-primary:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 3px;
}

.btn-ghost {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 400;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-ink-3);
  background: none;
  border: none;
  cursor: pointer;
  padding: var(--space-2) var(--space-2);
  white-space: nowrap;
  transition: color var(--dur-base) var(--ease-out);
  border-radius: var(--radius-sm);
}

.btn-ghost:hover { color: var(--color-ink-2); }
.btn-ghost:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 3px;
}

/* ── RESULTS LABEL ── */
.results-label {
  font-size: var(--text-xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-ink-3);
  font-weight: 400;
  margin-bottom: var(--space-6);
}

.results-label strong {
  color: var(--color-accent);
  font-weight: 400;
  font-style: normal;
}

/* ── PAIRING LIST ── */
.pairings-list { display: flex; flex-direction: column; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .pairing-item { animation: none !important; }
}

.pairing-item {
  padding: var(--space-8) 0;
  border-top: 1px solid var(--color-rule);
  animation: fadeUp var(--dur-slow) var(--ease-out) both;
}

.pairing-item:last-child { border-bottom: 1px solid var(--color-rule); }

.pairing-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-4);
}

.drink-type-tag {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 500;
  padding: 2px var(--space-2);
  border-radius: var(--radius-sm);
  border: 1px solid;
}

.drink-type-tag.wine    { color: var(--color-wine);     border-color: var(--color-wine); }
.drink-type-tag.beer    { color: var(--color-beer);     border-color: var(--color-beer); }
.drink-type-tag.cocktail { color: var(--color-cocktail); border-color: var(--color-cocktail); }
.drink-type-tag.spirit  { color: var(--color-spirit);   border-color: var(--color-spirit); }
.drink-type-tag.non-alcoholic { color: var(--color-na); border-color: var(--color-na); }

.match-score {
  font-size: var(--text-xs);
  color: var(--color-ink-3);
  letter-spacing: 0.06em;
}

.pairing-body {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: var(--space-8);
  align-items: start;
}

.drink-name {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  font-style: normal;
  color: var(--color-ink);
  line-height: 1.15;
  letter-spacing: -0.01em;
  margin-bottom: var(--space-2);
  overflow-wrap: anywhere;
  min-width: 0;
}

.drink-sub {
  font-size: var(--text-xs);
  color: var(--color-ink-3);
  letter-spacing: 0.04em;
}

.drink-desc {
  font-size: var(--text-sm);
  color: var(--color-ink-2);
  line-height: 1.7;
  margin-bottom: var(--space-4);
}

.serving-tip {
  border-left: 2px solid var(--color-accent);
  padding-left: var(--space-3);
  font-size: var(--text-xs);
  color: var(--color-ink-3);
  line-height: 1.6;
  font-style: normal;
}

/* ── EMPTY STATE ── */
.empty-state {
  padding: var(--space-16) 0 var(--space-12);
  text-align: center;
}

.empty-tagline {
  font-family: var(--font-display);
  font-size: var(--text-display);
  font-weight: 300;
  font-style: normal;
  color: var(--color-ink-3);
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: var(--space-10);
  overflow-wrap: anywhere;
  min-width: 0;
}

.empty-legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--space-6);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-xs);
  color: var(--color-ink-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.legend-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── STATE BOX ── */
.state-box {
  padding: var(--space-12) 0;
  text-align: center;
}

.state-title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  font-style: normal;
  color: var(--color-ink);
  margin-bottom: var(--space-2);
}

.state-desc {
  font-size: var(--text-sm);
  color: var(--color-ink-2);
}

/* ── SKELETON ── */
@keyframes shimmer {
  from { background-position: 100% 50%; }
  to   { background-position: 0% 50%; }
}

.skeleton {
  background: linear-gradient(
    90deg,
    var(--color-paper-2) 25%,
    var(--color-rule) 50%,
    var(--color-paper-2) 75%
  );
  background-size: 400% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: var(--radius-sm);
}

.skeleton-list { display: flex; flex-direction: column; }

.skeleton-item {
  padding: var(--space-8) 0;
  border-top: 1px solid var(--color-rule);
}

/* ── COCKTAIL SEARCH ── */
.cocktail-search-bar {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  border-bottom: 1px solid var(--color-rule-mid);
  padding-bottom: var(--space-4);
  margin-bottom: var(--space-12);
}

.cocktail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--space-6);
}

@media (prefers-reduced-motion: reduce) {
  .cocktail-card { animation: none !important; }
}

.cocktail-card {
  cursor: pointer;
  border: 1px solid var(--color-rule);
  border-radius: var(--radius-md);
  overflow: hidden;
  animation: fadeUp var(--dur-slow) var(--ease-out) both;
  transition: border-color var(--dur-base) var(--ease-out);
}

.cocktail-card:hover { border-color: var(--color-rule-mid); }

.cocktail-card:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

.cocktail-img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  display: block;
}

.cocktail-img-placeholder {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: var(--color-paper-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
}

.cocktail-info { padding: var(--space-4); }

.cocktail-name {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 400;
  font-style: normal;
  color: var(--color-ink);
  margin-bottom: var(--space-1);
  line-height: 1.2;
}

.cocktail-meta {
  font-size: var(--text-xs);
  color: var(--color-ink-3);
  letter-spacing: 0.04em;
}

/* ── MODAL ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: oklch(0% 0 0 / 82%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: var(--space-6);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-base) var(--ease-in-out);
}

.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--color-paper-2);
  border: 1px solid var(--color-rule-mid);
  border-radius: var(--radius-md);
  max-width: 560px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  transform: translateY(8px);
  transition: transform var(--dur-base) var(--ease-out);
}

.modal-overlay.open .modal { transform: translateY(0); }

.modal-img-wrap { position: relative; }

.modal-img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  display: block;
}

.modal-img-placeholder {
  width: 100%;
  height: 200px;
  background: var(--color-paper-3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
}

.modal-close {
  position: absolute;
  top: var(--space-4);
  right: var(--space-4);
  background: oklch(0% 0 0 / 55%);
  border: none;
  color: var(--color-ink);
  font-size: 0.9rem;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--dur-base) var(--ease-out);
}

.modal-close:hover { background: oklch(0% 0 0 / 75%); }
.modal-close:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

.modal-body { padding: var(--space-8); }

.modal-title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  font-style: normal;
  color: var(--color-ink);
  margin-bottom: var(--space-2);
  overflow-wrap: anywhere;
  min-width: 0;
}

.modal-sub {
  font-size: var(--text-xs);
  color: var(--color-ink-3);
  letter-spacing: 0.04em;
  margin-bottom: var(--space-6);
}

.section-label {
  font-size: var(--text-xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-ink-3);
  font-weight: 500;
  margin-bottom: var(--space-3);
}

.ingredient-list {
  display: flex;
  flex-direction: column;
  margin-bottom: var(--space-6);
}

.ingredient-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--space-2) 0;
  border-bottom: 1px solid var(--color-rule);
  font-size: var(--text-sm);
}

.ingredient-name { color: var(--color-ink); font-weight: 400; }
.ingredient-measure { color: var(--color-ink-3); font-size: var(--text-xs); }

.recipe-instructions {
  font-size: var(--text-sm);
  color: var(--color-ink-2);
  line-height: 1.7;
}

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  background: var(--color-paper-3);
  border: 1px solid var(--color-rule-mid);
  border-radius: var(--radius-sm);
  padding: var(--space-3) var(--space-6);
  font-size: var(--text-xs);
  letter-spacing: 0.04em;
  color: var(--color-ink-2);
  z-index: 300;
  transform: translateY(60px);
  opacity: 0;
  transition: transform var(--dur-base) var(--ease-out),
              opacity var(--dur-base) var(--ease-out);
}

.toast.show { transform: translateY(0); opacity: 1; }

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
  header {
    padding: var(--space-3) var(--space-4) var(--space-2);
    flex-wrap: wrap;
    gap: var(--space-2);
  }
  .wordmark-eyebrow { display: none; }
  .wordmark { font-size: 1.15rem; }
  .tab-nav {
    width: 100%;
    gap: var(--space-6);
    border-top: 1px solid var(--color-rule);
    padding-top: var(--space-2);
  }
  .tab-btn { font-size: 0.64rem; letter-spacing: 0.06em; }
  .container { padding: var(--space-8) var(--space-4); max-width: 100%; overflow-x: hidden; }
  .category-strip {
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: visible;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: var(--space-2);
    margin-bottom: var(--space-8);
  }
  .category-strip::-webkit-scrollbar { display: none; }
  .cat-sep { flex-shrink: 0; }
  .cat-btn { flex-shrink: 0; }

/* ─────────────────────────────────────────────
   UTILITIES
───────────────────────────────────────────── */
function showToast(msg, duration = 3000) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), duration);
}

function badgeClass(type) {
  const map = { wine:"wine", beer:"beer", spirit:"spirit", cocktail:"cocktail", "non-alcoholic":"non-alcoholic" };
  return map[type] || "";
}

function typeName(type) {
  const map = { wine:"Wine", beer:"Beer", spirit:"Spirit", cocktail:"Cocktail", "non-alcoholic":"Non-Alcoholic" };
  return map[type] || type;
}

function avgAffinity(aff) {
  const vals = Object.values(aff);
  return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
}

        <span class="legend-item"><span class="legend-dot" style="background:var(--color-cocktail)"></span>Cocktail</span>

}

/* ─────────────────────────────────────────────
   CATEGORY STRIP
───────────────────────────────────────────── */
let selectedCategory = null;

function buildCategories() {
  const grid = document.getElementById("category-grid");
  const entries = Object.entries(PAIRINGS_DB);
  grid.innerHTML = entries.map(([cat], i) =>
    `<button class="cat-btn" role="option" aria-selected="false" data-cat="${cat}">${cat}</button>${i < entries.length - 1 ? '<span class="cat-sep" aria-hidden="true">·</span>' : ''}`
  ).join("");

  grid.querySelectorAll(".cat-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const cat = btn.dataset.cat;
      if (selectedCategory === cat) {
        selectedCategory = null;
        btn.classList.remove("selected");
        btn.setAttribute("aria-selected", "false");
        document.getElementById("food-input").value = "";
        document.getElementById("pairing-results").innerHTML = emptyStateHTML();
      } else {
        grid.querySelectorAll(".cat-btn").forEach(b => {
          b.classList.remove("selected");
          b.setAttribute("aria-selected", "false");
        });
        selectedCategory = cat;
        btn.classList.add("selected");
        btn.setAttribute("aria-selected", "true");
        document.getElementById("food-input").value = "";
        showPairings(cat, PAIRINGS_DB[cat].pairings);
      }
    });
    btn.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); btn.click(); }
    });
  });
}

/* ─────────────────────────────────────────────
   KEYWORD MATCHING
───────────────────────────────────────────── */
function findByKeyword(query) {
  const q = query.toLowerCase().trim();
  if (!q) return null;
  let bestCat = null, bestScore = 0;
  for (const [cat, data] of Object.entries(PAIRINGS_DB)) {
    for (const kw of data.keywords) {
      if (q.includes(kw) || kw.includes(q)) {
        const score = kw === q ? 10 : kw.includes(q) ? 5 : 3;
        if (score > bestScore) { bestScore = score; bestCat = cat; }
      }
    }
  }
  return bestCat;
}

  const el = document.getElementById("pairing-results");

  requestAnimationFrame(() => {
    el.innerHTML = `
      <p class="results-label">${sorted.length} pairings for <strong>${label}</strong></p>
      <div class="pairings-list">
        ${sorted.map((p, i) => renderPairingCard(p, i)).join("")}
      </div>`;
  });
  el.scrollIntoView({ behavior: "smooth", block: "start" });
}

function handlePairingSearch() {
  const query = document.getElementById("food-input").value.trim();

  if (selectedCategory && !query) {
    showPairings(selectedCategory, PAIRINGS_DB[selectedCategory].pairings);
    return;
  }

  if (!query && !selectedCategory) {
    showToast("Select a category or type a dish name.");
    return;
  }

  const cat = findByKeyword(query);
  if (cat) {
    document.querySelectorAll(".cat-btn").forEach(b => {
      b.classList.remove("selected");
      b.setAttribute("aria-selected", "false");
    });
    const matchBtn = document.querySelector(`.cat-btn[data-cat="${cat}"]`);
    if (matchBtn) {
      matchBtn.classList.add("selected");
      matchBtn.setAttribute("aria-selected", "true");
      selectedCategory = cat;
    }
    showPairings(`"${query}"`, PAIRINGS_DB[cat].pairings);
  } else {
    document.getElementById("pairing-results").innerHTML = `
      <div class="state-box">
        <p class="state-title">No match found</p>
        <p class="state-desc">Try a broader term — steak, salmon, cheese, pasta.</p>
      </div>`;
    showToast(`No pairing found for "${query}"`);
  }
}

/* ─────────────────────────────────────────────
   COCKTAIL SEARCH
───────────────────────────────────────────── */
async function searchCocktails(query) {
  const area = document.getElementById("cocktail-results-area");
  area.innerHTML = renderSkeletons(6);

  try {
    const resp = await fetch(`https://www.thecocktaildb.com/api/json/v1/1/search.php?s=${encodeURIComponent(query)}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    const drinks = data.drinks;

    if (!drinks || drinks.length === 0) {
      area.innerHTML = `
        <div class="state-box">
          <p class="state-title">No cocktails found</p>
          <p class="state-desc">Try Margarita, Mojito, or Old Fashioned.</p>
        </div>`;
      return;
    }

    area.innerHTML = `
      <p class="results-label" style="margin-bottom:var(--space-6)">Found ${drinks.length} result${drinks.length !== 1 ? "s" : ""}</p>
      <div class="cocktail-grid">
        ${drinks.slice(0, 12).map((d, i) => `
          <div class="cocktail-card" tabindex="0" style="animation-delay:${i * 55}ms" data-id="${d.idDrink}" role="button" aria-label="View recipe for ${d.strDrink}">
            ${d.strDrinkThumb
              ? `<img class="cocktail-img" src="${d.strDrinkThumb}/preview" alt="${d.strDrink}" loading="lazy" onerror="this.parentElement.querySelector('.cocktail-img-placeholder').style.display='flex';this.remove();" /><div class="cocktail-img-placeholder" style="display:none">🍹</div>`
              : `<div class="cocktail-img-placeholder">🍹</div>`}
            <div class="cocktail-info">
              <div class="cocktail-name">${d.strDrink}</div>
              <div class="cocktail-meta">${d.strCategory || ""} · ${d.strAlcoholic || ""}</div>
            </div>
          </div>`).join("")}
      </div>`;

    area.querySelectorAll(".cocktail-card").forEach((card, i) => {
      const drink = drinks[i];
      card.addEventListener("click", () => openDrinkModal(drink));
      card.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDrinkModal(drink); }
      });
    });

  } catch (err) {
    area.innerHTML = `
      <div class="state-box">
        <p class="state-title">Could not load cocktails</p>
        <p class="state-desc">${err.message}. Check your connection and try again.</p>
      </div>`;
    showToast("Network error — could not load cocktails.");
  }
}

/* ─────────────────────────────────────────────
   MODAL
───────────────────────────────────────────── */
function openDrinkModal(d) {
  const ingredients = [];
  for (let i = 1; i <= 15; i++) {
    const ing = d[`strIngredient${i}`];
    const meas = d[`strMeasure${i}`];
    if (ing && ing.trim()) ingredients.push({ name: ing.trim(), measure: meas ? meas.trim() : "" });
  }

  document.getElementById("modal-content").innerHTML = `
    <div class="modal-img-wrap">
      ${d.strDrinkThumb
        ? `<img class="modal-img" src="${d.strDrinkThumb}" alt="${d.strDrink}" />`
        : `<div class="modal-img-placeholder">🍹</div>`}
      <button class="modal-close" id="modal-close-btn" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <h2 class="modal-title" id="modal-title">${d.strDrink}</h2>
      <p class="modal-sub">${[d.strCategory, d.strAlcoholic, d.strGlass].filter(Boolean).join(" · ")}</p>
      ${ingredients.length > 0 ? `
        <p class="section-label">Ingredients</p>
        <div class="ingredient-list">
          ${ingredients.map(ing => `
            <div class="ingredient-row">
              <span class="ingredient-name">${ing.name}</span>
              <span class="ingredient-measure">${ing.measure}</span>
            </div>`).join("")}
        </div>` : ""}
      ${d.strInstructions ? `
        <p class="section-label">Instructions</p>
        <p class="recipe-instructions">${d.strInstructions}</p>` : ""}
    </div>`;

  const overlay = document.getElementById("modal-overlay");
  overlay.classList.add("open");
  document.getElementById("modal-close-btn").focus();
  document.body.style.overflow = "hidden";
  document.getElementById("modal-close-btn").addEventListener("click", closeModal);
}

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
  document.body.style.overflow = "";
}

/* ─────────────────────────────────────────────
   TABS
───────────────────────────────────────────── */
function initTabs() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const target = btn.dataset.tab;
      document.querySelectorAll(".tab-btn").forEach(b => {
        b.classList.remove("active");
        b.setAttribute("aria-selected", "false");
      });
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      btn.setAttribute("aria-selected", "true");
      document.getElementById(`panel-${target}`).classList.add("active");
    });
  });
}

/* ─────────────────────────────────────────────
   EVENTS
───────────────────────────────────────────── */
document.getElementById("pairing-btn").addEventListener("click", handlePairingSearch);

document.getElementById("food-input").addEventListener("keydown", e => {
  if (e.key === "Enter") handlePairingSearch();
});

document.getElementById("clear-btn").addEventListener("click", () => {
  document.getElementById("food-input").value = "";
  document.getElementById("pairing-results").innerHTML = emptyStateHTML();
  selectedCategory = null;
  document.querySelectorAll(".cat-btn").forEach(b => {
    b.classList.remove("selected");
    b.setAttribute("aria-selected", "false");
  });
  showToast("Cleared.");
});

document.getElementById("cocktail-search-btn").addEventListener("click", () => {
  const q = document.getElementById("cocktail-input").value.trim();
  if (!q) { showToast("Enter a cocktail name to search."); return; }
  searchCocktails(q);
});

document.getElementById("cocktail-input").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const q = document.getElementById("cocktail-input").value.trim();
    if (!q) { showToast("Enter a cocktail name."); return; }
    searchCocktails(q);
  }
});

document.getElementById("modal-overlay").addEventListener("click", e => {
  if (e.target === document.getElementById("modal-overlay")) closeModal();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

/* ─────────────────────────────────────────────
   THEME TOGGLE
───────────────────────────────────────────── */
function initTheme() {
  const btn = document.getElementById("theme-toggle");
  const stored = localStorage.getItem("theme");
  const isDark = stored === "dark";
  if (isDark) {
    document.documentElement.setAttribute("data-theme", "dark");
    btn.textContent = "Light";
    btn.setAttribute("aria-label", "Switch to light mode");
  }
  btn.addEventListener("click", () => {
    const currentlyDark = document.documentElement.getAttribute("data-theme") === "dark";
    if (currentlyDark) {
      document.documentElement.removeAttribute("data-theme");
      btn.textContent = "Dark";
      btn.setAttribute("aria-label", "Switch to dark mode");
      localStorage.setItem("theme", "light");
    } else {
      document.documentElement.setAttribute("data-theme", "dark");
      btn.textContent = "Light";
      btn.setAttribute("aria-label", "Switch to light mode");
      localStorage.setItem("theme", "dark");
    }
  });
}

/* ─────────────────────────────────────────────
   INIT
───────────────────────────────────────────── */
buildCategories();
initTabs();
initTheme();

let cocktailDefaultLoaded = false;
document.querySelector('[data-tab="cocktail"]').addEventListener("click", () => {
  if (!cocktailDefaultLoaded) {
    cocktailDefaultLoaded = true;
    document.getElementById("cocktail-input").value = "Margarita";
    searchCocktails("Margarita");
  }
});
</script>
</body>
</html>
