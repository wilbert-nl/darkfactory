<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PullList Pro — Comic Book Release Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap');

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1e1e1e;
      --border: rgba(255,255,255,0.08);
      --accent: #00c030;
      --accent2: #e8a020;
      --text: #ffffff;
      --muted: #9ca3af;
      --radius: 12px;
      --font-display: 'Bebas Neue', Impact, sans-serif;
      --font-body: 'Figtree', system-ui, sans-serif;
      --font-mono: 'DM Mono', monospace;
      --font: var(--font-body);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── SCROLLBAR ─── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ─── HEADER ─── */
    header {
      background: linear-gradient(135deg, #12151f 0%, #1a1d27 100%);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 64px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(168,85,247, 0.4);
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .logo-badge {
      font-size: 10px;
      background: var(--accent);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    nav {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .nav-btn:hover { background: var(--surface2); color: var(--text); }
    .nav-btn.active { background: var(--surface2); color: var(--accent); }

    .pull-count {
      background: var(--accent2);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
      display: inline-block;
    }

    /* ─── MAIN LAYOUT ─── */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ─── HERO BANNER ─── */
    .hero {
      background: linear-gradient(135deg, #1a1d27 0%, #22263a 50%, #1a1d27 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(108,99,255,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: 200px;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(255,101,132,0.1) 0%, transparent 70%);
      border-radius: 50%;
    }

    .hero h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--text), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: var(--muted);
      font-size: 15px;
      max-width: 540px;
      line-height: 1.6;
    }

    .hero-stats {
      display: flex;
      gap: 24px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .hero-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hero-stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .hero-stat-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ─── SECTION HEADER ─── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-icon {
      width: 32px;
      height: 32px;
      background: var(--surface2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* ─── FILTERS ─── */
    .filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 12px rgba(168,85,247,0.35);
    }

    .filter-btn.marvel.active { background: #e62429; border-color: #e62429; box-shadow: 0 0 12px rgba(230,36,41,0.35); }
    .filter-btn.dc.active { background: #0074e8; border-color: #0074e8; box-shadow: 0 0 12px rgba(0,116,232,0.35); }
    .filter-btn.image.active { background: #f7941d; border-color: #f7941d; box-shadow: 0 0 12px rgba(247,148,29,0.35); }
    .filter-btn.darkhorse.active { background: #cc3333; border-color: #cc3333; box-shadow: 0 0 12px rgba(204,51,51,0.35); }
    .filter-btn.boom.active { background: #5c3d99; border-color: #5c3d99; }
    .filter-btn.idw.active { background: #2c7bb0; border-color: #2c7bb0; }

    /* ─── COMIC GRID ─── */
    .comic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .comic-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.22s ease;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .comic-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(168,85,247,0.18);
    }

    .comic-card:focus-within {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .comic-cover {
      height: 180px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .comic-cover-art {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      position: relative;
    }

    .cover-gradient {
      position: absolute;
      inset: 0;
      opacity: 0.6;
    }

    .cover-emoji {
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    }

    .cover-issue-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      color: var(--yellow);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      z-index: 2;
      border: 1px solid rgba(247,201,72,0.3);
    }

    .cover-status-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      z-index: 2;
      letter-spacing: 0.5px;
    }

    .badge-this-week { background: var(--green); color: #0f2d24; }
    .badge-upcoming { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
    .badge-picked-up { background: var(--accent); color: #fff; }
    .badge-read { background: var(--muted); color: var(--surface); }

    .comic-info {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .comic-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
    }

    .comic-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .publisher-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.3px;
    }

    .pub-marvel { background: rgba(230,36,41,0.2); color: #ff6b6b; }
    .pub-dc { background: rgba(0,116,232,0.2); color: #6ab0ff; }
    .pub-image { background: rgba(247,148,29,0.2); color: #ffa94d; }
    .pub-dark-horse { background: rgba(204,51,51,0.15); color: #ff8080; }
    .pub-boom { background: rgba(92,61,153,0.2); color: #b794f4; }
    .pub-idw { background: rgba(44,123,176,0.2); color: #76c3e8; }

    .release-date {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .comic-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      flex: 1;
    }

    .comic-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .btn-sm {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-sm:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }

    .btn-sm.active-pull {
      background: rgba(168,85,247,0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-sm.picked-up {
      background: rgba(168,85,247,0.2);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-sm.read {
      background: rgba(67,217,173,0.15);
      border-color: var(--green);
      color: var(--green);
    }

    /* ─── WEEK HEADER ─── */
    .week-section { margin-bottom: 40px; }

    .week-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 12px;
      background: var(--surface2);
      border-radius: 8px;
      border-left: 3px solid var(--accent);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .week-count {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      background: rgba(168,85,247,0.1);
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* ─── PULL LIST VIEW ─── */
    .pull-list-container { display: flex; flex-direction: column; gap: 10px; }

    .pull-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.18s ease;
    }

    .pull-item:hover { border-color: var(--accent); }

    .pull-item-icon {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .pull-item-info { flex: 1; min-width: 0; }

    .pull-item-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pull-item-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pull-item-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .btn-icon {
      width: 32px;
      height: 32px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .btn-icon:hover { border-color: var(--accent2); color: var(--accent2); }
    .btn-icon.danger:hover { border-color: var(--accent2); background: rgba(255,101,132,0.1); }

    /* ─── EMPTY STATE ─── */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 56px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 14px;
      line-height: 1.6;
      max-width: 360px;
      margin: 0 auto 20px;
    }

    /* ─── TOAST ─── */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      padding: 12px 18px;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
      max-width: 340px;
      animation: toastIn 0.28s ease, toastOut 0.28s ease 2.4s forwards;
      pointer-events: none;
    }

    .toast.success { border-color: var(--green); }
    .toast.info { border-color: var(--accent); }
    .toast.warn { border-color: var(--yellow); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px) scale(0.95); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateX(0) scale(1); }
      to { opacity: 0; transform: translateX(20px) scale(0.95); }
    }

    /* ─── MODAL ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.96) translateY(12px);
      transition: transform 0.22s ease;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    }

    .modal-overlay.open .modal {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.3;
    }

    .modal-close {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.18s ease;
    }

    .modal-close:hover { border-color: var(--accent2); color: var(--accent2); }

    .modal-cover {
      width: 100%;
      height: 200px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      position: relative;
      overflow: hidden;
    }

    .modal-cover-bg {
      position: absolute;
      inset: 0;
      opacity: 0.5;
    }

    .modal-cover-emoji {
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.5));
    }

    .modal-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .modal-meta-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .modal-meta-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .modal-meta-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .modal-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-primary {
      flex: 1;
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 120px;
    }

    .btn-primary:hover { background: #9333ea; box-shadow: 0 0 20px rgba(168,85,247,0.4); }

    .btn-secondary {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 120px;
    }

    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    .btn-danger {
      background: rgba(244,63,94,0.15);
      border: 1px solid rgba(244,63,94,0.3);
      color: var(--accent2);
    }

    .btn-danger:hover { background: rgba(244,63,94,0.25); border-color: var(--accent2); color: var(--accent2); }

    /* ─── EXPORT BTN ─── */
    .export-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .export-btn:hover { border-color: var(--green); color: var(--green); }

    /* ─── SEARCH ─── */
    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 300px;
    }

    .search-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      padding: 8px 12px 8px 36px;
      border-radius: 8px;
      outline: none;
      transition: all 0.18s ease;
      font-family: var(--font);
    }

    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--accent); }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 15px;
      pointer-events: none;
    }

    /* ─── CALENDAR VIEW ─── */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .calendar-week {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .calendar-week-header {
      background: var(--surface2);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .calendar-week-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .calendar-week-date {
      font-size: 12px;
      color: var(--muted);
    }

    .calendar-week-items { padding: 12px; display: flex; flex-direction: column; gap: 8px; }

    .calendar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .calendar-item:hover { border-color: var(--accent); }

    .calendar-item-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .calendar-item-info { flex: 1; min-width: 0; }

    .calendar-item-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .calendar-item-sub {
      font-size: 11px;
      color: var(--muted);
    }

    /* ─── PAGE TRANSITIONS ─── */
    .page { display: none; }
    .page.active {
      display: block;
      animation: fadeIn 0.22s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 640px) {
      .header-inner { gap: 8px; }
      .logo-text { display: none; }
      .nav-btn span.label { display: none; }
      main { padding: 16px; }
      .hero { padding: 20px; }
      .hero h1 { font-size: 22px; }
      .comic-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      .comic-cover { height: 130px; }
      .modal-meta-grid { grid-template-columns: 1fr; }
    }

    /* ─── SHIMMER LOADING ─── */
    .shimmer {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ─── PULL LIST SIDEBAR STATUS ─── */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-pending { background: var(--yellow); }
    .dot-picked { background: var(--accent); }
    .dot-read { background: var(--green); }

    /* ─── STATS BAR ─── */
    .stats-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      flex: 1;
      min-width: 120px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 0.18s ease;
    }

    .stat-card:hover { border-color: var(--accent); }

    .stat-card-value {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .stat-card-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    /* ─── NO RESULTS ─── */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
      font-size: 15px;
    }

    /* === Film/Books v2 Design System === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      line-height: 1.6;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 700px 500px at 50% -5%, rgba(0,192,48,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    body > * { position: relative; z-index: 1; }

    h1 { font-family: var(--font-display); font-size: clamp(2.5rem, 6vw, 4rem); letter-spacing: 0.02em; color: var(--text); line-height: 1; }
    h2 { font-family: var(--font-display); font-size: clamp(1.5rem, 3vw, 2rem); letter-spacing: 0.04em; color: var(--accent2); }
    h3 { font-family: var(--font-body); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }

    .container, main, .wrapper, .app { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }

    .card, .result, .item, .movie, .book, .show, .comic, .series, .reading, .pick,
    [class*="card"], [class*="item"], [class*="result"], [class*="movie"], [class*="book"] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      transition: transform 0.2s, background 0.2s;
      animation: mediaFade 0.4s ease both;
    }
    .card:hover, .item:hover, [class*="card"]:hover { transform: translateY(-2px); background: var(--surface2); }

    input, select, textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem 1rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      width: 100%;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent2); }

    button, .btn, input[type="submit"], input[type="button"] {
      background: var(--accent2);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 0.75rem 2rem;
      font-family: var(--font-body);
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
    }
    button:hover { transform: scale(1.02); filter: brightness(1.1); }
    button:active { transform: scale(0.97); }

    .tag, .badge, .genre, .category, .label, .format, .status {
      display: inline-block;
      background: rgba(232,160,32,0.12);
      border: 1px solid rgba(232,160,32,0.25);
      color: var(--accent2);
      border-radius: 4px;
      padding: 0.15rem 0.6rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .rating, .score, .pages, .runtime {
      font-family: var(--font-mono);
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--accent2);
    }

    /* Star rating */
    .stars, .rating-stars { color: var(--accent2); letter-spacing: 0.1em; }

    table { width: 100%; border-collapse: collapse; }
    th { padding: 0.5rem 1rem; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; border-bottom: 1px solid var(--border); }
    td { padding: 0.6rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.04); }

    @keyframes mediaFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>

  const d = new Date();
  const day = d.getDay(); // 0=Sun, 3=Wed
  const daysToWed = (3 - day + 7) % 7;
  d.setDate(d.getDate() + (weeksAhead === 0 ? (daysToWed === 0 ? 0 : daysToWed) : daysToWed + weeksAhead * 7));
  d.setHours(0, 0, 0, 0);
  return d;
}

// ─── STATE ─────────────────────────────────────────────────────────────────

function loadState() {
  try {
    return JSON.parse(localStorage.getItem('pulllist-state') || '{}');
  } catch (e) {
    return {};
  }
}

function saveState(state) {
  try {
    localStorage.setItem('pulllist-state', JSON.stringify(state));
  } catch (e) {
    // storage unavailable
  }
}

let state = loadState();
// { [comicId]: { pulled: bool, pickedUp: bool, read: bool } }

function getComicState(id) {
  return state[id] || { pulled: false, pickedUp: false, read: false };
}

function updateComicState(id, updates) {
  state[id] = Object.assign({}, getComicState(id), updates);
  saveState(state);
}

// ─── FILTERS ────────────────────────────────────────────────────────────────

const activeFilters = { 'this-week': 'All', 'upcoming': 'All' };

function setFilter(page, publisher) {
  activeFilters[page] = publisher;
  const container = document.getElementById(`${page}-filters`);
  if (!container) return;
  container.querySelectorAll('.filter-btn').forEach(btn => {
    const active = btn.textContent.trim() === publisher;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', String(active));
  });
  if (page === 'this-week') renderThisWeek();
  else renderUpcoming();
}

// ─── UTILS ──────────────────────────────────────────────────────────────────

function pubClass(publisher) {
  const map = {
    'Marvel': 'pub-marvel',
    'DC': 'pub-dc',
    'Image': 'pub-image',
    'Dark Horse': 'pub-dark-horse',
    'BOOM!': 'pub-boom',
    'IDW': 'pub-idw'
  };
  return map[publisher] || 'pub-marvel';
}

function weekLabel(date) {
  return `Week of ${fmt(date)}`;
}

function isThisWeek(comic) {
  return comic.releaseDate.getTime() === W0.getTime();
}

function filterComics(comics, publisher) {
  if (publisher === 'All') return comics;
  return comics.filter(c => c.publisher === publisher);
}

// ─── TOAST ──────────────────────────────────────────────────────────────────

function toast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success: '✅', info: 'ℹ️', warn: '⚠️' };
  el.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

// ─── CARD RENDERING ─────────────────────────────────────────────────────────

function renderCard(comic, role = 'listitem') {
  const cs = getComicState(comic.id);
  const thisWeek = isThisWeek(comic);

  let statusClass = 'badge-upcoming';
  let statusLabel = 'Upcoming';
  if (cs.read) { statusClass = 'badge-read'; statusLabel = 'Read'; }
  else if (cs.pickedUp) { statusClass = 'badge-picked-up'; statusLabel = 'Picked Up'; }
  else if (thisWeek) { statusClass = 'badge-this-week'; statusLabel = 'This Week'; }

  const card = document.createElement('article');
  card.className = 'comic-card';
  card.setAttribute('role', role);
  card.setAttribute('tabindex', '0');
  card.setAttribute('aria-label', `${comic.title}, ${comic.publisher}`);
  card.dataset.id = comic.id;

  card.innerHTML = `
    <div class="comic-cover">
      <div class="comic-cover-art">
        <div class="cover-gradient" style="background:${comic.coverGradient}"></div>
        <span class="cover-emoji">${comic.emoji}</span>
      </div>
      <span class="cover-issue-badge">#${comic.issue}</span>
      <span class="cover-status-badge ${statusClass}">${statusLabel}</span>
    </div>
    <div class="comic-info">
      <div class="comic-title">${comic.title}</div>
      <div class="comic-meta">
        <span class="publisher-tag ${pubClass(comic.publisher)}">${comic.publisher}</span>
        <span class="release-date">📅 ${fmt(comic.releaseDate)}</span>
      </div>
      <p class="comic-desc">${comic.desc.substring(0, 90)}…</p>
      <div class="comic-actions">
        <button class="btn-sm ${cs.pulled ? 'active-pull' : ''}"
                aria-label="${cs.pulled ? `Remove ${comic.title} from pull list` : `Add ${comic.title} to pull list`}"
                onclick="togglePull('${comic.id}', event)">
          ${cs.pulled ? '⭐ Pulling' : '☆ Pull'}
        </button>
        ${thisWeek ? `<button class="btn-sm ${cs.pickedUp ? 'picked-up' : ''} ${cs.read ? 'read' : ''}"
                aria-label="${cs.read ? 'Mark as unread' : cs.pickedUp ? 'Mark as read' : 'Mark as picked up'}"
                onclick="cycleStatus('${comic.id}', event)">
          ${cs.read ? '✅ Read' : cs.pickedUp ? '📦 Picked Up' : '🛒 Pick Up'}
        </button>` : ''}
      </div>
    </div>
  `;

  card.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    openModal(comic.id);
  });

  card.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.target.closest('button')) openModal(comic.id);
  });

  return card;
}

// ─── THIS WEEK RENDER ────────────────────────────────────────────────────────

function renderThisWeek() {
  const grid = document.getElementById('this-week-grid');
  const thisWeekComics = COMICS.filter(c => isThisWeek(c));
  const filtered = filterComics(thisWeekComics, activeFilters['this-week']);

  grid.innerHTML = '';

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="no-results" role="status">No releases found for this publisher this week.</div>`;
  } else {
    filtered.forEach(c => grid.appendChild(renderCard(c)));
  }

  // Update stats
  const pullCount = thisWeekComics.filter(c => getComicState(c.id).pulled).length;
  const pickedCount = thisWeekComics.filter(c => getComicState(c.id).pickedUp || getComicState(c.id).read).length;
  document.getElementById('stat-this-week-count').textContent = thisWeekComics.length;
  document.getElementById('stat-on-pull').textContent = pullCount;
  document.getElementById('stat-picked-up').textContent = pickedCount;
  document.getElementById('this-week-label').textContent = `This Week — ${fmt(W0)}`;
}

// ─── UPCOMING RENDER ─────────────────────────────────────────────────────────

function renderUpcoming() {
  const container = document.getElementById('upcoming-weeks');
  container.innerHTML = '';
  const upcomingWeeks = [
    { date: W1, label: 'Week 1' },
    { date: W2, label: 'Week 2' },
    { date: W3, label: 'Week 3' },
    { date: W4, label: 'Week 4' }
  ];

  upcomingWeeks.forEach(({ date, label }) => {
    const weekComics = COMICS.filter(c => c.releaseDate.getTime() === date.getTime());
    const filtered = filterComics(weekComics, activeFilters['upcoming']);
    if (filtered.length === 0 && activeFilters['upcoming'] !== 'All') return;

    const section = document.createElement('div');
    section.className = 'week-section';
    section.innerHTML = `
      <div class="week-label">
        <span>${label} — ${fmt(date)}</span>
        <span class="week-count">${filtered.length} issue${filtered.length !== 1 ? 's' : ''}</span>
      </div>
    `;

    if (filtered.length === 0) {
      section.innerHTML += `<div class="no-results" role="status">No releases for this publisher.</div>`;
    } else {
      const grid = document.createElement('div');
      grid.className = 'comic-grid';
      grid.setAttribute('role', 'list');
      filtered.forEach(c => grid.appendChild(renderCard(c)));
      section.appendChild(grid);
    }

    container.appendChild(section);
  });

  if (container.children.length === 0) {
    container.innerHTML = `<div class="no-results" role="status">No upcoming releases found for this publisher.</div>`;
  }
}

// ─── PULL LIST RENDER ─────────────────────────────────────────────────────────

function renderPullList() {
  const container = document.getElementById('pull-list-items');
  const statsBar = document.getElementById('pull-stats-bar');

  const pulled = COMICS.filter(c => getComicState(c.id).pulled);
  const readCount = pulled.filter(c => getComicState(c.id).read).length;
  const pickedCount = pulled.filter(c => getComicState(c.id).pickedUp && !getComicState(c.id).read).length;
  const pendingCount = pulled.length - readCount - pickedCount;

  // Stats bar
  statsBar.innerHTML = `
    <div class="stat-card">
      <span class="stat-card-value" style="color:var(--accent)">${pulled.length}</span>
      <span class="stat-card-label">On Pull List</span>
    </div>
    <div class="stat-card">
      <span class="stat-card-value" style="color:var(--yellow)">${pendingCount}</span>
      <span class="stat-card-label">Pending Pickup</span>
    </div>
    <div class="stat-card">
      <span class="stat-card-value" style="color:var(--accent2)">${pickedCount}</span>
      <span class="stat-card-label">Picked Up</span>
    </div>
    <div class="stat-card">
      <span class="stat-card-value" style="color:var(--green)">${readCount}</span>
      <span class="stat-card-label">Read</span>
    </div>
  `;

  // Update badge
  document.getElementById('pull-count-badge').textContent = pulled.length;

  container.innerHTML = '';

  if (pulled.length === 0) {
    container.innerHTML = `
      <div class="empty-state" role="status">
        <div class="empty-state-icon">📋</div>
        <h3>Your pull list is empty</h3>
        <p>Browse this week's releases or the upcoming calendar and tap <strong>☆ Pull</strong> to add issues.</p>
      </div>
    `;
    return;
  }

  // Sort: pending first, then picked up, then read
  const sorted = [...pulled].sort((a, b) => {
    const as = getComicState(a.id);
    const bs = getComicState(b.id);
    const score = cs => cs.read ? 2 : cs.pickedUp ? 1 : 0;
    return score(as) - score(bs);
  });

  sorted.forEach(comic => {
    const cs = getComicState(comic.id);
    let dotClass = 'dot-pending';
    let statusText = 'Pending Pickup';
    if (cs.read) { dotClass = 'dot-read'; statusText = 'Read'; }
    else if (cs.pickedUp) { dotClass = 'dot-picked'; statusText = 'Picked Up'; }

    const item = document.createElement('div');
    item.className = 'pull-item';
    item.setAttribute('role', 'listitem');
    item.innerHTML = `
      <div class="pull-item-icon" style="background:${comic.coverGradient}">
        ${comic.emoji}
      </div>
      <div class="pull-item-info">
        <div class="pull-item-title">${comic.title}</div>
        <div class="pull-item-meta">
          <span class="publisher-tag ${pubClass(comic.publisher)}">${comic.publisher}</span>
          <span>📅 ${fmt(comic.releaseDate)}</span>
          <span class="status-dot ${dotClass}" title="${statusText}"></span>
          <span>${statusText}</span>
        </div>
      </div>
      <div class="pull-item-actions">
        <button class="btn-icon" onclick="cycleStatus('${comic.id}')"
                title="${cs.read ? 'Mark unread' : cs.pickedUp ? 'Mark as read' : 'Mark as picked up'}"
                aria-label="${cs.read ? 'Mark unread' : cs.pickedUp ? 'Mark as read' : 'Mark as picked up'}">
          ${cs.read ? '🔄' : cs.pickedUp ? '✅' : '📦'}
        </button>
        <button class="btn-icon danger" onclick="togglePull('${comic.id}')"
                title="Remove from pull list"
                aria-label="Remove ${comic.title} from pull list">
          ✕
        </button>
      </div>
    `;
    item.addEventListener('click', e => {
      if (e.target.closest('button')) return;
      openModal(comic.id);
    });
    container.appendChild(item);
  });
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────

function togglePull(id, event) {
  if (event) event.stopPropagation();
  const cs = getComicState(id);
  const comic = COMICS.find(c => c.id === id);
  if (!comic) return;

  updateComicState(id, { pulled: !cs.pulled });
  const nowPulled = getComicState(id).pulled;
  toast(nowPulled ? `Added ${comic.series} #${comic.issue} to pull list` : `Removed from pull list`, nowPulled ? 'success' : 'warn');
  refreshAll();
}

function cycleStatus(id, event) {
  if (event) event.stopPropagation();
  const cs = getComicState(id);
  const comic = COMICS.find(c => c.id === id);
  if (!comic) return;

  if (!cs.pickedUp && !cs.read) {
    updateComicState(id, { pickedUp: true, read: false });
    toast(`Marked as picked up!`, 'success');
  } else if (cs.pickedUp && !cs.read) {
    updateComicState(id, { pickedUp: true, read: true });
    toast(`Marked as read!`, 'success');
  } else {
    updateComicState(id, { pickedUp: false, read: false });
    toast(`Reset to pending`, 'info');
  }
  refreshAll();
}

// ─── MODAL ───────────────────────────────────────────────────────────────────

let currentModalId = null;

function openModal(id) {
  const comic = COMICS.find(c => c.id === id);
  if (!comic) return;
  currentModalId = id;
  const cs = getComicState(id);

  document.getElementById('modal-title-text').textContent = comic.title;
  document.getElementById('modal-cover-bg').style.background = comic.coverGradient;
  document.getElementById('modal-cover-emoji').textContent = comic.emoji;
  document.getElementById('modal-desc').textContent = comic.desc;

  document.getElementById('modal-meta-grid').innerHTML = `
    <div class="modal-meta-item">
      <div class="modal-meta-label">Publisher</div>
      <div class="modal-meta-value">${comic.publisher}</div>
    </div>
    <div class="modal-meta-item">
      <div class="modal-meta-label">Release Date</div>
      <div class="modal-meta-value">${fmt(comic.releaseDate)}</div>
    </div>
    <div class="modal-meta-item">
      <div class="modal-meta-label">Issue</div>
      <div class="modal-meta-value">#${comic.issue}</div>
    </div>
    <div class="modal-meta-item">
      <div class="modal-meta-label">Cover Price</div>
      <div class="modal-meta-value">${comic.price}</div>
    </div>
    <div class="modal-meta-item" style="grid-column:1/-1">
      <div class="modal-meta-label">Creators</div>
      <div class="modal-meta-value">${comic.creators}</div>
    </div>
  `;

  renderModalActions(id);

  const overlay = document.getElementById('modal-overlay');
  overlay.classList.add('open');
  overlay.querySelector('.modal-close').focus();
  document.body.style.overflow = 'hidden';
}

function renderModalActions(id) {
  const comic = COMICS.find(c => c.id === id);
  if (!comic) return;
  const cs = getComicState(id);
  const thisWeek = isThisWeek(comic);

  const actionsEl = document.getElementById('modal-actions');
  actionsEl.innerHTML = '';

  const pullBtn = document.createElement('button');
  pullBtn.className = `btn-primary ${cs.pulled ? '' : ''}`;
  pullBtn.innerHTML = cs.pulled ? `⭐ On Pull List` : `☆ Add to Pull List`;
  pullBtn.setAttribute('aria-label', cs.pulled ? 'Remove from pull list' : 'Add to pull list');
  if (cs.pulled) pullBtn.style.background = 'var(--surface2)';
  pullBtn.addEventListener('click', () => {
    togglePull(id);
    renderModalActions(id);
  });
  actionsEl.appendChild(pullBtn);

  if (thisWeek) {
    const statusBtn = document.createElement('button');
    statusBtn.className = 'btn-secondary';
    statusBtn.innerHTML = cs.read ? `🔄 Mark Unread` : cs.pickedUp ? `✅ Mark Read` : `📦 Mark Picked Up`;
    statusBtn.setAttribute('aria-label', cs.read ? 'Mark as unread' : cs.pickedUp ? 'Mark as read' : 'Mark as picked up');
    statusBtn.addEventListener('click', () => {
      cycleStatus(id);
      renderModalActions(id);
    });
    actionsEl.appendChild(statusBtn);
  }
}

function closeModal() {
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  currentModalId = null;
}

function handleModalOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ─── EXPORT ──────────────────────────────────────────────────────────────────

function exportPullList() {
  const pulled = COMICS.filter(c => getComicState(c.id).pulled);
  if (pulled.length === 0) {
    toast('Your pull list is empty — nothing to export!', 'warn');
    return;
  }

  const lines = [
    `PullList Pro — My Pull List`,
    `Exported: ${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`,
    ``,
    ...pulled.map(c => {
      const cs = getComicState(c.id);
      const status = cs.read ? '[READ]' : cs.pickedUp ? '[PICKED UP]' : '[PENDING]';
      return `${status} ${c.title} — ${c.publisher} — ${fmt(c.releaseDate)} — ${c.price}`;
    }),
    ``,
    `Total: ${pulled.length} issue${pulled.length !== 1 ? 's' : ''}`
  ];

  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pulllist-${new Date().toISOString().slice(0, 10)}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(`Pull list exported (${pulled.length} issues)`, 'success');
}

// ─── PAGE ROUTING ─────────────────────────────────────────────────────────────

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.remove('active');
    b.removeAttribute('aria-current');
  });

  const page = document.getElementById(`page-${name}`);
  const btn = document.getElementById(`nav-${name}`);
  if (page) page.classList.add('active');
  if (btn) { btn.classList.add('active'); btn.setAttribute('aria-current', 'page'); }

  if (name === 'pull-list') renderPullList();
  if (name === 'upcoming') renderUpcoming();
}

// ─── REFRESH ALL ──────────────────────────────────────────────────────────────

function refreshAll() {
  renderThisWeek();
  // Only re-render other views if they're active
  const activePage = document.querySelector('.page.active');
  if (activePage && activePage.id === 'page-upcoming') renderUpcoming();
  if (activePage && activePage.id === 'page-pull-list') renderPullList();

  // Always keep pull count badge fresh
  const pulled = COMICS.filter(c => getComicState(c.id).pulled);
  document.getElementById('pull-count-badge').textContent = pulled.length;

  // Refresh modal actions if open
  if (currentModalId) renderModalActions(currentModalId);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

function init() {
  renderThisWeek();
  const pulled = COMICS.filter(c => getComicState(c.id).pulled);
  document.getElementById('pull-count-badge').textContent = pulled.length;
}

init();
</script>
