<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Release Tracker — Merch Store Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Workbench · theme: Hum · nav: N9 */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow-x: clip; }
body {
  height: 100%;
  overflow: hidden;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ── N9 Fixed Nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 300;
  height: 52px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}

.nav-logo {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.nav-logo-icon {
  font-size: 1.2rem;
  line-height: 1;
}
.nav-logo span { color: var(--color-accent); }

.nav-sep {
  width: 1px;
  height: 16px;
  background: var(--color-border);
  flex-shrink: 0;
}

.nav-page-label {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
  white-space: nowrap;
}

.nav-watchlist-badge {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-1) var(--space-3);
  white-space: nowrap;
  cursor: pointer;
  transition: border-color 0.15s var(--ease-out), color 0.15s var(--ease-out);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.nav-watchlist-badge:hover { border-color: var(--color-accent-line); color: var(--color-ink); }
.nav-watchlist-badge .badge-count {
  background: var(--color-accent);
  color: var(--color-paper);
  border-radius: 999px;
  padding: 0 var(--space-2);
  font-size: 0.65rem;
  font-weight: 700;
  min-width: 18px;
  text-align: center;
  line-height: 1.6;
}

.nav-back {
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
  transition: color 0.15s var(--ease-out);
}
.nav-back:hover { color: var(--color-ink); }

/* ── App shell ── */
.app-shell {
  display: grid;
  grid-template-columns: 260px 1fr;
  margin-top: 52px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--color-border);
  background: var(--color-paper-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-section {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}

.sidebar-section-label {
  font-size: var(--text-xs);
  font-weight: 700;
  color: var(--color-ink-muted);
  margin-bottom: var(--space-3);
  display: block;
  border-left: 2px solid var(--color-accent);
  padding-left: var(--space-2);
}

/* Season selector */
.season-tabs {
  display: flex;
  gap: var(--space-1);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 3px;
}

.season-tab {
  flex: 1;
  padding: var(--space-2) var(--space-3);
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--color-ink-muted);
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s var(--ease-out), color 0.15s var(--ease-out);
  white-space: nowrap;
  text-align: center;
}
.season-tab:hover { color: var(--color-ink); background: var(--color-paper-2); }
.season-tab.active { background: var(--color-accent); color: var(--color-paper); }

/* Day filter */
.day-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
}

.day-chip {
  padding: var(--space-1) var(--space-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-paper);
  color: var(--color-ink-muted);
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s var(--ease-out);
}
.day-chip:hover { border-color: var(--color-accent-line); color: var(--color-ink); }
.day-chip.active { background: var(--color-accent-subtle); border-color: var(--color-accent-line); color: var(--color-accent); }

/* Genre chips */
.genre-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
}

.genre-chip {
  padding: var(--space-1) var(--space-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-paper);
  color: var(--color-ink-muted);
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s var(--ease-out);
}
.genre-chip:hover { border-color: var(--color-accent-line); color: var(--color-ink); }
.genre-chip.active { background: var(--color-accent-subtle); border-color: var(--color-accent-line); color: var(--color-accent); }

/* Search input */
.search-wrap {
  position: relative;
}
.search-icon {
  position: absolute;
  left: var(--space-3);
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-ink-muted);
  pointer-events: none;
  width: 14px;
  height: 14px;
}
.search-input {
  width: 100%;
  padding: var(--space-2) var(--space-3) var(--space-2) calc(var(--space-3) + 20px);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  transition: border-color 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out);
}
.search-input:focus {
  outline: none;
  border-color: var(--color-accent-line);
  box-shadow: 0 0 0 3px oklch(66% 0.18 235 / 0.10);
}
.search-input::placeholder { color: var(--color-ink-muted); }

/* Watchlist panel in sidebar */
.sidebar-watchlist {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.sidebar-watchlist-head {
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.sidebar-watchlist-title {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-ink);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.wl-count-badge {
  background: var(--color-accent);
  color: var(--color-paper);
  border-radius: 999px;
  padding: 0 var(--space-2);
  font-size: 0.65rem;
  font-weight: 700;
  min-width: 18px;
  text-align: center;
  line-height: 1.7;
}

.sidebar-watchlist-list {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-2) 0;
}

.sidebar-wl-empty {
  padding: var(--space-8) var(--space-4);
  text-align: center;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  line-height: 1.7;
}

.sidebar-wl-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-4);
  cursor: pointer;
  transition: background 0.12s var(--ease-out);
}
.sidebar-wl-item:hover { background: var(--color-paper-3); }

.sidebar-wl-thumb {
  width: 36px;
  height: 50px;
  border-radius: var(--radius-sm);
  object-fit: cover;
  flex-shrink: 0;
  background: var(--color-border);
}

.sidebar-wl-thumb-placeholder {
  width: 36px;
  height: 50px;
  border-radius: var(--radius-sm);
  background: var(--color-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
}

.sidebar-wl-info { flex: 1; min-width: 0; }
.sidebar-wl-title {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
  margin-bottom: 2px;
}
.sidebar-wl-meta {
  font-size: 0.65rem;
  color: var(--color-ink-muted);
}

.btn-wl-remove {
  width: 20px;
  height: 20px;
  border: none;
  background: transparent;
  color: var(--color-ink-muted);
  cursor: pointer;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  flex-shrink: 0;
  transition: color 0.12s var(--ease-out), background 0.12s var(--ease-out);
}
.btn-wl-remove:hover { color: var(--color-danger); background: oklch(55% 0.20 25 / 0.08); }

/* ── Main panel ── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-paper);
}

/* Section tabs */
.main-tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--color-border);
  padding: 0 var(--space-6);
  flex-shrink: 0;
  background: var(--color-paper);
}

.main-tab {
  padding: var(--space-3) var(--space-4);
  border: none;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--color-ink-muted);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  cursor: pointer;
  transition: color 0.15s var(--ease-out), border-color 0.15s var(--ease-out);
  white-space: nowrap;
  margin-bottom: -1px;
}
.main-tab:hover { color: var(--color-ink); }
.main-tab.active { color: var(--color-accent); border-bottom-color: var(--color-accent); }

/* Panel area */
.panel-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6);
}

.panel { display: none; }
.panel.active { display: block; animation: panel-fade 0.2s var(--ease-out); }

@keyframes panel-fade {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Panel header */
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-6);
}

.panel-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--color-success);
  animation: pulse-dot 2s var(--ease-in-out) infinite;
  flex-shrink: 0;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

.panel-count {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
}

/* Anime card grid */
.anime-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--space-4);
}

/* Staggered card entrance */
.anime-card { --card-index: 0; }
.anime-card { animation: card-in 0.35s var(--ease-out) calc(var(--card-index) * 40ms) both; }
@keyframes card-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Anime card */
.anime-card {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out), border-color 0.2s var(--ease-out);
  display: flex;
  flex-direction: column;
  position: relative;
}
.anime-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px oklch(18% 0.04 155 / 0.10);
  border-color: var(--color-accent-line);
}
.anime-card:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}
.anime-card.in-watchlist { border-color: var(--color-accent-line); }

/* Card poster */
.card-poster {
  position: relative;
  width: 100%;
  padding-top: 133%; /* 3:4 ratio */
  overflow: hidden;
  background: var(--color-paper-2);
}
.card-poster img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s var(--ease-out);
}
.anime-card:hover .card-poster img { transform: scale(1.04); }
.card-poster-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  color: var(--color-border);
}

/* Score badge */
.card-score {
  position: absolute;
  top: var(--space-2);
  right: var(--space-2);
  border-radius: var(--radius-sm);
  padding: 2px 6px;
  font-size: var(--text-xs);
  font-weight: 700;
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  gap: 3px;
}
.score-green { background: oklch(55% 0.14 155 / 0.9); color: var(--color-white); }
.score-amber { background: oklch(62% 0.15 72 / 0.9); color: var(--color-white); }
.score-red { background: oklch(55% 0.20 25 / 0.9); color: var(--color-white); }
.score-none { background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.7); }

/* Status badge */
.card-status {
  position: absolute;
  top: var(--space-2);
  left: var(--space-2);
  border-radius: var(--radius-sm);
  padding: 2px 6px;
  font-size: 0.6rem;
  font-weight: 700;
  backdrop-filter: blur(4px);
}
.status-airing { background: oklch(55% 0.14 155 / 0.85); color: var(--color-white); }
.status-upcoming { background: oklch(62% 0.15 72 / 0.85); color: var(--color-white); }

/* Hover overlay with actions */
.card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, oklch(18% 0.04 155 / 0.92) 0%, oklch(18% 0.04 155 / 0.3) 50%, transparent 100%);
  opacity: 0;
  transition: opacity 0.2s var(--ease-out);
  display: flex;
  align-items: flex-end;
  padding: var(--space-3);
}
.anime-card:hover .card-overlay { opacity: 1; }
.card-overlay-actions { display: flex; gap: var(--space-2); width: 100%; }

.btn-card-action {
  flex: 1;
  padding: var(--space-2) var(--space-2);
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 0.7rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s var(--ease-out);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
}
.btn-card-watchlist { background: var(--color-accent); color: var(--color-paper); }
.btn-card-watchlist:hover { filter: brightness(1.1); }
.btn-card-watchlist.added { background: oklch(55% 0.14 155 / 0.85); }
.btn-card-details { background: oklch(100% 0 0 / 0.15); color: var(--color-white); border: 1px solid oklch(100% 0 0 / 0.3); }
.btn-card-details:hover { background: oklch(100% 0 0 / 0.25); }

/* Card body */
.card-body {
  padding: var(--space-3);
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.card-title {
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--color-ink);
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-genres {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
}

.genre-tag {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 1px 6px;
  font-size: 0.65rem;
  color: var(--color-ink-muted);
  font-weight: 500;
}

.card-meta {
  margin-top: auto;
  padding-top: var(--space-2);
  border-top: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}

.card-eps { font-weight: 600; color: var(--color-accent); }

.card-air-day {
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--color-ink-muted);
}

/* Schedule day groups */
.schedule-day-group { margin-bottom: var(--space-8); }
.schedule-day-header {
  font-size: var(--text-xs);
  font-weight: 700;
  color: var(--color-ink-muted);
  padding-bottom: var(--space-3);
  margin-bottom: var(--space-4);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  border-left: 2px solid var(--color-accent);
  padding-left: var(--space-2);
}
.schedule-day-header .day-count {
  background: var(--color-accent-subtle);
  color: var(--color-accent);
  border-radius: 999px;
  padding: 1px var(--space-2);
  font-size: 0.65rem;
  font-weight: 700;
}

/* Loading state */
.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-16);
  gap: var(--space-4);
  color: var(--color-ink-muted);
}
.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--color-border);
  border-top-color: var(--color-accent);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-state p { font-size: var(--text-sm); }

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-16) var(--space-8);
  text-align: center;
  color: var(--color-ink-muted);
  gap: var(--space-3);
}
.empty-icon { font-size: 3rem; }
.empty-title { font-size: var(--text-lg); font-weight: 600; color: var(--color-ink); }
.empty-sub { font-size: var(--text-sm); max-width: 280px; line-height: 1.65; }

/* Error state */
.error-state {
  background: oklch(55% 0.20 25 / 0.06);
  border: 1px solid oklch(55% 0.20 25 / 0.25);
  border-radius: var(--radius-lg);
  padding: var(--space-8);
  text-align: center;
  color: var(--color-danger);
}
.error-state h3 { margin-bottom: var(--space-2); }
.error-state p { font-size: var(--text-sm); color: var(--color-ink-muted); margin-bottom: var(--space-4); }

.btn-retry {
  padding: var(--space-2) var(--space-6);
  background: var(--color-danger);
  color: var(--color-white);
  border: none;
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s var(--ease-out);
}
.btn-retry:hover { opacity: 0.85; }

/* Detail Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: oklch(0% 0 0 / 0.55);
  z-index: 400;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-6);
  animation: backdrop-in 0.2s var(--ease-out);
}
@keyframes backdrop-in { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 640px;
  max-height: 88vh;
  overflow-y: auto;
  animation: modal-up 0.25s var(--ease-out);
  position: relative;
  box-shadow: 0 24px 64px oklch(20% 0.012 250 / 0.20);
}
@keyframes modal-up {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-close {
  position: absolute;
  top: var(--space-4);
  right: var(--space-4);
  width: 32px;
  height: 32px;
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-ink-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--text-lg);
  line-height: 1;
  transition: all 0.15s var(--ease-out);
  z-index: 10;
}
.modal-close:hover { color: var(--color-ink); border-color: var(--color-accent-line); }

.modal-hero {
  position: relative;
  height: 200px;
  overflow: hidden;
  background: var(--color-paper-2);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}
.modal-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.5);
}
.modal-hero-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, var(--color-paper) 0%, transparent 60%);
}
.modal-hero-content {
  position: absolute;
  bottom: var(--space-4);
  left: var(--space-6);
  right: 3rem;
}
.modal-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 500;
  color: var(--color-ink);
  line-height: 1.2;
  letter-spacing: -0.02em;
}
.modal-title-en {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  margin-top: var(--space-1);
}

.modal-body { padding: var(--space-6); }

.modal-stats {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.stat-chip {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 72px;
}
.stat-val {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 500;
  color: var(--color-ink);
  line-height: 1;
}
.stat-val.green { color: var(--color-success); }
.stat-val.amber { color: var(--color-warn); }
.stat-val.red { color: var(--color-danger); }
.stat-val.accent { color: var(--color-accent); }
.stat-label {
  font-size: 0.65rem;
  color: var(--color-ink-muted);
  font-weight: 600;
}

.modal-synopsis {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  line-height: 1.75;
  margin-bottom: var(--space-4);
}

.modal-genres {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-6);
}

.modal-genre-tag {
  background: var(--color-accent-subtle);
  border: 1px solid var(--color-accent-line);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-3);
  font-size: var(--text-xs);
  color: var(--color-accent);
  font-weight: 600;
}

.modal-footer {
  display: flex;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-6);
  background: var(--color-accent);
  color: var(--color-paper);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 700;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px oklch(66% 0.18 235 / 0.28);
}
.btn-primary:active { transform: translateY(0); box-shadow: none; }
.btn-primary.added { background: var(--color-success); }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  background: var(--color-paper-2);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  cursor: pointer;
  text-decoration: none;
  transition: border-color 0.15s var(--ease-out), color 0.15s var(--ease-out);
}
.btn-secondary:hover { border-color: var(--color-accent-line); color: var(--color-accent); }

/* Toast */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 500;
  background: var(--color-ink);
  color: var(--color-paper);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px oklch(20% 0.012 250 / 0.20);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.2s var(--ease-out), transform 0.2s var(--ease-out);
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  max-width: 320px;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--color-success); }
.toast.warning { background: var(--color-warn); }
.toast.error { background: var(--color-danger); }

/* ── Mobile responsive ── */
@media (max-width: 768px) {
  html, body { overflow: auto; height: auto; }

  .app-shell {
    grid-template-columns: 1fr;
    height: auto;
    overflow: visible;
  }

  .sidebar {
    border-right: none;
    border-bottom: 1px solid var(--color-border);
    overflow: visible;
    max-height: none;
  }

  .sidebar-watchlist { max-height: 200px; }

  .main { overflow: visible; }
  .panel-scroll { overflow: visible; padding: var(--space-4); }

  .anime-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-3); }

  .nav { padding: 0 var(--space-4); }
  .nav-page-label { display: none; }
  .nav-sep { display: none; }

  .modal { max-height: 95vh; }
  .modal-hero { height: 160px; }

  .main-tabs { padding: 0 var(--space-4); overflow-x: auto; }
  .main-tab { padding: var(--space-3) var(--space-3); font-size: var(--text-xs); }
}

@media (max-width: 414px) {
  .anime-grid { grid-template-columns: repeat(2, 1fr); }
  .modal-stats { gap: var(--space-2); }
  .stat-chip { min-width: 60px; padding: var(--space-2) var(--space-3); }
}

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  .anime-card, .panel { animation: none; }
  .btn-primary:hover { transform: none; box-shadow: none; }
  .toast { transition: opacity 0.15s var(--ease-out); transform: translateY(0); }
  .live-dot { animation: none; }
}
</style>

<script>
'use strict';

// ── Constants ─────────────────────────────────────────────────────────────────
const JIKAN = 'https://api.jikan.moe/v4';
const WL_KEY = 'anime-tracker-wl-v3';
const CACHE_KEY_PREFIX = 'anime-tracker-cache-';
const RATE_DELAY = 420; // ms between requests

// ── State ─────────────────────────────────────────────────────────────────────
const state = {
  watchlist: [],
  seasonData: [],
  upcomingData: [],
  scheduleData: {}, // keyed by day name
  activePanel: 'season',
  activeSeason: 'current',
  activeDay: 'all',
  activeGenre: 'all',
  searchQuery: '',
  loadedSeason: false,
  loadedUpcoming: false,
  loadedSchedule: false,
};

// ── Helpers ───────────────────────────────────────────────────────────────────
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const delay = (ms) => new Promise(r => setTimeout(r, ms));

// ── Storage ───────────────────────────────────────────────────────────────────
function saveWatchlist() {
  try { localStorage.setItem(WL_KEY, JSON.stringify(state.watchlist)); } catch (_) {}
}

function loadWatchlist() {
  try {
    const d = localStorage.getItem(WL_KEY);
    if (d) state.watchlist = JSON.parse(d);
  } catch (_) { state.watchlist = []; }
}

function getCached(key) {
  try {
    const d = sessionStorage.getItem(CACHE_KEY_PREFIX + key);
    return d ? JSON.parse(d) : null;
  } catch (_) { return null; }
}

function setCache(key, data) {
  try { sessionStorage.setItem(CACHE_KEY_PREFIX + key, JSON.stringify(data)); } catch (_) {}
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3200);
}

// ── Watchlist ─────────────────────────────────────────────────────────────────
function isInWatchlist(id) {
  return state.watchlist.some(a => a.mal_id === id);
}

function addToWatchlist(anime) {
  if (state.watchlist.length >= 30) {
    showToast('Watchlist full (max 30 titles)', 'warning');
    return false;
  }
  if (!isInWatchlist(anime.mal_id)) {
    state.watchlist.push(anime);
    saveWatchlist();
    updateWatchlistUI();
    showToast(`Added "${anime.title}"`, 'success');
    return true;
  }
  return false;
}

function removeFromWatchlist(id) {
  const idx = state.watchlist.findIndex(a => a.mal_id === id);
  if (idx !== -1) {
    const name = state.watchlist[idx].title;
    state.watchlist.splice(idx, 1);
    saveWatchlist();
    updateWatchlistUI();
    showToast(`Removed "${name}"`);
    refreshCardStates();
  }
}

function updateWatchlistUI() {
  const count = state.watchlist.length;
  document.getElementById('nav-wl-count').textContent = count;
  document.getElementById('wl-count-badge').textContent = count;
  renderSidebarWatchlist();
}

function refreshCardStates() {
  document.querySelectorAll('.anime-card').forEach(card => {
    const id = parseInt(card.dataset.id, 10);
    const inWL = isInWatchlist(id);
    card.classList.toggle('in-watchlist', inWL);
    const wlBtn = card.querySelector('.btn-card-watchlist');
    if (wlBtn) {
      wlBtn.classList.toggle('added', inWL);
      wlBtn.textContent = inWL ? '♥ Tracking' : '♡ Track';
      wlBtn.setAttribute('aria-label', inWL ? 'Remove from watchlist' : 'Add to watchlist');
    }
  });
}

function renderSidebarWatchlist() {
  const list = document.getElementById('sidebar-wl-list');
  if (state.watchlist.length === 0) {
    list.innerHTML = '<div class="sidebar-wl-empty">No anime tracked yet.<br>Click ♡ on any card to track it.</div>';
    return;
  }
  list.innerHTML = '';
  state.watchlist.forEach(anime => {
    const img = anime.images?.jpg?.image_url || '';
    const item = document.createElement('div');
    item.className = 'sidebar-wl-item';
    item.role = 'listitem';
    item.setAttribute('aria-label', anime.title);
    item.innerHTML = `
      ${img
        ? `<img class="sidebar-wl-thumb" src="${esc(img)}" alt="${esc(anime.title)} thumbnail" loading="lazy">`
        : `<div class="sidebar-wl-thumb-placeholder">🎌</div>`
      }
      <div class="sidebar-wl-info">
        <div class="sidebar-wl-title">${esc(anime.title)}</div>
        <div class="sidebar-wl-meta">${anime.airing ? '● Airing' : '◎ Upcoming'} · ${anime.episodes ? anime.episodes + ' ep' : '? ep'}</div>
      </div>
      <button class="btn-wl-remove" aria-label="Remove ${esc(anime.title)} from watchlist" data-id="${anime.mal_id}">×</button>
    `;
    item.querySelector('.sidebar-wl-info').addEventListener('click', () => openModal(anime));
    item.querySelector('.btn-wl-remove').addEventListener('click', (e) => {
      e.stopPropagation();
      removeFromWatchlist(anime.mal_id);
    });
    list.appendChild(item);
  });
}

// ── Fetch with rate limit ─────────────────────────────────────────────────────
let lastFetch = 0;
async function fetchJSON(url) {
  const now = Date.now();
  const wait = RATE_DELAY - (now - lastFetch);
  if (wait > 0) await delay(wait);
  lastFetch = Date.now();
  const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ── Filtering ─────────────────────────────────────────────────────────────────
function filterAnime(list) {
  const q = state.searchQuery.toLowerCase().trim();
  const genre = state.activeGenre;
  return list.filter(a => {
    if (q) {
      const titleMatch = a.title.toLowerCase().includes(q)
        || (a.title_english || '').toLowerCase().includes(q)
        || (a.studios || []).some(s => s.name.toLowerCase().includes(q));
      if (!titleMatch) return false;
    }
    if (genre !== 'all') {
      const hasGenre = (a.genres || []).some(g => g.name === genre);
      if (!hasGenre) return false;
    }
    return true;
  });
}

// ── Score color ───────────────────────────────────────────────────────────────
function scoreClass(score) {
  if (!score) return 'score-none';
  if (score >= 8) return 'score-green';
  if (score >= 6) return 'score-amber';
  return 'score-red';
}

function scoreValClass(score) {
  if (!score) return '';
  if (score >= 8) return 'green';
  if (score >= 6) return 'amber';
  return 'red';
}

// ── Render card ───────────────────────────────────────────────────────────────
function renderCard(anime, opts = {}) {
  const inWL = isInWatchlist(anime.mal_id);
  const img = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
  const score = anime.score;
  const genres = (anime.genres || []).slice(0, 3);
  const eps = anime.episodes || '?';
  const airDay = opts.airDay || '';

  const card = document.createElement('article');
  card.className = 'anime-card' + (inWL ? ' in-watchlist' : '');
  card.style.setProperty('--card-index', String(opts.index || 0));
  card.dataset.id = String(anime.mal_id);
  card.tabIndex = 0;
  card.setAttribute('aria-label', `${anime.title}${score ? `, score ${score}` : ''}`);

  card.innerHTML = `
    <div class="card-poster">
      ${img
        ? `<img src="${esc(img)}" alt="${esc(anime.title)} poster" loading="lazy">`
        : `<div class="card-poster-placeholder">🎌</div>`
      }
      ${score != null
        ? `<div class="card-score ${scoreClass(score)}">★ ${score.toFixed(1)}</div>`
        : `<div class="card-score score-none">★ N/A</div>`
      }
      ${opts.showStatus !== false
        ? `<div class="card-status ${anime.airing ? 'status-airing' : 'status-upcoming'}">${anime.airing ? 'Airing' : 'Soon'}</div>`
        : ''
      }
      <div class="card-overlay" aria-hidden="true">
        <div class="card-overlay-actions">
          <button class="btn-card-action btn-card-watchlist ${inWL ? 'added' : ''}" aria-label="${inWL ? 'Remove from watchlist' : 'Add to watchlist'}">${inWL ? '♥ Tracking' : '♡ Track'}</button>
          <button class="btn-card-action btn-card-details" aria-label="View details">Details</button>
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="card-title">${esc(anime.title)}</div>
      ${genres.length ? `<div class="card-genres">${genres.map(g => `<span class="genre-tag">${esc(g.name)}</span>`).join('')}</div>` : ''}
      <div class="card-meta">
        <span class="card-eps">${eps} ep</span>
        ${airDay ? `<span class="card-air-day">${airDay}</span>` : ''}
      </div>
    </div>
  `;

  card.querySelector('.btn-card-watchlist').addEventListener('click', (e) => {
    e.stopPropagation();
    if (isInWatchlist(anime.mal_id)) {
      removeFromWatchlist(anime.mal_id);
    } else {
      addToWatchlist(anime);
    }
    // Update this card's button immediately
    const btn = card.querySelector('.btn-card-watchlist');
    const nowIn = isInWatchlist(anime.mal_id);
    btn.classList.toggle('added', nowIn);
    btn.textContent = nowIn ? '♥ Tracking' : '♡ Track';
    card.classList.toggle('in-watchlist', nowIn);
  });

  card.querySelector('.btn-card-details').addEventListener('click', (e) => {
    e.stopPropagation();
    openModal(anime);
  });

  card.addEventListener('click', () => openModal(anime));
  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(anime); }
  });

  return card;
}

// ── Render grid ───────────────────────────────────────────────────────────────
function renderGrid(containerId, list, countId, opts = {}) {
  const container = document.getElementById(containerId);
  if (!container) return;

  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">No anime found</div>
        <div class="empty-sub">Try adjusting your search or genre filter.</div>
      </div>
    `;
    if (countId) document.getElementById(countId).textContent = '0 results';
    return;
  }

  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'anime-grid';
  list.forEach((a, i) => grid.appendChild(renderCard(a, { ...opts, index: i })));
  container.appendChild(grid);
  if (countId) document.getElementById(countId).textContent = `${list.length} titles`;
}

// ── Error render ──────────────────────────────────────────────────────────────
function renderError(containerId, retryFn) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = `
    <div class="error-state">
      <h3>Failed to load</h3>
      <p>Could not reach Jikan API. Check your connection or try again.</p>
      <button class="btn-retry">Retry</button>
    </div>
  `;
  container.querySelector('.btn-retry').addEventListener('click', () => {
    container.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Retrying…</p></div>';
    retryFn();
  });
}

// ── Season panel ──────────────────────────────────────────────────────────────
async function loadSeason() {
  const cached = getCached('season');
  if (cached) {
    state.seasonData = cached;
    state.loadedSeason = true;
    applySeasonFilters();
    return;
  }

  try {
    const data = await fetchJSON(`${JIKAN}/seasons/now?filter=tv&limit=24`);
    state.seasonData = data.data || [];
    setCache('season', state.seasonData);
    state.loadedSeason = true;
    applySeasonFilters();
  } catch (err) {
    renderError('season-grid', loadSeason);
  }
}

function applySeasonFilters() {
  const filtered = filterAnime(state.seasonData);
  renderGrid('season-grid', filtered, 'season-count');
}

// ── Upcoming panel ────────────────────────────────────────────────────────────
async function loadUpcoming() {
  const cached = getCached('upcoming');
  if (cached) {
    state.upcomingData = cached;
    state.loadedUpcoming = true;
    applyUpcomingFilters();
    return;
  }

  try {
    const data = await fetchJSON(`${JIKAN}/seasons/upcoming?filter=tv&limit=24`);
    state.upcomingData = data.data || [];
    setCache('upcoming', state.upcomingData);
    state.loadedUpcoming = true;
    applyUpcomingFilters();
  } catch (err) {
    renderError('upcoming-grid', loadUpcoming);
  }
}

function applyUpcomingFilters() {
  const filtered = filterAnime(state.upcomingData);
  renderGrid('upcoming-grid', filtered, 'upcoming-count', { showStatus: false });
}

// ── Schedule panel ────────────────────────────────────────────────────────────
const DAYS = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
const DAY_LABELS = { monday: 'Monday', tuesday: 'Tuesday', wednesday: 'Wednesday', thursday: 'Thursday', friday: 'Friday', saturday: 'Saturday', sunday: 'Sunday' };

async function loadSchedule() {
  const cached = getCached('schedule');
  if (cached) {
    state.scheduleData = cached;
    state.loadedSchedule = true;
    renderSchedule();
    return;
  }

  const grid = document.getElementById('schedule-grid');
  grid.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading weekly schedule…</p></div>';

  try {
    const dayData = {};
    // Fetch today first, then others (rate-limited)
    const today = new Date().toLocaleDateString('en-US', { weekday: 'long' }).toLowerCase();
    const orderedDays = [today, ...DAYS.filter(d => d !== today)];

    for (const day of orderedDays) {
      try {
        const data = await fetchJSON(`${JIKAN}/schedules?filter=${day}&limit=25`);
        dayData[day] = data.data || [];
      } catch (_) {
        dayData[day] = [];
      }
    }

    state.scheduleData = dayData;
    setCache('schedule', dayData);
    state.loadedSchedule = true;
    renderSchedule();
  } catch (err) {
    renderError('schedule-grid', loadSchedule);
  }
}

function renderSchedule() {
  const grid = document.getElementById('schedule-grid');
  const activeDay = state.activeDay;
  const genre = state.activeGenre;
  const q = state.searchQuery.toLowerCase().trim();

  const daysToShow = activeDay === 'all' ? DAYS : [activeDay];

  // Count total
  let totalCount = 0;
  const sections = [];

  daysToShow.forEach(day => {
    let list = state.scheduleData[day] || [];
    // Apply genre and search filters
    list = list.filter(a => {
      if (q) {
        const match = a.title.toLowerCase().includes(q)
          || (a.title_english || '').toLowerCase().includes(q);
        if (!match) return false;
      }
      if (genre !== 'all') {
        if (!(a.genres || []).some(g => g.name === genre)) return false;
      }
      return true;
    });
    if (list.length > 0) sections.push({ day, list });
    totalCount += list.length;
  });

  document.getElementById('schedule-count').textContent = `${totalCount} anime`;

  if (sections.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📅</div>
        <div class="empty-title">No schedule data</div>
        <div class="empty-sub">No anime match your current filters for this day selection.</div>
      </div>
    `;
    return;
  }

  grid.innerHTML = '';
  sections.forEach(({ day, list }) => {
    const group = document.createElement('div');
    group.className = 'schedule-day-group';
    group.innerHTML = `
      <div class="schedule-day-header">
        ${DAY_LABELS[day]}
        <span class="day-count">${list.length}</span>
      </div>
    `;
    const animeGrid = document.createElement('div');
    animeGrid.className = 'anime-grid';
    list.forEach((a, i) => {
      animeGrid.appendChild(renderCard(a, { index: i, airDay: DAY_LABELS[day], showStatus: true }));
    });
    group.appendChild(animeGrid);
    grid.appendChild(group);
  });
}

// ── Panel switching ───────────────────────────────────────────────────────────
function switchPanel(panelId) {
  state.activePanel = panelId;

  document.querySelectorAll('.main-tab').forEach(btn => {
    const active = btn.dataset.panel === panelId;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', String(active));
  });

  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${panelId}`)?.classList.add('active');

  if (panelId === 'season' && !state.loadedSeason) loadSeason();
  if (panelId === 'upcoming' && !state.loadedUpcoming) loadUpcoming();
  if (panelId === 'schedule' && !state.loadedSchedule) loadSchedule();

  // Schedule panel shows day filter
  const daySection = document.getElementById('day-filter-section');
  daySection.style.display = panelId === 'schedule' ? '' : '';
}

// ── Season switching ──────────────────────────────────────────────────────────
function switchSeason(season) {
  state.activeSeason = season;
  document.querySelectorAll('.season-tab').forEach(btn => {
    const active = btn.dataset.season === season;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', String(active));
  });
  if (season === 'current') switchPanel('season');
  else switchPanel('upcoming');
}

// ── Filter handlers ───────────────────────────────────────────────────────────
function onGenreChange(genre) {
  state.activeGenre = genre;
  document.querySelectorAll('.genre-chip').forEach(chip => {
    const active = chip.dataset.genre === genre;
    chip.classList.toggle('active', active);
    chip.setAttribute('aria-pressed', String(active));
  });
  applyCurrentFilters();
}

function onDayChange(day) {
  state.activeDay = day;
  document.querySelectorAll('.day-chip').forEach(chip => {
    const active = chip.dataset.day === day;
    chip.classList.toggle('active', active);
    chip.setAttribute('aria-pressed', String(active));
  });
  if (state.loadedSchedule) renderSchedule();
}

function applyCurrentFilters() {
  if (state.activePanel === 'season' && state.loadedSeason) applySeasonFilters();
  if (state.activePanel === 'upcoming' && state.loadedUpcoming) applyUpcomingFilters();
  if (state.activePanel === 'schedule' && state.loadedSchedule) renderSchedule();
}

// ── Search (debounced) ────────────────────────────────────────────────────────
let searchTimer;
document.getElementById('search-input').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.searchQuery = e.target.value;
    applyCurrentFilters();
  }, 350);
});

// ── Event wiring ──────────────────────────────────────────────────────────────
document.querySelectorAll('.season-tab').forEach(btn => {
  btn.addEventListener('click', () => switchSeason(btn.dataset.season));
});

document.querySelectorAll('.main-tab').forEach(btn => {
  btn.addEventListener('click', () => switchPanel(btn.dataset.panel));
  btn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); switchPanel(btn.dataset.panel); }
  });
});

document.querySelectorAll('.genre-chip').forEach(chip => {
  chip.addEventListener('click', () => onGenreChange(chip.dataset.genre));
});

document.querySelectorAll('.day-chip').forEach(chip => {
  chip.addEventListener('click', () => onDayChange(chip.dataset.day));
});

document.getElementById('nav-wl-btn').addEventListener('click', () => {
  // Scroll to sidebar watchlist on mobile; desktop it's always visible
  document.querySelector('.sidebar-watchlist').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(anime) {
  const inWL = isInWatchlist(anime.mal_id);
  const img = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
  const score = anime.score;
  const studio = (anime.studios || [])[0]?.name || 'Unknown';
  const genres = (anime.genres || []);
  const malUrl = `https://myanimelist.net/anime/${anime.mal_id}`;

  const heroImg = document.getElementById('modal-hero-img');
  heroImg.src = img;
  heroImg.alt = `${anime.title} hero`;

  document.getElementById('modal-title-el').textContent = anime.title;
  const enTitle = anime.title_english && anime.title_english !== anime.title ? anime.title_english : '';
  document.getElementById('modal-title-en').textContent = enTitle;

  // Stats
  document.getElementById('modal-stats').innerHTML = `
    <div class="stat-chip">
      <span class="stat-val ${scoreValClass(score)}">${score != null ? score.toFixed(1) : 'N/A'}</span>
      <span class="stat-label">MAL Score</span>
    </div>
    <div class="stat-chip">
      <span class="stat-val accent">${anime.episodes || 'TBA'}</span>
      <span class="stat-label">Episodes</span>
    </div>
    <div class="stat-chip">
      <span class="stat-val">${anime.type || '?'}</span>
      <span class="stat-label">Type</span>
    </div>
    <div class="stat-chip">
      <span class="stat-val ${anime.airing ? 'green' : 'amber'}">${anime.airing ? 'Airing' : 'Soon'}</span>
      <span class="stat-label">Status</span>
    </div>
    <div class="stat-chip" style="min-width:100px;align-items:flex-start;">
      <span class="stat-val" style="font-size:0.85rem;font-weight:600;">${esc(studio)}</span>
      <span class="stat-label">Studio</span>
    </div>
  `;

  // Synopsis
  document.getElementById('modal-synopsis').textContent = anime.synopsis || 'No synopsis available.';

  // Genres
  document.getElementById('modal-genres').innerHTML = genres.map(g =>
    `<span class="modal-genre-tag">${esc(g.name)}</span>`
  ).join('');

  // Footer actions
  document.getElementById('modal-footer').innerHTML = `
    <button class="btn-primary${inWL ? ' added' : ''}" id="modal-wl-btn">
      ${inWL ? '♥ In Watchlist' : '♡ Add to Watchlist'}
    </button>
    <a href="${malUrl}" target="_blank" rel="noopener noreferrer" class="btn-secondary">
      Open on MAL ↗
    </a>
  `;

  document.getElementById('modal-wl-btn').addEventListener('click', () => {
    if (isInWatchlist(anime.mal_id)) {
      removeFromWatchlist(anime.mal_id);
    } else {
      addToWatchlist(anime);
    }
    closeModal();
  });

  const backdrop = document.getElementById('modal-backdrop');
  backdrop.style.display = 'flex';
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('modal-close').focus(), 50);
}

function closeModal() {
  document.getElementById('modal-backdrop').style.display = 'none';
  document.body.style.overflow = '';
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-backdrop')) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  loadWatchlist();
  updateWatchlistUI();
  loadSeason(); // load initial panel
}

init();
</script>
