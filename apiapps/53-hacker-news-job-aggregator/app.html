<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HN Jobs — Job Aggregator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Workbench · theme: Garden · nav: N9 */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow-x: clip; }
body {
  height: 100%;
  overflow: hidden;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font-family: var(--font-body); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ── N9 Nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 52px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  flex-shrink: 0;
}
.nav-logo span { color: var(--color-accent); }
.nav-sep {
  width: 1px; height: 16px;
  background: var(--color-border);
  flex-shrink: 0;
}
.nav-label {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
  white-space: nowrap;
}
.nav-thread-badge {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-1) var(--space-3);
  white-space: nowrap;
  display: none;
}
.nav-thread-badge.visible { display: inline-block; }
.nav-back {
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
  transition: color 0.15s ease;
}
.nav-back:hover { color: var(--color-ink); }

/* ── App shell ── */
.app-shell {
  display: grid;
  grid-template-columns: 280px 1fr;
  margin-top: 52px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--color-border);
  background: var(--color-paper-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-section {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}
.sidebar-section:last-child { border-bottom: none; }

.section-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
  margin-bottom: var(--space-3);
  display: block;
}

/* Search */
.search-wrap { position: relative; }
.search-wrap svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-ink-muted);
  width: 15px; height: 15px;
  pointer-events: none;
}
.search-input {
  width: 100%;
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  padding: var(--space-2) var(--space-3) var(--space-2) 32px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.search-input:focus {
  outline: none;
  border-color: var(--color-accent-line);
  box-shadow: 0 0 0 3px oklch(52% 0.14 155 / 0.10);
}
.search-input::placeholder { color: var(--color-ink-muted); }

/* Filter chips */
.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}
.chip {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: 20px;
  color: var(--color-ink-muted);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 500;
  padding: 3px 10px;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.chip:hover { border-color: var(--color-accent-line); color: var(--color-accent); }
.chip.active {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-paper);
}

/* Saved searches */
.saved-searches-list { display: flex; flex-direction: column; gap: var(--space-2); }
.saved-search-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.saved-search-item:hover { border-color: var(--color-accent-line); background: var(--color-accent-subtle); }
.saved-search-term {
  flex: 1;
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.saved-search-remove {
  background: none;
  border: none;
  color: var(--color-ink-muted);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 0;
  transition: color 0.15s ease;
  flex-shrink: 0;
}
.saved-search-remove:hover { color: var(--color-danger); }
.saved-searches-empty {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  font-style: italic;
}

/* Bookmarks panel */
.sidebar-scroll { flex: 1; overflow-y: auto; }
.bookmark-item {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  cursor: pointer;
  transition: background 0.12s ease;
}
.bookmark-item:hover { background: oklch(90% 0.018 95); }
.bookmark-item:last-child { border-bottom: none; }
.bookmark-info { flex: 1; min-width: 0; }
.bookmark-company {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bookmark-role {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
}
.bookmark-remove {
  background: none;
  border: none;
  color: var(--color-ink-muted);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 0;
  flex-shrink: 0;
  transition: color 0.15s ease;
}
.bookmark-remove:hover { color: var(--color-danger); }
.bookmarks-empty {
  padding: var(--space-6) var(--space-4);
  text-align: center;
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  line-height: 1.7;
}
.bookmarks-count-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--color-accent);
  color: var(--color-paper);
  border-radius: 10px;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  margin-left: var(--space-2);
  line-height: 1;
}

/* ── Main panel ── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-paper);
}

/* Panel header */
.panel-header {
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: var(--space-4);
  flex-wrap: wrap;
  background: var(--color-paper);
}
.panel-title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.01em;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.panel-count {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  flex-shrink: 0;
}

/* Stats row */
.stats-row {
  display: flex;
  gap: var(--space-6);
  padding: var(--space-3) var(--space-6);
  border-bottom: 1px solid var(--color-border);
  background: var(--color-paper-2);
  flex-shrink: 0;
  flex-wrap: wrap;
  display: none;
}
.stats-row.visible { display: flex; }
.stat-item { display: flex; flex-direction: column; gap: 1px; }
.stat-value {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.01em;
  line-height: 1.1;
}
.stat-label {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* Jobs scroll */
.jobs-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-4) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

/* Loading / empty */
.state-box {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-16);
  text-align: center;
  gap: var(--space-4);
  color: var(--color-ink-muted);
}
.state-icon { font-size: 2.5rem; line-height: 1; }
.state-title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.01em;
}
.state-sub { font-size: var(--text-sm); color: var(--color-ink-muted); max-width: 320px; line-height: 1.65; }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--color-border);
  border-top-color: var(--color-accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

/* ── Job Card ── */
@keyframes card-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.job-card {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4) var(--space-5);
  cursor: pointer;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  animation: card-in 0.2s ease both;
  position: relative;
}
.job-card:hover {
  border-color: var(--color-accent-line);
  box-shadow: 0 2px 12px oklch(52% 0.14 155 / 0.08);
}
.job-card.bookmarked {
  border-left: 3px solid var(--color-accent);
}

.job-card-top {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.company-avatar {
  width: 38px; height: 38px;
  border-radius: var(--radius-md);
  background: var(--color-accent-subtle);
  border: 1px solid var(--color-accent-line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  color: var(--color-accent);
  flex-shrink: 0;
  text-transform: uppercase;
}
.job-meta { flex: 1; min-width: 0; }
.job-title {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-ink);
  line-height: 1.35;
  margin-bottom: 2px;
}
.job-company {
  font-size: var(--text-xs);
  color: var(--color-accent);
  font-weight: 500;
}
.job-card-actions {
  display: flex;
  gap: var(--space-2);
  flex-shrink: 0;
}
.icon-btn {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-ink-muted);
  cursor: pointer;
  font-size: 14px;
  padding: 4px 8px;
  line-height: 1;
  transition: all 0.15s ease;
}
.icon-btn:hover { border-color: var(--color-accent-line); color: var(--color-accent); }
.icon-btn.bookmarked-btn {
  border-color: var(--color-accent-line);
  color: var(--color-accent);
  background: var(--color-accent-subtle);
}

.job-badges {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}
.badge {
  border-radius: 20px;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  white-space: nowrap;
  letter-spacing: 0.03em;
}
.badge-remote  { background: oklch(55% 0.14 155 / 0.12); color: var(--color-success);  border: 1px solid oklch(55% 0.14 155 / 0.3); }
.badge-onsite  { background: oklch(62% 0.15 72 / 0.12);  color: var(--color-warn);     border: 1px solid oklch(62% 0.15 72 / 0.3); }
.badge-hybrid  { background: oklch(52% 0.14 155 / 0.10); color: var(--color-accent);   border: 1px solid var(--color-accent-line); }
.badge-fulltime  { background: oklch(52% 0.14 155 / 0.08); color: var(--color-accent);   border: 1px solid var(--color-accent-line); }
.badge-contract  { background: oklch(55% 0.20 25 / 0.08);  color: var(--color-danger);   border: 1px solid oklch(55% 0.20 25 / 0.25); }
.badge-parttime  { background: var(--color-paper-2);        color: var(--color-ink-muted); border: 1px solid var(--color-border); }
.badge-internship{ background: oklch(62% 0.15 72 / 0.10); color: var(--color-warn);     border: 1px solid oklch(62% 0.15 72 / 0.3); }
.badge-tech    { background: var(--color-paper-2); color: var(--color-ink-muted); border: 1px solid var(--color-border); font-size: 10px; }

.job-snippet {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.job-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px solid var(--color-border);
}
.job-time {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}
.job-hn-link {
  font-size: var(--text-xs);
  color: var(--color-accent);
  font-weight: 500;
  transition: color 0.15s ease;
}
.job-hn-link:hover { color: var(--color-ink); }

/* Load more */
.load-more-wrap {
  display: flex;
  justify-content: center;
  padding: var(--space-4) 0 var(--space-8);
}
.btn-load-more {
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  color: var(--color-ink-muted);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: var(--space-3) var(--space-8);
  transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
}
.btn-load-more:hover {
  border-color: var(--color-accent-line);
  color: var(--color-accent);
  background: var(--color-accent-subtle);
}
.btn-load-more:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Detail slide-in panel ── */
.detail-overlay {
  position: fixed;
  inset: 0;
  background: oklch(18% 0.04 155 / 0.4);
  z-index: 300;
  display: none;
  animation: fade-in 0.15s ease;
}
.detail-overlay.open { display: block; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes slide-in { from { transform: translateX(100%); } to { transform: translateX(0); } }

.detail-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(520px, 100vw);
  background: var(--color-paper);
  border-left: 1px solid var(--color-border);
  z-index: 301;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: slide-in 0.2s ease;
  display: none;
}
.detail-panel.open { display: flex; }

.detail-header {
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
  display: flex;
  align-items: flex-start;
  gap: var(--space-4);
}
.detail-avatar {
  width: 48px; height: 48px;
  border-radius: var(--radius-lg);
  background: var(--color-accent-subtle);
  border: 1px solid var(--color-accent-line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-accent);
  flex-shrink: 0;
  text-transform: uppercase;
}
.detail-header-info { flex: 1; min-width: 0; }
.detail-title {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.01em;
  line-height: 1.3;
  margin-bottom: 2px;
}
.detail-company { font-size: var(--text-sm); color: var(--color-accent); font-weight: 500; }
.detail-time { font-size: var(--text-xs); color: var(--color-ink-muted); margin-top: 2px; }
.btn-close {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  color: var(--color-ink-muted);
  cursor: pointer;
  font-size: 16px;
  padding: 4px 10px;
  line-height: 1;
  flex-shrink: 0;
  transition: all 0.15s ease;
}
.btn-close:hover { border-color: var(--color-danger); color: var(--color-danger); }

.detail-body {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-5) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}
.detail-badges { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.detail-text {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: break-word;
}
.detail-text a { color: var(--color-accent); text-decoration: underline; text-underline-offset: 2px; }
.detail-actions {
  display: flex;
  gap: var(--space-3);
  flex-wrap: wrap;
  padding: var(--space-4) var(--space-6);
  border-top: 1px solid var(--color-border);
  flex-shrink: 0;
}
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-5);
  background: var(--color-accent);
  color: var(--color-paper);
  border: none;
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px oklch(52% 0.14 155 / 0.28); }
.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  color: var(--color-ink-muted);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease;
}
.btn-secondary:hover { border-color: var(--color-accent-line); color: var(--color-accent); }
.btn-bookmark-detail {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  background: transparent;
  border: 1px solid var(--color-accent-line);
  border-radius: var(--radius-md);
  color: var(--color-accent);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
}
.btn-bookmark-detail:hover, .btn-bookmark-detail.active {
  background: var(--color-accent);
  color: var(--color-paper);
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 600;
  background: var(--color-ink);
  color: var(--color-paper);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px oklch(18% 0.04 155 / 0.2);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}

<script>
// ── Constants ─────────────────────────────────────────────────
const ALGOLIA_BASE = 'https://hn.algolia.com/api/v1';
const HN_ITEM_BASE = 'https://news.ycombinator.com/item?id=';
const PAGE_SIZE = 50;

const TECH_KEYWORDS = [
  'React', 'Vue', 'Angular', 'Svelte', 'Next.js', 'Nuxt',
  'Node.js', 'Python', 'Go', 'Rust', 'Java', 'Kotlin', 'Swift',
  'TypeScript', 'JavaScript', 'Ruby', 'Rails', 'PHP', 'Laravel',
  'Django', 'FastAPI', 'Flask', 'Spring', 'C++', 'C#', '.NET',
  'AWS', 'GCP', 'Azure', 'Kubernetes', 'Docker', 'Terraform',
  'PostgreSQL', 'MySQL', 'MongoDB', 'Redis', 'Kafka', 'GraphQL',
  'Elixir', 'Scala', 'Haskell', 'Clojure', 'Erlang', 'Solidity',
  'PyTorch', 'TensorFlow', 'ML', 'LLM', 'AI', 'WASM',
  'iOS', 'Android', 'Flutter', 'DevOps', 'SRE',
];

// ── State ─────────────────────────────────────────────────────
const state = {
  mode: 'thread',          // 'thread' | 'search'
  allJobs: [],             // raw parsed jobs loaded
  filtered: [],            // after client-side filters
  threadTitle: '',
  threadId: null,
  algoliaPage: 0,          // for "Who is Hiring" comment pages
  searchPage: 0,           // for Algolia search
  hasMore: false,
  loading: false,
  activeWorkFilters: new Set(),
  activeTechFilters: new Set(),
  searchQuery: '',
  bookmarks: new Map(),    // objectID -> parsed job
  savedSearches: [],       // last 5
  currentDetailJob: null,
};

// ── Storage ───────────────────────────────────────────────────
const LS_BOOKMARKS = 'hn-jobs-bookmarks';
const LS_SEARCHES  = 'hn-jobs-saved-searches';

function loadStorage() {
  try {
    const bm = JSON.parse(localStorage.getItem(LS_BOOKMARKS) || '[]');
    for (const job of bm) state.bookmarks.set(job.objectID, job);
  } catch {}
  try {
    state.savedSearches = JSON.parse(localStorage.getItem(LS_SEARCHES) || '[]');
  } catch {}
}

function saveBookmarks() {
  try {
    localStorage.setItem(LS_BOOKMARKS, JSON.stringify([...state.bookmarks.values()]));
  } catch {}
}

function saveSavedSearches() {
  try {
    localStorage.setItem(LS_SEARCHES, JSON.stringify(state.savedSearches));
  } catch {}
}

// ── Toast ─────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3000);
}

// ── Time formatting ───────────────────────────────────────────
function timeAgo(ts) {
  if (!ts) return '';
  const diff = Math.floor(Date.now() / 1000 - ts);
  if (diff < 60) return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return `${Math.floor(diff / 86400)}d ago`;
}

function timeAgoFromStr(dateStr) {
  if (!dateStr) return '';
  const ts = Math.floor(new Date(dateStr).getTime() / 1000);
  return timeAgo(ts);
}

// ── HTML helpers ──────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function decodeHtmlEntities(str) {
  return str
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&#x27;/g, "'")
    .replace(/&#39;/g, "'")
    .replace(/&nbsp;/g, ' ');
}

function stripHtml(html) {
  return html
    .replace(/<p>/gi, '\n')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<[^>]+>/g, '')
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&#x27;/g, "'")
    .replace(/&#39;/g, "'")
    .replace(/&nbsp;/g, ' ')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function linkify(text) {
  // Escape HTML first, then linkify
  const escaped = esc(text);
  return escaped.replace(/(https?:\/\/[^\s<>"]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}

// ── Job parsing ───────────────────────────────────────────────
function detectTechs(text) {
  const found = [];
  for (const tech of TECH_KEYWORDS) {
    const pattern = tech.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (new RegExp(`\\b${pattern}\\b`, 'i').test(text)) {
      found.push(tech);
    }
  }
  return found;
}

function parseJobPosting(item) {
  // item can be an Algolia hit (has .text, ._highlightResult, .author, .created_at, .objectID)
  // or a thread comment (similar shape)

  const rawText = item.text || item.story_text || '';
  const text = stripHtml(rawText);
  const textLow = text.toLowerCase();
  const objectID = item.objectID || String(item.id || '');
  const author = item.author || '';
  const createdAt = item.created_at || '';

  // Company name heuristics
  let company = 'Unknown Company';
  // Pattern: first line like "Acme Corp | ..." or "Acme Corp (hiring)"
  const firstLine = text.split('\n')[0] || '';
  const pipeMatch = firstLine.match(/^([A-Z][^\n|(\[]{1,50}?)(?:\s*[|([]|\s+(?:is\s+)?hiring\b)/i);
  if (pipeMatch) {
    company = pipeMatch[1].trim();
  } else {
    const compLabel = text.match(/company[:\s]+([^\n|,]{2,50})/i);
    if (compLabel) company = compLabel[1].trim();
    else if (firstLine.length > 1 && firstLine.length < 60) {
      company = firstLine.replace(/[|:–—].*/, '').trim() || company;
    }
  }
  if (company.length > 60) company = company.slice(0, 57) + '…';

  // Role heuristic
  let role = 'Software Engineer';
  const roleMatch = text.match(/(?:hiring|seeking|looking for|need(?:ing)?)\s+(?:a\s+|an\s+)?([^\n|.]{5,70}?)(?:\.|,|\n|to |\bat \b)/i);
  if (roleMatch) {
    role = roleMatch[1].trim().replace(/^(a|an)\s+/i, '');
  } else {
    const engMatch = text.match(/\b(Senior|Staff|Principal|Lead|Junior|Mid-?\s*level)?\s*(Software|Backend|Frontend|Full[- ]?Stack|Platform|Infrastructure|DevOps|ML|AI|Data|Mobile|iOS|Android|Site Reliability|Security|Embedded)?\s*Engineer(?:ing)?\b/i);
    if (engMatch && engMatch[0].trim().length > 4) role = engMatch[0].trim();
  }
  if (role.length > 80) role = role.slice(0, 77) + '…';

  // Work type
  const isRemote  = /\bremote\b/i.test(text);
  const isOnsite  = /\bon-?site\b|\bin-?office\b|\bin-?person\b/i.test(text);
  const isHybrid  = /\bhybrid\b/i.test(text);
  let workType = 'unknown';
  if (isHybrid || (isRemote && isOnsite)) workType = 'hybrid';
  else if (isRemote) workType = 'remote';
  else if (isOnsite) workType = 'onsite';

  // Role type
  let roleType = 'fulltime';
  if (/\bcontract\b|\bfreelance\b|\b1099\b/i.test(text)) roleType = 'contract';
  else if (/\bpart-?time\b/i.test(text)) roleType = 'parttime';
  else if (/\bintern(?:ship)?\b/i.test(text)) roleType = 'internship';

  const techs = detectTechs(text);
  const snippet = text.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();

  return {
    objectID,
    author,
    createdAt,
    company,
    role,
    workType,
    roleType,
    techs,
    snippet,
    rawText: text,
  };
}

// ── Algolia fetch helpers ─────────────────────────────────────
async function fetchJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function findLatestWhoIsHiringThread() {
  // Check sessionStorage cache
  const cached = sessionStorage.getItem('hn-wih-thread');
  if (cached) {
    try {
      const parsed = JSON.parse(cached);
      // Cache valid for 1 hour
      if (Date.now() - parsed.ts < 3600000) return parsed;
    } catch {}
  }

  const data = await fetchJson(
    `${ALGOLIA_BASE}/search?query=who+is+hiring&tags=story&hitsPerPage=10`
  );

  // Find the most recent "Ask HN: Who is hiring" from whoishiring user or similar
  const hit = data.hits.find(h =>
    /who is hiring/i.test(h.title) && (h.author === 'whoishiring' || /ask hn/i.test(h.title))
  ) || data.hits[0];

  if (!hit) throw new Error('Could not find "Who is Hiring" thread');

  const result = {
    id: hit.objectID,
    title: hit.title || 'Who is Hiring',
    ts: Date.now(),
  };
  sessionStorage.setItem('hn-wih-thread', JSON.stringify(result));
  return result;
}

async function fetchThreadComments(threadId, page = 0) {
  const data = await fetchJson(
    `${ALGOLIA_BASE}/search?tags=comment,story_${threadId}&hitsPerPage=${PAGE_SIZE}&page=${page}&restrictSearchableAttributes=text`
  );
  return data;
}

async function searchJobs(query, page = 0) {
  const data = await fetchJson(
    `${ALGOLIA_BASE}/search?query=${encodeURIComponent(query)}&tags=job&hitsPerPage=${PAGE_SIZE}&page=${page}`
  );
  return data;
}

// ── Thread loading ────────────────────────────────────────────
async function loadWhoIsHiring(reset = true) {
  if (state.loading) return;
  state.loading = true;
  state.mode = 'thread';

  if (reset) {
    state.allJobs = [];
    state.algoliaPage = 0;
    showLoadingState();
  } else {
    showLoadMoreLoading();
  }

  try {
    if (reset) {
      const thread = await findLatestWhoIsHiringThread();
      state.threadId = thread.id;
      state.threadTitle = thread.title;
      document.getElementById('thread-badge').textContent = thread.title;
      document.getElementById('thread-badge').classList.add('visible');
      document.getElementById('panel-title').textContent = thread.title;
    }

    const data = await fetchThreadComments(state.threadId, state.algoliaPage);
    const newJobs = data.hits
      .filter(h => h.text && h.text.trim().length > 20)
      .map(hit => parseJobPosting(hit));

    state.allJobs.push(...newJobs);
    state.algoliaPage++;
    state.hasMore = data.page < data.nbPages - 1;

    applyFilters();
    document.getElementById('stats-row').classList.add('visible');
    updateStats();

    if (reset) showToast(`Loaded ${newJobs.length} job postings`, 'success');

  } catch (err) {
    showErrorState(err.message);
    showToast('Failed to load jobs: ' + err.message, 'error');
  } finally {
    state.loading = false;
  }
}

// ── Search loading ────────────────────────────────────────────
let searchDebounce;
function onSearch(q) {
  state.searchQuery = q.trim();
  clearTimeout(searchDebounce);

  if (!state.searchQuery) {
    // Revert to thread mode
    if (state.mode !== 'thread') {
      state.mode = 'thread';
      state.filtered = state.allJobs.slice();
      renderJobs();
      document.getElementById('panel-title').textContent = state.threadTitle || 'Who is Hiring';
    } else {
      applyFilters();
    }
    return;
  }

  searchDebounce = setTimeout(async () => {
    if (state.loading) return;
    state.loading = true;
    state.mode = 'search';
    state.searchPage = 0;
    state.allJobs = [];
    showLoadingState();
    document.getElementById('panel-title').textContent = `Search: "${state.searchQuery}"`;

    try {
      const data = await searchJobs(state.searchQuery, 0);
      state.allJobs = data.hits
        .filter(h => h.text || h.story_text)
        .map(hit => parseJobPosting(hit));
      state.searchPage = 1;
      state.hasMore = data.page < data.nbPages - 1;

      applyFilters();
      updateStats();

      // Save search to recents
      saveSearchTerm(state.searchQuery);

    } catch (err) {
      showErrorState(err.message);
      showToast('Search failed: ' + err.message, 'error');
    } finally {
      state.loading = false;
    }
  }, 400);
}

async function loadMoreSearch() {
  if (state.loading || !state.hasMore) return;
  state.loading = true;
  showLoadMoreLoading();
  try {
    const data = await searchJobs(state.searchQuery, state.searchPage);
    const more = data.hits
      .filter(h => h.text || h.story_text)
      .map(hit => parseJobPosting(hit));
    state.allJobs.push(...more);
    state.searchPage++;
    state.hasMore = data.page < data.nbPages - 1;
    applyFilters();
    updateStats();
  } catch (err) {
    showToast('Failed to load more: ' + err.message, 'error');
  } finally {
    state.loading = false;
  }
}

// ── Client-side filtering ─────────────────────────────────────
function applyFilters() {
  const wf = state.activeWorkFilters;
  const tf = state.activeTechFilters;
  const q  = state.searchQuery.toLowerCase();

  // If in thread mode and no search query, filter allJobs
  // If in search mode, results are already keyword-matched by Algolia, only apply chip filters
  state.filtered = state.allJobs.filter(job => {
    // Work-type chips (multi-select OR within group)
    if (wf.size > 0) {
      // "remote" is a special flag, others are roleType
      const wantRemote = wf.has('remote');
      const wantTypes  = new Set([...wf].filter(v => v !== 'remote'));
      const passRemote = !wantRemote || job.workType === 'remote' || job.workType === 'hybrid';
      const passType   = wantTypes.size === 0 || wantTypes.has(job.roleType);
      if (!(passRemote && passType)) return false;
    }

    // Tech chips (multi-select AND)
    if (tf.size > 0) {
      for (const tech of tf) {
        const pattern = tech.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        if (!new RegExp(`\\b${pattern}\\b`, 'i').test(job.rawText)) return false;
      }
    }

    // In thread mode, also do keyword search on text
    if (state.mode === 'thread' && q) {
      const haystack = `${job.company} ${job.role} ${job.rawText} ${job.techs.join(' ')}`.toLowerCase();
      if (!haystack.includes(q)) return false;
    }

    return true;
  });

  renderJobs();
  updateStats();
}

// ── Render ────────────────────────────────────────────────────
function showLoadingState() {
  const scroll = document.getElementById('jobs-scroll');
  scroll.innerHTML = `
    <div class="state-box">
      <div class="spinner"></div>
      <p class="state-title">Loading jobs…</p>
    </div>`;
}

function showErrorState(msg) {
  const scroll = document.getElementById('jobs-scroll');
  scroll.innerHTML = `
    <div class="state-box">
      <span class="state-icon">⚠</span>
      <p class="state-title">Could not load jobs</p>
      <p class="state-sub">${esc(msg)}</p>
    </div>`;
}

function showLoadMoreLoading() {
  const btn = document.getElementById('load-more-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
}

function renderJobs() {
  const scroll = document.getElementById('jobs-scroll');

  if (state.filtered.length === 0 && !state.loading) {
    scroll.innerHTML = `
      <div class="state-box">
        <span class="state-icon">○</span>
        <p class="state-title">No matching jobs</p>
        <p class="state-sub">Try adjusting your search or removing some filters.</p>
      </div>`;
    document.getElementById('panel-count').textContent = '';
    return;
  }

  // Rebuild card list
  const frag = document.createDocumentFragment();

  for (const job of state.filtered) {
    frag.appendChild(buildJobCard(job));
  }

  // Load more button
  if (state.hasMore && !state.loading) {
    const wrap = document.createElement('div');
    wrap.className = 'load-more-wrap';
    const btn = document.createElement('button');
    btn.className = 'btn-load-more';
    btn.id = 'load-more-btn';
    btn.textContent = 'Load more jobs';
    btn.addEventListener('click', () => {
      if (state.mode === 'thread') loadWhoIsHiring(false);
      else loadMoreSearch();
    });
    wrap.appendChild(btn);
    frag.appendChild(wrap);
  }

  scroll.innerHTML = '';
  scroll.appendChild(frag);

  document.getElementById('panel-count').textContent =
    state.filtered.length > 0 ? `${state.filtered.length} posting${state.filtered.length !== 1 ? 's' : ''}` : '';
}

function buildJobCard(job) {
  const isBookmarked = state.bookmarks.has(job.objectID);
  const card = document.createElement('article');
  card.className = 'job-card' + (isBookmarked ? ' bookmarked' : '');
  card.setAttribute('role', 'listitem');
  card.setAttribute('tabindex', '0');
  card.setAttribute('aria-label', `${job.role} at ${job.company}`);

  const avatarChar = job.company.replace(/[^A-Za-z0-9]/g, '').charAt(0).toUpperCase() || '?';

  const workBadge = job.workType === 'remote'  ? `<span class="badge badge-remote">Remote</span>`
                  : job.workType === 'onsite'  ? `<span class="badge badge-onsite">Onsite</span>`
                  : job.workType === 'hybrid'  ? `<span class="badge badge-hybrid">Hybrid</span>`
                  : '';

  const roleBadge = job.roleType === 'contract'   ? `<span class="badge badge-contract">Contract</span>`
                  : job.roleType === 'parttime'   ? `<span class="badge badge-parttime">Part-time</span>`
                  : job.roleType === 'internship' ? `<span class="badge badge-internship">Internship</span>`
                  : `<span class="badge badge-fulltime">Full-time</span>`;

  const techBadges = job.techs.slice(0, 5).map(t => `<span class="badge badge-tech">${esc(t)}</span>`).join('');

  const snippetText = job.snippet.slice(0, 180) + (job.snippet.length > 180 ? '…' : '');

  card.innerHTML = `
    <div class="job-card-top">
      <div class="company-avatar">${esc(avatarChar)}</div>
      <div class="job-meta">
        <div class="job-title">${esc(job.role)}</div>
        <div class="job-company">${esc(job.company)}</div>
      </div>
      <div class="job-card-actions">
        <button class="icon-btn ${isBookmarked ? 'bookmarked-btn' : ''}" data-id="${esc(job.objectID)}" title="${isBookmarked ? 'Remove bookmark' : 'Bookmark'}" aria-label="${isBookmarked ? 'Remove bookmark' : 'Bookmark this job'}" aria-pressed="${isBookmarked}">♡</button>
      </div>
    </div>
    <div class="job-badges">${workBadge}${roleBadge}${techBadges}</div>
    <div class="job-snippet">${esc(snippetText)}</div>
    <div class="job-card-footer">
      <span class="job-time">${job.createdAt ? timeAgoFromStr(job.createdAt) : ''}</span>
      <a class="job-hn-link" href="${HN_ITEM_BASE}${esc(job.objectID)}" target="_blank" rel="noopener noreferrer" aria-label="View on Hacker News">View on HN ↗</a>
    </div>`;

  // Bookmark button
  const bmBtn = card.querySelector('.icon-btn');
  bmBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleBookmark(job, card, bmBtn);
  });

  // Open detail on card click
  card.addEventListener('click', () => openDetail(job));
  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(job); }
  });

  return card;
}

// ── Stats ─────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('stat-total').textContent = state.allJobs.length;
  document.getElementById('stat-remote').textContent = state.allJobs.filter(j => j.workType === 'remote').length;
  document.getElementById('stat-showing').textContent = state.filtered.length;
  const companies = new Set(state.allJobs.map(j => j.company).filter(c => c !== 'Unknown Company'));
  document.getElementById('stat-companies').textContent = companies.size;
}

// ── Bookmarks ─────────────────────────────────────────────────
function toggleBookmark(job, cardEl, btnEl) {
  const id = job.objectID;
  if (state.bookmarks.has(id)) {
    state.bookmarks.delete(id);
    if (cardEl) cardEl.classList.remove('bookmarked');
    if (btnEl) { btnEl.classList.remove('bookmarked-btn'); btnEl.setAttribute('aria-pressed', 'false'); }
    showToast('Bookmark removed');
  } else {
    state.bookmarks.set(id, job);
    if (cardEl) cardEl.classList.add('bookmarked');
    if (btnEl) { btnEl.classList.add('bookmarked-btn'); btnEl.setAttribute('aria-pressed', 'true'); }
    showToast('Job bookmarked', 'success');
  }
  saveBookmarks();
  renderBookmarks();
  // Update detail panel button if open
  if (state.currentDetailJob && state.currentDetailJob.objectID === id) {
    const detailBtn = document.getElementById('detail-bookmark-btn');
    if (detailBtn) {
      const bm = state.bookmarks.has(id);
      detailBtn.textContent = bm ? '♥ Bookmarked' : '♡ Bookmark';
      detailBtn.classList.toggle('active', bm);
    }
  }
}

function renderBookmarks() {
  const list = document.getElementById('bookmarks-list');
  const badge = document.getElementById('bookmarks-badge');
  const count = state.bookmarks.size;

  if (count === 0) {
    badge.style.display = 'none';
    list.innerHTML = '<div class="bookmarks-empty">Bookmark jobs using the ♡ button.</div>';
    return;
  }

  badge.style.display = 'inline-flex';
  badge.textContent = count;
  list.innerHTML = '';

  for (const [id, job] of state.bookmarks) {
    const item = document.createElement('div');
    item.className = 'bookmark-item';
    item.innerHTML = `
      <div class="bookmark-info">
        <div class="bookmark-company">${esc(job.company)}</div>
        <div class="bookmark-role">${esc(job.role)}</div>
      </div>
      <button class="bookmark-remove" data-id="${esc(id)}" aria-label="Remove bookmark for ${esc(job.company)}" title="Remove">×</button>`;

    item.addEventListener('click', (e) => {
      if (e.target.classList.contains('bookmark-remove')) {
        e.stopPropagation();
        state.bookmarks.delete(id);
        saveBookmarks();
        renderBookmarks();
        showToast('Bookmark removed');
        return;
      }
      openDetail(job);
    });
    list.appendChild(item);
  }
}

// ── Saved searches ────────────────────────────────────────────
function saveSearchTerm(term) {
  if (!term) return;
  state.savedSearches = state.savedSearches.filter(s => s !== term);
  state.savedSearches.unshift(term);
  if (state.savedSearches.length > 5) state.savedSearches = state.savedSearches.slice(0, 5);
  saveSavedSearches();
  renderSavedSearches();
}

function renderSavedSearches() {
  const container = document.getElementById('saved-searches-list');
  if (state.savedSearches.length === 0) {
    container.innerHTML = '<span class="saved-searches-empty">No saved searches yet.</span>';
    return;
  }
  container.innerHTML = '';
  for (const term of state.savedSearches) {
    const item = document.createElement('div');
    item.className = 'saved-search-item';
    item.innerHTML = `
      <span class="saved-search-term" title="${esc(term)}">${esc(term)}</span>
      <button class="saved-search-remove" data-term="${esc(term)}" aria-label="Remove saved search: ${esc(term)}" title="Remove">×</button>`;
    item.addEventListener('click', (e) => {
      if (e.target.classList.contains('saved-search-remove')) {
        const t = e.target.dataset.term;
        state.savedSearches = state.savedSearches.filter(s => s !== t);
        saveSavedSearches();
        renderSavedSearches();
        return;
      }
      document.getElementById('search-input').value = term;
      onSearch(term);
    });
    container.appendChild(item);
  }
}

// ── Detail panel ──────────────────────────────────────────────
function openDetail(job) {
  state.currentDetailJob = job;
  const isBookmarked = state.bookmarks.has(job.objectID);

  document.getElementById('detail-avatar').textContent =
    job.company.replace(/[^A-Za-z0-9]/g, '').charAt(0).toUpperCase() || '?';
  document.getElementById('detail-title-el').textContent = job.role;
  document.getElementById('detail-company').textContent = job.company;
  document.getElementById('detail-time').textContent = job.createdAt ? `Posted ${timeAgoFromStr(job.createdAt)}` : '';

  // Badges
  const workBadge = job.workType === 'remote'  ? `<span class="badge badge-remote">Remote</span>`
                  : job.workType === 'onsite'  ? `<span class="badge badge-onsite">Onsite</span>`
                  : job.workType === 'hybrid'  ? `<span class="badge badge-hybrid">Hybrid</span>`
                  : '';
  const roleBadge = job.roleType === 'contract'   ? `<span class="badge badge-contract">Contract</span>`
                  : job.roleType === 'parttime'   ? `<span class="badge badge-parttime">Part-time</span>`
                  : job.roleType === 'internship' ? `<span class="badge badge-internship">Internship</span>`
                  : `<span class="badge badge-fulltime">Full-time</span>`;
  const techBadges = job.techs.map(t => `<span class="badge badge-tech">${esc(t)}</span>`).join('');
  document.getElementById('detail-badges').innerHTML = workBadge + roleBadge + techBadges;

  // Text — linkify URLs
  const detailTextEl = document.getElementById('detail-text');
  detailTextEl.innerHTML = linkify(job.rawText || 'No description available.');

  // Actions
  const actions = document.getElementById('detail-actions');
  actions.innerHTML = `
    <a class="btn-primary" href="${HN_ITEM_BASE}${esc(job.objectID)}" target="_blank" rel="noopener noreferrer">View on HN ↗</a>
    <button class="btn-bookmark-detail ${isBookmarked ? 'active' : ''}" id="detail-bookmark-btn">
      ${isBookmarked ? '♥ Bookmarked' : '♡ Bookmark'}
    </button>`;

  document.getElementById('detail-bookmark-btn').addEventListener('click', () => {
    toggleBookmark(job, null, null);
  });

  document.getElementById('detail-overlay').classList.add('open');
  document.getElementById('detail-overlay').setAttribute('aria-hidden', 'false');
  document.getElementById('detail-panel').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('btn-close-detail').focus();
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
  document.getElementById('detail-overlay').setAttribute('aria-hidden', 'true');
  document.getElementById('detail-panel').classList.remove('open');
  document.body.style.overflow = '';
  state.currentDetailJob = null;
}

// ── Chip filters ──────────────────────────────────────────────
document.getElementById('work-chips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip[data-filter="work"]');
  if (!chip) return;
  const val = chip.dataset.value;
  if (state.activeWorkFilters.has(val)) {
    state.activeWorkFilters.delete(val);
    chip.classList.remove('active');
  } else {
    state.activeWorkFilters.add(val);
    chip.classList.add('active');
  }
  applyFilters();
});

document.getElementById('tech-chips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip[data-filter="tech"]');
  if (!chip) return;
  const val = chip.dataset.value;
  if (state.activeTechFilters.has(val)) {
    state.activeTechFilters.delete(val);
    chip.classList.remove('active');
  } else {
    state.activeTechFilters.add(val);
    chip.classList.add('active');
  }
  applyFilters();
});

// ── Search input ──────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', (e) => {
  onSearch(e.target.value);
});

// ── Detail close ──────────────────────────────────────────────
document.getElementById('btn-close-detail').addEventListener('click', closeDetail);
document.getElementById('detail-overlay').addEventListener('click', closeDetail);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDetail();
});

// ── Init ──────────────────────────────────────────────────────
loadStorage();
renderBookmarks();
renderSavedSearches();
loadWhoIsHiring(true);
</script>
</body>
</html>
