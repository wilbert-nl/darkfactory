<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIF Search Tool — Find the Perfect Reaction GIF</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap');

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1e1e1e;
      --border: rgba(255,255,255,0.08);
      --accent: #1db954;
      --accent2: #ff6b6b;
      --text: #ffffff;
      --muted: #9ca3af;
      --radius: 12px;
      --font-display: 'Bebas Neue', Impact, sans-serif;
      --font-body: 'Figtree', system-ui, sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ───── HEADER ───── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .logo-text span { color: var(--accent); }

    /* ───── SEARCH ───── */
    .search-wrap {
      flex: 1;
      min-width: 220px;
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 50px;
      color: var(--text);
      font-size: 15px;
      padding: 10px 44px 10px 44px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #searchInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
    }

    #searchInput::placeholder { color: var(--muted); }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .clear-btn:hover { color: var(--text); }
    .clear-btn.visible { display: flex; }

    /* ───── NAV ACTIONS ───── */
    .nav-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .tab-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 50px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab-btn:hover { border-color: var(--accent); color: var(--text); }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .fav-count {
      background: var(--accent2);
      color: #fff;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 4px;
    }

    /* ───── MAIN ───── */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    /* ───── CATEGORIES ───── */
    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .category-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 7px 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .category-pill:hover { border-color: var(--accent); color: var(--text); background: var(--surface2); }
    .category-pill.active { background: linear-gradient(135deg, var(--accent), #8b5cf6); border-color: transparent; color: #fff; }

    /* ───── SECTION LABEL ───── */
    .section-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .section-label h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 50px;
    }

    /* ───── RATING FILTER ───── */
    .filters {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .filters label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .rating-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    .rating-select:focus { border-color: var(--accent); }

    /* ───── GIF GRID (Masonry) ───── */
    .gif-grid {
      columns: 4;
      column-gap: 12px;
    }

    @media (max-width: 1100px) { .gif-grid { columns: 3; } }
    @media (max-width: 750px) { .gif-grid { columns: 2; } }
    @media (max-width: 480px) { .gif-grid { columns: 1; } }

    .gif-card {
      break-inside: avoid;
      margin-bottom: 12px;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      position: relative;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .gif-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(168, 85, 247, 0.25);
      border-color: var(--accent);
      z-index: 2;
    }

    .gif-card:focus-within {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .gif-thumb {
      display: block;
      width: 100%;
      height: auto;
      background: var(--surface2);
    }

    /* Still preview by default, play on hover */
    .gif-thumb.still { content: attr(data-still); }

    .gif-card .gif-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15,17,23,0.92) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px;
      gap: 8px;
    }

    .gif-card:hover .gif-overlay { opacity: 1; }
    .gif-card:focus-within .gif-overlay { opacity: 1; }

    .gif-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .gif-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .gif-action-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .gif-action-btn:hover { background: var(--accent); border-color: var(--accent); }

    .gif-action-btn.fav-btn.active { background: var(--accent2); border-color: var(--accent2); }

    .gif-rating-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15,17,23,0.75);
      backdrop-filter: blur(4px);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 700;
      color: var(--yellow);
      border: 1px solid rgba(247,201,72,0.3);
    }

    /* ───── SKELETON ───── */
    .skeleton-grid {
      columns: 4;
      column-gap: 12px;
    }

    @media (max-width: 1100px) { .skeleton-grid { columns: 3; } }
    @media (max-width: 750px) { .skeleton-grid { columns: 2; } }
    @media (max-width: 480px) { .skeleton-grid { columns: 1; } }

    .skeleton-card {
      break-inside: avoid;
      margin-bottom: 12px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* ───── EMPTY / ERROR STATES ───── */
    .state-box {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }

    .state-box .icon { font-size: 56px; margin-bottom: 16px; }
    .state-box h3 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
    .state-box p { font-size: 14px; max-width: 360px; margin: 0 auto 20px; }

    .retry-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      border-radius: 50px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .retry-btn:hover { opacity: 0.85; }

    /* ───── LOAD MORE ───── */
    .load-more-wrap {
      display: flex;
      justify-content: center;
      padding: 32px 0 16px;
    }

    .load-more-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50px;
      padding: 12px 32px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .load-more-btn:hover { background: var(--accent); border-color: var(--accent); }
    .load-more-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ───── TOAST ───── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 9999;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ───── MODAL (Lightbox) ───── */
    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #modal.open { display: flex; }

    .modal-inner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 640px;
      width: 100%;
      overflow: hidden;
      position: relative;
      animation: popIn 0.25s ease;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.94); }
      to   { opacity: 1; transform: scale(1); }
    }

    .modal-img-wrap { position: relative; background: var(--bg); }
    .modal-img-wrap img { display: block; width: 100%; height: auto; max-height: 70vh; object-fit: contain; }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(15,17,23,0.75);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s;
      z-index: 2;
    }

    .modal-close:hover { background: var(--accent2); border-color: var(--accent2); }

    .modal-body {
      padding: 18px 20px 20px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .modal-action-btn {
      flex: 1;
      min-width: 110px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .modal-action-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .modal-action-btn.fav { }
    .modal-action-btn.fav.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }

    /* ───── FAVOURITES PANEL ───── */
    #favPanel {
      display: none;
    }

    #favPanel.visible { display: block; }

    .fav-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }

    .fav-empty .icon { font-size: 48px; margin-bottom: 12px; }
    .fav-empty p { font-size: 14px; }

    /* ───── SCROLL TO TOP ───── */
    #scrollTop {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 42px;
      height: 42px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(168,85,247,0.4);
      transition: transform 0.2s, opacity 0.2s;
      z-index: 50;
    }

    #scrollTop.visible { display: flex; }
    #scrollTop:hover { transform: scale(1.1); }

    /* ───── FOOTER ───── */
    footer {
      text-align: center;
      padding: 32px 24px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }

    footer a { color: var(--accent); text-decoration: none; }

    /* === Media v2 Design System === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      line-height: 1.6;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 700px 500px at 70% -10%, rgba(29,185,84,0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    body > * { position: relative; z-index: 1; }

    h1 { font-family: var(--font-display); font-size: clamp(2.5rem, 6vw, 4rem); letter-spacing: 0.02em; color: var(--text); line-height: 1; }
    h2 { font-family: var(--font-display); font-size: clamp(1.5rem, 3vw, 2rem); letter-spacing: 0.04em; color: var(--accent); }
    h3 { font-family: var(--font-body); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }

    .container, main, .wrapper, .app { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }

    .card, .result, .item, .pet, .animal, .gif, .meme, .cat, .fact,
    [class*="card"], [class*="item"], [class*="result"] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      transition: transform 0.2s, background 0.2s;
      animation: mediaFade 0.4s ease both;
    }
    .card:hover, .item:hover, [class*="card"]:hover { transform: translateY(-2px); background: var(--surface2); }

    img { border-radius: 8px; max-width: 100%; height: auto; }

    input, select, textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem 1rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      width: 100%;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

    button, .btn, input[type="submit"], input[type="button"] {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 999px;
      padding: 0.75rem 2rem;
      font-family: var(--font-body);
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
    }
    button:hover { transform: scale(1.03); filter: brightness(1.1); }
    button:active { transform: scale(0.97); }

    .tag, .badge, .genre, .category, .label, .type, .species, .breed {
      display: inline-block;
      background: rgba(29,185,84,0.12);
      border: 1px solid rgba(29,185,84,0.25);
      color: var(--accent);
      border-radius: 4px;
      padding: 0.15rem 0.6rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .score, .rating, .stat, .number, .count {
      font-family: var(--font-mono);
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--accent);
    }

    table { width: 100%; border-collapse: collapse; }
    th { padding: 0.5rem 1rem; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; border-bottom: 1px solid var(--border); }
    td { padding: 0.6rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.04); }

    @keyframes mediaFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <a href="#" class="logo" aria-label="GIF Search Tool home">
      <div class="logo-icon">🎞️</div>
      <span class="logo-text">GIF<span>Search</span></span>
    </a>

    <div class="search-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.242 1.156a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
      </svg>
      <input
        id="searchInput"
        type="search"
        placeholder="Search GIFs — reactions, memes, animals..."
        aria-label="Search GIFs"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="clear-btn" id="clearBtn" aria-label="Clear search">✕</button>
    </div>

    <nav class="nav-actions" aria-label="View tabs">
      <button class="tab-btn active" data-tab="search" aria-pressed="true">🔥 Trending</button>
      <button class="tab-btn" data-tab="favorites" aria-pressed="false">
        ♥ Favorites <span class="fav-count" id="favCount" aria-live="polite">0</span>
      </button>
    </nav>
  </div>
</header>

<!-- MAIN -->
<main>

  <!-- CATEGORIES -->
  <nav aria-label="Quick category picks">
    <div class="categories" id="categories">
      <button class="category-pill active" data-query="" aria-pressed="true">✨ Trending</button>
      <button class="category-pill" data-query="reactions" aria-pressed="false">😂 Reactions</button>
      <button class="category-pill" data-query="memes" aria-pressed="false">🐸 Memes</button>
      <button class="category-pill" data-query="animals" aria-pressed="false">🐾 Animals</button>
      <button class="category-pill" data-query="sports" aria-pressed="false">⚽ Sports</button>
      <button class="category-pill" data-query="dance" aria-pressed="false">💃 Dance</button>
      <button class="category-pill" data-query="food" aria-pressed="false">🍕 Food</button>
      <button class="category-pill" data-query="celebrate" aria-pressed="false">🎉 Celebrate</button>
    </div>
  </nav>

  <!-- SEARCH PANEL -->
  <div id="searchPanel">
    <div class="section-label">
      <h2 id="sectionTitle">🔥 Trending GIFs</h2>
      <span class="badge" id="resultCount" aria-live="polite">Loading…</span>
      <div class="filters">
        <label for="ratingFilter">Rating:</label>
        <select id="ratingFilter" class="rating-select" aria-label="Content rating filter">
          <option value="g">G — All Ages</option>
          <option value="pg">PG</option>
          <option value="pg-13">PG-13</option>
          <option value="r">R</option>
        </select>
      </div>
    </div>

    <div id="gifGrid" class="gif-grid" role="list" aria-label="GIF results"></div>
    <div id="skeletonGrid" class="skeleton-grid" aria-hidden="true"></div>
    <div id="stateBox"></div>
    <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
      <button class="load-more-btn" id="loadMoreBtn">Load more GIFs</button>
    </div>
  </div>

  <!-- FAVORITES PANEL -->
  <div id="favPanel" role="region" aria-label="Favorite GIFs">
    <div class="section-label">
      <h2>♥ Saved Favorites</h2>
      <span class="badge" id="favResultCount" aria-live="polite">0 saved</span>
    </div>
    <div id="favGrid" class="gif-grid" role="list" aria-label="Favorite GIFs"></div>
    <div id="favEmpty" class="fav-empty" style="display:none;">
      <div class="icon">♥</div>
      <p>No favorites yet. Click the heart on any GIF to save it here.</p>
    </div>
  </div>

</main>

<!-- TOAST -->
<div id="toast" role="alert" aria-live="assertive"></div>

<!-- SCROLL TOP -->
<button id="scrollTop" aria-label="Scroll to top">↑</button>

<!-- LIGHTBOX MODAL -->
<div id="modal" role="dialog" aria-modal="true" aria-label="GIF preview">
  <div class="modal-inner">
    <div class="modal-img-wrap">
      <img id="modalImg" src="" alt="GIF preview" />
      <button class="modal-close" id="modalClose" aria-label="Close preview">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-actions">
        <button class="modal-action-btn" id="modalCopyUrl" title="Copy direct GIF URL">
          🔗 Copy URL
        </button>
        <button class="modal-action-btn" id="modalCopyEmbed" title="Copy HTML embed code">
          &lt;/&gt; Copy Embed
        </button>
        <a class="modal-action-btn" id="modalDownload" download title="Download GIF">
          ⬇ Download
        </a>
        <button class="modal-action-btn fav" id="modalFav" title="Toggle favorite">
          ♥ Favorite
        </button>
      </div>
    </div>
  </div>
</div>

<footer>
  <p>Powered by <a href="https://giphy.com" target="_blank" rel="noopener noreferrer">Giphy</a> — GIF Search Tool for Social Media Managers</p>
</footer>

<script>
(function () {
  'use strict';

  // ── CONFIG ──────────────────────────────────────────────────────────
  const GIPHY_KEY = `dc6zaTOxFJmzC`;
  const PAGE_SIZE = 20;
  const DEBOUNCE_MS = 400;
  const FAV_KEY = `gif_search_favorites`;

  // ── STATE ────────────────────────────────────────────────────────────
  let currentQuery = ``;
  let currentRating = `g`;
  let currentOffset = 0;
  let totalCount = 0;
  let isLoading = false;
  let activeTab = `search`;
  let currentGif = null; // for modal

  // ── DOM REFS ─────────────────────────────────────────────────────────
  const searchInput = document.getElementById(`searchInput`);
  const clearBtn = document.getElementById(`clearBtn`);
  const gifGrid = document.getElementById(`gifGrid`);
  const skeletonGrid = document.getElementById(`skeletonGrid`);
  const stateBox = document.getElementById(`stateBox`);
  const resultCount = document.getElementById(`resultCount`);
  const sectionTitle = document.getElementById(`sectionTitle`);
  const loadMoreWrap = document.getElementById(`loadMoreWrap`);
  const loadMoreBtn = document.getElementById(`loadMoreBtn`);
  const ratingFilter = document.getElementById(`ratingFilter`);
  const favPanel = document.getElementById(`favPanel`);
  const searchPanel = document.getElementById(`searchPanel`);
  const categoriesEl = document.getElementById(`categories`);
  const favGrid = document.getElementById(`favGrid`);
  const favEmpty = document.getElementById(`favEmpty`);
  const favResultCount = document.getElementById(`favResultCount`);
  const favCount = document.getElementById(`favCount`);
  const toast = document.getElementById(`toast`);
  const scrollTopBtn = document.getElementById(`scrollTop`);
  const modal = document.getElementById(`modal`);
  const modalImg = document.getElementById(`modalImg`);
  const modalTitle = document.getElementById(`modalTitle`);
  const modalClose = document.getElementById(`modalClose`);
  const modalCopyUrl = document.getElementById(`modalCopyUrl`);
  const modalCopyEmbed = document.getElementById(`modalCopyEmbed`);
  const modalDownload = document.getElementById(`modalDownload`);
  const modalFav = document.getElementById(`modalFav`);

  // ── FAVORITES ────────────────────────────────────────────────────────
  function getFavs() {
    try { return JSON.parse(localStorage.getItem(FAV_KEY)) || {}; }
    catch { return {}; }
  }

  function saveFavs(favs) {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch {}
  }

  function isFav(id) { return !!getFavs()[id]; }

  function toggleFav(gif) {
    const favs = getFavs();
    if (favs[gif.id]) {
      delete favs[gif.id];
      showToast(`Removed from favorites`);
    } else {
      favs[gif.id] = gif;
      showToast(`Added to favorites ♥`);
    }
    saveFavs(favs);
    updateFavCount();
    refreshFavButtons(gif.id);
    if (activeTab === `favorites`) renderFavPanel();
  }

  function updateFavCount() {
    const n = Object.keys(getFavs()).length;
    favCount.textContent = n;
  }

  function refreshFavButtons(id) {
    const fav = isFav(id);
    document.querySelectorAll(`.fav-btn[data-id="${id}"]`).forEach(btn => {
      btn.classList.toggle(`active`, fav);
      btn.setAttribute(`aria-pressed`, String(fav));
      btn.textContent = fav ? `♥ Saved` : `♥`;
    });
    if (currentGif && currentGif.id === id) {
      modalFav.classList.toggle(`active`, fav);
      modalFav.textContent = fav ? `♥ Saved` : `♥ Favorite`;
    }
  }

  // ── TOAST ────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add(`show`);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove(`show`), 2200);
  }

  // ── SKELETON ─────────────────────────────────────────────────────────
  const skeletonHeights = [200, 160, 240, 180, 220, 140, 260, 190, 170, 210, 230, 150];

  function showSkeleton(n = 12) {
    skeletonGrid.innerHTML = ``;
    for (let i = 0; i < n; i++) {
      const h = skeletonHeights[i % skeletonHeights.length];
      const div = document.createElement(`div`);
      div.className = `skeleton-card`;
      div.style.height = `${h}px`;
      skeletonGrid.appendChild(div);
    }
    skeletonGrid.style.display = `block`;
  }

  function hideSkeleton() {
    skeletonGrid.style.display = `none`;
    skeletonGrid.innerHTML = ``;
  }

  // ── GIF CARD ─────────────────────────────────────────────────────────
  function createCard(gif) {
    const images = gif.images || {};
    const still = (images.fixed_width_still && images.fixed_width_still.url) || ``;
    const animated = (images.fixed_width && images.fixed_width.url) || (images.downsized && images.downsized.url) || ``;
    const original = (images.original && images.original.url) || animated;
    const title = gif.title || `GIF`;
    const rating = gif.rating ? gif.rating.toUpperCase() : ``;
    const favored = isFav(gif.id);

    const card = document.createElement(`div`);
    card.className = `gif-card`;
    card.setAttribute(`role`, `listitem`);
    card.setAttribute(`tabindex`, `0`);
    card.setAttribute(`aria-label`, title);

    card.innerHTML = `
      <img
        class="gif-thumb"
        src="${still || animated}"
        data-still="${still}"
        data-animated="${animated}"
        alt="${title.replace(/"/g, `&quot;`)}"
        loading="lazy"
        width="200"
      />
      ${rating ? `<div class="gif-rating-badge" aria-label="Rating ${rating}">${rating}</div>` : ``}
      <div class="gif-overlay" aria-hidden="true">
        <div class="gif-title">${title}</div>
        <div class="gif-actions">
          <button class="gif-action-btn fav-btn ${favored ? `active` : ``}" data-id="${gif.id}" aria-pressed="${favored}" aria-label="${favored ? `Remove from favorites` : `Add to favorites`}">
            ${favored ? `♥ Saved` : `♥`}
          </button>
          <button class="gif-action-btn copy-url-btn" data-url="${original}" aria-label="Copy GIF URL">🔗</button>
          <button class="gif-action-btn preview-btn" aria-label="Open preview">⤢</button>
        </div>
      </div>
    `;

    const img = card.querySelector(`.gif-thumb`);

    // Hover-to-play
    card.addEventListener(`mouseenter`, () => {
      if (animated) img.src = animated;
    });
    card.addEventListener(`mouseleave`, () => {
      if (still) img.src = still;
    });

    // Keyboard play on focus
    card.addEventListener(`focusin`, () => {
      if (animated) img.src = animated;
    });
    card.addEventListener(`focusout`, () => {
      if (still) img.src = still;
    });

    // Open modal on card click (not on action buttons)
    card.addEventListener(`click`, (e) => {
      if (!e.target.closest(`.gif-action-btn`)) {
        openModal(gif);
      }
    });

    card.addEventListener(`keydown`, (e) => {
      if (e.key === `Enter` || e.key === ` `) {
        e.preventDefault();
        openModal(gif);
      }
    });

    // Fav button
    const favBtn = card.querySelector(`.fav-btn`);
    favBtn.addEventListener(`click`, (e) => {
      e.stopPropagation();
      toggleFav(gif);
    });

    // Copy URL button
    const copyUrlBtn = card.querySelector(`.copy-url-btn`);
    copyUrlBtn.addEventListener(`click`, (e) => {
      e.stopPropagation();
      copyToClipboard(original, `GIF URL copied!`);
    });

    // Preview button
    const previewBtn = card.querySelector(`.preview-btn`);
    previewBtn.addEventListener(`click`, (e) => {
      e.stopPropagation();
      openModal(gif);
    });

    return card;
  }

  // ── MODAL ────────────────────────────────────────────────────────────
  function openModal(gif) {
    currentGif = gif;
    const images = gif.images || {};
    const big = (images.original && images.original.url) ||
                (images.downsized && images.downsized.url) ||
                (images.fixed_width && images.fixed_width.url) || ``;

    modalImg.src = big;
    modalImg.alt = gif.title || `GIF`;
    modalTitle.textContent = gif.title || `GIF`;

    const favored = isFav(gif.id);
    modalFav.classList.toggle(`active`, favored);
    modalFav.textContent = favored ? `♥ Saved` : `♥ Favorite`;

    modalDownload.href = big;
    modalDownload.setAttribute(`download`, `gif-${gif.id}.gif`);

    modal.classList.add(`open`);
    document.body.style.overflow = `hidden`;
    modalClose.focus();
  }

  function closeModal() {
    modal.classList.remove(`open`);
    document.body.style.overflow = ``;
    currentGif = null;
    modalImg.src = ``;
  }

  modalClose.addEventListener(`click`, closeModal);

  modal.addEventListener(`click`, (e) => {
    if (e.target === modal) closeModal();
  });

  document.addEventListener(`keydown`, (e) => {
    if (e.key === `Escape` && modal.classList.contains(`open`)) closeModal();
  });

  modalCopyUrl.addEventListener(`click`, () => {
    if (!currentGif) return;
    const images = currentGif.images || {};
    const url = (images.original && images.original.url) || ``;
    copyToClipboard(url, `GIF URL copied!`);
  });

  modalCopyEmbed.addEventListener(`click`, () => {
    if (!currentGif) return;
    const images = currentGif.images || {};
    const url = (images.original && images.original.url) || ``;
    const title = currentGif.title || `GIF`;
    const embed = `<img src="${url}" alt="${title}" style="max-width:100%;border-radius:8px;" />`;
    copyToClipboard(embed, `Embed code copied!`);
  });

  modalFav.addEventListener(`click`, () => {
    if (!currentGif) return;
    toggleFav(currentGif);
  });

  // ── CLIPBOARD ────────────────────────────────────────────────────────
  function copyToClipboard(text, successMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showToast(successMsg)).catch(() => showToast(`Copy failed`));
    } else {
      try {
        const ta = document.createElement(`textarea`);
        ta.value = text;
        ta.style.position = `fixed`;
        ta.style.opacity = `0`;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand(`copy`);
        document.body.removeChild(ta);
        showToast(successMsg);
      } catch {
        showToast(`Copy not supported`);
      }
    }
  }

  // ── API ──────────────────────────────────────────────────────────────
  async function fetchGifs(query, offset, rating) {
    let url;
    if (query) {
      url = `https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_KEY}&q=${encodeURIComponent(query)}&rating=${rating}&limit=${PAGE_SIZE}&offset=${offset}`;
    } else {
      url = `https://api.giphy.com/v1/gifs/trending?api_key=${GIPHY_KEY}&rating=${rating}&limit=${PAGE_SIZE}&offset=${offset}`;
    }

    const res = await fetch(url);
    if (!res.ok) throw new Error(`API error ${res.status}`);
    return res.json();
  }

  // ── RENDER RESULTS ────────────────────────────────────────────────────
  function renderGifs(gifs, append = false) {
    if (!append) gifGrid.innerHTML = ``;
    if (gifs.length === 0 && !append) {
      showEmptyState();
      return;
    }
    const frag = document.createDocumentFragment();
    gifs.forEach(gif => frag.appendChild(createCard(gif)));
    gifGrid.appendChild(frag);
  }

  function showEmptyState(error = false) {
    stateBox.innerHTML = `
      <div class="state-box" role="status">
        <div class="icon">${error ? `⚠️` : `🔍`}</div>
        <h3>${error ? `Oops, something went wrong` : `No GIFs found`}</h3>
        <p>${error ? `Could not load GIFs. Check your connection and try again.` : `Try a different keyword or browse the categories above.`}</p>
        ${error ? `<button class="retry-btn" id="retryBtn">Try Again</button>` : ``}
      </div>
    `;
    if (error) {
      document.getElementById(`retryBtn`).addEventListener(`click`, () => loadGifs(false));
    }
  }

  // ── LOAD GIFS ────────────────────────────────────────────────────────
  async function loadGifs(append = false) {
    if (isLoading) return;
    isLoading = true;
    stateBox.innerHTML = ``;

    if (!append) {
      gifGrid.innerHTML = ``;
      currentOffset = 0;
      showSkeleton();
      loadMoreWrap.style.display = `none`;
    } else {
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = `Loading…`;
    }

    try {
      const data = await fetchGifs(currentQuery, currentOffset, currentRating);
      const gifs = data.data || [];
      const pagination = data.pagination || {};

      hideSkeleton();
      totalCount = pagination.total_count || gifs.length;
      currentOffset += gifs.length;

      if (!append) {
        resultCount.textContent = gifs.length > 0 ? `${totalCount.toLocaleString()} results` : `0 results`;
      }

      renderGifs(gifs, append);

      // Show load more if there might be more results
      if (currentOffset < Math.min(totalCount, 200) && gifs.length === PAGE_SIZE) {
        loadMoreWrap.style.display = `flex`;
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = `Load more GIFs`;
      } else {
        loadMoreWrap.style.display = `none`;
      }

    } catch (err) {
      hideSkeleton();
      if (!append) {
        showEmptyState(true);
        resultCount.textContent = `Error`;
      } else {
        showToast(`Failed to load more GIFs`);
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = `Load more GIFs`;
      }
    } finally {
      isLoading = false;
    }
  }

  // ── FAVORITES PANEL ───────────────────────────────────────────────────
  function renderFavPanel() {
    const favs = getFavs();
    const items = Object.values(favs);
    favResultCount.textContent = `${items.length} saved`;

    if (items.length === 0) {
      favGrid.innerHTML = ``;
      favEmpty.style.display = `block`;
    } else {
      favEmpty.style.display = `none`;
      favGrid.innerHTML = ``;
      const frag = document.createDocumentFragment();
      items.forEach(gif => frag.appendChild(createCard(gif)));
      favGrid.appendChild(frag);
    }
  }

  // ── TABS ──────────────────────────────────────────────────────────────
  function setTab(tab) {
    activeTab = tab;
    document.querySelectorAll(`.tab-btn`).forEach(btn => {
      const isActive = btn.dataset.tab === tab;
      btn.classList.toggle(`active`, isActive);
      btn.setAttribute(`aria-pressed`, String(isActive));
    });

    if (tab === `favorites`) {
      searchPanel.style.display = `none`;
      categoriesEl.style.display = `none`;
      favPanel.classList.add(`visible`);
      renderFavPanel();
    } else {
      searchPanel.style.display = `block`;
      categoriesEl.style.display = `flex`;
      favPanel.classList.remove(`visible`);
    }
  }

  document.querySelectorAll(`.tab-btn`).forEach(btn => {
    btn.addEventListener(`click`, () => setTab(btn.dataset.tab));
  });

  // ── CATEGORY PILLS ────────────────────────────────────────────────────
  document.querySelectorAll(`.category-pill`).forEach(pill => {
    pill.addEventListener(`click`, () => {
      document.querySelectorAll(`.category-pill`).forEach(p => {
        p.classList.remove(`active`);
        p.setAttribute(`aria-pressed`, `false`);
      });
      pill.classList.add(`active`);
      pill.setAttribute(`aria-pressed`, `true`);

      currentQuery = pill.dataset.query;
      searchInput.value = currentQuery;
      clearBtn.classList.toggle(`visible`, currentQuery.length > 0);

      const label = pill.textContent.trim();
      sectionTitle.textContent = currentQuery ? label : `🔥 Trending GIFs`;
      loadGifs(false);
    });
  });

  // ── SEARCH ────────────────────────────────────────────────────────────
  let debounceTimer;

  searchInput.addEventListener(`input`, () => {
    const val = searchInput.value.trim();
    clearBtn.classList.toggle(`visible`, val.length > 0);

    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      currentQuery = val;

      // Deactivate category pills
      document.querySelectorAll(`.category-pill`).forEach(p => {
        p.classList.remove(`active`);
        p.setAttribute(`aria-pressed`, `false`);
      });
      if (!val) {
        document.querySelector(`.category-pill[data-query=""]`).classList.add(`active`);
        document.querySelector(`.category-pill[data-query=""]`).setAttribute(`aria-pressed`, `true`);
      }

      sectionTitle.textContent = val ? `🔍 Results for "${val}"` : `🔥 Trending GIFs`;
      loadGifs(false);
    }, DEBOUNCE_MS);
  });

  clearBtn.addEventListener(`click`, () => {
    searchInput.value = ``;
    clearBtn.classList.remove(`visible`);
    currentQuery = ``;
    sectionTitle.textContent = `🔥 Trending GIFs`;
    document.querySelectorAll(`.category-pill`).forEach(p => {
      p.classList.remove(`active`);
      p.setAttribute(`aria-pressed`, `false`);
    });
    document.querySelector(`.category-pill[data-query=""]`).classList.add(`active`);
    document.querySelector(`.category-pill[data-query=""]`).setAttribute(`aria-pressed`, `true`);
    loadGifs(false);
    searchInput.focus();
  });

  // ── RATING FILTER ─────────────────────────────────────────────────────
  ratingFilter.addEventListener(`change`, () => {
    currentRating = ratingFilter.value;
    loadGifs(false);
  });

  // ── LOAD MORE ─────────────────────────────────────────────────────────
  loadMoreBtn.addEventListener(`click`, () => loadGifs(true));

  // ── SCROLL TO TOP ─────────────────────────────────────────────────────
  window.addEventListener(`scroll`, () => {
    scrollTopBtn.classList.toggle(`visible`, window.scrollY > 400);
  }, { passive: true });

  scrollTopBtn.addEventListener(`click`, () => {
    window.scrollTo({ top: 0, behavior: `smooth` });
  });

  // ── INFINITE SCROLL (optional bottom detection) ────────────────────
  const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && !isLoading && activeTab === `search`) {
      const hasMore = currentOffset < Math.min(totalCount, 200);
      if (hasMore) loadGifs(true);
    }
  }, { rootMargin: `200px` });

  observer.observe(loadMoreBtn);

  // ── INIT ──────────────────────────────────────────────────────────────
  updateFavCount();
  loadGifs(false);

})();
</script>
</body>
</html>
