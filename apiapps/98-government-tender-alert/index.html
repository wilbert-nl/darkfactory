<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TenderWatch — Government Contract Intelligence</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080c10;
      --surface: #0e1318;
      --surface2: #141a21;
      --border: rgba(255,255,255,0.08);
      --accent: #00d4aa;
      --accent2: #f59e0b;
      --text: #e6edf3;
      --muted: #6b7280;
      --green: #26a69a;
      --yellow: #f59e0b;
      --radius: 6px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Layout ── */
    .app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .logo span { color: var(--accent); }

    nav { display: flex; gap: 4px; }

    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover, .nav-btn.active {
      background: var(--surface2);
      color: var(--text);
    }

    .nav-btn.active { color: var(--accent); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .saved-badge {
      background: var(--accent);
      color: #fff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Main ── */
    main { flex: 1; padding: 24px; max-width: 1400px; margin: 0 auto; width: 100%; }

    /* ── Views ── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── Stats Bar ── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .stat-card:hover { border-color: var(--accent); transform: translateY(-1px); }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .stat-icon.purple { background: rgba(108, 99, 255, 0.15); }
    .stat-icon.pink { background: rgba(255, 101, 132, 0.15); }
    .stat-icon.green { background: rgba(67, 217, 173, 0.15); }
    .stat-icon.yellow { background: rgba(247, 201, 72, 0.15); }

    .stat-value { font-size: 22px; font-weight: 700; line-height: 1; }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-wrap {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 16px;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 10px 12px 10px 38px;
      font-size: 14px;
      transition: border-color 0.2s;
      outline: none;
    }

    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }

    .filter-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
      min-width: 140px;
    }

    .filter-select:focus { border-color: var(--accent); }

    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: #7c74ff; transform: translateY(-1px); }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    .btn-danger {
      background: rgba(255, 101, 132, 0.15);
      color: var(--accent2);
      border: 1px solid rgba(255, 101, 132, 0.3);
    }

    .btn-danger:hover { background: rgba(255, 101, 132, 0.25); }

    /* ── Tender Grid ── */
    .results-meta {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .results-meta strong { color: var(--text); }

    .tender-grid {
      display: grid;
      gap: 16px;
    }

    /* ── Tender Card ── */
    .tender-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: all 0.25s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .tender-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .tender-card:hover { border-color: var(--accent); transform: translateX(3px); }
    .tender-card:hover::before { opacity: 1; }
    .tender-card:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

    .tender-card.saved { border-color: rgba(108, 99, 255, 0.4); }
    .tender-card.saved::before { opacity: 1; background: var(--green); }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }

    .card-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: all 0.2s;
    }

    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn.saved-btn.active { background: rgba(67, 217, 173, 0.15); border-color: var(--green); color: var(--green); }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tag {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .tag-category { background: rgba(108, 99, 255, 0.15); color: var(--accent); }
    .tag-country { background: rgba(255, 101, 132, 0.15); color: var(--accent2); }
    .tag-source { background: rgba(67, 217, 173, 0.1); color: var(--green); border: 1px solid rgba(67, 217, 173, 0.2); }

    .card-desc {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-info {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .info-item strong { color: var(--text); }

    .deadline-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    .deadline-urgent { background: rgba(255, 101, 132, 0.15); color: var(--accent2); border: 1px solid rgba(255, 101, 132, 0.3); }
    .deadline-soon { background: rgba(247, 201, 72, 0.15); color: var(--yellow); border: 1px solid rgba(247, 201, 72, 0.3); }
    .deadline-ok { background: rgba(67, 217, 173, 0.1); color: var(--green); border: 1px solid rgba(67, 217, 173, 0.2); }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; color: var(--text); margin-bottom: 8px; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }

    .modal-overlay.hidden { display: none; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 680px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      animation: slideUp 0.25s ease;
    }

    .modal-header {
      padding: 24px 24px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-title { font-size: 18px; font-weight: 700; line-height: 1.3; }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .modal-close:hover { color: var(--text); border-color: var(--accent2); }

    .modal-body { padding: 20px 24px 24px; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .detail-item {
      background: var(--surface2);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .detail-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .detail-value { font-size: 14px; font-weight: 600; color: var(--text); }

    .modal-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 20px;
    }

    /* ── Checklist ── */
    .checklist-section { margin-top: 20px; }

    .checklist-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checklist-progress {
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
    }

    .progress-bar {
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .checklist-item:last-child { border-bottom: none; }

    .checklist-cb {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1.5px solid var(--border);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      appearance: none;
      -webkit-appearance: none;
      margin-top: 1px;
      transition: all 0.2s;
      position: relative;
    }

    .checklist-cb:checked {
      background: var(--green);
      border-color: var(--green);
    }

    .checklist-cb:checked::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #000;
      font-size: 11px;
      font-weight: 700;
    }

    .checklist-label {
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      transition: color 0.2s;
    }

    .checklist-label.checked { color: var(--muted); text-decoration: line-through; }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* ── Calendar View ── */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .cal-header-cell {
      background: var(--surface);
      padding: 10px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cal-cell {
      background: var(--surface);
      min-height: 90px;
      padding: 8px;
    }

    .cal-day-num {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .cal-day-num.today {
      background: var(--accent);
      color: #fff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .cal-event {
      background: rgba(108, 99, 255, 0.2);
      border-left: 2px solid var(--accent);
      border-radius: 3px;
      padding: 2px 5px;
      font-size: 10px;
      color: var(--accent);
      margin-bottom: 2px;
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      transition: background 0.2s;
    }

    .cal-event:hover { background: rgba(108, 99, 255, 0.35); }
    .cal-event.urgent { background: rgba(255, 101, 132, 0.15); border-color: var(--accent2); color: var(--accent2); }
    .cal-event.soon { background: rgba(247, 201, 72, 0.1); border-color: var(--yellow); color: var(--yellow); }

    .cal-other-month { opacity: 0.35; }

    /* ── Saved View ── */
    .saved-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    /* ── Toast ── */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 260px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      animation: slideUp 0.3s ease;
    }

    .toast.success { border-color: rgba(67, 217, 173, 0.4); }
    .toast.info { border-color: rgba(108, 99, 255, 0.4); }
    .toast.warning { border-color: rgba(247, 201, 72, 0.4); }

    .toast-icon { font-size: 18px; }
    .toast-fadeout { animation: fadeOut 0.3s ease forwards; }

    @keyframes fadeOut { to { opacity: 0; transform: translateX(20px); } }

    /* ── Pulse animation for urgent items ── */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .urgent-pulse { animation: pulse 2s infinite; }

    /* ── Calendar nav ── */
    .calendar-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .cal-month-title { font-size: 18px; font-weight: 700; }

    /* ── Section title ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
    }

    .section-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Focus ring for a11y ── */
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .detail-grid { grid-template-columns: 1fr; }
      nav .nav-btn span { display: none; }
    }

    @media (max-width: 480px) {
      .stats-bar { grid-template-columns: 1fr; }
      header { padding: 0 16px; }
      main { padding: 16px; }
    }

/* ── Finance design system v2 ── */
body { font-family: 'Inter', system-ui, sans-serif; }
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, rgba(0,212,170,.065) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(8,12,16,.9) 100%);
  pointer-events: none;
  z-index: 0;
}
h1, h2 {
  font-family: 'Inter', system-ui, sans-serif;
  font-weight: 700;
  letter-spacing: -.03em;
  background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
[class*="price"],[class*="value"],[class*="amount"],[class*="rate"],
[class*="stat"],[class*="metric"],[class*="kpi"],td,code,.number {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-variant-numeric: tabular-nums slashed-zero;
  font-feature-settings: 'tnum' 1, 'zero' 1;
}
.card,[class*="card"],[class*="metric-card"],[class*="stat-card"] {
  border-left: 3px solid var(--accent) !important;
  box-shadow: 0 2px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
}
table { border-collapse: collapse; width: 100%; }
thead th {
  font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,.08);
  text-align: right; white-space: nowrap; position: sticky; top: 0; background: var(--bg);
}
thead th:first-child { text-align: left; }
tbody tr { border-bottom: 1px solid rgba(255,255,255,.04); transition: background 120ms; }
tbody tr:hover { background: rgba(255,255,255,.04); }
td { padding: 6px 12px; text-align: right; vertical-align: middle; white-space: nowrap; font-size: 13px; }
td:first-child { text-align: left; color: var(--text); }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }
@keyframes slideUp { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
@keyframes livePulse { 0%,100%{box-shadow:0 0 0 0 rgba(0,212,170,.5);} 50%{box-shadow:0 0 0 6px rgba(0,212,170,0);} }
.card,[class*="card"],[class*="result"],[class*="item"] { animation: slideUp .35s ease both; }
.card:nth-child(2),[class*="item"]:nth-child(2){animation-delay:.05s}
.card:nth-child(3),[class*="item"]:nth-child(3){animation-delay:.1s}
.card:nth-child(4){animation-delay:.15s}
tbody tr { animation: slideUp .2s ease both; }
tbody tr:nth-child(2){animation-delay:.03s} tbody tr:nth-child(3){animation-delay:.06s}
button,[class*="btn"] { transition: all .15s; }
button:hover,[class*="btn"]:hover {
  border-color: var(--accent) !important;
  box-shadow: 0 0 0 1px var(--accent), 0 4px 16px rgba(0,212,170,.15) !important;
}
input:focus,select:focus { border-color:var(--accent)!important; box-shadow:0 0 0 2px rgba(0,212,170,.2); }
[class*="positive"],[class*="gain"],[class*="up"] { color:var(--green)!important; }

    <!-- Browse View -->

          </div>
        </div>

            <div class="stat-label">Total Value (visible)</div>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input
            type="search"
            class="search-input"
            id="searchInput"
            placeholder="Search tenders by title, agency, keyword…"
            aria-label="Search tenders"
            oninput="applyFilters()"
          />
        </div>
        <select class="filter-select" id="categoryFilter" aria-label="Filter by category" onchange="applyFilters()">
          <option value="">All Categories</option>
          <option value="IT">IT &amp; Digital</option>
          <option value="Construction">Construction</option>
          <option value="Consulting">Consulting</option>
          <option value="Healthcare">Healthcare</option>
          <option value="Education">Education</option>
          <option value="Defence">Defence</option>
          <option value="Environment">Environment</option>
          <option value="Transport">Transport</option>
        </select>
        <select class="filter-select" id="countryFilter" aria-label="Filter by country" onchange="applyFilters()">
          <option value="">All Countries</option>
          <option value="USA">USA</option>
          <option value="UK">UK</option>
          <option value="Canada">Canada</option>
          <option value="Australia">Australia</option>
          <option value="Netherlands">Netherlands</option>
          <option value="Germany">Germany</option>
        </select>
        <select class="filter-select" id="deadlineFilter" aria-label="Filter by deadline" onchange="applyFilters()">
          <option value="">Any Deadline</option>
          <option value="7">Within 7 days</option>
          <option value="14">Within 14 days</option>
          <option value="30">Within 30 days</option>
          <option value="60">Within 60 days</option>
        </select>
      </div>

      <div class="results-meta" id="resultsMeta"></div>
      <div class="tender-grid" id="tenderGrid" role="list"></div>
    </div>

    <!-- Saved View -->
    <div class="view" id="view-saved">
      <div class="section-header">
        <div>
          <div class="section-title">Saved Tenders</div>
          <div class="section-sub">Tenders you are tracking and following</div>

      </div>
      <div id="savedGrid" class="tender-grid" role="list"></div>
    </div>

    <!-- Calendar View -->
    <div class="view" id="view-calendar">

</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<!-- Tender Detail Modal -->
<div class="modal-overlay hidden" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="handleOverlayClick(event)">

  </div>
</div>

function daysUntil(dateStr) {
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  const d = new Date(dateStr);
  d.setHours(0, 0, 0, 0);
  return Math.ceil((d - now) / 86400000);
}

function deadlineClass(days) {
  if (days <= 7) return 'deadline-urgent';
  if (days <= 21) return 'deadline-soon';
  return 'deadline-ok';
}

function deadlineLabel(days) {
  if (days < 0) return `Closed ${Math.abs(days)}d ago`;
  if (days === 0) return 'Closes TODAY';
  if (days === 1) return '1 day left';
  return `${days} days left`;
}

function formatValue(v) {
  if (v >= 1000000) return `$${(v / 1000000).toFixed(1)}M`;
  if (v >= 1000) return `$${(v / 1000).toFixed(0)}K`;
  return `$${v}`;
}

function formatDate(str) {
  const d = new Date(str);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ═══════════════════════════════════════
   SAVE / PERSIST
═══════════════════════════════════════ */
function savePersist() {
  localStorage.setItem('tw_saved', JSON.stringify([...savedIds]));
  localStorage.setItem('tw_checklists', JSON.stringify(checklistState));
}

function toggleSave(id, event) {
  if (event) event.stopPropagation();
  if (savedIds.has(id)) {
    savedIds.delete(id);
    showToast('Tender removed from saved', 'info', '☆');
  } else {
    savedIds.add(id);
    showToast('Tender saved! Track it in the Saved tab.', 'success', '★');
  }
  savePersist();
  updateSavedCount();
  // Update button states without full re-render
  document.querySelectorAll(`.saved-btn[data-id="${id}"]`).forEach(btn => {
    if (savedIds.has(id)) {
      btn.classList.add('active');
      btn.title = 'Remove from saved';
      btn.setAttribute('aria-pressed', 'true');
    } else {
      btn.classList.remove('active');
      btn.title = 'Save tender';
      btn.setAttribute('aria-pressed', 'false');
    }
  });
  document.querySelectorAll(`.tender-card[data-id="${id}"]`).forEach(card => {
    if (savedIds.has(id)) card.classList.add('saved');
    else card.classList.remove('saved');
  });
  if (currentView === 'saved') renderSaved();
}

function updateSavedCount() {
  const n = savedIds.size;
  document.getElementById('savedCount').textContent = n;
  document.getElementById('statSaved').textContent = n;
}

/* ═══════════════════════════════════════
   STATS
═══════════════════════════════════════ */
function updateStats() {
  document.getElementById('statTotal').textContent = filteredTenders.length;
  const urgent = filteredTenders.filter(t => daysUntil(t.deadline) <= 7 && daysUntil(t.deadline) >= 0).length;
  document.getElementById('statUrgent').textContent = urgent;
  const totalVal = filteredTenders.reduce((s, t) => s + t.value, 0);
  document.getElementById('statValue').textContent = formatValue(totalVal);
}

/* ═══════════════════════════════════════
   FILTERS
═══════════════════════════════════════ */
function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const cat = document.getElementById('categoryFilter').value;
  const country = document.getElementById('countryFilter').value;
  const days = parseInt(document.getElementById('deadlineFilter').value) || 0;

  filteredTenders = TENDERS.filter(t => {
    if (cat && t.category !== cat) return false;
    if (country && t.country !== country) return false;
    if (days) {
      const d = daysUntil(t.deadline);
      if (d < 0 || d > days) return false;
    }
    if (q) {
      const haystack = `${t.title} ${t.authority} ${t.category} ${t.country} ${t.description} ${t.id}`.toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  renderTenders();
  updateStats();
}

/* ═══════════════════════════════════════
   RENDER TENDER CARD
═══════════════════════════════════════ */
function renderCard(t) {
  const days = daysUntil(t.deadline);
  const dClass = deadlineClass(days);
  const isSaved = savedIds.has(t.id);
  const isUrgent = days <= 7 && days >= 0;

  return `
    <article
      class="tender-card${isSaved ? ' saved' : ''}"
      data-id="${t.id}"
      tabindex="0"
      role="listitem"
      onclick="openModal('${t.id}')"
      onkeydown="if(event.key==='Enter'||event.key===' '){openModal('${t.id}')}"
      aria-label="Tender: ${escapeHtml(t.title)}"
    >
      <div class="card-header">
        <div class="card-title">${escapeHtml(t.title)}</div>
        <div class="card-actions">
          <button
            class="icon-btn saved-btn${isSaved ? ' active' : ''}"
            data-id="${t.id}"
            onclick="toggleSave('${t.id}', event)"
            title="${isSaved ? 'Remove from saved' : 'Save tender'}"
            aria-pressed="${isSaved ? 'true' : 'false'}"
            aria-label="Save tender"
          >${isSaved ? '★' : '☆'}</button>
        </div>
      </div>

      <div class="card-meta">
        <span class="tag tag-category">${escapeHtml(t.category)}</span>
        <span class="tag tag-country">${escapeHtml(t.country)}</span>
        <span class="tag tag-source">${escapeHtml(t.source)}</span>
      </div>

      <div class="card-desc">${escapeHtml(t.description)}</div>

      <div class="card-footer">
        <div class="card-info">
          <div class="info-item">🏛 <strong>${escapeHtml(t.authority)}</strong></div>
          <div class="info-item">💰 <strong>${formatValue(t.value)}</strong></div>
          <div class="info-item">📍 ${escapeHtml(t.location)}</div>
          <div class="info-item">🔖 ${escapeHtml(t.id)}</div>
        </div>
        <div class="deadline-badge ${dClass}${isUrgent ? ' urgent-pulse' : ''}">
          ${deadlineLabel(days)} — ${formatDate(t.deadline)}
        </div>
      </div>
    </article>
  `;
}

/* ═══════════════════════════════════════
   RENDER TENDER LIST
═══════════════════════════════════════ */
function renderTenders() {
  const grid = document.getElementById('tenderGrid');
  const meta = document.getElementById('resultsMeta');

  if (filteredTenders.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <h3>No tenders found</h3>
        <p>Try adjusting your search or filters.</p>
      </div>
    `;
    meta.textContent = 'No results found';
    return;
  }

  const sorted = [...filteredTenders].sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
  meta.innerHTML = `Showing <strong>${sorted.length}</strong> of <strong>${TENDERS.length}</strong> tenders — sorted by deadline`;
  grid.innerHTML = sorted.map(renderCard).join('');
}

/* ═══════════════════════════════════════
   RENDER SAVED
═══════════════════════════════════════ */
function renderSaved() {
  const grid = document.getElementById('savedGrid');
  const saved = TENDERS.filter(t => savedIds.has(t.id));

  if (saved.length === 0) {
    grid.innerHTML = `
      <div class="saved-empty">
        <div class="empty-icon">☆</div>
        <h3>No saved tenders yet</h3>
        <p>Browse tenders and click the star icon to save and track them here.</p>
      </div>
    `;
    return;
  }

  const sorted = [...saved].sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
  grid.innerHTML = sorted.map(renderCard).join('');
}

function clearAllSaved() {
  if (savedIds.size === 0) { showToast('No saved tenders to clear', 'info', 'ℹ'); return; }
  savedIds.clear();
  savePersist();
  updateSavedCount();
  renderSaved();
  showToast('All saved tenders cleared', 'warning', '🗑');
}

/* ═══════════════════════════════════════
   MODAL
═══════════════════════════════════════ */
function openModal(id) {
  const t = TENDERS.find(x => x.id === id);
  if (!t) return;

  const days = daysUntil(t.deadline);
  const dClass = deadlineClass(days);
  const isSaved = savedIds.has(id);

  // Build checklist state for this tender
  if (!checklistState[id]) checklistState[id] = new Array(CHECKLIST_ITEMS.length).fill(false);
  const checks = checklistState[id];
  const doneCount = checks.filter(Boolean).length;
  const pct = Math.round((doneCount / CHECKLIST_ITEMS.length) * 100);

  document.getElementById('modalTitle').textContent = t.title;

  document.getElementById('modalBody').innerHTML = `
    <div style="margin-bottom:16px">
      <div class="card-meta">
        <span class="tag tag-category">${escapeHtml(t.category)}</span>
        <span class="tag tag-country">${escapeHtml(t.country)}</span>
        <span class="tag tag-source">${escapeHtml(t.source)}</span>
        <span class="deadline-badge ${dClass}">${deadlineLabel(days)}</span>
      </div>
    </div>

    <div class="detail-grid">
      <div class="detail-item">
        <div class="detail-label">Contracting Authority</div>
        <div class="detail-value">${escapeHtml(t.authority)}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Reference Number</div>
        <div class="detail-value">${escapeHtml(t.id)}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Estimated Value</div>
        <div class="detail-value" style="color:var(--green)">${formatValue(t.value)} <small style="color:var(--muted);font-weight:400;">(${t.value.toLocaleString('en-US', {style:'currency',currency:'USD',maximumFractionDigits:0})})</small></div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Submission Deadline</div>
        <div class="detail-value">${formatDate(t.deadline)}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Location</div>
        <div class="detail-value">${escapeHtml(t.location)}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">${t.naics ? 'NAICS Code' : 'CPV Code'}</div>
        <div class="detail-value">${escapeHtml(t.naics || t.cpv || 'N/A')}</div>
      </div>
    </div>

    <p class="modal-desc">${escapeHtml(t.description)}</p>

    <div class="checklist-section">
      <div class="checklist-title">
        Submission Checklist
        <span class="checklist-progress">${doneCount} / ${CHECKLIST_ITEMS.length} complete (${pct}%)</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:${pct}%"></div>
      </div>
      ${CHECKLIST_ITEMS.map((item, i) => `
        <label class="checklist-item" for="cb-${i}">
          <input
            type="checkbox"
            class="checklist-cb"
            id="cb-${i}"
            ${checks[i] ? 'checked' : ''}
            onchange="toggleCheck('${id}', ${i}, this)"
            aria-label="${escapeHtml(item)}"
          />
          <span class="checklist-label${checks[i] ? ' checked' : ''}" id="cbl-${i}">${escapeHtml(item)}</span>
        </label>
      `).join('')}
    </div>
  `;

  document.getElementById('modalFooter').innerHTML = `
    <button class="btn btn-outline" onclick="toggleSave('${id}', event); updateModalSaveBtn('${id}')">
      ${isSaved ? '★ Unfollow' : '☆ Follow Tender'}
    </button>
    <button class="btn btn-primary" onclick="closeModal()">Done</button>
  `;

  document.getElementById('modalOverlay').classList.remove('hidden');
  document.getElementById('modalOverlay').focus();
}

function updateModalSaveBtn(id) {
  const btn = document.getElementById('modalFooter').querySelector('button:first-child');
  if (btn) btn.textContent = savedIds.has(id) ? '★ Unfollow' : '☆ Follow Tender';
}

function toggleCheck(tenderId, idx, cb) {
  if (!checklistState[tenderId]) checklistState[tenderId] = new Array(CHECKLIST_ITEMS.length).fill(false);
  checklistState[tenderId][idx] = cb.checked;
  savePersist();

  const label = document.getElementById(`cbl-${idx}`);
  if (label) {
    if (cb.checked) label.classList.add('checked');
    else label.classList.remove('checked');
  }

  // Update progress
  const checks = checklistState[tenderId];
  const doneCount = checks.filter(Boolean).length;
  const pct = Math.round((doneCount / CHECKLIST_ITEMS.length) * 100);
  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = `${pct}%`;
  const prog = document.querySelector('.checklist-progress');
  if (prog) prog.textContent = `${doneCount} / ${CHECKLIST_ITEMS.length} complete (${pct}%)`;
}

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

/* ═══════════════════════════════════════
   CALENDAR
═══════════════════════════════════════ */
function renderCalendar() {
  const title = document.getElementById('calTitle');
  const grid = document.getElementById('calendarGrid');

  const monthName = new Date(calYear, calMonth, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  title.textContent = monthName;

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  const today = new Date();
  const todayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

  // Build deadline map
  const deadlineMap = {};
  TENDERS.forEach(t => {
    if (!deadlineMap[t.deadline]) deadlineMap[t.deadline] = [];
    deadlineMap[t.deadline].push(t);
  });

  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  let html = days.map(d => `<div class="cal-header-cell">${d}</div>`).join('');

  // Pad start
  for (let i = 0; i < firstDay; i++) {
    const day = daysInPrev - firstDay + 1 + i;
    html += `<div class="cal-cell cal-other-month"><div class="cal-day-num">${day}</div></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateKey = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isToday = dateKey === todayKey;
    const tenders = deadlineMap[dateKey] || [];
    const dayDays = daysUntil(dateKey);

    html += `<div class="cal-cell">
      <div class="cal-day-num${isToday ? ' today' : ''}">${isToday ? `<div class="today">${d}</div>` : d}</div>
      ${tenders.map(t => {
        const cls = dayDays <= 7 ? 'urgent' : dayDays <= 21 ? 'soon' : '';
        return `<div class="cal-event ${cls}" onclick="openModal('${t.id}')" title="${escapeHtml(t.title)}" tabindex="0" onkeydown="if(event.key==='Enter'){openModal('${t.id}')}">${escapeHtml(t.title.substring(0, 28))}${t.title.length > 28 ? '…' : ''}</div>`;
      }).join('')}
    </div>`;
  }

  // Pad end
  const totalCells = firstDay + daysInMonth;
  const remainder = totalCells % 7;
  if (remainder !== 0) {
    for (let i = 1; i <= 7 - remainder; i++) {
      html += `<div class="cal-cell cal-other-month"><div class="cal-day-num">${i}</div></div>`;
    }
  }

  grid.innerHTML = html;
}

function prevMonth() {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}

function nextMonth() {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

/* ═══════════════════════════════════════
   VIEW SWITCHING
═══════════════════════════════════════ */
function switchView(view) {
  currentView = view;

  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

  document.getElementById(`view-${view}`).classList.add('active');
  document.querySelector(`[data-view="${view}"]`).classList.add('active');

  if (view === 'saved') renderSaved();
  if (view === 'calendar') renderCalendar();
}

/* ═══════════════════════════════════════
   EXPORT CSV
═══════════════════════════════════════ */
function exportCSV() {
  const cols = ['ID', 'Title', 'Authority', 'Category', 'Country', 'Location', 'Value (USD)', 'Deadline', 'Days Until Deadline', 'Source', 'Saved'];
  const rows = filteredTenders.map(t => [
    t.id,
    `"${t.title.replace(/"/g, '""')}"`,
    `"${t.authority.replace(/"/g, '""')}"`,
    t.category,
    t.country,
    `"${t.location.replace(/"/g, '""')}"`,
    t.value,
    t.deadline,
    daysUntil(t.deadline),
    t.source,
    savedIds.has(t.id) ? 'Yes' : 'No'
  ]);

  const csv = [cols.join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tenderwatch-export-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`Exported ${filteredTenders.length} tenders to CSV`, 'success', '⬇');
}

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
function showToast(message, type = 'info', icon = 'ℹ') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span class="toast-icon">${icon}</span><span>${escapeHtml(message)}</span>`;
  container.appendChild(toast);

  setTimeout(() => {
    toast.classList.add('toast-fadeout');
    toast.addEventListener('animationend', () => toast.remove());
  }, 3200);
}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
function init() {
  updateSavedCount();
  applyFilters();
  updateStats();
}

init();
</script>
