<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CommuteWatch — Transit Delay Notifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Workbench · tone: control-room utilitarian · anchor hue: electric-blue */
/* Hallmark · pre-emit critique: P5 H5 E5 S5 R4 V4 */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow-x: clip; }
body {
  height: 100%;
  overflow: hidden;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font-family: var(--font-body); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ── Nav — dark control-panel header ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 52px;
  background: var(--color-sidebar);
  border-bottom: 1px solid var(--color-sidebar-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--color-white);
  flex-shrink: 0;
}
.nav-logo span { color: var(--color-accent); }
.nav-sep { width: 1px; height: 16px; background: var(--color-sidebar-border); flex-shrink: 0; }
.nav-page-label {
  font-size: var(--text-sm);
  color: var(--color-sidebar-muted);
  font-weight: 500;
  white-space: nowrap;
}
.nav-refresh-indicator {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--color-sidebar-muted);
  background: var(--color-sidebar-2);
  border: 1px solid var(--color-sidebar-border);
  border-radius: var(--radius-md);
  padding: var(--space-1) var(--space-3);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.refresh-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--color-sidebar-border);
  flex-shrink: 0;
  transition: background var(--dur-base) var(--ease-out);
}
.refresh-dot.live { background: var(--color-success); animation: pulse-dot 2s infinite; }
.refresh-dot.demo { background: var(--color-warn); }
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
.nav-back {
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--color-sidebar-muted);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
  transition: color var(--dur-fast) var(--ease-out);
}
.nav-back:hover { color: var(--color-sidebar-ink); }

/* ── App Shell ── */
.app-shell {
  display: grid;
  grid-template-columns: 264px 1fr;
  margin-top: 52px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar — dark control panel ── */
.sidebar {
  background: var(--color-sidebar);
  border-right: 1px solid var(--color-sidebar-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  padding-bottom: var(--space-4);
  scrollbar-width: thin;
  scrollbar-color: var(--color-sidebar-border) transparent;
}

/* City tabs */
.city-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  border-bottom: 1px solid var(--color-sidebar-border);
  flex-shrink: 0;
}
.city-tab {
  padding: var(--space-3) var(--space-2);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--color-sidebar-muted);
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  text-align: center;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.city-tab:hover { color: var(--color-sidebar-ink); background: var(--color-sidebar-2); }
.city-tab.active {
  color: var(--color-accent);
  border-bottom-color: var(--color-accent);
  background: var(--color-sidebar-2);
}

/* Sidebar sections */
.sb-section {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-sidebar-border);
}
.sb-section-label {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-sidebar-muted);
  margin-bottom: var(--space-3);
  padding-left: var(--space-2);
  border-left: 2px solid var(--color-accent);
  line-height: 1.2;
}

/* Line picker */
.line-grid {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
}
.line-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 28px;
  padding: 0 var(--space-2);
  border-radius: var(--radius-sm);
  font-size: var(--text-xs);
  font-weight: 700;
  cursor: pointer;
  border: 2px solid transparent;
  transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  flex-shrink: 0;
  color: var(--color-white);
}
.line-chip:hover { opacity: 0.85; transform: translateY(-1px); }
.line-chip.selected {
  border-color: var(--color-white);
  box-shadow: 0 0 0 1px var(--color-white);
  opacity: 1;
}

/* NYC line colors */
.nyc-A, .nyc-C, .nyc-E { background: oklch(38% 0.18 255); }
.nyc-1, .nyc-2, .nyc-3 { background: oklch(48% 0.22 25); }
.nyc-4, .nyc-5, .nyc-6 { background: oklch(42% 0.18 155); }
.nyc-N, .nyc-Q, .nyc-R, .nyc-W { background: oklch(70% 0.18 85); color: var(--color-ink); }
.nyc-B, .nyc-D, .nyc-F, .nyc-M { background: oklch(55% 0.20 45); }
.nyc-L { background: oklch(48% 0.03 0); }
.nyc-7 { background: oklch(52% 0.18 315); }
.nyc-G { background: oklch(52% 0.15 155); }
.nyc-J, .nyc-Z { background: oklch(48% 0.14 72); }
.nyc-S { background: oklch(50% 0.02 0); }

/* London line colors */
.tfl-Bakerloo { background: oklch(48% 0.16 50); }
.tfl-Central { background: oklch(48% 0.22 25); }
.tfl-Circle { background: oklch(70% 0.18 85); color: var(--color-ink); }
.tfl-District { background: oklch(42% 0.18 155); }
.tfl-Hammersmith { background: oklch(58% 0.10 330); }
.tfl-Jubilee { background: oklch(52% 0.04 230); }
.tfl-Metropolitan { background: oklch(40% 0.16 340); }
.tfl-Northern { background: oklch(20% 0.02 0); }
.tfl-Piccadilly { background: oklch(35% 0.20 265); }
.tfl-Victoria { background: oklch(50% 0.20 235); }
.tfl-Waterloo { background: oklch(52% 0.15 195); }

/* Saved commutes */
.commute-list { display: flex; flex-direction: column; gap: var(--space-2); }
.commute-item {
  background: var(--color-sidebar-2);
  border: 1px solid var(--color-sidebar-border);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
  position: relative;
}
.commute-item:hover {
  border-color: var(--color-accent);
  background: var(--color-sidebar-3);
}
.commute-item.active {
  border-color: var(--color-accent);
  background: var(--color-sidebar-3);
}
.commute-name {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-sidebar-ink);
  margin-bottom: var(--space-1);
}
.commute-lines {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.commute-line-tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 4px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
  color: var(--color-white);
}
.commute-del {
  position: absolute;
  top: var(--space-2);
  right: var(--space-2);
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: none;
  color: var(--color-sidebar-muted);
  cursor: pointer;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1;
  transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.commute-del:hover {
  color: var(--color-danger);
  background: var(--color-danger-subtle);
}

/* Add commute form */
.add-commute-form {
  display: none;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-3);
  background: var(--color-sidebar-2);
  border: 1px solid var(--color-sidebar-border);
  border-radius: var(--radius-md);
  margin-top: var(--space-2);
}
.add-commute-form.open { display: flex; }
.form-input {
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-sidebar-ink);
  background: var(--color-sidebar-3);
  border: 1px solid var(--color-sidebar-border);
  border-radius: var(--radius-sm);
  padding: var(--space-2) var(--space-3);
  width: 100%;
  transition: border-color var(--dur-fast) var(--ease-out);
}
.form-input:focus { outline: none; border-color: var(--color-accent); }
.form-input::placeholder { color: var(--color-sidebar-muted); }
.form-row { display: flex; gap: var(--space-2); }
.form-label {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-sidebar-muted);
  margin-bottom: var(--space-1);
}

/* Alert settings */
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-2) 0;
}
.setting-label { font-size: var(--text-sm); color: var(--color-sidebar-ink); }
.setting-control {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--color-sidebar-ink);
  background: var(--color-sidebar-2);
  border: 1px solid var(--color-sidebar-border);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-2);
  cursor: pointer;
}
.setting-control:focus { outline: none; border-color: var(--color-accent); }

/* Toggle switch */
.toggle-wrap { display: flex; align-items: center; gap: var(--space-2); }
.toggle {
  position: relative;
  width: 36px;
  height: 20px;
  flex-shrink: 0;
}
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle-track {
  position: absolute;
  inset: 0;
  border-radius: 10px;
  background: var(--color-sidebar-border);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease-out);
}
.toggle-track::after {
  content: '';
  position: absolute;
  left: 2px; top: 2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--color-sidebar-ink);
  transition: transform var(--dur-base) var(--ease-out);
}
.toggle input:checked + .toggle-track { background: var(--color-accent); }
.toggle input:checked + .toggle-track::after { transform: translateX(16px); }

/* Sidebar buttons */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-2) var(--space-4);
  background: var(--color-accent);
  color: var(--color-white);
  font-size: var(--text-sm);
  font-weight: 600;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
}
.btn-primary:hover { transform: translateY(-1px); opacity: 0.9; }
.btn-primary:active { transform: translateY(0); opacity: 1; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-2) var(--space-3);
  background: transparent;
  color: var(--color-sidebar-muted);
  font-size: var(--text-sm);
  font-weight: 500;
  border: 1px solid var(--color-sidebar-border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.btn-ghost:hover { color: var(--color-sidebar-ink); border-color: var(--color-sidebar-muted); }

/* Sidebar footer — Check Now CTA */
.sidebar-footer {
  padding: var(--space-4);
  border-top: 1px solid var(--color-sidebar-border);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.check-now-btn {
  width: 100%;
  padding: var(--space-3) var(--space-4);
  background: var(--color-accent);
  color: var(--color-white);
  font-family: var(--font-display);
  font-size: var(--text-sm);
  font-weight: 600;
  letter-spacing: 0.01em;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
}
.check-now-btn:hover { transform: translateY(-1px); opacity: 0.9; }
.check-now-btn:active { transform: translateY(0); opacity: 1; }
.check-now-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.last-check {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.03em;
  color: var(--color-sidebar-muted);
  text-align: center;
}

/* ── Main panel ── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-paper);
}

/* Tab bar */
.tab-bar {
  display: flex;
  border-bottom: 1px solid var(--color-border);
  padding: 0 var(--space-6);
  flex-shrink: 0;
  background: var(--color-paper);
}
.tab-btn {
  padding: var(--space-4);
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-ink-muted);
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  white-space: nowrap;
}
.tab-btn:hover { color: var(--color-ink); }
.tab-btn.active { color: var(--color-accent); border-bottom-color: var(--color-accent); }

/* Demo banner */
.demo-banner {
  display: none;
  padding: var(--space-2) var(--space-6);
  background: var(--color-warn-subtle);
  border-bottom: 1px solid var(--color-warn-line);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.03em;
  color: var(--color-warn);
  font-weight: 500;
  flex-shrink: 0;
}
.demo-banner.show { display: block; }

/* Panel content */
.panel {
  display: none;
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6);
}
.panel.active { display: block; }

/* ── Live Status panel ── */
.status-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--space-4);
}

.status-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-left: 3px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  transition: border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
  animation: card-in 0.22s var(--ease-out) both;
}
.status-card:hover {
  border-color: var(--color-accent-line);
  border-left-color: var(--color-accent);
  box-shadow: 0 2px 16px var(--color-shadow-card);
}
/* Status-aware left border via :has() */
.status-card:has(.badge-good) { border-left-color: var(--color-success); }
.status-card:has(.badge-minor) { border-left-color: var(--color-warn); }
.status-card:has(.badge-major) { border-left-color: var(--color-danger); }
.status-card:has(.badge-suspended) { border-left-color: var(--color-neutral); }

@keyframes card-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.status-card-header {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.line-dot {
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--color-white);
  flex-shrink: 0;
}
.line-info { flex: 1; min-width: 0; }
.line-name {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Status badges — pill shape, monospace */
.status-badge {
  display: inline-flex;
  align-items: center;
  padding: var(--space-1) var(--space-3);
  border-radius: 99px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  white-space: nowrap;
  flex-shrink: 0;
}
.badge-good { background: var(--color-badge-good-bg); color: var(--color-success); }
.badge-minor { background: var(--color-badge-minor-bg); color: var(--color-warn); }
.badge-major { background: var(--color-badge-major-bg); color: var(--color-danger); }
.badge-suspended { background: var(--color-badge-sus-bg); color: var(--color-ink-muted); }

.status-desc {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  line-height: 1.5;
}
.status-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.btn-add-alert {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-accent);
  background: var(--color-accent-subtle);
  border: 1px solid var(--color-accent-line);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-3);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out);
}
.btn-add-alert:hover { background: var(--color-accent-bg); }
.btn-add-alert.added {
  color: var(--color-ink-muted);
  background: var(--color-paper-2);
  border-color: var(--color-border);
  cursor: default;
}
.delay-mins {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  font-variant-numeric: tabular-nums;
}

/* ── My Commutes panel ── */
.commutes-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 300px;
  gap: var(--space-4);
  text-align: center;
}
.commutes-empty-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
}
.commutes-empty-sub {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  max-width: 280px;
  line-height: 1.65;
}

.commute-cards { display: flex; flex-direction: column; gap: var(--space-6); }

.commute-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
}
.commute-card-header {
  display: flex;
  align-items: flex-start;
  gap: var(--space-4);
  margin-bottom: var(--space-4);
}
.gauge-wrap { flex-shrink: 0; }
.commute-card-info { flex: 1; }
.commute-card-name {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 500;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  margin-bottom: var(--space-1);
}
.commute-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.02em;
  color: var(--color-ink-muted);
}
.commute-affected-lines {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-4);
  padding-bottom: var(--space-4);
  border-bottom: 1px solid var(--color-border);
}
.affected-line {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: var(--text-xs);
}
.affected-line-name { font-weight: 600; color: var(--color-ink); }
.affected-line-status { color: var(--color-ink-muted); }
.commute-actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.btn-copy-alert {
  padding: var(--space-2) var(--space-4);
  background: var(--color-paper);
  color: var(--color-accent);
  font-size: var(--text-sm);
  font-weight: 600;
  border: 1px solid var(--color-accent-line);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out);
}
.btn-copy-alert:hover { background: var(--color-accent-subtle); }

/* Health score arc gauge */
.gauge svg text { font-family: var(--font-body); }

/* ── Delay History panel ── */
.history-grid { display: grid; grid-template-columns: 1fr; gap: var(--space-6); }
.history-section-title {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-ink-muted);
  margin-bottom: var(--space-4);
  padding-left: var(--space-2);
  border-left: 2px solid var(--color-accent);
}
.sparkline-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: var(--space-4);
}
.sparkline-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
}
.sparkline-header {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-2);
}
.sparkline-label { font-size: var(--text-sm); font-weight: 600; color: var(--color-ink); }
.sparkline-stat {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.02em;
  color: var(--color-ink-muted);
  margin-top: 4px;
}

/* Heatmap */
.heatmap-table { width: 100%; border-collapse: collapse; }
.heatmap-table th {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--color-ink-muted);
  text-align: center;
  padding: var(--space-2) var(--space-1);
  letter-spacing: 0.06em;
}
.heatmap-table td {
  padding: var(--space-1);
  text-align: center;
}
.hm-cell {
  width: 28px; height: 28px;
  border-radius: var(--radius-sm);
  margin: auto;
  transition: transform var(--dur-fast) var(--ease-out);
  cursor: default;
}
.hm-cell:hover { transform: scale(1.2); }
.hm-0 { background: var(--color-hm-0); }
.hm-1 { background: var(--color-hm-1); }
.hm-2 { background: var(--color-hm-2); }
.hm-3 { background: var(--color-hm-3); }
.hm-4 { background: var(--color-hm-4); }

.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: var(--space-4);
}
.stat-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
}
.stat-card-label {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-ink-muted);
  margin-bottom: var(--space-2);
  padding-left: var(--space-2);
  border-left: 2px solid var(--color-accent);
}
.stat-card-value {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 500;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  line-height: 1;
}
.stat-card-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.02em;
  color: var(--color-ink-muted);
  margin-top: var(--space-1);
}

/* Loading skeleton */
.skeleton-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-4); }
.skeleton-card {
  height: 120px;
  background-image: linear-gradient(90deg,
    var(--color-paper-2) 0%,
    var(--color-paper-3) 50%,
    var(--color-paper-2) 100%
  );
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-border);
}
@keyframes shimmer {
  from { background-position: 200% 0; }
  to { background-position: -200% 0; }
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 600;
  background: var(--color-ink);
  color: var(--color-paper);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px var(--color-shadow);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--color-success); }
.toast.warn { background: var(--color-warn); color: var(--color-ink); }
.toast.error { background: var(--color-danger); }

/* ── Mobile ── */
@media (max-width: 768px) {
  html, body { overflow: auto; height: auto; }
  .app-shell { grid-template-columns: 1fr; height: auto; overflow: visible; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--color-sidebar-border); max-height: 50vh; }
  .main { overflow: visible; }
  .panel { overflow: visible; padding: var(--space-4); }
  .status-grid { grid-template-columns: 1fr; }
  .nav-refresh-indicator { display: none; }
  .sparkline-grid { grid-template-columns: 1fr 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  .status-card { animation: none; }
  .skeleton-card { animation: none; }
  .refresh-dot.live { animation: none; }
}

<script>
// ── mulberry32 PRNG ──────────────────────────────────────────
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ── Line definitions ─────────────────────────────────────────
const NYC_LINES = [
  { id:'A',code:'A',name:'A Train',color:'nyc-A'},{id:'C',code:'C',name:'C Train',color:'nyc-C'},
  {id:'E',code:'E',name:'E Train',color:'nyc-E'},{id:'1',code:'1',name:'1 Train',color:'nyc-1'},
  {id:'2',code:'2',name:'2 Train',color:'nyc-2'},{id:'3',code:'3',name:'3 Train',color:'nyc-3'},
  {id:'4',code:'4',name:'4 Train',color:'nyc-4'},{id:'5',code:'5',name:'5 Train',color:'nyc-5'},
  {id:'6',code:'6',name:'6 Train',color:'nyc-6'},{id:'N',code:'N',name:'N Train',color:'nyc-N'},
  {id:'Q',code:'Q',name:'Q Train',color:'nyc-Q'},{id:'R',code:'R',name:'R Train',color:'nyc-R'},
  {id:'W',code:'W',name:'W Train',color:'nyc-W'},{id:'B',code:'B',name:'B Train',color:'nyc-B'},
  {id:'D',code:'D',name:'D Train',color:'nyc-D'},{id:'F',code:'F',name:'F Train',color:'nyc-F'},
  {id:'M',code:'M',name:'M Train',color:'nyc-M'},{id:'L',code:'L',name:'L Train',color:'nyc-L'},
  {id:'7',code:'7',name:'7 Train',color:'nyc-7'},{id:'G',code:'G',name:'G Train',color:'nyc-G'},
  {id:'J',code:'J',name:'J Train',color:'nyc-J'},{id:'Z',code:'Z',name:'Z Train',color:'nyc-Z'},
  {id:'S',code:'S',name:'S Shuttle',color:'nyc-S'}
];

const LONDON_LINES = [
  {id:'bakerloo',code:'BL',name:'Bakerloo',color:'tfl-Bakerloo'},
  {id:'central',code:'CE',name:'Central',color:'tfl-Central'},
  {id:'circle',code:'CI',name:'Circle',color:'tfl-Circle'},
  {id:'district',code:'DI',name:'District',color:'tfl-District'},
  {id:'hammersmith-city',code:'HC',name:'Hammersmith & City',color:'tfl-Hammersmith'},
  {id:'jubilee',code:'JU',name:'Jubilee',color:'tfl-Jubilee'},
  {id:'metropolitan',code:'ME',name:'Metropolitan',color:'tfl-Metropolitan'},
  {id:'northern',code:'NO',name:'Northern',color:'tfl-Northern'},
  {id:'piccadilly',code:'PI',name:'Piccadilly',color:'tfl-Piccadilly'},
  {id:'victoria',code:'VI',name:'Victoria',color:'tfl-Victoria'},
  {id:'waterloo-city',code:'WC',name:'Waterloo & City',color:'tfl-Waterloo'}
];

// ── App state ────────────────────────────────────────────────
const state = {
  city: 'nyc',
  selectedLines: new Set(),
  commutes: [],
  prefs: { delayThreshold: 10, weekdaysOnly: true, checkInterval: 300 },
  lineStatuses: {},     // id -> { status, description, delayMins }
  history: [],          // array of { ts, city, statuses: { id: status } }
  activePanel: 'live',
  addingCommute: false,
  refreshTimer: null,
  lastCheck: null,
  isDemo: false,
};

// ── Persistence ──────────────────────────────────────────────
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem('cw_state') || '{}');
    if (saved.city) state.city = saved.city;
    if (saved.selectedLines) state.selectedLines = new Set(saved.selectedLines);
    if (saved.commutes) state.commutes = saved.commutes;
    if (saved.prefs) Object.assign(state.prefs, saved.prefs);
    if (saved.history) state.history = saved.history;
  } catch {}
}

function saveState() {
  try {
    localStorage.setItem('cw_state', JSON.stringify({
      city: state.city,
      selectedLines: [...state.selectedLines],
      commutes: state.commutes,
      prefs: state.prefs,
      history: state.history,
    }));
  } catch {}
}

// ── Helpers ───────────────────────────────────────────────────
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function currentLines() {
  return state.city === 'london' ? LONDON_LINES : NYC_LINES;
}

function getLineById(id) {
  return [...NYC_LINES, ...LONDON_LINES].find(l => l.id === id);
}

function statusBadgeClass(status) {
  if (status === 'good') return 'badge-good';
  if (status === 'minor') return 'badge-minor';
  if (status === 'major' || status === 'part-suspended') return 'badge-major';
  if (status === 'suspended') return 'badge-suspended';
  return 'badge-good';
}

function statusLabel(status) {
  const map = {
    good: 'Good Service',
    minor: 'Minor Delays',
    major: 'Major Delays',
    'part-suspended': 'Part Suspended',
    suspended: 'Suspended',
  };
  return map[status] || 'Good Service';
}

function formatTime(date) {
  if (!date) return 'Never';
  return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// ── Demo data generator ───────────────────────────────────────
function generateDemoStatuses(lines) {
  const seed = Math.floor(Date.now() / 3600000); // changes each hour
  const rng = mulberry32(seed);
  const statuses = {};

  const statusPool = ['good','good','good','good','minor','minor','major','part-suspended'];
  const descriptions = {
    good: 'Service is operating normally.',
    minor: 'Minor delays due to congestion at select stations.',
    major: 'Significant delays. Allow extra travel time.',
    'part-suspended': 'Service suspended between certain stations. Seek alternate routes.',
    suspended: 'Service is suspended. Please use alternative routes.',
  };

  for (const line of lines) {
    const idx = Math.floor(rng() * statusPool.length);
    const status = statusPool[idx];
    let delayMins = 0;
    if (status === 'minor') delayMins = Math.floor(rng() * 8) + 5;
    if (status === 'major') delayMins = Math.floor(rng() * 20) + 15;
    if (status === 'part-suspended') delayMins = Math.floor(rng() * 30) + 20;
    statuses[line.id] = { status, description: descriptions[status], delayMins };
  }
  return statuses;
}

// ── TfL London fetch ──────────────────────────────────────────
async function fetchLondonStatus() {
  const url = 'https://api.tfl.gov.uk/line/mode/tube/status';
  const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
  if (!res.ok) throw new Error(`TfL API error: ${res.status}`);
  const data = await res.json();

  const statuses = {};
  for (const lineData of data) {
    const lineId = lineData.id;
    const lineStatuses = lineData.lineStatuses || [];
    let topStatus = 'good';
    let description = 'Service is operating normally.';
    let delayMins = 0;

    if (lineStatuses.length > 0) {
      const s = lineStatuses[0];
      const severity = s.statusSeverity;
      if (severity === 10) { topStatus = 'good'; }
      else if (severity >= 6 && severity <= 9) { topStatus = 'minor'; delayMins = 8; }
      else if (severity >= 3 && severity <= 5) { topStatus = 'major'; delayMins = 20; }
      else if (severity === 2) { topStatus = 'part-suspended'; delayMins = 30; }
      else if (severity <= 1) { topStatus = 'suspended'; delayMins = 60; }
      if (s.reason) description = s.reason;
    }

    statuses[lineId] = { status: topStatus, description, delayMins };
  }
  return statuses;
}

// ── NYC MTA fetch (via allorigins proxy) ──────────────────────
async function fetchNYCStatus() {
  const targetUrl = encodeURIComponent('http://web.mta.info/status/serviceStatus.txt');
  const proxyUrl = `https://api.allorigins.win/get?url=${targetUrl}`;
  const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(12000) });
  if (!res.ok) throw new Error(`Proxy error: ${res.status}`);
  const json = await res.json();
  const xml = json.contents;

  const parser = new DOMParser();
  const doc = parser.parseFromString(xml, 'text/xml');

  const statuses = {};

  // Parse subway lines from the XML
  const subwayEl = doc.querySelector('subway');
  if (!subwayEl) throw new Error('No subway element in MTA XML');

  const lineEls = subwayEl.querySelectorAll('line');
  for (const lineEl of lineEls) {
    const nameEl = lineEl.querySelector('name');
    const statusEl = lineEl.querySelector('status');
    const textEl = lineEl.querySelector('text');

    if (!nameEl) continue;
    const rawName = (nameEl.textContent || '').trim();
    const rawStatus = (statusEl ? statusEl.textContent : '').trim().toLowerCase();
    const rawText = textEl ? (textEl.textContent || '').replace(/<[^>]+>/g, '').trim() : '';

    // Map MTA status text to our statuses
    let status = 'good';
    let delayMins = 0;
    if (rawStatus.includes('good service')) { status = 'good'; }
    else if (rawStatus.includes('delays') || rawStatus.includes('slow')) {
      status = 'minor'; delayMins = 10;
      if (rawStatus.includes('major') || rawStatus.includes('severe')) { status = 'major'; delayMins = 25; }
    } else if (rawStatus.includes('suspended')) { status = 'suspended'; delayMins = 60; }
    else if (rawStatus.includes('planned work') || rawStatus.includes('service change')) { status = 'minor'; delayMins = 5; }

    // The name field can contain multiple lines e.g. "A,C,E" or just "1"
    const lineNames = rawName.split(/[\s,/]+/).map(s => s.trim()).filter(Boolean);
    for (const ln of lineNames) {
      const found = NYC_LINES.find(l => l.id === ln);
      if (found) {
        statuses[found.id] = {
          status,
          description: rawText || statusLabel(status),
          delayMins,
        };
      }
    }
  }

  return statuses;
}

// ── Main fetch orchestrator ───────────────────────────────────
async function fetchStatus() {
  const btn = document.getElementById('check-now-btn');
  btn.disabled = true;
  btn.textContent = 'Checking…';

  updateRefreshIndicator('loading');

  try {
    let statuses = {};
    const lines = currentLines();
    state.isDemo = (state.city === 'demo');

    if (state.city === 'demo') {
      await new Promise(r => setTimeout(r, 600)); // simulate latency
      statuses = generateDemoStatuses(NYC_LINES.concat(LONDON_LINES));
    } else if (state.city === 'london') {
      try {
        statuses = await fetchLondonStatus();
      } catch (err) {
        console.warn('TfL fetch failed, using demo:', err);
        toast('Live TfL data unavailable — showing demo data', 'warn');
        statuses = generateDemoStatuses(lines);
        state.isDemo = true;
      }
    } else {
      // NYC
      try {
        statuses = await fetchNYCStatus();
        // Fill any missing lines with good service
        for (const line of NYC_LINES) {
          if (!statuses[line.id]) {
            statuses[line.id] = { status: 'good', description: 'Service is operating normally.', delayMins: 0 };
          }
        }
      } catch (err) {
        console.warn('MTA fetch failed, using demo:', err);
        toast('Live MTA data unavailable — showing demo data', 'warn');
        statuses = generateDemoStatuses(lines);
        state.isDemo = true;
      }
    }

    state.lineStatuses = statuses;
    state.lastCheck = new Date();

    // Record history (max 50 entries)
    state.history.unshift({ ts: Date.now(), city: state.city, statuses: { ...statuses } });
    if (state.history.length > 50) state.history.length = 50;

    saveState();
    renderLiveStatus();
    renderCommutes();
    renderHistory();
    updateDemoBanner();
    updateRefreshIndicator(state.isDemo ? 'demo' : 'live');
    document.getElementById('last-check-time').textContent = `Updated ${formatTime(state.lastCheck)}`;

  } catch (err) {
    console.error('Fetch error:', err);
    toast('Error fetching status data', 'error');
    updateRefreshIndicator('idle');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Check Now';
  }
}

// ── Render: Live Status ───────────────────────────────────────
function renderLiveStatus() {
  const grid = document.getElementById('status-grid');
  const loading = document.getElementById('live-loading');
  loading.style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = '';

  const lines = state.city === 'demo'
    ? NYC_LINES.slice(0, 12) // demo shows first 12
    : currentLines();

  for (const line of lines) {
    const info = state.lineStatuses[line.id] || { status: 'good', description: 'Service is operating normally.', delayMins: 0 };
    const isMonitored = state.selectedLines.has(line.id);

    const card = document.createElement('div');
    card.className = 'status-card';

    const badgeClass = statusBadgeClass(info.status);
    const delayText = info.delayMins > 0 ? `~${info.delayMins} min delay` : 'On time';

    card.innerHTML = `
      <div class="status-card-header">
        <div class="line-dot ${line.color}" aria-hidden="true">${esc(line.code)}</div>
        <div class="line-info">
          <div class="line-name">${esc(line.name)}</div>
        </div>
        <span class="status-badge ${badgeClass}">${esc(statusLabel(info.status))}</span>
      </div>
      <div class="status-desc">${esc(info.description.slice(0, 140))}${info.description.length > 140 ? '…' : ''}</div>
      <div class="status-card-footer">
        <span class="delay-mins">${esc(delayText)}</span>
        <button class="btn-add-alert ${isMonitored ? 'added' : ''}"
          data-line-id="${esc(line.id)}"
          aria-label="${isMonitored ? 'Already monitoring ' + line.name : 'Add ' + line.name + ' to alerts'}"
        >${isMonitored ? 'Monitored' : '+ Monitor'}</button>
      </div>
    `;

    const alertBtn = card.querySelector('.btn-add-alert');
    if (!isMonitored) {
      alertBtn.addEventListener('click', () => {
        state.selectedLines.add(line.id);
        saveState();
        renderLineGrid();
        renderLiveStatus(); // re-render to update buttons
        toast(`${line.name} added to monitor list`, 'success');
      });
    }

    grid.appendChild(card);
  }
}

// ── Render: My Commutes ───────────────────────────────────────
function renderCommutes() {
  const container = document.getElementById('commute-cards');
  container.innerHTML = '';

  if (!state.commutes.length) {
    container.innerHTML = `
      <div class="commutes-empty">
        <p class="commutes-empty-title">No saved commutes</p>
        <p class="commutes-empty-sub">Add a commute in the sidebar to track your daily route and get health scores.</p>
      </div>
    `;
    return;
  }

  for (const commute of state.commutes) {
    const card = buildCommuteCard(commute);
    container.appendChild(card);
  }
}

function buildCommuteCard(commute) {
  const card = document.createElement('div');
  card.className = 'commute-card';

  // Calculate health score
  let totalDelay = 0;
  let affectedCount = 0;
  const lineInfos = [];

  for (const lineId of commute.lines) {
    const line = getLineById(lineId);
    if (!line) continue;
    const info = state.lineStatuses[lineId] || { status: 'good', delayMins: 0 };
    totalDelay += info.delayMins || 0;
    if (info.status !== 'good') affectedCount++;
    lineInfos.push({ line, info });
  }

  const lineCount = commute.lines.length || 1;
  const avgDelay = totalDelay / lineCount;
  const healthScore = Math.max(0, Math.round(100 - (avgDelay * 2.5) - (affectedCount / lineCount * 30)));
  const healthColor = healthScore >= 75 ? 'var(--color-success)' : healthScore >= 40 ? 'var(--color-warn)' : 'var(--color-danger)';

  const gaugeSvg = buildGaugeSvg(healthScore, healthColor);

  let affectedHtml = lineInfos.map(({ line, info }) => `
    <div class="affected-line">
      <div class="commute-line-tag ${line.color}">${esc(line.code)}</div>
      <span class="affected-line-name">${esc(line.name)}</span>
      <span class="affected-line-status">— ${esc(statusLabel(info.status))}</span>
    </div>
  `).join('');

  if (!affectedHtml) affectedHtml = '<span style="font-size:var(--text-sm);color:var(--color-ink-muted)">No lines assigned</span>';

  card.innerHTML = `
    <div class="commute-card-header">
      <div class="gauge-wrap">${gaugeSvg}</div>
      <div class="commute-card-info">
        <div class="commute-card-name">${esc(commute.name)}</div>
        <div class="commute-meta">
          ${commute.lines.length} line${commute.lines.length !== 1 ? 's' : ''} ·
          ${avgDelay > 0 ? `~${Math.round(avgDelay)} min avg delay` : 'On time'}
        </div>
      </div>
    </div>
    <div class="commute-affected-lines">${affectedHtml}</div>
    <div class="commute-actions">
      <button class="btn-copy-alert" data-commute-id="${esc(commute.id)}">Copy Alert Text</button>
    </div>
  `;

  card.querySelector('.btn-copy-alert').addEventListener('click', () => {
    copyAlertText(commute, lineInfos, healthScore, Math.round(avgDelay));
  });

  return card;
}

function buildGaugeSvg(score, color) {
  const r = 32;
  const cx = 44; const cy = 44;
  const circ = 2 * Math.PI * r;
  const arc = circ * 0.75;
  const filled = arc * (score / 100);
  const offset = circ * 0.125; // start at ~7 o'clock

  return `<svg width="88" height="88" viewBox="0 0 88 88" aria-label="Health score ${score} out of 100" role="img">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--color-border)" stroke-width="6"
      stroke-dasharray="${arc} ${circ - arc}" stroke-dashoffset="-${offset}" stroke-linecap="round" transform="rotate(135 ${cx} ${cy})"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="6"
      stroke-dasharray="${filled} ${circ - filled}" stroke-dashoffset="-${offset}" stroke-linecap="round" transform="rotate(135 ${cx} ${cy})" style="transition:stroke-dasharray 0.5s ease"/>
    <text x="${cx}" y="${cy}" text-anchor="middle" dy="0.35em" font-size="15" font-weight="600" fill="${color}" font-family="var(--font-body)">${score}</text>
  </svg>`;
}

function copyAlertText(commute, lineInfos, healthScore, avgDelay) {
  const now = new Date();
  const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const dateStr = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });

  let lines = lineInfos.map(({ line, info }) => {
    const s = statusLabel(info.status);
    const d = info.delayMins > 0 ? ` (~${info.delayMins} min)` : '';
    return `  ${line.code} ${line.name}: ${s}${d}`;
  }).join('\n');

  const text = [
    `CommuteWatch Alert — ${commute.name}`,
    `${dateStr} at ${timeStr}`,
    `Health Score: ${healthScore}/100`,
    avgDelay > 0 ? `Estimated delay: ~${avgDelay} min` : 'No significant delays',
    '',
    'Line Status:',
    lines || '  No lines tracked',
  ].join('\n');

  navigator.clipboard.writeText(text).then(() => {
    toast('Alert text copied to clipboard', 'success');
  }).catch(() => {
    // Fallback: show text
    prompt('Copy this alert text:', text);
  });
}

// ── Render: History ───────────────────────────────────────────
function renderHistory() {
  const container = document.getElementById('history-grid');
  container.innerHTML = '';

  // Build 7-day history per line from stored history
  const now = Date.now();
  const sevenDays = 7 * 24 * 3600 * 1000;
  const recentHistory = state.history.filter(h => (now - h.ts) < sevenDays && h.city === state.city);

  const lines = state.city === 'demo' ? NYC_LINES.slice(0, 12) : currentLines();

  // Sparkline section
  const sparkSection = document.createElement('div');
  sparkSection.innerHTML = `<div class="history-section-title">7-Day Delay Frequency</div>`;
  const sparkGrid = document.createElement('div');
  sparkGrid.className = 'sparkline-grid';

  for (const line of lines.slice(0, 12)) {
    const card = buildSparklineCard(line, recentHistory);
    sparkGrid.appendChild(card);
  }
  sparkSection.appendChild(sparkGrid);
  container.appendChild(sparkSection);

  // Heatmap section
  const heatSection = document.createElement('div');
  heatSection.innerHTML = `<div class="history-section-title">Delay Heatmap — Line × Day</div>`;
  const heatWrap = buildHeatmap(lines.slice(0, 8), recentHistory);
  heatSection.appendChild(heatWrap);
  container.appendChild(heatSection);

  // Stats section
  const statsSection = document.createElement('div');
  statsSection.innerHTML = `<div class="history-section-title">Quick Stats</div>`;
  const statsRow = buildStatsRow(lines, recentHistory);
  statsSection.appendChild(statsRow);
  container.appendChild(statsSection);
}

function getDelaysForLine(lineId, history) {
  return history.map(h => {
    const info = h.statuses[lineId];
    return info ? info.delayMins || 0 : 0;
  });
}

function buildSparklineCard(line, history) {
  const card = document.createElement('div');
  card.className = 'sparkline-card';

  const delays = getDelaysForLine(line.id, history);
  const avgDelay = delays.length ? delays.reduce((a,b)=>a+b,0) / delays.length : 0;
  const maxDelay = Math.max(...delays, 1);
  const hasData = history.length > 0;

  const svgWidth = 180;
  const svgHeight = 36;

  let sparkPath = '';
  if (hasData && delays.length > 1) {
    const pts = delays.slice(0, 20).map((d, i) => {
      const x = (i / (delays.slice(0,20).length - 1)) * svgWidth;
      const y = svgHeight - (d / maxDelay) * (svgHeight - 4) - 2;
      return `${x},${y}`;
    });
    sparkPath = `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--color-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else {
    // No data — flat line
    sparkPath = `<line x1="0" y1="${svgHeight/2}" x2="${svgWidth}" y2="${svgHeight/2}" stroke="var(--color-border)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  }

  card.innerHTML = `
    <div class="sparkline-header">
      <div class="line-dot ${line.color}" style="width:24px;height:24px;font-size:10px">${esc(line.code)}</div>
      <span class="sparkline-label">${esc(line.name)}</span>
    </div>
    <svg viewBox="0 0 ${svgWidth} ${svgHeight}" width="100%" height="${svgHeight}" aria-hidden="true">${sparkPath}</svg>
    <div class="sparkline-stat">${hasData ? `Avg delay: ${avgDelay.toFixed(1)} min · ${delays.filter(d=>d>0).length} incidents` : 'No history yet'}</div>
  `;
  return card;
}

function buildHeatmap(lines, history) {
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const wrapper = document.createElement('div');
  wrapper.style.overflowX = 'auto';

  let headerRow = `<tr><th style="text-align:left;min-width:80px;padding-right:var(--space-2)">Line</th>`;
  for (const d of days) headerRow += `<th>${d}</th>`;
  headerRow += '</tr>';

  let bodyRows = '';
  for (const line of lines) {
    // Aggregate by day of week
    const dayCounts = [0,0,0,0,0,0,0];
    for (const h of history) {
      const dow = new Date(h.ts).getDay(); // 0=Sun
      const adj = (dow === 0) ? 6 : dow - 1; // Mon=0
      const info = h.statuses[line.id];
      if (info && info.status !== 'good') dayCounts[adj]++;
    }
    const maxCount = Math.max(...dayCounts, 1);

    bodyRows += `<tr>
      <td style="padding:var(--space-1) var(--space-2) var(--space-1) 0">
        <div style="display:flex;align-items:center;gap:6px">
          <div class="line-dot ${line.color}" style="width:20px;height:20px;font-size:9px;flex-shrink:0">${esc(line.code)}</div>
          <span style="font-size:var(--text-xs);color:var(--color-ink)">${esc(line.name.length > 12 ? line.code : line.name)}</span>
        </div>
      </td>`;
    for (let d = 0; d < 7; d++) {
      const intensity = Math.min(4, Math.round((dayCounts[d] / maxCount) * 4));
      bodyRows += `<td><div class="hm-cell hm-${intensity}" title="${days[d]}: ${dayCounts[d]} delay events"></div></td>`;
    }
    bodyRows += '</tr>';
  }

  wrapper.innerHTML = `<table class="heatmap-table"><thead>${headerRow}</thead><tbody>${bodyRows}</tbody></table>`;
  return wrapper;
}

function buildStatsRow(lines, history) {
  const row = document.createElement('div');
  row.className = 'stats-row';

  if (!history.length) {
    row.innerHTML = `<div class="stat-card"><div class="stat-card-label">No data yet</div><div class="stat-card-value">—</div><div class="stat-card-sub">Run a check to start building history</div></div>`;
    return row;
  }

  // Find worst line
  let worstLine = null; let worstAvg = 0;
  let bestLine = null; let bestAvg = Infinity;
  for (const line of lines) {
    const delays = getDelaysForLine(line.id, history);
    const avg = delays.reduce((a,b)=>a+b,0) / (delays.length || 1);
    if (avg > worstAvg) { worstAvg = avg; worstLine = line; }
    if (avg < bestAvg) { bestAvg = avg; bestLine = line; }
  }

  // Overall reliability
  let totalChecks = 0; let delayedChecks = 0;
  for (const h of history) {
    for (const line of lines) {
      totalChecks++;
      const info = h.statuses[line.id];
      if (info && info.status !== 'good') delayedChecks++;
    }
  }
  const reliability = totalChecks ? Math.round(((totalChecks - delayedChecks) / totalChecks) * 100) : 100;

  row.innerHTML = `
    <div class="stat-card">
      <div class="stat-card-label">Reliability</div>
      <div class="stat-card-value">${reliability}%</div>
      <div class="stat-card-sub">of checks with good service</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Most Delayed</div>
      <div class="stat-card-value">${worstLine ? esc(worstLine.code) : '—'}</div>
      <div class="stat-card-sub">${worstLine ? esc(worstLine.name) + ` · ~${Math.round(worstAvg)} min avg` : 'No data'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Most Reliable</div>
      <div class="stat-card-value">${bestLine ? esc(bestLine.code) : '—'}</div>
      <div class="stat-card-sub">${bestLine ? esc(bestLine.name) + ` · ~${Math.round(bestAvg)} min avg` : 'No data'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">History Checks</div>
      <div class="stat-card-value">${history.length}</div>
      <div class="stat-card-sub">in the last 7 days</div>
    </div>
  `;
  return row;
}

// ── Render: Line grid ─────────────────────────────────────────
function renderLineGrid() {
  const grid = document.getElementById('line-grid');
  grid.innerHTML = '';
  for (const line of currentLines()) {
    const chip = document.createElement('button');
    chip.className = `line-chip ${line.color}${state.selectedLines.has(line.id) ? ' selected' : ''}`;
    chip.textContent = line.code;
    chip.setAttribute('aria-label', `${state.selectedLines.has(line.id) ? 'Deselect' : 'Select'} ${line.name}`);
    chip.setAttribute('aria-pressed', String(state.selectedLines.has(line.id)));
    chip.title = line.name;
    chip.addEventListener('click', () => {
      if (state.selectedLines.has(line.id)) {
        state.selectedLines.delete(line.id);
      } else {
        state.selectedLines.add(line.id);
      }
      saveState();
      renderLineGrid();
      updateFormSelectedLines();
    });
    grid.appendChild(chip);
  }
}

// ── Render: Commute sidebar list ──────────────────────────────
function renderCommuteList() {
  const container = document.getElementById('commute-list');
  container.innerHTML = '';

  if (!state.commutes.length) {
    container.innerHTML = '<div style="font-size:var(--text-xs);color:var(--color-ink-muted);padding:var(--space-2) 0">No saved commutes yet.</div>';
    return;
  }

  for (const commute of state.commutes) {
    const item = document.createElement('div');
    item.className = 'commute-item';

    const chipsHtml = commute.lines.slice(0, 6).map(lineId => {
      const line = getLineById(lineId);
      if (!line) return '';
      return `<div class="commute-line-tag ${line.color}" title="${esc(line.name)}">${esc(line.code)}</div>`;
    }).join('');

    item.innerHTML = `
      <div class="commute-name">${esc(commute.name)}</div>
      <div class="commute-lines">${chipsHtml || '<span style="font-size:10px;color:var(--color-ink-muted)">No lines</span>'}</div>
      <button class="commute-del" data-id="${esc(commute.id)}" aria-label="Delete ${esc(commute.name)}">×</button>
    `;

    item.querySelector('.commute-del').addEventListener('click', (e) => {
      e.stopPropagation();
      state.commutes = state.commutes.filter(c => c.id !== commute.id);
      saveState();
      renderCommuteList();
      renderCommutes();
      toast('Commute removed');
    });

    container.appendChild(item);
  }
}

// ── Update form selected lines display ────────────────────────
function updateFormSelectedLines() {
  const el = document.getElementById('form-selected-lines');
  const selected = [...state.selectedLines];
  if (!selected.length) {
    el.textContent = 'No lines selected';
    return;
  }
  const names = selected.map(id => {
    const l = getLineById(id);
    return l ? l.code : id;
  }).join(', ');
  el.textContent = selected.length + ' selected: ' + names;
}

// ── City switch ───────────────────────────────────────────────
function switchCity(city) {
  state.city = city;
  state.selectedLines.clear();
  saveState();

  document.querySelectorAll('.city-tab').forEach(t => {
    const isActive = t.dataset.city === city;
    t.classList.toggle('active', isActive);
    t.setAttribute('aria-selected', String(isActive));
  });

  renderLineGrid();
  updateFormSelectedLines();
  updateDemoBanner();

  // Reset live panel to loading state
  document.getElementById('live-loading').style.display = 'grid';
  document.getElementById('status-grid').style.display = 'none';
  document.getElementById('status-grid').innerHTML = '';
  state.lineStatuses = {};

  fetchStatus();
}

// ── Demo banner ───────────────────────────────────────────────
function updateDemoBanner() {
  const banner = document.getElementById('demo-banner');
  banner.classList.toggle('show', state.isDemo);
}

// ── Refresh indicator ─────────────────────────────────────────
function updateRefreshIndicator(mode) {
  const dot = document.getElementById('refresh-dot');
  const label = document.getElementById('refresh-label');
  dot.className = 'refresh-dot';
  if (mode === 'live') { dot.classList.add('live'); label.textContent = 'Live'; }
  else if (mode === 'demo') { dot.classList.add('demo'); label.textContent = 'Demo'; }
  else if (mode === 'loading') { label.textContent = 'Loading…'; }
  else { label.textContent = 'Idle'; }
}

// ── Auto-refresh ──────────────────────────────────────────────
function scheduleRefresh() {
  if (state.refreshTimer) clearInterval(state.refreshTimer);
  const interval = state.prefs.checkInterval * 1000;
  state.refreshTimer = setInterval(() => {
    // Check weekday-only preference
    if (state.prefs.weekdaysOnly) {
      const dow = new Date().getDay();
      if (dow === 0 || dow === 6) return;
    }
    fetchStatus();
  }, interval);
}

// ── Panel switching ───────────────────────────────────────────
function switchPanel(panelId) {
  state.activePanel = panelId;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const isActive = btn.dataset.panel === panelId;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-selected', String(isActive));
  });
  document.querySelectorAll('.panel').forEach(p => {
    p.classList.toggle('active', p.id === `panel-${panelId}`);
  });
}

// ── Toast ─────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3400);
}

// ── Event wiring ──────────────────────────────────────────────
// City tabs
document.querySelectorAll('.city-tab').forEach(tab => {
  tab.addEventListener('click', () => switchCity(tab.dataset.city));
});

// Main tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchPanel(btn.dataset.panel));
});

// Check Now
document.getElementById('check-now-btn').addEventListener('click', fetchStatus);

// Add commute
document.getElementById('btn-add-commute').addEventListener('click', () => {
  state.addingCommute = !state.addingCommute;
  document.getElementById('add-commute-form').classList.toggle('open', state.addingCommute);
  if (state.addingCommute) {
    document.getElementById('new-commute-name').focus();
    updateFormSelectedLines();
  }
});

document.getElementById('btn-cancel-commute').addEventListener('click', () => {
  state.addingCommute = false;
  document.getElementById('add-commute-form').classList.remove('open');
});

document.getElementById('btn-save-commute').addEventListener('click', () => {
  const name = document.getElementById('new-commute-name').value.trim();
  if (!name) { toast('Enter a commute name', 'error'); return; }
  if (state.commutes.length >= 5) { toast('Maximum 5 commutes saved', 'warn'); return; }

  const commute = {
    id: Math.random().toString(36).slice(2) + Date.now().toString(36),
    name,
    lines: [...state.selectedLines],
    city: state.city,
    createdAt: Date.now(),
  };

  state.commutes.push(commute);
  saveState();
  renderCommuteList();
  renderCommutes();

  document.getElementById('new-commute-name').value = '';
  state.addingCommute = false;
  document.getElementById('add-commute-form').classList.remove('open');
  toast(`"${name}" saved`, 'success');
});

// Settings
document.getElementById('delay-threshold').addEventListener('change', e => {
  state.prefs.delayThreshold = Number(e.target.value);
  saveState();
});

document.getElementById('weekdays-only').addEventListener('change', e => {
  state.prefs.weekdaysOnly = e.target.checked;
  saveState();
});

document.getElementById('check-interval').addEventListener('change', e => {
  state.prefs.checkInterval = Number(e.target.value);
  saveState();
  scheduleRefresh();
  toast('Check interval updated');
});

// ── Init ──────────────────────────────────────────────────────
loadState();

// Restore preferences to UI
document.getElementById('delay-threshold').value = state.prefs.delayThreshold;
document.getElementById('weekdays-only').checked = state.prefs.weekdaysOnly;
document.getElementById('check-interval').value = state.prefs.checkInterval;

// Restore city tab
document.querySelectorAll('.city-tab').forEach(t => {
  const isActive = t.dataset.city === state.city;
  t.classList.toggle('active', isActive);
  t.setAttribute('aria-selected', String(isActive));
});

renderLineGrid();
updateFormSelectedLines();
renderCommuteList();
renderCommutes();
renderHistory();
updateDemoBanner();
scheduleRefresh();

// Initial fetch
fetchStatus();
</script>
</body>
</html>
