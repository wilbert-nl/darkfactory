<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dad Joke Newsletter Generator — App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Workbench · theme: Carnival · nav: N9 */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow-x: clip; }
body {
  height: 100%;
  overflow: hidden;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ── N9 Nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 52px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  flex-shrink: 0;
}
.nav-logo span { color: var(--color-accent); }
.nav-sep {
  width: 1px;
  height: 16px;
  background: var(--color-border);
  flex-shrink: 0;
}
.nav-page-label {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
  white-space: nowrap;
}
.nav-back {
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
  transition: color 0.15s ease;
}
.nav-back:hover { color: var(--color-ink); }

/* ── Workbench Shell ── */
.app-shell {
  display: grid;
  grid-template-columns: 300px 1fr;
  margin-top: 52px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--color-border);
  background: var(--color-paper-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-section {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}

.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.section-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
  display: block;
  margin-bottom: var(--space-3);
}

/* ── Sidebar Buttons ── */
.btn-random {
  width: 100%;
  padding: var(--space-4) var(--space-6);
  background: var(--color-accent);
  color: var(--color-paper);
  font-family: var(--font-body);
  font-size: var(--text-base);
  font-weight: 600;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  letter-spacing: -0.01em;
}
.btn-random:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px oklch(40% 0.21 25 / 0.28);
}
.btn-random:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
.btn-random:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: transparent;
  color: var(--color-ink-muted);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}
.btn-ghost:hover { background: var(--color-paper); color: var(--color-ink); border-color: var(--color-accent-line); }

/* ── Search ── */
.search-wrap {
  display: flex;
  gap: var(--space-2);
}
.search-input {
  flex: 1;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-2) var(--space-3);
  transition: border-color 0.15s ease;
  min-width: 0;
}
.search-input:focus { outline: none; border-color: var(--color-accent); }
.search-input::placeholder { color: var(--color-ink-muted); }

.btn-search {
  padding: var(--space-2) var(--space-3);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-ink-muted);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
  transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
}
.btn-search:hover { border-color: var(--color-accent-line); color: var(--color-accent); background: var(--color-accent-subtle); }

/* ── Search Results ── */
.result-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.result-item {
  padding: var(--space-3);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  line-height: 1.5;
  color: var(--color-ink);
  cursor: pointer;
  transition: border-color 0.12s ease, background 0.12s ease;
}
.result-item:hover { border-color: var(--color-accent-line); background: var(--color-accent-subtle); }
.result-item:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -2px; }

/* ── Saved Jokes List ── */
.saved-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.saved-item {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  padding: var(--space-3);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  line-height: 1.5;
  color: var(--color-ink);
  cursor: pointer;
  transition: border-color 0.12s ease, background 0.12s ease;
}
.saved-item:hover { border-color: var(--color-accent-line); }
.saved-item-text {
  flex: 1;
  min-width: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.btn-remove-saved {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  color: var(--color-ink-muted);
  cursor: pointer;
  border-radius: var(--radius-sm);
  font-size: var(--text-base);
  line-height: 1;
  transition: color 0.12s ease, background 0.12s ease;
  margin-top: 1px;
}
.btn-remove-saved:hover { color: var(--color-danger); background: oklch(55% 0.20 25 / 0.08); }

.saved-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-3);
}
.clear-link {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--font-body);
  transition: color 0.12s ease;
}
.clear-link:hover { color: var(--color-danger); }

.empty-state {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  text-align: center;
  padding: var(--space-4) 0;
  line-height: 1.6;
}

/* ── Skeleton ── */
.skeleton {
  background: linear-gradient(90deg, var(--color-border) 25%, var(--color-paper-2) 50%, var(--color-border) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s ease infinite;
  border-radius: var(--radius-sm);
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-line {
  height: 1em;
  margin-bottom: 0.5em;
}
.skeleton-line:last-child { width: 70%; }

/* ── Main Panel ── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-paper);
}

.main-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-8);
  display: flex;
  flex-direction: column;
  gap: var(--space-8);
}

/* ── Featured Joke Card ── */
.featured-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-8);
  position: relative;
  overflow: hidden;
  animation: fadeSlideIn 0.35s ease both;
}
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.quote-mark {
  font-family: var(--font-display);
  font-size: 6rem;
  line-height: 0.5;
  color: var(--color-accent);
  opacity: 0.18;
  position: absolute;
  top: var(--space-6);
  left: var(--space-6);
  user-select: none;
  pointer-events: none;
}
.quote-mark-close {
  top: auto;
  bottom: var(--space-4);
  left: auto;
  right: var(--space-6);
}

.featured-joke-text {
  font-family: var(--font-display);
  font-size: clamp(1.25rem, 2.5vw, 1.75rem);
  font-weight: 400;
  color: var(--color-ink);
  line-height: 1.45;
  letter-spacing: -0.02em;
  position: relative;
  z-index: 1;
  padding: var(--space-4) 0;
}

.featured-empty {
  text-align: center;
  padding: var(--space-8) 0;
}
.featured-empty-label {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
}

/* ── Joke Actions Row ── */
.joke-actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-top: var(--space-6);
  padding-top: var(--space-4);
  border-top: 1px solid var(--color-border);
}

.btn-action {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  border: 1px solid var(--color-border);
  background: var(--color-paper);
  color: var(--color-ink);
}
.btn-action:hover { border-color: var(--color-accent-line); background: var(--color-accent-subtle); color: var(--color-accent); }
.btn-action.primary {
  background: var(--color-accent);
  color: var(--color-paper);
  border-color: transparent;
}
.btn-action.primary:hover { opacity: 0.88; background: var(--color-accent); color: var(--color-paper); }
.btn-action:active { transform: scale(0.97); }
.btn-action.success { background: var(--color-success); color: var(--color-paper); border-color: transparent; }
.btn-action.success:hover { opacity: 0.88; background: var(--color-success); color: var(--color-paper); }

/* ── Newsletter Block Builder ── */
.section-heading {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  margin-bottom: var(--space-4);
}

.builder-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.builder-config {
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--color-border);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
}

.field-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
  display: block;
  margin-bottom: var(--space-2);
}

.input-config {
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-2) var(--space-3);
  width: 100%;
  transition: border-color 0.15s ease;
}
.input-config:focus { outline: none; border-color: var(--color-accent); }
.input-config::placeholder { color: var(--color-ink-muted); }

.builder-preview {
  padding: var(--space-6);
}

.newsletter-preview-box {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-6);
  font-family: Georgia, 'Times New Roman', serif;
  color: var(--color-ink);
  line-height: 1.7;
}

.preview-intro {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  margin-bottom: var(--space-4);
}

.preview-joke-box {
  background: var(--color-paper-2);
  border-left: 3px solid var(--color-accent);
  padding: var(--space-4) var(--space-6);
  font-size: var(--text-base);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  margin-bottom: var(--space-4);
  font-style: italic;
}

.preview-signoff {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
}

.builder-actions {
  padding: var(--space-4) var(--space-6);
  border-top: 1px solid var(--color-border);
  display: flex;
  gap: var(--space-3);
  flex-wrap: wrap;
}

/* ── Weekly Batch Panel ── */
.batch-panel {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.batch-header {
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
}
.batch-title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  letter-spacing: -0.02em;
  color: var(--color-ink);
}
.batch-list {
  padding: var(--space-4) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.batch-item {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: var(--space-3);
  align-items: start;
  padding: var(--space-3) var(--space-4);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  animation: fadeSlideIn 0.25s ease both;
}
.batch-num {
  font-family: var(--font-display);
  font-size: var(--text-base);
  color: var(--color-accent);
  font-weight: 500;
}
.batch-text {
  font-size: var(--text-sm);
  line-height: 1.6;
  color: var(--color-ink);
}
.batch-empty {
  padding: var(--space-6);
  text-align: center;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  line-height: 1.65;
}
.batch-footer {
  padding: var(--space-4) var(--space-6);
  border-top: 1px solid var(--color-border);
  display: flex;
  gap: var(--space-3);
  align-items: center;
}

/* ── Skeleton batch items ── */
.batch-skeleton {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-6);
}
.batch-skeleton-item {
  padding: var(--space-3) var(--space-4);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 600;
  background: var(--color-ink);
  color: var(--color-paper);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px oklch(18% 0.080 20 / 0.20);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--color-success); }
.toast.error { background: var(--color-danger); }

/* ── Loading state for featured card ── */
.featured-skeleton {
  padding: var(--space-8);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
}
.featured-skeleton .skeleton-line {
  height: 1.5em;
  margin-bottom: var(--space-3);
}

/* ── Scrollbars ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--color-ink-muted); }

/* ── Mobile ── */
@media (max-width: 768px) {
  html, body { overflow: auto; height: auto; }
  .app-shell { grid-template-columns: 1fr; height: auto; overflow: visible; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--color-border); max-height: none; overflow: visible; }
  .sidebar-scroll { overflow: visible; max-height: none; }
  .main { overflow: visible; }
  .main-scroll { overflow: visible; padding: var(--space-4); }
  .builder-config { grid-template-columns: 1fr; }
  .batch-header { flex-wrap: wrap; }
}

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  .featured-card, .batch-item { animation: none; }
  .skeleton { animation: none; background: var(--color-border); }
  .btn-random:hover { transform: none; box-shadow: none; }
}
</style>
</head>
<body>

<!-- N9 Edge-aligned nav -->
<nav class="nav" aria-label="Application navigation">
  <span class="nav-logo">Dad Joke<span>.</span></span>
  <span class="nav-sep" aria-hidden="true"></span>
  <span class="nav-page-label">Newsletter Generator</span>
  <a href="index.html" class="nav-back" aria-label="Back to home page">← Home</a>
</nav>

<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar" aria-label="Joke controls and history">

    <!-- Get random joke button -->
    <div class="sidebar-section">
      <button class="btn-random" id="btn-random" aria-label="Fetch a random dad joke">
        Get random joke
      </button>
    </div>

    <div class="sidebar-scroll">

      <!-- Search -->
      <div>
        <span class="section-label">Search by keyword</span>
        <div class="search-wrap">
          <input
            type="search"
            class="search-input"
            id="search-input"
            placeholder="e.g. chicken, space, dad…"
            aria-label="Search dad jokes by keyword"
          >
          <button class="btn-search" id="btn-search" aria-label="Search">Search</button>
        </div>
        <div id="search-results" style="margin-top: var(--space-3);"></div>
      </div>

      <!-- Saved jokes -->
      <div>
        <div class="saved-header">
          <span class="section-label" style="margin-bottom:0;">Saved jokes</span>
          <button class="clear-link" id="btn-clear-saved" aria-label="Clear all saved jokes">Clear all</button>
        </div>
        <div id="saved-list" class="saved-list" role="list" aria-label="Saved jokes"></div>
      </div>

    </div>
  </aside>

  <!-- Main panel -->
  <main class="main" aria-label="Joke display and newsletter builder">
    <div class="main-scroll">

      <!-- Featured joke display -->
      <section aria-label="Featured joke">
        <div id="featured-wrap">
          <!-- Loading skeleton shown initially -->
          <div class="featured-skeleton" id="featured-skeleton" aria-busy="true" aria-label="Loading joke">
            <div class="skeleton skeleton-line" style="width:90%;height:1.75em;"></div>
            <div class="skeleton skeleton-line" style="width:75%;height:1.75em;"></div>
            <div class="skeleton skeleton-line" style="width:55%;height:1.75em;margin-bottom:0;"></div>
          </div>
        </div>
      </section>

      <!-- Newsletter block builder -->
      <section aria-label="Newsletter block builder">
        <h2 class="section-heading">Newsletter block</h2>
        <div class="builder-card">
          <div class="builder-config">
            <div>
              <label class="field-label" for="intro-line">Intro line</label>
              <input
                type="text"
                class="input-config"
                id="intro-line"
                value="This week's dad joke:"
                maxlength="100"
                aria-label="Newsletter intro line"
              >
            </div>
            <div>
              <label class="field-label" for="signoff-line">Sign-off line</label>
              <input
                type="text"
                class="input-config"
                id="signoff-line"
                value="Happy Friday! 😄"
                maxlength="100"
                aria-label="Newsletter sign-off line"
              >
            </div>
          </div>

          <div class="builder-preview">
            <div class="newsletter-preview-box" id="newsletter-preview" aria-live="polite">
              <p class="preview-intro" id="preview-intro-text">This week's dad joke:</p>
              <div class="preview-joke-box" id="preview-joke-text">
                <span style="color:var(--color-ink-muted);font-style:normal;">Fetch a joke to preview your newsletter block.</span>
              </div>
              <p class="preview-signoff" id="preview-signoff-text">Happy Friday! 😄</p>
            </div>
          </div>

          <div class="builder-actions">
            <button class="btn-action" id="btn-copy-plain" aria-label="Copy newsletter block as plain text" disabled>
              Copy plain text
            </button>
            <button class="btn-action" id="btn-copy-html" aria-label="Copy newsletter block as HTML" disabled>
              Copy HTML block
            </button>
          </div>
        </div>
      </section>

      <!-- Weekly batch panel -->
      <section aria-label="Weekly batch generator">
        <div class="batch-panel">
          <div class="batch-header">
            <span class="batch-title">Weekly batch — 5 jokes</span>
            <button class="btn-action primary" id="btn-batch" aria-label="Generate 5 jokes for the week">
              Generate 5 jokes for the week
            </button>
          </div>
          <div id="batch-content">
            <div class="batch-empty" id="batch-empty">
              Generate 5 jokes to fill your week's newsletter slots.
            </div>
          </div>
          <div class="batch-footer" id="batch-footer" style="display:none;">
            <button class="btn-action success" id="btn-copy-batch" aria-label="Copy all 5 jokes as plain text">
              Copy all as plain text
            </button>
          </div>
        </div>
      </section>

    </div>
  </main>
</div>

<!-- Toast -->
<div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

<script>
// ── Constants ─────────────────────────────────────────────────
const LS_SAVED   = 'dadjoke_saved_v2';
const MAX_SAVED  = 20;
const API_BASE   = 'https://icanhazdadjoke.com';
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ── State ─────────────────────────────────────────────────────
let state = {
  currentJoke: null,   // { id, joke }
  saved: [],           // [{id, joke}] max 20
  batchJokes: [],      // [{id, joke}] 5 items
  loading: false,
  batchLoading: false,
  searchDebounce: null,
};

// ── Storage helpers ───────────────────────────────────────────
function loadSaved() {
  try { state.saved = JSON.parse(localStorage.getItem(LS_SAVED) || '[]'); }
  catch { state.saved = []; }
}
function persistSaved() {
  try { localStorage.setItem(LS_SAVED, JSON.stringify(state.saved)); } catch { /* ignore */ }
}

// ── API ───────────────────────────────────────────────────────
async function apiFetch(url) {
  const res = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ── Fetch random joke ─────────────────────────────────────────
async function fetchRandom() {
  if (state.loading) return;
  state.loading = true;
  setRandomBtnState(true);
  showFeatureSkeleton();

  try {
    const data = await apiFetch(`${API_BASE}/`);
    state.currentJoke = { id: data.id, joke: data.joke };
    renderFeaturedJoke(state.currentJoke);
    updateNewsletterPreview();
    enableBuilderActions(true);
  } catch (e) {
    showFeaturedError(e.message);
    toast('Could not fetch joke. Check your connection.', 'error');
  } finally {
    state.loading = false;
    setRandomBtnState(false);
  }
}

// ── Search jokes (debounced) ──────────────────────────────────
function debounceSearch(term) {
  clearTimeout(state.searchDebounce);
  if (!term.trim()) { document.getElementById('search-results').innerHTML = ''; return; }
  state.searchDebounce = setTimeout(() => searchJokes(term), 420);
}

async function searchJokes(term) {
  const resultsEl = document.getElementById('search-results');
  if (!term.trim()) { resultsEl.innerHTML = ''; return; }
  resultsEl.innerHTML = `<p style="font-size:var(--text-xs);color:var(--color-ink-muted);padding:var(--space-1) 0;">Searching…</p>`;

  try {
    const data = await apiFetch(`${API_BASE}/search?term=${encodeURIComponent(term)}&limit=20`);
    const jokes = (data.results || []).slice(0, 15);
    if (!jokes.length) {
      resultsEl.innerHTML = `<p class="empty-state">No jokes found for "<strong>${esc(term)}</strong>".</p>`;
      return;
    }
    resultsEl.innerHTML = '';
    const list = document.createElement('div');
    list.className = 'result-list';
    jokes.forEach(j => {
      const item = document.createElement('div');
      item.className = 'result-item';
      item.tabIndex = 0;
      item.role = 'button';
      item.setAttribute('aria-label', `Load joke: ${j.joke.slice(0, 60)}`);
      item.textContent = j.joke.length > 90 ? j.joke.slice(0, 90) + '…' : j.joke;
      item.addEventListener('click', () => selectJoke(j));
      item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectJoke(j); } });
      list.appendChild(item);
    });
    resultsEl.appendChild(list);
  } catch (e) {
    resultsEl.innerHTML = `<p class="empty-state">Search failed. Try again.</p>`;
  }
}

function selectJoke(joke) {
  state.currentJoke = { id: joke.id, joke: joke.joke };
  renderFeaturedJoke(state.currentJoke);
  updateNewsletterPreview();
  enableBuilderActions(true);
  toast('Joke loaded!');
}

// ── Featured joke rendering ───────────────────────────────────
function showFeatureSkeleton() {
  const wrap = document.getElementById('featured-wrap');
  wrap.innerHTML = `
    <div class="featured-skeleton" aria-busy="true" aria-label="Loading joke">
      <div class="skeleton skeleton-line" style="width:92%;height:1.75em;"></div>
      <div class="skeleton skeleton-line" style="width:78%;height:1.75em;"></div>
      <div class="skeleton skeleton-line" style="width:55%;height:1.75em;margin-bottom:0;"></div>
    </div>`;
}

function showFeaturedError(msg) {
  const wrap = document.getElementById('featured-wrap');
  wrap.innerHTML = `
    <div class="featured-card" style="border-color:var(--color-danger);">
      <p class="featured-joke-text" style="color:var(--color-danger);font-size:var(--text-base);font-family:var(--font-body);">
        Failed to load joke: ${esc(msg)}
      </p>
    </div>`;
}

function renderFeaturedJoke(joke) {
  const wrap = document.getElementById('featured-wrap');
  wrap.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'featured-card';
  card.setAttribute('aria-label', 'Featured joke');

  const qOpen  = document.createElement('span');
  qOpen.className = 'quote-mark';
  qOpen.setAttribute('aria-hidden', 'true');
  qOpen.textContent = '“';

  const qClose = document.createElement('span');
  qClose.className = 'quote-mark quote-mark-close';
  qClose.setAttribute('aria-hidden', 'true');
  qClose.textContent = '”';

  const jokeText = document.createElement('p');
  jokeText.className = 'featured-joke-text';
  jokeText.textContent = joke.joke;

  const actionsRow = document.createElement('div');
  actionsRow.className = 'joke-actions';

  // Save joke button
  const isSaved = state.saved.some(s => s.id === joke.id);
  const btnSave = document.createElement('button');
  btnSave.className = isSaved ? 'btn-action success' : 'btn-action primary';
  btnSave.textContent = isSaved ? 'Saved ✓' : 'Save joke';
  btnSave.setAttribute('aria-label', isSaved ? 'Joke already saved' : 'Save this joke');
  btnSave.addEventListener('click', () => {
    if (saveJoke(joke)) {
      btnSave.className = 'btn-action success';
      btnSave.textContent = 'Saved ✓';
      btnSave.setAttribute('aria-label', 'Joke already saved');
    } else {
      toast('Joke already saved!');
    }
  });

  // Copy text button
  const btnCopy = document.createElement('button');
  btnCopy.className = 'btn-action';
  btnCopy.textContent = 'Copy text';
  btnCopy.setAttribute('aria-label', 'Copy joke text to clipboard');
  btnCopy.addEventListener('click', () => {
    copyText(joke.joke, btnCopy, 'Copied!');
  });

  // Get another button
  const btnAnother = document.createElement('button');
  btnAnother.className = 'btn-action';
  btnAnother.textContent = 'Get another';
  btnAnother.setAttribute('aria-label', 'Fetch another random joke');
  btnAnother.addEventListener('click', fetchRandom);

  actionsRow.appendChild(btnSave);
  actionsRow.appendChild(btnCopy);
  actionsRow.appendChild(btnAnother);

  card.appendChild(qOpen);
  card.appendChild(jokeText);
  card.appendChild(qClose);
  card.appendChild(actionsRow);
  wrap.appendChild(card);
}

// ── Save joke ─────────────────────────────────────────────────
function saveJoke(joke) {
  if (state.saved.some(s => s.id === joke.id)) return false;
  state.saved.unshift({ id: joke.id, joke: joke.joke });
  if (state.saved.length > MAX_SAVED) state.saved = state.saved.slice(0, MAX_SAVED);
  persistSaved();
  renderSavedList();
  toast('Joke saved!', 'success');
  return true;
}

function removeSaved(id) {
  state.saved = state.saved.filter(s => s.id !== id);
  persistSaved();
  renderSavedList();
  // If current joke matches removed, update button state
  if (state.currentJoke && state.currentJoke.id === id) {
    renderFeaturedJoke(state.currentJoke);
  }
  toast('Removed from saved');
}

function clearAllSaved() {
  if (!state.saved.length) { toast('Nothing to clear'); return; }
  if (!confirm('Clear all saved jokes?')) return;
  state.saved = [];
  persistSaved();
  renderSavedList();
  toast('Saved jokes cleared');
}

function renderSavedList() {
  const el = document.getElementById('saved-list');
  if (!state.saved.length) {
    el.innerHTML = `<p class="empty-state">No saved jokes yet. Hit "Save joke" to keep your favorites.</p>`;
    return;
  }
  el.innerHTML = '';
  state.saved.forEach(j => {
    const item = document.createElement('div');
    item.className = 'saved-item';
    item.role = 'listitem';

    const textSpan = document.createElement('span');
    textSpan.className = 'saved-item-text';
    textSpan.textContent = j.joke;
    textSpan.title = j.joke;

    const btnRm = document.createElement('button');
    btnRm.className = 'btn-remove-saved';
    btnRm.setAttribute('aria-label', 'Remove saved joke');
    btnRm.title = 'Remove';
    btnRm.textContent = '×';
    btnRm.addEventListener('click', (e) => { e.stopPropagation(); removeSaved(j.id); });

    item.appendChild(textSpan);
    item.appendChild(btnRm);

    // Click to load joke
    textSpan.style.cursor = 'pointer';
    textSpan.addEventListener('click', () => selectJoke(j));
    textSpan.tabIndex = 0;
    textSpan.setAttribute('role', 'button');
    textSpan.setAttribute('aria-label', `Load saved joke`);
    textSpan.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectJoke(j); } });

    el.appendChild(item);
  });
}

// ── Newsletter preview ────────────────────────────────────────
function updateNewsletterPreview() {
  const intro   = document.getElementById('intro-line').value || 'This week\'s dad joke:';
  const signoff = document.getElementById('signoff-line').value || 'Happy Friday! 😄';
  const jokeText = state.currentJoke ? state.currentJoke.joke : null;

  document.getElementById('preview-intro-text').textContent = intro;
  document.getElementById('preview-signoff-text').textContent = signoff;

  const jokeEl = document.getElementById('preview-joke-text');
  if (jokeText) {
    jokeEl.textContent = jokeText;
    jokeEl.style.fontStyle = 'italic';
    jokeEl.style.color = '';
  } else {
    jokeEl.innerHTML = '<span style="color:var(--color-ink-muted);font-style:normal;">Fetch a joke to preview your newsletter block.</span>';
  }
}

function enableBuilderActions(enabled) {
  document.getElementById('btn-copy-plain').disabled = !enabled;
  document.getElementById('btn-copy-html').disabled = !enabled;
}

function buildPlainText() {
  const intro   = document.getElementById('intro-line').value || 'This week\'s dad joke:';
  const signoff = document.getElementById('signoff-line').value || 'Happy Friday! 😄';
  const joke    = state.currentJoke ? state.currentJoke.joke : '';
  return `${intro}\n\n"${joke}"\n\n${signoff}`;
}

function buildHtmlBlock() {
  const intro   = esc(document.getElementById('intro-line').value || 'This week\'s dad joke:');
  const signoff = esc(document.getElementById('signoff-line').value || 'Happy Friday! 😄');
  const joke    = esc(state.currentJoke ? state.currentJoke.joke : '');
  return `<!-- Dad Joke Newsletter Block -->
<table width="100%" cellpadding="0" cellspacing="0" style="font-family:Georgia,serif;color:#1a1a1a;">
  <tr><td style="padding:0 0 12px 0;font-size:14px;color:#666;">${intro}</td></tr>
  <tr>
    <td style="padding:16px 20px;background:#f5f9f5;border-left:3px solid #3d7a5e;border-radius:0 6px 6px 0;font-size:17px;line-height:1.65;font-style:italic;">
      &ldquo;${joke}&rdquo;
    </td>
  </tr>
  <tr><td style="padding:12px 0 0 0;font-size:14px;color:#666;">${signoff}</td></tr>
</table>
<!-- End Dad Joke Newsletter Block -->`;
}

// ── Batch generator ───────────────────────────────────────────
async function generateBatch() {
  if (state.batchLoading) return;
  state.batchLoading = true;

  const btnBatch = document.getElementById('btn-batch');
  btnBatch.disabled = true;
  btnBatch.textContent = 'Generating…';

  const contentEl = document.getElementById('batch-content');
  contentEl.innerHTML = `
    <div class="batch-skeleton">
      ${[1,2,3,4,5].map(() => `
        <div class="batch-skeleton-item">
          <div class="skeleton skeleton-line" style="width:88%;height:1em;"></div>
          <div class="skeleton skeleton-line" style="width:65%;height:1em;margin-bottom:0;"></div>
        </div>`).join('')}
    </div>`;
  document.getElementById('batch-footer').style.display = 'none';

  const jokes = [];
  const seenIds = new Set();

  for (let i = 0; i < 5; i++) {
    try {
      const data = await apiFetch(`${API_BASE}/`);
      if (!seenIds.has(data.id)) {
        seenIds.add(data.id);
        jokes.push({ id: data.id, joke: data.joke });
      }
    } catch {
      // skip on error
    }
  }

  state.batchJokes = jokes;

  if (!jokes.length) {
    contentEl.innerHTML = `<div class="batch-empty">Failed to fetch jokes. Check your connection and try again.</div>`;
    state.batchLoading = false;
    btnBatch.disabled = false;
    btnBatch.textContent = 'Generate 5 jokes for the week';
    return;
  }

  renderBatch(jokes);
  state.batchLoading = false;
  btnBatch.disabled = false;
  btnBatch.textContent = 'Regenerate';
  document.getElementById('batch-footer').style.display = 'flex';
  toast(`${jokes.length} jokes ready!`, 'success');
}

function renderBatch(jokes) {
  const contentEl = document.getElementById('batch-content');
  contentEl.innerHTML = '';
  const list = document.createElement('div');
  list.className = 'batch-list';
  jokes.forEach((j, i) => {
    const item = document.createElement('div');
    item.className = 'batch-item';
    item.style.animationDelay = `${i * 60}ms`;
    item.innerHTML = `
      <span class="batch-num">${i + 1}</span>
      <span class="batch-text">${esc(j.joke)}</span>`;
    list.appendChild(item);
  });
  contentEl.appendChild(list);
}

function batchToPlainText() {
  return state.batchJokes.map((j, i) => `${i + 1}. ${j.joke}`).join('\n\n');
}

// ── Copy helpers ──────────────────────────────────────────────
async function copyText(text, btn, successLabel) {
  const orig = btn.textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  toast('Copied to clipboard!', 'success');
  if (btn && successLabel) {
    btn.textContent = successLabel;
    const prev = btn.className;
    btn.className = btn.className + ' success';
    setTimeout(() => {
      btn.textContent = orig;
      btn.className = prev;
    }, 2000);
  }
}

// ── Random button state ───────────────────────────────────────
function setRandomBtnState(loading) {
  const btn = document.getElementById('btn-random');
  btn.disabled = loading;
  btn.textContent = loading ? 'Fetching…' : 'Get random joke';
}

// ── Toast ─────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3000);
}

// ── Event wiring ──────────────────────────────────────────────
document.getElementById('btn-random').addEventListener('click', fetchRandom);

// Search — debounced on input, immediate on button click
const searchInput = document.getElementById('search-input');
searchInput.addEventListener('input', () => debounceSearch(searchInput.value));
document.getElementById('btn-search').addEventListener('click', () => {
  clearTimeout(state.searchDebounce);
  searchJokes(searchInput.value);
});
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    clearTimeout(state.searchDebounce);
    searchJokes(searchInput.value);
  }
});

document.getElementById('btn-clear-saved').addEventListener('click', clearAllSaved);

document.getElementById('intro-line').addEventListener('input', updateNewsletterPreview);
document.getElementById('signoff-line').addEventListener('input', updateNewsletterPreview);

document.getElementById('btn-copy-plain').addEventListener('click', () => {
  if (!state.currentJoke) return;
  copyText(buildPlainText(), document.getElementById('btn-copy-plain'), 'Copied!');
});

document.getElementById('btn-copy-html').addEventListener('click', () => {
  if (!state.currentJoke) return;
  copyText(buildHtmlBlock(), document.getElementById('btn-copy-html'), 'Copied!');
});

document.getElementById('btn-batch').addEventListener('click', generateBatch);

document.getElementById('btn-copy-batch').addEventListener('click', () => {
  if (!state.batchJokes.length) return;
  copyText(batchToPlainText(), document.getElementById('btn-copy-batch'), 'Copied!');
});

// ── Init ──────────────────────────────────────────────────────
loadSaved();
renderSavedList();
updateNewsletterPreview();
// Auto-load first joke on boot
fetchRandom();
</script>
</body>
</html>
