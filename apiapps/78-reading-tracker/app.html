<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Tracker — App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Workbench · theme: Garden · nav: N9 */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow-x: clip; }
body {
  height: 100%;
  overflow: hidden;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ── N9 Nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 52px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  flex-shrink: 0;
}
.nav-logo span { color: var(--color-accent); }
.nav-sep { width: 1px; height: 16px; background: var(--color-border); flex-shrink: 0; }
.nav-page-label {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
  white-space: nowrap;
}
.nav-back {
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
  transition: color 0.15s ease;
}
.nav-back:hover { color: var(--color-ink); }

/* ── App Shell ── */
.app-shell {
  display: grid;
  grid-template-columns: 300px 1fr;
  margin-top: 52px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--color-border);
  background: var(--color-paper-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* Sidebar section */
.sb-section {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-border);
}
.sb-section:last-child { border-bottom: none; }
.sb-section-title {
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
  margin-bottom: var(--space-3);
}

/* Search input */
.search-wrap {
  position: relative;
  margin-bottom: var(--space-2);
}
.search-icon {
  position: absolute;
  left: var(--space-3);
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-ink-muted);
  font-size: var(--text-sm);
  pointer-events: none;
}
.input-search {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3) var(--space-2) var(--space-8);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input-search:focus {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px oklch(52% 0.14 155 / 0.10);
}
.input-search::placeholder { color: var(--color-ink-muted); }

/* Search dropdown */
.search-dropdown {
  display: none;
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px oklch(18% 0.04 155 / 0.14);
  overflow: hidden;
  max-height: 280px;
  overflow-y: auto;
  margin-top: var(--space-1);
}
.search-dropdown.open { display: block; }
.search-result-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  cursor: pointer;
  border-bottom: 1px solid var(--color-border);
  transition: background 0.12s ease;
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: var(--color-accent-subtle); }
.search-result-cover {
  width: 32px;
  height: 44px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background: var(--color-paper-2);
  flex-shrink: 0;
}
.search-result-placeholder {
  width: 32px;
  height: 44px;
  border-radius: var(--radius-sm);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--text-base);
  flex-shrink: 0;
  color: var(--color-ink-muted);
}
.search-result-info { flex: 1; min-width: 0; }
.search-result-title {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.search-result-meta {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.btn-add-result {
  flex-shrink: 0;
  padding: var(--space-1) var(--space-2);
  background: var(--color-accent);
  color: var(--color-paper);
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s ease;
}
.btn-add-result:hover { opacity: 0.85; }

/* Manual entry toggle */
.manual-toggle {
  font-size: var(--text-xs);
  color: var(--color-accent);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
  background: none;
  border: none;
  padding: 0;
  font-family: var(--font-body);
  display: block;
  margin-top: var(--space-2);
}
.manual-toggle:hover { color: var(--color-ink); }

/* Manual form */
.manual-form {
  display: none;
  flex-direction: column;
  gap: var(--space-2);
  margin-top: var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px solid var(--color-border);
}
.manual-form.open { display: flex; }
.field-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
  display: block;
  margin-bottom: var(--space-1);
}
.input-sm {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  transition: border-color 0.15s ease;
}
.input-sm:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px oklch(52% 0.14 155 / 0.10); }
.input-sm::placeholder { color: var(--color-ink-muted); }

/* Goal section */
.goal-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}
.goal-label { font-size: var(--text-sm); color: var(--color-ink-muted); flex-shrink: 0; }
.goal-input {
  width: 64px;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-1) var(--space-2);
  text-align: center;
  transition: border-color 0.15s ease;
}
.goal-input:focus { outline: none; border-color: var(--color-accent); }
.goal-progress-wrap {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: 100px;
  height: 8px;
  overflow: hidden;
  margin-bottom: var(--space-2);
}
.goal-progress-fill {
  height: 100%;
  border-radius: 100px;
  background: var(--color-accent);
  transition: width 0.5s ease;
}
.goal-progress-text {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  margin-bottom: var(--space-3);
}
.goal-progress-text strong { color: var(--color-accent); }

/* Year stats */
.year-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-2);
}
.year-stat {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
}
.year-stat-value {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 500;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.year-stat-label {
  font-size: 10px;
  color: var(--color-ink-muted);
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-top: 2px;
}

/* Genre bars */
.genre-bars { display: flex; flex-direction: column; gap: var(--space-2); }
.genre-bar-row { display: flex; align-items: center; gap: var(--space-2); }
.genre-bar-name {
  font-size: var(--text-xs);
  color: var(--color-ink);
  width: 100px;
  flex-shrink: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.genre-bar-track {
  flex: 1;
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: 100px;
  height: 6px;
  overflow: hidden;
}
.genre-bar-fill {
  height: 100%;
  border-radius: 100px;
  background: var(--color-accent);
  transition: width 0.4s ease;
}
.genre-bar-count {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  width: 20px;
  text-align: right;
}

/* ISBN bulk import */
.textarea-isbn {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-xs);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  resize: vertical;
  min-height: 72px;
  transition: border-color 0.15s ease;
}
.textarea-isbn:focus { outline: none; border-color: var(--color-accent); }
.textarea-isbn::placeholder { color: var(--color-ink-muted); }

/* Buttons */
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  background: var(--color-accent);
  color: var(--color-paper);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  white-space: nowrap;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px oklch(52% 0.14 155 / 0.28); }
.btn-primary:active { transform: translateY(0); box-shadow: none; }

.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-1) var(--space-3);
  background: transparent;
  color: var(--color-ink-muted);
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 500;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  white-space: nowrap;
}
.btn-ghost:hover { color: var(--color-ink); border-color: var(--color-ink-muted); background: var(--color-paper-2); }

.btn-danger {
  display: inline-flex;
  align-items: center;
  padding: var(--space-1) var(--space-2);
  background: transparent;
  color: var(--color-danger);
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 500;
  border: 1px solid oklch(55% 0.20 25 / 0.25);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.btn-danger:hover { background: oklch(55% 0.20 25 / 0.06); border-color: var(--color-danger); }

/* ── Main panel ── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-paper);
}

/* Toolbar */
.toolbar {
  padding: var(--space-3) var(--space-6);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-shrink: 0;
  flex-wrap: wrap;
}

/* Status tabs */
.status-tabs {
  display: flex;
  gap: var(--space-1);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 3px;
}
.status-tab {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-ink-muted);
  background: transparent;
  border: none;
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-3);
  cursor: pointer;
  transition: color 0.12s ease, background 0.12s ease;
  white-space: nowrap;
}
.status-tab:hover { color: var(--color-ink); }
.status-tab.active { background: var(--color-paper); color: var(--color-ink); box-shadow: 0 1px 4px oklch(18% 0.04 155 / 0.10); }

/* Sort + filter */
.toolbar-spacer { flex: 1; }
.sort-select {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-1) var(--space-3);
  cursor: pointer;
  transition: border-color 0.15s ease;
}
.sort-select:focus { outline: none; border-color: var(--color-accent); }

/* Genre filter chips */
.genre-chips {
  display: flex;
  gap: var(--space-1);
  flex-wrap: wrap;
  align-items: center;
}
.genre-chip {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  color: var(--color-ink-muted);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: 100px;
  padding: 2px var(--space-2);
  cursor: pointer;
  transition: color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  white-space: nowrap;
}
.genre-chip:hover { color: var(--color-accent); border-color: var(--color-accent-line); }
.genre-chip.active { color: var(--color-accent); background: var(--color-accent-subtle); border-color: var(--color-accent-line); }

/* Main scroll */
.main-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6);
}

/* Book cards */
.book-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: var(--space-4);
}

.book-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  animation: card-in 0.25s ease both;
}
.book-card:hover {
  transform: translateY(-2px);
  border-color: var(--color-accent-line);
  box-shadow: 0 6px 20px oklch(18% 0.04 155 / 0.10);
}
@keyframes card-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Cover area */
.book-cover-area {
  height: 140px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.book-cover-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.book-cover-init {
  width: 72px;
  height: 96px;
  background: var(--color-accent-subtle);
  border: 1px solid var(--color-accent-line);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 600;
  color: var(--color-accent);
  letter-spacing: -0.02em;
}

/* Status badge */
.status-badge {
  position: absolute;
  top: var(--space-2);
  right: var(--space-2);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 100px;
}
.status-badge.reading  { background: oklch(62% 0.15 72 / 0.15); color: var(--color-warn); border: 1px solid oklch(62% 0.15 72 / 0.3); }
.status-badge.want     { background: oklch(52% 0.14 155 / 0.12); color: var(--color-accent); border: 1px solid var(--color-accent-line); }
.status-badge.finished { background: oklch(55% 0.14 155 / 0.12); color: var(--color-success); border: 1px solid oklch(55% 0.14 155 / 0.3); }

/* Book body */
.book-body { padding: var(--space-3) var(--space-4); flex: 1; display: flex; flex-direction: column; gap: var(--space-2); }
.book-title {
  font-family: var(--font-display);
  font-size: var(--text-base);
  font-weight: 600;
  color: var(--color-ink);
  letter-spacing: -0.01em;
  line-height: 1.25;
}
.book-author {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}

/* Genre chips on card */
.book-genres {
  display: flex;
  gap: var(--space-1);
  flex-wrap: wrap;
}
.book-genre-chip {
  font-size: 10px;
  font-weight: 600;
  color: var(--color-ink-muted);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: 100px;
  padding: 1px 6px;
}

/* Stars */
.star-row {
  display: flex;
  align-items: center;
  gap: 2px;
}
.star {
  font-size: var(--text-base);
  cursor: pointer;
  color: var(--color-border);
  transition: color 0.1s ease, transform 0.1s ease;
  line-height: 1;
  user-select: none;
}
.star:hover { transform: scale(1.15); }
.star.filled { color: var(--color-warn); }

/* Progress bar on card */
.progress-wrap {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: 100px;
  height: 6px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 100px;
  background: var(--color-accent);
  transition: width 0.4s ease;
}
.progress-text {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}

/* Current page input */
.page-input-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.page-input {
  width: 70px;
  font-family: var(--font-body);
  font-size: var(--text-xs);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-2);
  text-align: center;
  transition: border-color 0.15s ease;
}
.page-input:focus { outline: none; border-color: var(--color-accent); }
.page-input-label { font-size: var(--text-xs); color: var(--color-ink-muted); }

/* Status dropdown */
.status-select {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-2);
  cursor: pointer;
  flex: 1;
  transition: border-color 0.15s ease;
}
.status-select:focus { outline: none; border-color: var(--color-accent); }

/* Sessions log on card */
.sessions-toggle {
  font-size: var(--text-xs);
  color: var(--color-accent);
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  font-family: var(--font-body);
  text-decoration: underline;
  text-underline-offset: 2px;
  text-align: left;
}
.sessions-toggle:hover { color: var(--color-ink); }

.sessions-log {
  display: none;
  flex-direction: column;
  gap: var(--space-1);
  margin-top: var(--space-1);
  padding-top: var(--space-2);
  border-top: 1px solid var(--color-border);
}
.sessions-log.open { display: flex; }
.session-entry {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  font-size: var(--text-xs);
}
.session-entry-date { color: var(--color-ink-muted); white-space: nowrap; }
.session-entry-pages { color: var(--color-success); font-weight: 600; }
.session-entry-note { color: var(--color-ink-muted); font-style: italic; flex: 1; }
.btn-remove-session {
  background: none;
  border: none;
  color: var(--color-ink-muted);
  cursor: pointer;
  font-size: var(--text-xs);
  padding: 0;
  line-height: 1;
  flex-shrink: 0;
}
.btn-remove-session:hover { color: var(--color-danger); }

/* Card actions row */
.card-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-top: auto;
  flex-wrap: wrap;
}

/* Dates */
.book-dates {
  font-size: 10px;
  color: var(--color-ink-muted);
}

/* Empty state */
.empty-state {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-16);
  text-align: center;
  gap: var(--space-3);
}
.empty-icon { font-size: 3rem; opacity: 0.3; }
.empty-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
}
.empty-sub { font-size: var(--text-sm); color: var(--color-ink-muted); max-width: 280px; line-height: 1.6; }

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: oklch(18% 0.04 155 / 0.55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 500;
  padding: var(--space-6);
  animation: fade-in 0.15s ease;
}
.modal-overlay.open { display: flex; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 440px;
  max-height: 80vh;
  overflow-y: auto;
  padding: var(--space-6);
  position: relative;
  box-shadow: 0 20px 60px oklch(18% 0.04 155 / 0.2);
  animation: modal-in 0.2s ease;
}
@keyframes modal-in {
  from { opacity: 0; transform: translateY(-8px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 500;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  margin-bottom: var(--space-4);
}
.modal-close {
  position: absolute;
  top: var(--space-4);
  right: var(--space-4);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  color: var(--color-ink-muted);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-size: var(--text-base);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s ease, color 0.12s ease;
}
.modal-close:hover { background: var(--color-border); color: var(--color-ink); }
.modal-form { display: flex; flex-direction: column; gap: var(--space-3); }
.modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.modal-actions { display: flex; gap: var(--space-3); margin-top: var(--space-2); }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 600;
  background: var(--color-ink);
  color: var(--color-paper);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px oklch(18% 0.04 155 / 0.2);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
  max-width: 320px;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--color-success); }
.toast.error { background: var(--color-danger); }
.toast.info { background: var(--color-ink-muted); }

/* ── Loading spinner ── */
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid var(--color-border);
  border-top-color: var(--color-accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Search loading state */
.search-loading {
  padding: var(--space-3) var(--space-4);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--color-ink-muted); }

/* ── Mobile responsive ── */
@media (max-width: 768px) {
  html, body { overflow: auto; height: auto; }
  .app-shell {
    grid-template-columns: 1fr;
    height: auto;
    overflow: visible;
  }
  .sidebar {
    border-right: none;
    border-bottom: 1px solid var(--color-border);
    max-height: 50vh;
  }
  .main { overflow: visible; }
  .main-scroll { overflow: visible; }
  .toolbar { padding: var(--space-3) var(--space-4); }
  .main-scroll { padding: var(--space-4); }
  .book-grid { grid-template-columns: 1fr; }
  .modal-overlay { padding: var(--space-4); }
}

@media (prefers-reduced-motion: reduce) {
  .book-card { animation: none; }
  .modal { animation: none; }
  .btn-primary:hover { transform: none; box-shadow: none; }
}
</style>
</head>
<body>

<!-- N9 Nav -->

      <!-- Genre Breakdown -->

      <!-- ISBN Bulk Import -->

  <!-- Main panel -->

<!-- Log Session Modal -->
<div class="modal-overlay" id="session-modal" role="dialog" aria-modal="true" aria-labelledby="session-modal-title">
  <div class="modal">

</div>

<!-- Toast -->
<div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

<script>
// ─────────────────────────────────────────────
//  UTILS
// ─────────────────────────────────────────────
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36);
const todayISO = () => new Date().toISOString().slice(0, 10);
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ─────────────────────────────────────────────
//  STORAGE
// ─────────────────────────────────────────────
function loadStore(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch { return fallback; }
}
function saveStore(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

/** @type {BookEntry[]} */
let books = loadStore('shelf_books', []);
let goal = loadStore('shelf_goal', 20);

/**
 * @typedef {Object} BookEntry
 * @property {string} id
 * @property {string} title
 * @property {string} author
 * @property {number} pages
 * @property {string} coverUrl
 * @property {string[]} genres
 * @property {number} year
 * @property {'reading'|'want'|'finished'} status
 * @property {number} currentPage
 * @property {number} rating
 * @property {string} dateAdded
 * @property {string} dateFinished
 * @property {Array<{id:string,date:string,pagesRead:number,note:string}>} sessions
 */

function persist() {
  saveStore('shelf_books', books);
  saveStore('shelf_goal', goal);
}

// ─────────────────────────────────────────────
//  TOAST
// ─────────────────────────────────────────────
let _toastTimer = null;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = 'toast'; }, 3200);
}

// ─────────────────────────────────────────────
//  OPEN LIBRARY SEARCH
// ─────────────────────────────────────────────
let _searchTimer = null;
let _searchResults = [];

const searchInput = document.getElementById('book-search-input');
const searchDropdown = document.getElementById('book-search-dropdown');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  clearTimeout(_searchTimer);
  if (!q) { closeSearchDropdown(); return; }
  _searchTimer = setTimeout(() => doSearch(q), 400);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSearchDropdown();
});

document.addEventListener('pointerdown', (e) => {
  if (!searchDropdown.contains(e.target) && e.target !== searchInput) closeSearchDropdown();
}, { passive: true });

function closeSearchDropdown() {
  searchDropdown.classList.remove('open');
  searchDropdown.innerHTML = '';
  searchInput.setAttribute('aria-expanded', 'false');
}

async function doSearch(q) {
  searchDropdown.innerHTML = '<div class="search-loading"><span class="spinner"></span> Searching Open Library&#8230;</div>';
  searchDropdown.classList.add('open');
  searchInput.setAttribute('aria-expanded', 'true');

  try {
    const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=8&fields=key,title,author_name,number_of_pages_median,subject,first_publish_year,cover_i,isbn`;
    const res = await fetch(url);
    const data = await res.json();
    const docs = data.docs || [];

    _searchResults = docs.map(d => ({
      key: d.key || '',
      title: d.title || 'Unknown Title',
      author: (d.author_name || []).join(', ') || 'Unknown Author',
      pages: d.number_of_pages_median || 0,
      year: d.first_publish_year || 0,
      coverId: d.cover_i || null,
      coverUrl: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : '',
      genres: (d.subject || []).slice(0, 6).map(s => s.trim()).filter(Boolean),
    }));

    if (!_searchResults.length) {
      searchDropdown.innerHTML = '<div class="search-loading" style="color:var(--color-ink-muted)">No results found. Try different keywords.</div>';
      return;
    }

    searchDropdown.innerHTML = _searchResults.map((r, i) => `
      <div class="search-result-item" role="option" data-idx="${i}" tabindex="0" aria-label="Add ${esc(r.title)} to library">
        ${r.coverUrl
          ? `<img src="${esc(r.coverUrl)}" alt="" class="search-result-cover" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
          : ''
        }
        <div class="search-result-placeholder" style="${r.coverUrl ? 'display:none' : ''}">&#128214;</div>
        <div class="search-result-info">
          <div class="search-result-title">${esc(r.title)}</div>
          <div class="search-result-meta">${esc(r.author)}${r.year ? ' · ' + r.year : ''}${r.pages ? ' · ' + r.pages + ' pp' : ''}</div>
        </div>
        <button class="btn-add-result" data-idx="${i}">+ Add</button>
      </div>
    `).join('');

  } catch {
    searchDropdown.innerHTML = '<div class="search-loading" style="color:var(--color-danger)">Could not reach Open Library. Check your connection.</div>';
  }
}

searchDropdown.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-idx]');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  addBookFromResult(_searchResults[idx]);
});

searchDropdown.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const item = e.target.closest('[data-idx]');
    if (item) {
      const idx = parseInt(item.dataset.idx, 10);
      addBookFromResult(_searchResults[idx]);
    }
  }
});

function addBookFromResult(r) {
  if (!r) return;
  if (books.find(b => b.title === r.title && b.author === r.author)) {
    toast(`"${r.title}" is already in your library`, 'info');
    closeSearchDropdown();
    searchInput.value = '';
    return;
  }
  const book = {
    id: uid(),
    title: r.title,
    author: r.author,
    pages: r.pages,
    coverUrl: r.coverUrl,
    genres: r.genres,
    year: r.year,
    status: 'want',
    currentPage: 0,
    rating: 0,
    dateAdded: todayISO(),
    dateFinished: '',
    sessions: [],
  };
  books.unshift(book);
  persist();
  renderAll();
  closeSearchDropdown();
  searchInput.value = '';
  toast(`Added "${r.title}" to library`, 'success');
}

// ─────────────────────────────────────────────
//  MANUAL ADD
// ─────────────────────────────────────────────
const manualToggle = document.getElementById('manual-toggle');
const manualForm = document.getElementById('manual-form');

manualToggle.addEventListener('click', () => {
  const open = manualForm.classList.toggle('open');
  manualToggle.setAttribute('aria-expanded', open.toString());
  manualForm.setAttribute('aria-hidden', (!open).toString());
  if (open) document.getElementById('manual-title').focus();
});

document.getElementById('btn-manual-add').addEventListener('click', () => {
  const title  = document.getElementById('manual-title').value.trim();
  const author = document.getElementById('manual-author').value.trim();
  const pages  = parseInt(document.getElementById('manual-pages').value) || 0;

  if (!title) { toast('Please enter a title', 'error'); return; }

  const book = {
    id: uid(),
    title,
    author: author || 'Unknown Author',
    pages,
    coverUrl: '',
    genres: [],
    year: 0,
    status: 'want',
    currentPage: 0,
    rating: 0,
    dateAdded: todayISO(),
    dateFinished: '',
    sessions: [],
  };
  books.unshift(book);
  persist();
  renderAll();

  document.getElementById('manual-title').value = '';
  document.getElementById('manual-author').value = '';
  document.getElementById('manual-pages').value = '';
  manualForm.classList.remove('open');
  manualToggle.setAttribute('aria-expanded', 'false');
  toast(`Added "${title}" to library`, 'success');
});

// ─────────────────────────────────────────────
//  ISBN BULK IMPORT
// ─────────────────────────────────────────────
document.getElementById('btn-isbn-import').addEventListener('click', async () => {
  const raw = document.getElementById('isbn-bulk').value.trim();
  if (!raw) { toast('Paste some ISBNs first', 'error'); return; }

  const isbns = raw.split('\n').map(s => s.trim().replace(/[^0-9X]/gi, '')).filter(s => s.length >= 10);
  if (!isbns.length) { toast('No valid ISBNs found', 'error'); return; }

  const btn = document.getElementById('btn-isbn-import');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Importing&#8230;';

  let added = 0, skipped = 0;

  for (const isbn of isbns) {
    try {
      const res = await fetch(`https://openlibrary.org/search.json?q=isbn:${isbn}&limit=1&fields=key,title,author_name,number_of_pages_median,subject,first_publish_year,cover_i`);
      const data = await res.json();
      const d = (data.docs || [])[0];
      if (!d) { skipped++; continue; }

      if (books.find(b => b.title === d.title)) { skipped++; continue; }

      books.unshift({
        id: uid(),
        title: d.title || 'Unknown',
        author: (d.author_name || []).join(', ') || 'Unknown Author',
        pages: d.number_of_pages_median || 0,
        coverUrl: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : '',
        genres: (d.subject || []).slice(0, 6).map(s => s.trim()).filter(Boolean),
        year: d.first_publish_year || 0,
        status: 'want',
        currentPage: 0,
        rating: 0,
        dateAdded: todayISO(),
        dateFinished: '',
        sessions: [],
      });
      added++;
    } catch {
      skipped++;
    }
  }

  persist();
  renderAll();
  document.getElementById('isbn-bulk').value = '';
  btn.disabled = false;
  btn.textContent = 'Import';
  toast(`Imported ${added} book${added !== 1 ? 's' : ''}${skipped ? `, ${skipped} skipped` : ''}`, added > 0 ? 'success' : 'info');
});

// ─────────────────────────────────────────────
//  GOAL
// ─────────────────────────────────────────────
document.getElementById('goal-input').addEventListener('change', () => {
  goal = parseInt(document.getElementById('goal-input').value) || 20;
  persist();
  renderSidebar();
});

// ─────────────────────────────────────────────
//  FILTER + SORT STATE
// ─────────────────────────────────────────────
let currentFilter = 'all';
let currentGenre = '';
let currentSort = 'dateAdded';

// Status tabs
document.querySelectorAll('.status-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    currentFilter = tab.dataset.filter;
    document.querySelectorAll('.status-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.filter === currentFilter);
      t.setAttribute('aria-selected', t.dataset.filter === currentFilter ? 'true' : 'false');
    });
    renderBookGrid();
  });
});

// Sort select
document.getElementById('sort-select').addEventListener('change', (e) => {
  currentSort = e.target.value;
  renderBookGrid();
});

// ─────────────────────────────────────────────
//  SESSION MODAL
// ─────────────────────────────────────────────
const sessionModal = document.getElementById('session-modal');

function openSessionModal(bookId) {
  const book = books.find(b => b.id === bookId);
  if (!book) return;
  document.getElementById('session-book-id').value = bookId;
  document.getElementById('session-book-title').value = book.title;
  document.getElementById('session-date').value = todayISO();
  document.getElementById('session-pages').value = '';
  document.getElementById('session-note').value = '';
  sessionModal.classList.add('open');
  document.getElementById('session-pages').focus();
}

function closeSessionModal() { sessionModal.classList.remove('open'); }

document.getElementById('session-modal-close').addEventListener('click', closeSessionModal);
document.getElementById('btn-cancel-session').addEventListener('click', closeSessionModal);
sessionModal.addEventListener('click', (e) => { if (e.target === sessionModal) closeSessionModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSessionModal(); });

document.getElementById('btn-log-session').addEventListener('click', () => {
  const bookId = document.getElementById('session-book-id').value;
  const date   = document.getElementById('session-date').value;
  const pages  = parseInt(document.getElementById('session-pages').value) || 0;
  const note   = document.getElementById('session-note').value.trim();

  if (!date) { toast('Please pick a date', 'error'); return; }
  if (!pages || pages < 1) { toast('Please enter pages read', 'error'); return; }

  const book = books.find(b => b.id === bookId);
  if (!book) return;

  book.sessions.push({ id: uid(), date, pagesRead: pages, note });
  // Advance current page
  book.currentPage = Math.min(book.currentPage + pages, book.pages || book.currentPage + pages);
  // Auto-mark as reading if still on want
  if (book.status === 'want') book.status = 'reading';
  // Auto-mark finished if at end
  if (book.pages > 0 && book.currentPage >= book.pages) {
    book.status = 'finished';
    if (!book.dateFinished) book.dateFinished = todayISO();
  }

  persist();
  renderAll();
  closeSessionModal();
  toast(`Session logged: +${pages} pages`, 'success');
});

// ─────────────────────────────────────────────
//  RENDER SIDEBAR
// ─────────────────────────────────────────────
function renderSidebar() {
  const year = new Date().getFullYear();
  const finished = books.filter(b => b.status === 'finished');
  const thisYear = finished.filter(b => b.dateFinished && b.dateFinished.startsWith(year));
  const pagesRead = books.reduce((s, b) => {
    return s + b.sessions.reduce((p, sess) => p + (sess.pagesRead || 0), 0);
  }, 0);

  // Goal
  const goalVal = goal;
  const pct = goalVal > 0 ? Math.min(100, Math.round((thisYear.length / goalVal) * 100)) : 0;
  document.getElementById('goal-input').value = goalVal;
  document.getElementById('goal-progress-fill').style.width = pct + '%';
  document.getElementById('goal-progress-text').innerHTML = `<strong>${thisYear.length}</strong> / ${goalVal} books completed this year (${pct}%)`;

  // Year stats
  document.getElementById('ys-read').textContent = thisYear.length;
  document.getElementById('ys-pages').textContent = pagesRead >= 1000 ? (pagesRead / 1000).toFixed(1) + 'k' : pagesRead;

  // Avg books/month (months elapsed in current year)
  const monthsElapsed = new Date().getMonth() + 1;
  const avgPerMonth = monthsElapsed > 0 ? (thisYear.length / monthsElapsed).toFixed(1) : '0';
  document.getElementById('ys-avgmonth').textContent = avgPerMonth;

  // Top genre
  const genreCounts = computeGenreCounts(books);
  const topGenre = Object.entries(genreCounts).sort((a, b) => b[1] - a[1])[0];
  document.getElementById('ys-genre').textContent = topGenre
    ? topGenre[0].split(' ').slice(0, 2).join(' ')
    : '—';

  // Genre breakdown bars
  const genreEl = document.getElementById('genre-bars');
  const genres = Object.entries(genreCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const maxCount = genres[0] ? genres[0][1] : 1;

  if (genres.length) {
    genreEl.innerHTML = genres.map(([g, c]) => `
      <div class="genre-bar-row">
        <span class="genre-bar-name" title="${esc(g)}">${esc(g)}</span>
        <div class="genre-bar-track">
          <div class="genre-bar-fill" style="width:${Math.round(c / maxCount * 100)}%"></div>
        </div>
        <span class="genre-bar-count">${c}</span>
      </div>
    `).join('');
  } else {
    genreEl.innerHTML = '<p style="font-size: var(--text-xs); color: var(--color-ink-muted);">Add books to see genre breakdown.</p>';
  }
}

function computeGenreCounts(bookList) {
  const counts = {};
  bookList.forEach(b => {
    (b.genres || []).slice(0, 3).forEach(g => {
      // normalize: title case, trim, max 30 chars
      const genre = g.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ').slice(0, 30);
      counts[genre] = (counts[genre] || 0) + 1;
    });
  });
  return counts;
}

// ─────────────────────────────────────────────
//  RENDER GENRE CHIPS (toolbar)
// ─────────────────────────────────────────────
function renderGenreChips() {
  const el = document.getElementById('genre-chips');
  const counts = computeGenreCounts(books);
  const top5 = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([g]) => g);

  el.innerHTML = top5.map(g => `
    <button class="genre-chip${currentGenre === g ? ' active' : ''}" data-genre="${esc(g)}">${esc(g)}</button>
  `).join('');

  if (currentGenre && !top5.includes(currentGenre)) currentGenre = '';

  el.querySelectorAll('.genre-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      currentGenre = currentGenre === chip.dataset.genre ? '' : chip.dataset.genre;
      renderGenreChips();
      renderBookGrid();
    });
  });
}

// ─────────────────────────────────────────────
//  RENDER BOOK GRID
// ─────────────────────────────────────────────
function renderBookGrid() {
  const el = document.getElementById('book-grid');

  // Filter
  let filtered = books;
  if (currentFilter !== 'all') filtered = filtered.filter(b => b.status === currentFilter);
  if (currentGenre) filtered = filtered.filter(b => {
    const normalized = (b.genres || []).map(g =>
      g.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ')
    );
    return normalized.includes(currentGenre);
  });

  // Sort
  const sorted = [...filtered];
  if (currentSort === 'title') sorted.sort((a, b) => a.title.localeCompare(b.title));
  else if (currentSort === 'author') sorted.sort((a, b) => a.author.localeCompare(b.author));
  else if (currentSort === 'progress') sorted.sort((a, b) => {
    const pa = a.pages > 0 ? a.currentPage / a.pages : 0;
    const pb = b.pages > 0 ? b.currentPage / b.pages : 0;
    return pb - pa;
  });
  else sorted.sort((a, b) => a.dateAdded < b.dateAdded ? 1 : -1);

  if (!sorted.length) {
    el.innerHTML = `
      <div class="empty-state" role="listitem">
        <div class="empty-icon">&#128218;</div>
        <div class="empty-title">No books yet</div>
        <p class="empty-sub">Search for a book in the sidebar or enter one manually to get started.</p>
      </div>`;
    return;
  }

  el.innerHTML = sorted.map(b => buildBookCard(b)).join('');

  // Wire up interactive elements
  el.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', handleCardAction);
  });
  el.querySelectorAll('.star').forEach(star => {
    star.addEventListener('click', handleStarClick);
  });
  el.querySelectorAll('.status-select').forEach(sel => {
    sel.addEventListener('change', handleStatusChange);
  });
  el.querySelectorAll('.page-input').forEach(input => {
    input.addEventListener('change', handlePageChange);
  });
}

function buildBookCard(b) {
  const pct = b.pages > 0 ? Math.min(100, Math.round((b.currentPage / b.pages) * 100)) : 0;
  const statusLabels = { reading: 'Reading', want: 'Want to Read', finished: 'Finished' };

  // Cover
  const initials = b.title.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
  const coverHTML = b.coverUrl
    ? `<img src="${esc(b.coverUrl)}" alt="Cover of ${esc(b.title)}" class="book-cover-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    + `<div class="book-cover-init" style="display:none">${esc(initials)}</div>`
    : `<div class="book-cover-init">${esc(initials)}</div>`;

  // Stars
  const stars = [1,2,3,4,5].map(n =>
    `<span class="star${b.rating >= n ? ' filled' : ''}" data-book-id="${b.id}" data-star="${n}" title="${n} star${n!==1?'s':''}" role="button" tabindex="0" aria-label="${n} star${n!==1?'s':''}">&#9733;</span>`
  ).join('');

  // Genres
  const genreChips = (b.genres || []).slice(0, 3).map(g =>
    `<span class="book-genre-chip">${esc(g.slice(0, 20))}</span>`
  ).join('');

  // Sessions log
  const sessionsHTML = (b.sessions || []).slice().reverse().slice(0, 5).map(s => `
    <div class="session-entry">
      <span class="session-entry-date">${s.date}</span>
      <span class="session-entry-pages">+${s.pagesRead}p</span>
      ${s.note ? `<span class="session-entry-note">${esc(s.note.slice(0,60))}</span>` : ''}
      <button class="btn-remove-session" data-action="remove-session" data-book-id="${b.id}" data-session-id="${s.id}" aria-label="Remove session">&#215;</button>
    </div>
  `).join('');

  // Status options
  const statusOptions = ['want','reading','finished'].map(s =>
    `<option value="${s}"${b.status === s ? ' selected' : ''}>${statusLabels[s]}</option>`
  ).join('');

  return `
  <article class="book-card" role="listitem" aria-label="${esc(b.title)} by ${esc(b.author)}">
    <div class="book-cover-area">
      ${coverHTML}
      <span class="status-badge ${b.status}" role="status">${statusLabels[b.status]}</span>
    </div>
    <div class="book-body">
      <div class="book-title">${esc(b.title)}</div>
      <div class="book-author">${esc(b.author)}${b.year ? ' · ' + b.year : ''}</div>

      ${genreChips ? `<div class="book-genres">${genreChips}</div>` : ''}

      <div class="star-row" aria-label="Rating: ${b.rating} of 5 stars">${stars}</div>

      ${b.status === 'reading' && b.pages > 0 ? `
        <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="page-input-row">
          <input type="number" class="page-input" value="${b.currentPage}" min="0" max="${b.pages}" data-book-id="${b.id}" aria-label="Current page of ${esc(b.title)}">
          <span class="page-input-label">/ ${b.pages} pages (${pct}%)</span>
        </div>
      ` : b.status === 'finished' && b.pages > 0 ? `
        <div class="progress-text" style="font-size:var(--text-xs);color:var(--color-success);">&#10003; ${b.pages} pages read</div>
      ` : b.pages > 0 ? `
        <div class="progress-text">${b.pages} pages</div>
      ` : ''}

      <div class="card-actions">
        <select class="status-select" data-book-id="${b.id}" aria-label="Change reading status of ${esc(b.title)}">${statusOptions}</select>
        ${b.status === 'reading' ? `<button class="btn-ghost" data-action="log-session" data-book-id="${b.id}" aria-label="Log reading session for ${esc(b.title)}">Log session</button>` : ''}
        <button class="btn-danger" data-action="remove-book" data-book-id="${b.id}" aria-label="Remove ${esc(b.title)} from library">&#215;</button>
      </div>

      <div class="book-dates">Added ${b.dateAdded}${b.dateFinished ? ' · Finished ' + b.dateFinished : ''}</div>

      ${b.sessions && b.sessions.length ? `
        <button class="sessions-toggle" data-action="toggle-sessions" data-book-id="${b.id}">
          ${b.sessions.length} session${b.sessions.length!==1?'s':''} logged &#9660;
        </button>
        <div class="sessions-log" id="sessions-${b.id}">${sessionsHTML}</div>
      ` : ''}
    </div>
  </article>`;
}

// ─────────────────────────────────────────────
//  CARD INTERACTIONS
// ─────────────────────────────────────────────
function handleCardAction(e) {
  const btn = e.currentTarget;
  const action = btn.dataset.action;
  const bookId = btn.dataset.bookId;

  if (action === 'remove-book') {
    const book = books.find(b => b.id === bookId);
    if (!book) return;
    if (!confirm(`Remove "${book.title}" from your library?`)) return;
    books = books.filter(b => b.id !== bookId);
    persist();
    renderAll();
    toast(`Removed "${book.title}"`, 'info');
  }

  if (action === 'log-session') {
    openSessionModal(bookId);
  }

  if (action === 'toggle-sessions') {
    const log = document.getElementById('sessions-' + bookId);
    if (log) {
      const open = log.classList.toggle('open');
      btn.textContent = btn.textContent.replace(open ? '▼' : '▲', open ? '▲' : '▼');
    }
  }

  if (action === 'remove-session') {
    const sessionId = btn.dataset.sessionId;
    const book = books.find(b => b.id === bookId);
    if (!book) return;
    const sess = book.sessions.find(s => s.id === sessionId);
    if (sess) {
      // Roll back currentPage
      book.currentPage = Math.max(0, book.currentPage - sess.pagesRead);
      book.sessions = book.sessions.filter(s => s.id !== sessionId);
      persist();
      renderAll();
      toast('Session removed', 'info');
    }
  }
}

function handleStarClick(e) {
  const star = e.currentTarget;
  const bookId = star.dataset.bookId;
  const rating = parseInt(star.dataset.star, 10);
  const book = books.find(b => b.id === bookId);
  if (!book) return;
  // Toggle: clicking same rating again clears it
  book.rating = book.rating === rating ? 0 : rating;
  persist();

  // Update stars in place without full re-render
  const starsInRow = star.closest('.star-row').querySelectorAll('.star');
  starsInRow.forEach((s, i) => {
    s.classList.toggle('filled', book.rating > i);
  });
  star.closest('.star-row').setAttribute('aria-label', `Rating: ${book.rating} of 5 stars`);
}

function handleStatusChange(e) {
  const sel = e.currentTarget;
  const bookId = sel.dataset.bookId;
  const newStatus = sel.value;
  const book = books.find(b => b.id === bookId);
  if (!book) return;
  book.status = newStatus;
  if (newStatus === 'finished') {
    if (!book.dateFinished) book.dateFinished = todayISO();
    if (book.pages > 0) book.currentPage = book.pages;
  } else if (newStatus === 'reading') {
    book.dateFinished = '';
  }
  persist();
  renderAll();
  toast(`Status updated`, 'info');
}

function handlePageChange(e) {
  const input = e.currentTarget;
  const bookId = input.dataset.bookId;
  const book = books.find(b => b.id === bookId);
  if (!book) return;
  const val = Math.max(0, Math.min(parseInt(input.value) || 0, book.pages));
  book.currentPage = val;
  if (book.pages > 0 && val >= book.pages) {
    book.status = 'finished';
    if (!book.dateFinished) book.dateFinished = todayISO();
    persist();
    renderAll();
    toast('Book marked as finished!', 'success');
    return;
  }
  persist();
  // Update progress bar in place
  const pct = book.pages > 0 ? Math.min(100, Math.round((val / book.pages) * 100)) : 0;
  const card = input.closest('.book-card');
  if (card) {
    const fill = card.querySelector('.progress-fill');
    const label = card.querySelector('.page-input-label');
    if (fill) fill.style.width = pct + '%';
    if (label) label.textContent = `/ ${book.pages} pages (${pct}%)`;
  }
}

// ─────────────────────────────────────────────
//  RENDER ALL
// ─────────────────────────────────────────────
function renderAll() {
  renderSidebar();
  renderGenreChips();
  renderBookGrid();
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
renderAll();
</script>
</body>
