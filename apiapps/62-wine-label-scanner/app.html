<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinum — Wine Reference Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Workbench · theme: Atelier · nav: N9 */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow-x: clip; }
body {
  height: 100%;
  overflow: hidden;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ── N9 Nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 52px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  flex-shrink: 0;
}
.nav-logo span { color: var(--color-accent); }
.nav-sep { width: 1px; height: 16px; background: var(--color-border); flex-shrink: 0; }
.nav-page-label { font-size: var(--text-sm); color: var(--color-ink-muted); font-weight: 500; white-space: nowrap; }
.nav-back {
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
  transition: color 0.15s ease;
}
.nav-back:hover { color: var(--color-ink); }

/* ── App shell ── */
.app-shell {
  display: grid;
  grid-template-columns: 280px 1fr;
  margin-top: 52px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--color-border);
  background: var(--color-paper-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-tabs {
  display: flex;
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}
.sidebar-tab {
  flex: 1;
  padding: var(--space-3) var(--space-2);
  background: transparent;
  border: none;
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
.sidebar-tab:hover { color: var(--color-ink); }
.sidebar-tab.active { color: var(--color-accent); border-bottom-color: var(--color-accent); }

.sidebar-panel { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
.sidebar-panel.active { display: flex; }

/* Search panel */
.search-block {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  flex-shrink: 0;
}

.field-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
  display: block;
  margin-bottom: var(--space-1);
}

.input-search {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.input-search:focus {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px oklch(52% 0.14 68 / 0.10);
}
.input-search::placeholder { color: var(--color-ink-muted); }

/* Filter chips */
.filter-group { display: flex; flex-direction: column; gap: var(--space-2); }
.chips-row { display: flex; flex-wrap: wrap; gap: var(--space-1); }
.chip {
  padding: 3px var(--space-3);
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 500;
  border: 1px solid var(--color-border);
  border-radius: 20px;
  background: var(--color-paper);
  color: var(--color-ink-muted);
  cursor: pointer;
  transition: all 0.12s ease;
  white-space: nowrap;
}
.chip:hover { border-color: var(--color-accent-line); color: var(--color-accent); background: var(--color-accent-subtle); }
.chip.active { background: var(--color-accent); color: var(--color-paper); border-color: var(--color-accent); }

/* Vintage range */
.vintage-block {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}
.vintage-range-row { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); }
.vintage-range-row input[type="range"] {
  flex: 1;
  accent-color: var(--color-accent);
  cursor: pointer;
}
.vintage-range-row span { font-size: var(--text-xs); font-variant-numeric: tabular-nums; color: var(--color-ink-muted); white-space: nowrap; min-width: 36px; text-align: center; }

/* Food pairing panel */
.pairing-block {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}
.pairing-results { padding: var(--space-2) 0; flex: 1; overflow-y: auto; }
.pairing-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-4);
  cursor: pointer;
  transition: background 0.12s;
  border-left: 2px solid transparent;
}
.pairing-item:hover { background: oklch(89% 0.012 78); }
.pairing-item.active { background: oklch(89% 0.012 78); border-left-color: var(--color-accent); }
.pairing-score {
  font-size: var(--text-xs);
  font-weight: 700;
  color: var(--color-accent);
  background: var(--color-accent-subtle);
  border-radius: var(--radius-sm);
  padding: 2px 6px;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.pairing-name { font-size: var(--text-sm); font-weight: 500; color: var(--color-ink); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pairing-region { font-size: var(--text-xs); color: var(--color-ink-muted); }

/* Cellar panel */
.cellar-panel-inner { padding: var(--space-2) 0; flex: 1; overflow-y: auto; }
.cellar-empty {
  padding: var(--space-8) var(--space-4);
  text-align: center;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  line-height: 1.7;
}
.cellar-item {
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.12s, border-color 0.12s;
}
.cellar-item:last-child { border-bottom: none; }
.cellar-item:hover { background: oklch(89% 0.012 78); }
.cellar-item.active { background: oklch(89% 0.012 78); border-left-color: var(--color-accent); }
.cellar-item-name { font-size: var(--text-sm); font-weight: 600; color: var(--color-ink); }
.cellar-item-meta { font-size: var(--text-xs); color: var(--color-ink-muted); margin-top: 2px; }
.cellar-item-note { font-size: var(--text-xs); color: var(--color-ink-muted); margin-top: var(--space-1); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Main panel ── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-paper);
}

/* Main tabs */
.main-tabs {
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--color-border);
  padding: 0 var(--space-6);
  gap: var(--space-1);
  flex-shrink: 0;
  height: 44px;
}
.main-tab {
  padding: var(--space-2) var(--space-3);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  background: transparent;
  border: none;
  color: var(--color-ink-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.15s, border-color 0.15s;
}
.main-tab:hover { color: var(--color-ink); }
.main-tab.active { color: var(--color-accent); border-bottom-color: var(--color-accent); }
.result-count { margin-left: auto; font-size: var(--text-xs); color: var(--color-ink-muted); }

/* Grid view */
.main-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6);
}

.wine-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-4);
}

/* Wine card */
.wine-card {
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  background: var(--color-paper);
  cursor: pointer;
  transition: box-shadow 0.15s, border-color 0.15s, transform 0.15s;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  animation: card-in 0.2s ease;
}
.wine-card:hover {
  border-color: var(--color-accent-line);
  box-shadow: 0 4px 20px oklch(52% 0.14 68 / 0.10);
  transform: translateY(-1px);
}
.wine-card.selected {
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px oklch(52% 0.14 68 / 0.12);
}

@keyframes card-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-2); }
.card-name {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--color-ink);
  line-height: 1.2;
}
.card-producer { font-size: var(--text-sm); color: var(--color-ink-muted); margin-top: 2px; }
.card-badges { display: flex; flex-wrap: wrap; gap: var(--space-1); align-items: flex-start; flex-shrink: 0; }
.badge {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 20px;
  white-space: nowrap;
}
.badge-style-red      { background: oklch(70% 0.12 15 / 0.15);  color: oklch(40% 0.12 15);  border: 1px solid oklch(70% 0.12 15 / 0.30); }
.badge-style-white    { background: oklch(88% 0.10 90 / 0.20);  color: oklch(45% 0.08 90);  border: 1px solid oklch(75% 0.10 90 / 0.40); }
.badge-style-rosé     { background: oklch(80% 0.10 350 / 0.15); color: oklch(45% 0.10 350); border: 1px solid oklch(75% 0.10 350 / 0.30); }
.badge-style-sparkling{ background: oklch(85% 0.06 220 / 0.15); color: oklch(40% 0.06 220); border: 1px solid oklch(70% 0.06 220 / 0.30); }
.badge-style-dessert  { background: oklch(80% 0.12 70 / 0.15);  color: oklch(42% 0.10 70);  border: 1px solid oklch(70% 0.10 70 / 0.30); }
.badge-price-entry    { background: var(--color-paper-2); color: var(--color-ink-muted); border: 1px solid var(--color-border); }
.badge-price-mid      { background: oklch(90% 0.05 155 / 0.4); color: oklch(42% 0.10 155); border: 1px solid oklch(80% 0.06 155 / 0.4); }
.badge-price-premium  { background: oklch(85% 0.08 72 / 0.2);  color: oklch(42% 0.10 72);  border: 1px solid oklch(75% 0.08 72 / 0.4); }
.badge-price-luxury   { background: oklch(80% 0.10 50 / 0.2);  color: oklch(38% 0.12 50);  border: 1px solid oklch(72% 0.10 50 / 0.4); }

.card-region { display: flex; align-items: center; gap: var(--space-1); font-size: var(--text-xs); color: var(--color-ink-muted); }
.card-grape { font-size: var(--text-xs); color: var(--color-ink-muted); font-style: italic; }
.card-notes { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-1); }
.note-chip {
  font-size: 10px;
  padding: 1px 6px;
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: 20px;
  color: var(--color-ink-muted);
}

/* Empty state */
.grid-empty {
  grid-column: 1 / -1;
  padding: var(--space-16);
  text-align: center;
  color: var(--color-ink-muted);
  font-size: var(--text-sm);
  line-height: 1.7;
}
.grid-empty-title { font-family: var(--font-display); font-size: var(--text-2xl); color: var(--color-ink); font-weight: 400; letter-spacing: -0.02em; margin-bottom: var(--space-2); }

/* ── Detail panel ── */
#detail-panel {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}
#detail-panel.visible { display: flex; }

.detail-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6) var(--space-8);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.detail-header { display: flex; gap: var(--space-6); align-items: flex-start; }
.detail-name-block { flex: 1; min-width: 0; }
.detail-name {
  font-family: var(--font-display);
  font-size: var(--text-3xl);
  font-weight: 400;
  letter-spacing: -0.03em;
  color: var(--color-ink);
  line-height: 1.1;
}
.detail-producer { font-size: var(--text-lg); color: var(--color-ink-muted); margin-top: var(--space-1); }
.detail-badges { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
.detail-meta-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-4);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
}
.detail-meta-item { display: flex; flex-direction: column; gap: 3px; }
.detail-meta-label { font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--color-ink-muted); }
.detail-meta-value { font-size: var(--text-sm); font-weight: 500; color: var(--color-ink); }

/* Tasting profile bars */
.profile-section { display: flex; flex-direction: column; gap: var(--space-3); }
.section-title { font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-ink-muted); margin-bottom: var(--space-1); }
.profile-bar-row { display: flex; align-items: center; gap: var(--space-3); }
.profile-bar-label { font-size: var(--text-sm); color: var(--color-ink); width: 72px; flex-shrink: 0; }
.profile-bar-track {
  flex: 1;
  height: 6px;
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: 99px;
  overflow: hidden;
}
.profile-bar-fill {
  height: 100%;
  background: var(--color-accent);
  border-radius: 99px;
  transition: width 0.4s ease;
}
.profile-bar-val { font-size: var(--text-xs); color: var(--color-ink-muted); width: 24px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }

/* Notes chips */
.flavor-notes { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.flavor-chip {
  padding: var(--space-1) var(--space-3);
  background: var(--color-accent-subtle);
  border: 1px solid var(--color-accent-line);
  border-radius: 20px;
  font-size: var(--text-xs);
  color: var(--color-accent);
  font-weight: 500;
}

/* Food pairings */
.pairing-list { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.pairing-tag {
  padding: var(--space-1) var(--space-3);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  color: var(--color-ink);
}

/* Serving info */
.serving-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-4);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
}
.serving-item { display: flex; flex-direction: column; gap: var(--space-1); }
.serving-label { font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--color-ink-muted); }
.serving-value { font-size: var(--text-sm); color: var(--color-ink); }

/* Sommelier notes */
.sommelier-notes {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-left: 3px solid var(--color-accent);
  border-radius: var(--radius-md);
  padding: var(--space-4) var(--space-6);
  font-size: var(--text-sm);
  color: var(--color-ink);
  line-height: 1.75;
  font-style: italic;
}

/* Cellar action row */
.cellar-action {
  display: flex;
  align-items: flex-start;
  gap: var(--space-4);
  padding: var(--space-4) var(--space-8);
  border-top: 1px solid var(--color-border);
  flex-shrink: 0;
  background: var(--color-paper);
}
.btn-cellar {
  padding: var(--space-3) var(--space-6);
  background: var(--color-accent);
  color: var(--color-paper);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-cellar:hover { transform: translateY(-1px); box-shadow: 0 4px 12px oklch(52% 0.14 68 / 0.28); }
.btn-cellar:active { transform: translateY(0); box-shadow: none; }
.btn-cellar.in-cellar { background: var(--color-paper-2); color: var(--color-accent); border: 1px solid var(--color-accent-line); }
.input-note {
  flex: 1;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  resize: none;
  transition: border-color 0.15s;
  height: 44px;
}
.input-note:focus { outline: none; border-color: var(--color-accent); }
.input-note::placeholder { color: var(--color-ink-muted); }

/* Books section */
.books-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); }
.book-card {
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  background: var(--color-paper-2);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}
.book-title { font-size: var(--text-sm); font-weight: 600; color: var(--color-ink); line-height: 1.3; }
.book-author { font-size: var(--text-xs); color: var(--color-ink-muted); }
.book-year { font-size: var(--text-xs); color: var(--color-ink-muted); }
.books-loading { font-size: var(--text-sm); color: var(--color-ink-muted); padding: var(--space-4); }

/* Grid back button */
.btn-back {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  background: transparent;
  border: none;
  cursor: pointer;
  padding: var(--space-2) 0;
  transition: color 0.15s;
}
.btn-back:hover { color: var(--color-ink); }

/* Toast */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 600;
  background: var(--color-ink);
  color: var(--color-paper);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px oklch(20% 0.010 62 / 0.20);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--color-success); }

/* ── Mobile ── */
@media (max-width: 768px) {
  html, body { overflow: auto; height: auto; }
  .app-shell { grid-template-columns: 1fr; height: auto; overflow: visible; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--color-border); max-height: 50vh; }
  .main { overflow: visible; }
  #detail-panel.visible { overflow: visible; }
  .detail-scroll { overflow: visible; padding: var(--space-4); }
  .detail-meta-grid { grid-template-columns: repeat(2, 1fr); }
  .serving-grid { grid-template-columns: 1fr 1fr; }
  .wine-grid { grid-template-columns: 1fr; }
  .books-grid { grid-template-columns: 1fr; }
  .cellar-action { flex-direction: column; padding: var(--space-4); }
  .main-scroll { overflow: visible; }
  .main-tabs { padding: 0 var(--space-4); }
}

@media (prefers-reduced-motion: reduce) {

const filters = { country:'all', style:'all', body:'all', price:'all' };
let searchQuery = '';
let vintageFrom = 1990;
let vintageTo   = 2023;
let selectedWine = null;
let currentMainTab = 'grid';

const cellar = (() => {
  const KEY = 'vinum_cellar';
  const get = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } };
  const save = (list) => localStorage.setItem(KEY, JSON.stringify(list));
  return {
    get,
    add(wineId, note) {
      const list = get().filter(e => e.id !== wineId);
      list.push({ id: wineId, note, addedAt: new Date().toISOString() });
      if (list.length > 20) list.splice(0, list.length - 20);
      save(list);
    },
    remove(wineId) { save(get().filter(e => e.id !== wineId)); },
    has(wineId)   { return get().some(e => e.id === wineId); },
    getNote(wineId){ const e = get().find(e => e.id === wineId); return e?.note || ''; },
  };
})();

// ── Filter + Search ───────────────────────────────────────────
function filterWines() {
  return WINES.filter(w => {
    if (filters.country !== 'all' && w.country !== filters.country) return false;
    if (filters.style !== 'all' && w.style !== filters.style) return false;
    if (filters.body !== 'all' && w.body !== filters.body) return false;
    if (filters.price !== 'all' && w.priceTier !== filters.price) return false;
    if (w.vintageFrom > vintageTo || w.vintageTo < vintageFrom) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      return (
        w.name.toLowerCase().includes(q) ||
        w.producer.toLowerCase().includes(q) ||
        w.region.toLowerCase().includes(q) ||
        w.country.toLowerCase().includes(q) ||
        w.grapes.some(g => g.toLowerCase().includes(q)) ||
        w.notes.some(n => n.toLowerCase().includes(q))
      );
    }
    return true;
  });
}

// ── Style badge helper ────────────────────────────────────────
const styleBadgeClass = s => ({ red:'badge-style-red', white:'badge-style-white', 'rosé':'badge-style-rosé', sparkling:'badge-style-sparkling', dessert:'badge-style-dessert' }[s] || 'badge-style-red');
const priceBadgeClass = p => ({ entry:'badge-price-entry', mid:'badge-price-mid', premium:'badge-price-premium', luxury:'badge-price-luxury' }[p] || 'badge-price-entry');
const priceLabel = p => ({ entry:'Entry', mid:'Mid', premium:'Premium', luxury:'Luxury' }[p] || p);
const styleLabel = s => s.charAt(0).toUpperCase() + s.slice(1);

// Food pairing emojis
const pairingEmoji = dish => {
  const d = dish.toLowerCase();
  if (d.includes('beef') || d.includes('steak') || d.includes('lamb') || d.includes('venison') || d.includes('game') || d.includes('meat')) return '🥩';
  if (d.includes('fish') || d.includes('salmon') || d.includes('tuna') || d.includes('shellfish') || d.includes('seafood') || d.includes('oyster') || d.includes('lobster') || d.includes('crab') || d.includes('mussel') || d.includes('scallop')) return '🐟';
  if (d.includes('pasta') || d.includes('pizza') || d.includes('risotto') || d.includes('noodle')) return '🍝';
  if (d.includes('cheese')) return '🧀';
  if (d.includes('chocolate') || d.includes('dessert') || d.includes('cake') || d.includes('sweet')) return '🍫';
  if (d.includes('duck') || d.includes('chicken') || d.includes('quail') || d.includes('poultry')) return '🍗';
  if (d.includes('truffle') || d.includes('mushroom')) return '🍄';
  if (d.includes('sushi') || d.includes('asian') || d.includes('spicy')) return '🍱';
  if (d.includes('salad') || d.includes('vegetable') || d.includes('asparagus')) return '🥗';
  if (d.includes('foie') || d.includes('pork') || d.includes('ham') || d.includes('prosciutto')) return '🥓';
  return '🍽️';
};

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ── Render wine grid ──────────────────────────────────────────
function renderGrid() {
  const wines = filterWines();
  const grid = document.getElementById('wine-grid');
  const countEl = document.getElementById('result-count');
  countEl.textContent = `${wines.length} wine${wines.length !== 1 ? 's' : ''}`;

  if (!wines.length) {
    grid.innerHTML = '<div class="grid-empty"><p class="grid-empty-title">No wines found</p><p>Try adjusting your filters or search query.</p></div>';
    return;
  }

  grid.innerHTML = wines.map(w => `
    <article class="wine-card${selectedWine?.id === w.id ? ' selected' : ''}" role="listitem" tabindex="0" data-id="${w.id}" aria-label="${esc(w.name)} — ${esc(w.region)}">
      <div class="card-top">
        <div>
          <div class="card-name">${esc(w.name)}</div>
          <div class="card-producer">${esc(w.producer)}</div>
        </div>
        <div class="card-badges">
          <span class="badge ${styleBadgeClass(w.style)}">${styleLabel(w.style)}</span>
          <span class="badge ${priceBadgeClass(w.priceTier)}">${priceLabel(w.priceTier)}</span>
        </div>
      </div>
      <div class="card-region">${w.flag} ${esc(w.region)}</div>
      <div class="card-grape">${esc(w.grapes.join(', '))}</div>
      <div class="card-notes">${w.notes.slice(0,3).map(n => `<span class="note-chip">${esc(n)}</span>`).join('')}</div>
    </article>
  `).join('');

  grid.querySelectorAll('.wine-card').forEach(card => {
    card.addEventListener('click', () => openDetail(card.dataset.id));
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openDetail(card.dataset.id); });
  });
}

// ── Sommelier note generator ───────────────────────────────────
function sommelierNote(w) {
  const bodyDesc = { light:'light-bodied and elegant', medium:'medium-bodied and balanced', full:'full-bodied and powerful' }[w.body] || 'well-structured';
  const acidDesc = w.acidity >= 4 ? 'vibrant acidity' : w.acidity === 3 ? 'balanced acidity' : 'soft acidity';
  const tanninDesc = w.tannin >= 4 ? 'firm, grippy tannins' : w.tannin === 3 ? 'polished tannins' : w.tannin <= 1 ? 'no significant tannin' : 'soft tannins';
  const notes3 = w.notes.slice(0,3).join(', ');
  const pairing1 = w.pairings[0];
  const decNote = w.decanting !== 'none' ? ` Decanting for ${w.decanting} will open up the aromatics.` : ' Best enjoyed without decanting to preserve freshness.';
  return `${w.name} is a ${bodyDesc} ${w.style} wine from ${w.region}, ${w.country}. On the palate you\'ll find ${notes3}, underpinned by ${acidDesc}${w.style === 'red' ? ' and ' + tanninDesc : ''}.${decNote} An excellent match for ${pairing1}.`;
}

// ── Glass recommendation ──────────────────────────────────────
function glassRec(w) {
  if (w.style === 'sparkling') return 'Champagne flute or coupe';
  if (w.style === 'white' || w.style === 'rosé' || w.style === 'dessert') return 'White wine glass (tulip shaped)';
  if (w.body === 'full') return 'Large Bordeaux glass';
  return 'Burgundy bowl';
}

// ── Open detail ───────────────────────────────────────────────
function openDetail(id) {
  const w = WINES.find(w => w.id === id);
  if (!w) return;
  selectedWine = w;

  // Switch main view
  document.getElementById('mtab-grid').style.display = 'none';
  document.getElementById('mtab-books').style.display = 'none';
  document.getElementById('detail-panel').classList.add('visible');

  const inCellar = cellar.has(w.id);
  const cellarNote = cellar.getNote(w.id);
  document.getElementById('cellar-note').value = cellarNote;
  updateCellarButton(inCellar);

  const bars = [
    { label:'Body',      val: w.body === 'full' ? 5 : w.body === 'medium' ? 3 : 1.5 },
    { label:'Tannin',    val: w.tannin },
    { label:'Acidity',   val: w.acidity },
    { label:'Sweetness', val: w.sweetness },
  ];

  document.getElementById('detail-scroll').innerHTML = `
    <div>
      <button class="btn-back" id="btn-back-detail">← Back to list</button>
    </div>
    <div class="detail-header">
      <div class="detail-name-block">
        <h1 class="detail-name">${esc(w.name)}</h1>
        <div class="detail-producer">${esc(w.producer)}</div>
        <div class="detail-badges">
          <span class="badge ${styleBadgeClass(w.style)}">${styleLabel(w.style)}</span>
          <span class="badge ${priceBadgeClass(w.priceTier)}">${priceLabel(w.priceTier)}</span>
        </div>
      </div>
    </div>

    <div class="detail-meta-grid">
      <div class="detail-meta-item">
        <span class="detail-meta-label">Region</span>
        <span class="detail-meta-value">${w.flag} ${esc(w.region)}</span>
      </div>
      <div class="detail-meta-item">
        <span class="detail-meta-label">Grape(s)</span>
        <span class="detail-meta-value">${esc(w.grapes.join(', '))}</span>
      </div>
      <div class="detail-meta-item">
        <span class="detail-meta-label">Vintage</span>
        <span class="detail-meta-value">${w.vintageFrom}–${w.vintageTo}</span>
      </div>
      <div class="detail-meta-item">
        <span class="detail-meta-label">ABV</span>
        <span class="detail-meta-value">${w.abv}%</span>
      </div>
    </div>

    <div class="profile-section">
      <span class="section-title">Tasting Profile</span>
      ${bars.map(b => `
        <div class="profile-bar-row">
          <span class="profile-bar-label">${b.label}</span>
          <div class="profile-bar-track"><div class="profile-bar-fill" style="width:${(b.val/5)*100}%"></div></div>
          <span class="profile-bar-val">${b.val}/5</span>
        </div>
      `).join('')}
    </div>

    <div>
      <span class="section-title">Flavor Notes</span>
      <div class="flavor-notes" style="margin-top:var(--space-2);">
        ${w.notes.map(n => `<span class="flavor-chip">${esc(n)}</span>`).join('')}
      </div>
    </div>

    <div>
      <span class="section-title">Food Pairings</span>
      <div class="pairing-list" style="margin-top:var(--space-2);">
        ${w.pairings.map(p => `<span class="pairing-tag">${pairingEmoji(p)} ${esc(p)}</span>`).join('')}
      </div>
    </div>

    <div class="serving-grid">
      <div class="serving-item">
        <span class="serving-label">Serving temp</span>
        <span class="serving-value">${w.servingTemp}°C</span>
      </div>
      <div class="serving-item">
        <span class="serving-label">Glass</span>
        <span class="serving-value">${esc(glassRec(w))}</span>
      </div>
      <div class="serving-item">
        <span class="serving-label">Decanting</span>
        <span class="serving-value">${esc(w.decanting)}</span>
      </div>
    </div>

    <div>
      <span class="section-title">Sommelier Notes</span>
      <p class="sommelier-notes" style="margin-top:var(--space-2);">${sommelierNote(w)}</p>
    </div>
  `;

  document.getElementById('btn-back-detail').addEventListener('click', closeDetail);
  renderGrid(); // refresh card selection highlight
}

function closeDetail() {
  selectedWine = null;
  document.getElementById('detail-panel').classList.remove('visible');
  if (currentMainTab === 'grid') {
    document.getElementById('mtab-grid').style.display = '';
  } else {
    document.getElementById('mtab-books').style.display = '';
  }
  renderGrid();
}

// ── Cellar ────────────────────────────────────────────────────
function updateCellarButton(inCellar) {
  const btn = document.getElementById('btn-cellar-toggle');
  btn.textContent = inCellar ? '✓ In Cellar' : '＋ Add to Cellar';
  btn.className = 'btn-cellar' + (inCellar ? ' in-cellar' : '');
}

document.getElementById('btn-cellar-toggle').addEventListener('click', () => {
  if (!selectedWine) return;
  const note = document.getElementById('cellar-note').value.trim();
  if (cellar.has(selectedWine.id)) {
    cellar.remove(selectedWine.id);
    updateCellarButton(false);
    toast('Removed from cellar');
  } else {
    cellar.add(selectedWine.id, note);
    updateCellarButton(true);
    toast('Added to cellar', 'success');
  }
  renderCellar();
});

function renderCellar() {
  const entries = cellar.get();
  const container = document.getElementById('cellar-list');
  if (!entries.length) {
    container.innerHTML = '<div class="cellar-empty">Your cellar is empty.<br>Add wines from the detail view.</div>';
    return;
  }
  container.innerHTML = entries.map(e => {
    const w = WINES.find(w => w.id === e.id);
    if (!w) return '';
    return `
      <div class="cellar-item${selectedWine?.id === w.id ? ' active' : ''}" data-id="${w.id}" tabindex="0" role="button" aria-label="${esc(w.name)}">
        <div class="cellar-item-name">${esc(w.name)}</div>
        <div class="cellar-item-meta">${w.flag} ${esc(w.region)} · <span class="badge ${styleBadgeClass(w.style)}">${styleLabel(w.style)}</span></div>
        ${e.note ? `<div class="cellar-item-note">${esc(e.note)}</div>` : ''}
      </div>`;
  }).join('');
  container.querySelectorAll('.cellar-item').forEach(el => {
    el.addEventListener('click', () => {
      openDetail(el.dataset.id);
      // Switch to search tab so grid shows
      switchSidebarTab('search');
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') el.click(); });
  });
}

// ── Food pairing finder ───────────────────────────────────────
function renderPairingResults(dish) {
  const container = document.getElementById('pairing-results');
  if (!dish.trim()) {
    container.innerHTML = '<div class="cellar-empty">Type a dish above to find matching wines</div>';
    return;
  }
  const q = dish.toLowerCase();
  const scored = WINES.map(w => {
    const score = w.pairings.filter(p => p.toLowerCase().split(/\s+/).some(word => q.includes(word)) || q.split(/\s+/).some(word => p.toLowerCase().includes(word))).length;
    return { w, score };
  }).filter(({ score }) => score > 0).sort((a, b) => b.score - a.score);

  if (!scored.length) {
    container.innerHTML = `<div class="cellar-empty">No direct matches for "${esc(dish)}".<br>Try a more general term.</div>`;
    return;
  }
  container.innerHTML = scored.slice(0, 15).map(({ w, score }) => `
    <div class="pairing-item${selectedWine?.id === w.id ? ' active' : ''}" data-id="${w.id}" tabindex="0" role="button" aria-label="${esc(w.name)}">
      <span class="pairing-score">${score}</span>
      <div>
        <div class="pairing-name">${esc(w.name)}</div>
        <div class="pairing-region">${w.flag} ${esc(w.region)}</div>
      </div>
    </div>
  `).join('');
  container.querySelectorAll('.pairing-item').forEach(el => {
    el.addEventListener('click', () => openDetail(el.dataset.id));
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') el.click(); });
  });
}

// ── Open Library books ────────────────────────────────────────
async function searchBooks(query) {
  const container = document.getElementById('books-results');
  container.innerHTML = '<p class="books-loading">Searching Open Library…</p>';
  try {
    const url = `https://openlibrary.org/search.json?subject=wine&q=${encodeURIComponent(query)}&limit=8&fields=key,title,author_name,first_publish_year`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const docs = data.docs || [];
    if (!docs.length) {
      container.innerHTML = '<p class="books-loading">No books found. Try a different query.</p>';
      return;
    }
    container.innerHTML = `<div class="books-grid">${docs.map(d => `
      <a class="book-card" href="https://openlibrary.org${d.key}" target="_blank" rel="noopener" aria-label="${esc(d.title)}">
        <div class="book-title">${esc(d.title)}</div>
        ${d.author_name ? `<div class="book-author">by ${esc(d.author_name.join(', '))}</div>` : ''}
        ${d.first_publish_year ? `<div class="book-year">First published: ${d.first_publish_year}</div>` : ''}
      </a>`).join('')}</div>`;
  } catch (err) {
    container.innerHTML = `<p class="books-loading">Error fetching books: ${esc(err.message)}</p>`;
  }
}

// ── Tab switching ─────────────────────────────────────────────
function switchSidebarTab(name) {
  document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.toggle('active', t.dataset.stab === name));
  document.querySelectorAll('.sidebar-panel').forEach(p => p.classList.toggle('active', p.id === 'stab-' + name));
}

function switchMainTab(name) {
  currentMainTab = name;
  document.querySelectorAll('.main-tab').forEach(t => t.classList.toggle('active', t.dataset.mtab === name));
  document.getElementById('detail-panel').classList.remove('visible');
  document.getElementById('mtab-grid').style.display   = name === 'grid'  ? '' : 'none';
  document.getElementById('mtab-books').style.display  = name === 'books' ? '' : 'none';
  if (name === 'grid') renderGrid();
}

// ── Toast ─────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3000);
}

// ── Event wiring ──────────────────────────────────────────────
document.querySelectorAll('.sidebar-tab').forEach(t => {
  t.addEventListener('click', () => switchSidebarTab(t.dataset.stab));
});

document.querySelectorAll('.main-tab').forEach(t => {
  t.addEventListener('click', () => switchMainTab(t.dataset.mtab));
});

document.getElementById('wine-search').addEventListener('input', e => {
  searchQuery = e.target.value;
  if (selectedWine) closeDetail();
  renderGrid();
});

document.querySelectorAll('.chip[data-filter]').forEach(chip => {
  chip.addEventListener('click', () => {
    const group = chip.dataset.filter;
    // deactivate siblings
    document.querySelectorAll(`.chip[data-filter="${group}"]`).forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    filters[group] = chip.dataset.val;
    if (selectedWine) closeDetail();
    renderGrid();
  });
});

const vintageFromInput = document.getElementById('vintage-from');
const vintageToInput   = document.getElementById('vintage-to');
const vintageFromVal   = document.getElementById('vintage-from-val');
const vintageToVal     = document.getElementById('vintage-to-val');

vintageFromInput.addEventListener('input', () => {
  vintageFrom = parseInt(vintageFromInput.value);
  if (vintageFrom > vintageTo) { vintageTo = vintageFrom; vintageToInput.value = vintageTo; }
  vintageFromVal.textContent = vintageFrom;
  vintageToVal.textContent = vintageTo;
  if (selectedWine) closeDetail();
  renderGrid();
});

vintageToInput.addEventListener('input', () => {
  vintageTo = parseInt(vintageToInput.value);
  if (vintageTo < vintageFrom) { vintageFrom = vintageTo; vintageFromInput.value = vintageFrom; }
  vintageFromVal.textContent = vintageFrom;
  vintageToVal.textContent = vintageTo;
  if (selectedWine) closeDetail();
  renderGrid();
});

let dishTimer;
document.getElementById('dish-input').addEventListener('input', e => {
  clearTimeout(dishTimer);
  dishTimer = setTimeout(() => renderPairingResults(e.target.value), 200);
});

document.getElementById('books-search-btn').addEventListener('click', () => {
  const q = document.getElementById('books-query').value.trim() || 'wine';
  searchBooks(q);
});
document.getElementById('books-query').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('books-search-btn').click();
});

// ── Init ──────────────────────────────────────────────────────
renderGrid();
renderCellar();
</script>
</body>
</html>
