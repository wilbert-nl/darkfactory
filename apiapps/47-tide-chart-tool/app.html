<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tide Chart Tool — Charter Guide Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Workbench · theme: Garden · nav: N9 */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  height: 100%;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ── N9 Nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 52px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.nav-logo-mark {
  font-size: var(--text-sm);
  font-weight: 700;
  font-family: var(--font-body);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--color-accent);
  color: var(--color-paper);
  padding: 2px 8px;
  border-radius: var(--radius-sm);
}
.nav-sep {
  width: 1px;
  height: 16px;
  background: var(--color-border);
  flex-shrink: 0;
}
.nav-label {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
}
.nav-back {
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  display: flex;
  align-items: center;
  gap: var(--space-1);
  transition: color 0.15s;
}
.nav-back:hover { color: var(--color-ink); }
.nav-station-badge {
  font-size: var(--text-xs);
  background: var(--color-accent-subtle);
  border: 1px solid var(--color-accent-line);
  color: var(--color-accent);
  padding: 2px var(--space-2);
  border-radius: var(--radius-sm);
  font-weight: 600;
  display: none;
}

/* ── Workbench Shell ── */
.workbench {
  display: grid;
  grid-template-columns: 300px 1fr;
  margin-top: 52px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--color-border);
  background: var(--color-paper-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-body {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
.sidebar-body::-webkit-scrollbar { width: 4px; }
.sidebar-body::-webkit-scrollbar-track { background: transparent; }
.sidebar-body::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

/* ── Section label ── */
.section-label {
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
  margin-bottom: var(--space-2);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.section-label::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 12px;
  background: var(--color-accent);
  border-radius: 2px;
}

/* ── Search ── */
.search-wrap {
  position: relative;
}
.search-input {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  padding: var(--space-2) var(--space-3);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  color: var(--color-ink);
  transition: border-color 0.15s;
}
.search-input:focus { outline: none; border-color: var(--color-accent); }
.search-input::placeholder { color: var(--color-ink-muted); }

.dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  z-index: 100;
  max-height: 220px;
  overflow-y: auto;
  box-shadow: 0 4px 16px oklch(0% 0 0 / 0.08);
  display: none;
}
.dropdown.open { display: block; }
.dropdown-item {
  padding: var(--space-2) var(--space-3);
  font-size: var(--text-sm);
  cursor: pointer;
  transition: background 0.1s;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.dropdown-item:hover { background: var(--color-accent-subtle); }
.dropdown-item-id {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  font-family: var(--font-mono);
  margin-left: auto;
}

/* ── Popular chips ── */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}
.chip {
  font-size: var(--text-xs);
  padding: var(--space-1) var(--space-3);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: 20px;
  cursor: pointer;
  color: var(--color-ink-muted);
  font-weight: 500;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
  white-space: nowrap;
}
.chip:hover { background: var(--color-accent-subtle); border-color: var(--color-accent-line); color: var(--color-accent); }
.chip.active { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-paper); }

/* ── Date range ── */
.date-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-2);
}
.date-field label {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  font-weight: 600;
  display: block;
  margin-bottom: var(--space-1);
}
.date-field input[type="date"] {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-xs);
  padding: var(--space-2) var(--space-2);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  color: var(--color-ink);
  transition: border-color 0.15s;
}
.date-field input[type="date"]:focus { outline: none; border-color: var(--color-accent); }

/* ── Buttons ── */
.btn {
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-md);
  border: none;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  white-space: nowrap;
}
.btn:hover { opacity: 0.85; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--color-accent); color: var(--color-paper); width: 100%; justify-content: center; }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--color-border);
  color: var(--color-ink-muted);
}
.btn-ghost:hover { color: var(--color-ink); border-color: var(--color-accent-line); }
.btn-sm { font-size: var(--text-xs); padding: var(--space-1) var(--space-3); }
.btn-icon {
  width: 28px; height: 28px;
  padding: 0;
  justify-content: center;
  font-size: 14px;
}

/* ── Saved stations ── */
.saved-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}
.saved-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: border-color 0.12s;
  font-size: var(--text-sm);
}
.saved-item:hover { border-color: var(--color-accent-line); }
.saved-item-name { flex: 1; font-weight: 500; color: var(--color-ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saved-item-id { font-size: var(--text-xs); color: var(--color-ink-muted); font-family: var(--font-mono); flex-shrink: 0; }
.saved-item-del { color: var(--color-ink-muted); font-size: 12px; flex-shrink: 0; }
.saved-item-del:hover { color: var(--color-danger); }

/* ── Trip planner ── */
.trip-add {
  display: flex;
  gap: var(--space-2);
}
.trip-input {
  flex: 1;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  padding: var(--space-2) var(--space-3);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  color: var(--color-ink);
  transition: border-color 0.15s;
}
.trip-input:focus { outline: none; border-color: var(--color-accent); }
.trip-input::placeholder { color: var(--color-ink-muted); }

.trip-select {
  font-family: var(--font-body);
  font-size: var(--text-sm);
  padding: var(--space-2) var(--space-3);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  color: var(--color-ink);
  transition: border-color 0.15s;
}
.trip-select:focus { outline: none; border-color: var(--color-accent); }

.activity-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-top: var(--space-2);
}
.activity-card {
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3);
}
.activity-card-name {
  font-weight: 600;
  font-size: var(--text-sm);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-1);
}
.activity-badge {
  font-size: var(--text-xs);
  padding: 1px var(--space-2);
  border-radius: 12px;
  font-weight: 600;
}
.activity-badge.high { background: oklch(88% 0.07 220); color: oklch(35% 0.14 220); }
.activity-badge.low { background: var(--color-accent-subtle); color: var(--color-accent); }
.activity-badge.rising { background: oklch(92% 0.08 72); color: oklch(40% 0.15 72); }
.activity-badge.falling { background: oklch(95% 0.06 25); color: oklch(45% 0.18 25); }
.activity-times {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  line-height: 1.6;
}
.activity-del {
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--color-ink-muted);
  font-size: 11px;
  padding: 2px;
  margin-left: auto;
  flex-shrink: 0;
}
.activity-del:hover { color: var(--color-danger); }

/* ── Main panel ── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-paper);
}
.main-body {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}
.main-body::-webkit-scrollbar { width: 4px; }
.main-body::-webkit-scrollbar-track { background: transparent; }
.main-body::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

/* ── Current conditions ── */
.conditions-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: var(--space-3);
}
.condition-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  transition: border-color 0.15s;
}
.condition-card:hover { border-color: var(--color-accent-line); }
.condition-label {
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
  margin-bottom: var(--space-2);
}
.condition-value {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
  line-height: 1;
}
.condition-sub {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  margin-top: var(--space-1);
}
.condition-value.rising { color: var(--color-tide-high); }
.condition-value.falling { color: oklch(55% 0.18 25); }

/* ── Chart container ── */
.chart-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
}
.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-4);
}
.chart-title {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 400;
  letter-spacing: -0.02em;
  color: var(--color-ink);
}
.chart-legend {
  display: flex;
  gap: var(--space-4);
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
}
.legend-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.legend-line {
  width: 16px; height: 2px;
  border-top: 2px dashed var(--color-warn);
  flex-shrink: 0;
}

/* ── SVG chart ── */
#tide-svg-wrap {
  width: 100%;
  overflow: hidden;
}
#tide-svg {
  width: 100%;
  overflow: visible;
}

/* SVG element styles */
.svg-grid-line { stroke: var(--color-border); stroke-dasharray: 4 3; }
.svg-axis-label { fill: var(--color-ink-muted); font-size: 10px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
.svg-tide-area { fill: url(#tideAreaGrad); }
.svg-tide-line { fill: none; stroke: oklch(52% 0.14 220); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.svg-high-dot { fill: oklch(55% 0.18 230); stroke: var(--color-paper); stroke-width: 2; }
.svg-low-dot  { fill: oklch(52% 0.14 155); stroke: var(--color-paper); stroke-width: 2; }
.svg-now-line { stroke: oklch(62% 0.15 72); stroke-width: 1.5; stroke-dasharray: 5 3; }
.svg-now-label { fill: oklch(62% 0.15 72); font-size: 9px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; }
.svg-high-label { fill: oklch(40% 0.14 230); font-size: 9px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 600; }
.svg-low-label  { fill: oklch(38% 0.12 155); font-size: 9px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 600; }
.svg-day-sep { stroke: var(--color-border); stroke-opacity: 0.7; }

/* ── Tide table ── */
.tide-table-wrap {
  overflow-x: auto;
}
.tide-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-sm);
  min-width: 600px;
}
.tide-table th {
  text-align: left;
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-ink-muted);
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--color-border);
}
.tide-table td {
  padding: var(--space-3) var(--space-3);
  border-bottom: 1px solid oklch(90% 0.012 95);
  vertical-align: middle;
}
.tide-table tr:last-child td { border-bottom: none; }
.tide-table tbody tr { transition: background 0.1s; }
.tide-table tbody tr:hover { background: var(--color-accent-subtle); }
.tide-table tr.today-row { background: oklch(94% 0.025 155 / 0.5); }
.day-label { font-weight: 600; color: var(--color-ink); }
.day-date { font-size: var(--text-xs); color: var(--color-ink-muted); margin-top: 2px; }

.tide-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: var(--text-xs);
  padding: 2px 7px;
  border-radius: 6px;
  margin: 2px 3px 2px 0;
  font-weight: 500;
  white-space: nowrap;
}
.tide-pill-high { background: oklch(88% 0.06 220); color: oklch(35% 0.14 220); }
.tide-pill-low  { background: var(--color-accent-subtle); color: var(--color-accent); }

.range-bar-wrap { display: flex; align-items: center; gap: var(--space-2); }
.range-bar {
  flex: 1;
  height: 6px;
  background: var(--color-border);
  border-radius: 3px;
  overflow: hidden;
  min-width: 60px;
}
.range-bar-fill { height: 100%; border-radius: 3px; background: var(--color-accent); }
.range-bar-fill.large { background: oklch(55% 0.16 230); }
.range-bar-fill.medium { background: var(--color-accent); }
.range-bar-fill.small { background: oklch(62% 0.15 72); }
.range-val { font-size: var(--text-xs); color: var(--color-ink-muted); white-space: nowrap; }

.rating-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 4px;
}

/* ── Empty / loading states ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space-12) var(--space-8);
  color: var(--color-ink-muted);
  gap: var(--space-3);
}
.empty-icon { font-size: 2.5rem; }
.empty-title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
}
.empty-sub { font-size: var(--text-sm); color: var(--color-ink-muted); max-width: 340px; line-height: 1.6; }

.loading-bar {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-4);
  background: var(--color-accent-subtle);
  border: 1px solid var(--color-accent-line);
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  color: var(--color-accent);
  font-weight: 500;
}
.spinner {
  width: 14px; height: 14px;
  border: 2px solid var(--color-accent-line);
  border-top-color: var(--color-accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Toast ── */
#toast-wrap {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  z-index: 500;
  pointer-events: none;
}
.toast {
  background: var(--color-ink);
  color: var(--color-paper);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  font-size: var(--text-sm);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 200px;
  box-shadow: 0 4px 20px oklch(0% 0 0 / 0.15);
  animation: toastIn 0.25s ease;
}
.toast.success { background: var(--color-success); }
.toast.error { background: var(--color-danger); }
.toast.warn { background: var(--color-warn); color: var(--color-ink); }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ── Responsive ── */
@media (max-width: 768px) {
  .workbench {
    grid-template-columns: 1fr;
    height: auto;
    overflow: visible;
  }
  .sidebar {
    border-right: none;
    border-bottom: 1px solid var(--color-border);
    max-height: none;
    overflow: visible;
  }
  .sidebar-body { overflow: visible; }
  .main { overflow: visible; height: auto; }
  .main-body { overflow: visible; }
  body { height: auto; overflow: auto; }
  .conditions-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<!-- N9 Nav -->
<nav class="nav" aria-label="Site navigation">
  <a href="index.html" class="nav-logo" aria-label="Tide Chart Tool">
    <span class="nav-logo-mark">Tide</span>
    Charter Planner
  </a>
  <div class="nav-sep" aria-hidden="true"></div>
  <span class="nav-label" id="nav-station-name">NOAA Tide Forecasts</span>
  <span class="nav-station-badge" id="nav-station-badge" aria-live="polite"></span>
  <a href="index.html" class="nav-back" aria-label="Go back to home">
    ← Home
  </a>
</nav>

<!-- Workbench -->
<div class="workbench">

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar" aria-label="Station controls">
    <div class="sidebar-body">

      <!-- Station search -->
      <section aria-labelledby="search-label">
        <div class="section-label" id="search-label">Station Search</div>
        <div class="search-wrap">
          <input
            type="text"

<!-- Toast container -->
<div id="toast-wrap" aria-live="polite" aria-atomic="true"></div>

<script>
/* Hallmark · macrostructure: Workbench · theme: Garden · nav: N9 */
(function () {
'use strict';

/* ═══════════════════════════════════════════
   CONSTANTS & CONFIG
═══════════════════════════════════════════ */

const NOAA_BASE = 'https://api.tidesandcurrents.noaa.gov';
const STATIONS_URL = `${NOAA_BASE}/mdapi/prod/webapi/stations.json?type=tidepredictions`;
const MAX_SAVED = 5;

const POPULAR = [
  { id: '9414290', name: 'San Francisco, CA' },
  { id: '8518750', name: 'New York, NY' },
  { id: '8723170', name: 'Miami, FL' },
  { id: '9447130', name: 'Seattle, WA' },
  { id: '8443970', name: 'Boston, MA' },
];

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */

const state = {
  stations: [],           // full station list from NOAA
  activeStation: null,    // { id, name }
  startDate: '',
  endDate: '',
  hourlyPredictions: [],  // for SVG chart
  hiloPredictions: [],    // high/low events
  activities: JSON.parse(localStorage.getItem('tide_activities') || '[]'),
  savedStations: JSON.parse(localStorage.getItem('tide_saved_stations') || '[]'),
  waterTemp: null,
  loading: false,
};

/* ═══════════════════════════════════════════
   DOM REFS
═══════════════════════════════════════════ */

const elSearch      = document.getElementById('station-search');
const elDropdown    = document.getElementById('station-dropdown');
const elDateStart   = document.getElementById('date-start');
const elDateEnd     = document.getElementById('date-end');
const elLoadBtn     = document.getElementById('load-btn');
const elSavedList   = document.getElementById('saved-list');
const elActName     = document.getElementById('activity-name');
const elActTide     = document.getElementById('activity-tide');
const elAddActBtn   = document.getElementById('add-activity-btn');
const elActList     = document.getElementById('activity-list');
const elMainBody    = document.getElementById('main-body');
const elNavStation  = document.getElementById('nav-station-name');
const elNavBadge    = document.getElementById('nav-station-badge');

/* ═══════════════════════════════════════════
   DATE UTILITIES
═══════════════════════════════════════════ */

function dateToYMD(d) {
  return d.toISOString().slice(0, 10);
}
function dateToNOAA(str) {
  return str.replace(/-/g, '');
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return dateToYMD(d);
}
function fmtDateShort(str) {
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtDateTime(str) {
  // str: "2024-01-01 06:30"
  const [date, time] = str.split(' ');
  const d = new Date(`${date}T${time}:00`);
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}
function fmtDateFull(str) {
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
function isToday(dateStr) {
  return dateStr === dateToYMD(new Date());
}
function diffDays(a, b) {
  const da = new Date(a + 'T00:00:00');
  const db = new Date(b + 'T00:00:00');
  return Math.round((db - da) / 86400000);
}

/* ═══════════════════════════════════════════
   INIT DATES
═══════════════════════════════════════════ */

(function initDates() {
  const today = dateToYMD(new Date());
  const weekOut = addDays(today, 7);
  elDateStart.value = today;
  elDateEnd.value = weekOut;
  state.startDate = today;
  state.endDate = weekOut;

  // Enforce max 30-day range
  elDateStart.addEventListener('change', () => {
    state.startDate = elDateStart.value;
    const max = addDays(elDateStart.value, 30);
    if (elDateEnd.value > max) {
      elDateEnd.value = max;
      state.endDate = max;
      toast('Date range capped at 30 days', 'warn');
    }
  });
  elDateEnd.addEventListener('change', () => {
    state.endDate = elDateEnd.value;
    const days = diffDays(elDateStart.value, elDateEnd.value);
    if (days > 30) {
      elDateEnd.value = addDays(elDateStart.value, 30);
      state.endDate = elDateEnd.value;
      toast('Date range capped at 30 days', 'warn');
    }
    if (days < 0) {
      elDateEnd.value = elDateStart.value;
      state.endDate = elDateStart.value;
    }
  });
})();

/* ═══════════════════════════════════════════
   LOAD STATION LIST
═══════════════════════════════════════════ */

async function loadStations() {
  const cached = sessionStorage.getItem('noaa_stations');
  if (cached) {
    state.stations = JSON.parse(cached);
    return;
  }
  try {
    const res = await fetch(STATIONS_URL);
    const data = await res.json();
    state.stations = (data.stations || []).map(s => ({
      id: s.id,
      name: s.name,
      state: s.state || '',
      lat: s.lat,
      lng: s.lng,
    }));
    sessionStorage.setItem('noaa_stations', JSON.stringify(state.stations));
  } catch (e) {
    console.warn('Could not load station list:', e);
    // Provide fallback popular stations
    state.stations = [
      { id: '9414290', name: 'San Francisco', state: 'CA' },
      { id: '8518750', name: 'The Battery', state: 'NY' },
      { id: '8723170', name: 'Miami Beach', state: 'FL' },
      { id: '9447130', name: 'Seattle', state: 'WA' },
      { id: '8443970', name: 'Boston', state: 'MA' },
      { id: '8724580', name: 'Key West', state: 'FL' },
      { id: '8665530', name: 'Charleston', state: 'SC' },
      { id: '9410660', name: 'Los Angeles', state: 'CA' },
    ];
  }
}

/* ═══════════════════════════════════════════
   SEARCH / DROPDOWN
═══════════════════════════════════════════ */

elSearch.addEventListener('input', () => {
  const q = elSearch.value.trim().toLowerCase();
  if (q.length < 2) { closeDropdown(); return; }
  const results = state.stations
    .filter(s => s.name.toLowerCase().includes(q) || s.state.toLowerCase().includes(q))
    .slice(0, 10);
  renderDropdown(results);
});

function renderDropdown(results) {
  if (!results.length) { closeDropdown(); return; }
  elDropdown.innerHTML = results.map(s =>
    `<div class="dropdown-item" role="option" tabindex="0" data-id="${esc(s.id)}" data-name="${esc(s.name + (s.state ? ', ' + s.state : ''))}">
      <span>${esc(s.name)}${s.state ? ', ' + esc(s.state) : ''}</span>
      <span class="dropdown-item-id">${esc(s.id)}</span>
    </div>`
  ).join('');
  elDropdown.classList.add('open');
  elSearch.setAttribute('aria-expanded', 'true');
}

function closeDropdown() {
  elDropdown.innerHTML = '';
  elDropdown.classList.remove('open');
  elSearch.setAttribute('aria-expanded', 'false');
}

elDropdown.addEventListener('click', e => {
  const item = e.target.closest('.dropdown-item');
  if (!item) return;
  selectStation(item.dataset.id, item.dataset.name);
  closeDropdown();
});

elDropdown.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const item = document.activeElement.closest('.dropdown-item');
    if (item) { selectStation(item.dataset.id, item.dataset.name); closeDropdown(); }
  }
  if (e.key === 'Escape') closeDropdown();
});

elSearch.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') {
    const first = elDropdown.querySelector('.dropdown-item');
    if (first) first.focus();
  }
  if (e.key === 'Escape') closeDropdown();
});

document.addEventListener('click', e => {
  if (!elDropdown.contains(e.target) && e.target !== elSearch) closeDropdown();
});

/* ═══════════════════════════════════════════
   POPULAR CHIPS
═══════════════════════════════════════════ */

document.getElementById('popular-chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  selectStation(chip.dataset.id, chip.dataset.name);
});

function updateChips(activeId) {
  document.querySelectorAll('#popular-chips .chip').forEach(c => {
    c.classList.toggle('active', c.dataset.id === activeId);
  });
}

/* ═══════════════════════════════════════════
   SELECT STATION
═══════════════════════════════════════════ */

function selectStation(id, name) {
  state.activeStation = { id, name };
  elSearch.value = name;
  elNavStation.textContent = name;
  elNavBadge.textContent = id;
  elNavBadge.style.display = '';
  updateChips(id);
  saveStation(id, name);
  loadTideData();
}

/* ═══════════════════════════════════════════
   SAVED STATIONS
═══════════════════════════════════════════ */

function saveStation(id, name) {
  const existing = state.savedStations.findIndex(s => s.id === id);
  if (existing !== -1) state.savedStations.splice(existing, 1);
  state.savedStations.unshift({ id, name });
  if (state.savedStations.length > MAX_SAVED) state.savedStations.pop();
  localStorage.setItem('tide_saved_stations', JSON.stringify(state.savedStations));
  renderSaved();
}

function renderSaved() {
  if (!state.savedStations.length) {
    elSavedList.innerHTML = '<p style="font-size: var(--text-xs); color: var(--color-ink-muted);">No stations saved yet.</p>';
    return;
  }
  elSavedList.innerHTML = state.savedStations.map(s =>
    `<div class="saved-item" role="button" tabindex="0" data-id="${esc(s.id)}" data-name="${esc(s.name)}" aria-label="Load ${esc(s.name)}">
      <span class="saved-item-name">${esc(s.name)}</span>
      <span class="saved-item-id">${esc(s.id)}</span>
      <button class="saved-item-del btn-icon" data-del="${esc(s.id)}" title="Remove" aria-label="Remove ${esc(s.name)}">✕</button>
    </div>`
  ).join('');

  elSavedList.querySelectorAll('.saved-item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('[data-del]')) return;
      selectStation(el.dataset.id, el.dataset.name);
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') selectStation(el.dataset.id, el.dataset.name);
    });
  });

  elSavedList.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.del;
      state.savedStations = state.savedStations.filter(s => s.id !== id);
      localStorage.setItem('tide_saved_stations', JSON.stringify(state.savedStations));
      renderSaved();
    });
  });
}

/* ═══════════════════════════════════════════
   LOAD BUTTON
═══════════════════════════════════════════ */

elLoadBtn.addEventListener('click', () => {
  if (!state.activeStation) { toast('Select a station first', 'warn'); return; }
  state.startDate = elDateStart.value;
  state.endDate = elDateEnd.value;
  loadTideData();
});

/* ═══════════════════════════════════════════
   FETCH TIDE DATA (NOAA API)
═══════════════════════════════════════════ */

async function loadTideData() {
  if (!state.activeStation) return;
  state.loading = true;
  showLoading();

  const { id } = state.activeStation;
  const start = state.startDate;
  const end = state.endDate;
  const startNOAA = dateToNOAA(start);
  const endNOAA = dateToNOAA(end);

  const baseParams = `station=${id}&datum=MLLW&time_zone=lst_ldt&units=metric&application=tide_charter_tool&format=json`;
  const hourlyURL = `${NOAA_BASE}/api/prod/datagetter?begin_date=${startNOAA}&end_date=${endNOAA}&product=predictions&interval=h&${baseParams}`;
  const hiloURL   = `${NOAA_BASE}/api/prod/datagetter?begin_date=${startNOAA}&end_date=${endNOAA}&product=predictions&interval=hilo&${baseParams}`;
  const todayNOAA = dateToNOAA(dateToYMD(new Date()));
  const tempURL   = `${NOAA_BASE}/api/prod/datagetter?begin_date=${todayNOAA}&end_date=${todayNOAA}&station=${id}&product=water_temperature&datum=MLLW&time_zone=lst_ldt&units=metric&format=json`;

  try {
    const [hourlyRes, hiloRes, tempRes] = await Promise.all([
      fetch(hourlyURL),
      fetch(hiloURL),
      fetch(tempURL),
    ]);

    const [hourlyData, hiloData, tempData] = await Promise.all([
      hourlyRes.json(),
      hiloRes.json(),
      tempRes.json(),
    ]);

    if (hourlyData.error) throw new Error(hourlyData.error.message || 'NOAA API error');

    state.hourlyPredictions = hourlyData.predictions || [];
    state.hiloPredictions = hiloData.predictions || [];

    // Water temp: get latest reading
    if (tempData.data && tempData.data.length > 0) {
      const recent = tempData.data[tempData.data.length - 1];
      state.waterTemp = parseFloat(recent.v);
    } else {
      state.waterTemp = null;
    }

    renderAll();
    toast(`Loaded ${state.hiloPredictions.length} tide events`, 'success');
  } catch (err) {
    console.error(err);
    toast('Failed to load tide data. Check station or try again.', 'error');
    showError(err.message);
  } finally {
    state.loading = false;
  }
}

/* ═══════════════════════════════════════════
   RENDER ALL
═══════════════════════════════════════════ */

function renderAll() {
  const html = `
    <div id="conditions-section">
      ${renderConditionsHTML()}
    </div>
    <div class="chart-card" id="chart-section">
      <div class="chart-header">
        <span class="chart-title">Tide Chart — ${esc(state.activeStation.name)}</span>
        <div class="chart-legend">
          <span class="legend-item"><span class="legend-dot" style="background: oklch(55% 0.18 230);"></span>High tide</span>
          <span class="legend-item"><span class="legend-dot" style="background: oklch(52% 0.14 155);"></span>Low tide</span>
          <span class="legend-item"><span class="legend-line"></span>Now</span>
        </div>
      </div>
      <div id="tide-svg-wrap">
        <svg id="tide-svg" role="img" aria-label="Tide chart for ${esc(state.activeStation.name)}" height="280">
          <defs>
            <linearGradient id="tideAreaGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="oklch(72% 0.09 220)" stop-opacity="0.4"/>
              <stop offset="100%" stop-color="oklch(72% 0.09 220)" stop-opacity="0.02"/>
            </linearGradient>
          </defs>
          <g id="svg-grid"></g>
          <g id="svg-axes"></g>
          <path id="svg-area" class="svg-tide-area"/>
          <path id="svg-line" class="svg-tide-line"/>
          <g id="svg-dots"></g>
          <line id="svg-now" class="svg-now-line" style="display:none;"/>
          <text id="svg-now-label" class="svg-now-label" style="display:none;">NOW</text>
        </svg>
      </div>
    </div>
    <div class="chart-card" id="table-section">
      <div class="chart-header" style="margin-bottom: var(--space-3);">
        <span class="chart-title">3-Day Tide Table</span>
      </div>
      <div class="tide-table-wrap">
        ${renderTableHTML()}
      </div>
    </div>
  `;

  elMainBody.innerHTML = html;

  // Draw SVG after DOM inserted
  requestAnimationFrame(() => {
    drawSVGChart();
    renderActivities(); // refresh activity suggestions with new data
  });
}

/* ═══════════════════════════════════════════
   CURRENT CONDITIONS
═══════════════════════════════════════════ */

function renderConditionsHTML() {
  const now = new Date();
  const hourly = state.hourlyPredictions;
  if (!hourly.length) return '';

  // Find current interpolated height
  const nowStr = now.toISOString().slice(0, 16).replace('T', ' ');
  let currHeight = null, trend = null, prevH = null, nextH = null;
  for (let i = 0; i < hourly.length - 1; i++) {
    const t0 = new Date(hourly[i].t.replace(' ', 'T'));
    const t1 = new Date(hourly[i+1].t.replace(' ', 'T'));
    if (now >= t0 && now <= t1) {
      const alpha = (now - t0) / (t1 - t0);
      const v0 = parseFloat(hourly[i].v);
      const v1 = parseFloat(hourly[i+1].v);
      currHeight = v0 + alpha * (v1 - v0);
      prevH = v0;
      nextH = v1;
      break;
    }
  }
  if (currHeight === null && hourly.length > 0) {
    currHeight = parseFloat(hourly[0].v);
    prevH = currHeight;
    nextH = currHeight;
  }

  const trendText = nextH > prevH ? 'Rising' : 'Falling';
  const trendClass = nextH > prevH ? 'rising' : 'falling';

  // Next tide event from hilo
  const hilo = state.hiloPredictions;
  let nextEvent = null;
  for (const p of hilo) {
    const t = new Date(p.t.replace(' ', 'T'));
    if (t > now) { nextEvent = p; break; }
  }

  let nextEventText = '—';
  if (nextEvent) {
    const t = new Date(nextEvent.t.replace(' ', 'T'));
    const mins = Math.round((t - now) / 60000);
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    const label = nextEvent.type === 'H' ? 'High' : 'Low';
    nextEventText = `${label} tide in ${h}h ${m}m at ${parseFloat(nextEvent.v).toFixed(2)}m`;
  }

  const cards = [
    {
      label: 'Current Height',
      value: currHeight !== null ? `${currHeight.toFixed(2)}m` : '—',
      sub: 'Water level (MLLW)',
    },
    {
      label: 'Tide Direction',
      value: trendText,
      sub: 'Relative to last hour',
      cls: trendClass,
    },
    {
      label: 'Next Event',
      value: nextEvent ? (nextEvent.type === 'H' ? '▲ High' : '▼ Low') : '—',
      sub: nextEvent ? nextEventText : 'No upcoming events',
    },
    state.waterTemp !== null
      ? { label: 'Water Temp', value: `${state.waterTemp.toFixed(1)}°C`, sub: `${(state.waterTemp * 9/5 + 32).toFixed(1)}°F` }
      : { label: 'Water Temp', value: '—', sub: 'Not available at this station' },
  ];

  return `<div class="conditions-grid">
    ${cards.map(c => `
      <div class="condition-card">
        <div class="condition-label">${esc(c.label)}</div>
        <div class="condition-value${c.cls ? ' ' + c.cls : ''}">${esc(c.value)}</div>
        <div class="condition-sub">${esc(c.sub)}</div>
      </div>
    `).join('')}
  </div>`;
}

/* ═══════════════════════════════════════════
   SVG TIDE CHART
═══════════════════════════════════════════ */

function drawSVGChart() {
  const svgEl = document.getElementById('tide-svg');
  if (!svgEl || !state.hourlyPredictions.length) return;

  const W = svgEl.parentElement.clientWidth || 700;
  const H = 280;
  const PAD = { top: 24, right: 20, bottom: 44, left: 52 };
  const innerW = W - PAD.left - PAD.right;
  const innerH = H - PAD.top - PAD.bottom;

  svgEl.setAttribute('width', W);
  svgEl.setAttribute('height', H);
  svgEl.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const hourly = state.hourlyPredictions;
  const times = hourly.map(p => new Date(p.t.replace(' ', 'T')).getTime());
  const vals  = hourly.map(p => parseFloat(p.v));

  const minT = times[0], maxT = times[times.length - 1];
  const minV = Math.min(...vals) - 0.15;
  const maxV = Math.max(...vals) + 0.15;
  const rangeT = maxT - minT || 1;
  const rangeV = maxV - minV || 1;

  function xS(t)  { return PAD.left + ((t - minT) / rangeT) * innerW; }
  function yS(v)  { return PAD.top + innerH - ((v - minV) / rangeV) * innerH; }

  // Build bezier path
  const pts = hourly.map((p, i) => ({
    x: xS(times[i]),
    y: yS(vals[i]),
  }));

  // SVG path using cubic bezier (smooth)
  let linePath = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const prev = pts[i - 1], curr = pts[i];
    const cpx = (prev.x + curr.x) / 2;
    linePath += ` C ${cpx.toFixed(1)} ${prev.y.toFixed(1)} ${cpx.toFixed(1)} ${curr.y.toFixed(1)} ${curr.x.toFixed(1)} ${curr.y.toFixed(1)}`;
  }

  const areaPath = `M ${pts[0].x.toFixed(1)} ${(PAD.top + innerH).toFixed(1)} L ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`
    + linePath.slice(linePath.indexOf(' '))
    + ` L ${pts[pts.length-1].x.toFixed(1)} ${(PAD.top + innerH).toFixed(1)} Z`;

  document.getElementById('svg-area').setAttribute('d', areaPath);
  document.getElementById('svg-line').setAttribute('d', linePath);

  // Grid & axes
  const gridEl  = document.getElementById('svg-grid');
  const axesEl  = document.getElementById('svg-axes');
  gridEl.innerHTML = '';
  axesEl.innerHTML = '';

  const NS = 'http://www.w3.org/2000/svg';

  // Y axis grid (5 lines)
  const ySteps = 5;
  for (let i = 0; i <= ySteps; i++) {
    const v = minV + (rangeV * i / ySteps);
    const yy = yS(v);
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', PAD.left); line.setAttribute('x2', PAD.left + innerW);
    line.setAttribute('y1', yy.toFixed(1)); line.setAttribute('y2', yy.toFixed(1));
    line.setAttribute('class', 'svg-grid-line');
    gridEl.appendChild(line);

    const txt = document.createElementNS(NS, 'text');
    txt.setAttribute('x', (PAD.left - 6).toString());
    txt.setAttribute('y', (yy + 3.5).toFixed(1));
    txt.setAttribute('text-anchor', 'end');
    txt.setAttribute('class', 'svg-axis-label');
    txt.textContent = v.toFixed(1) + 'm';
    axesEl.appendChild(txt);
  }

  // X axis: day labels
  const start = new Date(state.startDate + 'T00:00:00');
  const end   = new Date(state.endDate + 'T00:00:00');
  const days = Math.round((end - start) / 86400000) + 1;

  for (let d = 0; d < days; d++) {
    const dayDate = new Date(start);
    dayDate.setDate(dayDate.getDate() + d);
    const dayT = dayDate.getTime() + 12 * 3600000; // noon
    const xx = xS(dayT);

    if (xx < PAD.left || xx > PAD.left + innerW) continue;

    const label = dayDate.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
    const txt = document.createElementNS(NS, 'text');
    txt.setAttribute('x', xx.toFixed(1));
    txt.setAttribute('y', (H - PAD.bottom + 14).toString());
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('class', 'svg-axis-label');
    txt.textContent = label;
    axesEl.appendChild(txt);

    // Day separator
    if (d > 0) {
      const midnight = new Date(start);
      midnight.setDate(midnight.getDate() + d);
      const sx = xS(midnight.getTime());
      if (sx > PAD.left) {
        const sep = document.createElementNS(NS, 'line');
        sep.setAttribute('x1', sx.toFixed(1)); sep.setAttribute('x2', sx.toFixed(1));
        sep.setAttribute('y1', PAD.top.toString()); sep.setAttribute('y2', (PAD.top + innerH).toString());
        sep.setAttribute('class', 'svg-day-sep');
        gridEl.appendChild(sep);
      }
    }
  }

  // Hi/Lo dots with labels
  const dotsEl = document.getElementById('svg-dots');
  dotsEl.innerHTML = '';
  const hilo = state.hiloPredictions;

  hilo.forEach(p => {
    const t = new Date(p.t.replace(' ', 'T')).getTime();
    const v = parseFloat(p.v);
    if (t < minT || t > maxT) return;
    const cx = xS(t);
    const cy = yS(v);
    const isHigh = p.type === 'H';

    const circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('cx', cx.toFixed(1));
    circle.setAttribute('cy', cy.toFixed(1));
    circle.setAttribute('r', '5');
    circle.setAttribute('class', isHigh ? 'svg-high-dot' : 'svg-low-dot');
    dotsEl.appendChild(circle);

    // Triangle marker
    const marker = document.createElementNS(NS, 'text');
    marker.setAttribute('x', cx.toFixed(1));
    marker.setAttribute('y', isHigh ? (cy - 12).toFixed(1) : (cy + 20).toFixed(1));
    marker.setAttribute('text-anchor', 'middle');
    marker.setAttribute('class', isHigh ? 'svg-high-label' : 'svg-low-label');
    marker.textContent = `${isHigh ? '▲' : '▼'} ${v.toFixed(2)}m`;
    dotsEl.appendChild(marker);

    // Time label
    const timeTxt = document.createElementNS(NS, 'text');
    timeTxt.setAttribute('x', cx.toFixed(1));
    timeTxt.setAttribute('y', isHigh ? (cy - 22).toFixed(1) : (cy + 30).toFixed(1));
    timeTxt.setAttribute('text-anchor', 'middle');
    timeTxt.setAttribute('class', isHigh ? 'svg-high-label' : 'svg-low-label');
    timeTxt.setAttribute('font-size', '8');
    timeTxt.textContent = fmtDateTime(p.t);
    dotsEl.appendChild(timeTxt);
  });

  // "Now" line
  const nowEl  = document.getElementById('svg-now');
  const nowLbl = document.getElementById('svg-now-label');
  const now = Date.now();
  if (now >= minT && now <= maxT) {
    const nx = xS(now);
    nowEl.setAttribute('x1', nx.toFixed(1)); nowEl.setAttribute('x2', nx.toFixed(1));
    nowEl.setAttribute('y1', PAD.top.toString()); nowEl.setAttribute('y2', (PAD.top + innerH).toString());
    nowEl.style.display = '';
    nowLbl.setAttribute('x', (nx + 4).toFixed(1));
    nowLbl.setAttribute('y', (PAD.top + 10).toString());
    nowLbl.style.display = '';
  } else {
    nowEl.style.display = 'none';
    nowLbl.style.display = 'none';
  }
}

/* ═══════════════════════════════════════════
   3-DAY TIDE TABLE
═══════════════════════════════════════════ */

function renderTableHTML() {
  const hilo = state.hiloPredictions;
  if (!hilo.length) return '<p style="color: var(--color-ink-muted); font-size: var(--text-sm);">No tide events found.</p>';

  // Group by day (only first 3 days)
  const byDay = {};
  hilo.forEach(p => {
    const day = p.t.slice(0, 10);
    if (!byDay[day]) byDay[day] = [];
    byDay[day].push(p);
  });

  const today = dateToYMD(new Date());
  const days = Object.keys(byDay).sort().slice(0, 3);

  // Find global max range for bar scaling
  let maxRange = 0;
  days.forEach(day => {
    const vs = byDay[day].map(p => parseFloat(p.v));
    const r = Math.max(...vs) - Math.min(...vs);
    if (r > maxRange) maxRange = r;
  });

  const rows = days.map(day => {
    const events = byDay[day];
    const highs = events.filter(e => e.type === 'H');
    const lows  = events.filter(e => e.type === 'L');
    const vs = events.map(e => parseFloat(e.v));
    const range = (Math.max(...vs) - Math.min(...vs)).toFixed(2);
    const rangeNum = parseFloat(range);
    const rangeBarPct = maxRange > 0 ? (rangeNum / maxRange) * 100 : 0;
    const rangeClass = rangeNum > 2.5 ? 'large' : rangeNum > 1 ? 'medium' : 'small';
    const ratingLabel = rangeNum > 2.5 ? 'Great' : rangeNum > 1 ? 'Good' : 'Calm';
    const ratingColor = rangeNum > 2.5 ? 'oklch(55% 0.18 230)' : rangeNum > 1 ? 'var(--color-accent)' : 'oklch(62% 0.15 72)';
    const todayCls = day === today ? 'today-row' : '';

    const highPills = highs.map(h =>
      `<span class="tide-pill tide-pill-high">▲ ${parseFloat(h.v).toFixed(2)}m ${fmtDateTime(h.t)}</span>`
    ).join('');
    const lowPills = lows.map(l =>
      `<span class="tide-pill tide-pill-low">▼ ${parseFloat(l.v).toFixed(2)}m ${fmtDateTime(l.t)}</span>`
    ).join('');

    return `<tr class="${todayCls}">
      <td>
        <div class="day-label">${fmtDateShort(day)}${day === today ? ' <span style="color:var(--color-accent);font-size:0.68rem;font-weight:700;">TODAY</span>' : ''}</div>
      </td>
      <td>${highPills || '<span style="color:var(--color-ink-muted)">—</span>'}</td>
      <td>${lowPills || '<span style="color:var(--color-ink-muted)">—</span>'}</td>
      <td>
        <div class="range-bar-wrap">
          <div class="range-bar"><div class="range-bar-fill ${rangeClass}" style="width:${rangeBarPct.toFixed(1)}%"></div></div>
          <span class="range-val">${range}m</span>
        </div>
      </td>
      <td>
        <span class="rating-dot" style="background:${ratingColor};"></span>
        <span style="font-size:var(--text-xs);font-weight:600;color:${ratingColor};">${ratingLabel}</span>
      </td>
    </tr>`;
  }).join('');

  return `<table class="tide-table" aria-label="3-day tide table">
    <thead>
      <tr>
        <th>Day</th>
        <th>High Tides</th>
        <th>Low Tides</th>
        <th>Range</th>
        <th>Conditions</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
}

/* ═══════════════════════════════════════════
   TRIP PLANNER / ACTIVITIES
═══════════════════════════════════════════ */

elAddActBtn.addEventListener('click', addActivity);
elActName.addEventListener('keydown', e => { if (e.key === 'Enter') addActivity(); });

function addActivity() {
  const name = elActName.value.trim();
  if (!name) { toast('Enter an activity name', 'warn'); elActName.focus(); return; }
  const tideType = elActTide.value;
  state.activities.push({ id: Date.now(), name, tideType });
  localStorage.setItem('tide_activities', JSON.stringify(state.activities));
  elActName.value = '';
  renderActivities();
}

function renderActivities() {
  if (!state.activities.length) {
    elActList.innerHTML = '';
    return;
  }

  const hilo = state.hiloPredictions;
  const now = new Date();

  elActList.innerHTML = state.activities.map(act => {
    const suggestions = getActivitySuggestions(act.tideType, hilo, now);
    const badgeClass = act.tideType === 'high' ? 'high' : act.tideType === 'low' ? 'low' : act.tideType === 'rising' ? 'rising' : 'falling';
    const badgeLabel = act.tideType === 'high' ? 'High Tide' : act.tideType === 'low' ? 'Low Tide' : act.tideType === 'rising' ? 'Rising' : 'Falling';

    return `<div class="activity-card" data-id="${act.id}">
      <div class="activity-card-name">
        ${esc(act.name)}
        <span class="activity-badge ${badgeClass}">${esc(badgeLabel)}</span>
        <button class="activity-del" data-del="${act.id}" title="Remove activity" aria-label="Remove ${esc(act.name)}">✕</button>
      </div>
      <div class="activity-times">
        ${suggestions.length
          ? 'Suggested times:<br>' + suggestions.map(s => `• ${esc(s)}`).join('<br>')
          : hilo.length ? 'Load tide data to see suggestions.' : 'Select a station to see suggestions.'}
      </div>
    </div>`;
  }).join('');

  elActList.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.del);
      state.activities = state.activities.filter(a => a.id !== id);
      localStorage.setItem('tide_activities', JSON.stringify(state.activities));
      renderActivities();
    });
  });
}

function getActivitySuggestions(tideType, hilo, now) {
  if (!hilo.length) return [];
  const upcoming = hilo.filter(p => {
    const t = new Date(p.t.replace(' ', 'T'));
    return t >= now;
  }).slice(0, 8);

  const suggestions = [];

  for (const p of upcoming) {
    const t = new Date(p.t.replace(' ', 'T'));
    const label = `${fmtDateFull(p.t.slice(0,10))} at ${fmtDateTime(p.t)} (${parseFloat(p.v).toFixed(2)}m)`;

    if (tideType === 'high' && p.type === 'H') {
      suggestions.push(label);
    } else if (tideType === 'low' && p.type === 'L') {
      suggestions.push(label);
    } else if (tideType === 'rising') {
      // Rising = 2h window before high
      const hiloIdx = hilo.indexOf(p);
      if (p.type === 'H') {
        const prevLow = hilo.slice(0, hiloIdx).reverse().find(x => x.type === 'L');
        if (prevLow) {
          const pt = new Date(prevLow.t.replace(' ', 'T'));
          const window = `${fmtDateTime(prevLow.t)} → ${fmtDateTime(p.t)} (rising window)`;
          if (pt >= now) suggestions.push(window);
        }
      }
    } else if (tideType === 'falling') {
      // Falling = window after high
      const hiloIdx = hilo.indexOf(p);
      if (p.type === 'H') {
        const nextLow = hilo.slice(hiloIdx + 1).find(x => x.type === 'L');
        if (nextLow) {
          const nt = new Date(nextLow.t.replace(' ', 'T'));
          const window = `${fmtDateTime(p.t)} → ${fmtDateTime(nextLow.t)} (falling window)`;
          if (nt >= now) suggestions.push(window);
        }
      }
    }

    if (suggestions.length >= 3) break;
  }

  return suggestions.slice(0, 3);
}

/* ═══════════════════════════════════════════
   LOADING / ERROR STATES
═══════════════════════════════════════════ */

function showLoading() {
  elMainBody.innerHTML = `
    <div class="empty-state">
      <div class="loading-bar">
        <div class="spinner"></div>
        Loading tide data from NOAA for ${esc(state.activeStation?.name || '…')}
      </div>
    </div>
  `;
}

function showError(msg) {
  elMainBody.innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">⚠️</div>
      <div class="empty-title">Could not load tide data</div>
      <div class="empty-sub">${esc(msg || 'Check the station ID or try a different date range.')}</div>
      <button class="btn btn-ghost" onclick="loadTideData()">Try again</button>
    </div>
  `;
}

/* ═══════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════ */

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

   RESIZE CHART
═══════════════════════════════════════════ */

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (state.hourlyPredictions.length) drawSVGChart();
  }, 150);
});

async function init() {
  // Restore saved stations
  renderSaved();
  renderActivities();
  // Load station list in background
  await loadStations();
}

init();

})();
