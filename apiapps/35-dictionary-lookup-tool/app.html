<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexicon — Dictionary Lookup Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · macrostructure: Workbench · theme: Newsprint · nav: N9 */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { height: 100%; overflow-x: clip; }

body {
  height: 100%;
  overflow: hidden;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

/* ── N9 Edge-aligned nav ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 52px;
  background: var(--color-paper);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}

.nav-logo {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--color-ink);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
}
.nav-logo span { color: var(--color-accent); }

.nav-logo-icon {
  width: 28px;
  height: 28px;
  background: var(--color-accent-subtle);
  border: 1px solid var(--color-accent-line);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.nav-sep {
  width: 1px;
  height: 16px;
  background: var(--color-border);
  flex-shrink: 0;
}

.nav-page-label {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  font-weight: 500;
  white-space: nowrap;
}

.nav-back {
  margin-left: auto;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
  transition: color 0.15s var(--ease-out);
}
.nav-back:hover { color: var(--color-ink); }

/* ── App shell ── */
.app-shell {
  display: grid;
  grid-template-columns: 300px 1fr;
  margin-top: 52px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--color-border);
  background: var(--color-paper-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-head {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}

.sidebar-search-wrap {
  position: relative;
}

.sidebar-search-icon {
  position: absolute;
  left: var(--space-3);
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-ink-muted);
  pointer-events: none;
  display: flex;
  align-items: center;
}

#search-input {
  width: 100%;
  padding: var(--space-3) var(--space-8) var(--space-3) var(--space-8);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--color-ink);
  transition: border-color 0.15s ease, box-shadow 0.15s var(--ease-out);
  min-height: 44px;
}
#search-input::placeholder { color: var(--color-ink-muted); }
#search-input:focus {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px oklch(50% 0.16 52 / 0.12);
}

.search-clear-btn {
  position: absolute;
  right: var(--space-3);
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--color-ink-muted);
  cursor: pointer;
  padding: var(--space-1);
  border-radius: var(--radius-sm);
  display: none;
  align-items: center;
  justify-content: center;
  transition: color 0.15s var(--ease-out);
  min-height: 24px;
  min-width: 24px;
}
.search-clear-btn:hover { color: var(--color-ink); }
.search-clear-btn.visible { display: flex; }

.search-btn {
  width: 100%;
  margin-top: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--color-accent);
  color: var(--color-paper);
  border: none;
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  cursor: pointer;
  min-height: 44px;
  transition: opacity 0.15s ease, transform 0.15s var(--ease-out);
}
.search-btn:hover { opacity: 0.88; transform: translateY(-1px); }
.search-btn:active { transform: translateY(0); }

/* Recent searches */
.sidebar-section {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}

.sidebar-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-3);
}

.sidebar-section-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--color-ink-muted);
  border-left: 2px solid var(--color-accent);
  padding-left: var(--space-2);
}

.sidebar-clear-link {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  transition: color 0.15s var(--ease-out);
  font-family: var(--font-body);
}
.sidebar-clear-link:hover { color: var(--color-danger); }

.chip-group {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.history-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-1) var(--space-3);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: 20px;
  font-size: var(--text-xs);
  font-family: var(--font-body);
  color: var(--color-ink);
  cursor: pointer;
  transition: border-color 0.12s ease, background 0.12s var(--ease-out);
  min-height: 28px;
}
.history-chip:hover {
  border-color: var(--color-accent-line);
  background: var(--color-accent-subtle);
  color: var(--color-accent);
}

/* Word list section */
.sidebar-wordlist {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-2) 0;
  display: flex;
  flex-direction: column;
}

.sidebar-wordlist-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-3) var(--space-4);
  flex-shrink: 0;
}

.word-list-items {
  flex: 1;
  overflow-y: auto;
}

.word-list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-2) var(--space-4);
  cursor: pointer;
  transition: background 0.12s var(--ease-out);
  border-left: 2px solid transparent;
  gap: var(--space-2);
  min-height: 44px;
}
.word-list-item:hover {
  background: var(--color-accent-bg);
}
.word-list-item.current {
  background: var(--color-accent-bg);
  border-left-color: var(--color-accent);
}

.word-list-item-name {
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-ink);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.word-list-item-remove {
  background: none;
  border: none;
  color: var(--color-ink-muted);
  cursor: pointer;
  padding: var(--space-1);
  border-radius: var(--radius-sm);
  opacity: 0;
  transition: opacity 0.12s ease, color 0.12s var(--ease-out);
  display: flex;
  align-items: center;
  min-height: 28px;
  min-width: 28px;
  justify-content: center;
}
.word-list-item:hover .word-list-item-remove { opacity: 1; }
.word-list-item-remove:hover { color: var(--color-danger); }

.sidebar-empty {
  padding: var(--space-6) var(--space-4);
  text-align: center;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  line-height: 1.7;
}

/* ── Main panel ── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-paper);
}

/* ── Empty state ── */
.state-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-16);
  text-align: center;
  gap: var(--space-4);
  animation: fade-up 0.3s var(--ease-out);
}

.state-empty-icon {
  width: 80px;
  height: 80px;
  background: var(--color-accent-subtle);
  border: 1px solid var(--color-accent-line);
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-accent);
  margin-bottom: var(--space-2);
}

.state-empty-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
}

.state-empty-sub {
  font-size: var(--text-base);
  color: var(--color-ink-muted);
  max-width: 320px;
  line-height: 1.65;
}

.quick-words {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  justify-content: center;
  margin-top: var(--space-4);
}

.quick-chip {
  display: inline-flex;
  padding: var(--space-2) var(--space-4);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: 20px;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  cursor: pointer;
  transition: all 0.15s var(--ease-out);
  min-height: 36px;
  align-items: center;
}
.quick-chip:hover {
  background: var(--color-accent-subtle);
  border-color: var(--color-accent-line);
  color: var(--color-accent);
  transform: translateY(-1px);
}

/* ── Loading state ── */
.state-loading {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-4);
  animation: fade-up 0.2s var(--ease-out);
}

.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--color-border);
  border-top-color: var(--color-accent);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.state-loading-text {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
}

/* ── Error state ── */
.state-error {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-16);
  text-align: center;
  gap: var(--space-4);
  animation: fade-up 0.3s var(--ease-out);
}

.state-error-icon {
  width: 64px;
  height: 64px;
  background: oklch(55% 0.20 25 / 0.08);
  border: 1px solid oklch(55% 0.20 25 / 0.2);
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-danger);
}

.state-error-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--color-ink);
  letter-spacing: -0.02em;
}

.state-error-sub {
  font-size: var(--text-base);
  color: var(--color-ink-muted);
  max-width: 320px;
  line-height: 1.65;
}

/* ── Result panel ── */
.result-panel {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-8);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
  animation: fade-up 0.3s var(--ease-out);
}

@keyframes fade-up {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Word header */
.word-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-6);
  flex-wrap: wrap;
  padding-bottom: var(--space-6);
  border-bottom: 1px solid var(--color-border);
}

.word-header-left { flex: 1; min-width: 0; }

.word-title {
  font-family: var(--font-display);
  font-size: var(--text-4xl);
  font-weight: 400;
  letter-spacing: -0.03em;
  color: var(--color-ink);
  line-height: 1.1;
  margin-bottom: var(--space-2);
}

.word-phonetics {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-3);
}

.phonetic-text {
  font-size: var(--text-lg);
  color: var(--color-ink-muted);
  font-style: italic;
}

.play-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-accent);
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s var(--ease-out);
  min-height: 32px;
}
.play-btn:hover {
  background: var(--color-accent-subtle);
  border-color: var(--color-accent-line);
}
.play-btn.playing {
  background: var(--color-accent-subtle);
  border-color: var(--color-accent);
}

.word-header-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.btn-save-word {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-ink-muted);
  cursor: pointer;
  transition: all 0.15s var(--ease-out);
  min-height: 36px;
}
.btn-save-word:hover {
  background: var(--color-accent-subtle);
  border-color: var(--color-accent-line);
  color: var(--color-accent);
}
.btn-save-word.saved {
  background: var(--color-accent-subtle);
  border-color: var(--color-accent-line);
  color: var(--color-accent);
}

/* Part of speech sections */
.meanings-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.meaning-block {
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: border-color 0.15s var(--ease-out);
}
.meaning-block:hover { border-color: var(--color-accent-line); }

.meaning-block-head {
  padding: var(--space-3) var(--space-6);
  background: var(--color-paper-2);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.pos-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px var(--space-3);
  background: var(--color-accent-subtle);
  border: 1px solid var(--color-accent-line);
  border-radius: 12px;
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--color-accent);
}

.meaning-block-body {
  padding: var(--space-5) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.definitions-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.definition-item {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 0 var(--space-3);
}

.def-num {
  font-size: var(--text-xs);
  font-weight: 700;
  color: var(--color-accent);
  padding-top: 3px;
  font-variant-numeric: tabular-nums;
}

.def-text {
  font-size: var(--text-base);
  color: var(--color-ink);
  line-height: 1.65;
}

.def-example {
  margin-top: var(--space-2);
  font-style: italic;
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  border-left: 2px solid var(--color-border);
  padding-left: var(--space-3);
  line-height: 1.6;
}

/* Synonyms / Antonyms chips */
.related-words {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding-top: var(--space-2);
  border-top: 1px solid var(--color-border);
}

.related-row {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.related-label {
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.02em;
  flex-shrink: 0;
  padding-top: 3px;
}
.related-label.syn { color: var(--color-success); }
.related-label.ant { color: var(--color-danger); }

.word-chip {
  display: inline-flex;
  align-items: center;
  padding: 2px var(--space-3);
  background: var(--color-paper);
  border: 1px solid var(--color-border);
  border-radius: 12px;
  font-size: var(--text-xs);
  font-family: var(--font-body);
  color: var(--color-ink);
  cursor: pointer;
  transition: all 0.12s var(--ease-out);
  min-height: 24px;
}
.word-chip:hover {
  border-color: var(--color-accent-line);
  background: var(--color-accent-subtle);
  color: var(--color-accent);
}

/* Etymology section */
.etymology-block {
  background: var(--color-paper-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5) var(--space-6);
  display: flex;
  gap: var(--space-4);
  align-items: flex-start;
}

.etymology-icon {
  width: 36px;
  height: 36px;
  background: var(--color-accent-subtle);
  border: 1px solid var(--color-accent-line);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-accent);
  flex-shrink: 0;
}

.etymology-label {
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--color-ink-muted);
  margin-bottom: var(--space-2);
  border-left: 2px solid var(--color-accent);
  padding-left: var(--space-2);
}

.etymology-text {
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
  line-height: 1.75;
}

/* Sources */
.sources-line {
  font-size: var(--text-xs);
  color: var(--color-ink-muted);
  margin-top: var(--space-3);
}
.sources-line a {
  color: var(--color-accent);
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 600;
  background: var(--color-ink);
  color: var(--color-paper);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px var(--color-shadow);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s var(--ease-out), transform 0.2s var(--ease-out);
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--color-success); }
.toast.error   { background: var(--color-danger); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--color-ink-muted); }

/* ── Mobile ── */
@media (max-width: 768px) {
  html, body { overflow: auto; height: auto; }

  .app-shell {
    grid-template-columns: 1fr;
    height: auto;
    overflow: visible;
  }

  .sidebar {
    border-right: none;
    border-bottom: 1px solid var(--color-border);
    overflow: visible;
    max-height: 280px;
  }

  .sidebar-wordlist { display: none; }

  .main { overflow: visible; height: auto; }

  .result-panel { overflow: visible; padding: var(--space-4); }

  .word-title { font-size: var(--text-3xl); }

  .word-header { flex-direction: column; gap: var(--space-4); }

  .meaning-block-body { padding: var(--space-4); }
}

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; border-top-color: var(--color-accent); }
  .state-empty, .state-loading, .state-error, .result-panel { animation: none; }
  .search-btn:hover { transform: none; }
  .quick-chip:hover { transform: none; }
  .toast { transition: opacity 0.1s var(--ease-out); transform: translateY(0); }
}
</style>
</head>
<body>

<!-- N9 Edge-aligned nav -->
<nav class="nav" aria-label="Application navigation">
  <button class="nav-logo" onclick="showState('empty')" aria-label="Lexicon home">
    <div class="nav-logo-icon" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="2" y="2" width="5" height="6" rx="1" fill="currentColor" opacity="0.6"/>
        <rect x="9" y="2" width="5" height="6" rx="1" fill="currentColor"/>
        <rect x="2" y="10" width="12" height="4" rx="1" fill="currentColor" opacity="0.4"/>
      </svg>
    </div>
    Lexi<span>con</span>
  </button>
  <span class="nav-sep" aria-hidden="true"></span>
  <span class="nav-page-label">Dictionary</span>
  <a href="index.html" class="nav-back" aria-label="Back to home page">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
      <path d="M8.5 2.5L4 7l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Home
  </a>
</nav>

<div class="app-shell">

  <!-- ── Sidebar ── -->
  <aside class="sidebar" aria-label="Word search and saved words">

    <!-- Search -->
    <div class="sidebar-head">
      <div class="sidebar-search-wrap">
        <div class="sidebar-search-icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M10 10l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <input
          id="search-input"
          type="search"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="Search any English word…"
          aria-label="Look up a word"
          autofocus
        />
        <button class="search-clear-btn" id="search-clear" aria-label="Clear search">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 2l8 8M10 2L2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <button class="search-btn" id="search-btn">Look up word</button>
    </div>

    <!-- Recent searches -->
    <div class="sidebar-section" id="recent-section">
      <div class="sidebar-section-head">
        <span class="sidebar-section-label">Recent</span>
        <button class="sidebar-clear-link" id="clear-history-btn" aria-label="Clear search history">Clear history</button>
      </div>
      <div class="chip-group" id="recent-chips" aria-label="Recent searches">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Saved word list -->
    <div class="sidebar-wordlist" aria-label="Saved word list">
      <div class="sidebar-wordlist-head">
        <span class="sidebar-section-label">Word List</span>
        <span class="sidebar-section-label" id="saved-count" style="font-weight:400; letter-spacing:0;">0 words</span>
      </div>
      <div class="word-list-items" id="word-list" role="list" aria-label="Saved words">
        <!-- populated by JS -->
      </div>
    </div>

  </aside>

  <!-- ── Main panel ── -->
  <main class="main" id="main" aria-live="polite" aria-atomic="false">

    <!-- Empty state -->
    <div class="state-empty" id="state-empty" role="region" aria-label="Empty state">
      <div class="state-empty-icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <rect x="6" y="8" width="24" height="4" rx="2" fill="currentColor" opacity="0.3"/>
          <rect x="6" y="15" width="16" height="3" rx="1.5" fill="currentColor" opacity="0.5"/>
          <rect x="6" y="21" width="20" height="3" rx="1.5" fill="currentColor" opacity="0.5"/>
          <rect x="6" y="27" width="12" height="3" rx="1.5" fill="currentColor" opacity="0.3"/>
        </svg>
      </div>
      <p class="state-empty-title">Search for any English word</p>
      <p class="state-empty-sub">Definitions, pronunciation, examples, synonyms, antonyms, and etymology — all in one place.</p>
      <div class="quick-words" aria-label="Try these words">
        <button class="quick-chip" onclick="lookupWord('eloquent')">eloquent</button>
        <button class="quick-chip" onclick="lookupWord('ephemeral')">ephemeral</button>
        <button class="quick-chip" onclick="lookupWord('serendipity')">serendipity</button>
        <button class="quick-chip" onclick="lookupWord('mellifluous')">mellifluous</button>
        <button class="quick-chip" onclick="lookupWord('perspicacious')">perspicacious</button>
        <button class="quick-chip" onclick="lookupWord('ubiquitous')">ubiquitous</button>
        <button class="quick-chip" onclick="lookupWord('resilience')">resilience</button>
        <button class="quick-chip" onclick="lookupWord('tenacious')">tenacious</button>
      </div>
    </div>

    <!-- Loading state -->
    <div class="state-loading" id="state-loading" role="status" aria-label="Loading" style="display:none;">
      <div class="spinner" aria-hidden="true"></div>
      <p class="state-loading-text" id="loading-text">Looking up word…</p>
    </div>

    <!-- Error state -->
    <div class="state-error" id="state-error" role="alert" style="display:none;">
      <div class="state-error-icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="11" stroke="currentColor" stroke-width="1.5"/>
          <path d="M14 9v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="14" cy="19" r="1.2" fill="currentColor"/>
        </svg>
      </div>
      <p class="state-error-title" id="error-title">Word not found</p>
      <p class="state-error-sub" id="error-msg">Check the spelling and try again.</p>
    </div>

    <!-- Result panel -->
    <div class="result-panel" id="result-panel" aria-label="Word definition" style="display:none;">
      <!-- populated by JS -->
    </div>

  </main>
</div>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
// ── Constants ──────────────────────────────────────────────────
const API_BASE = 'https://api.dictionaryapi.dev/api/v2/entries/en/';
const MAX_RECENT = 10;
const MAX_DEFS = 8;
const MAX_SYN = 6;
const MAX_ANT = 6;
const SK_RECENT = 'lexicon_recent';
const SK_SAVED  = 'lexicon_saved';

// ── State ──────────────────────────────────────────────────────
let currentWord = '';
let debounceTimer = null;
let audioEl = null;
let toastTimer = null;

// ── Storage helpers ────────────────────────────────────────────
function load(key) {
  try { return JSON.parse(localStorage.getItem(key) || '[]'); }
  catch { return []; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); }
  catch { /* quota exceeded */ }
}

function getRecent() { return load(SK_RECENT); }
function getSaved()  { return load(SK_SAVED); }

function addRecent(word) {
  const list = getRecent().filter(w => w !== word);
  list.unshift(word);
  if (list.length > MAX_RECENT) list.pop();
  save(SK_RECENT, list);
}

function clearRecent() {
  save(SK_RECENT, []);
}

function isSaved(word) { return getSaved().includes(word.toLowerCase()); }

function toggleSaved(word) {
  const w = word.toLowerCase();
  let saved = getSaved();
  if (saved.includes(w)) {
    saved = saved.filter(x => x !== w);
    toast('Removed from word list');
  } else {
    saved.unshift(w);
    toast('Saved to word list', 'success');
  }
  save(SK_SAVED, saved);
  renderWordList();
  // Update save btn if currently displayed word
  updateSaveBtn(w);
}

function removeSaved(word) {
  const saved = getSaved().filter(x => x !== word.toLowerCase());
  save(SK_SAVED, saved);
  renderWordList();
  updateSaveBtn(word);
}

// ── Escape helpers ─────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Toast ──────────────────────────────────────────────────────
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3000);
}

// ── View management ────────────────────────────────────────────
const STATES = ['empty', 'loading', 'error', 'result-panel'];

function showState(name) {
  document.getElementById('state-empty').style.display   = name === 'empty'  ? '' : 'none';
  document.getElementById('state-loading').style.display = name === 'loading' ? '' : 'none';
  document.getElementById('state-error').style.display   = name === 'error'   ? '' : 'none';
  document.getElementById('result-panel').style.display  = name === 'result'  ? '' : 'none';
}

// ── Sidebar rendering ──────────────────────────────────────────
function renderRecent() {
  const list = getRecent();
  const container = document.getElementById('recent-chips');
  const section = document.getElementById('recent-section');

  if (!list.length) {
    section.style.display = 'none';
    return;
  }
  section.style.display = '';
  container.innerHTML = list.map(w => `
    <button class="history-chip" onclick="lookupWord('${esc(w)}')" aria-label="Look up ${esc(w)}">
      ${esc(w)}
    </button>`).join('');
}

function renderWordList() {
  const saved = getSaved();
  const container = document.getElementById('word-list');
  const countEl = document.getElementById('saved-count');

  countEl.textContent = saved.length === 1 ? '1 word' : `${saved.length} words`;

  if (!saved.length) {
    container.innerHTML = '<div class="sidebar-empty">Save words to build<br>your personal word list.</div>';
    return;
  }

  container.innerHTML = saved.map(w => `
    <div class="word-list-item${currentWord === w ? ' current' : ''}"
      role="listitem"
      tabindex="0"
      aria-label="Look up ${esc(w)}"
      onclick="lookupWord('${esc(w)}')"
      onkeydown="if(event.key==='Enter'||event.key===' ')lookupWord('${esc(w)}')">
      <span class="word-list-item-name">${esc(w)}</span>
      <button class="word-list-item-remove"
        aria-label="Remove ${esc(w)} from word list"
        onclick="event.stopPropagation(); removeSaved('${esc(w)}')">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
          <path d="M1.5 1.5l8 8M9.5 1.5l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>`).join('');
}

function updateSaveBtn(word) {
  const btn = document.getElementById('save-word-btn');
  if (!btn || currentWord !== word.toLowerCase()) return;
  const saved = isSaved(word);
  btn.className = 'btn-save-word' + (saved ? ' saved' : '');
  btn.innerHTML = saved
    ? `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 7l3.5 3.5L12 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Saved`
    : `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Save word`;
  btn.setAttribute('aria-pressed', String(saved));
}

// ── Audio ──────────────────────────────────────────────────────
function playAudio(url, btn) {
  if (audioEl) { audioEl.pause(); audioEl = null; }
  audioEl = new Audio(url);
  if (btn) btn.classList.add('playing');
  audioEl.play().catch(() => toast('Audio unavailable for this word', 'error'));
  audioEl.onended = () => { if (btn) btn.classList.remove('playing'); };
  audioEl.onerror = () => {
    toast('Audio unavailable for this word', 'error');
    if (btn) btn.classList.remove('playing');
  };
}

// ── API call ───────────────────────────────────────────────────
async function lookupWord(word) {
  const trimmed = word.trim().toLowerCase();
  if (!trimmed) return;

  currentWord = trimmed;

  // Sync input field
  const input = document.getElementById('search-input');
  input.value = trimmed;
  toggleClear(true);

  showState('loading');
  document.getElementById('loading-text').textContent = `Looking up "${trimmed}"…`;

  try {
    const res = await fetch(API_BASE + encodeURIComponent(trimmed));
    if (res.status === 404) throw Object.assign(new Error('not_found'), { type: 'not_found' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    addRecent(trimmed);
    renderRecent();
    renderResult(data);
    showState('result');
  } catch (err) {
    const notFound = err.type === 'not_found';
    document.getElementById('error-title').textContent = notFound ? 'Word not found' : 'Something went wrong';
    document.getElementById('error-msg').textContent = notFound
      ? `"${trimmed}" isn't in the dictionary. Check the spelling and try again.`
      : 'A network error occurred. Check your connection and try again.';
    showState('error');
  }
}

// ── Result rendering ───────────────────────────────────────────
function renderResult(data) {
  const entry = data[0];
  if (!entry) return;

  const word = entry.word || currentWord;
  const phonetics = entry.phonetics || [];
  const meanings  = entry.meanings  || [];
  const origin    = entry.origin    || '';
  const sourceUrls = entry.sourceUrls || [];

  // Best phonetic text + audio URL
  const phoneticWithText  = phonetics.find(p => p.text  && p.text.trim());
  const phoneticWithAudio = phonetics.find(p => p.audio && p.audio.trim());
  const phonText  = phoneticWithText  ? phoneticWithText.text   : '';
  const audioUrl  = phoneticWithAudio ? phoneticWithAudio.audio : '';

  const saved = isSaved(word);

  const panel = document.getElementById('result-panel');
  panel.innerHTML = `
    <div class="word-header">
      <div class="word-header-left">
        <h1 class="word-title">${esc(word)}</h1>
        <div class="word-phonetics">
          ${phonText ? `<span class="phonetic-text">${esc(phonText)}</span>` : ''}
          ${audioUrl ? `
            <button class="play-btn" id="play-btn"
              onclick="playAudio('${esc(audioUrl)}', this)"
              aria-label="Play pronunciation of ${esc(word)}">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                <path d="M3 2.5l7 4-7 4V2.5z" fill="currentColor"/>
              </svg>
              Listen
            </button>` : ''}
        </div>
      </div>
      <div class="word-header-actions">
        <button class="btn-save-word${saved ? ' saved' : ''}" id="save-word-btn"
          aria-pressed="${saved}"
          onclick="toggleSaved('${esc(word)}')">
          ${saved
            ? `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 7l3.5 3.5L12 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Saved`
            : `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Save word`
          }
        </button>
      </div>
    </div>

    <div class="meanings-list">
      ${meanings.map(m => renderMeaning(m)).join('')}
    </div>

    ${(origin || sourceUrls.length) ? renderEtymology(origin, sourceUrls) : ''}
  `;

  // Scroll to top
  panel.scrollTop = 0;
}

function renderMeaning(meaning) {
  const { partOfSpeech, definitions = [], synonyms = [], antonyms = [] } = meaning;

  // Collect synonyms/antonyms from definition level too
  const allSyn = [...new Set([
    ...synonyms,
    ...definitions.flatMap(d => d.synonyms || [])
  ])].slice(0, MAX_SYN);
  const allAnt = [...new Set([
    ...antonyms,
    ...definitions.flatMap(d => d.antonyms || [])
  ])].slice(0, MAX_ANT);

  const defs = definitions.slice(0, MAX_DEFS);

  return `
    <div class="meaning-block">
      <div class="meaning-block-head">
        <span class="pos-badge">${esc(partOfSpeech)}</span>
      </div>
      <div class="meaning-block-body">
        <ol class="definitions-list" aria-label="${esc(partOfSpeech)} definitions">
          ${defs.map((def, i) => `
            <li class="definition-item">
              <span class="def-num" aria-hidden="true">${i + 1}.</span>
              <div>
                <p class="def-text">${esc(def.definition)}</p>
                ${def.example ? `<p class="def-example">"${esc(def.example)}"</p>` : ''}
              </div>
            </li>`).join('')}
        </ol>
        ${(allSyn.length || allAnt.length) ? `
          <div class="related-words">
            ${allSyn.length ? `
              <div class="related-row">
                <span class="related-label syn">Synonyms</span>
                ${allSyn.map(s => `
                  <button class="word-chip" onclick="lookupWord('${esc(s)}')" aria-label="Look up synonym: ${esc(s)}">${esc(s)}</button>`).join('')}
              </div>` : ''}
            ${allAnt.length ? `
              <div class="related-row">
                <span class="related-label ant">Antonyms</span>
                ${allAnt.map(a => `
                  <button class="word-chip" onclick="lookupWord('${esc(a)}')" aria-label="Look up antonym: ${esc(a)}">${esc(a)}</button>`).join('')}
              </div>` : ''}
          </div>` : ''}
      </div>
    </div>`;
}

function renderEtymology(origin, sourceUrls) {
  return `
    <div class="etymology-block">
      <div class="etymology-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M4 14V5a2 2 0 012-2h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M4 14a2 2 0 002 2h8V5H6a2 2 0 00-2 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 9h4M8 12h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <p class="etymology-label">Etymology &amp; Origin</p>
        ${origin
          ? `<p class="etymology-text">${esc(origin)}</p>`
          : `<p class="etymology-text" style="font-style:italic;">No etymology information available for this word.</p>`}
        ${sourceUrls.length ? `
          <p class="sources-line">
            Source: ${sourceUrls.slice(0,2).map(url =>
              `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url.replace(/^https?:\/\//, ''))}</a>`
            ).join(', ')}
          </p>` : ''}
      </div>
    </div>`;
}

// ── Search input wiring ────────────────────────────────────────
function toggleClear(show) {
  const btn = document.getElementById('search-clear');
  btn.classList.toggle('visible', show);
}

const searchInput = document.getElementById('search-input');
const searchBtn   = document.getElementById('search-btn');
const clearBtn    = document.getElementById('search-clear');
const clearHistBtn = document.getElementById('clear-history-btn');

searchInput.addEventListener('input', () => {
  const val = searchInput.value.trim();
  toggleClear(val.length > 0);

  // Debounced lookup after 2+ chars
  clearTimeout(debounceTimer);
  if (val.length >= 2) {
    debounceTimer = setTimeout(() => {
      lookupWord(val);
    }, 300);
  }
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    clearTimeout(debounceTimer);
    const val = searchInput.value.trim();
    if (val) lookupWord(val);
  }
});

searchBtn.addEventListener('click', () => {
  clearTimeout(debounceTimer);
  const val = searchInput.value.trim();
  if (val) lookupWord(val);
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  toggleClear(false);
  searchInput.focus();
  showState('empty');
  currentWord = '';
});

clearHistBtn.addEventListener('click', () => {
  clearRecent();
  renderRecent();
  toast('History cleared');
});

// Close clear button if input is empty on focus
searchInput.addEventListener('focus', () => {
  toggleClear(searchInput.value.trim().length > 0);
});

// ── Init ───────────────────────────────────────────────────────
renderRecent();
renderWordList();
showState('empty');

// Check URL hash for pre-lookup
(function checkHash() {
  const hash = window.location.hash.slice(1);
  if (hash) lookupWord(decodeURIComponent(hash));
})();
</script>
</body>
</html>
