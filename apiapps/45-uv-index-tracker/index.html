<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UV Index Tracker — Outdoor Safety Monitor</title>
  <style>
    :root {
      --bg: #02091a;
      --surface: rgba(255,255,255,0.08);
      --surface2: rgba(255,255,255,0.13);
      --border: rgba(255,255,255,0.16);
      --accent: #38bdf8;
      --accent2: #fb923c;
      --text: rgba(255,255,255,0.95);
      --muted: rgba(255,255,255,0.5);
      --green: #34d399;
      --yellow: #fbbf24;
      --radius: 20px;

      --uv-low: #34d399;
      --uv-moderate: #fbbf24;
      --uv-high: #fb923c;
      --uv-very-high: #fb923c;
      --uv-extreme: #b44fff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    header p {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* ── Main layout ── */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    /* ── Search bar ── */
    .search-section {
      margin-bottom: 1.5rem;
    }

    .search-row {
      display: flex;
      gap: 0.5rem;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
    }

    .search-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    input[type="text"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.7rem 0.9rem 0.7rem 2.5rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    input[type="text"]::placeholder { color: var(--muted); }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0.7rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, opacity 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .btn:hover { background: #7d75ff; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: var(--border); }

    /* Suggestions dropdown */
    .suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      z-index: 200;
      overflow: hidden;
      display: none;
    }

    .suggestions.visible { display: block; }

    .suggestion-item {
      padding: 0.65rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover, .suggestion-item:focus { background: var(--surface2); outline: none; }
    .suggestion-item .country { color: var(--muted); font-size: 0.8rem; margin-left: 0.4rem; }

    /* Skin type selector */
    .skin-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }

    .skin-label {
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .skin-options {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .skin-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .skin-btn:hover { border-color: var(--accent); color: var(--text); }
    .skin-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    /* ── Error / status banner ── */
    .status-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
      display: none;
    }

    .status-banner.visible { display: flex; }
    .status-banner.error { border-color: var(--accent2); color: var(--accent2); }
    .status-banner.loading { border-color: var(--accent); color: var(--accent); }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    /* ── Content grid ── */
    .content { display: none; }
    .content.visible { display: block; }

    .top-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 640px) {
      .top-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }

    .card-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    /* ── UV Gauge ── */
    .gauge-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .gauge-wrap {
      position: relative;
      width: 180px;
      height: 100px;
      overflow: visible;
    }

    .gauge-bg {
      fill: none;
      stroke: var(--surface2);
      stroke-width: 14;
      stroke-linecap: round;
    }

    .gauge-arc {
      fill: none;
      stroke-width: 14;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.6s;
    }

    .gauge-value {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1;
      transition: color 0.5s;
    }

    .gauge-label {
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      transition: color 0.4s;
    }

    .gauge-desc {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }

    /* ── Recommendation card ── */
    .rec-card .rec-item {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.87rem;
    }

    .rec-card .rec-item:last-child { border-bottom: none; }

    .rec-icon {
      font-size: 1.1rem;
      flex-shrink: 0;
      margin-top: 0.05rem;
    }

    .rec-text strong { color: var(--text); font-weight: 600; }
    .rec-text span { color: var(--muted); }

    /* ── Safe Exposure ── */
    .exposure-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
    }

    .exposure-item {
      background: var(--surface2);
      border-radius: 8px;
      padding: 0.65rem;
      text-align: center;
    }

    .exposure-item .time {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--green);
    }

    .exposure-item .type {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    /* ── Hourly chart ── */
    .chart-card {
      margin-bottom: 1rem;
    }

    .chart-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .chart-scroll::-webkit-scrollbar { height: 4px; }
    .chart-scroll::-webkit-scrollbar-track { background: var(--surface2); border-radius: 2px; }
    .chart-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    svg.hour-chart {
      display: block;
      overflow: visible;
    }

    /* ── 3-day forecast ── */
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .forecast-day {
      background: var(--surface2);
      border-radius: 8px;
      padding: 0.9rem;
      text-align: center;
      border: 1px solid transparent;
      transition: border-color 0.2s, transform 0.2s;
    }

    .forecast-day:hover { border-color: var(--accent); transform: translateY(-2px); }

    .forecast-day .day-name {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }

    .forecast-day .day-uv {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 0.3rem;
    }

    .forecast-day .day-level {
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* ── Threshold alert ── */
    .alert-card {
      margin-bottom: 1rem;
    }

    .alert-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .alert-row label {
      font-size: 0.87rem;
      color: var(--muted);
      white-space: nowrap;
    }

    input[type="range"] {
      flex: 1;
      min-width: 120px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .threshold-val {
      font-size: 1rem;
      font-weight: 700;
      min-width: 24px;
      text-align: center;
    }

    .alert-status {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .alert-status.triggered {
      display: block;
      background: rgba(251,146,60, 0.15);
      border: 1px solid var(--accent2);
      color: var(--accent2);
      animation: pulse 2s ease-in-out infinite;
    }

    .alert-status.safe {
      display: block;
      background: rgba(67, 217, 173, 0.1);
      border: 1px solid var(--green);
      color: var(--green);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* ── Alert log ── */
    .log-card { margin-bottom: 1rem; }

    .log-list {
      list-style: none;
      max-height: 180px;
      overflow-y: auto;
    }

    .log-list::-webkit-scrollbar { width: 4px; }
    .log-list::-webkit-scrollbar-track { background: var(--surface2); }
    .log-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .log-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
    }

    .log-item:last-child { border-bottom: none; }

    .log-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .log-empty {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 1rem;
    }

    /* ── Fade in animation ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeIn 0.4s ease both; }

    /* ── Utility ── */
    .section-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    .location-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .location-coords {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    /* ── Weather design system v2 ── */
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(180deg, #02091a 0%, #0d1f3c 50%, #153050 100%) fixed;
  min-height: 100vh;
  color: rgba(255,255,255,0.9);
}
body::before {
  content: '';
  position: fixed;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(56,189,248,.12) 0%, transparent 70%);
  top: -150px; right: -100px;
  animation: floatOrb 10s ease-in-out infinite;
  pointer-events: none; z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  width: 320px; height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(251,146,60,.08) 0%, transparent 70%);
  bottom: 8%; left: -80px;
  animation: floatOrb 14s ease-in-out infinite reverse;
  pointer-events: none; z-index: 0;
}
.card,[class*="card"],[class*="widget"],[class*="panel"],[class*="result"] {
  background: rgba(255,255,255,0.08) !important;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.18) !important;
  border-radius: 20px !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 8px 32px rgba(0,0,0,0.3);
}
h1 {
  font-weight: 200;
  font-size: clamp(2.5rem, 7vw, 5rem);
  letter-spacing: -.02em;
  color: rgba(255,255,255,0.95);
  text-shadow: 0 0 30px rgba(56,189,248,.4);
  -webkit-text-fill-color: rgba(255,255,255,0.95);
}
h2, h3 { font-weight: 300; color: rgba(255,255,255,0.85); -webkit-text-fill-color: rgba(255,255,255,0.85); }
p, label, span, td, th, li { color: rgba(255,255,255,0.8); }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
@keyframes floatOrb { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-22px) scale(1.04);} }
@keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
@keyframes alertPulse { 0%,100%{box-shadow:0 0 0 0 rgba(251,146,60,.5);} 50%{box-shadow:0 0 0 8px rgba(251,146,60,0);} }
.card,[class*="card"],[class*="widget"],[class*="panel"],[class*="result"] { animation: fadeUp .5s ease both; }
.card:nth-child(2){animation-delay:.08s} .card:nth-child(3){animation-delay:.16s} .card:nth-child(4){animation-delay:.24s}
[class*="alert"],[class*="warning"] { animation: alertPulse 2s ease-in-out infinite; }
button,[class*="btn"] {
  background: rgba(255,255,255,0.1) !important;
  border: 1px solid rgba(255,255,255,0.22) !important;
  backdrop-filter: blur(8px);
  color: rgba(255,255,255,0.9) !important;
  transition: all .2s;
  border-radius: 12px;
}
button:hover,[class*="btn"]:hover {
  background: rgba(56,189,248,0.2) !important;
  border-color: rgba(56,189,248,0.5) !important;
  box-shadow: 0 4px 20px rgba(56,189,248,.3);
  transform: translateY(-1px);
}
input, select {
  background: rgba(255,255,255,0.08) !important;
  border: 1px solid rgba(255,255,255,0.16) !important;
  color: rgba(255,255,255,0.9) !important;
}
input::placeholder { color: rgba(255,255,255,0.4); }
input:focus, select:focus {
  border-color: rgba(56,189,248,.6) !important;
  box-shadow: 0 0 0 3px rgba(56,189,248,.2);
  outline: none;
}
select option { background: #0d1f3c; color: white; }
  </style>
</head>
<body>

<header>
  <div class="logo-icon" aria-hidden="true">☀️</div>
  <div>
    <h1>UV Index Tracker</h1>
    <p>Outdoor safety monitor for field crews</p>
  </div>
</header>

<main>

  <!-- Search section -->
  <section class="search-section" aria-label="Location search">
    <div class="search-row">
      <div class="search-input-wrap">
        <span class="search-icon" aria-hidden="true">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        <input
          id="city-input"
          type="text"
          placeholder="Search city or job site location…"
          autocomplete="off"
          aria-label="City search"
          aria-autocomplete="list"
          aria-controls="suggestions-list"
        />
        <div class="suggestions" id="suggestions-list" role="listbox" aria-label="Location suggestions"></div>
      </div>
      <button class="btn" id="search-btn" aria-label="Search UV data">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        Get UV
      </button>
      <button class="btn btn-secondary" id="locate-btn" title="Use my location" aria-label="Use current location">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/>
        </svg>
      </button>
    </div>
    <div class="skin-row">
      <span class="skin-label">Skin type:</span>
      <div class="skin-options" role="group" aria-label="Select skin type">
        <button class="skin-btn active" data-skin="1" aria-pressed="true">Type I–II</button>
        <button class="skin-btn" data-skin="2" aria-pressed="false">Type III–IV</button>
        <button class="skin-btn" data-skin="3" aria-pressed="false">Type V–VI</button>
      </div>
    </div>
  </section>

  <!-- Status banner -->
  <div class="status-banner" id="status-banner" role="status" aria-live="polite">
    <span id="status-icon"></span>
    <span id="status-text"></span>
  </div>

  <!-- Main content -->
  <div class="content" id="content" aria-live="polite">

    <!-- Location info row -->
    <div style="margin-bottom:1rem" class="fade-in">
      <div class="location-name" id="location-name"></div>
      <div class="location-coords" id="location-coords"></div>
    </div>

    <!-- Top grid: gauge + recommendation -->
    <div class="top-grid">

      <!-- UV Gauge -->
      <div class="card gauge-card fade-in" aria-label="Current UV index gauge">
        <div class="card-title">Current UV Index</div>
        <div class="gauge-wrap">
          <svg viewBox="0 0 180 100" width="180" height="100" role="img" aria-label="UV gauge arc">
            <!-- half-circle arc: radius=80, center=(90,90) -->
            <!-- total arc = π*80 ≈ 251.3 -->
            <path
              class="gauge-bg"
              d="M 10 90 A 80 80 0 0 1 170 90"
            />
            <path
              class="gauge-arc"
              id="gauge-arc"
              d="M 10 90 A 80 80 0 0 1 170 90"
              stroke-dasharray="251.3"
              stroke-dashoffset="251.3"
              stroke="var(--uv-low)"
            />
          </svg>
          <div class="gauge-value" id="gauge-value" style="color: var(--uv-low)">—</div>
        </div>
        <div class="gauge-label" id="gauge-label">—</div>
        <div class="gauge-desc" id="gauge-updated"></div>
      </div>

      <!-- Sunscreen recommendation -->
      <div class="card rec-card fade-in" aria-label="Safety recommendations">
        <div class="card-title">Safety Recommendations</div>
        <div id="rec-list"></div>
      </div>

    </div>

    <!-- Safe exposure times -->
    <div class="card fade-in" style="margin-bottom:1rem">
      <div class="card-title">Safe Exposure Times (with SPF 30)</div>
      <div class="exposure-grid" id="exposure-grid"></div>
    </div>

    <!-- Threshold alert -->
    <div class="card alert-card fade-in">
      <div class="card-title">Alert Threshold</div>
      <div class="alert-row">
        <label for="threshold-range">Trigger alert when UV ≥</label>
        <input type="range" id="threshold-range" min="1" max="11" value="6" aria-label="UV alert threshold" />
        <span class="threshold-val" id="threshold-val">6</span>
      </div>
      <div class="alert-status" id="alert-status"></div>
    </div>

    <!-- Hourly UV chart -->
    <div class="card chart-card fade-in">
      <div class="card-title">Hourly UV Forecast — Today</div>
      <div class="chart-scroll">
        <svg id="hour-chart" class="hour-chart"></svg>
      </div>
    </div>

    <!-- 3-day forecast -->
    <div class="card fade-in" style="margin-bottom:1rem">
      <div class="card-title">3-Day UV Forecast</div>
      <div class="forecast-grid" id="forecast-grid"></div>
    </div>

    <!-- Alert log -->
    <div class="card log-card fade-in">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>Alert Log</span>
        <button class="btn btn-secondary" id="clear-log-btn" style="font-size:0.75rem;padding:0.3rem 0.7rem">Clear</button>
      </div>
      <ul class="log-list" id="alert-log" aria-label="Alert history log"></ul>
    </div>

  </div><!-- /content -->

</main>

<footer>
  <p>Data from <a href="https://open-meteo.com" target="_blank" rel="noopener" style="color:var(--accent)">Open-Meteo</a> · Free, no API key required</p>
</footer>

<script>
(function () {
  'use strict';

  /* ── Constants ── */
  const GEO_URL  = `https://geocoding-api.open-meteo.com/v1/search`;
  const UV_URL   = `https://api.open-meteo.com/v1/forecast`;
  const ARC_LEN  = 251.3;
  const MAX_UV   = 12;

  /* ── State ── */
  let currentUV     = null;
  let currentThresh = 6;
  let skinType      = 1;
  let alertLog      = JSON.parse(localStorage.getItem('uv-alert-log') || '[]');
  let geoTimer      = null;

  /* ── DOM refs ── */
  const cityInput     = document.getElementById('city-input');
  const searchBtn     = document.getElementById('search-btn');
  const locateBtn     = document.getElementById('locate-btn');
  const sugList       = document.getElementById('suggestions-list');
  const statusBanner  = document.getElementById('status-banner');
  const statusIcon    = document.getElementById('status-icon');
  const statusText    = document.getElementById('status-text');
  const content       = document.getElementById('content');
  const locationName  = document.getElementById('location-name');
  const locationCoord = document.getElementById('location-coords');
  const gaugeArc      = document.getElementById('gauge-arc');
  const gaugeValue    = document.getElementById('gauge-value');
  const gaugeLabel    = document.getElementById('gauge-label');
  const gaugeUpdated  = document.getElementById('gauge-updated');
  const recList       = document.getElementById('rec-list');
  const exposureGrid  = document.getElementById('exposure-grid');
  const threshRange   = document.getElementById('threshold-range');
  const threshVal     = document.getElementById('threshold-val');
  const alertStatus   = document.getElementById('alert-status');
  const hourChart     = document.getElementById('hour-chart');
  const forecastGrid  = document.getElementById('forecast-grid');
  const alertLogEl    = document.getElementById('alert-log');
  const clearLogBtn   = document.getElementById('clear-log-btn');

  /* ── UV category helpers ── */
  function uvCategory(uv) {
    if (uv < 3)  return { label: 'Low',       color: 'var(--uv-low)',       spf: 'None required',    icon: '🟢' };
    if (uv < 6)  return { label: 'Moderate',  color: 'var(--uv-moderate)',  spf: 'SPF 15+',          icon: '🟡' };
    if (uv < 8)  return { label: 'High',      color: 'var(--uv-high)',      spf: 'SPF 30+',          icon: '🟠' };
    if (uv < 11) return { label: 'Very High', color: 'var(--uv-very-high)', spf: 'SPF 50+',          icon: '🔴' };
    return            { label: 'Extreme',    color: 'var(--uv-extreme)',   spf: 'SPF 50+ essential', icon: '🟣' };
  }

  /* safe exposure minutes by skin type & UV (Fitzpatrick) */
  function safeMinutes(uv, skin) {
    if (!uv || uv <= 0) return null;
    const base = skin === 1 ? 10 : skin === 2 ? 20 : 40; // minutes at UV 1
    const mins = Math.round((base * 2.5) / uv * 10) / 10;
    return Math.max(mins, 1);
  }

  /* ── Status banner ── */
  function showStatus(msg, type) {
    statusBanner.className = `status-banner visible ${type}`;
    if (type === 'loading') {
      statusIcon.innerHTML = `<div class="spinner"></div>`;
    } else if (type === 'error') {
      statusIcon.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
    } else {
      statusIcon.innerHTML = '';
    }
    statusText.textContent = msg;
  }

  function hideStatus() {
    statusBanner.className = 'status-banner';
  }

  /* ── Geocoding / search ── */
  async function searchCity(query) {
    const res  = await fetch(`${GEO_URL}?name=${encodeURIComponent(query)}&count=6&language=en&format=json`);
    if (!res.ok) throw new Error(`Geocoding failed (${res.status})`);
    const data = await res.json();
    return data.results || [];
  }

  function showSuggestions(results) {
    if (!results.length) {
      sugList.classList.remove('visible');
      return;
    }
    sugList.innerHTML = results.map((r, i) => {
      const label = [r.name, r.admin1, r.country].filter(Boolean).join(', ');
      return `<div class="suggestion-item" role="option" tabindex="0" data-idx="${i}" data-lat="${r.latitude}" data-lon="${r.longitude}" data-name="${encodeURIComponent(label)}">${r.name}<span class="country">${[r.admin1, r.country].filter(Boolean).join(', ')}</span></div>`;
    }).join('');
    sugList.classList.add('visible');

    sugList.querySelectorAll('.suggestion-item').forEach(el => {
      el.addEventListener('click', () => pickSuggestion(el));
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickSuggestion(el); }
      });
    });
  }

  function pickSuggestion(el) {
    const lat  = parseFloat(el.dataset.lat);
    const lon  = parseFloat(el.dataset.lon);
    const name = decodeURIComponent(el.dataset.name);
    cityInput.value = name;
    sugList.classList.remove('visible');
    fetchUV(lat, lon, name);
  }

  cityInput.addEventListener('input', () => {
    clearTimeout(geoTimer);
    const q = cityInput.value.trim();
    if (q.length < 2) { sugList.classList.remove('visible'); return; }
    geoTimer = setTimeout(async () => {
      try {
        const results = await searchCity(q);
        showSuggestions(results);
      } catch (_) { /* silent */ }
    }, 350);
  });

  cityInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') sugList.classList.remove('visible');
    if (e.key === 'Enter') {
      sugList.classList.remove('visible');
      const q = cityInput.value.trim();
      if (q) triggerSearch();
    }
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.search-input-wrap')) sugList.classList.remove('visible');
  });

  searchBtn.addEventListener('click', triggerSearch);

  async function triggerSearch() {
    const q = cityInput.value.trim();
    if (!q) { showStatus('Please enter a city or location name.', 'error'); return; }
    showStatus(`Searching for "${q}"…`, 'loading');
    searchBtn.disabled = true;
    try {
      const results = await searchCity(q);
      if (!results.length) { showStatus(`No results found for "${q}". Try another city name.`, 'error'); return; }
      const r     = results[0];
      const label = [r.name, r.admin1, r.country].filter(Boolean).join(', ');
      cityInput.value = label;
      sugList.classList.remove('visible');
      await fetchUV(r.latitude, r.longitude, label);
    } catch (err) {
      showStatus(`Error: ${err.message}`, 'error');
    } finally {
      searchBtn.disabled = false;
    }
  }

  /* ── Geolocation ── */
  locateBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      showStatus('Geolocation is not supported by your browser.', 'error');
      return;
    }
    showStatus('Getting your location…', 'loading');
    locateBtn.disabled = true;
    navigator.geolocation.getCurrentPosition(
      async pos => {
        try {
          const { latitude: lat, longitude: lon } = pos.coords;
          const label = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
          cityInput.value = label;
          await fetchUV(lat, lon, 'Your Location');
        } catch (err) {
          showStatus(`Error: ${err.message}`, 'error');
        } finally {
          locateBtn.disabled = false;
        }
      },
      err => {
        locateBtn.disabled = false;
        showStatus(`Location error: ${err.message}`, 'error');
      },
      { timeout: 10000 }
    );
  });

  /* ── Fetch UV data ── */
  async function fetchUV(lat, lon, name) {
    showStatus('Fetching UV data…', 'loading');
    content.classList.remove('visible');
    searchBtn.disabled = true;
    try {
      const params = new URLSearchParams({
        latitude: lat,
        longitude: lon,
        hourly: 'uv_index',
        daily: 'uv_index_max',
        forecast_days: 3,
        timezone: 'auto'
      });
      const res  = await fetch(`${UV_URL}?${params}`);
      if (!res.ok) throw new Error(`API error ${res.status}`);
      const data = await res.json();
      renderAll(lat, lon, name, data);
      hideStatus();
    } catch (err) {
      showStatus(`Failed to load UV data: ${err.message}`, 'error');
    } finally {
      searchBtn.disabled = false;
    }
  }

  /* ── Render everything ── */
  function renderAll(lat, lon, name, data) {
    const now       = new Date();
    const hourNow   = now.getHours();
    const hourly    = data.hourly;
    const daily     = data.daily;

    /* find current UV from hourly (today's hours) */
    const todayHourly = hourly.time.map((t, i) => ({ t, uv: hourly.uv_index[i] }))
      .filter(h => h.t.startsWith(data.daily.time[0]));

    const nearestHour = todayHourly.reduce((best, h) => {
      const hh = parseInt(h.t.split('T')[1].split(':')[0], 10);
      return Math.abs(hh - hourNow) < Math.abs(parseInt(best.t.split('T')[1].split(':')[0], 10) - hourNow) ? h : best;
    }, todayHourly[0] || { uv: 0, t: '' });

    currentUV = Math.round((nearestHour.uv || 0) * 10) / 10;
    const cat = uvCategory(currentUV);

    /* ── Location ── */
    locationName.textContent  = name;
    locationCoord.textContent = `${lat.toFixed(4)}° N, ${lon.toFixed(4)}° E · Updated ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

    /* ── Gauge ── */
    const fraction  = Math.min(currentUV / MAX_UV, 1);
    const dashOffset = ARC_LEN * (1 - fraction);
    gaugeArc.style.strokeDashoffset = dashOffset;
    gaugeArc.style.stroke           = cat.color;
    gaugeValue.textContent          = currentUV.toFixed(1);
    gaugeValue.style.color          = cat.color;
    gaugeLabel.textContent          = cat.label;
    gaugeLabel.style.color          = cat.color;
    gaugeUpdated.textContent        = `Today at ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

    /* ── Recommendations ── */
    const recs = buildRecs(currentUV, skinType);
    recList.innerHTML = recs.map(r =>
      `<div class="rec-item"><span class="rec-icon">${r.icon}</span><div class="rec-text"><strong>${r.title}</strong><br><span>${r.detail}</span></div></div>`
    ).join('');

    /* ── Safe exposure ── */
    const baseMin = safeMinutes(currentUV, skinType);
    const spfMult = [1, 2, 5]; // none, SPF15, SPF30 multiplier approx
    const spfLabels = ['No SPF', 'SPF 15', 'SPF 30'];
    exposureGrid.innerHTML = spfMult.map((m, i) => {
      const mins = baseMin ? Math.round(baseMin * m) : null;
      const display = mins ? (mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`) : 'N/A';
      return `<div class="exposure-item"><div class="time">${display}</div><div class="type">${spfLabels[i]}</div></div>`;
    }).join('');

    /* ── Threshold check ── */
    updateAlertStatus();

    /* ── Hourly chart ── */
    renderHourlyChart(todayHourly, hourNow);

    /* ── 3-day forecast ── */
    renderForecast(daily);

    /* ── Alert log ── */
    renderLog();

    content.classList.add('visible');
  }

  /* ── Build recommendations ── */
  function buildRecs(uv, skin) {
    const cat = uvCategory(uv);
    const recs = [];

    if (uv < 3) {
      recs.push({ icon: '✅', title: 'No protection needed', detail: 'UV is low. Safe to work outdoors without special precautions.' });
    } else if (uv < 6) {
      recs.push({ icon: '🧴', title: `Apply ${cat.spf}`, detail: 'Reapply every 2 hours and after sweating.' });
      recs.push({ icon: '😎', title: 'Wear sunglasses', detail: 'UV-protective wraparound lenses recommended.' });
    } else if (uv < 8) {
      recs.push({ icon: '🧴', title: `Apply ${cat.spf}`, detail: 'Reapply every 90 minutes on the job site.' });
      recs.push({ icon: '👒', title: 'Wide-brim hat required', detail: 'Protect neck, face, and ears from direct exposure.' });
      recs.push({ icon: '⏱️', title: '30-min shade breaks', detail: 'Schedule breaks every 90 minutes in shade.' });
    } else if (uv < 11) {
      recs.push({ icon: '🧴', title: `Apply ${cat.spf}`, detail: 'Reapply every 60 minutes. Cover all exposed skin.' });
      recs.push({ icon: '👕', title: 'UPF 50+ clothing', detail: 'Long sleeves and full-cover gear strongly advised.' });
      recs.push({ icon: '⏱️', title: '20-min breaks in shade', detail: 'Schedule frequent breaks; avoid midday sun (10am–2pm).' });
      recs.push({ icon: '💧', title: 'Increase water intake', detail: 'Heat stress risk. 250ml water every 20 minutes.' });
    } else {
      recs.push({ icon: '🚨', title: `${cat.spf} — no exceptions`, detail: 'Extreme UV. Apply on all skin; reapply every 45 minutes.' });
      recs.push({ icon: '🏠', title: 'Reschedule outdoor work', detail: 'Consider postponing non-essential outdoor tasks.' });
      recs.push({ icon: '⏱️', title: '15-min max exposure', detail: 'Limit unshaded exposure. Rotate crews to shade frequently.' });
      recs.push({ icon: '💧', title: 'Emergency hydration plan', detail: 'Pre-hydrate crew. Station water every 50m on site.' });
    }
    return recs;
  }

  /* ── Hourly chart ── */
  function renderHourlyChart(hours, currentHour) {
    if (!hours || !hours.length) { hourChart.innerHTML = ''; return; }

    const W = Math.max(600, hours.length * 36);
    const H = 160;
    const padL = 36, padR = 12, padT = 16, padB = 36;
    const chartW = W - padL - padR;
    const chartH = H - padT - padB;
    const maxUV  = Math.max(...hours.map(h => h.uv || 0), MAX_UV * 0.5);

    function xPos(i) { return padL + (i / (hours.length - 1)) * chartW; }
    function yPos(v) { return padT + (1 - v / (maxUV * 1.1)) * chartH; }

    /* gradient fill points */
    const pts = hours.map((h, i) => `${xPos(i)},${yPos(h.uv || 0)}`).join(' ');
    const fillPts = `${padL},${padT + chartH} ` + pts + ` ${padL + chartW},${padT + chartH}`;

    /* line path */
    const linePath = hours.map((h, i) => {
      const x = xPos(i), y = yPos(h.uv || 0);
      return i === 0 ? `M${x},${y}` : `L${x},${y}`;
    }).join(' ');

    /* hour labels */
    const labelsHtml = hours.map((h, i) => {
      const hh = parseInt(h.t.split('T')[1].split(':')[0], 10);
      if (i % 3 !== 0) return '';
      const label = hh === 0 ? '12am' : hh < 12 ? `${hh}am` : hh === 12 ? '12pm' : `${hh - 12}pm`;
      return `<text x="${xPos(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${label}</text>`;
    }).join('');

    /* UV value labels on bars */
    const uvLabels = hours.map((h, i) => {
      if ((h.uv || 0) < 1) return '';
      return `<text x="${xPos(i)}" y="${yPos(h.uv || 0) - 5}" text-anchor="middle" font-size="9" fill="${uvCategory(h.uv || 0).color}">${(h.uv || 0).toFixed(1)}</text>`;
    }).join('');

    /* current time marker */
    let markerHtml = '';
    const curIdx = hours.findIndex(h => parseInt(h.t.split('T')[1].split(':')[0], 10) === currentHour);
    if (curIdx >= 0) {
      const mx = xPos(curIdx);
      markerHtml = `<line x1="${mx}" y1="${padT}" x2="${mx}" y2="${padT + chartH}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <circle cx="${mx}" cy="${yPos(hours[curIdx].uv || 0)}" r="5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>`;
    }

    hourChart.setAttribute('width', W);
    hourChart.setAttribute('height', H);
    hourChart.setAttribute('viewBox', `0 0 ${W} ${H}`);
    hourChart.innerHTML = `
      <defs>
        <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <polygon points="${fillPts}" fill="url(#chartGrad)"/>
      <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${uvLabels}
      ${markerHtml}
      ${labelsHtml}
      <text x="${padL - 4}" y="${padT}" text-anchor="end" font-size="9" fill="var(--muted)">${maxUV.toFixed(0)}</text>
      <text x="${padL - 4}" y="${padT + chartH}" text-anchor="end" font-size="9" fill="var(--muted)">0</text>
    `;
  }

  /* ── 3-day forecast ── */
  function renderForecast(daily) {
    if (!daily || !daily.time) { forecastGrid.innerHTML = ''; return; }
    const days    = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const months  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    forecastGrid.innerHTML = daily.time.map((t, i) => {
      const d    = new Date(t + 'T12:00:00');
      const uv   = daily.uv_index_max[i] || 0;
      const cat  = uvCategory(uv);
      const label = i === 0 ? 'Today' : days[d.getDay()];
      return `
        <div class="forecast-day">
          <div class="day-name">${label}<br><span style="font-size:0.7rem;color:var(--muted)">${months[d.getMonth()]} ${d.getDate()}</span></div>
          <div class="day-uv" style="color:${cat.color}">${uv.toFixed(1)}</div>
          <div class="day-level" style="color:${cat.color}">${cat.label}</div>
        </div>`;
    }).join('');
  }

  /* ── Threshold / alert ── */
  threshRange.addEventListener('input', () => {
    currentThresh = parseInt(threshRange.value, 10);
    threshVal.textContent = currentThresh;
    updateAlertStatus();
  });

  function updateAlertStatus() {
    if (currentUV === null) { alertStatus.className = 'alert-status'; return; }
    if (currentUV >= currentThresh) {
      alertStatus.className = 'alert-status triggered';
      alertStatus.textContent = `⚠️ UV ${currentUV.toFixed(1)} exceeds threshold of ${currentThresh} — Take action now!`;
      logAlert(currentUV, currentThresh);
    } else {
      alertStatus.className = 'alert-status safe';
      alertStatus.textContent = `✅ UV ${currentUV.toFixed(1)} is below threshold of ${currentThresh} — Conditions acceptable.`;
    }
  }

  /* ── Alert log ── */
  function logAlert(uv, thresh) {
    const entry = {
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      date: new Date().toLocaleDateString([], { month: 'short', day: 'numeric' }),
      uv: uv.toFixed(1),
      thresh,
      loc: locationName.textContent
    };
    /* deduplicate: don't add if same uv+loc in last 5 min */
    const last = alertLog[0];
    if (!last || last.uv !== entry.uv || last.loc !== entry.loc) {
      alertLog.unshift(entry);
      if (alertLog.length > 50) alertLog.pop();
      localStorage.setItem('uv-alert-log', JSON.stringify(alertLog));
      renderLog();
    }
  }

  function renderLog() {
    if (!alertLog.length) {
      alertLogEl.innerHTML = `<li class="log-empty">No alerts recorded yet. Alerts appear when UV exceeds your threshold.</li>`;
      return;
    }
    alertLogEl.innerHTML = alertLog.map(e => {
      const cat = uvCategory(parseFloat(e.uv));
      return `<li class="log-item">
        <span class="log-dot" style="background:${cat.color}"></span>
        <span style="color:var(--muted);white-space:nowrap">${e.date} ${e.time}</span>
        <span style="flex:1;color:var(--text)">${e.loc}</span>
        <span style="font-weight:700;color:${cat.color}">UV ${e.uv}</span>
        <span style="color:var(--muted);font-size:0.75rem">≥${e.thresh}</span>
      </li>`;
    }).join('');
  }

  clearLogBtn.addEventListener('click', () => {
    alertLog = [];
    localStorage.removeItem('uv-alert-log');
    renderLog();
  });

  /* ── Skin type ── */
  document.querySelectorAll('.skin-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.skin-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      skinType = parseInt(btn.dataset.skin, 10);
      if (currentUV !== null) {
        /* re-render recommendations and exposure times */
        const recs = buildRecs(currentUV, skinType);
        recList.innerHTML = recs.map(r =>
          `<div class="rec-item"><span class="rec-icon">${r.icon}</span><div class="rec-text"><strong>${r.title}</strong><br><span>${r.detail}</span></div></div>`
        ).join('');
        const baseMin    = safeMinutes(currentUV, skinType);
        const spfMult    = [1, 2, 5];
        const spfLabels  = ['No SPF', 'SPF 15', 'SPF 30'];
        exposureGrid.innerHTML = spfMult.map((m, i) => {
          const mins = baseMin ? Math.round(baseMin * m) : null;
          const display = mins ? (mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`) : 'N/A';
          return `<div class="exposure-item"><div class="time">${display}</div><div class="type">${spfLabels[i]}</div></div>`;
        }).join('');
      }
    });
  });

  /* ── Init: render empty log ── */
  renderLog();

})();
</script>

</body>
</html>
